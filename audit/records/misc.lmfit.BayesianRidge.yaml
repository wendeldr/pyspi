unit_id: misc.lmfit.BayesianRidge
status: profiled
correctness:
  metric_name_standard: in-sample mean squared error of the posterior-mean fit of Bayesian ridge regression (evidence / type-II maximum-likelihood estimates of noise
    precision alpha and weight precision lambda, Gamma(1e-6, 1e-6) hyperpriors) of y = x_j on x = x_i
  canonical_ref: MacKay 1992, Neural Computation 4(3):415-447 ("Bayesian interpolation"), evidence fixed-point updates gamma = sum alpha e/(lambda + alpha e), lambda
    = gamma/||w||^2, alpha = (N - gamma)/SSE (section 4); Tipping 2001, J. Mach. Learn. Res. 1:211-244 (Gamma hyperpriors, eqs. for the updates with a, b terms);
    both cited in sklearn/linear_model/_bayes.py:154-160
  canonical_definition: w = (X^T X + (lambda/alpha) I)^-1 X^T y with (alpha, lambda) at the fixed point of gamma = alpha*e/(lambda + alpha*e), lambda = (gamma + 2
    l1)/(w^2 + 2 l2), alpha = (T - gamma + 2 a1)/(SSE + 2 a2), e = sum(xc^2); MSE = (1/T) sum (y - b - w x)^2
  documented_definition: 'supplement §1.6.1, p.18 (supplement.txt lines 856-868; the briefing pack gives 874-887, which is off by 18 lines): "we use a number of linear
    models and record the mean squared error (MSE) of a regression of y on x. The following models (with the default parameters) from scikit-learn [2] are included:
    stochastic gradient descent regression with a squared loss (ordinary least squares fit) function (denoted by modifier SGDRegressor); Ridge regression, which uses l2-norm regularization
    (Ride); the Elastic-Net model [76, 77], which uses both l1 and l2-norm regularization (ElasticNet); and the Bayesian Ridge regressor uses a gamma distribution
    prior (with lambda1 = lambda2 = 1e-6) for the l2-norm regularizor in Ridge regression (BayesianRidge). This yields four SPIs: 215. lmfit_SGDRegressor 216. lmfit_Ridge
    217. lmfit_ElasticNet 218. lmfit_BayesianRidge"; keywords "directed, linear, unsigned, bivariate, contemporaneous"; rationale "Linear regression is commonly used
    for establishing independence through model fits (e.g., see additive noise models in Sec. 1.3.1)". GitBook spi-descriptions/miscellaneous.md "Linear Model Fit"
    repeats the text verbatim (including the typo "Ride") and lists the same four identifiers.'
  delegate_lib: scikit-learn==1.9.1 sklearn.linear_model.BayesianRidge().fit (no random_state parameter, so the else branch at misc.py:124 is taken) with scipy==1.17.1
    linalg.svd; sklearn.metrics.mean_squared_error; numpy==2.5.4
  implemented_as: 'A[i, j] = in-sample MSE of BayesianRidge(max_iter=300, tol=1e-3, alpha_1=alpha_2=lambda_1=lambda_2=1e-6, alpha_init=None -> 1/(var0(y)+eps), lambda_init=None
    -> 1, fit_intercept=True) fitted to z_j on z_i. Iteration stops when |w_old - w| < 1e-3 (sum of absolute coefficient change), then coef_ is recomputed once at
    the final (alpha, lambda). Effective ridge penalty lambda/alpha is data dependent (probe bivariate_gaussian_T256 pair (2,3): n_iter_ 3, alpha_ 3.07, lambda_ 1.49,
    lambda/alpha 0.484 vs Ridge''s fixed 1). A from-scratch numpy implementation of the same recursion agrees to <= 2.2e-16 on six datasets x four T. For identical
    series alpha -> very large and the MSE ~ 1e-19..1e-26 (probe shared_envelope).'
  implementation_trace:
  - 'pyspi/config.yaml:1264-1278 .statistics.misc LinearModel: labels directed/linear/unsigned/bivariate/contemporaneous; configs model: Ridge, Lasso, SGDRegressor,
    ElasticNet, BayesianRidge (Lasso is the fifth, undocumented config)'
  - 'pyspi/calculator.py:230-267 Calculator._load_yaml (HEAD a1f20c7): for params in configs (252): spi = getattr(module, fcn)(**params) (256), i.e. LinearModel(model=...);
    self._spis[spi.identifier] = spi (257); the class attribute labels (misc.py:109) are what the calculator reports'
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False) (187), then scipy.stats.zscore(axis=1, nan_policy="omit",
    ddof=1) if normalise=True (default) (195); stored as (M, T, 1)'
  - 'pyspi/calculator.py:329-339 Calculator.compute (HEAD a1f20c7): S = self._spis[spi].multivariate(self.dataset) (329); np.fill_diagonal(S, np.nan) (332); any exception
    -> self._table[spi] = np.nan (336-337), so one failing pair makes the whole matrix NaN'
  - 'pyspi/base.py:84-94 Directed.multivariate: for j (outer), for i != j (inner): A[i, j] = self.bivariate(data, i=i, j=j); no mirroring'
  - 'pyspi/base.py:27-49 parse_bivariate: Data passed through unchanged (two raw arrays would be wrapped into a new z-scored Data with i, j = 0, 1)'
  - 'pyspi/data.py:108-118 Data.to_numpy(): returns the (M, T, 1) array, so z[i] is a (T, 1) design matrix with one feature'
  - pyspi/statistics/misc.py:106-109 class LinearModel(Directed, Unsigned); labels ["misc", "unsigned", "unordered", "normal", "linear", "directed"]
  - 'pyspi/statistics/misc.py:111-113 __init__: identifier "lmfit_<model>", self._model = getattr(sklearn.linear_model, model)'
  - 'pyspi/statistics/misc.py:117-124 bivariate: z = data.to_numpy(); warnings suppressed; if "random_state" in inspect.signature(model).parameters: model(random_state=42).fit(z[i],
    ravel(z[j])) else model().fit(z[i], ravel(z[j])) -> predictor = process i, target = process j'
  - pyspi/statistics/misc.py:125-126 y_predict = mdl.predict(z[i]); return mean_squared_error(y_predict, ravel(z[j])) -> in-sample (training) MSE on the same T samples
    used for fitting (argument order swapped, harmless because MSE is symmetric)
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:26 class BayesianRidge; signature has no random_state (probe "BayesianRidge False"), defaults
    max_iter=300, tol=1e-3, alpha_1=alpha_2=lambda_1=lambda_2=1e-6
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:217-265 fit: y_var computed before centring; _preprocess_data(fit_intercept=True, rescale_with_sw=True)
    (257-265)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:188-199 _preprocess_data(fit_intercept=True): X -= mean(X), y -= mean(y) (both already ~1e-17
    after z-scoring)'
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:270-282 initialisation alpha_ = 1/(y_var + eps), lambda_ = 1
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:293-305 XT_y = X^T y; linalg.svd(X); eigen_vals_ = S^2
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:309-341 evidence loop: _update_coef_ (312-314); gamma_, lambda_, alpha_ MacKay/Tipping updates
    (330-332); stop when iter_ != 0 and sum|coef_old_ - coef_| < tol (335)'
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:343-349 final coef_ recomputed with the last (alpha_, lambda_)
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:405-425 _update_coef_: coef_ = Vh^T diag(1/(e + lambda/alpha)) Vh X^T y (n_samples > n_features
    branch); sse_ = sum((y - X coef_)^2)'
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:370 _set_intercept
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_bayes.py:374-403 BayesianRidge.predict -> self._decision_function (396; _base.py:291-299): X @ coef_ + intercept_'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:318-334 _set_intercept: intercept_ = y_offset - X_offset @ coef_ (unpenalised intercept)'
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/_regression.py:524-600 mean_squared_error: _average((y_true - y_pred) ** 2, axis=0) (586-588), divisor T'
  deviation_from_documented: '(a) The documentation mentions only the weight-precision hyperprior "(with lambda1 = lambda2 = 1e-6)"; the noise-precision prior alpha_1
    = alpha_2 = 1e-6 and the evidence (type-II ML) estimation of both precisions are not described, so readers cannot tell that the effective penalty is data dependent
    (lambda/alpha ~ 0.48 in the probe, versus Ridge''s fixed 1). (b) "directed": symmetric on z-scored data. (c) In-sample MSE and "lower = stronger" not stated.'
  deviation_from_canonical: 'none for the estimator: sklearn implements the MacKay 1992 fixed-point updates with Tipping 2001 Gamma hyperpriors (shape/rate 1e-6)
    on centred data with an unpenalised intercept. The stopping rule (sum|delta w| < 1e-3) is loose, so the returned (alpha, lambda) are a near fixed point; check
    stage: the MSE differs from the MSE at the evidence maximiser by up to 8.5e-4 at T=64 and 1.0e-5 at T=4096 (misc.lmfit.BayesianRidge|*|pipeline|evidence), and
    the stop makes the SPI non-monotone in |r| by up to 1.4e-5. The SPI (in-sample MSE of the posterior mean) is a pyspi construction; on z-scored data it is a function
    of (r, T) only.'
  units_and_range: 'units of the target variance; on z-scored data in (0, (T-1)/T]: about 1e-19..1e-26 for identical series (probe shared_envelope), close to the
    OLS value (T-1)/T (1 - r^2) for strong dependence and approaching (T-1)/T for r ~ 0 (lambda grows as w -> 0); symmetric (<= 7.8e-16) under default preprocessing;
    asymmetric with normalise=False; unsigned, >= 0.'
  direction_convention: 'A[i, j] = in-sample MSE of the linear prediction of process j (target, column) from process i (predictor, row), per misc.py:122-126; LOWER
    = j better linearly predicted from i. Code-derived; with the default z-scoring the matrix is symmetric (see units_and_range), so the direction is only empirically
    identifiable with normalise=False, where column j scales with var(x_j) (probe on scaled_offset_T1024: column means of A track std_j^2 = 0.0395, 4.058, 24.78,
    97.89).'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (direction label is nominal under default preprocessing): after ddof=1 z-scoring every process has sum x^2 = T-1 and mean ~0, so the fit and its in-sample
    MSE are functions of (r_ij, T) only and A is symmetric; probe max |A - A.T| = 7.8e-16 across 24 dataset/T combinations although the class is Directed (misc.py:106)
    and labelled "directed". Asymmetry appears only with normalise=False, where A[i, j] is in units of var(x_j).'
  - 'Candidate (near-redundant with r^2): because the fit depends only on (sum x^2, sum xy, sum y^2) = (T-1, r(T-1), T-1) after z-scoring, lmfit_BayesianRidge is
    a deterministic function of (r, T); probe1.py shows it within the band between the Ridge and OLS values (e.g. bivariate_gaussian_T256 range [0.3245, 0.9961] vs
    Ridge [0.3245, 0.9958]); monotonicity in |r| is a hypothesis to test.'
  - 'Candidate (partial documentation of the prior): supplement mentions lambda1 = lambda2 = 1e-6 but not alpha_1 = alpha_2 = 1e-6 or the evidence maximisation; the
    effective penalty lambda_/alpha_ = 0.484 on bivariate_gaussian_T256 pair (2,3) (probe2.py "BR 3 [0.8196] 3.0697 1.4860 0.4841").'
  - 'Candidate (documented rationale vs quantity): the supplement motivates lmfit by independence testing "through model fits (e.g., see additive noise models)",
    but the SPI is the raw in-sample MSE of a contemporaneous linear fit, which measures linear predictability (a transform of r^2 for the closed-form models), not
    residual independence; no residual-independence test is computed (misc.py:125-126).'
