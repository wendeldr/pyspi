optimisation:
  complexity_P_T: 'O(P^2 T) for the arithmetic, but a T-independent per-call overhead dominates: one sklearn BayesianRidge fit + predict + mean_squared_error per ordered pair (pyspi/statistics/misc.py:115-126, inspect.signature per pair at line 120). Measured P_exponent 2.06, T_exponent 0.01. Pair term dominates; measured 12.0 s per window at 118x1024 (family-warm, measured).'
  hotspot_1: sklearn/utils/validation.py:check_array (third-party:sklearn) 39.4% of the profiled SPI call at 8x1024 (input validation incl. narwhals dataframe detection and finite checks); the evidence iterations _update_coef_ are 5.2% inside _bayes.py:fit 48.1%
  hotspot_2: 'sklearn/metrics/_regression.py:mean_squared_error (third-party:sklearn) 18.7% of the profiled SPI call at 8x1024; inspect.signature (Python stdlib) 11.2% in all, of which 5.8% is called per pair from pyspi/statistics/misc.py:bivariate (line 120), 3.5% sits inside sklearn base._validate_params (get_params -> _get_param_names) and 1.9% inside the validate_params wrapper of mean_squared_error'
  hotspot_owner: third-party:sklearn
  opaque_share: 0.199
  profile_file: audit/profiles/misc.lmfit.BayesianRidge__8x1024.pstats
  opportunities:
  - opportunity_id: lmfit-3
    opportunity: BayesianRidge with one regressor as a vectorised evidence recursion over all ordered pairs (alpha/lambda updates on arrays from the Gram-matrix moments, per-pair stopping mask with sklearn's sum|delta w| < 1e-3 rule and the final coefficient recomputation).
