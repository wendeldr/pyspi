unit_id: infotheory.phi.Geo_norm-0
status: profiled
correctness:
  metric_name_standard: geometric integrated information Phi_G (Gaussian AR(1) model), unnormalised, nats
  canonical_ref: 'Oizumi M, Tsuchiya N, Amari S (2016) ''Unified framework for information integration based on information geometry'',
    PNAS 113:14817 (supplement [55]); arXiv:1510.04455 v1: Eq. 8 constraint q(Y[P_i]|X) = q(Y[P_i]|X[P_i]), Eq. 9 Phi_G = min_{q in
    M_G} D_KL(p||q), Gaussian AR model Eqs. 15-17 (A''_ij = 0, i != j), stationarity Eqs. 18-20, Phi_G = 1/2 log |Sigma(E)''|/|Sigma(E)|
    Eq. 21, 0 <= Phi_G <= I(X;Y) (Discussion); augmented-Lagrangian solver from PhiToolbox (Kitazono & Oizumi, supplement [52]).'
  canonical_definition: Phi_G = min over disconnected models Y = A'X + E' with A' block-diagonal w.r.t. the partition (and q(X) = p(X))
    of D_KL(p(X,Y)||q(X,Y)) = min_{A' blockdiag} 1/2 log |Sigma_E + (A-A') Sigma_X (A-A')'| / |Sigma_E|, A = Sigma_YX Sigma_X^-1, Sigma_E
    = Sigma_Y - Sigma_YX Sigma_X^-1 Sigma_XY; global minimum over A' (Eq. 9 is a min). Bounds 0 <= Phi_G <= I(X;Y) and Phi_G <= SI(X;Y).
  documented_definition: 'supplement §1.4.10, p.12 (supplement.txt lines 550-562; keywords line 551 ''undirected, nonlinear, unsigned,
    bivariate, time-dependent''): ''We implement two proxy measures for IIT 2.0 [51] from the PhiToolbox [52]''; ''Phi_G is a measure
    of integrated information derived from information geometry [55]. It is an undirected measure that quantifies the divergence between
    the actual probability distribution of a system and an approximated probability distribution where influences among elements are
    statistically disconnected. Here we implement the Gaussian-distribution model [53].'' ''Both measures are optionally normalized
    (divided) by entropy (denoted by the modifier norm)'' (supplement §1.4.10, p.12, line 564). GitBook information-theory.md lines
    111-133 repeat the same text. Identifier phi_Geo_t-1_norm-0.'
  delegate_lib: 'pyspi (pyspi/lib/phi_native.py, native port of PhiToolbox phi_G_Gauss.m / phi_G_Gauss_AL.m) + numpy linalg; scipy==1.17.1
    scipy.linalg.solve/inv; executed: phi_native.phi_comp -> phi_g_gauss -> phi_g_gauss_al'
  implemented_as: Calculator default z-scores each channel (ddof=1). For pair (i,j), rows [i,j] form a 2xT array; tau = delay = 1; past
    window X1 = x[:, 0:T-1], present X2 = x[:, 1:T], each centred by its own mean, covariances with denominator T-2 (Cov_X, Cov_Y, Cov_XY
    = E[X(t-1)X(t)']); partition [1,2] (each channel its own part; the only bipartition, so no MIP search). VAR(1) parameters A = Cov_YX
    Cov_X^-1, Sigma_E = Cov_Y - Cov_YX Cov_X^-1 Cov_XY; Phi_G = 1/2 log|Sigma_E'|/|Sigma_E| with Sigma_E' = Sigma_E + (A-A_p) Cov_X
    (A-A_p)' minimised over diagonal A_p by an augmented Lagrangian (mu=2, alpha=0.9, gamma=1.01) that stops when the per-iteration
    change of logdet(Sigma_E') is below 1e-10 (maxiter 1e5); eigenvalues of Sigma_E' clamped at 1e-12. Any exception inside bivariate
    returns NaN (logged).
  implementation_trace:
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend); defaults normalise=True,
    detrend=False (calculator.py:48-50)
  - pyspi/data.py:184-195 optional scipy.signal.detrend, then scipy.stats.zscore(data, axis=1, nan_policy='omit', ddof=1)
  - pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset)
  - 'pyspi/base.py:132-138 Undirected.multivariate -> Directed.multivariate (base.py:85-94: every ordered pair i != j calls bivariate)
    then A[li] = A.T[li] copies the upper triangle (bivariate(i,j), i<j) into the lower'
  - pyspi/base.py:27-47 parse_bivariate (two raw arrays are wrapped by Data.add_process; see open questions on preprocessing of that
    path)
  - pyspi/statistics/infotheory.py:537-547 IntegratedInformation(Undirected, Unsigned); labels ['linear','unsigned','infotheory','temporal','undirected'];
    identifier phi_{phitype}_t-{delay}_norm-{normalization}
  - 'pyspi/statistics/infotheory.py:549-573 bivariate: P = np.array([1, 2]) (atomic bipartition), X = data.to_numpy(squeeze=True)[[i,
    j]], params {''tau'': delay}, options {type_of_phi, type_of_dist ''Gauss'', normalization}; phi_comp(X, P, params, options); any
    exception -> logging.error and np.nan'
  - 'pyspi/lib/phi_native.py:394-433/443 phi_comp: cov_comp(X, tau, isjoint=True) then phi_star_gauss or phi_g_gauss'
  - 'pyspi/lib/phi_native.py:46-77 cov_comp: X1 = X[:, :T-tau], X2 = X[:, tau:], each centred by its own mean; Cov_X = X1 X1''/(T-tau-1),
    Cov_Y = X2 X2''/(T-tau-1), Cov_XY = X1 X2''/(T-tau-1) (= E[X(t-tau) X(t)''])'
  - 'pyspi/lib/phi_native.py:21-43 logdet: Cholesky 2*sum(log(diag L)); on LinAlgError np.linalg.eigvals, keeps eigenvalues > 1e-12,
    returns sum(log) (complex dtype); -inf if none kept'
  - pyspi/lib/phi_native.py:104-115 h_gauss = 0.5*logdet(C) + 0.5*n*log(2*pi*e) (nats)
  - 'pyspi/lib/phi_native.py:357-391 phi_g_gauss: A = solve(Cov_X, Cov_XY)'' (= Cov_YX Cov_X^-1), Cov_E = Cov_Y - Cov_XY'' Cov_X^-1
    Cov_XY; method None -> K = 2 <= 3 -> ''AL'''
  - 'pyspi/lib/phi_native.py:249-289 phi_g_gauss_al setup: mu=2, alpha=0.9, gamma=1.01, maxiter=100000, error=1e-10; A_p initialised
    to blockdiag(A); B = A_p; Lambda = 0; eigh(Cov_X)'
  - 'pyspi/lib/phi_native.py:291-313 loop: Cov_E_p = Cov_E + (A-A_p) Cov_X (A-A_p)''; eigh(Cov_E_p); eigenvalues clamped at 1e-12 (line
    303, not in the MATLAB phi_G_Gauss_AL.m, vendored or upstream); closed-form A_p update in the joint eigenbasis'
  - pyspi/lib/phi_native.py:319-332 B = A_p with cross-part blocks halved (constraint A_p = B <=> cross blocks zero), Lambda -= mu (A_p
    - B), mu *= 1.01 when the constraint violation shrinks by less than 10%
  - pyspi/lib/phi_native.py:334-337 stop when |logdet(Cov_E_p) - logdet(Cov_E_p_prev)| < 1e-10 (objective change only; no constraint
    or stationarity test)
  - 'pyspi/lib/phi_native.py:340-354 phi_G = (logdet(Cov_E_p) - logdet(Cov_E))/2; normalization==1: divide by (N_c-1)*min_k h_gauss(Cov_X[M_k,
    M_k])'
  - 'MATLAB/Octave, pyspi vendored PhiToolbox copy (see note at end of entry) (git show 76ab2bb^:pyspi/lib/PhiToolbox/Phi/phi_G_Gauss.m:36-60;
    Phi/phi_G_Gauss_AL.m:37-119; utility/Gauss/logdet.m:1-9): same constants, same update (phi_G_Gauss_AL.m:78-79) without the eigenvalue
    clamp, same stopping rule (97-100). Provenance: pyspi''s vendored PhiToolbox copy (git show 76ab2bb^:pyspi/lib/PhiToolbox; Phi/phi_star_Gauss.m
    there calls fminunc(fh, beta, Options) at line 108 where upstream oizumi-lab/PhiToolbox master calls minFunc(@I_s_I_s_d, beta, Options);
    phi_G_Gauss.m, phi_G_Gauss_AL.m and utility/Gauss/logdet.m are identical to upstream master apart from whitespace (diff -w against
    raw.githubusercontent.com/oizumi-lab/PhiToolbox/master, fetched 2026-10-14))'
  deviation_from_documented: 'Supplement keyword ''nonlinear'' (and config.yaml label) contradicts the Gaussian/linear implementation
    and the class label ''linear''. Otherwise the prose matches (undirected; Gaussian model; PhiToolbox algorithm). Beyond the prose:
    same AL algorithm as PhiToolbox plus an eigenvalue clamp (phi_native.py:303) absent in phi_G_Gauss_AL.m.'
  deviation_from_canonical: 'Model matches the PNAS Gaussian formulation (constraint on A'', Eq. 17; Phi_G from Eq. 21). Deviations:
    (1) the AL stopping rule tests only the change of the objective, so the iterate can stop at a non-stationary point in flat directions:
    probe delayed_noise T64 pair (0,1) returned 2.3439385 while direct minimisation reaches 2.3406849 (gap 3.25e-3, 0.14%; Eq. 19 residual
    8.2e-3; mu had grown to 1.35e6 after 2681 iterations); Octave running pyspi''s vendored PhiToolbox copy (phi_G files identical to
    upstream) returns the same 2.34393854875, so this is inherited from PhiToolbox. Other probe cases agree with the global minimum
    to <= 1e-8 except delayed_noise T1024 (0,1) gap 2.0e-5 and narrowband T64 (0,2) gap 4.0e-6. (2) the eigenvalue clamp at 1e-12 alters
    results only for near-singular Sigma_E''. (3) degenerate covariances: a singular conditional covariance gives finite values via
    the logdet fallback instead of +inf (exact one-step delay pair); an exactly singular Cov_X (bit-identical copy, T <= 1024) gives
    NaN with a UserWarning (solve raises LinAlgError, phi_native.py:374-378); a numerically ill-conditioned Cov_X (same copy at T=4096)
    gives a finite negative value -0.3466 with LinAlgWarning, violating Phi_G >= 0. Plug-in sample covariances with separate past/present
    means and T-2 denominators (the denominator cancels in the unnormalised value). Check-stage correction: the trace statement that
    other cases agree with the global minimum to ~1e-8 does not hold at T = 4096 on weakly coupled pairs, where the AL stops before
    the constraint is met and UNDER-estimates Phi_G (cointegrated -3.46e-4, relative ~1.0; bivariate_gaussian -4.6e-6; iid_gaussian
    -2.7e-6; off-diagonal |A_p| up to 9.8e-4), and the non-optimal stop reaches 1.107 nats on shared_envelope (0,1) at T64; both reproduced
    by Octave on PhiToolbox. On the exact-delay construction the check runs give small NEGATIVE values (z-scored -0.00062, raw -0.0200
    at delayed_noise T1024).'
  units_and_range: 'nats; 0 <= Phi_G <= min(I, SI) in theory, positive finite-sample bias; invariant to per-channel affine rescaling;
    symmetric; NaN when an exception occurs (e.g. constant channel); degenerate pairs never give inf: an exactly predictable pair gives
    finite or complex-typed values, a bit-identical copy gives NaN at T <= 1024 and, at T=4096, NaN (star, TypeError caught) or a finite
    negative value -0.3466 (Geo). Check stage: exactly predictable pairs can also return small negative values (exact-delay construction,
    delayed_noise T1024).'
  direction_convention: 'Undirected: A[i,j] = A[j,i] = value of bivariate(min(i,j), max(i,j)) on rows [i, j] with partition [1, 2] (base.py:136-137
    mirrors the upper triangle; the lower-triangle bivariate calls are computed and discarded). The quantity is symmetric under swapping
    the parts; computing the pair in the other row order differs only by optimiser tolerance. Probe on the Calculator/Data path (both
    rows z-scored, phi_comp on rows [0,1] vs [1,0], gauss_ar1_pair T4096): star 0.031018450195045 vs 0.031018450195543 (diff -5.0e-13),
    Geo 0.08925335492965669 in both orders (bit-identical). The larger gaps seen earlier (star 7.0e-13, Geo 1.3e-9) came from the raw-array
    call spi.bivariate(x0, x1) vs (x1, x0), where parse_bivariate z-scores only the first array (data.py:219-238), so they are not the
    Calculator-path numbers. Off-diagonal entries of the returned matrix are bitwise equal (var2_chain T1024: np.array_equal(A[off],
    A.T[off]) True); np.array_equal(A, A.T) is False only because the diagonal is NaN, and np.array_equal(A, A.T, equal_nan=True) is
    True.'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (optimiser accuracy): the AL solver can stop at a non-stationary feasible point because its only stopping test is |delta
    logdet| < 1e-10 while mu grows geometrically; Phi_G is then over-estimated. Evidence: probe3/probe4 delayed_noise T64 pair (0,1):
    pyspi 2.3439385490, Octave on the vendored copy 2.34393854875, direct minimisation (Nelder-Mead and BFGS agree) 2.3406848862 at
    a = [-3.4126, 0.0224] vs AL a = [-2.6183, 0.0286]; gradient at the AL point [8.2e-3, 8.3e-5], Hessian eigenvalues [0.0101, 9.008]
    (flat valley); constraint violation 5.6e-33, 2681 iterations, final mu 1.35e6.'
  - 'Candidate (hypothesis check, confirmed but minor): the 1e-12 eigenvalue clamp (phi_native.py:303) is absent in phi_G_Gauss_AL.m:76-79;
    since Sigma_E'' >= Sigma_E it is active only when Sigma_E is numerically singular (probe delayed_noise T64 pair (0,1): smallest
    eigenvalue of Sigma_E 0.00832, smallest eigenvalue of the iterate Sigma_E'' over all 2681 AL iterations 0.00936 (probe3 tracks this
    minimum across the loop), final Sigma_E'' 0.1009, so the clamp never acted; no difference vs Octave beyond 1e-10 in the three compared
    cases).'
  - 'Candidate (degenerate input handling): logdet''s eigenvalue fallback (phi_native.py:37-43) silently drops eigenvalues <= 1e-12,
    including negative ones, and returns a complex-dtype number; for a singular conditional covariance this replaces -inf by a finite
    value, so an exactly predictable pair can be reported as almost unintegrated. Evidence: probe6 exact one-step delay pair, eig(Cov_Y|X)
    = [-2.2e-16, 1.0015] on z-scored input -> Cholesky fails -> logdet 0.00153+0j -> phi* 0.000636+0j; the same series unnormalised
    has eigenvalue +2.2e-16 -> Cholesky succeeds -> phi* 18.03. The guards np.isinf(H_cond) / np.iscomplex(H_cond) (lines 169-175) never
    fire because the fallback filters zeros and np.iscomplex(x+0j) is False. MATLAB logdet.m used log(det(X)) (-inf or complex). Bit-identical
    copies (shared_envelope (0,2), rows still bit-identical after the Data z-score) do NOT go through the logdet fallback on the Calculator/Data
    path: at T = 64, 256 and 1024 scipy.linalg.inv(Cov_X) (phi_native.py:203, star) and scipy.linalg.solve(Cov_X, Cov_XY) (phi_native.py:374,
    Geo) raise LinAlgError and both return NaN with UserWarning ''Matrix inversion failed in phi_star computation'' / ''Singular covariance
    matrix in phi_G computation''. At T = 4096 the computed Cov_X is only ill-conditioned (LinAlgWarning, no exception): star then raises
    TypeError "''<'' not supported between instances of ''complex'' and ''float''" inside L-BFGS-B once a complex logdet reaches the
    objective, which bivariate''s except (infotheory.py:571-573) logs and turns into NaN, while Geo returns a finite NEGATIVE value
    -0.3465735902 (numerically -ln(2)/2), below the canonical lower bound 0. The finite values 0.0657 (phi*) and 0.2350 (phi_G) quoted
    earlier come only from the raw-array call spi.bivariate(x[0], x[2]) at T1024, where the second array is not z-scored (channels affinely
    related, not identical); that path gives other T-dependent finite/complex values (probe T256 star 0.2689+0j, T4096 star -0.0293+0j).
    Outcome therefore depends on T and on the call path.'
  - 'Candidate (documentation/labels): supplement §1.4.10 keywords and config.yaml:616-622 say ''nonlinear'', while the class labels
    say ''linear'' (infotheory.py:541) and the estimator is purely Gaussian/second-order (cov_comp); config labels are not used at runtime
    (calculator.py:253-259 instantiates the class, spi.labels is the class attribute). The supplement also says ''normalized (divided)
    by entropy'' without stating which entropy (code: min of the past marginal entropies).'
