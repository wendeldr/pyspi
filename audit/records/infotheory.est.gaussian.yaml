unit_id: infotheory.est.gaussian
status: profiled
correctness:
  metric_name_standard: Linear-Gaussian (plug-in maximum-likelihood covariance) estimator of differential entropy, mutual information and conditional mutual information / transfer entropy
  canonical_ref: Cover T.M. & Thomas J.A. 2006, Elements of Information Theory, 2nd ed., Wiley, Theorem 8.4.1 (h(N_n(mu,K)) = 0.5 log((2 pi e)^n |K|)) and Example 8.5.1 (I = -0.5 log(1-rho^2)); Barnett,
    Barrett & Seth 2009, Phys Rev Lett 103:238701 (Gaussian TE = half Geweke GC)
  canonical_definition: h(X) = 0.5*(d*(1+ln 2pi) + ln det Sigma_X); I(X;Y) = 0.5*ln(det Sigma_X det Sigma_Y / det Sigma_XY); I(X;Y|Z) = 0.5*ln(det Sigma_XZ det Sigma_YZ / (det Sigma_XYZ det Sigma_Z)), all
    in nats with Sigma the (sample) covariance
  documented_definition: 'supplement §1.4, p.9 (supplement.txt:405-415): ''The Gaussian-distribution model (denoted by modifier gaussian) assumes a linear-Gaussian multivariate, where the measure is derived
    from the cross-covariance matrix''; the supplement says JIDT ''v1.5'' while GitBook information-theory.md:11-13 says ''v1.6.1''. Units (nats) and covariance normalisation are not documented.'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian leaf classes MutualInfoCalculatorMultiVariateGaussian, ConditionalMutualInfoCalculatorMultiVariateGaussian, TransferEntropyCalculatorGaussian
    and ActiveInfoStorageCalculatorGaussian, plus MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution, are byte-identical; their parents MutualInfoMultiVariateCommon, ConditionalMutualInfoMultiVariateCommon,
    TransferEntropyCalculatorViaCondMutualInfo and ActiveInfoStorageCalculatorViaMutualInfo differ only in observation-ID/noise-seed bookkeeping; EntropyCalculatorMultiVariateGaussian changed substantially
    (128 diff lines) because it was refactored onto the new EntropyCalculatorMultiVariateCommon (its own setObservations/initialise()/setProperty/getProperty/setDebug removed, finaliseAddObservations added
    in place of setObservations, isComputed caching of lastAverage added), while its value path covarianceMatrix -> CholeskyDecomposition -> 0.5*(d*(1+ln 2pi)+ln det) is unchanged) via JPype1==1.7.1 on
    OpenJDK 21; gaussian.EntropyCalculatorMultiVariateGaussian, gaussian.MutualInfoCalculatorMultiVariateGaussian, gaussian.TransferEntropyCalculatorGaussian (CMI Gaussian underneath)
  implemented_as: 'Input is the pyspi Data array after optional detrend and default z-scoring with ddof=1. Entropies: sample covariance with divisor n-1 (JIDT MatrixUtils), Cholesky (non-PD -> Java NonPositiveDefiniteMatrixException
    propagated to Python), h = 0.5*(d(1+ln 2pi)+ln det) in nats; the jar''s entropy class reports NORMALISE=true but the Gaussian path never normalises. MI/CMI: covariance determinants with linearly redundant
    components pruned, NORMALISE=false, BIAS_CORRECTION=false (set by pyspi), returns 0 for fully redundant marginals and +Infinity for joint redundancy. Because pyspi z-scores with ddof=1 and JIDT also
    uses ddof=1, every univariate Gaussian entropy is exactly 0.5*(1+ln 2pi) = 1.4189385332 nats. pyspi caches univariate entropies in data.entropy[(estimator,)] and joint entropies in data.joint_entropy
    (infotheory.py:137-177).'
  implementation_trace:
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 fill_diagonal NaN; :336-339 any exception from any pair -> the whole SPI entry becomes NaN (:337) and the error is recorded, warning issued at :354-355
  - 'pyspi/data.py:184-195 preprocessing in Data.set_data: optional scipy.signal.detrend(axis=1), then (default normalise=True) scipy.stats.zscore(axis=1, ddof=1)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: _entropy_calc = _getcalc(''entropy'') (:36); identifier += ''_gaussian'' (:38); estimator ''gaussian'' -> labels += [''linear''], _dyn_corr_excl
    = None (:53-55)'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: every calculator gets setProperty(''BIAS_CORRECTION'',''false'') and setProperty(''NOISE_SEED'',''42''); no NORMALISE property is set'
  - 'pyspi/statistics/infotheory.py:103-134 _getcalc: ''gaussian'' (and any unrecognised estimator) falls to the else branches -> gaussian.EntropyCalculatorMultiVariateGaussian (:111-112), gaussian.MutualInfoCalculatorMultiVariateGaussian
    (:120-123), gaussian.TransferEntropyCalculatorGaussian (:129-130)'
  - 'pyspi/statistics/infotheory.py:137-156 _compute_entropy: x = data.to_numpy()[i] squeezed; initialise(1); setObservations(double[]); computeAverageLocalOfObservations; cached in data.entropy[key][i]
    with -inf as ''not computed'' sentinel'
  - 'pyspi/statistics/infotheory.py:159-177 _compute_joint_entropy: initialise(2); setObservations(np.concatenate([x, y], axis=1)); cached symmetric in data.joint_entropy[key]'
  - pyspi/statistics/infotheory.py:180-193 _compute_conditional_entropy(X, Y) = H(X,Y) - H(Y) using the same entropy calculator (H(X|Y))
  - 'pyspi/statistics/infotheory.py:195-220 _set_theiler_window: no-op for gaussian (_dyn_corr_excl None)'
  - 'https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/gaussian/EntropyCalculatorMultiVariateGaussian.java EntropyCalculatorMultiVariateGaussian
    (extends EntropyCalculatorMultiVariateCommon, :53-54): finaliseAddObservations :87-96 computes means and MatrixUtils.covarianceMatrix(observations, means); setCovariance :110-123 takes MatrixUtils.CholeskyDecomposition
    (throws on non-PD); computeAverageLocalOfObservations :162-175 returns 0.5*(d*(1+ln 2pi) + ln det(Sigma)) in nats'
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java :66 normalise = true by default, but
    finaliseAddObservations :178-212 only stacks observations and adds noise if addNoise (default false, :70); no normalisation is applied for the Gaussian estimator; NOISE_SEED handled :133-139 (no effect
    without addNoise)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] covarianceMatrix(double[][], double[]) :3426-3439 -> covarianceTwoColumns :3370-3377 divides by (n-1) (ddof=1);
    CholeskyDecomposition :4496-4498 (tol 10e-10 = 1e-9) / :4528-4560 throws NonPositiveDefiniteMatrixException when a pivot <= tol; determinantViaCholeskyResult :4673-4680
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/measures/continuous/gaussian/MutualInfoCalculatorMultiVariateGaussian.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] constructor :123-125 normalise = false; setProperty BIAS_CORRECTION
    :160-174; finaliseAddObservations :204-220 -> MatrixUtils.covarianceMatrix(source, dest) (ddof=1); setCovariance :269-329 Cholesky of source, dest (redundant components pruned) and joint (L=null on
    joint linear redundancy); computeAverageLocalOfObservations :384-424 returns 0.5*ln|detS*detD/detJoint| (0 if a marginal is fully redundant, +Infinity if L==null; bias correction :418-421 off because
    pyspi sets BIAS_CORRECTION=false)
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/MutualInfoMultiVariateCommon.java finaliseAddObservations :574-630 (timeDiff
    = 0 default, normalise only if flag true :622, which the Gaussian constructor turned off)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/measures/continuous/gaussian/ConditionalMutualInfoCalculatorMultiVariateGaussian.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] constructor :143-147 normalise = false; finaliseAddObservations
    :236-253 covariance of (var1=source past, var2=dest next, cond=dest past) with ddof=1; computeAverageLocalOfObservations :427-482 returns 0.5*ln(det(S_c1)*det(S_c2)/(det(S_all)*det(S_cc))) (0 if var1
    or var2 fully redundant given cond; +Infinity if L==null); no bias correction (pyspi BIAS_CORRECTION=false)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/ChiSquareMeasurementDistribution.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] :100-102 analytic null mean df/(2N) (used only inside auto-embedding, see TE auto unit)
  deviation_from_documented: 'none in substance (covariance-based linear-Gaussian model). Undocumented conventions: nats, ddof=1 covariance, z-scored input. The supplement''s JIDT version (v1.5) differs
    from GitBook (v1.6.1) and from the bundled jar, which is a post-1.6.1 build (candidate).'
  deviation_from_canonical: 'none for the formulas (probe: entropy of a 500-sample series matched 0.5*(1+ln 2pi)+0.5*ln var_ddof1 to 3e-16; all derived SPIs matched numpy determinant formulas to <=6e-14).
    Estimator is the plug-in ML form with n-1 covariance, no small-sample bias correction (the analytic chi-square correction is available in JIDT but switched off).'
  units_and_range: nats; entropies are differential (any real value, negative possible); MI/CMI >= 0 with +Infinity on exact joint linear redundancy; entropy-based quantities raise (-> NaN matrix in Calculator)
    on singular covariance
  direction_convention: n/a (estimator layer); argument order (source, dest) for MI/TE is set by the calling SPI
  symmetry_expected: n/a
  already_documented: REVIEW M8 (Gaussian joint/conditional entropy can be negative; ce is H(i,j)-H(i)); tests/README.md bug 1 (symbolic falls through to the Gaussian calculator); the raw-array parse_bivariate
    preprocessing asymmetry is recorded as a candidate in audit/records/basic.spearmanr.yaml
  new_finding_candidates:
  - 'CANDIDATE (provenance): the bundled infodynamics.jar is not a build of tag v1.6.1. Evidence: unzip lists infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.class, which is absent
    from the v1.6.1 source tree (GitHub tree API: 249 source classes, jar has those 249 + this one); upstream added it in commit 3d1f3fe (2024-04-20) and the jar entries are dated 2024-04-21, while pyspi/lib/jidt/version-1.6.1.txt
    says ''Version 1.6.1 22/08/2023''. JPype reflection: EntropyCalculatorMultiVariateGaussian superclass = EntropyCalculatorMultiVariateCommon. The v1.6.1...a9b6b3e diff touches only bookkeeping (observation
    IDs, NOISE_SEED) in the Gaussian MI/CMI/TE/AIS paths (leaf classes byte-identical), refactors EntropyCalculatorMultiVariateGaussian onto EntropyCalculatorMultiVariateCommon without changing its covariance/Cholesky/log-det
    value path, and probes agree with from-scratch formulas, so no value impact was found.'
  - 'CANDIDATE (convention, value-relevant): the hypothesis that NORMALISE defaults differ is CONFIRMED but has no effect on values: entropy calculator getProperty(''NORMALISE'') -> ''true'' (EntropyCalculatorMultiVariateCommon:66 at JIDT a9b6b3e; the class does not exist at v1.6.1),
    MI/TE calculators -> ''false'' (probe), yet the Gaussian entropy is never normalised (scaling a series by 10 raised H by exactly ln 10: 1.3288662 -> 3.6314513). With pyspi''s default z-scoring every
    univariate Gaussian entropy is the constant 1.4189385332 (probe: data.entropy = [1.41893853, 1.41893853] on var2_bivariate_T1024), so ce_gaussian = 1.4189 - mi_gaussian and je_gaussian = 2*1.4189 -
    mi_gaussian exactly.'
  - 'CANDIDATE (robustness): a single linearly redundant pair (e.g. duplicated channel) makes every entropy-based Gaussian SPI raise. Probe on shared_envelope_T256 rows 0 and 2 (bit-identical): je, ce,
    cce, di and si raise infodynamics.utils.NonPositiveDefiniteMatrixException; mi returns inf; gc_k1 returns 0.0; tlmi and xme_gaussian_k1 stay finite (check stage: xme_gaussian_k10 also raises on this
