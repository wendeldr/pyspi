optimisation:
  complexity_P_T: 'Per call O(T d^2 + d^3): JIDT Gaussian entropy / MI / CMI calculators form a ddof=1 covariance of the d observed columns and take Cholesky log-determinants (MatrixUtils.covarianceMatrix,
    CholeskyDecomposition). The SPIs call it P(P-1) or P(P-1)/2 times per window; at T <= 1024 the per-call JPype/JIDT overhead (0.13 ms for a 1-D MI call, ~1 ms for a 2-D JArray conversion of 1023 x 4,
    opp_it_gaussian-1.json components) exceeds the arithmetic, which is why the consumer units show T exponents 0.7-1.0.'
  hotspot_1: 'pyspi/statistics/infotheory.py:MutualInfo.bivariate (third-party:jidt via JPype, self time) 97.9% cum / 94.7% self of the profiled mi_gaussian call at 8x1024 (infrastructure unit: no profile
    of its own; mi.gaussian pstats)'
  hotspot_2: 'jpype/_jarray.py:JArray.__new__ (third-party:jpype) 2.5% of the same call. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is
    booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0264
  profile_file: audit/profiles/infotheory.mi.gaussian__8x1024.pstats (mi.gaussian; infrastructure unit)
  opportunities:
