    with NaN, not only the offending pair.'
  - 'CANDIDATE (documentation): pyspi sets NOISE_SEED=42 and BIAS_CORRECTION=false on every calculator (infotheory.py:90-91); for the Gaussian entropy calculator BIAS_CORRECTION is not a recognised property
