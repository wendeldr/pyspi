  - 'CANDIDATE (direction reversed vs documentation): as for dtf; p3_pipeline.py var2_bivariate dcoh [[nan, 0.1459], [0.3421, nan]] for x0 -> x1.'
  - 'CANDIDATE (cost): 3 Wilson runs per call (p6_misc.py ''wilson calls directed_coherence 3'').'
