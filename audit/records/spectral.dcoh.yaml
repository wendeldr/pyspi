unit_id: spectral.dcoh
status: profiled
correctness:
  metric_name_standard: Directed coherence (Baccala-Sameshima DC, a noise-variance-weighted DTF), band mean / band max, bivariate nonparametric estimate
  canonical_ref: 'Baccala LA, Sameshima K, Ballester G, Do Valle AC, Timo-Iaria C (1998) Studying the interaction between brain structures via directed coherence and Granger causality. Applied Signal Processing
    5:40-48, Eq. (21)-(24), p.43 (checked on the scanned asp.pdf linked from the GitBook: gamma_ij(f) = sigma_jj H_ij(f) / sqrt(S_i(f)), S_i(f) = sum_j sigma_jj^2 |H_ij(f)|^2, 0 <= |gamma_ij|^2 <= 1, sum_j
    |gamma_ij|^2 = 1; Remark 6: DTF is the case sigma_jj = 1)'
  canonical_definition: gamma_ij(f) = sigma_j H_ij(f) / sqrt( sum_k sigma_k^2 |H_ik(f)|^2 ) for diagonal innovation covariance (sigma_k^2 = innovation variance of source k); flow j -> i; |gamma_ij|^2 in
    [0, 1] with sum_j |gamma_ij|^2 = 1 (squared form sigma_j^2|H_ij|^2 / sum_k sigma_k^2 |H_ik|^2)
  documented_definition: 'supplement §1.5.10, p.16 (line 774): ''The directed coherence [71] is obtained from the inflow of x -> y using the spectral transfer matrix (as per DTF, Sec. 1.5.9), normalized
    by their noise covariance''; same text GitBook spectral.md:82. Band rule, supplement §1.5, p.12-13 (supplement.txt lines 570-599 in this checkout; the pack''s line numbers are offset by about 12-16):
    ''We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T'' and bands ''fmin-0_fmax-0-5: f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5:
    f in [fs/4, fs/2]'', summary = mean or max over the band. Directed measures ''are nonparametrically estimated through spectral matrix factorization [57, 58]'' (§1.5, p.12). Row/column meaning of the
    MPI: GitBook glossary-of-terms.md:27 ''The rows in this table reflect the sources while the columns reflect the targets''. Section keywords (supplement.txt:775): ''directed, linear, unsigned, bivariate, frequency-dependent''.'
  delegate_lib: spectral_connectivity==1.1.2 Connectivity.directed_coherence (numpy 2.5.4, scipy 1.17.1)
  implemented_as: 'Same per-pair multitaper + Wilson pipeline as dtf. Library formula (connectivity.py:800-805): sqrt(nv) * |H|^2 / _total_inflow(H, nv) with nv = diag(Sigma) broadcast along the ROW (target)
    axis by _get_noise_variance (shape (..., 1, n, 1)). The row noise variance cancels: value = sigma_i |H_ij|^2 / (sigma_i sqrt(sum_k |H_ik|^2)) = |H_ij|^2 / sqrt(sum_k |H_ik|^2) = |H_ij| * sqrt(DTF_ij).
    Kernel probe p2_kernel.py: library equals |H|^2/sqrt(sum|H|^2) to 1.8e-15 and differs from the canonical squared DC by up to 0.61; range observed up to 1.606 on the exact var2 spectrum. A[i, j] = nanmean/nanmax
    over fmin < f < fmax of that quantity at [0, 1].'
  implementation_trace:
  - pyspi/data.py:184-195 optional scipy detrend then zscore(axis=1, ddof=1) per process (Data default normalise=True, detrend=False)
  - pyspi/statistics/spectral.py:238-245 DirectedCoherence(NonparametricSpectralBivariate, Directed), _measure 'directed_coherence'
  - 'pyspi/calculator.py:325-339 Calculator.compute (HEAD a42ebc1): :329 S = self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :336-337 except Exception -> self._table[spi] = np.nan (whole SPI matrix NaN), error recorded :338-339'
  - 'pyspi/base.py:84-94 Directed.multivariate: for j, for i != j: A[i, j] = self.bivariate(data, i=i, j=j) (P(P-1) ordered pairs)'
  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fmax=None -> fs/2; statistic ''mean'' -> np.nanmean, ''max'' -> np.nanmax; identifier suffix _multitaper_<stat>_fs-1_fmin-.._fmax-..'
  - 'pyspi/statistics/spectral.py:106-126 NonparametricSpectralBivariate._get_cache: key (measure, i, j); z = data.to_numpy(squeeze=True)[[i, j]].T (column 0 = x_i, column 1 = x_j); m = sc.Multitaper(z,
    sampling_frequency=fs); conn = sc.Connectivity.from_multitaper(m); res = getattr(conn, measure)(); cached in data.spectral_bv'
  - 'pyspi/statistics/spectral.py:128-134 bivariate: freq_id = where((freq > fmin) * (freq < fmax)) (STRICT inequalities, unlike the multivariate path at :88 which uses >= / <=); returns statfn(res[0, freq_id,
    0, 1])'
  - pyspi/_spectral_compat.py:15-28 replaces the numpy namespace of spectral_connectivity.connectivity only (np.in1d shim); minimum_phase_decomposition.py keeps the real numpy
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-100 Multitaper defaults: time_halfbandwidth_product=3, detrend_type=''constant'', n_tapers=None, is_low_bias=True; :155-164
    n_tapers = floor(2*NW-1) = 5'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:167-178 single window = whole series; :181-185 n_fft = next_fast_len(T) (no zero padding; = T for T in {64,256,1024,4096}); :188-190
    frequencies = fftfreq(n_fft, 1/fs)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:238-260 fft: detrend(constant) -> taper (dpss, :357-387) -> FFT / fs (:335-354)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:156-172 Connectivity.from_multitaper (expectation_type 'trials_tapers' -> mean over trials and the 5 tapers, :45-53)
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:195-208 _cross_spectral_matrix S[a, b] = X_a conj(X_b); :210-220 _expectation_cross_spectral_matrix
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:259-261 _minimum_phase_factor (plain property, NOT cached: every access re-runs Wilson) -> minimum_phase_decomposition.py:161-222'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:263-266 _transfer_function = _estimate_transfer_function(Psi) restricted to the first (n_fft+1)//2 bins (decorator :73-89); :1145-1170
    H = Psi @ inv(A0), A0 = ifft(Psi)[lag 0].real
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:268-270 _noise_covariance -> :1116-1142 Sigma = A0 @ A0^T
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:780-805 directed_coherence: noise_variance = _get_noise_variance(self._noise_covariance); return sqrt(noise_variance) * _squared_magnitude(H)
    / _total_inflow(H, noise_variance) (one Wilson run for Sigma, two for H)'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:1234-1238 _get_noise_variance: diagonal(Sigma)[..., newaxis, :, newaxis] -> indexed by ROW (target) i, not by source column
    j'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:1222-1231 _total_inflow(H, nv): sqrt(sum over columns of nv * |H|^2) with nv constant along the summed axis'
  deviation_from_documented: '(i) Direction: documented ''from x -> y'' with rows = sources; implemented A[i, j] = flow x_j -> x_i (row = target), probe p3_pipeline.py var2_bivariate A[1,0] = 0.3421 > A[0,1]
    = 0.1459 for x0 -> x1. (ii) ''nonparametrically estimated through spectral matrix factorization'' holds, but each ordered pair is factorised on its own 2-channel spectrum (bivariate, unconditioned on
    the other P-2 channels); this pairwise fit agrees with the section keyword ''bivariate'' (supplement.txt:775) and departs only from a multivariate reading of the factorisation sentence. (iii) Band rule: documented 125 bins from f0 = 4/T with closed bands; implemented: the multitaper grid k/n_fft (n_fft = T for power-of-two T, so T/2 non-negative bins, DC included,
    Nyquist absent) with open bands (fmin < f < fmax): DC is always dropped and the f = 0.25 bin belongs to neither half-band (p6_misc.py T=64: full band 31 bins 0.0156-0.4844, low band 15 bins ending 0.2344,
    high band 15 bins starting 0.2656). (iv) ''normalized by their noise covariance'': the noise variance enters only as a row factor that cancels, so no noise normalisation takes place.'
  deviation_from_canonical: 'Formula deviates: the library returns |H_ij|^2 / sqrt(sum_k |H_ik|^2) (= |H_ij| * sqrt(DTF_ij)), which (a) contains no innovation variances (sigma_i cancels; canonical weights
    by the SOURCE variance sigma_j), (b) mixes powers (squared numerator, square-root denominator), so it is neither the squared nor the modulus DC, (c) is unbounded (p2_kernel.py max 1.606 on the exact
    var2 spectrum; p3_pipeline.py logistic_maps A[0,1] = 94.46; delayed_noise A[0,k] about 2.9), (d) is not invariant to channel scaling at kernel level (p6_misc.py x1*10: 0.3661 -> 6.3443). Canonical squared
    DC for 2 channels equals canonical gPDC off-diagonal (p10_dc_gpdc.py 2.2e-16), so the canonical bivariate quantity is what gpdcoh already reports. Estimation-setting deviations (bivariate, 5-taper bias
    floor) as for dtf.'
  units_and_range: 'dimensionless; non-negative; NOT bounded above by 1 (check stage: off-diagonal band maxima 1.75 on var2_bivariate T4096, 9.80 on delayed_noise, 10.9 on logistic_maps_chaotic, 2833 on
    logistic_maps; on the exact var2 spectrum the off-diagonal maximum is 0.564 and the 1.606 quoted at the trace stage is a diagonal entry); asymmetric; diagonal NaN; not scale-invariant at kernel level'
  direction_convention: 'A[i, j] = statfn over the band of L[0, 1] where L is the library measure on the ordered 2-channel array [x_i, x_j]; the library''s [a, b] entry is the flow from channel b to channel
    a (H[a, b] maps innovation b into signal a; kernel probe p2_kernel.py on the exact var2_bivariate spectrum: x0 -> x1 appears at L[1, 0], L[0, 1] = 0). Hence A[i, j] = estimated flow x_j -> x_i: ROW
    = TARGET, COLUMN = SOURCE. Confirming evidence: exact-spectrum toy VAR(1) with x0 -> x1 gives library DTF L[1,0] = 0.1608, L[0,1] = 0 (review probe pD_kernel_directed.py); pipeline probe p3_pipeline.py
    (T=4096, z-scored) var2_bivariate A[1,0] = 0.2617 > A[0,1] = 0.1281 (x0 -> x1). logistic_maps (y = process 1 drives x = process 0, audit/checks/make_data.py:207 (beta_xy = 0.1, beta_yx = 0) and :309-310 (update equations)) shows A[0,1] > A[1,0] in the pipeline,
    but the Wilson factorisation does not converge on that dataset at T >= 1024 (60 iterations, residual 0.32-0.38; p7_wilson.py, review pF_wilson.py), so it is not used as confirming evidence. This is
    the opposite of the glossary''s row = source convention. On delayed_noise the DTF/PDC/dcoh/ddtf matrices look row = source only because the estimator fails there (see candidates); gpdcoh on delayed_noise
    follows row = target.'
  symmetry_expected: asym
  already_documented: DEPENDENCY_COMPATIBILITY_REVIEW.md (Nyquist handling / frequency grid of spectral-connectivity 1.1.2 vs 2.x; pinned at 1.1.2 per tests/README.md dependency constraints); base.pair_handling
    record (glossary row = source convention)
