  what_changed: 'spectral_connectivity 1.1.2 weights by the noise variance of the TARGET row, which cancels, and mixes powers: the result |H_ij| sqrt(DTF_ij) is neither the squared nor the modulus directed
    coherence of Baccala et al. 1998 (Eq. 21: gamma_ij = sigma_jj H_ij / sqrt(S_i), Eq. 22: S_i = sum_j sigma_jj^2 |H_ij|^2, checked on the scanned paper p.43), is unbounded (up to 2833 in pyspi), not
    scale invariant, and the formula alone can reverse the direction relative to the canonical DC: on the exact spectrum of a bidirectional VAR(1) (A1 = [[0.2, b], [a, 0.2]], a = 0.4, b = 0.45, innovation SDs 1 and 0.1) the as-coded band-mean A[1,0] - A[0,1] is -0.040 while the canonical squared DC gives +0.937 (a = 0.4, b = 0.5, SDs 1 and 0.2: -0.083 vs +0.786; scratchpad wf4b_low-spectral/probe_directed_population.py (numpy only, exact VAR(1) spectrum, library formula transcribed from spectral_connectivity/connectivity.py:800-805 and :1222-1238)). These two cases are on the raw channel scale, which pyspi sees only with normalise=False: on unit-variance channels, as pyspi''s default z-scoring gives, the same two systems have as-coded A[1,0] - A[0,1] = +0.612 and +0.531, the sign of the canonical DC. Reversals also occur after z-scoring: 158 of 4000 random stable 2-channel VAR(1) systems, e.g. A1 = [[-0.522, -0.708], [-0.545, 0.031]], SDs (0.119, 0.922): canonical -0.961 against z-scored as-coded +0.043 (scratchpad/wf4b2_low-spectral_recheck/zscored_dcoh.py and zscored_search.py, numpy only). On delayed_noise the pyspi asymmetry is also opposite to the canonical DC (estimator means gpdcoh = 2x2 canonical DC 0.88 vs 0.11, as-coded dcoh 0.39 vs 2.99), but there the population of the as-coded quantity matches the designed direction (ref_truth [1,0] = 0.70, [0,1] about 0 in spectral.dcoh|delayed_noise|1024|pipeline|mc:mean-full), so that reversal is an estimator effect shared with dtf, pdcoh and ddtf, not evidence about the formula. The latest release v2.0.1
    still has this formula; upstream master (commit 138f3f7f0f, unreleased 3.0) replaced it by the canonical squared DC (and changed the output to source-first). For two channels the canonical squared DC
    equals the off-diagonal squared gPDC (2.2e-16..3.9e-16), i.e. what gpdcoh reports. Other deviations as for dtf (bivariate, 5-taper bias, row = target, open bands). Rubric anchor 2 (shown by the exact-spectrum VAR(1) case above): non-standard formula
    whose direction (sign of A - A.T) can differ from canonical.'
