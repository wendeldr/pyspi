optimisation:
  complexity_P_T: 'P(P-1) ordered pairs x [2-channel Multitaper (DPSS O(K*T) pure Python + FFT O(K*T log T)) + 3 Wilson factorisations of a 2x2 x n_fft spectrum (~28 iterations of FFT O(n_fft log n_fft) and n_fft 2x2 solves each)]; O(P^2 * T log T) with a large per-pair constant (57-99 ms per pair at T=1024). Measured T exponent 0.82; never run above 8x1024 (infeasible list): the 118x1024 projection is a pair-count scaling of the 8x1024 wall (extrapolated-pairs-from-8), consistent with the per-pair loop having no shared term.'
  hotspot_1: .venv/lib/python3.12/site-packages/spectral_connectivity/minimum_phase_decomposition.py:minimum_phase_decomposition (third-party:spectral_connectivity) 80.7% of the profiled SPI call at 8x1024 (3 calls per ordered pair), of which numpy/linalg/_linalg.py:solve on 2x2 stacks 55.3%
  hotspot_2: .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:dpss_windows 17.6% (inside connectivity.py:from_multitaper 17.8%, one Multitaper per ordered pair)
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.079
  profile_file: audit/profiles/spectral.dcoh__8x1024.pstats
  opportunities:
  - opportunity_id: spectral_directed-1
    opportunity: 'Memoise the Wilson factor (H, Sigma) per ordered pair on the Data and serve every property access and all five directed units from it: the library recomputes minimum_phase_decomposition on each access of _transfer_function / _noise_covariance / _MVAR_Fourier_coefficients (connectivity.py:260-275), i.e. 2, 3, 2, 3 and 4 factorisations per pair for dtf, dcoh, pdcoh, gpdcoh and ddtf (14 per ordered pair for the five units).'
    opp_type: cache-sharing
    expected_speedup: ~2x
    speedup_basis: profile:audit/profiles/spectral.dcoh__8x1024.pstats minimum_phase_decomposition 80.7% over 3 calls per pair, 2 removable
    output_risk: unverified-bit-identical
    risk_evidence: the factorisation is deterministic (Cholesky start, fixed tolerance); reusing it repeats no arithmetic and changes none
    effort: S
    depends_on: []
  - opportunity_id: spectral_directed-2
    opportunity: Run one batched Wilson factorisation over all pairs with the pairs on the leading axis (the library checks convergence per leading index, minimum_phase_decomposition.py:102-125, 161-222) and replace np.linalg.solve on stacks of 2x2 matrices (_get_linear_predictor, :128-158) by the closed-form 2x2 inverse, removing the per-pair Python loop (pyspi/base.py:85-94 for the directed units, spectral_connectivity/connectivity.py:722-743 for sgc).
    opp_type: vectorise-batch
    expected_speedup: 2-5x
    speedup_basis: 'profile:audit/profiles/spectral.dcoh__8x1024.pstats minimum_phase_decomposition 80.7% (solve 55.3%) + complexity: a closed-form 2x2 inverse is a few flops per matrix against LAPACK gesv per matrix plus Python per pair'
    output_risk: unverified-within-tolerance
    risk_evidence: 'closed-form 2x2 inverse rounds differently and the 1e-8 stop rule can shift by an iteration; a batch must also keep two failure paths: on the sgc path the library pair loop catches np.linalg.LinAlgError per pair and writes NaN (spectral_connectivity/connectivity.py:724-743; a closed-form inverse does not raise, so singular pairs must be detected and set to NaN explicitly; on the directed path pyspi''s pair loop (pyspi/base.py:85-94) has no such handler, so today a raising pair fails the whole SPI in the Calculator''s per-SPI exception handler, and a batch must keep that behaviour or record the change), and a failed Cholesky initial condition fails the whole SPI on both paths: the handler at minimum_phase_decomposition.py:48 names xp.linalg.linalg.LinAlgError, which numpy 2.5.4 does not have, so the failure raises AttributeError, which neither the library pair loop (LinAlgError only) nor pyspi catches, and the Calculator sets the whole SPI to NaN (pyspi/calculator.py:336-337); no RNG is drawn (probes recorded in notes/spectral_directed.md Checks "NumPy-2 fallback" and notes/sgc.md "Error path"). A batch must keep that whole-SPI failure or record the change. The random start from the global numpy RNG (minimum_phase_decomposition.py:54-63), which in a batched call would hit every pair, is reachable only under a numpy that still has the deprecated numpy.linalg.linalg shim (numpy < 2.4 as checked: 2.2.6 and 2.3.3 resolve xp.linalg.linalg.LinAlgError with a DeprecationWarning, 2.4.6 and 2.5.4 raise AttributeError) or a spectral_connectivity release whose handler catches xp.linalg.LinAlgError (v2.0.1 does, notes/spectral_directed.md); that rng-stream risk is conditional on such a numpy or library version and does not apply in this environment (pyproject.toml pins numpy>=2.5.4,<2.6)'
    effort: L
    depends_on:
    - spectral_directed-1
  - opportunity_id: spectral_csm-shared-csm
    opportunity: Compute the multitaper Fourier coefficients once per Data and memoise the taper-averaged CSM, power and coherency on the Data under a key without measure or band (pyspi/statistics/spectral.py:46-50, 64-83; this also removes the first-insert string key at :81 that makes the first spectral SPI on a Data compute twice). Every undirected measure, every psi/gd band, the 2x2 blocks of the bivariate directed path and the sgc nonparametric pair loop read from it; the phase-sync measures take their per-taper products from the shared coefficients.
    opp_type: cache-sharing
    expected_speedup: ~1.2x
    speedup_basis: 'profile:audit/profiles/spectral.dcoh__8x1024.pstats connectivity.py:from_multitaper 17.8% (DPSS 17.6%) per ordered pair + complexity: the 2x2 CSM block of a pair is a slice of the shared P-channel CSM.
      Independent of spectral_directed-1 and spectral_directed-2 (independent_of), because those avenues cut the Wilson factorisation (minimum_phase_decomposition) and this one the
      per-pair Multitaper and DPSS build (from_multitaper), disjoint frames; in their residual the from_multitaper share is larger, so this avenue''s standalone figure stacked there is a
      lower figure'
    output_risk: unverified-bit-identical
    risk_evidence: multivariate and bivariate CSM entries are bit-identical (spectral_csm.md trace, Direction convention)
    effort: M
    depends_on: []
    independent_of:
    - spectral_directed-1
    - spectral_directed-2
