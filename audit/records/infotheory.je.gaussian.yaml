    2*1.41893853 - 0.01887329 = 2.81900377. Hence je_gaussian, ce_gaussian and mi_gaussian carry identical ranking information (all functions of |r|).'
  - 'CANDIDATE (robustness): exact collinearity raises NonPositiveDefiniteMatrixException (probe shared_envelope rows 0/2) and Calculator blanks the whole je matrix (calculator.py:336-339 at HEAD a1f20c7); see infotheory.est.gaussian.'
