optimisation:
  complexity_P_T: 'O(P^2 T): JointEntropy.bivariate -> JIDTBase._compute_joint_entropy (infotheory.py:159-177) caches data.joint_entropy symmetrically, so P(P-1)/2 JIDT EntropyCalculatorMultiVariateGaussian
    calls run, each with a T x 2 JArray(JDouble, 2) conversion (row-by-row, O(T)). Measured fresh P exponent 2.06, T exponent 0.97 (the 2-D conversion is linear in T). At 118x1024 the pair term dominates
    (t_fixed 0.6 ms): 11.0 s measured fresh.'
  hotspot_1: pyspi/statistics/infotheory.py:JIDTBase._compute_joint_entropy (third-party:jidt + jpype 2-D conversion, booked as self time) 98.7% cum / 97.8% self of the profiled SPI call at 8x1024
  hotspot_2: 'jpype/_jarray.py:JArray.__new__ (third-party:jpype) 0.7%; numpy tril_indices 0.6%. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java)
    time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jpype
  opaque_share: 0.0101
  profile_file: audit/profiles/infotheory.je.gaussian__8x1024.pstats
  opportunities:
  - opportunity_id: it_gaussian-1
    opportunity: Compute the pairwise Gaussian SPIs for all pairs at once in numpy from one ddof=1 covariance of the z-scored rows (lag blocks x(t-m) and x(t+1) for tlmi and TE), with a batched slogdet
      over the pair sub-matrices, instead of one JIDT calculator call per pair through JPype (infotheory.py:JIDTBase._compute_joint_entropy, MutualInfo.bivariate, TimeLaggedMutualInfo.bivariate, TransferEntropy.bivariate).
    opp_type: replace-library
    expected_speedup: ~1900x (fresh ~2900x)
    speedup_basis: 'microbench:audit/profiles/micro/opp_it_gaussian-1.json (je_gaussian: candidate alone at 118x1024 3.8 ms including Data construction (2.9 ms), shapes 118x1024_candidate_only,
      against the quiet summary.json 118x1024 walls 11.04 s fresh (measured) and 7.18 s family-warm (extrapolated-pairs-from-32) = 2935x / 1909x. Those ratios count Data construction in the
      candidate, which the basis leaves out (profile_units.py times compute_spi on a prebuilt Data), so they move with Data-construction time (1709x against the family-warm basis in the Workflow 4c
      run, 4.2 ms with Data). The like-for-like cost is the math alone: shapes 118x1024_split (4c run) gives 0.89 ms on a prebuilt Data, 8106x against the family-warm basis and 12,460x against the
      fresh wall. The lower bound 1900x is kept as a conservative figure below the like-for-like ratio; with it the unit keeps 2.3 s per patient, with 8106x 0.5 s. The ranking basis itself is
      low: the single fresh 118x1024 measurement (11.04 s, one repeat) is 1.54x the extrapolated family-warm 7.18 s, while fresh and family-warm agree at 32x1024 (0.519 s / 0.516 s), so the gap is
      in the pairs-from-32 extrapolation, not a cache, and the patient-seconds saving ranked on (4,309 s) is a lower figure (6,623 s on the fresh wall); same-run speedups against the pyspi baseline on the shared machine 26x at 8x1024 and 497x at 32x1024
      in the latest run (27x / 454x in the first; the 32x1024 same-run baselines are noisy)) + profile:audit/profiles/infotheory.je.gaussian__8x1024.pstats pyspi/statistics/infotheory.py:159 _compute_joint_entropy
      98.7% (the candidate replaces the whole multivariate call; its own cost is one (k+1)P-square covariance plus O(P^2) small slogdets, milliseconds at 118x1024)'
    output_risk: within-tolerance
    risk_evidence: 'audit/profiles/micro/opp_it_gaussian-1.json: max_abs_diff 1.3e-15 (8x1024), 2.7e-15 (32x1024) and 2.2e-15 (118x1024, shapes 118x1024_split, one-shot pyspi baseline against
      the math-only candidate, max_rel_diff 8.1e-16), NaN masks equal, not bit-identical (np.cov + slogdet instead of JIDT''s covariance + Cholesky)'
