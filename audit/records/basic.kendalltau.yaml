unit_id: basic.kendalltau
status: profiled
correctness:
  metric_name_standard: Kendall's tau-b (tie-adjusted Kendall rank correlation); kendalltau-sq is its square
  canonical_ref: 'Kendall M.G. 1938, ''A new measure of rank correlation'', Biometrika 30(1-2):81-93 (tau-a); tie adjustment tau-b: Kendall M.G. 1945, ''The treatment of ties in ranking
    problems'', Biometrika 33(3):239-251; O(n log n) algorithm: Knight W.R. 1966, JASA 61:436-439'
  canonical_definition: tau_a = (C - D) / (n(n-1)/2); tau_b = (C - D) / sqrt((n0 - n1)(n0 - n2)), n0 = n(n-1)/2, n1/n2 = pairs tied in x/y; tau_a == tau_b when there are no ties
  documented_definition: 'supplement §1.1.4, p.4: ''Kendall''s tau [1] assesses the association of ordinal variables, similar to Spearman''s rho, but has certain differences, such as
    becoming more mathematically tractable in the event of ties [7]. The method is implemented via function kendalltau in SciPy [6], and has a value in [-1, 1].'' [1] = Kendall 1938
    Biometrika 30, 81. GitBook basic-statistics.md:81-97 same text; table-of-spis.md:35 lists kendalltau and kendalltau-sq. The variant (a/b/c) is not stated; kendalltau-sq is not described
    in the supplement.'
  delegate_lib: scipy==1.17.1 scipy.stats.kendalltau (variant='b', compiled _kendall_dis)
  implemented_as: 'Default pipeline z-scores (optionally detrends) each channel; for each ordered pair, scipy.stats.kendalltau(x, y) with defaults: dense ranks, discordant pairs by Fenwick
    tree, joint/x/y tie counts, tau-b = (tot - xtie - ytie + ntie - 2 dis)/sqrt(tot-xtie)/sqrt(tot-ytie), clipped to [-1,1]; p-value discarded. -sq returns tau_b**2. Lower triangle overwritten
    from upper (i<j). Zero lag only.'
  implementation_trace:
  - pyspi/calculator.py:230-267 Calculator._load_yaml (HEAD a1f20c7) instantiates getattr(module, fcn)(**params) at :256 with configs squared True/False from pyspi/config.yaml:74-97;
    the YAML 'labels' block is not read, so instance labels come from the class
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan) (HEAD a1f20c7)
  - 'pyspi/data.py:184-195 preprocessing before any SPI: optional scipy.signal.detrend(axis=1) then scipy.stats.zscore(axis=1, ddof=1, nan_policy=''omit''); :199-203 any NaN after this
    raises ValueError (so constant channels, which z-score to NaN, never reach scipy)'
  - 'pyspi/base.py:132-138 Undirected.multivariate calls Directed.multivariate then mirrors: li = np.tril_indices(P,-1); A[li] = A.T[li] (upper triangle i<j kept)'
  - pyspi/base.py:88-94 Directed.multivariate loops over all ordered pairs i != j and calls self.bivariate(data, i=i, j=j), i.e. P(P-1) calls, each unordered pair computed twice
  - 'pyspi/base.py:27-47 parse_bivariate: Data passes straight through; raw arrays are wrapped in Data() (first via set_data, z-scored; second via add_process data.py:230-234, appended
    without preprocessing)'
  - pyspi/statistics/basic.py:160-173 class KendallTau(Undirected, Signed); __init__(squared=False) identical pattern to SpearmanR (identifier 'kendalltau-sq', labels += mutation, bug
    4)
  - 'pyspi/statistics/basic.py:175-181 bivariate: x, y = data.to_numpy()[[i, j]]; returns stats.kendalltau(x, y).correlation (defaults: variant=''b'', method=''auto'', nan_policy=''propagate''),
    or its square'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5530-5535 kendalltau wrapped by _axis_nan_policy_factory(default_axis=None, too_small=1) (NaN
    propagation, n<=1 -> NaN); _pack_CorrelationResult :138-141 sets .correlation
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5650-5651 x, y ravelled (the (T,1) slices become length-T vectors)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5671-5678 sort on y and convert to dense ranks, stable mergesort on x and dense ranks
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5680 dis = _kendall_dis(x, y) (compiled; source https://raw.githubusercontent.com/scipy/scipy/v1.17.1/scipy/stats/_stats.pyx
    def _kendall_dis, about line 83: Fenwick-tree O(n log n) discordant-pair count, Knight 1966 style)'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5682-5689 joint ties ntie, ties in x xtie and y ytie (count_rank_tie :5662-5668), tot = n(n-1)/2;
    :5691-5695 all-tied x or y -> NaN
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5699 con_minus_dis = tot - xtie - ytie + ntie - 2*dis
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5700-5701 variant ''b'': tau = con_minus_dis / sqrt(tot - xtie) / sqrt(tot - ytie)  (tau-b)'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5710 tau = np.minimum(1., max(-1., tau)) clip; :5739 res.correlation = tau
  deviation_from_documented: 'Value: none against ''kendalltau in SciPy'' (scipy default variant=''b'' is used). The supplement cites Kendall 1938 (tau-a) without naming the variant;
    the implementation is tau-b, which equals tau-a only without ties. Metadata: ''linear'' class label vs documented ''nonlinear'' keyword (candidate); both ''signed'' and ''unsigned''
    labels (bug 4). kendalltau-sq not described in the supplement.'
  deviation_from_canonical: 'Relative to Kendall 1938 tau-a: tau-b tie correction is applied; identical on continuous data (probe, n=50 continuous: tau-b = tau-a = 0.2897959183673469),
    different with ties (probe, rounded data: pyspi 0.30084768027508835 = scratch tau-b, tau-a 0.22285714285714286). Relative to tau-b (Kendall 1945): none (exact match to from-scratch
    O(n^2) tau-b in probes). kendalltau-sq has no standard name.'
  units_and_range: dimensionless; kendalltau signed in [-1,1]; kendalltau-sq in [0,1]; symmetric in exact arithmetic (kernel reciprocal calls can differ by a few ulp with ties; pipeline
    output exactly symmetric via the mirror); NaN on the diagonal; NaN if one series is all-tied, but constant channels are rejected by the Data loader first
  direction_convention: 'undirected: A[i,j] = A[j,i] = tau_b(x_i, x_j) computed with i<j (upper triangle, base.py:136-137); no lag, no direction'
  symmetry_expected: sym
  already_documented: 'tests/README.md bug 4 (SpearmanR/KendallTau mutate class-level labels: instances carry both ''signed'' and ''unsigned''); REVIEW M8 (same label mutation); tests/README.md
    line 131 records n1d0 == n0d0 for spearmanr/kendalltau (rank invariance under z-scoring, measured max difference 0); EEG_OPTIMIZATION_NOTES.md:132 (generic Undirected path computes
    both ordered directions before one triangle is overwritten; optimisation candidate); tests/unit/test_data.py:74-88 locks Data.add_process appending later processes raw (the basis
    of the parse_bivariate infrastructure item below). Related pattern, different SPIs: REVIEW M2 (last-bit reciprocal asymmetry in precision, Euclidean distance, envelope correlation).'
  new_finding_candidates:
  - 'CANDIDATE (metadata): class labels say ''linear'' (pyspi/statistics/basic.py:140 and :164 labels = [''basic'',''unordered'',''rank'',''linear'',''undirected'']) while the supplement
    keywords and config.yaml:75-80 / :88-93 say ''nonlinear''; Calculator._load_yaml (calculator.py:230-267, instantiation at :256, HEAD a1f20c7) never reads the YAML labels, so every
    instance carries ''linear''. Probe in a fresh interpreter: SpearmanR().labels and KendallTau().labels -> [''basic'',''unordered'',''rank'',''linear'',''undirected'',''signed''];
    after a squared=True instance has been created in the same interpreter (bug 4 mutation) a new default instance carries [...,''signed'',''unsigned'',''signed''] (rank_corr_fix/p_labels.py).
    ''linear'' is present in both states. Distinct from bug 4 (signed/unsigned).'
  - 'CANDIDATE (efficiency quantification only; the double work itself is already documented at EEG_OPTIMIZATION_NOTES.md:132): for this unit, probe with P=4 bivariate_gaussian_T256
    counted 12 bivariate calls where 6 suffice (base.py:91-93 loop, base.py:136-137 mirror), and the pipeline result is exactly symmetric. The discarded calls can differ from the kept
    ones only at the last-bit level on tied data (see the numerics item), so for kendalltau values the discarded half is pure waste.'
  - 'CANDIDATE (definition/documentation): documented citation is Kendall 1938 (tau-a) while scipy computes tau-b (_stats_py.py:5701). On continuous float data they coincide; on quantised
    data they diverge (probe, coarse integer data T=4096: tau-b 0.38386 vs tau-a 0.33287). Whether EEG inputs carry ties depends on ADC/export resolution (hypothesis; z-scoring preserves
    ties, probe: 0/500 changes on tied integer data).'
  - 'CANDIDATE (numerics, value-neutral in pipeline; not Kendall-specific, basic.spearmanr shows the same effect through np.corrcoef): scipy divides con_minus_dis / sqrt(tot-xtie) /
    sqrt(tot-ytie) (_stats_py.py:5701), so with ties (xtie != ytie) swapping x and y changes the division order. Earlier probe on 2000 tied random pairs: 666 reciprocal mismatches, max
    1.11e-16. Re-probe rank_corr_fix/p_recip.py, 2000 pairs n in [20,400) of np.round(N(0,9)): kendalltau 691 mismatches, spearmanr 691 (different pairs, overlap 234), both max |diff|
    5.55e-17 (at most 2 ulp of the smaller value); continuous data 0/2000 for both. Masked in the pipeline by the Undirected mirror (base.py:137); matters only for reference comparisons
    with bit-exact criteria.'
  - 'CANDIDATE (documentation): ''nonlinear'' keyword covers only monotone dependence; tau is expected near 0 for nonlinear_dependence (x0^2, circle).'
  - 'CANDIDATE (infrastructure consequence only, no effect on this unit''s values; the underlying Data.add_process behaviour is already locked by tests/unit/test_data.py:74-88 test_add_process_appends_raw_unnormalised,
    owned by unit preproc.two_array_api): parse_bivariate with raw arrays (base.py:33-36) z-scores only the first array (Data.set_data) and appends the second raw (data.py:230-234).
    Probe: row0 mean/std 0/1, row1 mean/std 4.38/4.763. Rank statistics are invariant, but other bivariate SPIs called on arrays would see unequal preprocessing.'
  proposed_checks:
  - datasets:
    - bivariate_gaussian
    - nonlinear_dependence
    - contaminated
    - iid_gaussian
    path: kernel
    reference: 'from-scratch O(n^2) numpy: S = sum_{i<j} sign(x_i-x_j) sign(y_i-y_j), n1/n2 = pairs tied in x/y; tau_b = S / sqrt((n0-n1)(n0-n2)), tau_a = S / n0 (int8 sign matrices,
      T <= 4096); repeat on bivariate_gaussian rounded to 1 decimal inside the check to induce ties (no scipy.stats import)'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: 'abs difference to tau_b <= 1e-12 for all pairs/T; on tied data the output matches tau_b and differs from tau_a (probe on coarse integers: tau_b 0.3839 vs tau_a
      0.3329)'
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: 'analytic population Kendall tau for a bivariate normal: tau = (2/pi) arcsin(rho) (Greiner 1909; Kendall 1949); rho = 0.3 -> 0.19397, rho = 0.8 -> 0.59033'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: at T = 4096 |tau_hat - tau| within 3 jackknife standard errors; bias shrinks with T
  - datasets:
