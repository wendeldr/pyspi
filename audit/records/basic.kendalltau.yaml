    reference_kind: external-pkg
    criterion: tolerance
    expected_outcome: agreement <= 1e-12 including the tied variant
  check_method: independent-impl
  check_reference: 'refs/rank_corr.py:ref_run using refs/_kernels_basic_misc.py:kendall_tau_b (from-scratch O(n^2) sign-product pair count, Kendall 1945 tau-b; no scipy.stats) and refs/rank_corr.py:kendall_tau_a;
