unit_id: wavelet.ppc
status: profiled
correctness:
  metric_name_standard: pairwise phase consistency (PPC) from Morlet-wavelet phases, summarised by mean/max over band and time
  canonical_ref: 'Vinck, van Wingerden, Womelsdorf, Fries & Pennartz 2010, NeuroImage 51:112 (supplement ref [66]): PPC = 2/(N(N-1)) sum_{j<k} cos(theta_j - theta_k) over N trials; closed form (|sum_n e^{i
    theta_n}|^2 - N)/(N(N-1)); unbiased estimator of PLV^2; requires N >= 2.'
  canonical_definition: PPC = (|sum_{n=1}^N exp(i theta_n)|^2 - N) / (N (N-1)), theta_n = relative phase in trial n at (f,t); undefined for N = 1.
  documented_definition: 'Not documented as such: the nine wavelet classes are absent from pyspi/config.yaml (tests/README.md:155 ''run today but are absent from pyspi/config.yaml''), from the supplement
    SPI list and from the GitBook page. Supplement §1.5.4, p.14 (supplement.txt heading line 644) states the opposite: PSI ''is the only spectral measure that is computed in the time-frequency domain (denoted by
    modifier wavelet)''; same on GitBook spectral.md:330. The closest documented text is the multitaper version: supplement §1.5.7, p.15 (supplement.txt heading line 701) / GitBook spectral.md:177-188: ''The pairwise
    phase consistency (PPC) [66] measures phase synchronization by quantifying the distribution of the (per taper) phase differences, which means that, unlike PLV, it is not biased by the sample size''.
    Shared band rule, supplement §1.5 preamble, p.13 (supplement.txt heading line 570, text lines 589-599; GitBook spectral.md:14-20): ''We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2]
    ... f0 = 4/T ... the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5 ... [0, fs/2]; fmin-0_fmax-0-25 ... [0, fs/4]; fmin-0-25_fmax-0-5 ... [fs/4, fs/2]''.'
  delegate_lib: mne-connectivity==0.9.0 mne_connectivity.spectral_connectivity_epochs(mode='cwt_morlet', method='ppc') -> mne==1.13.2 mne.time_frequency.tfr.morlet + cwt (scipy 1.17.1 scipy.fft, numpy 2.5.4);
    band mask, mean/max over (freq, time), lower->upper mirror and NaN diagonal are native pyspi (pyspi/statistics/wavelet.py)
  implemented_as: 'Input z-scored per channel (ddof=1, Data default; optional detrend first). pyspi hands mne-connectivity ONE epoch (z = moveaxis(data (P,T,1), 2, 0) -> (1,P,T)) with cwt_freqs = linspace(0.2,
    0.5, 125) and cwt_n_cycles = cwt_freqs/7 (0.029..0.071 cycles). mne.morlet sets sigma_t = n_cycles/(2 pi f) = 1/(14 pi) = 0.0227 samples for every f, so the time grid arange(0, 5 sigma_t, 1) = [0] and
    every wavelet is the single sample W = sqrt(2)+0j (probe: 125 wavelets, length 1, value 1.41421356). The ''CWT'' is X(f,t) = sqrt(2) x(t) for all 125 f up to FFT round-off (probe: max|Re X - sqrt2 x|
    2.7e-15, max|Im X| 7.2e-16, ~2-5% of Im exactly 0). csd(f,t) = X_hi(f,t) conj(X_lo(f,t)) = 2 x_hi(t) x_lo(t) + i*roundoff (hi = higher channel index, lower-triangular connections), psd = |X|^2 = 2 x^2.
    n_epochs = 1, so every across-epoch average in the estimator is a single term. pyspi then keeps the frequencies with fmin <= f <= fmax on the 0.2..0.5 grid (21 bins for fmin-0_fmax-0-25: 0.2..0.2476;
    104 for fmin-0-25_fmax-0-5; all 125 for 0..0.5), applies np.nanmean or np.nanmax over (freq, time) jointly, mirrors the lower triangle to the upper, sets the diagonal NaN. Estimator ppc (epochs_bivariate.py:314-347):
    acc = csd/|csd| (0 where csd = 0); con = Re((acc conj(acc) - n_epochs)/(n_epochs (n_epochs - 1))) = (|e^{i theta}|^2 - 1)/0 = (+-eps or 0)/0 -> -inf or NaN per point (probe iid T=256: 4756 -inf, 0 +inf,
    27244 NaN, 0 finite of 32000). numpy divides the complex csd by the real |csd| as Re csd * fl(1/|csd|) (probe: bitwise at every point), and |csd| equals |Re csd| bitwise at every probed point, so |Re
    acc| = c*fl(1/c) with c = |Re csd|; in round-to-nearest binary64 this is 1 or 1 - 2^-53, so Re(acc)^2 <= 1. That bounds Re(acc)^2 only: |acc|^2 - 1 = Re(acc)^2 + Im(acc)^2 - 1 is positive (+inf after
    the division by 0) once Im(acc)^2 >= 2^-53, i.e. |Im csd|/|Re csd| >~ 1.05e-8, and bitwise equality of |csd| and |Re csd| does not exclude that (mne-connectivity''s own _PPCEst returns +inf from ratio
    1.1e-8 with |csd| == |Re csd| bitwise, run wavelet.ppc|iid_gaussian|64|pipeline|pinf). On the audit data the ratio stays at or below 2.41e-12 (runs wavelet.ppc|*|1024|pipeline|ratio), so there |acc|^2
    - 1 is 0 or negative (probe over all lower pairs of the 19 datasets at T = 64, 256, 1024, 14,280,000 points: |csd| != |Re csd| at 0 points, |acc|^2 - 1 > 0 at 0, < 0 at 1,984,491, == 0 at 12,295,509;
    wl_fix/fx1.py). nanmean/nanmax -> -inf (probe: every dataset, T, band, statistic).'
