    (347); :357 ''ppc'' -> _PPCEst'
  deviation_from_documented: '(a) Frequency grid: documented 125 bins over [4/T, fs/2]; implemented 125 bins over [0.2, 0.5] for every T (wavelet.py:54), so the ''low'' band [0, 0.25] contains only 21 bins
    in [0.2, 0.248] and frequencies below 0.2 are never analysed; the mne fmin argument is 5/T, not 4/T (it only masks cwt freqs when T < 25). (b) No time-frequency decomposition: n_cycles = f/7 makes every
    Morlet wavelet one sample long (W = sqrt(2)), so X(f,t) = sqrt(2) x(t) at all 125 frequencies; the band choice changes nothing except which round-off pattern is averaged. (c) Aggregation runs over frequency
    AND time (axis=(2,3)) of per-(f,t) single-epoch values; the documentation for the multitaper versions describes a summary over frequency only. (d) Not in the documented SPI set at all (extra classes).
    (e) Output -inf: a division by zero (n_epochs - 1 = 0), not a phase-consistency value.'
  deviation_from_canonical: 'PPC is undefined for one trial; the library divides by N(N-1) = 0 without a guard, the numerator is |unit phasor|^2 - 1 = floating-point residue, and pyspi''s nanmean/nanmax
    keeps the infinities. The resulting -inf is a round-off artefact: per point |unit phasor|^2 - 1 is 0 or slightly negative at every probed point (it turns positive only once |Im csd| exceeds about 1.05e-8
    |Re csd|, i.e. Im(acc)^2 >= 2^-53, even where |csd| equals |Re csd| bitwise; the largest ratio in the audit data is 2.41e-12), giving NaN or -inf, and nanmean/nanmax return -inf as soon as one -inf
    point is in the band.'
  units_and_range: Nominally [-1/(N-1), 1] (bias-corrected; negative values legitimate per REVIEW M7 for N >= 2); implemented -inf for every pair (observed); +inf needs a point with |Im csd| above about
    1.05e-8 |Re csd| (Im(acc)^2 >= 2^-53 makes |acc|^2 - 1 positive whether or not |csd| equals |Re csd| bitwise; synthetic Re = 1, Im = 1.2e-8 gives +inf), i.e. a lag-0 product close to zero relative to
    the FFT round-off (not observed; the largest |Im csd|/|Re csd| over the 14,280,000 audit points is 2.41e-12); NaN would need every (f,t) point of the band to be 0/0 (not observed); symmetric; diagonal
    NaN.
  direction_convention: Undirected; A[i,j] = A[j,i] from conn[max(i,j), min(i,j)] (mne_connectivity/spectral/epochs.py:276, :652; wavelet.py:87-88).
  symmetry_expected: sym
  already_documented: tests/README.md 'Degenerate outputs in the extra wavelet set' (tests/README.md:217 'ppc and dspli are -inf everywhere ... pairwise phase consistency divides by n(n-1) = 0'; :157 'status
    ok counts only NaN', which also covers the consequence that a Calculator table with -inf entries for these identifiers passes as status ok). REVIEW M7 covers legitimate negative values for multi-trial
    estimators, not this.
  new_finding_candidates:
  - 'CANDIDATE: the -inf comes from round-off: per point |csd/|csd||^2 - 1 is slightly negative or 0, giving -inf or NaN (probe iid T=256: 4756 -inf, 27244 NaN, 0 +inf). numpy computes Re acc = Re csd *
    fl(1/|csd|); where |csd| equals |Re csd| bitwise this is c*fl(1/c) <= 1 in round-to-nearest (reviewer probe fable_wl/wav4.py: c*(1/c) > 1 at 0 of 32000), but that bounds only Re(acc)^2. The residue
    fl(fl(Re(acc)^2) + fl(Im(acc)^2)) - 1 turns positive once Im(acc)^2 reaches about 2^-53, i.e. |Im csd| above about 1.05e-8 |Re csd| (about 1.5e-8 when Re acc = 1 - 2^-53), and |csd| still equals |Re
    csd| bitwise there, so bitwise equality does not exclude +inf (probe cleanup/wavelet_measures/pinf.py: for Re csd = 1.0, 0.37 and 2.9e-7 every ratio from 1.06e-8 to 1.6e-8 gives bitwise equality and
    a positive residue; the pipeline expression at Re = 1, Im = 1.2e-8 returns +inf with |csd| == |Re csd| True; on the synthetic setup of wl_fix2/p1.py at ratio 1e-8, 193029 of 1000000 points are bitwise
    equal with a positive residue, at ratio 1e-9 none are positive). The audit data never approach the threshold: over 14,280,000 points of all lower pairs of the 19 datasets at T = 64, 256, 1024, |csd|
    != |Re csd| at 0 points and the residue is positive at 0 points (wl_fix/fx1.py), and the largest |Im csd|/|Re csd| is 2.41e-12 (bivariate_gaussian T=1024 pair (2,1); 0 points above 1e-10; min |Re csd|
    7.46e-7; probe cleanup/wavelet_measures/ratio.py). +inf is therefore excluded only for the inputs probed; it needs a lag-0 product close to zero relative to the FFT round-off.'
