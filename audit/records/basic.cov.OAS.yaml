unit_id: basic.cov.OAS
status: profiled
correctness:
  metric_name_standard: Oracle Approximating Shrinkage (OAS) covariance estimator
  canonical_ref: Chen, Wiesel, Eldar & Hero 2010, IEEE Trans. Signal Processing 58(10):5016-5029, Eq. 22-23 (arXiv:0907.4698v1 Eq. 23); target F = tr(S)/p I (Eq. 3), S = (1/n) sum x_i x_i^T (Eq. 2)
  canonical_definition: Sigma_OAS = (1 - rho) S + rho (tr(S)/p) I, rho = min( [(1 - 2/p) tr(S^2) + tr^2(S)] / [(n + 1 - 2/p)(tr(S^2) - tr^2(S)/p)], 1 )
  documented_definition: 'supplement §1.1.1, p.3-4 (supplement.txt:136-157): ''Due to the z-scoring of the time series, the correlation and covariance matrices are equivalent and thus the covariance statistic is within [-1, 1].'' Keywords: undirected, linear, signed, multivariate, contemporaneous. GitBook basic-statistics.md:15-45 repeats the text (its keyword line says ''undirected, nonlinear, unsigned, bivariate''). Neither source documents the ''-sq'' (squared) variants generated by pyspi/config.yaml.'
  delegate_lib: scikit-learn==1.9.1 sklearn.covariance.OAS().fit(X).covariance_; numpy==2.5.4
  implemented_as: Data z-scores each channel with ddof=1 (pipeline default); sklearn.covariance.OAS() with defaults is fit on the (T x P) array; data-driven OAS shrinkage rho (sklearn variant); covariance_ off-diagonal returned (diagonal NaN). Sample covariance uses divisor T (np.cov bias=1) after sample-mean centring, so on the default pipeline the off-diagonal equals (1 - s) * (T-1)/T * Pearson r, s the estimated shrinkage (diagonal mu = (T-1)/T). Squared variant (cov-sq_*) = np.square of the same matrix, labelled unsigned.
  implementation_trace:
  - pyspi/data.py:59-71 Data.__init__ default normalise=True, detrend=False
  - pyspi/data.py:184-195 optional scipy.signal.detrend then zscore(data, axis=1, nan_policy='omit', ddof=1)
  - pyspi/calculator.py:327-339 (HEAD a1f20c7) Calculator.compute try block; :329 calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :335 stores S in the table; :336-339 any exception -> the whole SPI entry set to NaN and the error recorded, warning issued at :354-355
  - 'pyspi/base.py:51-66 parse_multivariate (inplace=True: the cache written onto the Data object persists across SPIs)'
  - pyspi/statistics/basic.py:9 class Estimators(Undirected, Signed); its multivariate overrides Undirected.multivariate (pyspi/base.py:132-138), so no triangle mirroring
  - 'pyspi/statistics/basic.py:18-29 Estimators.__init__: identifier suffix ''_<estimator>'' or ''-sq_<estimator>''; squared sets labels+[''unsigned''] and issigned()->False'
  - 'pyspi/statistics/basic.py:31-44 _from_cache: z = data.to_numpy(squeeze=True).T (observations x processes); getattr(sklearn.covariance, estimator)().fit(z) with ALL sklearn defaults; fitted object cached in data.covariance[estimator] and shared by cov_* and prec_* of that estimator'
  - 'pyspi/statistics/basic.py:46-54 multivariate: matrix = getattr(mycov, ''covariance_'') (line 49); np.fill_diagonal(matrix, np.nan) IN PLACE on the cached sklearn attribute (line 50); returns np.square(matrix) if squared (line 52) else the cached array object itself (line 54)'
  - pyspi/statistics/basic.py:57-63 Covariance(kind='covariance'), identifier 'cov'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:794-822 OAS.fit: location_ = X.mean(0) (line 816); _oas(X - location_, assume_centered=True) (line 818); shrinkage_ (line 819); _set_covariance (line 820)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:46-94 _oas: emp_cov divisor T (line 63); alpha = mean(S**2), mu = trace(S)/p (lines 77-78); num = alpha + mu^2, den = (n+1)(alpha - mu^2/p) (lines 83-84); shrinkage = min(num/den, 1) (line 85); comment lines 70-71: ''The factor 2 / p is omitted since it does not impact the value of the estimator for large p''; (1-s)S + s*mu*I (lines 91-92)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:196-215 _set_covariance: covariance_ = covariance (line 210); store_precision=True default (line 192) -> precision_ = scipy.linalg.pinvh(covariance, check_finite=False) (line 213)'
  deviation_from_documented: Docs say covariance equals correlation and lies in [-1,1]. Implemented value is (T-1)/T * r on the default pipeline (ddof=1 z-score vs divisor-T covariance), further multiplied by (1 - s) from shrinkage. With normalise=False the value is the raw MLE covariance, not bounded by 1. The '-sq' squared variants are undocumented in the supplement and GitBook. GitBook keyword line ('undirected, nonlinear, unsigned, bivariate') contradicts the supplement and the code labels (linear, signed, multivariate). Supplement describes OAS as Chen et al. 2010 [5]; the executed shrinkage formula drops the 2/p terms of Eq. 23 (see deviation_from_canonical).
  deviation_from_canonical: 'sklearn drops the 2/p terms of Chen et al. Eq. 23: executed rho = min((tr S^2 + tr^2 S)/((n+1)(tr S^2 - tr^2 S/p)),1) (_shrunk_covariance.py:83-85, comment lines 70-71). For EEG-sized p this is not negligible: probe shrinkage 0.18388 vs Eq.23 0.16058 (bivariate_gaussian, p=4, T=64), 0.014569 vs 0.012728 (T=1024), 0.21778 vs 0.19936 (sparse_precision, p=5, T=64). Also sample-mean centring while Chen assumes known zero mean. The omission is documented by sklearn itself: OAS class docstring (_shrunk_covariance.py:754-758, and oas() docstring :655-659) states the shrinkage ''differs from Eq. 23'' and that 2/p is dropped because ''for a large p'' it does not affect the estimator. scikit-learn 0.24.1 (the version named in supplement §1.1.1, p.4) computes the same num/den (0.24.1 sklearn/covariance/_shrunk_covariance.py:487-492, comment line 487 ''formula from Chen et al.''s **implementation**''; oas() docstring 466-467 ''slightly modified compared to the one given in the article''; OAS class docstring 508-512), so the documented pyspi version used this variant too. It is therefore a documented sklearn approximation, not a version change; it still departs from Eq. 23 by +14.5% (p=4) and +9.2% (p=5) relative in the shrinkage at T=64.'
  units_and_range: 'dimensionless (input units squared on the kernel path); signed; symmetric (bitwise); cov-sq in [0,1). Pipeline path: |value| <= (T-1)/T * (1 - s); NaN diagonal. Exact 0.0 off-diagonals whenever the shrinkage clips to 1 (all iid_gaussian files).'
  direction_convention: 'undirected: A[i,j] is the (i,j) entry of the fitted sklearn covariance_ for processes i and j (rows of the Data array); no ordering, symmetric bitwise; to be confirmed empirically in the check stage'
  symmetry_expected: sym
  already_documented: REVIEW M1 (Estimators.multivariate bypasses Undirected mirror)
  new_finding_candidates:
  - 'Candidate: multivariate() mutates the cached sklearn estimator in place and returns an alias of it. pyspi/statistics/basic.py:49-50 ''matrix = getattr(mycov, self._kind + "_")'' then ''np.fill_diagonal(matrix, np.nan)''; probe: after Covariance(...).multivariate(dat), dat.covariance[''OAS''].covariance_ diagonal is [nan nan nan nan] and ''returned is cache: True''. No current output changes (precision_ is computed at fit time, before the mutation, and nothing else reads data.covariance), but any later consumer of the cached fit (get_precision, score, mahalanobis) or of the returned array would see the NaN diagonal or alias the cache.'
  - 'Candidate (documentation): the supplement claim ''covariance and correlation matrices are equivalent'' is exact only up to (T-1)/T and the shrinkage factor (1 - s); probe bivariate_gaussian T=1024: max |C - (1-s)(T-1)/T r| <= 4.4e-16, while C[2,3] = 0.78510 vs r = 0.79749 (s = 0.01457).'
  - 'Candidate (documentation): the ''cov-sq_*''/''prec-sq_*'' variants (pyspi/config.yaml:21-36, 56-71) are not described in supplement §1.1.1-1.1.2 or GitBook; probe confirms they are exactly np.square of the unsquared matrix (np.array_equal True).'
  - 'Candidate (documentation): GitBook basic-statistics.md:17 lists Covariance keywords ''undirected, nonlinear, unsigned, bivariate'', contradicting supplement §1.1.1 (''undirected, linear, signed, multivariate'') and pyspi/config.yaml:5-10.'
  - 'Candidate: OAS shrinkage deviates from Chen et al. 2010 Eq. 23 (2/p terms dropped in sklearn _shrunk_covariance.py:83-85, comment lines 70-71). Probe: sklearn 0.183882 vs Eq.23 0.160575 (bivariate_gaussian p=4 T=64); 0.217775 vs 0.199355 (sparse_precision p=5 T=64). Relative difference +14.5% (p=4) and +9.2% (p=5) of the shrinkage. sklearn documents the omission in the OAS class docstring (_shrunk_covariance.py:754-758: it ''differs from Eq. 23'', 2/p is dropped because it is small ''for a large p''), and scikit-learn 0.24.1 (version named in supplement §1.1.1) used the same num/den (0.24.1 _shrunk_covariance.py:487-492, ''formula from Chen et al.''s **implementation**''). So this is a documented upstream approximation, unchanged since the documented version; the candidate is only that the large-p justification does not hold at small p.'
  - 'Candidate (behaviour note): on independent channels the OAS shrinkage clips to exactly 1, so every off-diagonal of cov_OAS/prec_OAS is exactly 0.0 (probe: iid_gaussian T=64,256,1024,4096: s=1, max|off-diag|=0); also nonlinear_dependence T=1024 prec max 0.000. Canonical behaviour, but downstream users get ties at 0 on null data.'
