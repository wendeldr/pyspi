    criterion: tolerance
    expected_outcome: 'expected NOT to match: sklearn shrinkage is larger (0.18388 vs 0.16058 on bivariate_gaussian T=64, 0.21778 vs 0.19936 on sparse_precision T=64); report relative shrinkage and off-diagonal differences per T'
