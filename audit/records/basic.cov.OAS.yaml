  agreement_criterion: 'exact rtol 1e-10 / atol 1e-12 for the covariance against the independent estimator; statistical: |pyspi - E_MC| <= 2 se_fw, se_fw = Monte Carlo sd x familywise factor (1.32 for P=4, 1.40 for P=5) so the rule is a two-sided familywise 5% test over the P(P-1)/2 pairs; qualitative: symmetry (bitwise) with value agreement, and order independence under the cache mutation; documented-claim runs (doc-*, eq23) are tolerance 1e-10 comparisons that are expected to fail and record the size of the gap'
  closeness: '75/86 runs pass in checks/out/results/cov_prec_simple.json. Independent reference: 35/35 value runs pass (kernel, pipeline, pipeline-detrend, squared, symmetry, singular, average-referenced, P=19 stacks), max abs 1.22e-15, max rel 7.54e-13. Pipeline identity: pyspi / Pearson r = 0.8033661 (T=64) and 0.9844686 (T=1024) on every pair, equal to the expected (1-s)(T-1)/T = 0.8033661 / 0.9844686 (doc-corr runs, which fail against plain r with max rel 0.1966 / 0.01553). cov-sq is bitwise np.square of the plain output (bitwise_equal_square_of_plain = 1 on kernel and pipeline). Statistical vs the population model (N=1000 Monte Carlo): 13/14 pass; bivariate_gaussian pipeline T=64/256/1024/4096 max |pyspi - limit| 0.136/0.0622/0.0358/0.016 (about 1/sqrt(T)), max_z <= 0.904. basic.cov.OAS|sparse_precision|1024|kernel|truth fails (max_z 2.26, max |dev|/sd 3.17, Monte Carlo familywise p = 0.014): the realised T=1024 sample has entry (2,3) 3.2 sd above its expectation for every estimator alike; the same file passes the exact reference and T=256/4096 pass, so this is a property of the draw, not of the estimator. Fitted shrinkage_ (probe) vs the kernel: 26/26 pass, max abs 1.11e-16 (P=4, 5, 19; T=64-4096; kernel and pipeline). Null iid_gaussian pipeline: shrinkage = 1.0 at T=64/256/1024/4096 and every off-diagonal is exactly 0.0 (null runs, exact). Chen et al. Eq. 23 (2/p kept): sklearn shrinkage larger by 14.4% (P=4, T=64), 14.4% (P=4, T=1024), 9.56% (P=5, T=64), 0.71% and 0.67% (P=19 stacks, T=1024); off-diagonal relative change 0.0287 (P=4, T=64), 0.00188 (P=4, T=1024), 0.00679 (P=19, T=64), 0.000552 (P=19, T=1024 pipeline). pyspi equals the no-2/p variant (pyspi_vs_variant_max_abs <= 5.6e-17). Symmetry: max|A - A.T| = 0.0 (bitwise) over 59 matrix runs.'
