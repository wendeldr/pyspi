optimisation:
  complexity_P_T: 'O(P^2 T): Undirected.multivariate (base.py:132-138) runs MutualInfo.bivariate (infotheory.py:267-283) for all P(P-1) ordered pairs with no cache, one JIDT MutualInfoCalculatorMultiVariateGaussian
    call each (O(T) covariance + 2x2 Cholesky) plus two 1-D JArray conversions. Measured fresh P exponent 2.50 (8->32), T exponent 0.71: below 1 because the fixed per-call JPype/JIDT cost (0.13 ms per call,
    opp_it_gaussian-1.json components) dominates the O(T) arithmetic at T <= 1024. At 118x1024 the pair term is everything (t_fixed 0): 4.59 s measured fresh.'
  hotspot_1: pyspi/statistics/infotheory.py:MutualInfo.bivariate (third-party:jidt via JPype; Java time booked as self time) 97.9% cum / 94.7% self of the profiled SPI call at 8x1024
  hotspot_2: 'jpype/_jarray.py:JArray.__new__ (third-party:jpype, 1-D double[] conversion, 112 calls) 2.5%. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the
    JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0264
  profile_file: audit/profiles/infotheory.mi.gaussian__8x1024.pstats
  opportunities:
  - opportunity_id: it_gaussian-1
    opportunity: Compute the pairwise Gaussian SPIs for all pairs at once in numpy from one ddof=1 covariance of the z-scored rows (lag blocks x(t-m) and x(t+1) for tlmi and TE), with a batched slogdet
      over the pair sub-matrices, instead of one JIDT calculator call per pair through JPype (infotheory.py:JIDTBase._compute_joint_entropy, MutualInfo.bivariate, TimeLaggedMutualInfo.bivariate, TransferEntropy.bivariate).
    opp_type: replace-library
    expected_speedup: 800-1200x
    speedup_basis: 'microbench:audit/profiles/micro/opp_it_gaussian-1.json (mi_gaussian: candidate alone at 118x1024 3.8 ms including Data construction (2.9 ms), shapes 118x1024_candidate_only,
      against the quiet summary.json 118x1024 walls 4.59 s fresh (measured) and 3.26 s family-warm (extrapolated-pairs-from-32) = 1202x / 851x. Those ratios count Data construction in the candidate,
      which the basis leaves out (profile_units.py times compute_spi on a prebuilt Data), so they move with Data-construction time (767x against the family-warm basis in the Workflow 4c run, 4.2 ms
      with Data). The like-for-like cost is the math alone: shapes 118x1024_split (4c run) gives 0.93 ms on a prebuilt Data, 3504x against the family-warm basis and 4945x against the fresh wall. The
      range 800-1200x is kept as a conservative figure below the like-for-like ratio; with 800x the unit keeps 2.4 s per patient, with 3504x 0.6 s. The ranking basis itself is low: the extrapolated
      family-warm 3.26 s is 0.71x the fresh wall measured at 118x1024 (4.59 s; at 32x1024 they were 0.234 s / 0.269 s), so the patient-seconds saving ranked on (1,953 s) is a lower figure (2,756 s
      on the fresh wall); same-run speedups against the pyspi baseline on the shared machine 12x at 8x1024 and 494x at 32x1024
      in the latest run (14x / 427x in the first; the 32x1024 same-run baselines are noisy)) + profile:audit/profiles/infotheory.mi.gaussian__8x1024.pstats pyspi/statistics/infotheory.py:267 MutualInfo.bivariate
      97.9% (the candidate replaces the whole multivariate call; its own cost is one (k+1)P-square covariance plus O(P^2) small slogdets, milliseconds at 118x1024)'
    output_risk: within-tolerance
    risk_evidence: 'audit/profiles/micro/opp_it_gaussian-1.json: max_abs_diff 3.7e-16 (8x1024) and 4.1e-16 (32x1024); max_rel_diff 2.9e-12 (8x1024) and 7.5e-10 (32x1024), the relative figure on a near-zero
