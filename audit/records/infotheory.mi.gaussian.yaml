unit_id: infotheory.mi.gaussian
status: profiled
correctness:
  metric_name_standard: Gaussian (linear) mutual information I(X;Y) = -0.5 ln(1 - r^2)
  canonical_ref: Cover T.M. & Thomas J.A. 2006, Elements of Information Theory, 2nd ed., Wiley, Example 8.5.1 (MI of a bivariate normal); supplement cites MacKay 2003
  canonical_definition: I(X;Y) = 0.5*ln(sx^2 sy^2 / det Sigma_XY) = -0.5*ln(1-rho^2) nats
  documented_definition: 'supplement §1.4.3, p.10 (supplement.txt:459-465): ''Mutual information [33] is an undirected measure of the (potentially nonlinear) dependence between paired observations of x
    and y''; keywords ''undirected, nonlinear, unsigned, bivariate, contemporaneous''. GitBook information-theory.md:161-180. The estimator itself is defined at supplement §1.4
    (supplement.txt:414-415): ''The Gaussian-distribution model (denoted by modifier gaussian) assumes a linear-Gaussian multivariate, where the measure is derived from the
    cross-covariance matrix''; this is the supplement text the value matches (-0.5 ln(1 - r^2) is the MI derived from the 2x2 covariance matrix).'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.MutualInfoCalculatorMultiVariateGaussian (initialise(1,1), setObservations(double[], double[]), computeAverageLocalOfObservations)
  implemented_as: For each ordered pair (both orders computed, upper triangle i<j kept), source = x_i, dest = x_j (z-scored, squeezed); JIDT computes the ddof=1 covariance of the pair and returns 0.5*ln|var_i
    var_j / det C| = -0.5*ln(1-r^2) with r the sample Pearson correlation, no time lag (TIME_DIFF=0), no bias correction, no Theiler window. Any exception -> logged warning and NaN for that pair (bare except,
    infotheory.py:279-283). Exact joint collinearity returns +inf (not an exception).
  implementation_trace:
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 fill_diagonal NaN; :336-339 any exception from any pair -> the whole SPI entry becomes NaN (:337) and the error is recorded, warning issued at :354-355
  - 'pyspi/data.py:184-195 preprocessing in Data.set_data: optional scipy.signal.detrend(axis=1), then (default normalise=True) scipy.stats.zscore(axis=1, ddof=1)'
  - 'pyspi/base.py:132-138 Undirected.multivariate: Directed loop then A[li] = A.T[li] with li = tril_indices(P,-1) (lower triangle overwritten from the upper, i<j)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: _entropy_calc = _getcalc(''entropy'') (:36); identifier += ''_gaussian'' (:38); estimator ''gaussian'' -> labels += [''linear''], _dyn_corr_excl
    = None (:53-55)'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: every calculator gets setProperty(''BIAS_CORRECTION'',''false'') and setProperty(''NOISE_SEED'',''42''); no NORMALISE property is set'
  - 'pyspi/statistics/infotheory.py:103-134 _getcalc: ''gaussian'' (and any unrecognised estimator) falls to the else branches -> gaussian.EntropyCalculatorMultiVariateGaussian (:111-112), gaussian.MutualInfoCalculatorMultiVariateGaussian
    (:120-123), gaussian.TransferEntropyCalculatorGaussian (:129-130)'
  - pyspi/statistics/infotheory.py:253-265 MutualInfo(JIDTBase, Undirected); __init__ builds self._calc = _getcalc('MutualInfo')
  - 'pyspi/statistics/infotheory.py:267-283 bivariate: _set_theiler_window (no-op for gaussian); initialise(1,1); src, targ = data.to_numpy(squeeze=True)[[i, j]]; setObservations(JArray(src), JArray(targ));
    return computeAverageLocalOfObservations(); bare except -> NaN'
  - 'pyspi/config.yaml:495-507 MutualInfo configs: estimator gaussian (first entry)'
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/measures/continuous/gaussian/MutualInfoCalculatorMultiVariateGaussian.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] constructor :123-125 normalise = false; setProperty BIAS_CORRECTION
    :160-174; finaliseAddObservations :204-220 -> MatrixUtils.covarianceMatrix(source, dest) (ddof=1); setCovariance :269-329 Cholesky of source, dest (redundant components pruned) and joint (L=null on
    joint linear redundancy); computeAverageLocalOfObservations :384-424 returns 0.5*ln|detS*detD/detJoint| (0 if a marginal is fully redundant, +Infinity if L==null; bias correction :418-421 off because
    pyspi sets BIAS_CORRECTION=false)
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/MutualInfoMultiVariateCommon.java finaliseAddObservations :574-630 (timeDiff
    = 0 default, normalise only if flag true :622, which the Gaussian constructor turned off)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] covarianceMatrix(double[][], double[]) :3426-3439 -> covarianceTwoColumns :3370-3377 divides by (n-1) (ddof=1);
    CholeskyDecomposition :4496-4498 (tol 10e-10 = 1e-9) / :4528-4560 throws NonPositiveDefiniteMatrixException when a pivot <= tol; determinantViaCholeskyResult :4673-4680
  deviation_from_documented: none for the quantity; 'nonlinear' keyword is not applicable to the Gaussian estimator (it captures only linear dependence; instance labels say 'linear').
  deviation_from_canonical: 'none: probe var2_bivariate_T1024 mi = 0.01887329 equals -0.5*ln(1-r^2) = 0.0188732936 to machine precision; no small-sample bias correction (E[I_hat] ~ 1/(2N) under independence).'
  units_and_range: nats; [0, +inf]; +inf on exact collinearity; scale invariant; symmetric
  direction_convention: 'undirected: A[i,j] = A[j,i] = I(x_i; x_j). Undirected.multivariate (base.py:133-137) first runs Directed.multivariate (base.py:85-93), which calls bivariate for every ordered pair
    i != j, then overwrites the lower triangle from the upper; MutualInfo.bivariate has no cache (infotheory.py:267-283), so the JIDT MI calculator runs P(P-1) times and the lower-triangle values are computed
    and discarded (probe iid_gaussian_T256, P=5: 20 computeAverageLocalOfObservations calls)'
  symmetry_expected: sym
  already_documented: 'EEG_OPTIMIZATION_NOTES.md:132 (the generic Undirected path computes both ordered directions of each pair before one triangle is overwritten; for this
    unit that is the P(P-1) JIDT MI calls with the lower triangle discarded, see direction_convention). Nothing about the value itself is documented as an issue.'
  new_finding_candidates:
  - 'CANDIDATE (redundancy, information): mi_gaussian is a monotone function of r^2 (sample Pearson); je_gaussian and ce_gaussian are exact affine functions of it under z-scoring (see those units), so the
    three SPIs are rank-equivalent.'
  - 'CANDIDATE (bias): no bias correction is applied (pyspi forces BIAS_CORRECTION=false, infotheory.py:90); under independence the expected value is about 1/(2N) nats (chi-square(1)/(2N), ChiSquareMeasurementDistribution:100-102 [line numbers at JIDT tag v1.6.1, where implementation_trace cites this file; the bundled infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e; see delegate_lib)]),
    i.e. 0.0078 at T=64. To quantify on iid_gaussian.'
