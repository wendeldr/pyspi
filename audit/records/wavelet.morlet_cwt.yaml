unit_id: wavelet.morlet_cwt
status: profiled
correctness:
  metric_name_standard: Morlet continuous wavelet transform and cross-spectral density step shared by the nine extra wavelet SPIs (pyspi.statistics.wavelet.mne._get_cache)
  canonical_ref: 'Morlet wavelet as used in electrophysiology: Tallon-Baudry, Bertrand, Delpuech & Pernier 1997, J Neurosci 17:722 (w(t,f0) = A exp(-t^2/(2 sigma_t^2)) exp(2 i pi f0 t), sigma_f = 1/(2 pi
    sigma_t), f0/sigma_f = 7, i.e. about 7 cycles); Grossmann & Morlet 1984, SIAM J Math Anal 15:723; Torrence & Compo 1998, Bull Am Meteorol Soc 79:61 (admissibility, omega0 = 6). Single-trial wavelet
    coherence/smoothing: Lachaux et al. 2002, Neurophysiol Clin 32:157; Grinsted et al. 2004, Nonlin Proc Geophys 11:561.'
  canonical_definition: X(f,t) = sum_tau x(t - tau) w_f(tau), w_f(t) = A exp(-t^2/(2 sigma_t^2)) exp(2 i pi f t), sigma_t = n_cycles/(2 pi f) with n_cycles of order 3-7 so the wavelet spans several periods;
    requires sigma_t >> 1 sample for f < fs/2 to resolve frequency; cross-spectrum X_x X_y* averaged over trials or a time/scale window before forming connectivity ratios.
  documented_definition: 'supplement §1.5, p.12-13 (supplement.txt heading line 570, text lines 571-578): ''Spectral SPIs are computed in the frequency or time-frequency domain, using either Fourier or wavelet transformations ... the
    phase slope index is both computed in the frequency domain ... and the time-frequency domain (via Morlet transformation)''; §1.5.4, p.14 (supplement.txt lines 652-654): ''The time-frequency decomposition is given
    by a Morlet wavelet, with spectral densities indexed by a time-frequency tuple, given a sampling rate and number of cycles'' (stated for psi_wavelet only; the number of cycles is not given). Shared
    band rule, supplement §1.5 preamble, p.13 (supplement.txt heading line 570, text lines 589-599; GitBook spectral.md:14-20): ''We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ...
    f0 = 4/T ... the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5 ... [0, fs/2]; fmin-0_fmax-0-25 ... [0, fs/4]; fmin-0-25_fmax-0-5 ... [fs/4, fs/2]''.
    GitBook spectral.md:14-20 and :330 (same text).'
  delegate_lib: mne-connectivity==0.9.0 spectral_connectivity_epochs (frequency mask, lower-triangular csd accumulation) + mne==1.13.2 mne.time_frequency.tfr.morlet(zero_mean=True) and cwt(use_fft=True,
    mode='same') (scipy 1.17.1 scipy.fft, numpy 2.5.4)
  implemented_as: 'Input z-scored per channel (ddof=1, Data default; optional detrend first). pyspi hands mne-connectivity ONE epoch (z = moveaxis(data (P,T,1), 2, 0) -> (1,P,T)) with cwt_freqs = linspace(0.2,
    0.5, 125) and cwt_n_cycles = cwt_freqs/7 (0.029..0.071 cycles). mne.morlet sets sigma_t = n_cycles/(2 pi f) = 1/(14 pi) = 0.0227 samples for every f, so the time grid arange(0, 5 sigma_t, 1) = [0] and
    every wavelet is the single sample W = sqrt(2)+0j (probe: 125 wavelets, length 1, value 1.41421356). The ''CWT'' is X(f,t) = sqrt(2) x(t) for all 125 f up to FFT round-off (probe: max|Re X - sqrt2 x|
    2.7e-15, max|Im X| 7.2e-16, ~2-5% of Im exactly 0). csd(f,t) = X_hi(f,t) conj(X_lo(f,t)) = 2 x_hi(t) x_lo(t) + i*roundoff (hi = higher channel index, lower-triangular connections), psd = |X|^2 = 2 x^2.
    n_epochs = 1, so every across-epoch average in the estimator is a single term. pyspi then keeps the frequencies with fmin <= f <= fmax on the 0.2..0.5 grid (21 bins for fmin-0_fmax-0-25: 0.2..0.2476;
    104 for fmin-0-25_fmax-0-5; all 125 for 0..0.5), applies np.nanmean or np.nanmax over (freq, time) jointly, mirrors the lower triangle to the upper, sets the diagonal NaN. Additional facts: the cache
    data.mne is keyed by measure only (wavelet.py:50, :71-74), so all bands/statistics of one class share one call and fs is not part of the key; fmin passed to mne is 5/T (masks cwt freqs only if T < 25:
    probe T=16 keeps 78 of 125, T=24 keeps 121); mt_adaptive=True is ignored in cwt mode (probe: cohy and pli outputs bitwise identical with mt_adaptive=False); with multiple realisations (dim_order ''psr'')
    the realisations become epochs.'
