  - 'mne-connectivity example examples/cwt_sensor_connectivity.py (GitHub main, fetched): ''cwt_freqs = np.arange(7, 30, 2)'' and ''cwt_n_cycles = cwt_freqs / 7.0'' (frequencies in Hz) - the apparent source
    of wavelet.py:55 (hypothesis)'
  deviation_from_documented: '(a) Grid: documented 125 bins on [4/T, fs/2]; implemented 125 bins on [0.2, 0.5] independent of T; the documented low band [0, fs/4] is represented by 0.2..0.248 only (21 bins).
    (b) The Morlet ''transform'' has one-sample wavelets (sigma_t = 1/(14 pi) = 0.0227 samples), so it is the identity times sqrt(2) and does not index spectral densities by frequency; documentation implies
    a genuine time-frequency decomposition. (c) The classes using it are not documented at all (absent from config.yaml, supplement and GitBook).'
  deviation_from_canonical: Canonical Morlet analysis uses n_cycles of several cycles (Tallon-Baudry f0/sigma_f = 7; MNE default n_cycles = 7) so that sigma_t spans several samples; here n_cycles = f/7
    (the Tallon-Baudry ratio sigma_f = f/7 passed where MNE expects a cycle count, or a copy of the Hz-scaled MNE example) gives 0.029-0.071 cycles and a single-sample wavelet with no frequency selectivity;
    the zero-mean correction is then a near-total cancellation (1 - 0.9996 .. 1 - 0.9975) rescaled by the norm, leaving W = sqrt(2). The CWT output has an imaginary part consisting only of FFT round-off.
    One epoch is passed, so no across-trial averaging occurs in any downstream estimator.
  units_and_range: Intermediate tensor conn of shape (P, P, 125, T) per measure (complex for cohy), lower triangle filled, upper triangle and diagonal 0; X(f,t) = sqrt(2) x(t) (z-scored units) at every
    f.
  direction_convention: csd(f,t) = X_hi(f,t) conj(X_lo(f,t)) with hi = row index > lo = column index (np.tril_indices(P, -1), epochs.py:276; epochs.py:652); pyspi copies conn[hi, lo] to both A[hi, lo] and
    A[lo, hi] (wavelet.py:87-88).
  symmetry_expected: n/a
  already_documented: 'tests/README.md ''Degenerate outputs in the extra wavelet set'' (tests/README.md:217) attributes the degeneracy to the single epoch only (''a single epoch (1 x processes x samples)'');
