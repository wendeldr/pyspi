unit_id: infotheory.ce.kozachenko
status: profiled
correctness:
  metric_name_standard: Conditional differential entropy H(X_j | X_i) of contemporaneous samples, Kozachenko-Leonenko estimate (difference of two KL entropies)
  canonical_ref: Cover TM, Thomas JA (2006) Elements of Information Theory, 2nd ed., §8.4 (h(X|Y) = h(X,Y) - h(Y)); estimator Kozachenko & Leonenko (1987); Kraskov et al. (2004) Phys Rev E 69:066138 Eq.
    (20), k=1
  canonical_definition: H(Y|X) = -E[log f(Y|X)] = H(X,Y) - H(X), here with X = x_i, Y = x_j (contemporaneous pairs).
  documented_definition: 'Supplement §1.4.2, p.10 (supplement.txt:451; the pack lists 461): "Conditional entropy [33] quantifies the uncertainty over the observations in y in the context of simultaneously
    observing x"; keywords "undirected, nonlinear, unsigned, bivariate, contemporaneous"; SPI 62 ce_kozachenko. GitBook information-theory.md lines 46-62 (same text).'
  delegate_lib: JIDT jar (labelled 1.6.1, post-tag build matching commit a9b6b3e77c) EntropyCalculatorMultiVariateKozachenko.computeAverageLocalOfObservations, d=2 and d=1
  implemented_as: A[i,j] = H_KL(z_i, z_j) - H_KL(z_i), i.e. the entropy of process j conditioned on process i (contemporaneous). The joint entropy is shared/cached with je (data.joint_entropy) and the marginal
    is cached in data.entropy keyed by estimator. Each term is a separate KL estimate (independent nearest-neighbour searches in R^2 and R^1), so the KL biases do not cancel as they would in a KSG construction.
    Directed.multivariate fills all ordered pairs. All T samples are used; no Theiler window.
  implementation_trace:
  - 'pyspi/calculator.py:277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (normalise=True default, :50); pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset);
    pyspi/calculator.py:332 np.fill_diagonal(S, np.nan) (HEAD lines)'
  - 'pyspi/base.py:85-94 Directed.multivariate: A[i,j] = bivariate(data, i=i, j=j)'
  - pyspi/statistics/infotheory.py:237-250 ConditionalEntropy.bivariate = _compute_joint_entropy(i,j) - _compute_entropy(i)
  - pyspi/statistics/infotheory.py:159-177 _compute_joint_entropy (d=2, cached)
  - pyspi/statistics/infotheory.py:137-156 _compute_entropy (d=1, x = np.squeeze(data.to_numpy()[i]), cached in data.entropy[(estimator,)])
  - pyspi/statistics/infotheory.py:103-110 _getcalc('entropy') -> EntropyCalculatorMultiVariateKozachenko(); pyspi/statistics/infotheory.py:91 calc.setProperty(self._SEED, '42') (NOISE_SEED=42, in _setup
    :84-93)
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java:229-233,283-289 setObservations(double[]) -> 1-column reshape; :179-212 noise
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/kozachenko/EntropyCalculatorMultiVariateKozachenko.java:82-115
  - JIDT v1.6.1 java/source/infodynamics/utils/EuclideanUtils.java:69-110
  deviation_from_documented: (1) Keyword 'undirected' (supplement, GitBook line 48, config.yaml:413) vs the code's Directed class and label 'directed'. The value is asymmetric by construction; REVIEW M8
    already notes the conditioning order. (2) Label 'linear' (infotheory.py:53-54) vs documented 'nonlinear'. The formula itself matches the prose (y given x, with x = row i and y = row j).
  deviation_from_canonical: 'None in the formula (H(X_i,X_j) - H(X_i) = H(X_j|X_i) exactly; probe3 reproduces A[0,1] and A[1,0] with a from-scratch KL to <= 3.6e-15 with noise off). Estimator level: the
    difference of two independent KL estimates carries an O(1) small-sample bias that a KSG-style conditional estimator would partly cancel (the supplement itself says this). Noise and naive-distance effects
    are as in infotheory.est.kozachenko; at d <= 2 the naive defect is negligible (var2 T=4096: 1.409 vs ref 1.409, probe6).'
  units_and_range: 'Nats; real, unbounded, can be negative (differential conditional entropy). Goes strongly negative for near-functional relations (shared_envelope copy x2 = x0: ce = -17.03 at T=1024,
    probe7, noise/tie dominated). Labelled ''unsigned''. Asymmetric.'
  direction_convention: 'A[i,j] = H(x_j | x_i): row = conditioning variable, column = variable whose uncertainty is measured (infotheory.py:248 joint(i,j) - entropy(i)). Probe7 anm T=1024 (x2 -> x3 = tanh(2
    x2) + 0.2 noise): A[2,3] = H(x3|x2) = 0.104 < A[3,2] = H(x2|x3) = 0.311, consistent with that reading.'
  symmetry_expected: asym
  already_documented: docs/storage_comparison/REVIEW.md M8 ("ce is H(i,j) - H(i) (conditioning order)"; differential entropies can be negative)
  new_finding_candidates:
  - 'Candidate (label): ''linear'' label for a nonparametric estimator (probe1 labels [''unsigned'',''infotheory'',''unordered'',''directed'',''linear'']), against documented ''nonlinear''.'
  - 'Candidate (doc keyword): supplement §1.4.2 and config.yaml list ce as ''undirected'', while the class is Directed and the values are asymmetric (var2_bivariate T=1024 A[0,1]=1.423 vs A[1,0]=1.446,
    probe7). REVIEW M8 covers the conditioning order but not the keyword conflict.'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
