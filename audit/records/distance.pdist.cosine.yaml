unit_id: distance.pdist.cosine
status: profiled
correctness:
  metric_name_standard: Cosine distance (1 - cosine similarity) between z-scored series; equals 1 - Pearson r on default input
  canonical_ref: Salton & McGill 1983, Introduction to Modern Information Retrieval (McGraw-Hill), cosine similarity; Deza & Deza 2016, Encyclopedia of
    Distances, entry 'cosine similarity' (cosine distance = 1 - cos, not a metric)
  canonical_definition: d(x,y) = 1 - (sum_t x_t y_t) / (||x||_2 ||y||_2)
  documented_definition: 'GitBook distance-similarity.md ''Pairwise Distance'' (lines 297-321): "Pairwise distance between time-series, computed using sklearn''s
    pairwise distance function using the following distance metrics: Euclidean, Cityblock, Cosine, Chebyshev, Canberra, Braycurtis"; keywords "undirected,
    nonlinear, unsigned, unordered". No formula is given. pdist is absent from the supplement: supplement §1.2 ''Distance similarity (26 SPIs)'', p.5 (heading
    line 209) lists SPIs 22-47 (dcorr, dcorrx, mgc, mgcx, hsic, hhg, dtw, lcss, softdtw, bary) and no pdist entry.'
  delegate_lib: scikit-learn==1.9.1 sklearn.metrics.pairwise.cosine_distances (row-normalise, X X^T, 1 - S, clip [0,2])
  implemented_as: 'Rows z-scored (ddof=1) by default; sklearn normalises each row to unit L2 norm, forms S = Xn Xn^T, returns clip(1 - S, 0, 2) with the
    true diagonal set to 0. On zero-mean rows cos = Pearson r, so the value is 1 - r (probe: max |A - (1 - r)| = 7.8e-16).'
  implementation_trace:
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (Calculator defaults detrend=False, normalise=True,
    calculator.py:48-50; lines at HEAD a1f20c7)
  - pyspi/data.py:184-195 optional scipy.signal.detrend(axis=1), then zscore(data, axis=1, nan_policy='omit', ddof=1) per process
  - pyspi/calculator.py:329-335 S = self._spis[spi].multivariate(self.dataset); np.fill_diagonal(S, np.nan); self._table[spi] = S (HEAD a1f20c7)
  - 'pyspi/base.py:51-68 parse_multivariate: passes the Data object through unchanged'
  - pyspi/statistics/distance.py:28-36 class PairwiseDistance(Undirected, Unsigned); __init__ stores metric, identifier 'pdist_<metric>'
  - 'pyspi/statistics/distance.py:38-40 multivariate overrides Undirected.multivariate (base.py:132-138, never called): return pairwise_distances(data.to_numpy(squeeze=True),
    metric=self._metric)'
  - pyspi/data.py:108-118 to_numpy(squeeze=True) -> (M processes, T observations) float64; each row is one vector in R^T
  - sklearn/metrics/pairwise.py:2309 pairwise_distances(X, Y=None, metric, n_jobs=None, ensure_all_finite=True) (scikit-learn 1.9.1)
  - sklearn/metrics/pairwise.py:2463-2464 metric in PAIRWISE_DISTANCE_FUNCTIONS -> func (table at sklearn/metrics/pairwise.py:1919-1931)
  - sklearn/metrics/pairwise.py:2494 -> _parallel_pairwise; sklearn/metrics/pairwise.py:1971-1981 Y=None -> Y=X; effective_n_jobs(None)==1 -> func(X, X)
  - sklearn/metrics/pairwise.py:1136 cosine_distances; sklearn/metrics/pairwise.py:1174 S = cosine_similarity(X, Y)
  - sklearn/metrics/pairwise.py:1703 cosine_similarity; sklearn/metrics/pairwise.py:1748 check_pairwise_arrays; sklearn/metrics/pairwise.py:1750 X_normalized
    = normalize(X); sklearn/metrics/pairwise.py:1756 K = safe_sparse_dot(Xn, Yn.T)
  - sklearn/metrics/pairwise.py:1175-1177 S = clip(1 - S, 0.0, 2.0); sklearn/metrics/pairwise.py:1178-1181 X is Y or Y is None -> fill diagonal 0
  deviation_from_documented: 'None in substance: the code is sklearn.metrics.pairwise_distances with metric=''cosine'' as the GitBook page states. Not stated
    on the page: inputs are z-scored per process (ddof=1) by Data by default (optionally detrended first), and the Calculator sets the diagonal to NaN.
    No formula or normalisation (e.g. per-sample scaling) is documented.'
  deviation_from_canonical: 'Formula: none (clip to [0,2] is a no-op in exact arithmetic). Domain: with default z-scoring the quantity is exactly 1 - Pearson
    r (centred cosine), i.e. a linear-correlation measure; with normalise=False it becomes the uncentred cosine and depends on offsets (probe: 0.379 ->
    0.710 after x -> 3x + 5).'
  units_and_range: 'Dimensionless, [0, 2]: 0 for r=1, 1 for r=0, 2 for r=-1 (probe y=-x: 2.0). Independent of T in expectation. Never negative (clipped).'
  direction_convention: 'A[i,j] = d(z_i, z_j) for rows i, j of the (z-scored) M x T data; the metric is symmetric so A[i,j] = A[j,i]; no direction is encoded;
    diagonal NaN after Calculator.compute (confirmed in the check stage: sym runs).'
  symmetry_expected: sym
  already_documented: docs/storage_comparison/REVIEW.md M1 (PairwiseDistance overrides Undirected.multivariate; output exactly symmetric in probes)
  new_finding_candidates:
  - 'Candidate: on default z-scored input pdist_cosine = 1 - Pearson r (probe max deviation 7.8e-16), duplicating the correlation SPI up to an affine map;
    the ''nonlinear'' label is not supported for this metric.'
  - 'Candidate (labels): although non-negative (''unsigned''), the value is sign-sensitive: values in (1, 2] encode negative correlation, unlike magnitude-type
    unsigned SPIs. It is also a dissimilarity (larger = less coupled).'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - nonlinear_dependence
    - anm
    path: kernel
    reference: 'from-scratch numpy loop over row pairs: 1 - x.y / (norm(x) norm(y)) (no sklearn, no scipy.spatial)'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: PairwiseDistance(metric).multivariate(Data(x, normalise=False)) equals the numpy reference off the diagonal to rel 1e-12 at every
      T
  - datasets:
    - var2_bivariate
    - gauss_ar1_pair
    - iid_gaussian
    path: pipeline
    reference: A versus A.T (direction convention) and A[i,j] versus the numpy reference d(z_i, z_j) on the z-scored rows
    reference_kind: analytic
    criterion: direction
    expected_outcome: 'A[i,j] = A[j,i] = d(z_i, z_j): symmetric, no direction; diagonal NaN after Calculator; reciprocal entries bit-identical'
  - datasets:
