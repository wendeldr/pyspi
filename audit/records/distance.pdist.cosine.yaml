optimisation:
  complexity_P_T: 'O(P^2 T) in one call (pyspi/statistics/distance.py:PairwiseDistance.multivariate -> sklearn pairwise_distances, compiled scipy/sklearn
    kernel), but at EEG sizes the fixed per-call cost dominates: measured 0.70 ms at 8x1024 and 1.77 ms at 118x1024 (P_exponent 0.02-0.45, T_exponent
    about 0.1 between 8x256 and 8x1024).'
  hotspot_1: 'sklearn/metrics/pairwise.py:check_pairwise_arrays -> sklearn/utils/validation.py:check_array (third-party:sklearn) 22.3% of the profiled SPI call at 8x1024 (1.30 ms profiled; called from cosine_similarity): fixed per-call input validation, the largest deep frame at 8x1024. Everything runs under the sklearn/utils/_param_validation.py:wrapper (about 95%, a wrapper). At 118x1024 the compute grows with P^2 and this fixed cost becomes a small share'
  hotspot_2: 'sklearn/preprocessing/_data.py:normalize (third-party:sklearn) 19.3% (row normalisation, with its own check_array); cosine_distances 57.7% includes the validation above'
  hotspot_owner: third-party:sklearn
  opaque_share: 0.2525
  profile_file: audit/profiles/distance.pdist.cosine__8x1024.pstats
  no_opportunity_reason: 'No opportunity is listed: pdist is one compiled call per window, and the six pdist units together cost about 24 ms per 118x1024 window (about 14 core-seconds per 600-window patient). Calling scipy pdist + squareform directly would skip sklearn''s validation, a few percent of the call at 118x1024, and is not material at these walls (notes/pdist.md, Optimisation, Opportunities).'
  opportunities: []
