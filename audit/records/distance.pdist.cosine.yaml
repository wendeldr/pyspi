  identifier_exceptions: ''
  what_changed: 'None in the formula (canonical cosine distance; on ddof=1 z-scored rows it equals 1 - Pearson r to 4.4e-16). It is therefore an affine
    map of the Pearson correlation: the ''nonlinear'' label does not describe it on default input, and values in (1, 2] encode negative correlation although
    the SPI is labelled unsigned. Score basis: 10 is applied with the floating-point tolerance read as rtol plus an absolute floor at the [0, 2]
    value scale. pyspi agrees with the canonical 1 - S definition evaluated from definition to <= 4.4e-16 absolute on every input, including
    near-identical rows. Its relative error against a cancellation-free reformulation reaches 1.0 when the true distance is 4.95e-19 (near run), and
    the canonical formula evaluated directly shows the same cancellation, so this is the conditioning of 1 - cos itself, not a pyspi deviation. This
    differs from distance.pdist.euclidean (score 9): there pyspi''s dot-product expansion departs from the canonical direct-difference form, with
    absolute error 1.56e-07 that fails atol 1e-12 on the near and dup runs. pdist is absent from the supplement, so the anchor-10 supplement clause
    is met only through the GitBook description (sklearn pairwise_distances, metric cosine); this applies to the whole pdist family and is left to
    synthesis.
    Rubric reading is nearest-anchor 9 (score_rubric_note), because anchor 10''s 1e-8 relative bar fails on near-identical rows and the supplement does not
    mention pdist; the score-10 basis above is the original reasoning for score_0_10, and score_adjusted is 10 under R2 and R3.'
