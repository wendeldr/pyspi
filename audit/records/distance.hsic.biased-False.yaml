unit_id: distance.hsic.biased-False
status: profiled
correctness:
  metric_name_standard: normalised unbiased HSIC with a Gaussian median-heuristic kernel (kernel analogue of bias-corrected dCor^2;
    an unbiased-centred kernel alignment)
  canonical_ref: 'HSIC: Gretton, Bousquet, Smola & Scholkopf 2005, ALT, LNCS 3734:63-77 (HSIC_b = (m-1)^-2 tr(KHLH)); Gretton et al.
    2007, NIPS 20 ''A kernel statistical test of independence'' (= supplement ref [15]): eq. (2) population HSIC, eq. (3) unbiased estimator
    as a sum of three U-statistics, eq. (4) biased HSIC_b = m^-2 tr(KHLH); Sec. 4 Gaussian kernel with ''kernel size set to the median
    distance between points in input space'' (whether per variable is not stated); unbiased estimator in matrix form: Song, Smola, Gretton,
    Bedo & Borgwardt 2012, JMLR 13:1393-1434, eq. (5) (numerically identical to Gretton 2007 eq. (3): brute-force probe at m=9 differs
    by 1.8e-16); kernel/distance equivalence: Sejdinovic et al. 2013, Ann. Statist. 41(5):2263-2291; normalisation used here: Shen &
    Vogelstein 2020 (hyppo docs) / centred kernel alignment (Cortes, Mohri & Rostamizadeh 2012, JMLR 13:795-828)'
  canonical_definition: 'Unbiased HSIC (Song et al. 2012 eq. 5): with K~, L~ = Gram matrices with zeroed diagonal, HSIC_u = [tr(K~L~)
    + 1''K~1 1''L~1/((n-1)(n-2)) - 2/(n-2) 1''K~L~1] / (n(n-3)); Gaussian kernel k(x,x'') = exp(-|x-x''|^2/(2 sigma^2)) with sigma =
    median inter-sample distance (Gretton et al. 2007 Sec. 4; applying it separately to each variable is the common reading, not stated
    explicitly there). Song eq. (5) equals the three-U-statistic estimator of Gretton et al. 2007 eq. (3). The quantity is an unnormalised
    dependence measure (HSIC itself, not a correlation).'
  documented_definition: 'supplement §1.2.5, p.6: ''The Hibert-Schmidt Independence Criterion (HSIC) [15] is an RKHS-based statistic
    that quantifies a statistical dependence between random variables via a sample kernel matrix. As with distance correlation, HSIC
    yields a biased statistic, where the unbiased (and consistent) estimator can be derived by double centering the kernel distance
    matrix [15]. Both biased and unbiased estimators are computed using hyppo'' (identifier 29, hsic). GitBook distance-similarity.md
    ''Hilbert-Schmidt Independence Criterion'' (ref Gretton et al. NIPS 2007). GitBook glossary-of-terms.md:21 (keyword table, ''Signed''
    row): ''Other SPIs, such as distance correlation (defined in the range [0,1]) are unsigned.'''
  delegate_lib: hyppo==0.5.2 hyppo.independence.Hsic(bias=False).statistic -> hyppo.tools.compute_kern (median heuristic) -> scikit-learn==1.9.1
    pairwise_kernels('rbf') -> hyppo Dcorr(bias=False, compute_distance=None).statistic (numba _dcorr)
  implemented_as: 'Default preprocessing: z-score (ddof=1), no detrend. T time points treated as iid 1-D samples. sigma = median of
    the off-diagonal |x_i - x_j| of x (the FIRST argument, i.e. the lower-index process after the mirror) and gamma = 1/(2 sigma^2)
    is used for BOTH Gram matrices (med = 1 if the median is 0). D = 1 - K (max K = 1 on the diagonal) is U-centred and stat = <U(Dx),U(Dy)>/sqrt(<U(Dx),U(Dx)>
    <U(Dy),U(Dy)>) with no square root. Since U-centring removes the constant and D has zero diagonal, this equals HSIC_u(K,L)/sqrt(HSIC_u(K,K)
    HSIC_u(L,L)) of Song et al. (probe: 0.7662620588623132 both ways). Returns 0 if a centred variance <= 0. Upper triangle mirrored.'
  implementation_trace:
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend only if detrend=True (default False), then scipy.stats.zscore(axis=1,
    ddof=1) if normalise=True (default); stored as (M, T, 1)'
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, nan) (lines
    at HEAD a42ebc1, unchanged since a1f20c7; the trace cited the pre-a1f20c7 lines 294/297)
  - 'pyspi/base.py:132-138 Undirected.multivariate: A = Directed.multivariate(data); li = tril_indices(-1); A[li] = A.T[li] (lower triangle
    overwritten by upper triangle)'
  - 'pyspi/base.py:84-94 Directed.multivariate: for every ordered pair i != j, A[i, j] = self.bivariate(data, i=i, j=j) (both triangles
    are computed)'
  - 'pyspi/base.py:27-49 parse_bivariate: two raw arrays are wrapped into a Data object (which z-scores) and i, j = 0, 1'
  - pyspi/data.py:108-118 Data.to_numpy returns the (M, T, 1) array, so x, y = data.to_numpy()[[i, j]] are (T, 1) column arrays (T samples
    of a 1-D variable)
  - 'pyspi/config.yaml:167-177 HilbertSchmidtIndependenceCriterion configs: biased False / biased True'
  - pyspi/statistics/distance.py:54-57 HilbertSchmidtIndependenceCriterion.__init__ stores biased; identifier += '_biased'
  - 'pyspi/statistics/distance.py:59-63 HilbertSchmidtIndependenceCriterion.bivariate: x, y = data.to_numpy()[[i, j]]; stat = Hsic(bias=self._biased).statistic(x,
    y)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hsic.py:83-92 Hsic.__init__: compute_kernel=''gaussian'', is_kernel=False,
    bias stored'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hsic.py:113-119 Hsic.statistic: kernx, kerny = compute_kern(x, y, metric=''gaussian'');
    distx = 1 - kernx/max(kernx); disty = 1 - kerny/max(kerny) (max = 1, the diagonal)'
  - '.venv/lib/python3.12/site-packages/hyppo/tools/common.py:321-333 compute_kern: if ''gamma'' not in kwargs, med = median of the
    off-diagonal entries of pairwise_distances(x, ''l2'') -- x ONLY; med = med if med else 1; kwargs[''gamma''] = 1/(2 med^2)'
  - '.venv/lib/python3.12/site-packages/hyppo/tools/common.py:342-343 compute_kern: simx = pairwise_kernels(x, ''rbf'', gamma) and simy
    = pairwise_kernels(y, ''rbf'', gamma) -- the same gamma (bandwidth of x) is used for y'
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/pairwise.py:1583-1627 rbf_kernel: K = exp(-gamma * ||x - y||^2) via euclidean_distances(squared=True)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hsic.py:121-122 Hsic.statistic: stat = Dcorr(bias=self.bias, compute_distance=None).statistic(distx,
    disty) -- the kernel-induced distances are fed to the distance-correlation code'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:141-149 Dcorr.statistic with is_distance=True: no distance computation,
    straight to _dcorr'
  - .venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:261-281 _center_distmat (double centring if bias, U-centring with
    zero diagonal otherwise)
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:416-449 _dcorr: stat = covar/sqrt(varx*vary) (443); sqrt only when
    bias=True (446-447); 0 if a variance <= 0 (438-439)'
  deviation_from_documented: '(a) The supplement and GitBook describe HSIC as ''an RKHS-based statistic'' with biased and unbiased estimators;
    neither says that the returned value is NORMALISED (HSIC(x,y)/sqrt(HSIC(x,x) HSIC(y,y)), a correlation-like number), nor that the
    Gaussian kernel bandwidth is the median heuristic computed from the first argument only and reused for the second. (b) ''the unbiased
    (and consistent) estimator can be derived by double centering the kernel distance matrix [15]'': citing [15] for an unbiased estimator
    is supported, since Gretton et al. 2007 eq. (3) is an unbiased U-statistic estimator (eq. (4) is the biased one). The deviation
    is the ''double centering'' wording only: the code''s unbiased estimator U-centres 1-K (equal to Gretton 2007 eq. (3) and Song et
    al. 2012 eq. (5) before normalisation), and double centring is what the biased variant does. (c) Labelled ''undirected'' but the
    bivariate value depends on argument order (made symmetric only by mirroring). (d) The unbiased value is on the squared-correlation
    scale while hsic_biased is square-rooted; the documentation presents them as two estimators of one quantity. (e) Labelled ''unsigned''
    (config.yaml keywords; the GitBook glossary, glossary-of-terms.md:21, defines unsigned SPIs by the example of distance correlation
    ''defined in the range [0,1]'') but can be negative.'
  deviation_from_canonical: '(1) Normalised: returns HSIC_u(x,y)/sqrt(HSIC_u(x,x) HSIC_u(y,y)), not HSIC_u (probe: 0.7663 vs raw HSIC_u
    0.0570 on the same arrays); dimensionless, bounded. (2) Bandwidth: median heuristic computed from x only and applied to y (hyppo/tools/common.py:321-333,
    342-343); a separate median for each variable (the common reading of Gretton et al. 2007 Sec. 4, which does not state it explicitly)
    would give 0.7720 instead of 0.7663 on the probe pair (x ~ N(0,1), y = exp(x) + noise). (3) Consequently the estimator is not symmetric
    in (x, y). The unbiased centring itself matches Song et al. 2012 eq. (5), equivalently Gretton et al. 2007 eq. (3), exactly.'
  units_and_range: 'dimensionless; in [-1, 1] (Cauchy-Schwarz in the U-centred inner product); negative under independence (probe: 66%
    of 200 iid pairs at T=64 negative, min -0.0321; pyspi matrix entries -0.0027, -0.00095); 0 if a centred variance <= 0; invariant
    to a common positive scaling of x and y and to shifts, NOT invariant to rescaling y relative to x (probe with normalise=False: 0.791
    -> 0.353 when y is multiplied by 10), though default z-scoring removes pure scale differences.'
  direction_convention: 'undirected by mirroring only: bivariate(x, y) != bivariate(y, x) (probe on z-scored x0 ~ U(-1,1) vs x0^2 +
    noise: 0.3029364702 vs 0.3266473096); Undirected.multivariate (base.py:136-137) keeps the upper triangle, so A[i, j] = A[j, i] =
    bivariate(x = process min(i, j), y = process max(i, j)) and the bandwidth is that of the lower-index process; the value therefore
    depends on process ordering.'
  symmetry_expected: sym
  already_documented: 'partly: the class ''unsigned label on a legitimately negative bias-corrected estimator'' is documented for other SPIs in REVIEW M7 (docs/storage_comparison/REVIEW.md:189-193, negative debiased dspli/dswpli/ppc estimates are valid; metadata should separate an unsigned population target from the estimator range), REVIEW M8 (REVIEW.md:197, pec/pec_log negative despite unsigned) and EEG_OPTIMIZATION_NOTES.md:169 (review topic ''legitimate negative estimates''); none of them names hsic. The double work of the generic Undirected path is EEG_OPTIMIZATION_NOTES.md:132. The order dependence, the undocumented normalisation and the scale mismatch are not in KNOWN_ISSUES.md'
  new_finding_candidates:
  - 'Candidate (order dependence): the Gaussian bandwidth is the median distance of the first argument only and is reused for the second
    (hyppo/tools/common.py:323-333 sets kwargs[''gamma''] from x; 342-343 apply it to x and y). Probe: bivariate(0,1) = 0.3029 vs bivariate(1,0)
    = 0.3266 (7.8% relative) on z-scored uniform vs squared-uniform series; the pyspi matrix reports 0.302936 (upper-triangle value),
    so permuting the process order changes the reported hsic value. Not covered by REVIEW M1 (tests/README.md bug 5 before b2f6d7e; it concerns
    classes that bypass the mirror; this class is mirrored but the kernel itself is asymmetric). Framed as a deviation from the usual
    per-variable median practice; Gretton et al. 2007 Sec. 4 does not state per-variable medians explicitly.'
  - 'Candidate (normalisation not documented): the returned value is normalised HSIC (hsic.py:118-122 feeds 1 - K/max K into Dcorr,
    whose _dcorr divides by sqrt(varx*vary)); probe: 0.7663 vs raw unbiased HSIC 0.0570. The supplement/GitBook describe plain HSIC.'
  - 'Candidate (scale mismatch with hsic_biased): no square root for bias=False (dcorr.py:446-447), so hsic is on the squared scale
    and hsic_biased on the root scale (probe pair: 0.3029 vs 0.5561).'
  - 'Candidate (relative-scale dependence when normalise=False): because y is kernelised with x''s bandwidth, hsic changes when y alone
    is rescaled (probe, normalise=False: y*1 -> 0.7908, y*10 -> 0.3527, y*0.1 -> 0.7476), whereas dcorr is unchanged (0.8288 in all
    three). With the default z-scoring only differences in distribution shape remain.'
  - 'Candidate (sign label): labelled ''unsigned'' (config.yaml; GitBook glossary-of-terms.md:21 describes unsigned SPIs with distance
    correlation ''defined in the range [0,1]'') but negative values are returned under independence (66% negative at T=64 in the probe).'
