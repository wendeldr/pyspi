  deviation_from_documented: '(1) Direction: documented rows = sources (glossary-of-terms.md:27); implemented A[i, j] = GC
    j -> i. Probe var2_bivariate (0 -> 1 only) T=4096: A[0,1]=0.0138, A[1,0]=0.2496. (2) "VAR model is estimated via least
    squares": nitime solves the block Yule-Walker equations with the LWR recursion on autocovariances with divisor N-k (nitime/utils.py:2170-2176),
    not OLS; with that divisor the autocovariance sequence need not be positive definite and det(ecov) can be negative. (3)
    "parametric implementation from v0.9 of NiTime": installed nitime 0.12.1. (4) Frequency grid: documented 125 bins on [4/T,
    fs/2]; implemented 513 freqz points omega_k = pi k/513 (f = k/1026) labelled k/1024, so the label 0.5 is the point 0.49903
    and the label 0.25 is 0.24951 (probe). (5) Identifiers "fmin-0" run with fmin = 1e-5, which drops only the DC point. (6)
    Identifier: the full-band configs produce sgc_parametric_{mean,max}_fs-1_fmin-1e-05_fmax-0-5_order-1, while the supplement
    lists ..._fmin-0_fmax-0-5_order-1 (same computation). (7) Documented "unsigned" but negative values occur when the LWR
    noise covariance is not positive definite (see units_and_range).'
  deviation_from_canonical: 'Per-frequency formula is Geweke 1982 (nitime autoregressive.py:485-509, standard rotated-noise
    form). Value-changing differences: VAR coefficients from LWR on the N-k-divisor, non-demeaned autocovariances instead
    of OLS or the positive-definite biased (divisor N) Yule-Walker; evaluation grid off by a factor 1024/1026 relative to
    its labels; pairwise bivariate VAR. Fixed order 1 underfits processes needing longer lags (var2_bivariate has order 2;
    delayed_noise needs >= 5), so the spectral shape is that of the VAR(1) approximation; this is a modelling choice, not
    a formula deviation. Band mean/max is a pyspi construction.'
  units_and_range: 'nats; canonical spectral GC is >= 0, but here the parametric values are not clipped: negative values and
    NaN (log of a negative ratio) occur when the LWR noise covariance is indefinite (gamma - upsilon^2/sigma < 0 or sigma
    < 0). Probe: delayed_noise T=64 order 1, 8.3% of per-frequency values negative (min -6.2e-5) and 8.3% NaN; one cell NaN
    by the 50% rule. Directed, asymmetric; diagonal NaN; on any ValueError the whole table is NaN in the Calculator (via a
    TypeError raised by the handler at spectral.py:439), and a direct multivariate() call raises TypeError.'
  direction_convention: 'A[i, j] = spectral GC from process j (source, column) to process i (target, row), i.e. TARGET-by-SOURCE,
    the transpose of the documented sources-in-rows convention (GitBook glossary-of-terms.md:27) and of other pyspi directed
    SPIs (e.g. infotheory.py:274 src, targ = data[[i, j]]). Derivation: nitime gc_xy[i,j] = f_x_on_y = GC i -> j (granger.py:172,
    autoregressive.py:501-509); pyspi F[a,b] = a -> b (spectral.py:400-406) then cache[0,f,a,b] = F[b,a,f] (spectral.py:408),
    so A[a,b] = GC b -> a. Empirical: var2_bivariate A[1,0] > A[0,1] at T = 256, 1024, 4096 (truth 0 -> 1); delayed_noise
    T=1024 large entries in column 0.'
  symmetry_expected: asym
  already_documented: 'no entry in KNOWN_ISSUES.md is specific to the parametric path. Observation only, outside KNOWN_ISSUES.md:
    tests/README.md:249 records the six sgc_parametric_*_order-20 goldens as partial_nan at small size (5 x 64), without a
    cause; the order-20 record gives the cause. DEPENDENCY_COMPATIBILITY_REVIEW.md band forwarding/Nyquist notes concern spectral_connectivity,
    not nitime.'
  new_finding_candidates:
  - 'CANDIDATE (direction): A[i, j] = GC j -> i (target-by-source), opposite to the documented convention. Evidence: nitime
    granger.py:172-173 gc_xy[i,j] = f_x_on_y (i -> j); spectral.py:401-408 F[a,b] = a -> b then transpose axes [3,2,1,0] gives
    cache[0,f,a,b] = F[b,a,f]; probe var2_bivariate (truth 0 -> 1) A[1,0] >> A[0,1] at T = 256, 1024, 4096; delayed_noise
    T=1024 order-20 column 0 = 3.86, 3.03, 4.00 vs row 0 <= 0.06.'
  - 'CANDIDATE (sign): "unsigned" SPI returns negative values; nitime does not clip and LWR on N-k-divisor autocovariances
    (utils.py:2176 prod.mean over N-k samples) can give an indefinite noise covariance (probe min det(ecov) -0.391 iid_gaussian
    T=64 order 20; sigma = -0.89). '
  - 'CANDIDATE (offset sensitivity): nitime autocovariances are not demeaned (nitime/utils.py:2172-2176), so with normalise=False
    an offset changes the result. Probe var2_bivariate T=1024 scaled+offset (x*[2,0.5] + [3,-5]), normalise=False: order-1
    A[1,0] 0.0432 vs 0.2886 z-scored (order-20 0.4240 vs 0.3275); scaling alone 0.2881 (invariant up to the removed sample
    mean). Nonparametric path unaffected (0.4361 vs 0.4362).'
  - 'CANDIDATE (grid labels): freqz grid omega_k = pi k/513 labelled k/1024 (probe: label 0.25 -> actual 0.24951, label 0.5
    -> 0.49903, max error 9.7e-4); band edges therefore slightly shifted; Nyquist never evaluated.'
  - 'CANDIDATE (all-or-nothing failure with a broken handler): any ValueError in one pair (for a fixed order: singular LWR
    in lwr_recursion via scipy.linalg.inv) aborts the whole SPI, losing every other pair. The handler at spectral.py:438-440
    is meant to return an all-NaN P x P matrix, but warnings.warn(err) at :439 passes an exception instance as the message
    and raises TypeError under the message-regex warnings filters numpy installs on import (numpy/__init__.py:696-698 message-regex filters); a direct multivariate()
    call therefore raises TypeError, and Calculator.compute (calculator.py:336-337) turns it into an all-NaN table whose warning
    names TypeError, not the nitime/scipy message. Probe shared_envelope T=256 order 1, filters as installed by numpy on import: TypeError "expected
    string or bytes-like object, got LinAlgError" at spectral.py:439; inside catch_warnings(record=True)+simplefilter("always")
    the same call returns 100% NaN with the warning "A singular matrix detected: slice(s) [0] are singular."; pair (0,2) is
    the identical-channel pair.'
