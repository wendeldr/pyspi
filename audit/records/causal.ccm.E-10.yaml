      (CCM does not expand ties, EDM_Neighbors.cc L282), so no order-independent reference reproduces that column (probes
      fable_dt3/fm2.py, fable_recheck_cdt_ccm_gwtau/ccm_tie_probe.py); this further favours the chaotic-driver dataset for
