    reference: 'Sugihara 2012 criterion on a system with known coupling (logistic_maps: process 1 (y) drives process 0 (x));
      pyspi direction convention established from TransferEntropy/Granger (A[i,j] = i->j, infotheory.py:377-383) on var2_bivariate
      (0 -> 1)'
    reference_kind: analytic
    criterion: direction
    expected_outcome: 'A_mean[0,1] > A_mean[1,0] and diff[0,1] > 0 on logistic_maps at T in {1024, 4096} (probe at T=256,
      E=1: 0.5484 vs 0.2913; E=2: 0.7415 vs 0.3226), i.e. a large A[i,j] means j -> i, the transpose of pyspi''s TE/GC orientation.
      Caveat: in logistic_maps the uncoupled driver y (r=3.5) is periodic; repeat on a check-generated chaotic-driver Sugihara
      system before relying on it. Second caveat: on logistic_maps the A[1,0] curve (embedding of the period-4 process 1)
