    expected_outcome: 'mean == nanmean(ccmf, 2), max == nanmax(ccmf, 2), diff == mean - mean^T (|diff| < 1e-15) and diff antisymmetric;
      ccmf shape (M, M, 22); at T=64 the curve covers only the first 22 of the cppEDM sizes (E=1: 10..52 of 10..60; E=10:
