optimisation:
  complexity_P_T: 'O(P^2 S L_n T L) ~ O(P^2 T^2): one pyEDM.CCM call per unordered pair (pyspi/statistics/causal.py:118-144), each cross-mapping both directions over S = 100 random libraries for each of L_n = 22 library sizes (L up to about T) with k-NN search over the library for about T prediction rows. Per-pair T exponent from 7x100 (golden data) to 8x256 (synthetic): 1.75; the check stage''s single E=10 pair took 85 s at T=1024 alone, which implies about 2.3 between T=256 and 1024, so the estimate is a lower bound. summary.json has no 118 projection (8x1024 skipped-budget): ESTIMATE 2.8e5 s per window at 118x1024 = per-ordered-pair 20.2 s at T=1024 x 13,806 ordered pairs (family-warm), the 85 s check-stage pair would give 5.9e5 s; pair term dominates.'
  hotspot_1: ~:<built-in method pyBindEDM.CCM> (third-party:pyEDM, C++ cppEDM via pyEDM/CoreEDM.py:CCM) 99.9% of the profiled SPI call at 4x256 (6 calls, one per unordered pair)
  hotspot_2: pyEDM/AuxFunc.py:GetDF / pandas DataFrame construction (third-party:pyEDM, third-party:pandas) about 0.1% of the profiled SPI call at 4x256; nothing else outside the C++ call is visible
