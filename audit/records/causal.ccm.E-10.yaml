    risk_evidence: 'check stage: ccm_E-None_* is bitwise equal to ccm_E-10_* because embed_df.max()["E"] is always 10 (known bug 2), so the reused curve is the one E-10 computes; the saving goes to whichever of E-None and E-10 runs second on a Data (E-10 in the config order) and disappears if the E-selection rule is changed'
