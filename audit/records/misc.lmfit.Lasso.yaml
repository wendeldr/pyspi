optimisation:
  complexity_P_T: 'O(P^2 T) for the arithmetic, but a T-independent per-call overhead dominates: one sklearn Lasso fit + predict + mean_squared_error per ordered pair (pyspi/statistics/misc.py:115-126, inspect.signature per pair at line 120). Measured P_exponent 2.06, T_exponent 0.02. Pair term dominates; measured 11.1 s per window at 118x1024 (family-warm, measured).'
  hotspot_1: sklearn/utils/validation.py:check_array (third-party:sklearn) 36.8% of the profiled SPI call at 8x1024 (input validation incl. narwhals dataframe detection and finite checks); coordinate-descent enet_path is 9.9%
  hotspot_2: 'sklearn/metrics/_regression.py:mean_squared_error (third-party:sklearn) 21.3% of the profiled SPI call at 8x1024; inspect.signature (Python stdlib) 11.8% in all, of which 6.0% is called per pair from pyspi/statistics/misc.py:bivariate (line 120), 3.6% sits inside sklearn base._validate_params (get_params -> _get_param_names) and 2.2% inside the validate_params wrapper of mean_squared_error'
  hotspot_owner: third-party:sklearn
  opaque_share: 0.198
  profile_file: audit/profiles/misc.lmfit.Lasso__8x1024.pstats
  opportunities:
  - opportunity_id: lmfit-2
    opportunity: Lasso and ElasticNet with one regressor as a batched soft-threshold closed form from the same Gram matrix as lmfit-1, reproducing sklearn's initial duality-gap exit at w = 0 (on z-scored data Lasso returns the constant (T-1)/T and ElasticNet is censored below |r| ~ 0.51).
    opp_type: vectorise-batch
    expected_speedup: 1000-3000x
    speedup_basis: 'profile:audit/profiles/misc.lmfit.Lasso__8x1024.pstats base.py:multivariate 99.967% (the ordered-pair loop, replaced as a whole; misc.py:bivariate 99.74%: enet_path 9.9%, inspect.signature 11.8%, mean_squared_error 21.3%, the rest sklearn validation) -> Amdahl bound 3,030x at 8x1024; the remainder is a fixed cost (summary.json family-warm pairs fit t_fixed 1.0 ms of 11.1 s at 118x1024), so the bound at 118x1024 is about 1e4x + complexity: the replacement has the one-Gram-matrix structure of lmfit-1, measured at 3.5-3.8 ms per 118x1024 window (audit/profiles/micro/opp_lmfit-1.json and the reviewer re-runs); allowing an estimated 4-11 ms (not a timing; no candidate code exists) for the soft threshold and the duality-gap test gives 1000-3000x'
    output_risk: unverified-within-tolerance
    risk_evidence: 'the closed form must reproduce sklearn''s gap test at w = 0 (_cd_fast.pyx, exit band recorded in the ElasticNet check: |r| <= 0.5T/((T-1)(1 - sqrt(2e-4)))); outside it one cyclic update reaches the closed form, so only float-order differences are expected, but a pair at the band edge would jump by up to 4.8e-3; for Lasso at alpha = 1 on the default z-scored path every pair lies inside the exit band (|x^T y| = |r|(T-1) < T = l1_reg, implemented_as above), so the band edge cannot arise there; it matters for ElasticNet and for non-default inputs'
    effort: M
    depends_on: []
  - opportunity_id: lmfit-4
    opportunity: 'Strip per-call overhead around the unchanged sklearn fit: hoist inspect.signature(self._model) to __init__ (misc.py:120 runs it per pair), run fit/predict under sklearn.config_context(skip_parameter_validation=True, assume_finite=True), and compute the in-sample MSE with numpy instead of sklearn.metrics.mean_squared_error.'
