      scaling) and with var0(x_i) * (1 - r_ij^2) (predictor-variance scaling), numpy only'
    reference_kind: analytic
    criterion: direction
    expected_outcome: A[i, j] tracks var0(x_j) (column = target) and not var0(x_i); establishes the empirical convention A[i, j] = MSE of predicting j from i. For
      Lasso the raw-scale direction test works because inactive entries equal var0(x_j) exactly (column = target).
  check_method: analytic
  check_reference: audit/checks/refs/lmfit.py:h_exact (analytic constant (T-1)/T, cross-checked with refs/_kernels_basic_misc.py:lasso_1d_mse) and refs/lmfit.py:enet_sklearn_tol
