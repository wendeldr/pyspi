  check_data: 'pipeline: all 21 datasets x T in {64, 256, 1024, 4096}; pipeline-detrend: iid_gaussian, bivariate_gaussian, trending, cointegrated x {64, 1024, 4096};
    kernel/raw: scaled_offset, cointegrated, var2_bivariate, anm, bivariate_gaussian x {64, 1024, 4096}; probe probes/lmfit_params.py:lasso_params on bivariate_gaussian
    256, sparse_precision 64, shared_envelope 64; direction (raw) T=1024'
  agreement_criterion: exact (rtol 1e-10, atol 1e-12); params probe exact on (n_iter_, coef_, intercept_); qualitative raw-scale direction test
  closeness: 'constant 96/96 pass: every off-diagonal entry equals (T-1)/T within 4.44e-16 on the 84 default-path runs and within 3.55e-15 on the 12 pipeline-detrend
    runs (n_const = 864 of 864 entries); largest |r|(T-1)/T = 0.99976 < alpha = 1 (shared_envelope identical pair, T=4096); params 3/3 pass (n_iter_ 0 and coef_ 0
    on every pair, max_abs 0); raw 15/15 pass (max_rel 2.2e-16) with n_active = n_abs_cov0_gt_alpha_l1 (scaled_offset|1024: 2 of 12, cointegrated|1024: 12 of 12,
    bivariate_gaussian/anm/var2_bivariate: 0); direction 4/4 pass'
  verdict: degenerate
  score_0_10: 0
  score_rubric: 0
  score_rubric_basis: anchor
  score_rubric_note: 'Anchor 0: the value is the constant (T-1)/T on 864 of 864 entries (96/96 runs, max deviation 3.55e-15).'
  documentation_status: silent
  verdict_adjusted: degenerate
  score_adjusted: 0
  score_adjustment_rules: ''
  score_adjustment_reason: ''
  identifier_exceptions: ''
  what_changed: The lasso estimator is sklearn's penalised form of Tibshirani 1996 and agrees with the analytic soft-threshold solution, but with alpha = 1 and sklearn's 1/(2T) loss scaling the coefficient of a standardised predictor is zero
    whenever |r|(T-1)/T <= 1, which always holds; coordinate descent exits at iteration 0 and the prediction is the target mean, so the SPI is the data-independent
    constant (T-1)/T on every dataset, at every T and under detrending. The SPI is also absent from the supplement ("four SPIs") and the GitBook. On raw (normalise=False)
    data it fits only pairs with |cov0| > 1. As a practical consequence for the EEG data, lmfit_Lasso is in the retained EEG-185 set (audit/env/retained_metrics.txt:82),
    and on the EEG workflow preprocessing (detrend then z-score) it is the same constant (T-1)/T (the 12 pipeline-detrend constant runs pass with the
    84 pipeline runs, 96/96, max_abs 3.55e-15), so it stores no information.
  new_finding: true
  definition_under_review: false
  check_cost: 'cheap: <= 0.020 s per pyspi run; all 122 Lasso runs about 1 s of pyspi time'
  symmetry_observed: 'sym on the default (z-scored) path: max|A - A.T| <= 6.7e-16 over the 84 pipeline runs (iid_gaussian|64|pipeline|constant) and <= 4.9e-15 on
    pipeline-detrend (trending|4096|pipeline-detrend|constant); asym on raw (kernel) data, where A[i, j] is in units of var0(x_j) (max|A - A.T| 3.88e3 on cointegrated|4096|kernel|raw);
    on the default path trivially symmetric because every entry is (T-1)/T'
  direction_observed: 'A[i, j] = in-sample MSE of predicting process j (target, column) from process i (predictor, row); lower = more linearly predictable. Raw-scale
    direction runs (misc.lmfit.Lasso|{scaled_offset,var2_bivariate,anm,cointegrated}|1024|kernel|direction, 4/4 pass): pyspi equals the from-scratch f(x_i -> x_j)
    to max_rel <= 2.0e-16 and differs from f(x_j -> x_i) by max_rel 0.0375 (var2_bivariate) to 2477 (scaled_offset). On the default z-scored path the matrix is symmetric,
    so on the direction datasets (delayed_noise, var2_bivariate, logistic_maps_chaotic, anm) A[i, j] = A[j, i] to <= 7.8e-16 and the value carries no causal direction.
    For Lasso the default-path value is the constant (T-1)/T, so no orientation is visible at all.'
