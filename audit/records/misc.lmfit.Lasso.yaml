    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: max relative difference <= 1e-8 (coordinate descent stops on a duality-gap tolerance, tol=1e-4 * y@y, so a nonzero-coefficient fit may differ
      slightly from the exact minimiser); confirms the scale-dependent activation |cov0| > 1
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - anm
    path: pipeline
    reference: 'analytic: A[i, j] depends only on (r_ij, T) after z-scoring, so A must equal A.T; compute max |A - A.T| off the diagonal'
    reference_kind: analytic
    criterion: exact
    expected_outcome: 'max |A - A.T| <= 1e-12 at every T (probe: <= 7.8e-16 on iid_gaussian, bivariate_gaussian, delayed_noise, nonlinear_dependence, anm, scaled_offset);
      confirms that the "directed" label carries no directional information under default preprocessing'
