unit_id: misc.lmfit.Lasso
status: profiled
correctness:
  metric_name_standard: in-sample mean squared error of a lasso regression (alpha = 1, sklearn scaling 1/(2T)) of y = x_j on x = x_i
  canonical_ref: 'Tibshirani 1996, J. R. Stat. Soc. B 58(1):267-288, lasso estimator and its soft-threshold solution for orthonormal design (section 2.2); scikit-learn
    objective (1/(2 n_samples)) ||y - Xw||^2_2 + alpha ||w||_1 (sklearn/linear_model/_coordinate_descent.py:1334); coordinate descent: Friedman, Hastie & Tibshirani
    2010, J Stat Softw 33(1)'
  canonical_definition: 'single centred predictor: w = S(sum(xc*yc)/T, alpha) / (sum(xc^2)/T) with S(u, a) = sign(u) max(|u| - a, 0); b = ybar - w xbar; MSE = (1/T)
    sum (y - b - w x)^2. For z-scored (ddof=1) inputs and alpha = 1: |sum(xc*yc)/T| = |r|(T-1)/T < 1 always, so w = 0 and MSE = (T-1)/T for every pair'
  documented_definition: 'Not documented. supplement §1.6.1, p.18 (supplement.txt lines 856-868; the briefing pack gives 874-887, which is off by 18 lines): "we use
    a number of linear models and record the mean squared error (MSE) of a regression of y on x. The following models (with the default parameters) from scikit-learn
    [2] are included: stochastic gradient descent regression with a squared loss (ordinary least squares fit) function (denoted by modifier SGDRegressor); Ridge regression, which uses
    l2-norm regularization (Ride); the Elastic-Net model [76, 77], which uses both l1 and l2-norm regularization (ElasticNet); and the Bayesian Ridge regressor uses
    a gamma distribution prior (with lambda1 = lambda2 = 1e-6) for the l2-norm regularizor in Ridge regression (BayesianRidge). This yields four SPIs: 215. lmfit_SGDRegressor
    216. lmfit_Ridge 217. lmfit_ElasticNet 218. lmfit_BayesianRidge"; keywords "directed, linear, unsigned, bivariate, contemporaneous"; rationale "Linear regression
    is commonly used for establishing independence through model fits (e.g., see additive noise models in Sec. 1.3.1)". GitBook spi-descriptions/miscellaneous.md
    "Linear Model Fit" repeats the text verbatim (including the typo "Ride") and lists the same four identifiers. The supplement says "This yields four SPIs" and
    neither it nor the GitBook mentions Lasso or lmfit_Lasso; the identifier exists only through pyspi/config.yaml:1275.'
  delegate_lib: scikit-learn==1.9.1 sklearn.linear_model.Lasso(random_state=42).fit -> ElasticNet.fit (l1_ratio=1.0) -> enet_path -> _cd_fast.enet_coordinate_descent
    (Cython); sklearn.metrics.mean_squared_error; numpy==2.5.4
  implemented_as: 'A[i, j] = in-sample MSE of the alpha=1 lasso fit of z_j on z_i. sklearn multiplies alpha by n_samples before coordinate descent (l1_reg = alpha*l1_ratio*T,
    _coordinate_descent.py:783), and the initial duality-gap check at w = 0 already satisfies gap <= tol because |x^T y| = |r|(T-1) < T = l1_reg, so the solver returns
    at iteration 0 with coef_ = 0 (probe: Lasso n_iter_ 0, coef_ [0.], dual_gap_ 0.0 on bivariate_gaussian_T256 pair (2,3) with r = 0.82). The prediction is the intercept
    mean(z_j) ~ 1e-17, so A[i, j] = mean(z_j^2) = (T-1)/T exactly for every pair: probe gives the constant 0.984375, 0.99609375, 0.9990234375, 0.999755859375 at T
    = 64, 256, 1024, 4096 on iid_gaussian, bivariate_gaussian (rho 0.8), delayed_noise, nonlinear_dependence, anm, scaled_offset and shared_envelope identical pair
    (max deviation 0.0). random_state=42 is passed but selection="cyclic", so the RNG (rng.randint seed, _cd_fast.pyx:374) is never used for ordering.'
  implementation_trace:
  - 'pyspi/config.yaml:1264-1278 .statistics.misc LinearModel: labels directed/linear/unsigned/bivariate/contemporaneous; configs model: Ridge, Lasso, SGDRegressor,
    ElasticNet, BayesianRidge (Lasso is the fifth, undocumented config)'
  - 'pyspi/calculator.py:230-267 Calculator._load_yaml (HEAD a1f20c7): for params in configs (252): spi = getattr(module, fcn)(**params) (256), i.e. LinearModel(model=...);
    self._spis[spi.identifier] = spi (257); the class attribute labels (misc.py:109) are what the calculator reports'
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False) (187), then scipy.stats.zscore(axis=1, nan_policy="omit",
    ddof=1) if normalise=True (default) (195); stored as (M, T, 1)'
  - 'pyspi/calculator.py:329-339 Calculator.compute (HEAD a1f20c7): S = self._spis[spi].multivariate(self.dataset) (329); np.fill_diagonal(S, np.nan) (332); any exception
    -> self._table[spi] = np.nan (336-337), so one failing pair makes the whole matrix NaN'
  - 'pyspi/base.py:84-94 Directed.multivariate: for j (outer), for i != j (inner): A[i, j] = self.bivariate(data, i=i, j=j); no mirroring'
  - 'pyspi/base.py:27-49 parse_bivariate: Data passed through unchanged (two raw arrays would be wrapped into a new z-scored Data with i, j = 0, 1)'
  - 'pyspi/data.py:108-118 Data.to_numpy(): returns the (M, T, 1) array, so z[i] is a (T, 1) design matrix with one feature'
  - pyspi/statistics/misc.py:106-109 class LinearModel(Directed, Unsigned); labels ["misc", "unsigned", "unordered", "normal", "linear", "directed"]
  - 'pyspi/statistics/misc.py:111-113 __init__: identifier "lmfit_<model>", self._model = getattr(sklearn.linear_model, model)'
  - 'pyspi/statistics/misc.py:117-124 bivariate: z = data.to_numpy(); warnings suppressed; if "random_state" in inspect.signature(model).parameters: model(random_state=42).fit(z[i],
    ravel(z[j])) else model().fit(z[i], ravel(z[j])) -> predictor = process i, target = process j'
  - pyspi/statistics/misc.py:125-126 y_predict = mdl.predict(z[i]); return mean_squared_error(y_predict, ravel(z[j])) -> in-sample (training) MSE on the same T samples
    used for fitting (argument order swapped, harmless because MSE is symmetric)
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_coordinate_descent.py:1329-1337 class Lasso(ElasticNet): objective (1/(2 n_samples)) ||y - Xw||^2_2
    + alpha ||w||_1; defaults alpha=1.0, max_iter=1000, tol=1e-4, selection="cyclic", random_state=None (probe inspect.signature)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_coordinate_descent.py:1501-1514 Lasso.__init__: super().__init__(..., l1_ratio=1.0, ...)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_coordinate_descent.py:1096-1294 ElasticNet.fit: _pre_fit centring (1212-1221), coef_ initialised to
    zeros (1233-1236), self.path(X, y, l1_ratio, alphas=[alpha], ...) (1248-1270), _set_intercept (1283)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:832 _pre_fit -> _preprocess_data (188-199): X and y centred, offsets stored'
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_coordinate_descent.py:477 enet_path; 757 rng = check_random_state(random_state); 781-784 l1_reg = alpha*l1_ratio*n_samples,
    l2_reg = alpha*(1-l1_ratio)*n_samples; 841-853 cd_fast.enet_coordinate_descent (precompute False)
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_cd_fast.pyx:243 enet_coordinate_descent; 391-400 tol *= y@y and duality gap at the initial w = 0: if
    gap <= tol return w (n_iter 0); 445-448 coordinate update w_j = sign(tmp) max(|tmp| - alpha, 0) / (||x_j||^2 + beta) (not reached here)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:301-316 LinearModel.predict -> _coordinate_descent.py:1301-1317 ElasticNet._decision_function (dense input: super()._decision_function, _base.py:291-299): X @ coef_ + intercept_'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:318-334 _set_intercept: intercept_ = y_offset - X_offset @ coef_ (unpenalised intercept)'
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/_regression.py:524-600 mean_squared_error: _average((y_true - y_pred) ** 2, axis=0) (586-588), divisor T'
  deviation_from_documented: '(a) The SPI is undocumented: supplement §1.6.1 lists four lmfit SPIs (215-218) and the GitBook four identifiers; lmfit_Lasso is a fifth
    produced by config.yaml:1275. (b) If read against the family description ("record the MSE of a regression of y on x"), the regression is degenerate: the coefficient
    is always exactly 0 on default-preprocessed data, so the output is the constant (T-1)/T and does not depend on the data at all. (c) "directed" label: trivially
    symmetric (constant).'
  deviation_from_canonical: 'The estimator itself is the canonical lasso (sklearn scaling, unpenalised intercept), which the checks reproduce; the deviation is in the choice
    alpha = 1: with sklearn''s 1/(2T) scaling the threshold for a nonzero coefficient on one standardised predictor is |r|(T-1)/T > 1, which is impossible, so the
    fitted model is always the intercept-only model and the SPI is the constant ((T-1)/T). With normalise=False the coefficient is nonzero only when the biased covariance
    |cov0(x_i, x_j)| > 1, which makes the SPI depend on the absolute scale of the raw data.'
  units_and_range: 'units of the target variance; on z-scored data exactly (T-1)/T for every off-diagonal entry (0.984375 at T=64 ... 0.999755859375 at T=4096), symmetric,
    no information; with normalise=False equals var0(x_j) unless |cov0(x_i, x_j)| > 1 (probe scaled_offset_T1024 raw: column values 0.0395, 4.058, 24.78, 97.89 =
    var0 of the target, except A[2,3] = 35.675 vs 97.894 and A[3,2] = 9.0302 vs 24.779 where |cov0| > 1); unsigned, >= 0.'
  direction_convention: 'A[i, j] = in-sample MSE of the linear prediction of process j (target, column) from process i (predictor, row), per misc.py:122-126; LOWER
    = j better linearly predicted from i. Code-derived; with the default z-scoring the matrix is symmetric (see units_and_range), so the direction is only empirically
    identifiable with normalise=False, where column j scales with var(x_j) (probe on scaled_offset_T1024: column means of A track std_j^2 = 0.0395, 4.058, 24.78,
    97.89).'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (degenerate constant SPI): lmfit_Lasso returns exactly (T-1)/T for every pair under default preprocessing, because alpha = 1 with sklearn''s 1/(2T)
    loss scaling exceeds the largest possible |x^T y|/T = |r|(T-1)/T < 1, so the duality gap at w = 0 is already zero (_cd_fast.pyx:391-400). Evidence: probe1.py
    "Lasso: maxdiff=0.00e+00 ... rng=[0.9961,0.9961]" on bivariate_gaussian_T256 (true rho 0.8 pair included) and on all other probed datasets/T; probe2.py "Lasso
    0 [0.] -1.39e-17 0.0" (n_iter_, coef_, intercept_, dual_gap_); probe4.py identical series (shared_envelope x0 = x2) also gives 0.9844 at T=64.'
  - 'Candidate (undocumented SPI): lmfit_Lasso is produced by pyspi/config.yaml:1275 but absent from supplement §1.6.1 ("This yields four SPIs") and from the GitBook
    identifier list.'
  - 'Candidate (scale-dependent behaviour without normalisation): with normalise=False the lasso is active only when |cov0(x_i, x_j)| > 1; probe scaled_offset_T1024
    raw shows A equals var0(target) in 10 of 12 entries and a real fit only for the high-variance pair (2,3).'
  - 'Candidate (documented rationale vs quantity): the supplement motivates lmfit by independence testing "through model fits (e.g., see additive noise models)",
    but the SPI is the raw in-sample MSE of a contemporaneous linear fit, which measures linear predictability (a transform of r^2 for the closed-form models), not
    residual independence; no residual-independence test is computed (misc.py:125-126).'
