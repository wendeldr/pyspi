  deviation_from_documented: '(1) Maximum embedding delay: the prose says ''maximum time delay of 2, tau-max-2'' (supplement §1.4.5 line 489, GitBook :216), but the SPI lists printed with it say tau-max-4 (supplement lines 495-496, GitBook :222-223); the code uses tau_search_max = 4 (config.yaml:562), matching the identifiers (check-stage correction: a slip inside the documentation, not a code deviation). (2) Window rule as in infotheory.theiler_window (int(Bartlett + 1), all lags, ∝ T on oscillatory input). (3) Undocumented: the window
    also changes the embedding search, and short or oscillatory series give NaN (probe p13 T=64: narrowband 6/6, logistic_maps 2/2, shared_envelope 6/12 pairs NaN). (4) Negative values despite ''unsigned''.'
  deviation_from_canonical: KSG1 TE with Theiler window and AIS-based embedding as in JIDT (from-scratch reproduction of embedding and value with the window, probe p6 gauss_ar1_pair 1->0 (1,1,2,2) 0.061885014901,
    logistic_maps (1,1,9,4) 0.049012628767). Canonical choice of embedding does not depend on the partner series; here it does via W. ψ(N) unadjusted for exclusion.
  units_and_range: nats; real, can be negative (probe p13 T=64 min -0.178 cointegrated); asymmetric; NaN for pairs where the AIS search hits N <= 4 + 2W
  direction_convention: 'A[i, j] = TE(x_i -> x_j): row = source, column = target (same code path as the non-DCE unit; probe p4 var2_bivariate T=1024 A[0,1] 0.132 vs A[1,0] 0.015). To be confirmed in the
    check stage.'
  symmetry_expected: asym
  already_documented: 'tests/README.md worth knowing: ''auto-embedding TE kraskov equals fixed k=1 on cml7'' (confirmed here: cml7 first 3 channels give k,kt,l,lt = 1,1,1,1 and te value equal to te_k1,
    probe p11)'
  new_finding_candidates:
  - 'CANDIDATE (new, confirmed by probe): copying a TransferEntropy SPI silently changes its configuration while keeping the identifier, and pickle and deepcopy lose different things. Pickle (TransferEntropy.__setstate__,
    infotheory.py:369-374) rebuilds the calculator through _getcalc/_setup, keeping k = prop_k and NOISE_SEED 42 but dropping AUTO_EMBED_METHOD and k_HISTORY/l_HISTORY (probe p9: k_HISTORY ''1'', AUTO_EMBED_METHOD
    ''NONE''). Deepcopy (JIDTBase.__deepcopy__, :77-82) deep-copies the JPype object, which yields a fresh Java calculator with JIDT constructor defaults: in addition to the embedding it loses NOISE_SEED
    (''NONE'', so the 1e-8 jitter is unseeded) and prop_k (JIDT default 4; harmless for these NN-4 units, not for NN-k with k != 4). CalculatorFrame.init_from_list deep-copies the base Calculator (calculator.py:556-563,
    deepcopy at :559), so a CalculatorFrame computes unseeded fixed k=1 TE under these identifiers. Probe p10 (repeated in scratchpad it_kraskov_fix/p_te_copy.py), var2_bivariate T=256, A[0,1]: te_kraskov_NN-4_k-max-10_tau-max-4
    Calculator 0.060599 vs CalculatorFrame/deepcopy/pickle 0.133643 (= te_k1 0.133643); te_kraskov_NN-4_DCE_k-2_kt-1_l-1_lt-1 Calculator 0.159244 vs deepcopy/pickle 0.134372. On tied input the deepcopy
    is also not reproducible: logistic_maps T=256 pair 1->0 te_auto original 0.101410 on every run, pickle 0.115063, three deep copies 0.114476/0.109197/0.111046 (scratchpad it_kraskov_fix/p_tied_dce.py).
    MI, TLMI and k=l=1 TE keep their values under pickle; under deepcopy they keep them only on tie-free data, because the lost NOISE_SEED then does not move any neighbour count (var2_bivariate diff 0.0).
    Cross-family: the same deepcopy path resets KERNEL_WIDTH to 0.25 for kernel SPIs (probe scratchpad it_kraskov_fix/r4_deepcopy.py: je_kernel_W-0.5 3.982283 -> 3.748712), for it_kernel to record.'
  - 'CANDIDATE: NaN for short or oscillatory series because the AIS candidate (k=10, tau=4) leaves N = T − 37 samples and JIDT requires N > 4 + 2W; one failing candidate aborts the search (ActiveInfoStorageCalculatorViaMutualInfo.java:609-612 at JIDT a9b6b3e).
    Probe p13 T=64: narrowband_f0-0.1/0.25/0.4 6/6 pairs NaN, logistic_maps 2/2, shared_envelope 6/12; probe p4 shows the stale embedding (1,1,1,1) reported after the failure.'
  - 'CANDIDATE: the Theiler window is forwarded to the AIS embedding search (TransferEntropyCalculatorViaCondMutualInfo.java:752-754 at JIDT a9b6b3e copies props), so the embedding depends on the partner channel: gauss_ar1_pair
    T=256 1->0 embedding (2,3,5,1) without and (1,1,2,2) with DCE (probe p4/p6); narrowband_f0-0.1 T=256 jumps to (10,4,10,4) for every pair with W=85.'
  - 'CANDIDATE (documentation): tau-max-2 documented, 4 implemented.'
  - 'CANDIDATE: the value depends on the machine''s core count at the 1e-14 level, because NUM_THREADS defaults to availableProcessors() (64 here) and per-thread digamma partial sums are added in thread
    order. Probe p2 (bivariate_gaussian T=1024): max |A(default) - A(NUM_THREADS=1)| = 7.1e-15 mi, 1.1e-14 mi_DCE, 1.6e-14 tlmi, 2.4e-15 te_k1, 4.2e-15 te_auto; repeat runs on the same machine are bit-identical.'
  - 'CANDIDATE: on tied or discrete-valued inputs the estimate is set by the 1e-8 jitter and its seed. Probe p12, logistic_maps T=256 (series 1 is the period-4 r=3.5 map, 4 distinct values): pair 1->0 for
    NOISE_SEED 42/43/44 gives mi 0.226622/0.226587/0.230899, tlmi 0.278902/0.276961/0.281417, te_k1 0.115063/0.113329/0.107266, te_auto 0.101410 (l,lt=7,2) / 0.089128 (10,2) / 0.044229 (6,1); bivariate_gaussian
