  proposed_checks:
  - datasets:
    - var2_bivariate
    - var2_chain
    path: kernel
    reference: 'analytic: true VAR(2) transfer matrix from the MANIFEST coefficients (Abar(f) = I - A1 e^{-i2pi f} - A2 e^{-i4pi f}, H = inv(Abar), S = H Sigma H^H on fftfreq(1024)) fed into spectral_connectivity.Connectivity
      via a subclass overriding _expectation_cross_spectral_matrix (only the factorisation + measure formula are under test); canonical measure computed in numpy from (Abar, H, Sigma); canonical gPDC with
      row (target) sigma_i in the numerator and sigma_k in the column sum'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: library generalized_partial_directed_coherence equals the canonical squared gPDC within 1e-12; column sums 1
  - datasets:
    - var2_bivariate
    - logistic_maps
    - delayed_noise
    path: pipeline
    reference: 'analytic ground truth from the generating model (var2_bivariate: x0 -> x1 only; var2_chain: 0 -> 1 -> 2; logistic_maps: process 1 (y) drives process 0 (x)) plus a from-scratch numpy OLS
      VAR(p) fit (p = 2 for var2_*, BIC-chosen <= 10 for logistic_maps) with the canonical measure computed from the fitted coefficients; reference does not import spectral_connectivity; delayed_noise truth:
      x0 leads x1..x3'
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: 'establishes A[i,j] meaning: A[1,0] > A[0,1] (var2_bivariate), A[0,1] > A[1,0] (logistic_maps), A[k,0] > A[0,k] for k = 1..3 (delayed_noise): row = target; logistic_maps is reported
      but not decisive unless the Wilson factorisation converges on it (it does not at T >= 1024 in p7_wilson.py)'
  - datasets:
    - var2_bivariate
    - gauss_ar1_pair
    path: kernel
    reference: 'independent-impl: from-scratch numpy multitaper (scipy.signal.windows.dpss(T, NW=3, Kmax=5), constant detrend, FFT, mean over tapers) and from-scratch numpy Wilson (1972) factorisation following
      Dhamala et al. 2008 (same plus operator: half zero-lag, upper-triangular, zero lags >= n/2), then the canonical formula; does not import spectral_connectivity'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: per-bin squared gPDC agrees with the from-scratch estimator within 1e-6
  - datasets:
    - scaled_offset
    - bivariate_gaussian
    path: kernel
    reference: 'analytic invariance: gPDC is invariant to x_k -> c_k x_k + b_k (b removed by constant detrend)'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: kernel-level gpdcoh on scaled_offset equals that on bivariate_gaussian (same draw) within 1e-8 per bin; dtf/pdcoh/dcoh do not satisfy this (contrast)
  - datasets:
    - var2_bivariate
    - iid_gaussian
    path: pipeline
    reference: 'analytic: band mean of canonical squared gPDC from the true VAR coefficients and Sigma on the open-band bins'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: true-direction bias shrinks with T; null direction stays ~0.11 at all T (bias floor)
