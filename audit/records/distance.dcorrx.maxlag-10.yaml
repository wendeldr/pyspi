optimisation:
  complexity_P_T: 'O(P^2 (T^2 + L T^3)) with L=10: ten lag terms per ordered pair, each re-applying sklearn Euclidean distances to the rows of the (T-j) x (T-j) distance matrices (two GEMMs, O(T^3)) before a Dcorr (hyppo/time_series/_utils.py:compute_stat). Measured T_exponent 2.52 (8x256 1.41 s -> 8x1024 46.8 s); never run above 8x1024, projected by pair count (11541 s). At 118x1024 the P^2 pair term is the whole cost (pair-count projection, no fixed term). Within a pair, a two-term fit a T^2 + b T^3 to the 8x256 and 8x1024 walls puts the L T^3 GEMM term at about 36% of the per-pair cost at T=256 (the 8x256 profile has safe_sparse_dot 26.1%) and about 70% at T=1024, so the L T^3 term dominates at 118x1024 (a fit, not a measurement at T=1024).'
  hotspot_1: 'hyppo/tools/common.py:compute_dist (third-party:hyppo) 67.5% of the profiled SPI call at 8x256 (profiled at 8x256; the 8x1024 profile timed out), through the sklearn _param_validation wrapper (67.3%) into sklearn/metrics/pairwise.py:pairwise_distances 57.6%: _euclidean_distances 44.2%, of which safe_sparse_dot 26.1% (the distance-of-distance GEMM), and per-call input validation check_pairwise_arrays 11.0%, which is over-weighted at T=256 relative to T=1024'
  hotspot_2: hyppo/independence/dcorr.py:Dcorr.statistic (third-party:hyppo) 32.3% self time at 8x256 (numba _dcorr hidden)
  hotspot_owner: third-party:sklearn
  opaque_share: 0.0893
  profile_file: audit/profiles/distance.dcorrx.maxlag-10__8x256.pstats
  opportunities:
  - opportunity_id: lagged_dcorr_mgc-2
    opportunity: 'Lag-major per-channel cache: compute each channel''s distance matrix once, and for every lag j its two distance-of-distance
      matrices (rows of D[j:, j:] for the leading side, D[:-j, :-j] for the lagging side) once, plus their centred forms and self products (dcorrx)
      or column ranks (mgcx); every ordered pair then needs only one cross term per lag. Processing lag by lag keeps memory at about 2P T^2 floats
      (1.9 GB at 118x1024, float64). Also removes the duplicate distance computation in hyppo/time_series/_utils.py:compute_stat (line 88 builds
      distx/disty, then the lag-0 statistic(x, y) rebuilds them). The distance-of-distance construction itself (a correctness finding) is kept
      as is.'
    opp_type: cache-sharing
    expected_speedup: 10-30x
    speedup_basis: 'profile:audit/profiles/distance.dcorrx.maxlag-10__8x256.pstats compute_dist 67.5% + per-channel centring inside the 32.3%
      numba share + complexity: P(2L+1)=2478 per-channel builds instead of 2P(P-1)(L+1)=303732 at 118; per-pair cross products (13806 x 11 x ~1.5
      ms, from audit/profiles/micro/opp_dcorr_hsic-1.json, the dcorr_hsic-1 micro-benchmark of lag-0 dcorr; this avenue has no micro-benchmark
      of its own) remain, about 230 s + per-channel GEMMs vs 11541 s projected'
    output_risk: unverified-bit-identical
    risk_evidence: same hyppo/sklearn/numba calls on the same per-channel slices; the lag-0 analogue is bit-identical in audit/profiles/micro/opp_dcorr_hsic-1.json
    effort: L
    depends_on:
    - xc-blas-threads
