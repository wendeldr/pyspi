  deviation_from_documented: None in substance (width 0.25 is stated in the identifier; JIDT's own default is also 0.25). 'Width' is the box half-width.
  deviation_from_canonical: 'Estimator properties only: resubstitution box-kernel plug-in, self-inclusion, no bias correction -> positive small-sample bias under independence (probe iid_gaussian mean 0.739/0.272/0.093/0.030
    bits at T=64/256/1024/4096) and smoothing bias for strong dependence (bivariate_gaussian T=4096: rho=0.8 0.734 vs true 0.737 bits; rho=0.3 0.097 vs 0.068).'
  units_and_range: bits; average of log-ratios, typically >= 0 but not guaranteed non-negative; <= log2 T; symmetric; NaN only on exception.
  direction_convention: 'Undirected: A[i,j] = A[j,i]; estimator symmetric in its arguments and Undirected.multivariate mirrors (probe: exact symmetry on delayed_noise and var2_bivariate T=1024).'
  symmetry_expected: sym
  already_documented: 'no'
