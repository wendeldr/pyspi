    or larger than a rho=0.3 Gaussian dependence (true 0.068 bits); values are not comparable across T.'
  - 'Candidate (error handling): the bare ''except:'' at infotheory.py:279-283 converts any failure to NaN with a message about Cholesky factorisation, which is irrelevant to the kernel estimator.'
