unit_id: infotheory.mi.kernel
status: profiled
correctness:
  metric_name_standard: Mutual information I(X;Y) of contemporaneous samples, box-kernel plug-in estimate, bits
  canonical_ref: 'Shannon CE (1948); Cover & Thomas (2006) Ch. 8 (I(X;Y) = h(X)+h(Y)-h(X,Y)); box-kernel estimator: Kantz & Schreiber (1997); Moon Y-I, Rajagopalan B, Lall U (1995) Phys Rev E 52:2318 (kernel
    MI)'
  canonical_definition: I(X;Y) = E[log2 p(x,y)/(p(x)p(y))]; box-kernel plug-in I_hat = (1/N) sum_b log2[ N C_xy(b) / (C_x(b) C_y(b)) ] (volumes cancel)
  documented_definition: 'supplement §1.4.3, p.10 (supplement.txt:459-466; pack lines 469-476): ''Mutual information [33] is an undirected measure of the (potentially nonlinear) dependence between paired observations of x and
    y''; identifier 67 mi_kernel_W-0.25; keywords undirected, nonlinear, unsigned, bivariate, contemporaneous. supplement §1.4, p.9 (supplement.txt:405-443; pack lines 414-453): ''Kernel estimation (kernel) uses a box kernel method
    with a specific kernel width (default width of 0.5 standard deviations (denoted by the modifier W-0.5))''; GitBook information-theory.md:14 same sentence (mi uses the non-default 0.25). GitBook information-theory.md:161-180.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): infodynamics.measures.continuous.kernel.MutualInfoCalculatorMultiVariateKernel.computeAverageLocalOfObservations'
  implemented_as: 'config.yaml:514-515 sets kernel_width 0.25. For pair (i,j): src = z_i, targ = z_j (1-D, T samples), initialise(1,1) with width 0.25; three KernelEstimatorMultiVariate objects (source,
    dest, joint) with half-widths 0.25*sampleSD of each column; I = mean_b log2[(C_xy/(N V_xy)) / ((C_x/(N V_x))(C_y/(N V_y)))] = mean_b log2(N C_xy / (C_x C_y)); closed boxes, self-included, no Theiler
    window (dyn_corr_excl None for this config), no noise (NOISE_LEVEL_TO_ADD default 0), no bias correction. Any exception -> NaN with a warning.'
  implementation_trace:
  - pyspi/calculator.py:48-51 Calculator `__init__` defaults detrend=False, normalise=True
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend)
  - 'pyspi/data.py:193-195 scipy.stats.zscore(data, axis=1, nan_policy=''omit'', ddof=1) (each series: mean 0, sample SD 1)'
  - pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan)
  - 'pyspi/base.py:85-94 Directed.multivariate: A[i,j] = self.bivariate(data, i=i, j=j) for every i != j'
  - 'pyspi/base.py:132-138 Undirected.multivariate: calls Directed.multivariate then A[li] = A.T[li] (upper triangle mirrored to lower)'
  - pyspi/base.py:27-47 parse_bivariate (Data objects pass through; raw arrays are wrapped by Data()/add_process)
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: estimator=''kernel'' -> identifier += ''_W-{kernel_width}'', labels += [''nonlinear'']; JIDTBase default kernel_width=0.5; _entropy_calc built
    at :36'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: calc.setProperty(''KERNEL_WIDTH'', str(kernel_width)); also BIAS_CORRECTION=''false'' and NOISE_SEED=''42''. BIAS_CORRECTION is not a property of any kernel
    class and is ignored; NOISE_SEED is stored by EntropyCalculatorMultiVariateKernel and MutualInfoCalculatorMultiVariateKernel but has no numerical effect because NOISE_LEVEL_TO_ADD stays 0, and TransferEntropyCalculatorKernel
    ignores it (see infotheory.est.kernel)'
