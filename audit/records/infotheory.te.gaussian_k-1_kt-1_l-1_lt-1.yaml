  deviation_from_documented: 'Factor 1/2: the documented statistic is ''the log-ratio of residual variance for the two models'' (Geweke F), but the returned value is the Gaussian transfer entropy = F/2.
    Probe var2_bivariate_T1024: pyspi A[0,1] = 0.14832534 = 0.5*ln(RSS_r/RSS_f) (numpy OLS, agreement 1e-15), so F = 0.29665. Ranking is unaffected. Otherwise matches (one-lag models; time delays kt=lt=1).'
  deviation_from_canonical: none as Gaussian TE (Barnett et al. 2009); as Geweke GC the value is F/2 (candidate above). Model order fixed at 1 lag for both target and source (a configuration choice; under-specified
    for the VAR(2) test data). No bias correction.
