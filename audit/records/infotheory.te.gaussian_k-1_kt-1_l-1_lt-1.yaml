unit_id: infotheory.te.gaussian_k-1_kt-1_l-1_lt-1
status: profiled
correctness:
  metric_name_standard: Gaussian transfer entropy with target history k=1 and source history l=1 (= one half of Geweke's lag-1 Granger causality log variance ratio)
  canonical_ref: Geweke J. 1982, J Am Stat Assoc 77:304-313, eq. (2.3)-(2.4) F_{X->Y} = ln(var(e_restricted)/var(e_full)); Barnett L., Barrett A.B. & Seth A.K. 2009, Phys Rev Lett 103:238701 (F_{X->Y} =
    2 TE_{X->Y} for Gaussian variables); Schreiber T. 2000, Phys Rev Lett 85:461, eq. (4)
  canonical_definition: TE_{X->Y} = I(X_t; Y_{t+1} | Y_t) = 0.5*ln(sigma^2(Y_{t+1}|Y_t) / sigma^2(Y_{t+1}|Y_t,X_t)) = F_{X->Y}/2, where F = ln(RSS_restricted/RSS_full) is Geweke's GC
  documented_definition: 'supplement §1.4.6, p.11 (supplement.txt:500-511): ''Granger causality [40] is obtained by assessing directed dependence of x -> y as the predictive power of a bivariate autoregressive
    model (comprising x and y) over the univariate autoregressive model (with y only). The statistic included in our framework is the log-ratio of residual variance for the two models, which is a variant
    of Granger causality popularized by Geweke [41] later found to be equivalent to transfer entropy with a Gaussian estimator [38]''; keywords ''directed, linear, unsigned, bivariate, time-dependent''.
    GitBook information-theory.md:90-107 same text. Supplement §1.4.5, p.10-11 (supplement.txt:476-493) defines k, kt (target) and l, lt (source).'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.TransferEntropyCalculatorGaussian -> TransferEntropyCalculatorViaCondMutualInfo -> ConditionalMutualInfoCalculatorMultiVariateGaussian
  implemented_as: 'For each ordered pair (i=source, j=target) on z-scored data: N = T-1 samples (t = 0..T-2) of (x_i(t), x_j(t+1), x_j(t)); JIDT Gaussian CMI with ddof=1 covariance: TE = 0.5*ln(det S(x_i(t),x_j(t))
    det S(x_j(t+1),x_j(t)) / (det S(all three) var x_j(t))) = 0.5*ln(RSS_r/RSS_f) of the OLS-with-intercept regressions x_j(t+1) ~ x_j(t) and x_j(t+1) ~ x_j(t) + x_i(t) on the same samples. Properties confirmed
    by getProperty: k_HISTORY=1, k_TAU=1, l_HISTORY=1, l_TAU=1, DELAY=1, AUTO_EMBED_METHOD=NONE, BIAS_CORRECTION=false, NORMALISE=false.'
