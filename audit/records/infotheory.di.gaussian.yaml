  - 'pyspi/statistics/infotheory.py:503-510 bivariate: entropy_rates of z[j] minus CausalEntropy.bivariate(data, i, j) (cached, same key as cce_gaussian)'
  - pyspi/statistics/infotheory.py:429-437 CausalEntropy(JIDTBase, Directed).__init__(n=5) -> self._n = 5 (config passes no n)
  - 'pyspi/statistics/infotheory.py:439-454 _compute_causal_entropy(src, targ): for i = 1..n: Yp = MatrixUtils.makeDelayEmbeddingVector(targ, i-1)[:-1] (targ lags 1..i-1), Xp = makeDelayEmbeddingVector(src,
