    so di_gaussian = Massey DI + sum_m H(Y^m)/m - H(Y^5). Evidence: numpy code-form reference reproduces pyspi exactly (0.7746040739304512) while canonical DI_5 is 0.6482541289427077 on var2_bivariate_T1024
