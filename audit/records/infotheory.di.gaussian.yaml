optimisation:
  complexity_P_T: 'O(P^2 n T n): DirectedInfo.bivariate (infotheory.py:503-509) = target entropy-rate sum (5 JIDT entropy calls on Java embeddings, recomputed for every pair) minus the cce causal entropy
    (shared with cce through data.causal_entropy). Measured fresh P exponent 2.08, T exponent 1.02; family-warm after cce only the entropy rates remain (0.020 s at 8x1024). At 118x1024 fresh the causal-entropy
    pairs dominate (378 s projected, extrapolated-pairs-from-32); family-warm 10.2 s projected.'
  hotspot_1: pyspi/statistics/infotheory.py:CausalEntropy._compute_causal_entropy (third-party:jpype, self time 28.0%) 94.0% cum of the profiled SPI call at 8x1024; inside it _compute_conditional_entropy
    58.9%
  hotspot_2: 'pyspi/statistics/infotheory.py:DirectedInfo._compute_entropy_rates (third-party:jidt, self time) 5.9%; jpype/_jarray.py:__next__ 6.9%. opaque_share is a lower bound: JPype dispatches Java
    methods without cProfile entries, so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jpype
  opaque_share: 0.0042
  profile_file: audit/profiles/infotheory.di.gaussian__8x1024.pstats
  opportunities:
  - opportunity_id: it_gaussian-2
    opportunity: 'Closed-form numpy for the composite Gaussian SPIs, batched over pairs: si from one lag-1 covariance (three conditional entropies as log-det ratios), xme from the source-lag block with
      and without the target sample, cce/di from one lagged covariance per term m = 1..5 (each term has its own sample window), and the gc auto MAX_CORR_AIS search from Gaussian AIS of every (k, tau) candidate
      per channel; replaces 2-10 JIDT entropy calls per pair, each with a 2-D JArray conversion.'
    opp_type: replace-library
    expected_speedup: 20-100x
    speedup_basis: 'profile:audit/profiles/infotheory.di.gaussian__8x1024.pstats pyspi/statistics/infotheory.py:503 DirectedInfo.bivariate 100.0% + complexity: per pair the JIDT path costs ~1 ms per 2-D
      entropy call (component timings in audit/profiles/micro/opp_it_gaussian-1.json: a 1023x4 JArray(JDouble, 2) conversion 1.01 ms of a 1.05 ms 4-D JIDT entropy call; the entropy itself on a prebuilt
      array 0.043 ms) while a batched slogdet of a <= 11x11 sub-matrix costs microseconds; the measured closed forms of it_gaussian-1 ran 271-643x faster than the same-run pyspi baseline at 32x1024
      in the latest run (te_symbolic_k-10 224x; 399-454x and 174x in the first)'
    output_risk: unverified-within-tolerance
    risk_evidence: same Gaussian log-det quantities on the same samples with different float operations; the check stage's numpy closed forms reproduce pyspi to <= 2.3e-14 (7/7 numpy runs of the code form)
    effort: M
    depends_on: []
  - opportunity_id: it_gaussian-4
    opportunity: 'Cut JPype marshalling of the 2-D observations in the JIDT entropy paths (Gaussian and box-kernel estimators alike): pass them with jpype.JArray.of(ndarray) (one buffer copy) instead
      of JArray(JDouble, 2)(ndarray) (row-by-row conversion, ~1 ms per call at T=1024 whatever the column count) in JIDTBase._compute_joint_entropy, JIDTBase._compute_conditional_entropy and
      CrossmapEntropy.bivariate, and build the cce/di delay embeddings in numpy instead of MatrixUtils.makeDelayEmbeddingVector followed by np.concatenate over the returned Java double[][]
      (CausalEntropy._compute_causal_entropy). Which of these calls a unit makes is named in its speedup_basis.'
    opp_type: vectorise-batch
    expected_speedup: 3-5x
    speedup_basis: profile:audit/profiles/infotheory.di.gaussian__8x1024.pstats pyspi/statistics/infotheory.py:439 _compute_causal_entropy self 28.0% + jpype __next__ 6.6% + _compute_conditional_entropy
      58.9% + component timings in audit/profiles/micro/opp_it_gaussian-1.json, components block (1023x4 conversion 1.01 ms -> 0.17 ms with JArray.of, conversion_2d_by_shape;
      4-D Gaussian entropy call including the conversion 1.05 ms -> 0.22 ms; written by the it_gaussian-1 script, and no it_gaussian-4 candidate was run on this unit, so this is not a microbench basis);
      scope here = the 2-D conversions in JIDTBase._compute_conditional_entropy and the di delay embeddings (CausalEntropy._compute_causal_entropy).
      Subsumed_by it_gaussian-2 on this unit, whose closed-form numpy replaces every JIDT entropy call and with it every 2-D JArray conversion and Java delay embedding, so build_csv credits this
