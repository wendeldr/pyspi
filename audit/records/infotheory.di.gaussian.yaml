unit_id: infotheory.di.gaussian
status: profiled
correctness:
  metric_name_standard: Directed information I(X^n -> Y^n) (Massey), block length n = 5, Gaussian model (pyspi variant)
  canonical_ref: Massey J. 1990, Proc. Int. Symp. Inf. Theory Appl. (ISITA), 'Causality, feedback and directed information', eq. (6)-(7); Kramer G. 1998 PhD thesis ETH Zurich (I(X^N->Y^N) = H(Y^N) - H(Y^N||X^N));
    Amblard & Michel 2011, J Comput Neurosci 30:7-16
  canonical_definition: I(X^N -> Y^N) = sum_{n=1}^{N} I(X^n; Y_n | Y^{n-1}) = H(Y^N) - H(Y^N || X^N), with H(Y^N) = sum_n H(Y_n | Y^{n-1})
  documented_definition: 'supplement §1.4.8, p.11-12 (supplement.txt:526-537): ''Directed information [42, 45] is a measure of information flow from a source time series x to a target time series y that
    is related to transfer entropy, but has no time lag between source and target [46, App. C]. The directed information can be computed as a difference between the conditional entropy of y given its own
    past, and causally conditioned entropy [42-44]. For the same reasons as for causally conditioned entropy, we restrict its computation up to a history length of 10.'' Keywords ''directed, nonlinear,
    unsigned, bivariate, time-dependent''. GitBook information-theory.md:68-86 same text.'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.EntropyCalculatorMultiVariateGaussian (block entropies and the CausalEntropy terms)
  implemented_as: A[i,j] = sum_{m=1}^{5} H(Y^m)/m - cce(i,j), where H(Y^m) is the Gaussian entropy of the m-dimensional delay vector of x_j (T-m+1 samples, z-scored, ddof=1) and cce(i,j) is the CausalEntropy
    value (5-term sum, shared cache). The first term is a sum of block-entropy-per-symbol estimates, not H(Y^5) = sum_m H(Y_m | Y^{m-1}). Since H(Y^m)/m >= H(Y_m|Y^{m-1}) for every m, the code value exceeds
    Massey's DI by sum_{m=1}^{5} H(Y^m)/m - H(Y^5) >= 0, a quantity that depends only on the target's autocorrelation (for an AR(1) target with coefficient phi it equals 0.6417*(-ln(1-phi^2)) nats).
  implementation_trace:
