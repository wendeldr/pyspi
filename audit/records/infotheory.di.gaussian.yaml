  deviation_from_documented: (1) First term is sum_m H(Y^m)/m, not 'the conditional entropy of y given its own past' (sum_m H(Y_m | Y^{m-1}) = H(Y^5)). (2) n = 5, not 10. (3) Includes the contemporaneous
    term (consistent with the docs' 'no time lag').
  deviation_from_canonical: 'Not Massey''s directed information: value = Massey DI_5 + [sum_{m=1}^{5} H(Y^m)/m - H(Y^5)]. Probe var2_bivariate_T1024: pyspi A[0,1] = 0.77460407 and A[1,0] = 0.19588843 reproduce
    the code-form numpy reference exactly, whereas canonical DI_5 = 0.64825 and 0.03690. Probe with an independent white source and AR(1) target (T=4096): phi=0.5 -> di 0.1803 (predicted excess 0.1846),
    phi=0.9 -> di 1.0553 (predicted 1.0656), phi=0 -> 0.0061, reverse direction approx 0.'
  units_and_range: nats; population value >= 0 and larger than Massey DI by a target-only term; asymmetric; scale invariant (shifts cancel); raises on singular embeddings
  direction_convention: 'A[i,j] = DI from x_i (source) to x_j (target): entropy term from z[j] (infotheory.py:507), cce(src=i, targ=j). Probe var2_bivariate_T1024: A[0,1]=0.775 > A[1,0]=0.196'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
