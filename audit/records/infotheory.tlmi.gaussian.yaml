  what_changed: 'None: lag-one Gaussian MI I(x_i(t); x_j(t+1)) on T-1 aligned samples, fp-exact, converging to the analytic population values.'
  new_finding: false
  definition_under_review: false
  check_cost: 'cheap (pyspi time_s in out/pyspi/index/it_gaussian.json, single runs of the review-stage forced re-run, made under machine load: every run <= 0.004 s, slowest delayed_noise|1024|pipeline|numpy
