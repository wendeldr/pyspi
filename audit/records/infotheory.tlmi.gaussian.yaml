  direction_observed: 'A[i,j] = I(x_i(t); x_j(t+1)): row i leads by one sample. delayed_noise (x1 = x0 delayed by 1): A[0,1] = 2.2707 vs A[1,0] = 1.6e-5; var2_bivariate (x0 -> x1): A[0,1] = 0.1666 vs A[1,0]
