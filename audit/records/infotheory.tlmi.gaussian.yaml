optimisation:
  complexity_P_T: 'O(P^2 T): TimeLaggedMutualInfo.bivariate (infotheory.py:301-317), one JIDT Gaussian MI call per ordered pair on (x_i[:-1], x_j[1:]) with two 1-D JArray conversions. Measured fresh P exponent
    2.10, T exponent 0.71 (per-call overhead dominates at T <= 1024). At 118x1024 the pair term is everything: 17.2 s measured fresh (single repeat; the 8x1024 fresh wall_cv is 1.57) against 2.0 s projected
    family-warm.'
  hotspot_1: pyspi/statistics/infotheory.py:TimeLaggedMutualInfo.bivariate (third-party:jidt via JPype, self time) 97.7% cum / 92.6% self of the profiled SPI call at 8x1024
  hotspot_2: 'jpype/_jarray.py:JArray.__new__ (third-party:jpype, 112 calls) 4.2%. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked
    as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0425
  profile_file: audit/profiles/infotheory.tlmi.gaussian__8x1024.pstats
  basis_scope_note: 'The ranking uses the family-warm projection, 1.996 s per window (extrapolated-pairs-from-32: the 0.143 s minimum of three family-warm 32x1024 repeats,
    0.143-0.146 s, times 13,806/992 pairs; 1,197 s per patient), because README ''Optimisation columns'' rule 1 takes family-warm when present; the fresh 118x1024 wall (17.21 s,
    single repeat, 10,328 s per patient) is not used. That wall is 1.25 ms per ordered pair against 0.145 ms in the family-warm 32x1024 repeats. The per-pair work (one JIDT
    Gaussian MI on T-1 samples) does not depend on P, so the gap is not superlinear work, and JVM start and class loading happen in the 8x1024 warm-up before the timed calls. The
    per-pair cost of this JIDT call sequence varies between repeats inside one process and between processes, and its cause was not identified: the fresh 32x1024 record has walls
    0.149 s, then 0.28-0.31 s (median 0.301 s, 0.30 ms per pair; summary.json keeps the 0.149 s minimum), the fresh 8x1024 record holds one 0.126 s repeat (2.2 ms per pair) among
    0.008 s ones, and mi.gaussian (the same calculator) took 0.33 ms per pair at 118x1024 fresh in the same family job 8 s earlier. A throwaway re-measurement on 2026-10-15
    (profile_units.py, fresh mode, written to scratchpad/wf4c_tlmi_diag/remeasure/, not to audit/profiles) put tlmi and mi.gaussian at 1.41-1.44 s and 1.29-1.43 s per 992 pairs at
    32x1024 (3 repeats each, about 1.3-1.45 ms per pair), a whole process near the 118x1024 fresh rate. The bare per-pair call sequence (scratchpad/wf4c_tlmi_diag/diag_jidt.py, 11
    fresh processes; outputs in diag_runs.txt and recheck_diag_runs*.txt beside it) did not reproduce that: its first 992-pair block took 0.45-1.09 s (JIT warm-up), later blocks
    0.15-0.30 s (median about 0.15-0.16 ms per pair), and spi.multivariate afterwards 0.18-0.25 s. Each block that records a Java garbage collection also holds a call of 25-93
    ms, while blocks without one have no call above 3 ms; the GC MXBean reports 0-7 ms of collection time per collection, so the stall coincides with a collection but is not Java
    collection time. The remeasure JSONs and diag outputs are data and are not in the probe archive, which keeps scripts only. So the basis is the fastest per-pair rate measured
    (0.145 ms, also the 8x1024 rate), the fresh records show 2x (32x1024 median) to 8.6x (118x1024) that rate, and the basis understates this unit by up to about 8.6x in a run that
    stays at the slower rates'
  opportunities:
  - opportunity_id: it_gaussian-1
    opportunity: Compute the pairwise Gaussian SPIs for all pairs at once in numpy from one ddof=1 covariance of the z-scored rows (lag blocks x(t-m) and x(t+1) for tlmi and TE), with a batched slogdet
      over the pair sub-matrices, instead of one JIDT calculator call per pair through JPype (infotheory.py:JIDTBase._compute_joint_entropy, MutualInfo.bivariate, TimeLaggedMutualInfo.bivariate, TransferEntropy.bivariate).
    opp_type: replace-library
    expected_speedup: ~400x (fresh ~3600x, against the single fresh 118x1024 repeat; see basis_scope_note)
    speedup_basis: 'microbench:audit/profiles/micro/opp_it_gaussian-1.json (tlmi_gaussian: candidate alone at 118x1024 4.7 ms including Data construction (2.9 ms), against the quiet summary.json 118x1024
      walls 17.21 s fresh (measured) and 2 s family-warm (extrapolated-pairs-from-32) = 3656x / 424x, so the lower bound 400x is the ratio against the family-warm ranking basis rounded
      down; same-run speedups against the pyspi baseline on the shared machine 9x at 8x1024 and 513x at 32x1024
      in the latest run (9x / 399x in the first; the 32x1024 same-run baselines are noisy)) + profile:audit/profiles/infotheory.tlmi.gaussian__8x1024.pstats pyspi/statistics/infotheory.py:301 TimeLaggedMutualInfo.bivariate
      97.7% (the candidate replaces the whole multivariate call; its own cost is one (k+1)P-square covariance plus O(P^2) small slogdets, milliseconds at 118x1024)'
    output_risk: within-tolerance
    risk_evidence: 'audit/profiles/micro/opp_it_gaussian-1.json: max_abs_diff 3.3e-16 (8x1024) and 3.3e-16 (32x1024); max_rel_diff 8.2e-11 (8x1024) and 3.8e-9 (32x1024), the relative figure on a near-zero entry
      (|value| <= max_abs/max_rel ~ 8.7e-8 at 32x1024), NaN masks equal, not bit-identical (np.cov + slogdet instead of JIDT''s covariance + Cholesky)'
    effort: M
