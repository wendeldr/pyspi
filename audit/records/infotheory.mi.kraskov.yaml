unit_id: infotheory.mi.kraskov
status: profiled
correctness:
  metric_name_standard: mutual information I(X;Y) in nats, Kraskov-Stögbauer-Grassberger estimator algorithm 1 (KSG1), k = 4 nearest neighbours, max-norm
  canonical_ref: 'Kraskov, Stögbauer & Grassberger 2004, Phys. Rev. E 69, 066138, algorithm 1 (their Eq. 8; equation number from memory); MI definition: Cover & Thomas 2006, Elements of Information Theory,
    2nd ed., §8.5. The supplement''s own reference for MI is [33] MacKay 2003.'
  canonical_definition: 'I(X;Y) = ∫∫ p(x,y) log[p(x,y) / (p(x) p(y))] dx dy (nats). KSG1: Î = ψ(k) − ⟨ψ(n_x(i)+1) + ψ(n_y(i)+1)⟩_i + ψ(N), where ε(i) is the max-norm distance from z_i = (x_i, y_i) to its
    k-th nearest neighbour (j ≠ i) and n_x(i), n_y(i) count j ≠ i with |x_j − x_i| < ε(i), |y_j − y_i| < ε(i); samples assumed i.i.d.'
  documented_definition: 'supplement §1.4.3, p.10 (pack lines 469-476): ''Mutual information [33] is an undirected measure of the (potentially nonlinear) dependence between paired observations of x and
    y.'' Estimator: supplement §1.4, p.9 (pack lines 414-453): ''The Kraskov–Stögbauer-Grassberger (KSG) technique (ksg) combines nearest-neighbor estimators for mutual information based measures (default
    of four nearest neighbors, indicated by modifier NN-4)''; ''We primarily use v1.5 of the Java Information Dynamics Toolkit [32]''. GitBook information-theory.md:11 says v1.6.1, :16 repeats the KSG text,
    :160-180 lists mi_kraskov_NN-4 and mi_kraskov_NN-4_DCE.'
  delegate_lib: JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt, but its classes contain the NOISE_SEED property that JIDT master added after the v1.6.1 tag;
    build date 2024-04-21 matches master a9b6b3e of 2024-04-20, whose source is cited below) infodynamics.measures.continuous.kraskov.MutualInfoCalculatorMultiVariateKraskov1.computeAverageLocalOfObservations,
    called through jpype 1.7.1 on OpenJDK 21.0.12
  implemented_as: 'Each channel optionally detrended, then z-scored (ddof=1). bivariate(i, j): src = x_i, targ = x_j, full length T, no lag, no exclusion window. JIDT re-standardises each variable (mean,
    std with divisor N−1), adds N(0, (1e-8)²) jitter in standardised units from java.util.Random(42) (row by row: source then target), finds for each t the max-norm distance ε_t to the 4th nearest neighbour
    in the joint space (self excluded), counts marginal neighbours strictly closer than ε_t, and returns ψ(4) − mean_t[ψ(n_x+1) + ψ(n_y+1)] + ψ(T) in nats. No bias correction. Time points are split across
    all available cores and partial sums added. bivariate runs for every ordered pair i != j; the upper triangle bivariate(i<j) is kept and mirrored, the lower-triangle results are discarded. A JIDT exception
    gives NaN for the pair (bare except, infotheory.py:279-283).'
  implementation_trace:
  - 'pyspi/config.yaml:495-512 MutualInfo configs: estimator kraskov, prop_k 4 (this unit) and the DCE variant'
  - 'pyspi/data.py:184-195 Data.set_data preprocessing: optional scipy.signal.detrend(axis=1), then scipy.stats.zscore(axis=1, ddof=1) when normalise=True (Calculator default normalise=True, detrend=False)'
  - 'pyspi/calculator.py:295-355 Calculator.compute: S = spi.multivariate(dataset); any exception escaping multivariate turns the whole SPI matrix NaN (per-pair JIDT exceptions are caught earlier inside
    bivariate and give a NaN entry)'
  - 'pyspi/base.py:84-94 Directed.multivariate (called via super): outer j, inner i != j, A[i, j] = bivariate(i, j)'
  - 'pyspi/base.py:132-138 Undirected.multivariate: A = super().multivariate(data) (all ordered pairs i != j computed), li = tril_indices(-1); A[li] = A.T[li] (the upper triangle bivariate(i<j) is kept
    and mirrored; the lower-triangle bivariate(i>j) values are computed and overwritten)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: identifier += ''_kraskov_NN-{prop_k}'', labels += [''nonlinear''], ''_DCE'' appended when dyn_corr_excl is truthy'
  - 'pyspi/statistics/infotheory.py:84-93 JIDTBase._setup: setProperty(''k'', ''4''); setProperty(''BIAS_CORRECTION'', ''false'') (not a property of the Kraskov calculators: probe getProperty(''BIAS_CORRECTION'')
    -> None, i.e. ignored); setProperty(''NOISE_SEED'', ''42'')'
  - pyspi/statistics/infotheory.py:103-134 JIDTBase._getcalc('MutualInfo') -> infodynamics.measures.continuous.kraskov.MutualInfoCalculatorMultiVariateKraskov1 (:116-119), then _setup
  - pyspi/statistics/infotheory.py:253-260 MutualInfo.__init__ (Undirected) creates the calculator once per SPI
  - 'pyspi/statistics/infotheory.py:267-283 MutualInfo.bivariate: _set_theiler_window (no-op when dyn_corr_excl is None, :217), calc.initialise(1, 1), src, targ = data.to_numpy(squeeze=True)[[i, j]], setObservations(JArray(src),
    JArray(targ)), return computeAverageLocalOfObservations(); bare except -> NaN with a ''Cholesky factorisation'' warning'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/MutualInfoMultiVariateCommon.java#L574-L643 MutualInfoMultiVariateCommon.finaliseAddObservations:
    copies data, computes means and std (MatrixUtils.stdDevs, divisor N-1, MatrixUtils.java#L2490-L2502), normalises each column when NORMALISE=true (default true, :164; MatrixUtils.normalise :2663-2672),
    then adds random.nextGaussian()*noiseLevel to every source then destination entry row by row from java.util.Random seeded with NOISE_SEED (:626-642; NOISE_SEED parsed at :265-271)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L180-L185 constructor:
    addNoise=true, noiseLevel=1e-8; :74 k default 4; :79 normType = NORM_MAX_NORM; :133 numThreads = availableProcessors() (probe: 64 here)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L225-L250 setProperty:
    k, NORM_TYPE, DYN_CORR_EXCL (dynCorrExcl = W > 0), NUM_THREADS; unknown names go to MutualInfoMultiVariateCommon.setProperty (unknown ignored)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L294-L308 finaliseAddObservations:
    throws if totalObservations <= k + 2*DYN_CORR_EXCL; digammaK = digamma(k), digammaN = digamma(totalObservations) (N not reduced for the exclusion window)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L315-L330 computeAverageLocalOfObservations
    -> computeFromObservations :427-526: splits time points over numThreads threads, sums per-thread partial digamma sums, returns digammaK - averageDiGammas + digammaN for algorithm 1 (:518-522)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L715-L738 ensureKdTreesConstructed:
    joint KdTree over (source, dest) and per-marginal NearestNeighbourSearcher (UnivariateNearestNeighbourSearcher for 1-D), all max-norm, carrying observationTimePoints for the exclusion window'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov1.java#L60-L123 partialComputeFromObservations:
    eps_t = distance of the k-th nearest neighbour in the joint space (kdTreeJoint.findKNearestNeighbours(k, t, dynCorrExclTime), :79-83); n_x, n_y = countPointsStrictlyWithinR(t, eps_t, dynCorrExclTime)
    in each marginal (:88-91); sum digamma(n_x+1) + digamma(n_y+1) (:97-99)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/utils/KdTree.java#L751-L753 findKNearestNeighbours: a candidate is admissible only if it
    comes from another observation set or |timePoint(candidate) - timePoint(sample)| > dynCorrExclTime (so W=0 excludes only the sample itself); https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/utils/UnivariateNearestNeighbourSearcher.java#L497-L530
    countPointsWithinR skips |dt| <= dynCorrExclTime and counts norm < r strictly (allowEqualToR=false)'
  deviation_from_documented: 'Estimator matches the documentation (KSG, k=4). Undocumented details: 1e-8 Gaussian jitter with fixed seed 42, no bias correction, results in nats, and estimates can be negative
    although the SPI is labelled ''unsigned''. Version: supplement says JIDT v1.5, GitBook v1.6.1, the shipped jar is a post-1.6.1 master build. The time series samples are treated as i.i.d.; the supplement
    itself notes that autocorrelation biases the estimate (§1.4, p.9) and offers the DCE variant for that.'
  deviation_from_canonical: 'Matches KSG algorithm 1 (a from-scratch brute-force KSG1 reproduces pyspi to <= 3e-15 on bivariate_gaussian, delayed_noise, var2_bivariate, gauss_ar1_pair and narrowband_f0-0.1
    at T=256, probe p5). Implementation choices on top of the paper: inputs re-standardised, 1e-8 jitter (changes the value only with ties, e.g. logistic_maps, see candidates), ψ(N) with N = T, max-norm.
    Applying an i.i.d. estimator to autocorrelated time series is outside the estimator''s assumptions (gauss_ar1_pair T=256: 0.1195 vs analytic 0.1578).'
  units_and_range: nats; real-valued, can be negative (finite-sample bias; probe minimum -0.167 at T=64); unbounded above; symmetric; NaN only when JIDT raises (e.g. T <= 4)
  direction_convention: 'Undirected: A[i, j] = A[j, i]. Directed.multivariate (base.py:88-94, called via super) computes bivariate(i, j) for every ordered pair i != j, lower triangle included; Undirected.multivariate
    (base.py:134-137) then overwrites the lower triangle with the transpose, so A[i, j] = A[j, i] = bivariate(min(i,j), max(i,j)) and the bivariate(max, min) result is computed and discarded. KSG1 itself
    is symmetric (probe p2: bivariate(0,1) = bivariate(1,0) = 0.033251782902)'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'CANDIDATE (provenance): the bundled jar is not the v1.6.1 release. Evidence: `strings` on the jar''s MutualInfoMultiVariateCommon.class lists NOISE_SEED, noiseSeedSet, setSeed; the v1.6.1 tag source
    https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/measures/continuous/MutualInfoMultiVariateCommon.java#L519-L529 uses ''Random random = new Random();'' with no seed and its setProperty
    (:201-229) has no NOISE_SEED; the jar contains EntropyCalculatorMultiVariateCommon.class (entry dated 2024-04-21 06:42, like all 337 entries, unzip -l). That content is the primary evidence: NOISE_SEED
    for MI/CMI arrives in master commit 2a18cd0 (''Adding property to allow used to set random seed for noise addition to data in MI, CMI and wrapped estimators'', closes issue #99), EntropyCalculatorMultiVariateCommon
    in 3d1f3fe (''Gathering common functionality of EntropyMultiVariate estimators into a Common class''), and NOISE_SEED for the entropy estimators in a9b6b3e. Commit dates come from the GitHub REST API
    (https://api.github.com/repos/jlizier/jidt/commits/<sha>, commit.author.date = committer date): 2a18cd0 2024-04-16T04:08:04Z, 3d1f3fe 2024-04-20T07:57:38Z, a9b6b3e 2024-04-20T08:52:10Z; the master listing
    for 2024-04-15 to 2024-05-31 contains only these three commits, so a9b6b3e is the last master commit before the jar''s entry date. The commit HTML pages show hashes and messages but not dates. With
    the real v1.6.1 the NOISE_SEED=42 that pyspi sets would be silently ignored and the jitter unseeded. The documented versions are v1.5 (supplement §1.4) and v1.6.1 (GitBook).'
  - 'CANDIDATE: the value depends on the machine''s core count at the 1e-14 level, because NUM_THREADS defaults to availableProcessors() (64 here) and per-thread digamma partial sums are added in thread
    order. Probe p2 (bivariate_gaussian T=1024): max |A(default) - A(NUM_THREADS=1)| = 7.1e-15 mi, 1.1e-14 mi_DCE, 1.6e-14 tlmi, 2.4e-15 te_k1, 4.2e-15 te_auto; repeat runs on the same machine are bit-identical.'
  - 'CANDIDATE: on tied or discrete-valued inputs the estimate is set by the 1e-8 jitter and its seed. Probe p12, logistic_maps T=256 (series 1 is the period-4 r=3.5 map, 4 distinct values): pair 1->0 for
    NOISE_SEED 42/43/44 gives mi 0.226622/0.226587/0.230899, tlmi 0.278902/0.276961/0.281417, te_k1 0.115063/0.113329/0.107266, te_auto 0.101410 (l,lt=7,2) / 0.089128 (10,2) / 0.044229 (6,1); bivariate_gaussian
    is identical for all seeds.'
  - 'CANDIDATE (estimator property, not a pyspi bug): labelled ''unsigned'' but KSG estimates are negative on independent data. Probe p13 minima at T=64: mi -0.167 (nonlinear_dependence), tlmi -0.143 (iid_gaussian),
    te_k1 -0.134 (logistic_maps), te_auto_DCE -0.178 (cointegrated); at T=256 iid_gaussian mi min -0.055.'
  - 'CANDIDATE (no-op setting): pyspi sets BIAS_CORRECTION=false (infotheory.py:90) but neither Kraskov calculator defines that property; probe p1 getProperty(''BIAS_CORRECTION'') returns None for all nine
    units, so the call has no effect and no bias correction exists for KSG here.'
  - 'CANDIDATE (new, confirmed by probe): a deep copy of this SPI loses NOISE_SEED and prop_k. JIDTBase.__deepcopy__ (infotheory.py:77-82) deep-copies the JPype calculator, which yields a fresh Java object
    with JIDT constructor defaults (NOISE_SEED ''NONE'', k 4). CalculatorFrame.init_from_list deep-copies the base Calculator (calculator.py:556-563, deepcopy at :559), so CalculatorFrame runs this SPI
    with unseeded jitter. On tie-free data the value is unchanged (var2_bivariate T=256 diff 0.0, probe scratchpad it_kraskov_fix/p_te_copy.py). On tied input it is not reproducible: logistic_maps T=256
    pair 1->0 (channel 1 has 4 distinct values) mi 0.226622 on every run, three deep copies 0.230475/0.236390/0.237750 (probe scratchpad it_kraskov_fix/r6_tied.py; the review''s run gave 0.234155/0.233200/0.231582).
    The k reset is harmless at NN-4 but changes any NN-k with k != 4: mi_kraskov_NN-6 on bivariate_gaussian T=256 (0,1) 0.039668 -> 0.028352 after deepcopy (probe scratchpad it_kraskov_fix/r4_deepcopy.py).
    Pickle (JIDTBase.__setstate__ via _getcalc/_setup) keeps NOISE_SEED and prop_k and reproduces the original.'
  - 'CANDIDATE (efficiency, correctness-neutral): every unordered pair is estimated twice. Directed.multivariate (base.py:88-94) runs bivariate for all P(P−1) ordered pairs and Undirected.multivariate (base.py:134-137)
    discards the lower triangle, so half of the KSG runs are thrown away; KSG1 MI is symmetric (probe p2), so computing i<j only would give the same matrix at half the cost.'
