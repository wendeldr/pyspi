    0.073086 +- 0.000753 / 0.569129 +- 0.000753): pyspi (0,1)/(2,3) = 0.07474/0.59984 at T256, 0.05846/0.57756 at T1024, 0.07584/0.55453
    at T4096; |pyspi - pop| 0.0024/0.0300, 0.0139/0.0077, 0.0035/0.0153; all 6 within 2 SD (max_z 1.63); Monte Carlo SD 0.031/0.039
    -> 0.0069/0.0094. Null iid_gaussian: mean over 10 pairs -0.00802 (T64, z -1.03), -0.00368 (T256, z -2.03, FAIL), 1.3e-5 (T1024,
