optimisation:
  complexity_P_T: 'O(P^2 T^2): every ordered pair (pyspi/base.py:Directed.multivariate called by Undirected.multivariate) builds two dense T x T Euclidean matrices (hyppo/tools/common.py:compute_dist -> sklearn euclidean_distances), centres both (hyppo dcorr.py:_center_distmat) and takes three T x T inner products (_dcov). Measured P_exponent 2.08 (8->32), T_exponent 2.62 (8x256->8x1024, above 2; a cache effect from the T x T temporaries is a plausible cause, not measured). At 118x1024 the P^2 T^2 pair term is everything (fit t_fixed 0, t_pair 66 ms).'
  hotspot_1: 'hyppo/independence/dcorr.py:Dcorr.statistic (third-party:hyppo) 84.5% self time of the profiled SPI call at 8x1024: the numba _dcorr
    kernel (_center_distmat x2, _dcov x3) is invisible to cProfile and accrues to this frame'
  hotspot_2: hyppo/tools/common.py:compute_dist -> sklearn/metrics/pairwise.py:_euclidean_distances (third-party:sklearn) 14.6% (safe_sparse_dot
    8.0%, _modify_in_place_if_numpy 3.1%)
  hotspot_owner: third-party:hyppo
  opaque_share: 0.0034
  profile_file: audit/profiles/distance.dcorr.biased-False__8x1024.pstats
  opportunities:
  - opportunity_id: dcorr_hsic-1
    opportunity: 'Per-channel cache shared by all pairs: compute each channel''s hyppo/sklearn Euclidean distance matrix, its centred form (hyppo
      _center_distmat for this bias flag) and its self inner product (_dcov) once per window, leaving only the cross inner product _dcov(A_i,
      A_j) per pair (pyspi/statistics/distance.py:DistanceCorrelation.bivariate today rebuilds both per pair). The distance matrix is the same
      sklearn call used by dcorr_biased, hsic (l2), mgc, hhg and dcorrx/mgcx lag 0, so it can live on the Data object like the barycenter cache;
      memory about 8 MB per channel per cached matrix at T=1024.'
    opp_type: cache-sharing
    expected_speedup: ~30x
    speedup_basis: 'microbench:audit/profiles/micro/opp_dcorr_hsic-1.json (8x1024: 4.09 s -> 0.394 s, 10.4x; per-component times give about 39
      ms per-channel setup and 1.5 ms per cross product, so at 118x1024 about 118 x 39 ms + 13806 x 1.5 ms = 25 s vs the 918 s projection, ~36x)
      + profile:audit/profiles/distance.dcorr.biased-False__8x1024.pstats hyppo dcorr.py:statistic self 84.5% + compute_dist 14.6%'
    output_risk: bit-identical
    risk_evidence: 'audit/profiles/micro/opp_dcorr_hsic-1.json: bit_identical true, max_abs_diff 0.0 at 7x100 and 8x1024 (both bias flags, ordered
      and upper-only variants); 7x100 golden snapshot also bit-identical'
    effort: M
    depends_on:
    - xc-undirected-upper
  - opportunity_id: dcorr_hsic-2
    opportunity: 'Use hyppo''s own O(T log T) 1-D path: set Dcorr(bias=...).is_fast = True before statistic(x, y) so hyppo skips the T x T distance
      matrices and calls _dcorr(..., is_fast=True) -> three _fast_1d_dcov calls (Chaudhuri & Hu 2019). Mapping: bias=False uses the U-statistic
      denominators n(n-3), n(n-3)(n-2), n(n-3)(n-2)(n-1) and returns the unsquared ratio = bias-corrected dCor^2 R*_n, as today; bias=True uses
      the V-statistic denominators n^2, n^3, n^4 and the same final sqrt = dCor_n, as today. Caching each channel''s _fast_1d_dcov(x, x) would
      cut the per-pair work from three calls to one (not measured).'
    opp_type: algorithmic
