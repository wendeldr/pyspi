unit_id: distance.dcorr.biased-False
status: profiled
correctness:
  metric_name_standard: bias-corrected squared distance correlation (R*_n, energy::bcdcor); the unbiased (U-statistic) dCov^2 normalised
    by the unbiased dVar^2 terms
  canonical_ref: 'Szekely & Rizzo 2014, Ann. Statist. 42(6):2382-2412, Sec. 2-3 (U-centring, unbiased dCov^2 estimator, Prop. 1); bias-corrected
    dCor R*_n in Szekely & Rizzo 2013, J. Multivariate Anal. 117:193-213; population dCor: Szekely, Rizzo & Bakirov 2007, Ann. Statist.
    35(6):2769-2794, Theorem 7(ii) (bivariate-normal closed form; arXiv 0803.4101 text, p.18, checked against the paper)'
  canonical_definition: 'U-centre a_ij=|x_i-x_j|: A~_ij = a_ij - a_i./(n-2) - a_.j/(n-2) + a_../((n-1)(n-2)) for i != j, 0 on the diagonal;
    (X.Y)_n = 1/(n(n-3)) sum_{i!=j} A~_ij B~_ij (unbiased for dCov^2(X,Y)); R*_n = (X.Y)_n / sqrt((X.X)_n (Y.Y)_n), an estimator of
    dCor^2 (squared scale), may be negative'
  documented_definition: 'supplement §1.2.1, p.5: ''The sample distance correlation is computed by summing over the entry-wise product
    of Euclidean distance matrices. This statistic is biased, however an unbiased estimator can be obtained by first double-centering
    the distance matrices [14]. ... We compute both the biased and unbiased statistics from the hyppo package'' (identifier 22, dcorr).
    GitBook distance-similarity.md ''Distance Correlation'' (same wording, ref arXiv 0803.4101). GitBook glossary-of-terms.md:21 (keyword
    table, ''Signed'' row): ''Other SPIs, such as distance correlation (defined in the range [0,1]) are unsigned.'''
  delegate_lib: hyppo==0.5.2 hyppo.independence.Dcorr(bias=False).statistic (numba 0.68.0 jit _dcorr / _center_distmat); distances via
    scikit-learn==1.9.1 pairwise_distances('euclidean')
  implemented_as: 'Default preprocessing: z-score each series (ddof=1), no detrend (irrelevant for the value: dCor is invariant to per-variable
    positive scaling and shifts). The T time points are treated as T iid samples of a 1-D variable (time order ignored). Euclidean (=|x_i-x_j|)
    distance matrices are U-centred (zero diagonal) and stat = sum(A~B~)/sqrt(sum(A~A~) sum(B~B~)) with NO square root, i.e. the bias-corrected
    dCor^2 R*_n. Returns exactly 0 when either U-centred variance <= 0; negative values are returned unchanged. Both ordered pairs are
    computed and the upper triangle (x = lower-index process) is mirrored.'
  implementation_trace:
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend only if detrend=True (default False), then scipy.stats.zscore(axis=1,
    ddof=1) if normalise=True (default); stored as (M, T, 1)'
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, nan) (lines
    at HEAD a42ebc1, unchanged since a1f20c7; the trace cited the pre-a1f20c7 lines 294/297)
  - 'pyspi/base.py:132-138 Undirected.multivariate: A = Directed.multivariate(data); li = tril_indices(-1); A[li] = A.T[li] (lower triangle
    overwritten by upper triangle)'
  - 'pyspi/base.py:84-94 Directed.multivariate: for every ordered pair i != j, A[i, j] = self.bivariate(data, i=i, j=j) (both triangles
    are computed)'
  - 'pyspi/base.py:27-49 parse_bivariate: two raw arrays are wrapped into a Data object (which z-scores) and i, j = 0, 1'
  - pyspi/data.py:108-118 Data.to_numpy returns the (M, T, 1) array, so x, y = data.to_numpy()[[i, j]] are (T, 1) column arrays (T samples
    of a 1-D variable)
  - 'pyspi/config.yaml:143-153 DistanceCorrelation configs: biased False / biased True'
  - pyspi/statistics/distance.py:87-90 DistanceCorrelation.__init__ stores biased; identifier += '_biased'
  - 'pyspi/statistics/distance.py:92-97 DistanceCorrelation.bivariate: x, y = data.to_numpy()[[i, j]]; stat = Dcorr(bias=self._biased).statistic(x,
    y)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:114-121 Dcorr.__init__: compute_distance=''euclidean'', is_fast=False
    (the O(n log n) path is enabled only inside Dcorr.test, 231-237, never by statistic)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:123-152 Dcorr.statistic: compute_dist(x, y, metric=''euclidean'')
    (144-147) then _dcorr(distx, disty, bias=self.bias, is_fast=False) (149)'
  - .venv/lib/python3.12/site-packages/hyppo/tools/common.py:436-503 compute_dist -> sklearn.metrics.pairwise_distances(mat, metric='euclidean')
    for each input (497-501)
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/pairwise.py:268 euclidean_distances (dot-product expansion, diagonal forced
    to 0; probe: max |D - |x_i-x_j|| = 4e-11 at T=4096, effect on the statistic <= 1.3e-15)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:261-281 _center_distmat: bias=True subtracts row/column means (/n)
    and adds grand mean (/n^2) = double centring (265-271); bias=False uses row/column sums /(n-2) and grand sum /((n-1)(n-2)) and zeroes
    the diagonal = U-centring (272-280)'
  - .venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:394-413 _dcov with only_dcov=False returns np.sum(A * B) only (402);
    the 1/n^2 and 1/(n(n-3)) factors (406-411) are skipped and cancel in the ratio
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:416-449 _dcorr: covar, varx, vary = sum(A*B), sum(A*A), sum(B*B)
    (432-434); stat = 0 if varx <= 0 or vary <= 0 or (covar <= 0 and bias) (438-439); else stat = covar / sqrt(varx * vary) (443) and,
    only when bias=True, stat = sqrt(stat) (446-447)'
  deviation_from_documented: (1) The supplement says the unbiased estimator is obtained 'by first double-centering the distance matrices';
    the code U-centres (n-2 and (n-1)(n-2) denominators, zero diagonal; dcorr.py:273-280), while the biased variant is the one that
    double-centres. (2) It says the sample statistic is a sum over the product of 'Euclidean distance matrices'; the product is of centred
    matrices. (3) The documentation does not say that this SPI is on the SQUARED scale (dCor^2) while dcorr_biased is on the root scale
    (dCor), so the two 'biased/unbiased' SPIs are not estimators of the same quantity. (4) The unbiased-estimator citation [14] is Shen,
    Priebe & Vogelstein (MGC), not Szekely & Rizzo 2013/2014. (5) Labelled 'unsigned' (config.yaml keywords; GitBook glossary-of-terms.md:21
    gives distance correlation 'defined in the range [0,1]' as the example of an unsigned SPI) but returns negative values.
  deviation_from_canonical: 'none for the estimator itself: matches the bias-corrected dCor^2 R*_n of Szekely & Rizzo (probe: hyppo
    0.25339647074002397 vs from-scratch U-centred formula 0.25339647074002286). Convention notes: it estimates dCor^2, not dCor; clamps
    to 0 when a U-centred variance is <= 0 (canonical R*_n is undefined there).'
  units_and_range: 'dimensionless; in [-1, 1] (Cauchy-Schwarz in the U-centred inner-product space); negative values occur under independence
    (probe: 64.5% of 200 iid N(0,1) pairs at T=64 negative, min -0.0297; pyspi matrix entry -0.005393 on an independent pair); exactly
    0 if either series has non-positive U-centred variance; invariant to per-variable affine maps with nonzero scale; symmetric in (x,
    y).'
  direction_convention: 'undirected: A[i, j] = A[j, i] = bivariate(x = process min(i, j), y = process max(i, j)) via the mirror in base.py:136-137;
    the kernel itself is symmetric (probe: bivariate(0,1) = bivariate(1,0) = 0.2180361011).'
  symmetry_expected: sym
  already_documented: 'partly: the class ''unsigned label on a legitimately negative bias-corrected estimator'' is documented for other SPIs in REVIEW M7 (docs/storage_comparison/REVIEW.md:189-193, negative debiased dspli/dswpli/ppc estimates are valid; metadata should separate an unsigned population target from the estimator range), REVIEW M8 (REVIEW.md:197, pec/pec_log negative despite unsigned) and EEG_OPTIMIZATION_NOTES.md:169 (review topic ''legitimate negative estimates''); none of them names dcorr. The double work of the generic Undirected path is EEG_OPTIMIZATION_NOTES.md:132. The scale mismatch, the double-centring wording and the zero clamp are not in KNOWN_ISSUES.md'
  new_finding_candidates:
  - 'Candidate (scale mismatch): dcorr returns the bias-corrected SQUARED distance correlation (no sqrt for bias=False, dcorr.py:446-447
    ''only biased Dcov is square-rooted''), while dcorr_biased returns the unsquared dCor. Probe on one pair: dcorr = 0.2534 (from-scratch
    R*_n 0.2534), dcorr_biased = 0.5145 (Szekely dCor 0.5145, dCor^2 0.2647). The documentation presents them as biased/unbiased versions
    of one statistic.'
  - 'Candidate (sign label): labelled ''unsigned'' (config.yaml; GitBook glossary-of-terms.md:21: ''distance correlation (defined in
    the range [0,1]) are unsigned'') yet returns negative values under independence (probe: 64.5% of 200 iid pairs at T=64 negative,
    min -0.0297; pyspi matrix entry -0.005393). Expected behaviour of an unbiased estimator; related in kind to REVIEW M7/M8 (other
    SPIs), not documented for dcorr.'
  - 'Candidate (documentation): the supplement describes the unbiased estimator as obtained ''by double-centering''; code uses U-centring
    (dcorr.py:272-280); double centring is what the biased variant does (dcorr.py:265-271).'
  - 'Candidate (edge case, low impact): _dcorr returns 0 when a U-centred variance is <= 0 (dcorr.py:438-439) rather than NaN; through
    pyspi a constant series becomes NaN in zscore and Data raises first, so this is reachable only via near-degenerate inputs or normalise=False
    with constant input.'
  proposed_checks:
  - datasets:
    - bivariate_gaussian
    - nonlinear_dependence
    - anm
    - contaminated
    - iid_gaussian
    path: kernel
    reference: dcor==0.7 dcor.u_distance_correlation_sqr(x, y) (independent package, does not import hyppo) plus from-scratch numpy
      U-centring of |x_i - x_j| (checks/refs/dcorr_hsic.py)
    reference_kind: external-pkg
    criterion: tolerance
    expected_outcome: agreement to rtol 1e-10 / atol 1e-12 for every pair and every T in {64,256,1024,4096}, on the same (T,1) arrays
      pyspi passes to hyppo
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: 'Szekely, Rizzo & Bakirov 2007 Theorem 7(ii) bivariate-normal closed form (confirmed against the paper text, arXiv 0803.4101
      p.18): dCor^2(rho) = [rho*arcsin(rho) + sqrt(1-rho^2) - rho*arcsin(rho/2) - sqrt(4-rho^2) + 1] / [1 + pi/3 - sqrt(3)] (rho=0.3
      -> 0.07236, rho=0.8 -> 0.56987; dCor = 0.26900, 0.75490)'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: pair (0,1) -> about 0.0724 and pair (2,3) -> about 0.5699 (the SQUARED scale, not 0.269 / 0.755), error shrinking
      roughly as T^-1/2 from T=64 to T=4096; cross pairs (independent) -> about 0, sometimes negative
  - datasets:
    - iid_gaussian
    path: pipeline
    reference: 'analytic null: population dCor^2 = 0 for independent series'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: off-diagonal values centred on 0 (mean within a few standard errors of 0 at each T), a substantial fraction negative,
      spread shrinking with T
  - datasets:
    - anm
    - nonlinear_dependence
    - bivariate_gaussian
    path: pipeline
    reference: from-scratch kernel on (x_i, x_j) and on (x_j, x_i) after pyspi preprocessing
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: A exactly symmetric; A[i,j] equals kernel(x_min(i,j), x_max(i,j)) and kernel(x_j, x_i) to 1e-12 (no order dependence);
      reversing the process order permutes A without changing values
  - datasets:
    - scaled_offset
    - bivariate_gaussian
    path: pipeline
    reference: 'invariance property: dCor is invariant to per-variable positive scaling and shifts; scaled_offset is the same draw as
      bivariate_gaussian'
    reference_kind: analytic
    criterion: exact
    expected_outcome: pyspi(scaled_offset) equals pyspi(bivariate_gaussian) to ~1e-12, also with normalise=False on the kernel path
  - datasets:
    - trending
    - bivariate_gaussian
    path: pipeline-detrend
    reference: detrend(D2 + slope*t) equals detrend(D2), so pipeline-detrend on trending must equal pipeline-detrend on bivariate_gaussian
      (same draw)
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: agreement to ~1e-10; contrast run on the plain pipeline (no detrend) is expected to show inflated values on the
      independent cross pairs with trends (e.g. (1,3), (2,3)) -- qualitative
  - datasets:
    - nonlinear_dependence
    - anm
    path: pipeline
    reference: 'qualitative property: dCor detects non-monotone dependence where Pearson is about 0'
    reference_kind: literature-only
    criterion: qualitative
    expected_outcome: (0,1) of nonlinear_dependence (x1 = x0^2) and the circle pair (2,3) clearly above the iid_gaussian null spread
      at T >= 256
  check_method: external-pkg
  check_reference: audit/checks/refs/dcorr_hsic.py:chk_dcor (dcor==0.7 u_distance_correlation_sqr, method naive; does not import hyppo);
    audit/checks/refs/dcorr_hsic.py:chk_scratch -> audit/checks/refs/_kernels_distance.py:dcorr / dcorr_from_dist (U-centring, Szekely
