  agreement_criterion: 'exact: rtol 1e-10, atol 1e-12 (kernel, pipeline, affine, unmirrored, reversed); tolerance 1e-10 for pipeline-detrend;
    statistical: |pyspi - population dCor^2| <= 2 Monte Carlo SD at T; null: |mean over 10 pairs - Monte Carlo mean| <= 2 Monte Carlo
