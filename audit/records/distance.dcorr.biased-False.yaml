  closeness: 'dcor package u_distance_correlation_sqr: 8/8 exact runs pass, max_abs <= 7.2e-14 (bivariate_gaussian|4096|kernel|dcor
    7.18e-14, max_rel 1.2e-11); the unsquared form sqrt(R*_n) is 0.068-0.250 away (ref_maxabs_vs_other_form). From-scratch U-centring:
