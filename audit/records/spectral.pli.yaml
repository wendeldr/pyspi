    expected_speedup: 1-8x
    speedup_basis: 'profile:audit/profiles/micro/prof_spectral.pli__118x1024.pstats _expectation_cross_spectral_matrix 88.7% + complexity: dspli is a function of the same sign(Im) taper average (connectivity.py:604-625); the first of the two pays it.
      Ranked after spectral_csm-1 (depends_on), as on spectral.wpli and spectral.dswpli: that avenue halves the taper-level frames (88.7% of the profiled call) but not the rest
