optimisation:
  complexity_P_T: 'O(K*P*T log T) FFT + O(K*n_fft*P^2) two-sided taper-level CSM materialised as (1,1,5,n_fft,P,P) complex128 (connectivity.py:196-257) + O(K*n_fft*P^2) elementwise fcn on the per-taper tensor before the taper mean, K=5 tapers, n_fft=T; plus a P-independent DPSS cost (~17-20 ms, pure Python). Measured P exponent 0.90 (fit 8->32) and 2.94 between the 32x1024 and 118x1024 walls, T exponent 0.94: at P<=32 the fixed DPSS cost dominates (dpss_windows 75.3% of the 8x1024 profile), at 118x1024 the P^2 taper-level CSM term dominates (DPSS 2.3%) and the local exponent above 2 reflects GB-sized temporaries (memory-bound), not extra arithmetic.'
  hotspot_1: '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_expectation_cross_spectral_matrix (third-party:spectral_connectivity) 88.7% of the profiled SPI call at 118x1024: _complex_inner_product 51.8%, fcn sign(Im) (connectivity.py:571) 23.5%, taper-mean reduce 11.0%'
  hotspot_2: '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_complex_inner_product 51.8% (the per-taper CSM build alone) at 118x1024; at 8x1024 transforms.py:dpss_windows 75.3% (audit/profiles/spectral.pli__8x1024.pstats) | opaque_share is the 8x1024 profile-JSON value (audit/profiles/spectral.pli__8x1024__profile.json, builtin tottime over the whole profile); the 118x1024 pstats named in profile_file gives a builtin tottime share of 0.156 of the compute_spi frame (audit/profiles/micro/prof_spectral__index.json). Both are lower bounds: numpy ufunc work sits in the self time of the calling Python frame.'
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.061
  profile_file: audit/profiles/micro/prof_spectral.pli__118x1024.pstats
  basis_scope_note: 'Cache key (measure,) (pyspi/statistics/spectral.py:46-50): the retained fmin-0_fmax-0-5 identifier pays the unit''s one build (3.33 s at 118x1024, family-warm) and the 10 untimed EEG bands read
    that cached array as the 5 timed non-retained bands do (0.007-0.023 s each), so the configured sum (one build plus 5 band reads) stands in for one build plus 10 band reads'
  opportunities:
  - opportunity_id: spectral_csm-1
    opportunity: Form the taper-level products only on the (n_fft+1)//2 non-negative bins (slice the Fourier coefficients before connectivity.py:196-257 instead of dropping the negative bins afterwards), in frequency blocks so the per-taper temporaries stay small; for the linear measures (coherency, icoh, psi, gd) replace the (1,1,5,n_fft,N,N) complex128 tensor and its taper mean by one batched matmul over the taper axis.
    opp_type: algorithmic
    expected_speedup: 1.76-2.5x
    speedup_basis: 'complexity:pli applies its sign(Im) fcn (connectivity.py:543-575) to the same per-taper products as plv, and forming them on the (n_fft+1)//2
      non-negative bins only halves the elements of every taper-level frame; pli itself was not run, so this is not a microbench basis. Halving those frames alone gives Amdahl
      1/(0.113 + 0.887/2) = 1.797x by element count on the profiled call, and 3.406/(3.406 - 0.887 x 3.331/2) = 1.765x on the configured sum, the ranking basis
      (3.406 s per window at 118x1024, family-warm: the 3.331 s build of the profiled identifier plus 5 band reads that this avenue does not shorten). Context, plv only, carried over and not measured on pli: the same slicing gave plv 1.8-2.5x (audit/profiles/micro/opp_spectral_csm-1.json
      plv sliced, min of 3 repeats, 2.45x at 118x1024, ratio of medians 2.88x, and 1.81x at 32x1024; a Workflow 3 recheck re-run of the same script gave 1.89x min of 3 at 118x1024,
      ratio of medians 1.86x, not saved to the JSON). The lower bound 1.76x is this unit''s own element-count figure on the ranking basis rounded down, so it does not exceed the evidence against the
      ranking basis; the 2.5x upper end is plv''s 2.45x min of 3 at 118x1024, which beat plv''s own element count
      + profile:audit/profiles/micro/prof_spectral.pli__118x1024.pstats
      taper-level CSM frames: _expectation_cross_spectral_matrix 88.7% of the profiled call (_complex_inner_product 51.8%, fcn sign(Im) 23.5%, taper mean (np.mean) 12.2%)'
    output_risk: unverified-bit-identical
    risk_evidence: 'audit/profiles/micro/opp_spectral_csm-1.json: plv sliced bit-identical at 32x1024, 118x1024 and the 7x100 golden set; this measure applies another elementwise fcn to the same sliced per-taper products (pure re-ordering of which bins are computed)'
    effort: M
    depends_on: []
  - opportunity_id: spectral_phase_sync-1
    opportunity: 'Evaluate the per-taper CSM once per call and once per measure group: plv/ppc share the x/|x| taper average (connectivity.py:512-516, 673-696), pli/dspli the sign(Im) average (:543-575, 604-625), wpli/dswpli the Im, |Im| and Im^2 averages (:578-601, 628-670); today dswpli builds the 1.14 GB per-taper CSM three times and wpli twice.'
