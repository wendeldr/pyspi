optimisation:
  complexity_P_T: 'O(P^2 maxlag (maxlag^2 T)) per identifier: one statsmodels coint per unordered pair (cached for (j, i)) = a first-stage OLS plus adfuller with autolag over maxlag+1 = 11 nested candidate regressions and a re-fit, 13 statsmodels OLS fits per pair; three identifiers with different (trend, autolag) keys each recompute everything. Measured P_exponent 2.10, T_exponent 0.37. Pair term dominates; measured 37.0 s (fresh, one identifier) and 110.8 s (family-warm, all three identifiers) per window at 118x1024 (measured).'
  hotspot_1: statsmodels/regression/linear_model.py:__init__ (OLS, third-party:statsmodels) 52.5% of the profiled SPI call at 8x1024 (364 fits = 13 per pair; statsmodels/base/data.py:_handle_constant 45.5% runs numpy matrix_rank/svd on every design), inside stattools._autolag 81.6%
  hotspot_2: statsmodels/regression/linear_model.py:fit (OLS, third-party:statsmodels) 35.7% of the profiled SPI call at 8x1024 (pinv_extended 22.2%); numpy svd 42.5% in total across both
  hotspot_owner: third-party:statsmodels
  opaque_share: 0.208
  profile_file: audit/profiles/misc.coint.aeg__8x1024.pstats
  opportunities:
  - opportunity_id: coint-2
    opportunity: 'Engle-Granger ADF lag search from one factorisation: the 11 candidate regressions of statsmodels adfuller(autolag) are nested in the lag order on a common sample, so one QR of the maxlag design gives every candidate''s RSS and AIC/BIC; do the first-stage OLS and the re-fit at the chosen lag with plain numpy instead of statsmodels OLS objects.'
    opp_type: algorithmic
    expected_speedup: 3-8x
    speedup_basis: 'profile:audit/profiles/misc.coint.aeg__8x1024.pstats stattools.coint 99.7% (adfuller 92.7%, _autolag 81.6%; statsmodels OLS __init__ 52.5% with _handle_constant/matrix_rank svd 45.5%, OLS.fit 35.7%, over 364 fits = 13 per pair) -> removable share about 0.88, Amdahl 8.3x + complexity: 13 OLS per pair become one QR plus O(maxlag) updates'
    output_risk: unverified-within-tolerance
    risk_evidence: QR instead of statsmodels pinv changes float order of the ICs and the t-ratio; a near-tie of AIC/BIC between two lags could select a different lag, a discrete change in the returned t-statistic
    effort: M
    depends_on: []
  - opportunity_id: coint-3
    opportunity: 'Share the trend=''ct'' work between coint_aeg_tstat_trend-ct_autolag-aic_maxlag-10 and coint_aeg_tstat_trend-ct_autolag-bic_maxlag-10: run the first-stage OLS and the 11 candidate ADF fits once (adfuller(..., regresults=True) keeps every candidate fit) and read both criteria from them; today Cointegration.key includes autolag, so each identifier recomputes everything (misc.py:54-60).'
    opp_type: cache-sharing
    expected_speedup: ~1.35x
    speedup_basis: 'complexity: family-warm 118x1024 increments 37.1 s (c-aic), 37.3 s (ct-aic), 36.4 s (ct-bic) = 110.8 s per window; _autolag is 81.6% of one identifier in audit/profiles/misc.coint.aeg__8x1024.pstats, so about 0.82 x 36.4 s of 110.8 s is shared -> Amdahl ~1.37x.
      Independent of coint-2 (independent_of), because coint-2 makes each OLS fit cheaper and this avenue removes the repeated trend-ct fits of the second identifier (fewer calls times a
      cheaper call), so the savings multiply. The lower bound 1.35x is at or below the 1.37x above'
    output_risk: unverified-bit-identical
    risk_evidence: both identifiers run the same first-stage OLS and the same candidate ADF fits on the same residuals; only the criterion read off each fit and the final re-fit at the chosen lag differ
    effort: M
    depends_on: []
    independent_of:
    - coint-2
