unit_id: misc.coint.aeg
status: profiled
correctness:
  metric_name_standard: 'Engle-Granger two-step (augmented Engle-Granger, AEG) residual-based cointegration test statistic: ADF t-ratio on the residuals of the cointegrating regression (with constant, or
    constant + linear trend), lag order chosen by AIC or BIC up to 10'
  canonical_ref: Engle R.F. & Granger C.W.J. 1987, Econometrica 55(2):251-276 (two-step test, ADF on residuals, Table II); Said S.E. & Dickey D.A. 1984, Biometrika 71(3):599-607 (augmented DF); MacKinnon
    J.G. 1991/2010 (response-surface critical values, N=2); Phillips P.C.B. & Ouliaris S. 1990, Econometrica 58(1):165-193 (normalisation dependence of residual-based tests)
  canonical_definition: 'Step 1: OLS y0_t = alpha (+ delta t) + beta y1_t + u_t. Step 2: OLS Delta u_t = rho u_(t-1) + sum_(i=1..p) gamma_i Delta u_(t-i) + e_t (no deterministic term); statistic = t-ratio
    rho_hat / se(rho_hat); reject no-cointegration for values below the Engle-Granger/MacKinnon critical value (more negative = stronger evidence). The statistic depends on which variable is the regressand.'
  documented_definition: 'supplement §1.6.3, p.19 (heading supplement.txt line 885, text 886-899): "If two time series are individually integrated but some linear combination of them has a lower order of
    integration, then the series are said to be cointegrated [79]. We implement statistics for quantifying the cointegration of bivariate time series from two tests included in v0.12.0 of statsmodels [75]:
    the Augmented Engle-Granger (AEG, modifier aeg) [80] two-step test and the Johansen test (johansen) [81]." Keywords: "undirected, linear, unsigned, bivariate, time-dependent". [80] = Engle & Granger
    1987 Econometrica 55, 251; [81] = Pesaran & Shin 1999 (ARDL bounds approach), not Johansen. GitBook spi-descriptions/miscellaneous.md:13-41 has the same text (Key References link to JSTOR 1913236 =
    Engle & Granger 1987 and to the Pesaran-Shin ARDL chapter). AEG bullet (supplement.txt:892-894): "For the AEG test, we use a lag that is inferred via either AIC (modifier aic) or BIC (bic), with a maximum
    lag of 10 and obtain a t-statistic (tstat) of the unit-root test on the residuals. The time series is first detrended by assuming either a constant (c) or a constant and linear trend (ct)." Listed as
    SPIs 229-231; keyword "undirected".'
  delegate_lib: statsmodels==0.15.0 statsmodels.tsa.stattools.coint (method "aeg") -> adfuller(regression="n") -> OLS
  implemented_as: 'Default pipeline z-scores (optionally detrends) each channel. For each unordered pair a<b the first call is bivariate(i=b, j=a), so coint(y0 = z_b, y1 = z_a): OLS of the HIGHER-index
    channel on the lower-index channel plus constant (c) or constant + trend (ct); ADF without deterministic terms on the residuals with lag p in 0..10 chosen by min AIC/BIC on the common sample T-11, then
    re-fit on T-1-p rows; returns the t-ratio on u_(t-1). R^2 >= 1-100*sqrt(eps) returns -inf. Cache stores the value for both (b,a) and (a,b), and the Undirected mirror copies it, so A[a,b] = A[b,a] =
    EG(dependent = z_max(a,b), regressor = z_min(a,b)). The p-value and critical values are discarded; the value is returned with its sign (no negation despite the comment at misc.py:99).'
  implementation_trace:
  - pyspi/calculator.py:252-259 Calculator._load_yaml instantiates Cointegration(**params) per config; the YAML labels block (config.yaml:1294-1299, "linear") is not read, so instance labels come from the
    class
  - 'pyspi/calculator.py:295 (def) and :327-339 compute: S = spi.multivariate(dataset); fill_diagonal NaN; any exception -> the whole matrix for that SPI set to NaN (:336-337), a MetricReport with status=failed
    recorded, and a warning built at :339 and emitted at :355'
  - 'pyspi/data.py:184-195 preprocessing: optional scipy.signal.detrend(axis=1), then zscore(axis=1, ddof=1) by default'
  - 'pyspi/base.py:132-138 Undirected.multivariate -> Directed.multivariate (base.py:85-94: outer loop j, inner loop i != j, A[i,j] = bivariate(i=i, j=j)); then A[tril] = A.T[tril]. For a pair a<b the FIRST
    call is bivariate(i=b, j=a)'
  - pyspi/statistics/misc.py:22-26 class Cointegration(Undirected, Unsigned); labels = ["misc","unsigned","temporal","undirected","nonlinear"]
  - 'pyspi/config.yaml:1342-1358 three configs: (trend c, autolag aic), (ct, aic), (ct, bic), maxlag 10, statistic tstat; pyspi/sonnet_config.yaml:166-181 keeps only (ct, aic, 10) (GitBook miscellaneous.md:39
    marks it as the "cointegration" representative)'
  - 'pyspi/statistics/misc.py:28-37, :46-52 __init__ else-branch (method != "johansen"): stores _autolag, _maxlag, _trend; identifier coint_aeg_tstat_trend-<trend>_autolag-<autolag>_maxlag-<maxlag>'
  - pyspi/statistics/misc.py:54-60 key = ("aeg", autolag, maxlag, trend)
  - 'pyspi/statistics/misc.py:62-67 _from_cache: try data.coint[self.key][(i, j)]; on miss z = data.to_numpy(squeeze=True) (shape P x T)'
  - 'pyspi/statistics/misc.py:69-78 stattools.coint(z[i], z[j], autolag, maxlag, trend) -> ci = {"tstat": stats[0]}; z[i] is the DEPENDENT variable y0'
  - 'pyspi/statistics/misc.py:89-95 store ci under (i, j) AND (j, i): the first-computed orientation is reused for the reverse pair'
  - pyspi/statistics/misc.py:99-103 bivariate returns ci[self._statistic] (comment at :99 says "Return the negative t-statistic", no negation is applied)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:2571-2579 coint(y0, y1, trend="c", method="aeg", maxlag=None, autolag="aic") (statsmodels 0.15.0)
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:2683-2688 xx = add_trend(y1, trend) (c: constant; ct: constant + linear trend); res_co = OLS(y0,
    xx).fit() (first-stage cointegrating regression)'
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:2690-2706 if R^2 < 1 - 100*sqrt(eps) (SQRTEPS :84): adfuller(resid, maxlag, autolag, regression="n");
    else CollinearityWarning and tstat = -inf'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:2708-2717 MacKinnon critical values and p-value (computed, discarded by pyspi)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:352-363 adfuller input checks (constant series -> ValueError); :380-385 maxlag must be <= nobs//2
    - 1 for regression "n" (T >= 22 for maxlag 10)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:386-391 xdall = lagmat(diff(u), maxlag, trim="both", original="in"), column 0 replaced by the lagged
    level u_(t-1); common sample of T-1-maxlag rows
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:395-407 autolag: _autolag(OLS, xdshort, xdall, startlag=1, maxlag, ic) on the common sample'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:147-154 _autolag fits lags 0..maxlag and picks min aic / bic
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/regression/linear_model.py:2143-2174 info_criteria: aic = -2 llf + 2 k, bic = -2 llf + ln(n) k, k = df_model + k_constant (number
    of regressors; no constant here)'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:420-427 re-run with the chosen lag p on the LARGEST sample for that lag (T-1-p rows)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/stattools/_stattools.py:433-436 resols = OLS(Delta u_t, [u_(t-1), Delta u_(t-1..t-p)]) (no deterministic term); adfstat =
    tvalues[0]
  deviation_from_documented: '(1) Asymmetry hidden: the documentation calls the SPI undirected and does not say which series is the regressand; the code uses the higher channel index as y0 under multivariate
    (cache + loop order) but z[i] (the first argument) under a direct bivariate call. (2) Sign: labelled "unsigned" (class Unsigned -> issigned() False, base.py:146-150) and the code comment says "Return
    the negative t-statistic" (misc.py:99), but the raw t-statistic is returned: typically negative, more negative = more cointegrated, opposite orientation to the Johansen identifiers. (3) "The time series
    is first detrended" is implemented as including the deterministic terms in the cointegrating regression (equivalent by Frisch-Waugh for the residuals). (4) Metadata: class label "nonlinear" vs documented
    "linear". (5) statsmodels v0.12.0 documented, 0.15.0 installed.'
  deviation_from_canonical: 'Value: none against the Engle-Granger two-step ADF t-ratio with constant/trend in step 1, no deterministic term in step 2, IC lag search on a common sample and refit on the
    largest sample. Probe: from-scratch numpy implementation reproduces pyspi to <= 4.2e-13 over cointegrated, iid_gaussian, trending, var2_bivariate, delayed_noise at T=64..4096 for all three configs;
    a variant that does not refit on the larger sample differs by up to 2.27, so the refit convention matters for references (e.g. R urca ur.df). Canonical EG requires a normalisation choice; pyspi fixes
    it by channel index rather than by a substantive rule.'
  units_and_range: dimensionless t-ratio, real-valued, unbounded below, can be positive; -inf (with CollinearityWarning) for (almost) collinear pairs (shared_envelope x2==x0); on stationary independent
    inputs it scales like -sqrt(T) (iid_gaussian c/aic off-diagonal range [-17.6,-10.0] at T=256, [-66.0,-45.8] at T=4096); pipeline matrix symmetric by caching/mirroring, kernel asymmetric; NaN diagonal
  direction_convention: 'undirected output, asymmetric kernel: A[i,j] = A[j,i] = coint(y0 = z_max(i,j), y1 = z_min(i,j)) (higher index regressed on lower index). Probe trending T=4096 pair (0,3): A[0,3]
    = -0.3646 = scratch EG(dep z3, reg z0), reverse orientation -61.2392; a direct bivariate(data_2ch) call (i=0, j=1) returns the reverse orientation (-61.2392) for the same pair'
  symmetry_expected: sym
  already_documented: no (tests/README.md:529-531 lists run status/timing only; nothing in KNOWN_ISSUES.md concerns coint)
  new_finding_candidates:
  - 'CANDIDATE (definition, index-order dependence): the reported value depends on channel ORDER. Undirected loop order (base.py:91-93, j outer) makes the first call bivariate(i=hi, j=lo), and misc.py:95
    caches it for the reverse pair, so the higher index is always the dependent variable (pack hypothesis; the probes below are consistent with it, confirmation is for the check stage). Probes: cointegrated
    T=256 c/aic pair (0,2) -1.1141 (pyspi) vs -2.2943 reverse; pair (2,3) -2.4740 vs -1.7498; trending T=4096 c/aic pairs (0,1),(0,2),(0,3) about -0.37/-0.40 vs -61.24 reverse; iid_gaussian T=4096 (0,4)
    -66.05 vs -27.69 (AIC picks lag 0 vs 5). Permuting channels can change values by up to 60.9 (probe max).'
  - 'CANDIDATE (API inconsistency): the same pair gives different values through the two entry points. Probe trending T=4096 channels (0,3) as a 2-channel Data: Cointegration(aeg c aic).bivariate(D) (i=0,
    j=1, y0=z0) = -61.2392, while .multivariate(D)[0,1] = -0.3646; within one Data object the first call fixes the cached value for both orders.'
  - 'CANDIDATE (sign/metadata): Unsigned class and comment "Return the negative t-statistic" (misc.py:99) vs returned raw t-statistic (misc.py:103); all probed values are negative or near zero, and stronger
    cointegration = more negative, opposite to the Johansen identifiers of the same family.'
  - 'CANDIDATE (conceptual): on stationary inputs the statistic measures stationarity of the regression residual, not coupling: independent white noise (iid_gaussian T=256) gives [-17.6, -10.0], comparable
    to the truly cointegrated pair (cointegrated T=256 (0,1): -16.25).'
  - 'CANDIDATE (robustness): exactly collinear pairs return -inf (statsmodels _stattools.py:2700-2706; probe shared_envelope A[0,2] = -inf at T=256/1024, z vs 3z+1 -> -inf); -inf then enters downstream
    normalisation/averaging unless filtered.'
  - 'CANDIDATE (metadata): class label "nonlinear" (misc.py:26) while the supplement keyword and config.yaml:1294-1299 say "linear".'
  - 'CANDIDATE (robustness, latent): __init__ branches on == "johansen" (misc.py:40), _from_cache on == "aeg" (misc.py:69): a misspelt method (e.g. "AEG") builds an AEG identifier and then fails in the
    Johansen path. Probe: Cointegration(method="AEG").bivariate(...) -> AttributeError: no attribute "_det_order".'
