  what_changed: 'The Wilson iteration (Dhamala et al. 2008 form) and the H / Sigma extraction match an independent implementation to 4e-13 and the analytic factors to 4e-15 (Sigma to the stopping tolerance).
    The configuration deviates: (a) no zero padding, so the factor cannot represent lags >= n/2 and the factorisation residual is 0.3-3% on regular data; (b) convergence is declared on the step size and
    non-convergence only logs a warning, so factorisations with residual 0.3-0.6 (logistic maps, narrowband) feed every directed measure; (c) the 5-taper single-window CSM makes every downstream measure
    inconsistent (T-independent bias, measure records); (d) the step-converged factor of the non-factorisable CSM is not equivariant: swapping or rescaling channels changes per-bin H by up to O(1) at isolated
    bins and band means by 1e-3..3e-2; (e) under numpy >= 2.4 (as checked) the Cholesky fallback raises AttributeError (mpd:48 xp.linalg.linalg), turning the whole SPI matrix NaN, but only when rounding makes
    the duplicated pair''s lag-0 covariance fail Cholesky; otherwise the degenerate pair silently gets a finite value (dtf 0.528, gpdcoh 0.507). spectral_connectivity v2.0.1 already catches
    xp.linalg.LinAlgError. Rubric anchor 7 (expectation over 5 tapers, value-changing configuration).'
