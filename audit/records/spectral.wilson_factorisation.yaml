unit_id: spectral.wilson_factorisation
status: profiled
correctness:
  metric_name_standard: Nonparametric spectral-matrix factorisation (Wilson 1972 minimum-phase factor) of a multitaper cross-spectral matrix, giving transfer function H and innovation covariance Sigma (shared
    by dtf, dcoh, pdcoh, gpdcoh, ddtf and sgc_nonparametric)
  canonical_ref: 'Wilson GT (1972) The factorization of matricial spectral densities. SIAM J Appl Math 23(4):420-426; Dhamala M, Rangarajan G, Ding M (2008) Analyzing information flow in brain networks
    with nonparametric Granger causality. NeuroImage 41:354-362; multitaper: Thomson DJ (1982) Proc IEEE 70:1055-1096'
  canonical_definition: Find Psi(f) = sum_{k>=0} psi_k e^{-i2pi f k} (minimum phase, causal) with S(f) = Psi(f) Psi(f)^H; iterate Psi <- Psi [Psi^{-1} S Psi^{-H} + I]_+ where [.]_+ keeps positive lags and
    half the zero lag (upper triangular); then Sigma = psi_0 psi_0^T and H(f) = Psi(f) psi_0^{-1} (H(lag 0) = I)
  documented_definition: 'supplement §1.5, p.12 (line 575-576): ''All directed measures (excluding parametric spectral Granger causality) are nonparametrically estimated through spectral matrix factorization
    [57, 58]''; §1.5.9 p.16: ''The cross-spectral density matrix can be decomposed into a noise covariance matrix and a spectral transfer matrix''. Band rule, supplement §1.5, p.12-13 (supplement.txt lines
    570-599 in this checkout; the pack''s line numbers are offset by about 12-16): ''We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T'' and bands ''fmin-0_fmax-0-5:
    f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]'', summary = mean or max over the band. Directed measures ''are nonparametrically estimated through spectral matrix
    factorization [57, 58]'' (§1.5, p.12). Row/column meaning of the MPI: GitBook glossary-of-terms.md:27 ''The rows in this table reflect the sources while the columns reflect the targets''.'
  delegate_lib: spectral_connectivity==1.1.2 minimum_phase_decomposition (tolerance 1e-8, max_iterations 60) + transforms.Multitaper (NW=3, 5 tapers) (numpy 2.5.4, scipy 1.17.1)
  implemented_as: 'Per ordered pair: 2-channel multitaper CSM on n_fft = next_fast_len(T) bins (no zero padding), mean over 5 tapers; Wilson: initial Psi = chol(ifft(S)[lag 0].real)^T (fallback to a random
    start on LinAlgError, unreachable under numpy >= 2.4 as checked, see candidates); g = Psi^{-1} S Psi^{-H} + I; plus operator: ifft, lag 0 halved and lower triangle zeroed, lags >= (n+1)//2 zeroed, fft;
    Psi <- Psi g_+; stop when sup-norm change < 1e-8 or 60 iterations (only a logger.warning on failure); Sigma = A0 A0^T, H = Psi A0^{-1}, A0 = ifft(Psi)[lag 0].real. The connectivity properties are
    uncached, so each directed measure re-runs the whole factorisation 2-4 times per call (p6_misc.py). Exact-spectrum kernel (p2_kernel.py; rerun in review probes pD_kernel_directed.py and pG_sigma_eeg.py):
    on toy VAR(1), var2_bivariate and var2_chain, H is recovered to 3.7e-15..3.9e-15, but Sigma = A0 A0^T only to 3.5e-9..4.1e-9 at the shipped tolerance 1e-8 (minimum_phase_decomposition.py:161-162); with
    tolerance 1e-12 the Sigma error falls to 4.3e-13, so the Sigma accuracy is set by the stopping tolerance. Earlier text claiming Sigma to 4e-15 was based on 5-decimal printing and is withdrawn.'
  implementation_trace:
  - pyspi/statistics/spectral.py:105-126 NonparametricSpectralBivariate._get_cache (per (measure, i, j); Multitaper + Connectivity per pair and per measure)
  - pyspi/statistics/spectral.py:63-83 NonparametricSpectralMultivariate._get_cache (sgc nonparametric path; factorises pairs inside pairwise_spectral_granger_prediction)
  - pyspi/_spectral_compat.py:15-28 numpy shim installed only on spectral_connectivity.connectivity
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-100 Multitaper defaults: time_halfbandwidth_product=3, detrend_type=''constant'', n_tapers=None, is_low_bias=True; :155-164
    n_tapers = floor(2*NW-1) = 5'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:167-178 single window = whole series; :181-185 n_fft = next_fast_len(T) (no zero padding; = T for T in {64,256,1024,4096}); :188-190
    frequencies = fftfreq(n_fft, 1/fs)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:238-260 fft: detrend(constant) -> taper (dpss, :357-387) -> FFT / fs (:335-354)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:156-172 Connectivity.from_multitaper (expectation_type 'trials_tapers' -> mean over trials and the 5 tapers, :45-53)
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:195-208 _cross_spectral_matrix S[a, b] = X_a conj(X_b); :210-220 _expectation_cross_spectral_matrix
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:259-261 _minimum_phase_factor (plain property, NOT cached: every access re-runs Wilson) -> minimum_phase_decomposition.py:161-222'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:263-266 _transfer_function = _estimate_transfer_function(Psi) restricted to the first (n_fft+1)//2 bins (decorator :73-89); :1145-1170
    H = Psi @ inv(A0), A0 = ifft(Psi)[lag 0].real
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:268-270 _noise_covariance -> :1116-1142 Sigma = A0 @ A0^T
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:697-748 pairwise_spectral_granger_prediction: per unordered pair minimum_phase_decomposition (:726-728), LinAlgError -> NaN
    (:742-743)'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/minimum_phase_decomposition.py:29-63 _get_intial_conditions: cholesky(ifft(S)[..., 0:1].real).swapaxes; except xp.linalg.linalg.LinAlgError
    (:48) -> random start from xp.random.standard_normal (:54-63)'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/minimum_phase_decomposition.py:66-99 _get_causal_signal (plus operator: lag 0 * 0.5, lower triangle zeroed, lags >= (n+1)//2 zeroed)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/minimum_phase_decomposition.py:102-125 _check_convergence (sup norm of change < tolerance per time window)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/minimum_phase_decomposition.py:128-158 _get_linear_predictor: solve(Psi, S); solve(Psi, (.)^H); + I'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/minimum_phase_decomposition.py:161-222 minimum_phase_decomposition (tolerance=1e-8, max_iterations=60; logger.warning 'Maximum iterations reached'
    and returns the last iterate)
  deviation_from_documented: Documented as a matrix factorisation of the cross-spectral matrix; implemented as such, but per ordered pair on a 2-channel matrix (not the P-channel matrix), recomputed separately
    for each measure and for (i, j) and (j, i). The multitaper grid and band rule deviate from the documented 125-bin grid (see the measure records).
  deviation_from_canonical: 'Algorithm follows Wilson 1972 / Dhamala et al. 2008 (same plus operator as their MATLAB code, including halving the upper zero-lag triangle). Deviations: (a) no zero padding
    (n_fft = T): the multitaper CSM has autocovariance up to lag T-1, which wraps on a T-point grid; the factor cannot represent lag n/2, leaving a relative factorisation residual |Psi Psi^H - S|/max|S|
    of 1e-3..2e-2 on regular data. In the lag domain the residual peaks at lag n/2 but is spread around it: on var2_bivariate T=1024 lag 512 is the largest single lag yet carries only 5% of the summed lag-domain
    residual, lags within +/-8 of n/2 carry 19%, within +/-32 33%, within +/-128 66% (pR_lagshare.py; review pF_wilson.py ''share of lag-sum at top lag 0.05''). Zero padding removes most of it (p8_resid.py:
    2.06e-2 with n_fft=T, 9.1e-5 with n_fft=2T; DTF[1,0] band mean 0.2689 vs 0.2682); (b) convergence is declared on the change of Psi, not on the residual; on logistic_maps T >= 1024 it does not converge
    in 60 iterations and the result is used anyway (p7_wilson.py); on narrowband_f0-0.25 it "converges" with residual 0.6 (line spectra violate the factorisability (Szego) condition); (c) a 5-taper single-window
    CSM has variance that does not fall with T, so every downstream directed measure has a T-independent positive bias in the null direction (~0.11, p5_bias_T.py); (d) the result depends on channel order
    by up to 5e-3 per bin (p6_misc.py equivariance: dtf 5.3e-3, dcoh 8.5e-3, gpdcoh 4.6e-3), whereas the exact factor is order-equivariant.'
  units_and_range: 'Psi and H complex, per frequency; Sigma real symmetric PSD (scaled by the multitaper normalisation); not a statistic itself; failure modes: AttributeError (numpy >= 2.4 fallback), silent
    non-convergence'
  direction_convention: n/a for the factorisation itself; H[a, b] maps innovation b into signal a (column = source, row = target), which fixes A[i, j] = j -> i for every directed measure that reads L[0,
    1] on the pair [x_i, x_j] (see spectral.dtf)
  symmetry_expected: n/a
  already_documented: tests/README.md dependency constraints (spectral-connectivity pinned at 1.1.2); DEPENDENCY_COMPATIBILITY_REVIEW.md (frequency grid / Nyquist); the numpy >= 2.4 fallback failure, uncached
    re-factorisation, residual and non-convergence are not in KNOWN_ISSUES.md
  new_finding_candidates:
  - 'CANDIDATE (numpy >= 2.4 as checked breaks the Cholesky fallback): minimum_phase_decomposition.py:48 ''except xp.linalg.linalg.LinAlgError:''; under numpy 2.5.4 ''np.linalg.linalg exists: False'' and
    evaluating the except clause raises AttributeError (p6_misc.py); the numpy.linalg.linalg shim resolves (with a DeprecationWarning) in numpy 2.2.6 and 2.3.3 and raises AttributeError in 2.4.6 and 2.5.4, so
    under numpy < 2.4 as checked the fallback is reachable and this break does not occur. Pipeline effect (p9_degenerate.py): shared_envelope (x2 bit-identical to x0, normalise=True) ->
    DirectedTransferFunction.multivariate raises ''AttributeError module numpy.linalg has no attribute linalg''; Calculator.compute (calculator.py:336-337 at HEAD a42ebc1, except Exception) then stores an
    all-NaN matrix for the SPI, so one singular pair blanks every pair. The _spectral_compat shim (pyspi/_spectral_compat.py:28) patches only the connectivity module.'
  - 'CANDIDATE (re-factorisation per property access; pack hypothesis 3 confirmed): spectral_connectivity/connectivity.py:259-274 plain properties; Wilson runs per call: dtf 2, dcoh 3, pdcoh 2, gpdcoh 3, ddtf 4 (p6_misc.py);
    per pyspi Data the cache is per (measure, i, j) so the five units never share a factorisation and (i, j), (j, i) are factorised separately (12 Wilson runs for dtf at P=3). Deterministic, so values are
    unaffected.'
  - 'CANDIDATE (factorisation residual without zero padding, peaked around lag n/2): mechanism: the plus operator zeroes lags >= (n+1)//2 (minimum_phase_decomposition.py:98) while the multitaper CSM has
    autocovariance up to lag T-1 wrapped on a T-point grid. p8_resid.py ''var2_bivariate T=1024 n_fft=1024: rel.resid 2.06e-02; largest residual lags [512, 511, 513, 508]'' vs ''n_fft=2048: rel.resid 9.11e-05'';
    mean DTF[1,0] 0.2689 vs 0.2682. The residual is not concentrated at the single lag n/2: lag 512 carries 5% of the summed lag-domain residual, +/-32 lags around it 33%, +/-128 lags 66% (pR_lagshare.py;
    2% at the top lag with n_fft=2048).'
  - 'CANDIDATE (silent non-convergence): p7_wilson.py logistic_maps T=1024 and T=4096 ''iterations= 60 NOT CONVERGED'' (residual 0.32-0.38); pyspi emits only a logging warning and returns values (p3_pipeline.py
    logistic_maps dtf [[nan, 0.9996], [0.0001, nan]], dcoh 94.46).'
  - 'CANDIDATE (fixed 5 tapers -> T-independent bias floor): transforms.py:78 time_halfbandwidth_product=3 and :163 n_tapers = 5 with a single window; null-direction DTF ~0.11 at T = 64..16384 (p5_bias_T.py).'
  - 'CANDIDATE (channel-order dependence): factorising [x_j, x_i] instead of [x_i, x_j] changes the per-bin dtf by up to 5.3e-3 (p6_misc.py ''equivariance directed_transfer_function max|L01(x0,x1) - L10(x1,x0)|
    0.00525''); relevant to any optimisation that reuses one factorisation for both orientations (not bit-identical).'
