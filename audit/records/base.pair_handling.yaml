  documentation_status: described
  verdict_adjusted: matches
  score_adjusted: 9
  score_adjustment_rules: ''
  score_adjustment_reason: ''
  identifier_exceptions: ''
  what_changed: 'The loop itself is as documented in the supplement (repeated entries for undirected statistics) and follows the glossary orientation A[i,j] = bivariate(i, j). It differs from the developer guide: every ordered pair is computed and the UPPER triangle (bivariate(i<j)) is kept, P(P-1)/2 evaluations are discarded. For the three classes that cache both orientations (xcorr, coint, je) the kept value is the first-visited bivariate(j, i), so the stored value depends on the visiting order (10 identifiers beyond rounding). What A[i,j] means is SPI-specific (direction table): only TE-type, PSI and group delay follow ''row = source, larger = stronger''.'
  new_finding: true
  definition_under_review: false
  check_cost: 'moderate: most runs 1-25 s at T=256/1024; ccm direction and cache-order runs limited to T=256 and P=2 (about 25 s each). Scope narrowed from the trace proposals (not done): proposed check 2 (from-scratch OLS Granger on var2_bivariate, delayed_noise, logistic_maps) ran as the kernel Gaussian-TE comparison on var2_bivariate and iid_gaussian only (calls-gc_gaussian); delayed_noise has a direction-only run (dir-gc_gaussian, no kernel value comparison) and gc_gaussian was not run on logistic_maps (ccm on logistic_maps_chaotic was used for the driven-map direction instead). Proposed check 4 (call counts for every Directed-loop and Undirected-mirror identifier) ran for spearmanr, gc_gaussian and the toy SPI; the 50 mirror identifiers were covered by the upper-only value runs (upper-*), not by call counts.'
  symmetry_observed: 'Undirected mirror classes (15) and Barycenter: max|A - A.T| = 0 bit-exact on iid_gaussian T=256. Bypass classes: 0 for cov, pdist, pec, cohmag, icoh, plv, dspli, dswpli, ppc, wavelet psi; 9.7e-17 precision, 2.8e-17 ids (REVIEW M2 last-bit); antisymmetric: coherence phase 1.60, pli 0.40, wpli 0.39, multitaper psi 24.1 (REVIEW M1/M3/M4/M5; tests/README.md bug 5 covers pli only). Runs base.pair_handling|iid_gaussian|256|pipeline|sym-*.'
  direction_observed: 'A[i,j] = bivariate(i, j) for the generic loop (toy run; calls-gc_gaussian on var2 matches the kernel TE(i -> j) to 3e-14). Empirical meaning on var2_bivariate / delayed_noise rows 0-1 (process 0 drives 1): gc_gaussian (TE) A[0,1] > A[1,0] on both (0.148 vs 0.013; 2.27 vs 1.3e-5): row = source. psi_multitaper: A[0,1] = -A[1,0] > 0 (136, 694): positive = row leads. gd_multitaper: delayed A[0,1] = +1.011 samples (row leads column); var2 all-NaN (REVIEW M6). dtf_multitaper: var2 A[1,0] = 0.269 > A[0,1] = 0.143 (row = target, as the spectral_directed family found) but delayed A[0,1] = 0.817 > 0.171 (the innovation-variance effect described in that family''s note). dcorrx_maxlag-1: A[1,0] > A[0,1] on both (0.195 vs 0.027; 0.974 vs -0.001): A[i,j] measures j -> i, row = target. xme_gaussian_k10 and _k1: A[0,1] < A[1,0] on both (1.238 vs 1.411; -0.857 vs 1.418): a conditional entropy, LOWER = row informs column. ccm_E-1_mean: logistic_maps_chaotic (x -> y) A[1,0] = 0.218 > A[0,1] = 0.182, i.e. high A[i,j] when j drives i (CCM convention, row = target); on var2/delayed T=256 the gap is small (0.037, 0.050) and of the other sign. anm: no consistent orientation (anm cubic pair A[0,1] > A[1,0], tanh pair and delayed_noise A[1,0] > A[0,1], var2 A[0,1] > A[1,0]). coint_aeg: mirrored, A symmetric (no direction); its kernel is asymmetric (isolated bivariate 0->1 -24.85 vs 1->0 -25.18 on var2). lmfit_Ridge: contemporaneous regression, A[0,1] - A[1,0] = 2e-16 (no direction).'
