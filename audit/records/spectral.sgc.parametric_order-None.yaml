  deviation_from_documented: '(1) Direction: documented rows = sources (glossary-of-terms.md:27); implemented A[i, j] = GC
    j -> i. Probe var2_bivariate (0 -> 1 only) T=4096: A[0,1]=0.0008, A[1,0]=0.2806. (2) "VAR model is estimated via least
    squares": nitime solves the block Yule-Walker equations with the LWR recursion on autocovariances with divisor N-k (nitime/utils.py:2170-2176),
    not OLS; with that divisor the autocovariance sequence need not be positive definite and det(ecov) can be negative. (3)
    "parametric implementation from v0.9 of NiTime": installed nitime 0.12.1. (4) Frequency grid: documented 125 bins on [4/T,
    fs/2]; implemented 513 freqz points omega_k = pi k/513 (f = k/1026) labelled k/1024, so the label 0.5 is the point 0.49903
    and the label 0.25 is 0.24951 (probe). (5) Identifiers "fmin-0" run with fmin = 1e-5, which drops only the DC point. (6)
    "maximum lag of 50": the search fits orders 0..48 (range(1, 50) with P = lag - 1) and can return only 0..47 and stops
    at the FIRST local minimum of BIC; if BIC never increases the run fails (nitime ValueError; pyspi handler raises TypeError,
    so a direct call raises and the Calculator table is all NaN) instead of using the maximum order. (7) Documented "unsigned"
    but negative values occur when the LWR noise covariance is not positive definite (see units_and_range).'
  deviation_from_canonical: 'Per-frequency formula is Geweke 1982 (nitime autoregressive.py:485-509, standard rotated-noise
    form). Value-changing differences: VAR coefficients from LWR on the N-k-divisor, non-demeaned autocovariances instead
    of OLS or the positive-definite biased (divisor N) Yule-Walker; evaluation grid off by a factor 1024/1026 relative to
    its labels; pairwise bivariate VAR. Order selection is not standard BIC: (a) first local minimum instead of global minimum
    over 0..p_max, (b) penalty with Ntotal = 2T (n_process * T) gives 2 p^2 m ln(2T)/(2T), about half the standard VAR Schwarz
    penalty (Lutkepohl 2005 SC(m) = ln det Sigma_m + m K^2 ln T / T, doubled: 2 p^2 m ln T / T); nitime deviates from its
    own stated definition here: the bayesian_information_criterion docstring (.venv/lib/python3.12/site-packages/nitime/utils.py:2348-2358,
    "an implementation of equation (51) in Ding et al. (2006)") defines N_total as "the number of time-points", i.e. T, while
    granger.py:38 passes Ntotal = n_process * x1.shape[-1] = 2T; how Ding et al. 2006 eq. (51) itself counts channels is a
    secondary question (not re-checked against the paper). Order 0 is admissible and yields GC = 0 exactly. Probe delayed_noise
    (x0 leads by 1, 3, 5): T >= 256 every pair with relative delay >= 2 gets order 0 and A = 0 exactly; only x0 -> x1 is detected
    (A[1,0] = 4.71 at T=1024). Band mean/max is a pyspi construction.'
  units_and_range: 'nats; canonical spectral GC is >= 0, but here the parametric values are not clipped: negative values and
    NaN (log of a negative ratio) occur when the LWR noise covariance is indefinite (gamma - upsilon^2/sigma < 0 or sigma
    < 0). Exactly 0 when BIC selects order 0 (iid_gaussian at all T). Directed, asymmetric; diagonal NaN; on any ValueError
    the whole table is NaN in the Calculator (via a TypeError raised by the handler at spectral.py:439), and a direct multivariate()
    call raises TypeError.'
  direction_convention: 'A[i, j] = spectral GC from process j (source, column) to process i (target, row), i.e. TARGET-by-SOURCE,
    the transpose of the documented sources-in-rows convention (GitBook glossary-of-terms.md:27) and of other pyspi directed
    SPIs (e.g. infotheory.py:274 src, targ = data[[i, j]]). Derivation: nitime gc_xy[i,j] = f_x_on_y = GC i -> j (granger.py:172,
    autoregressive.py:501-509); pyspi F[a,b] = a -> b (spectral.py:400-406) then cache[0,f,a,b] = F[b,a,f] (spectral.py:408),
    so A[a,b] = GC b -> a. Empirical: var2_bivariate A[1,0] > A[0,1] at T = 256, 1024, 4096 (truth 0 -> 1); delayed_noise
    T=1024 large entries in column 0.'
  symmetry_expected: asym
  already_documented: 'no entry in KNOWN_ISSUES.md is specific to the parametric path. Observation only, outside KNOWN_ISSUES.md:
