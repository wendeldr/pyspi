unit_id: spectral.sgc.parametric_order-None
status: profiled
correctness:
  metric_name_standard: parametric (VAR) spectral Granger causality with BIC-selected order (nitime), Geweke f_{j->i}(f),
    pairwise bivariate, band mean or max
  canonical_ref: 'Geweke J. 1982, J. Am. Stat. Assoc. 77(378):304-313 (frequency-domain causality f_{y->x}(lambda) from a
    bivariate VAR); VAR estimation: OLS or Yule-Walker/Whittle (Whittle 1963 Biometrika 50:129-134; LWR recursion Morf, Vieira
    & Kailath 1978 Ann. Statist. 6:643-648; Lutkepohl 2005, New Introduction to Multiple Time Series Analysis, ch. 3); order
    selection: Schwarz 1978 Ann. Statist. 6:461-464, VAR form Lutkepohl 2005 §4.3 (global minimum over 0..p_max); Ding, Chen
    & Bressler 2006 (q-bio/0608035) eq. (51) as cited by nitime. Equation/section numbers not re-checked against the texts
    (from memory).'
  canonical_definition: Fit x_t = sum_{k=1}^{p} A_k x_{t-k} + e_t (p selected by BIC, global minimum), Sigma = Cov(e); H(f)
    = (I - sum_k A_k e^{-i 2 pi f k})^{-1}, S = H Sigma H^H; f_{y->x}(f) = ln( S_xx(f) / [ S_xx(f) - (Sigma_yy - Sigma_xy^2/Sigma_xx)
    |H_xy(f)|^2 ] ) >= 0. Band mean/max is a pyspi construction; the full-band mean approximates the time-domain Geweke F_{y->x}
    = ln(Sigma_xx^restricted / Sigma_xx).
  documented_definition: 'supplement §1.5.12, p.17 (supplement.txt lines 809-818: heading 809, quoted text 811-818): "Spectral
    Granger causality [40] is the frequency domain equivalent to Granger causality, computed via the spectral transfer matrix
    and noise covariance that are estimated using either a parametric (VAR model) approach [41] or nonparametric (spectral
    factorization) approach [57, 58]. We implement the nonparametric form from the Spectral Connectivity Toolbox [56] and
    the parametric implementation from v0.9 of NiTime [74]. The VAR model is estimated via least squares using the same order
    for both processes, where the order is either inferred (denoted by modifier order-None) or fixed. We infer a VAR model
    order from the Bayesian information criterion (with a maximum lag of 50, implemented in the NiTime toolkit), as well as
    choosing fixed orders of one (denoted by order-1) and 20 (order-20)." Keywords: "directed, linear, unsigned, bivariate,
    frequency-dependent". Band rule, supplement §1.5, p.12 (supplement.txt heading line 570, quoted text lines 589-599): "We
    use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T ... fmin-0_fmax-0-5: the
    full-frequency range, f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]"; summary
    = mean or max over the band. Same text on GitBook spectral.md:350-358 (Spectral Granger Causality). Matrix convention
    for directed SPIs, GitBook glossary-of-terms.md:27: "entry calc.table[...][0,1] will be the directed information from
    process 0 to process 1. The rows in this table reflect the sources while the columns reflect the targets." Refs: [40]
    Granger 1969 Econometrica 37:424; [41] Geweke 1982 JASA 77:304; [56] spectral_connectivity (Denovellis et al.); [57,58]
    Dhamala, Rangarajan & Ding 2008 NeuroImage 41:354 and PRL 100:018701; [74] Rokem et al. NiTime.'
  delegate_lib: nitime==0.12.1 analysis.GrangerAnalyzer (fit_model, utils.autocov_vector, algorithms.lwr_recursion, algorithms.granger_causality_xy)
    with scipy==1.17.1 scipy.signal.freqz; numpy==2.5.4; band selection and summary native pyspi
  implemented_as: 'Input z-scored per channel (ddof=1; optional detrend). For each pair (i<j) the order is chosen by nitime:
    for lag = 1..49 fit VAR(lag-1) by LWR on the N-k autocovariances, BIC = 2 ln det(ecov) + 8 m ln(2T)/(2T), stop at the
    first increase and keep the previous order (orders 0..48 fitted but only 0..47 returnable (check stage: the last fitted
    order is never returned, a BIC still decreasing at order 48 raises ValueError); order 0 gives GC identically 0); if no
    increase occurs (including when BIC is NaN because det(ecov) <= 0) nitime raises ValueError (see the error path below).
    From (a, ecov) nitime evaluates H on omega_k = pi k/513 (scipy freqz, Nyquist excluded) and Geweke f_{x->y}, f_{y->x}
    on that grid, labelled with get_freqs = k/1024 (k = 0..512, label 0.5 at the last point). pyspi builds F[a,b] = GC a ->
    b, then transposes so cache[0,f,a,b] = GC b -> a; keeps labels 1e-5 <= f <= fmax (DC excluded by the fmin override, both
    ends inclusive), np.nanmean/np.nanmax per cell, NaN where > 50% of bins are NaN; any ValueError (BIC non-termination,
    singular LWR matrix) reaches the handler at spectral.py:438-440, whose warnings.warn(err) at :439 raises TypeError under
    the message-regex warnings filters numpy installs on import, so a direct multivariate() call raises TypeError and Calculator.compute sets the whole table
    to NaN (calculator.py:336-337); the intended all-NaN return at :440 happens only under catch_warnings(record=True)+simplefilter("always")
    or resetwarnings(). A[i, j] = band summary of GC from j to i. No mean removal inside nitime (relies on z-scoring).'
