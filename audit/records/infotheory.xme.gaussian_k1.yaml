unit_id: infotheory.xme.gaussian_k1
status: profiled
correctness:
  metric_name_standard: Conditional differential entropy of the target given lagged source values, H(Y_t | X_(t-1..t-1)) (pyspi 'cross-map entropy', no standard name)
  canonical_ref: 'none found: ''cross-map entropy'' is not a standard named quantity and pyspi documents no reference; nearest standard quantity is conditional differential entropy (Cover T.M. & Thomas
    J.A. 2006, Elements of Information Theory, 2nd ed., Wiley, §8.6). Not related in code to convergent cross mapping (Sugihara et al. 2012).'
  canonical_definition: H(Y_t | X_{t-1}, ..., X_{t-m}) = H(Y_t, X_past) - H(X_past), m = history length; under the Gaussian model 0.5*ln(2*pi*e*sigma^2(Y_t | X_past))
  documented_definition: Not defined in the supplement (no section for xme in §1.4, supplement.txt:405-565) nor in GitBook information-theory.md; only listed in GitBook table-of-spis.md:73 as 'Cross-Map
    Entropy', base identifier xme, estimators xme_kozachenko_k1/k10, xme_gaussian_k1/k10, xme_kernel_k1/k10. No formula, keywords or reference are documented.
  delegate_lib: 'JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.EntropyCalculatorMultiVariateGaussian (two calls: joint and source-past)'
  implemented_as: 'history_length=1: target future y_j(t) for t = 1..T-1 (N = T-1 samples); source past uses 1 lag of x_i (lags 1 and range(2,k) -> 1). Value = H([x_i past, y_j(t)]) - H(x_i past) with ddof=1
    Gaussian entropies on z-scored data = 0.5*ln(2*pi*e*RSS/(N-1)) of the OLS (with intercept) regression of y_j(t) on the source lags. The target''s own past is not conditioned on.'
  implementation_trace:
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 fill_diagonal NaN; :336-339 any exception from any pair -> the whole SPI entry becomes NaN (:337) and the error is recorded, warning issued at :354-355
  - 'pyspi/data.py:184-195 preprocessing in Data.set_data: optional scipy.signal.detrend(axis=1), then (default normalise=True) scipy.stats.zscore(axis=1, ddof=1)'
  - 'pyspi/base.py:84-94 Directed.multivariate: for every ordered pair i != j, A[i,j] = self.bivariate(data, i=i, j=j)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: _entropy_calc = _getcalc(''entropy'') (:36); identifier += ''_gaussian'' (:38); estimator ''gaussian'' -> labels += [''linear''], _dyn_corr_excl
    = None (:53-55)'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: every calculator gets setProperty(''BIAS_CORRECTION'',''false'') and setProperty(''NOISE_SEED'',''42''); no NORMALISE property is set'
  - 'pyspi/statistics/infotheory.py:103-134 _getcalc: ''gaussian'' (and any unrecognised estimator) falls to the else branches -> gaussian.EntropyCalculatorMultiVariateGaussian (:111-112), gaussian.MutualInfoCalculatorMultiVariateGaussian
    (:120-123), gaussian.TransferEntropyCalculatorGaussian (:129-130)'
  - 'pyspi/statistics/infotheory.py:394-403 CrossmapEntropy(JIDTBase, Directed).__init__(history_length=10): identifier += f''_k{history_length}'''
  - 'pyspi/statistics/infotheory.py:405-414 bivariate: src, targ = data.to_numpy(squeeze=True)[[i, j]]; k = history_length; targ_future = targ[k:]; src_past first column src[k-1:-1] (lag 1); loop ''for
    i in range(2, k)'' appends src[k-i:-i] (lags 2..k-1; shadows the argument i, harmless)'
  - pyspi/statistics/infotheory.py:416-426 joint = [src_past, targ_future]; H_xy = Gaussian entropy of joint; H_y = Gaussian entropy of src_past; return H_xy - H_y = H(targ_future | src_past)
  - 'pyspi/config.yaml:439-464 CrossmapEntropy configs: estimator gaussian with history_length 1 and 10'
  - 'https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/gaussian/EntropyCalculatorMultiVariateGaussian.java EntropyCalculatorMultiVariateGaussian
    (extends EntropyCalculatorMultiVariateCommon, :53-54): finaliseAddObservations :87-96 computes means and MatrixUtils.covarianceMatrix(observations, means); setCovariance :110-123 takes MatrixUtils.CholeskyDecomposition
    (throws on non-PD); computeAverageLocalOfObservations :162-175 returns 0.5*(d*(1+ln 2pi) + ln det(Sigma)) in nats'
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java :66 normalise = true by default, but
    finaliseAddObservations :178-212 only stacks observations and adds noise if addNoise (default false, :70); no normalisation is applied for the Gaussian estimator; NOISE_SEED handled :133-139 (no effect
    without addNoise)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] covarianceMatrix(double[][], double[]) :3426-3439 -> covarianceTwoColumns :3370-3377 divides by (n-1) (ddof=1);
    CholeskyDecomposition :4496-4498 (tol 10e-10 = 1e-9) / :4528-4560 throws NonPositiveDefiniteMatrixException when a pivot <= tol; determinantViaCholeskyResult :4673-4680
  deviation_from_documented: No documented definition exists (only a table entry), so the implementation cannot be compared with documentation; the history parameter named 'k' does not equal the number
    of source lags used (k=1 -> 1 lag, as the name suggests). The name suggests a cross-mapping (CCM-like) construct but the code is a plain lagged conditional entropy.
  deviation_from_canonical: 'none relative to H(Y_t | X_{t-1}) under the Gaussian model (probe var2_bivariate_T1024 A[0,1] = 1.25161306 equals numpy H([x0(t-1), x1(t)]) - H(x0(t-1)) = 1.2516130588681806).
    History lengths k=1 and k=2 both use only lag 1 (probe: k=1 1.2516131, k=2 1.2520804, k=3 1.2509918 on the same pair; k=2 differs from k=1 only by dropping one sample).'
  units_and_range: 'nats; real (differential entropy): <= approx 1.4189 under z-scoring and negative when the source past predicts the target well (analytic delayed_noise 0->1 with lag 1: approx -0.889);
    asymmetric; scale-dependent without normalisation'
  direction_convention: 'A[i,j] = H(x_j(t) | x_i(t-1..)): row i is the conditioning source, column j the target (infotheory.py:407-426). Probe var2_bivariate_T1024: A[0,1]=1.2516 < A[1,0]=1.4158 (lower
    = more predictable target)'
  symmetry_expected: asym
  already_documented: REVIEW M8 (Gaussian joint/conditional entropies can be negative despite 'unsigned') covers the sign behaviour by the same mechanism
  new_finding_candidates:
  - 'CANDIDATE (documentation gap): xme has no definition, keywords or reference in the supplement or GitBook SPI descriptions; only GitBook table-of-spis.md:73 lists it.'
  - 'CANDIDATE (off-by-one, hypothesis partly confirmed): the source-lag loop is range(2, k) (infotheory.py:411), so history_length k uses lags 1..k-1 for k >= 2 and lag 1 for k = 1; k=1 and k=2 therefore
    use the same lag set and differ only by one sample (probe 1.2516131 vs 1.2520804). Affects xme_gaussian_k10 (9 lags); xme_gaussian_k1 is as named.'
  - 'CANDIDATE (interpretation): the target''s own past is not conditioned on, so A[i,j] is dominated by the target''s marginal entropy (constant 1.4189 under z-scoring) minus the lagged linear predictability
    from the source; for autocorrelated targets it mixes common drive and autocorrelation; it is not a causal (TE-like) measure and is unrelated to cross mapping.'
