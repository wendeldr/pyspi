  what_changed: LCSS similarity of Vlachos et al. 2002 with delta = infinity, eps = 1 (documented), normalised by min(n, m) (their S1). Match test is <= eps
    instead of < eps (tie convention; identical on all test data). eps is absolute, i.e. 1 SD after z-scoring; without z-scoring (kernel path) the score depends
