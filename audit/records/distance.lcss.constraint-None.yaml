optimisation:
  complexity_P_T: 'O(P^2 T^2): tslearn lcss per ordered pair (TimeWarping is Undirected over Directed.multivariate, both orders computed, pyspi/statistics/distance.py:TimeWarping.bivariate),
    a T x T mask plus a numba DP over the full grid. Measured P_exponent 2.07, T_exponent 1.17 (8x256 -> 8x1024; a fixed per-call cost of tens
    of microseconds and a ~50 ms 8x256 overhead flatten it); 118x1024 measured (87.8 s per window). The P^2 pair term dominates.'
  hotspot_1: tslearn/metrics/dtw_variants.py:lcss (third-party:tslearn) 87.3% self time of the profiled SPI call at 8x1024 (numba njit_lcss_accumulated_matrix
    hidden in it)
  hotspot_2: tslearn/metrics/_masks.py:compute_mask (third-party:tslearn) 5.4%; instantiate_backend 5.4% (str() of the inputs)
  hotspot_owner: third-party:tslearn
  opaque_share: 0.0208
  profile_file: audit/profiles/distance.lcss.constraint-None__8x1024.pstats
  opportunities:
  - opportunity_id: dtw_family-1
    opportunity: 'One batched numba kernel over the unordered pairs: call tslearn''s njit accumulated-matrix kernels directly (_njit_accumulated_matrix
      / njit_lcss_accumulated_matrix) from a loop over i < j, build the global-constraint mask once per window (it depends only on T and the constraint)
      and skip the per-call Python layer (instantiate_backend, which formats each input array with str() to sniff the backend; to_time_series;
      compute_mask). A prange over pairs adds thread parallelism (the kernels are nogil).'
    opp_type: vectorise-batch
    expected_speedup: ~1.1x
    speedup_basis: profile:audit/profiles/distance.lcss.constraint-None__8x1024.pstats compute_mask 5.4% + instantiate_backend 5.4% removable
      serially (Amdahl 1.12x); parallel gain counted under xc-window-parallel
    output_risk: unverified-bit-identical
    risk_evidence: same njit kernel and per-cell arithmetic; only the Python call layer and the mask placement change
    effort: M
    depends_on:
    - xc-undirected-upper
    - xc-window-parallel
