unit_id: distance.lcss.constraint-None
status: profiled
correctness:
  metric_name_standard: Longest common subsequence similarity (LCSS, eps-matching, normalised by the shorter length)
  canonical_ref: Vlachos M, Kollios G, Gunopulos D 2002, Proc. 18th ICDE pp. 673-684, definitions of LCSS_{delta,eps} and similarity S1 = LCSS/min(n,m)
    (Sec. 2; definition numbering not re-checked against the PDF; the paper states the eps test per coordinate for 2-D trajectories)
  canonical_definition: LCSS(A,B) = 0 if A or B empty; 1+LCSS(Head(A),Head(B)) if |a_n-b_m| < eps and |n-m| <= delta; else max(LCSS(Head(A),B),
    LCSS(A,Head(B))); similarity S1 = LCSS_{delta,eps}(A,B)/min(n,m)
  documented_definition: 'supplement §1.2.8, p.7 (pack lines 302-311) and GitBook ''Longest Common Subsequence'': "measuring the similarity between
    continuous subsections of time series... subject to distance thresholds and alignment constraints. We use the default threshold from the tslearn
    package (eps = 1), and include the three global constraints"; keywords undirected, nonlinear, unsigned.'
  delegate_lib: tslearn==0.9.0 tslearn.metrics.lcss (dtw_variants.py:2383) -> numba _njit_lcss
  units_and_range: Dimensionless similarity in [0, 1] (count of matched pairs / min(n, m)); 1 = every point matched; higher = more similar (a
    similarity, despite the 'distance' module); symmetric in its arguments; quantised in steps of 1/T.
  direction_convention: 'Undirected: A[i,j] = A[j,i] = lcss(z_min(i,j), z_max(i,j)) via Undirected.multivariate mirroring; diagonal NaN.'
  symmetry_expected: sym
  already_documented: 'no'
  implemented_as: z-score rows (ddof=1); integer LCSS DP over the full grid with match rule |x_i - y_j| <= 1 (no time window, delta = infinity);
    score = LCSS length / min(T, T) = LCSS / T.
  implementation_trace:
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset)
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False), then scipy.stats.zscore(axis=1, nan_policy=''omit'',
    ddof=1) if normalise=True (default True)'
  - 'pyspi/base.py:132-138 Undirected.multivariate: A = Directed.multivariate(data); A[tril(-1)] = A.T[tril(-1)] (lower triangle overwritten by
    the upper triangle, so A[i,j] = bivariate(min(i,j), max(i,j)))'
  - 'pyspi/base.py:84-94 Directed.multivariate: A filled with NaN, bivariate(data, i, j) for every ordered pair i != j (both orders computed,
    diagonal stays NaN)'
  - 'pyspi/base.py:27-49 parse_bivariate: a raw (x, y) call builds Data() and add_process(x), add_process(y) (pyspi/data.py:219-240)'
  - 'pyspi/statistics/distance.py:154-163 TimeWarping.__init__: identifier += ''_constraint-'' + global_constraint.replace(''_'',''-''); self._global_constraint
    stored'
  - 'pyspi/statistics/distance.py:174-177 TimeWarping.bivariate: z = data.to_numpy(squeeze=True) (pyspi/data.py:108-118); return self._simfn(z[i],
    z[j], global_constraint=self._global_constraint)'
  - 'pyspi/statistics/distance.py:190-197 LongestCommonSubsequence: self._simfn = tslearn.metrics.lcss (eps not passed, library default used)'
  - .venv/lib/python3.12/site-packages/tslearn/metrics/__init__.py:44-55 tslearn.metrics.lcss is tslearn.metrics.dtw_variants.lcss (tslearn==0.9.0)
  - .venv/lib/python3.12/site-packages/tslearn/metrics/dtw_variants.py:2383-2391 lcss(s1, s2, eps=1.0, global_constraint=None, sakoe_chiba_radius=None,
    itakura_max_slope=None, be=None)
  - .venv/lib/python3.12/site-packages/tslearn/metrics/dtw_variants.py:2485-2496 to_time_series(remove_nans=True); mask = compute_mask_(...) where
    compute_mask_ is tslearn.metrics._masks.compute_mask (import at dtw_variants.py:11), which returns a BOOLEAN mask (.venv/lib/python3.12/site-packages/tslearn/metrics/_masks.py:199-307,
    310-361; same defaults radius 1 / slope 2.0)
  - .venv/lib/python3.12/site-packages/tslearn/metrics/dtw_variants.py:2497-2498 numpy backend -> _njit_lcss(s1, s2, eps, mask)
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/dtw_variants.py:2321-2345 _njit_lcss: acc = njit_lcss_accumulated_matrix(...); return
    float(acc[-1][-1]) / min(l1, l2)'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/dtw_variants.py:2232-2267 njit_lcss_accumulated_matrix: integer DP; line 2259 ''if numpy.isfinite(mask[i
    - 1, j - 1]):'' (True for both True and False boolean entries); line 2260 match if sqrt(squared dist) <= eps -> 1 + acc[i-1][j-1], else max(acc[i][j-1],
    acc[i-1][j])'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/dtw_variants.py:2270-2318 lcss_accumulated_matrix (non-numpy backends only): line 2306
    ''if mask[i - 1, j - 1]:'' honours the boolean mask'
  - 'https://raw.githubusercontent.com/tslearn-team/tslearn/v0.5.2/tslearn/metrics/dtw_variants.py compute_mask/sakoe_chiba_mask/itakura_mask:
    mask = numpy.full((sz1, sz2), numpy.inf) with admissible cells set to 0. (float 0/inf mask), and the same ''if numpy.isfinite(mask[i - 1,
    j - 1])'' test in njit_lcss_accumulated_matrix (WebFetch of the v0.5.2 tag)'
  deviation_from_documented: none (eps = 1 as documented; no constraint).
  deviation_from_canonical: 'Match test uses <= eps (dtw_variants.py:2260) instead of the strict < eps of Vlachos et al. (only matters on exact
    ties; probe: lcss([0,0],[1,1]) = 1.0 vs 0.0 under the strict rule). Normalisation by min(n,m) matches S1. eps = 1 is absolute, applied after
    z-scoring, i.e. one standard deviation. Unconstrained means delta = infinity (Vlachos et al. use a finite matching window delta).'
  new_finding_candidates:
  - 'Candidate (low dynamic range): with eps = 1 on z-scored data the unconstrained score saturates near 0.8 for unrelated series. Probe: independent
    N(0,1) T=64/256/1024 -> 0.797/0.805/0.809; x vs -x -> 0.828/0.797/0.807; x vs x -> 1.0. Hypothesis: lcss cannot distinguish independence from
    perfect anti-correlation and spans roughly [0.8, 1] in practice (snapshot small/full matrices span 0.84-0.97).'
  - 'Cross-family (infrastructure) candidate, affects direct two-array calls only: parse_bivariate (pyspi/base.py:33-36) builds Data() (normalise=True)
    and calls add_process(x) then add_process(y); the first call goes through set_data and is z-scored, the second is np.append-ed raw (pyspi/data.py:230-234).
    Probe with x, y ~ 5 + 3 N(0,1), T=64: stored means [0.0, 4.783], stds [1.0, 2.995]. So spi.bivariate(x, y) compares z-scored x with raw y.
    Calculator/multivariate paths are unaffected.'
