optimisation:
  complexity_P_T: 'O(P^2 (T^2 + L T^3)) with L=1: per ordered pair (Directed) hyppo time_series/_utils.py:compute_stat builds the T x T distance
    matrices twice (line 88 and inside the lag-0 Dcorr), then for lag 1 re-applies sklearn Euclidean distances to the rows of the (T-1) x (T-1)
    distance-matrix slices (a GEMM, O(T^3)) and runs Dcorr on them. Measured T_exponent 2.36 (8x256 -> 8x1024: the T^3 GEMM is not yet dominant
    at T=1024 with L=1), P_exponent 2.39 fresh (8 -> 32: 7.1 s -> 194 s, per-pair cost 127 -> 196 ms), so the fresh projection from 32 (2701 s)
    is 1.55x the family-warm pair-count projection from 8 (1743 s). The pair term dominates at 118.'
  hotspot_1: 'hyppo/independence/dcorr.py:Dcorr.statistic (third-party:hyppo) 93.4% cumulative, 62.2% self time of the profiled SPI call at 8x1024 (numba _dcorr centring/products hidden). Caveat: the profiled compute_spi total is 24.2 s against a measured 8x1024 wall of 7.07-7.11 s (3.4x, against 1.4x for dcorr and 1.2x for mgcx_maxlag-1), so the shares from this profile may be distorted by the profiling run; the cause was not investigated.'
  hotspot_2: 'hyppo/tools/common.py:compute_dist -> sklearn _euclidean_distances (third-party:sklearn) 36.9%, of which safe_sparse_dot 27.6% (the lag-1 distance-of-distance GEMM) (see the profile-inflation caveat in hotspot_1)'
  hotspot_owner: third-party:hyppo
  opaque_share: 0.0237
  profile_file: audit/profiles/distance.dcorrx.maxlag-1__8x1024.pstats
  opportunities:
  - opportunity_id: lagged_dcorr_mgc-2
    opportunity: 'Lag-major per-channel cache: compute each channel''s distance matrix once, and for every lag j its two distance-of-distance
      matrices (rows of D[j:, j:] for the leading side, D[:-j, :-j] for the lagging side) once, plus their centred forms and self products (dcorrx)
      or column ranks (mgcx); every ordered pair then needs only one cross term per lag. Processing lag by lag keeps memory at about 2P T^2 floats
      (1.9 GB at 118x1024, float64). Also removes the duplicate distance computation in hyppo/time_series/_utils.py:compute_stat (line 88 builds
      distx/disty, then the lag-0 statistic(x, y) rebuilds them). The distance-of-distance construction itself (a correctness finding) is kept
      as is.'
    opp_type: cache-sharing
    expected_speedup: 10-40x
    speedup_basis: 'profile:audit/profiles/distance.dcorrx.maxlag-1__8x1024.pstats compute_dist 36.9% + per-channel centring inside the 62.2%
      numba share + complexity: P(2L+1) per-channel builds instead of 2P(P-1)(L+1); per-component costs from audit/profiles/micro/opp_dcorr_hsic-1.json
      (the dcorr_hsic-1 micro-benchmark of lag-0 dcorr; this avenue has no micro-benchmark of its own: 1.5 ms per cross product, ~35 ms per channel
      setup) give about 13806 x 2 x 1.5 ms + 118 x 3 setups (GEMM included) = 40-80 s vs the 1743-2701
      s projections.
      Subsumed_by lagged_dcorr_mgc-3 on this unit. When the maxlag-10 identifier runs in the same run (default config) this unit''s value is read from it and the per-pair lag computation this avenue
      caches no longer runs, so build_csv credits it no saving on top of that avenue; it keeps its figure on the maxlag-10 unit'
    output_risk: unverified-bit-identical
    risk_evidence: same hyppo/sklearn/numba calls on the same per-channel slices; the lag-0 analogue is bit-identical in audit/profiles/micro/opp_dcorr_hsic-1.json
    effort: L
    depends_on:
    - xc-blas-threads
    subsumed_by:
    - lagged_dcorr_mgc-3
  - opportunity_id: lagged_dcorr_mgc-3
    opportunity: 'CONDITIONAL on the maxlag-10 identifier of the same class in the same run (dcorrx_maxlag-10 for dcorrx_maxlag-1, mgcx_maxlag-10 for mgcx_maxlag-1; true in the default config). Derive the maxlag-1 value from the maxlag-10 computation: hyppo compute_stat returns sum(dep_lag) and the first two per-lag terms are the same computation for max_lag 1 and 10, so maxlag-1 = sum of the first two terms of maxlag-10''s list when both identifiers are configured.'
    opp_type: cache-sharing
    expected_speedup: '1000-10000x'
    speedup_basis: 'complexity: CONDITIONAL on the identifier dcorrx_maxlag-10 being computed in the same run, which holds in the default config; otherwise no gain. With it, the maxlag-1 unit reduces to a two-term sum per ordered pair (13806 sums plus pyspi pair dispatch, well under 1 s per window, against the 1743-14507 s projections; family-warm increment today 7.07 s at 8x1024)'
    output_risk: unverified-bit-identical
    risk_evidence: the first two dep_lag terms are the same operations for max_lag 1 and 10; np.sum of two floats is one addition
