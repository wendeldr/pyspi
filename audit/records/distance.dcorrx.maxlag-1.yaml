unit_id: distance.dcorrx.maxlag-1
status: profiled
correctness:
  metric_name_standard: cross distance correlation (DCorrX), temporal dependence statistic with unbiased distance correlation
  canonical_ref: 'Shen, Chung, Mehta, Xu & Vogelstein 2024, "Independence Testing for Temporal Data", Trans. Mach. Learn. Res. (05/2024), arXiv:1908.06486v5, Sec. 2.2 Alg. Steps 1-3 (p.3); lag statistic:
    unbiased distance correlation, Szekely & Rizzo 2014 Ann. Stat. 42(6):2382-2412 (original dcorr: Szekely, Rizzo & Bakirov 2007 Ann. Stat. 35(6):2769-2794)'
  canonical_definition: T_n(X,Y) = sum_{l=0}^{L} ((n-l)/n) * unbiased dcorr*_n(X_vec, Y_vec_{-l}), where (X_vec, Y_vec_{-l}) = {(X_{1+l},Y_1),...,(X_n,Y_{n-l})} are the n-l lagged sample pairs (present
    X with past Y, i.e. tests Y_{t-l} -> X_t); here L = 1. Optimal lag = argmax_l of the weighted terms. The lag-l statistic is computed on the distances among the lagged samples themselves.
  documented_definition: 'supplement §1.2.2, p.5 "Cross distance correlation (dcorrx)": "The cross-distance correlation [11] quantifies the independence between two univariate time series based on distance
    correlation [13] ... This measure is the average of lagged distance correlations between the past of time series x to the future of time series y, up to a given lag." Keywords listed: "undirected, nonlinear,
    unsigned, bivariate, time-dependent". GitBook distance-similarity.md "Cross Distance Correlation" repeats the same text (key reference arXiv:1907.02088).'
  delegate_lib: hyppo==0.5.2 hyppo.time_series.DcorrX(max_lag=1).statistic -> hyppo.independence.Dcorr(bias=False) (numba-jitted _dcorr), sklearn==1.9.1 pairwise_distances
  implemented_as: pyspi z-scores each series (Data default), then calls hyppo DcorrX(max_lag=1).statistic(x=z[i], y=z[j]). hyppo forms Euclidean distance matrices D_x, D_y of the series; term 0 = unbiased
    (U-centred) Dcorr of the raw series (weight 1); for j = 1..1, term j = (n-j)/n * Dcorr(compute_distance="euclidean").statistic(D_x[j:n,j:n], D_y[0:n-j,0:n-j]), which re-applies Euclidean pairwise_distances
    to the ROWS of the sliced distance matrices (each time point represented by its vector of distances to the other retained time points), i.e. a distance of distances, not the distance among the lagged
    samples. Output = np.sum of the 2 weighted terms (lag 0 included, no division by 2). x_t (future, process i) is paired with y_{t-j} (past, process j).
  implementation_trace:
  - 'pyspi/statistics/distance.py:114-131 CrossDistanceCorrelation: __init__(max_lag) stores max_lag; bivariate takes x = z[i], y = z[j] from data.to_numpy() (shape (T,1) each) and returns DcorrX(max_lag).statistic(x,
    y)[0]'
  - 'pyspi/base.py:84-94 Directed.multivariate: A[i, j] = self.bivariate(data, i=i, j=j) for all i != j; diagonal NaN'
  - 'pyspi/base.py:27-47 parse_bivariate: passes the (already detrended/normalised by pyspi.data.Data) Data object through'
  - 'pyspi/data.py:108-118 Data.to_numpy: returns the (M, T, R) array; z[i] is (T, R) = (T, 1) for a single realisation'
  - pyspi/config.yaml:191-213 configs max_lag 1 and 10 (config labels say "undirected"; the runtime labels come from the class attribute, distance.py:119/139)
  - .venv/lib/python3.12/site-packages/hyppo/time_series/dcorrx.py:81-84 DcorrX.__init__(compute_distance="euclidean", max_lag=0)
  - .venv/lib/python3.12/site-packages/hyppo/time_series/dcorrx.py:106-112 DcorrX.statistic -> compute_stat(x, y, Dcorr, "euclidean", max_lag) (no _CheckInputs here; that is only in .test)
  - .venv/lib/python3.12/site-packages/hyppo/time_series/_utils.py:88 distx, disty = compute_dist(x, y, metric="euclidean") (n x n Euclidean distance matrices of the series)
  - .venv/lib/python3.12/site-packages/hyppo/time_series/_utils.py:92-94 indep_test = Dcorr(compute_distance="euclidean"); lag-0 term = indep_test.statistic(x, y) on the raw series
  - '.venv/lib/python3.12/site-packages/hyppo/time_series/_utils.py:97-102 for j in 1..max_lag: slice_distx = distx[j:n, j:n]; slice_disty = disty[0:n-j, 0:n-j]; term = (n-j)/n * indep_test.statistic(slice_distx,
    slice_disty)'
  - .venv/lib/python3.12/site-packages/hyppo/time_series/_utils.py:105-108 opt_lag = argmax(dep_lag); stat = np.sum(dep_lag) (weighted SUM over j = 0..max_lag, lag 0 weight 1)
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:114-121 Dcorr.__init__: is_distance = False unless compute_distance is falsy; bias=False (unbiased); is_fast=False'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:141-149 Dcorr.statistic: because is_distance is False, compute_dist(x, y, metric="euclidean") is applied to whatever is passed, including
    the (n-j)x(n-j) slices of the distance matrices -> Euclidean distances between ROWS of the distance matrices'
  - .venv/lib/python3.12/site-packages/hyppo/tools/common.py:486-503 compute_dist -> sklearn.metrics.pairwise_distances(mat, metric="euclidean")
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:262-281 _center_distmat(bias=False): U-centering (row/col sums /(n-2), grand sum /((n-1)(n-2)), diagonal zeroed)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:395-413 _dcov(only_dcov=False): sum of elementwise products of the centred matrices'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:417-449 _dcorr: covar / sqrt(varx*vary); returns 0 if varx<=0 or vary<=0; no square root for the unbiased case, so the value can be negative'
  deviation_from_documented: '(1) Supplement says "the average of lagged distance correlations"; code returns the (n-j)/n-weighted SUM over j = 0..1 (time_series/_utils.py:102,106), so values can exceed 1 (up to about
    2). (2) Supplement does not say the contemporaneous lag-0 term is included; it is, with weight 1. (3) Supplement says "between the past of time series x to the future of time series y"; with x = z[i],
    y = z[j] the code pairs FUTURE of x (z[i]) with PAST of y (z[j]) (time_series/_utils.py:99-100), so A[i,j] measures j -> i, and the GitBook glossary convention (rows = sources) is reversed. (4) Keywords in supplement
    and config.yaml say "undirected", the class labels say "directed" (pyspi treats it as directed; it is asymmetric). (5) "unsigned"/dcorr in [0,1] (GitBook glossary) is not honoured: the unbiased estimator
    gives negative values (iid probe min -0.031 at T=64). (6) Lag terms j>=1 are computed on distances between rows of the sliced distance matrices rather than on the lagged series (not stated anywhere
    in the docs).'
  deviation_from_canonical: 'Weights (n-l)/n, inclusion of lag 0, summation (not averaging), the pairing (X_{t}, Y_{t-l}) and the use of unbiased dcorr all match Shen et al. 2024 Alg. Step 3. Deviation:
    for every l >= 1 the lag statistic is not unbiased dcorr*_n of the lagged samples but unbiased dcorr*_n of Euclidean distances between rows of D_x[l:n,l:n] and D_y[0:n-l,0:n-l] (hyppo time_series/_utils.py:92,101
    constructs the test with compute_distance="euclidean" and passes distance matrices). Toy probe (n=64, x_t = y_{t-1} + 0.3 noise, max_lag=1): DcorrX = 0.746513 = dist-of-dist sum; canonical (slices used
    as precomputed distances) = 0.804605, identical to dcorr of the series slices x[1:], y[:-1]. The deviation is a different but still consistent-looking dependence statistic (each time point embedded
    by its distance profile); whether it keeps the universal-consistency guarantee of the paper is a hypothesis to examine. Upstream status: neurodata/hyppo main, hyppo/time_series/_utils.py (raw.githubusercontent.com,
    fetched 2026-10-14), still has "indep_test = indep_test(compute_distance=compute_distance, **kwargs)" and "stat = indep_test.statistic(slice_distx, slice_disty)" on slices of the distance matrices,
    identical to the installed 0.5.2 time_series/_utils.py:85-108, and main''s Dcorr.statistic / MGC.statistic still recompute compute_dist whenever is_distance is False; the branch "if not compute_distance: compute_distance
    = precomputed" in compute_scale_at_lag (called only by MGCX) is present in both main and the installed 0.5.2 (time_series/_utils.py:114-115) and is unreachable on the pyspi path (compute_distance="euclidean" is
    truthy), so it cannot rescue the lag terms from the distance-of-distances construction. The distance-of-distances construction is therefore present in current upstream, not specific to 0.5.2.'
  units_and_range: 'dimensionless; signed in practice (unbiased estimator) despite the ''unsigned'' label; |A| <= sum_(l=0..1) (n-l)/n (about 2), i.e. not bounded by 1 (check: max 1.426); asymmetric (lag-0
    term symmetric, lag terms directional); no NaN on regular input; raises ZeroDivisionError when any lag slice has fewer than 3 samples, from the numba U-centring _center_distmat (hyppo independence/dcorr.py:273-276,
    divisor n-2 and (n-1)(n-2), reached via dcorr.py:149) rather than from any input validation, i.e. requires T >= max_lag + 3 = 4 (check run distance.dcorrx.maxlag-1|delayed_noise|64|kernel|smalln: n
    = 2, 3 raise, n = 4 returns a value).'
  direction_convention: A[i,j] = bivariate(i, j) = statistic(x=z[i], y=z[j]) = dependence between the future of process i and the past of process j (plus the symmetric lag-0 term); i.e. j -> i, rows are
    targets and columns are sources (from the code; confirmed by the check-stage dir runs, see direction_observed).
  symmetry_expected: asym
  already_documented: 'partly: the class ''unsigned label on a legitimately negative bias-corrected estimator'' is documented for other SPIs in REVIEW M7 (docs/storage_comparison/REVIEW.md:189-193, negative debiased dspli/dswpli/ppc estimates are valid; metadata should separate an unsigned population target from the estimator range), REVIEW M8 (REVIEW.md:197, pec/pec_log negative despite unsigned) and EEG_OPTIMIZATION_NOTES.md:169 (review topic ''legitimate negative estimates''); none of them names dcorrx, so its negative values are a new instance of that class (same treatment as dcorr_hsic). The distance-of-distances lag construction, the weighted sum over lags, the direction convention and the ''undirected'' keyword are not in KNOWN_ISSUES.md'
  new_finding_candidates:
  - 'Lag terms j >= 1 are computed on Euclidean distances between rows of the sliced distance matrices (distance of distances), not on the lagged series, so dcorrx_maxlag-1 differs from the Shen et al.
    2024 statistic. Evidence: hyppo time_series/_utils.py:92 "indep_test = indep_test(compute_distance=compute_distance, **kwargs)" with compute_distance="euclidean"; :101 "stat = indep_test.statistic(slice_distx,
    slice_disty)"; independence/dcorr.py:144-147 recomputes compute_dist because is_distance is False. Probe probe1.py: DcorrX(max_lag=1)=0.7465126779854767 equals the dist-of-dist sum exactly; slices passed
    as precomputed = 0.8046051179514783 = dcorr of series slices.'
  - 'Output is the (n-j)/n-weighted SUM over lags 0..1 including the contemporaneous lag 0, not the "average" stated in the supplement; values exceed 1. Evidence: hyppo time_series/_utils.py:102 "dep_lag.append((n
    - j) * stat / n)", :106 "stat = np.sum(dep_lag)". Probe probe3.py T256: dcorrx_maxlag-1 max off-diagonal 1.4255.'
  - 'Direction is reversed relative to the supplement wording and the GitBook glossary: A[i,j] measures dependence of the future of i on the past of j (j -> i, rows = targets). Evidence: hyppo time_series/_utils.py:99-100
    slices distx[j:n] (x = z[i] at later times) against disty[0:n-j] (y = z[j] at earlier times); distance.py:128-130 x = z[i], y = z[j]; glossary-of-terms.md:27 "rows in this table reflect the sources".
    Probe probe2.py delayed_noise T256 (x0 leads x1 by 1): dcorrx_maxlag-1 A[1,0]=0.9681 vs A[0,1]~0.000.'
  - 'The SPI is labelled "unsigned" (and the glossary says distance correlation lies in [0,1]) but the unbiased estimator returns negative values on independent data. Evidence: hyppo independence/dcorr.py:438-447
    returns covar/sqrt(varx*vary) without clipping for bias=False. Probe probe2.py iid_gaussian T64: dcorrx_maxlag-1 off-diagonal min -0.0311, 13 of 20 entries negative. Instance of the REVIEW M7/M8 class (KNOWN_ISSUES.md:31-32); not a new finding by itself.'
  - 'Documentation keywords say "undirected" (supplement and config.yaml) while the class is Directed with label "directed". Evidence: supplement §1.2.2 keyword line "undirected, nonlinear, unsigned, bivariate,
    time-dependent"; pyspi/config.yaml:204-210 "- undirected"; pyspi/statistics/distance.py:114,119 class (Directed, Unsigned) with "directed" label.'
