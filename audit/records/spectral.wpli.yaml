    path: pipeline-detrend
    reference: pyspi with detrend=True vs detrend=False (the dependency removes only the mean, not a linear trend)
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: 'values differ when linear trends are present (probe T=256: PLV max diff 0.109, PPC 0.173, PLI 0.056); record which bands change (expected mostly the low band)'
  check_method: independent-impl
