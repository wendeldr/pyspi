unit_id: spectral.wpli
status: profiled
correctness:
  metric_name_standard: weighted phase lag index, SIGNED variant (E[Im S] / E[|Im S|] over tapers), band mean / band max
  canonical_ref: Vinck, Oostenveld, van Wingerden, Battaglia & Pennartz 2011, NeuroImage 55:1548-1565 ("An improved index of phase-synchronization for electrophysiological data in the presence of volume-conduction, noise and sample-size bias"), wPLI definition (equation number not re-checked)
  canonical_definition: Phi = |E{Im X}| / E{|Im X|}, X the cross-spectrum per trial (observation); equivalently |E{|Im X| sign(Im X)}| / E{|Im X|}; range [0, 1], symmetric.
  documented_definition: 'supplement §1.5.8, p.15 (supplement.txt:715-750): "... we include weighted variations that make the measure more robust against electrophysical artifacts (namely, field spread), noise, and sample-size bias by weighting components based on the imaginary coherence [68]: the weighted phase lag index (wpli) ..." Labels undirected, unsigned (config.yaml:796-802). GitBook spectral.md:233-280. Grid/band text: supplement §1.5, pp.12-13 (heading supplement.txt:570; grid text :582-599; the pack line ranges for §1.5.6-1.5.8 are offset, actual headings at :686, :701, :715): "Each measure is based on the cross- and power-spectral densities at a given frequency and sampling rate, which is estimated via the multitaper technique ... We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2], where fs/2 is the Nyquist frequency and f0 = 4/T ... we take the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5: f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]." Same text on GitBook spectral.md:16-20.'
  delegate_lib: spectral_connectivity==1.1.2 Multitaper.fft + Connectivity.weighted_phase_lag_index (numpy 2.5.4); band mean/max native pyspi
  implemented_as: 'Same multitaper front end (K=5 DPSS, NW=3, whole series, bins m/n_fft, m = 0..n_fft/2-1). Per bin: w = mean_k |Im S_ij,k|; w < 2.22e-16 (absolute float eps) is replaced by 1; wPLI_ij(f) = mean_k Im S_ij,k / w. Signed, no absolute value. DC bin: Im S = 0, w -> 1, wPLI = 0. pyspi: np.nanmean / np.nanmax over bins with fmin <= f <= fmax; no symmetrisation.'
  implementation_trace:
  - 'pyspi/config.yaml:796-823 WeightedPhaseLagIndex configs: (fs=1), (fmin=0, fmax=0.25), (fmin=0.25, fmax=0.5), and the same three with statistic=max; labels undirected, linear, unsigned, bivariate, frequency-dependent'
  - 'pyspi/statistics/spectral.py:190-197 WeightedPhaseLagIndex(NonparametricSpectralMultivariate, Undirected): identifier "wpli", _measure "weighted_phase_lag_index", labels ["unsigned", "spectral", "undirected"]'
  - 'pyspi/data.py:184-195 Data preprocessing: optional scipy.signal.detrend(axis=1), then zscore(axis=1, nan_policy="omit", ddof=1) (default normalise=True, detrend=False)'
  - 'pyspi/calculator.py:295-355 Calculator.compute (cited at HEAD a1f20c7): :329 S = spi.multivariate(dataset); :332 np.fill_diagonal(S, nan); :336-337 any exception -> whole SPI table NaN (error recorded :338-339); :354-355 warning'
  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fmax None -> fs/2; statistic "mean" -> np.nanmean, "max" -> np.nanmax; identifier suffix f"_multitaper_{statistic}_fs-{fs}_fmin-{fmin:.3g}_fmax-{fmax:.3g}" with "." -> "-"'
  - 'pyspi/statistics/spectral.py:45-50 key = (self.measure,) for these classes: one cached spectrum per measure, shared by all band/statistic variants on a Data object'
  - 'pyspi/statistics/spectral.py:64-83 _get_cache: z = data.to_numpy(squeeze=True).T (T x P); m = sc.Multitaper(z, sampling_frequency=fs) (all other arguments default); conn = sc.Connectivity.from_multitaper(m); res = getattr(conn, measure)(); freq = conn.frequencies; first insert keyed by the bare string measure at :81 (one redundant recompute, tests/README.md worth knowing)'
  - 'pyspi/statistics/spectral.py:85-91 multivariate (parse_multivariate, pyspi/base.py:51-68): freq_id = np.where((freq >= fmin) * (freq <= fmax)); adj = statfn(res[0, freq_id, :, :], axis=0)'
  - 'pyspi/statistics/spectral.py:101-102 np.fill_diagonal(adj, nan); returned as is. MRO (probe): [cls, NonparametricSpectralMultivariate, NonparametricSpectral, Unsigned, Undirected, Directed, object], so Undirected.multivariate (pyspi/base.py:132-138) is never reached (REVIEW M1; tests/README.md bug 5 before b2f6d7e)'
  - pyspi/_spectral_compat.py:15-28 replaces spectral_connectivity.connectivity.np by a namespace whose in1d maps to np.isin; all other numpy calls unchanged (not on the path of these measures)
  - 'spectral_connectivity==1.1.2 .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-100 Multitaper.__init__ defaults: time_halfbandwidth_product=3, detrend_type="constant", n_tapers=None, n_fft_samples=None, time_window_duration=None (one window = the whole series), is_low_bias=True'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:155-164 n_tapers = floor(2*NW - 1) = 5; :469-543 dpss_windows, :668-673 _get_low_bias_tapers keeps eigenvalues > 0.9 (probe: 5 tapers kept at T = 64, 256, 1024, 4096)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:167-190 n_time_samples_per_window = T; n_fft_samples = scipy.fftpack.next_fast_len(T); frequencies = fftfreq(n_fft, 1/fs)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:238-260 fft(): _sliding_window (single window), detrend(type="constant") (:701-, subtracts each channel mean), _multitaper_fft (:335-354) fft(x * taper, n=n_fft)/fs -> fourier_coefficients (1 window, 1 trial, K=5 tapers, n_fft, P)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:156-172 from_multitaper(expectation_type="trials_tapers"); :45-53 EXPECTATION["trials_tapers"] = mean over axes (1, 2) = 1 trial x 5 tapers; :276-287 n_observations = 5
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:195-208 _cross_spectral_matrix = _complex_inner_product(X[..., None], X[..., None]) (:1187-1190 matmul(a, conj(b).T), :1485-1487) -> S_ij,k = X_i,k * conj(X_j,k)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:210-220 _expectation_cross_spectral_matrix(fcn): blocks None -> mean over tapers of fcn(S)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:73-89 _non_negative_frequencies keeps indices 0..(n_fft+1)//2 - 1 (DC kept, Nyquist dropped for even n_fft); :174-180 frequencies uses the same slice
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:576-601 weighted_phase_lag_index: weights = mean_k |Im S| (:596-599); weights[weights < xp.finfo(float).eps] = 1 (:600); return mean_k Im S / weights (:601); non-negative frequencies'
  deviation_from_documented: '(1) Labels unsigned/undirected but values signed and antisymmetric for the mean variants [REVIEW M3 and M1; tests/README.md bug 5 names PLI only]. (2) The weighting is by |Im S| of the per-taper cross-spectrum, not by the imaginary coherence as the text says (wording). (3) Frequency grid: documented 125 uniform bins on [f0 = 4/T, fs/2]; implemented n_fft/2 bins (n_fft = next_fast_len(T) = T for the probed powers of two) at f = m/n_fft, m = 0..n_fft/2-1, i.e. DC included, Nyquist excluded, f0 = 0 not 4/T (probe: 32/128/512/2048 bins at T = 64/256/1024/4096, first bin 0.0, last 0.484375 at T=64). Band rule freq >= fmin & freq <= fmax is inclusive at both ends, so the f = 0.25 bin is counted in both the low and the high band whenever 0.25 is a grid point, i.e. when n_fft = scipy.fftpack.next_fast_len(T) is a multiple of 4; this holds for every manifest size (T = 64/256/1024/4096) and for the 512- and 1024-sample EEG windows (probe: low band 17 bins 0..0.25, high band 16 bins 0.25..0.484 at T=64), but not in general (probe grid_tie.py: at T = 30 and 250, n_fft = 30 and 250 has no 0.25 bin and the inclusive low/high counts are 8/7 and 63/62). Taper count: K = 5 tapers pass the eigenvalue > 0.9 filter at every probed T >= 10 (10, 16, 30, 64, 100, 250, 256, 512, 1000, 1024, 4096); at T = 7 and 8 (n_fft = 8) only 4 tapers are kept and n_observations = 4, so every K = 5 statement in this record assumes T >= 10. (4) Max variants are asymmetric.'
  deviation_from_canonical: '(1) Signed numerator E[Im S] instead of |E[Im S]| (M3). (2) Expectation over 5 tapers of one window instead of trials. (3) The absolute eps floor (connectivity.py:600) maps an all-zero imaginary part to 0 instead of undefined, and makes the value scale-dependent for raw input with tiny amplitude: probe delayed_noise T=256 with normalise=False, A[0,1] = 0.9536 at scale 1 and 1e-6 but 6.2e-17 at scale 1e-8 and 6.2e-21 at 1e-10 (check run spectral.wpli|delayed_noise|256|kernel|scale-canon; the raw mean Im S once the denominator is floored to 1) (PLI, PLV, dswPLI unchanged). (4) Signed band means cancel across frequency for delays (probe delayed_noise T=1024 delay 5: mean wPLI 0.199, delay 3: 0.319, delay 1: 0.957). (5) Band max of a signed quantity: asymmetric.'
  units_and_range: dimensionless, signed, in [-1, 1]; mean variants antisymmetric (probe max |A + A^T| = 0.0); max variants asymmetric (probe shared_envelope T=1024 wpli_max A[0,1] = 0.969, A[1,0] = 1.0); wpli_max under independence equals 1.0 for every pair of the audit iid_gaussian dataset at T >= 256, but over 30 fresh iid seeds (P = 5, 20 off-diagonal entries; probe sat.py) for 0.96 of entries at T = 256 (minimum per seed 0.85) and all entries at T = 1024 and 4096 (0.50 at T = 64); wpli_max = 1 exactly when all 5 Im S of some bin share a sign, the same event as pli_max = 1; identical channels give 0.0 (w floored to 1).
  direction_convention: 'Same orientation as PLI: A[i,j] > 0 when channel i phase-leads channel j by an angle in (0, pi) (S_ij = X_i conj X_j; probe delayed_noise T=1024 mean wPLI[0,1] = +0.957 for x1 = x0 delayed 1 sample); mean variants A[j,i] = -A[i,j] exactly.'
  symmetry_expected: antisym
  already_documented: 'REVIEW M3 (signed wPLI; abs(mean) vs mean(abs) across frequencies); REVIEW M1 (mirror bypass; tests/README.md bug 5 before b2f6d7e; current bug 5 names PLI only); EEG_OPTIMIZATION_NOTES.md §review (signed PLI/wPLI); REVIEW M4 and DEPENDENCY_COMPATIBILITY_REVIEW.md (DC included, Nyquist excluded). Elaboration of REVIEW M3 with numbers (not a new finding): signed band-mean cancellation for delays, delayed_noise T=1024 mean wPLI 0.9568 / 0.3188 / 0.1992 for delays 1 / 3 / 5 samples (see deviation_from_canonical (4)).'
  new_finding_candidates:
  - 'CANDIDATE: absolute eps floor makes wPLI scale-dependent on raw input: connectivity.py:600 "weights[weights < xp.finfo(float).eps] = 1"; probe7 (normalise=False) delayed_noise T=256 A[0,1] = 0.953605 at scales 1 and 1e-6, 6.2e-17 at 1e-8 and 6.2e-21 at 1e-10 (check stage: the raw mean Im S, because the denominator is replaced by 1; the trace probe printed 0.000000). With the default normalise=True the floor is only hit at DC and for identical channels.'
  - 'CANDIDATE: max variants are asymmetric and saturated under independence (probe iid_gaussian wpli_max = 1.0 for every pair at T >= 256 on the audit dataset, but in 0.96 of off-diagonal entries at T = 256 over 30 fresh seeds and all entries at T >= 1024, probe sat.py; shared_envelope T=1024 A[0,1] = 0.9691, A[1,0] = 1.0).'
  - 'CANDIDATE: identical or zero-lag channels give exactly 0 (shared_envelope x2==x0: A[0,2] = 0.0) via the floor, where the canonical ratio is 0/0; the DC bin also contributes 0 to fmin=0 bands.'
  - 'CANDIDATE (wording): the supplement says the weighting is "based on the imaginary coherence"; the code weights by |Im S| of the raw per-taper cross-spectrum (spectral_connectivity/connectivity.py:596-601).'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - var2_bivariate
    - var2_chain
    - delayed_noise
    - narrowband_f0-0.1
    - shared_envelope
    path: kernel
    reference: 'from-scratch numpy/scipy multitaper that does not import spectral_connectivity: per-channel mean removal, scipy.signal.windows.dpss(T, NW=3, Kmax=5), numpy.fft.fft(x * taper), S_ij,k = X_i,k conj(X_j,k) on bins m = 0..n_fft/2-1, the measure formula written out per taper, inclusive band mask, np.nanmean / np.nanmax over bins (feasibility probe probe6.py: PLV and wPLI per-bin agreement <= 1e-11 at T <= 1024, DC excluded); wPLI(f) = mean_k Im S / mean_k |Im S| (signed, with the eps floor reproduced) and the canonical |mean_k Im S| / mean_k |Im S|'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: 'signed reference agrees to <= 1e-9 on off-diagonal entries provided |Im S_ij,k| <= 1e-12 * max_k |S_ij,k| is set to exactly 0 (a sign tie) before the measure formula. Measured in the check stage (refs/spectral_phase_sync.py:csm, keys tie_* in results.json): the elementwise product X[:, None] * conj(X[None, :]) gives Im S exactly 0.0 at DC on every off-diagonal entry of every dataset (iid_gaussian, delayed_noise, var2_bivariate, narrowband_f0-0.25, shared_envelope at T = 64/256/1024), because the DC coefficient of real input is real; it leaves rounding noise only on the diagonal (1.1e-16 to 3.5e-15) and for the bit-identical channels shared_envelope (0,2) (2.6e-16 to 1.3e-15), where the library matmul (connectivity.py:1187-1190) returns exactly 0. Without the rule the identical pair differs by 1.0 for PLI, 1.25 for dsPLI, up to 0.993 (T=256) / 1.0 (T=1024) for wPLI, and dswPLI is finite where the library gives NaN (runs spectral.wpli|shared_envelope|{64,256,1024}|kernel|perbin, key no_tie_rule_*); the rule zeroed exactly the 5 x 2 x (n_bins - 1) identical-pair entries and nothing else (tie_zeroed_offdiag_nonDC 1270 at T=256). The diagonal is masked (pyspi NaN-fills it). the tie rule is applied before the eps floor, otherwise bit-identical channels give a rounding-noise ratio instead of the library 0 (probe tie3.py: elementwise reference on shared_envelope T=256 pair (0,2) gives |wPLI(f)| up to 0.976 where the library gives 0.0, because the noise |Im S| of order 1e-15 exceeds the absolute eps); canonical unsigned band values differ (report per identifier)'
  - datasets:
    - delayed_noise
    path: pipeline
    reference: 'analytic direction: x_k(t) = x0(t - d_k); predicted sign of wPLI[0,k](f) = sign(sin(2 pi f d_k))'
    reference_kind: analytic
    criterion: direction
    expected_outcome: establishes A[i,j] > 0 <=> i phase-leads j; wpli_mean A[0,1] > 0, A[1,0] = -A[0,1]; per-bin sign agreement >= 95 % on non-DC bins
  - datasets:
    - narrowband_f0-0.1
    - narrowband_f0-0.4
    path: kernel
    reference: 'analytic: relative phases -pi/4 (0,1), +pi/2 (0,2), +3pi/4 (1,2) at f0'
    reference_kind: analytic
    criterion: direction
    expected_outcome: 'per-bin wPLI at f0: (0,1) ~ -1, (0,2) ~ +1, (1,2) ~ +1'
  - datasets:
    - delayed_noise
    path: pipeline
    reference: analytic scale invariance of the canonical ratio; pyspi on Data(x * s, normalise=False) for s in {1, 1e-6, 1e-8, 1e-10}
    reference_kind: analytic
    criterion: exact
    expected_outcome: 'canonical: identical for all s; implemented: identical down to 1e-6, collapses to the raw mean Im S (6.2e-17 at s = 1e-8, 6.2e-21 at 1e-10) because the eps floor replaces the denominator by 1'
  - datasets:
    - iid_gaussian
    path: kernel
    reference: 'Monte Carlo null with numpy: 5 iid complex Gaussian taper coefficients per channel per bin, statistic as implemented'
    reference_kind: independent-impl
    criterion: statistical
    expected_outcome: wpli_mean consistent with 0; wpli_max -> 1 for T >= 256; mean variants antisymmetric, max variants asymmetric
  - datasets:
    - scaled_offset
    path: pipeline
    reference: 'analytic invariance: per-taper phase quantities are invariant to positive per-channel scaling, and the constant offset is removed by the dependency detrend; compare Data(normalise=True) vs Data(normalise=False)'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: 'max |A_norm - A_raw| <= 1e-12 for every identifier (probe at T=256: <= 1.1e-16 for all six measures)'
  - datasets:
    - var2_chain
    - iid_gaussian
    path: kernel
    reference: 'analytic: the measure for pair (i, j) depends only on channels i and j (shared tapers, per-channel FFT); compare the P-channel matrix entry with the same pyspi call on the 2-channel subset'
    reference_kind: analytic
    criterion: exact
    expected_outcome: 'identical values (probe var2_chain T=256 pair (0,2): difference 0.0 for all six measures), confirming "multivariate" is a batched bivariate computation'
  - datasets:
