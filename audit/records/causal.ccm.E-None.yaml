  deviation_from_documented: '(1) Documented E = "maximum of the two univariate delay embeddings that best predicted each
    time series"; code takes embed_df.max()["E"] = 10 for every process (known bug 2): probe on T=256 data gives pyspi E =
    10 while the argmax-rho E is 1 (logistic x), 9 (iid process 0), 3 (iid process 1), 7 (var2 process 1). (2) 22 library
    sizes, not 21; truncated at short T (see candidates). (3) diff is not defined in the supplement (which lists six SPIs)
    and only named on the GitBook; code defines it as mean over L of rho(x_j|M_i) - rho(x_i|M_j) = mean - mean^T. (4) Keywords
    say unsigned, class is Signed. (5) Orientation candidate: A[i,j] is evidence for j -> i.'
  deviation_from_canonical: (1) E is fixed at 10 instead of chosen by simplex forecast skill. The documented rule (one E =
    max(E_i, E_j) for both directions) is attributed by the supplement (p.9) to the Sugihara 2012 Supplementary Materials
    and the pyEDM documentation, and pyEDM/cppEDM take one E per CCM call; whether each direction should instead use the E
    of the variable being embedded is an interpretation, not a sourced canonical rule (no Sugihara 2012 passage prescribing
    per-direction E was located). (2) Convergence, the CCM causal criterion, is replaced by the mean or max of rho over L
    (documented; the mean includes the small-L part of the curve). (3) diff is a pyspi-specific antisymmetric skill difference,
    not part of Sugihara 2012. (4) tau fixed at 1 sample, no exclusion radius beyond self (Sugihara 2012 has no Theiler window
    either; later EDM practice recommends one). (5) Otherwise the per-library cross-map (E+1 neighbours, exp(-d/d_min) weights,
    Pearson rho, random libraries) matches Sugihara 2012 / rEDM practice (Sugihara 2012 does not specify a tie rule; when
    the (E+1)-th neighbour distance is tied, cppEDM CCM keeps the first E+1 entries of std::sort by distance with no tie expansion
    (the expansion in Simplex.cc L93-157 is gated to Method::Simplex, EDM_Neighbors.cc L282), so the neighbours chosen among
    equal distances depend on the implementation-defined sort order; this affects values only when neighbour distances tie,
    e.g. the period-4 process of logistic_maps).
  units_and_range: 'Dimensionless Pearson correlations. mean and max in [-1, 1] (negative values occur; cppEDM returns rho
    = 0, not NaN, when either vector has zero variance, Common.cc L205-207); diff in [-2, 2] and antisymmetric (diff = mean
    - mean^T). Diagonal: 0 from a direct .multivariate call (ccmf initialised to zeros), NaN after Calculator.compute. Whole
    matrix NaN when cppEDM throws (short series). Not symmetric for mean/max.'
  direction_convention: 'A[i,j] = summary over L of rho(x_j | M_{x_i}): skill of predicting process j from the delay embedding
    of process i (pyEDM column "proc_i:proc_j", causal.py:143). By Sugihara''s criterion a large A[i,j] is evidence that j
    causes i (j -> i), the transpose of pyspi''s generic Directed orientation A[i,j] = i -> j (base.py:91-93; TE infotheory.py:377-383).
    diff[i,j] = mean_L[rho(x_j|M_i) - rho(x_i|M_j)] > 0 means j -> i dominates. Probe (logistic_maps T=256, process 1 drives
    process 0, E=2): A_mean[0,1] = 0.7415 > A_mean[1,0] = 0.3226, diff[0,1] = +0.4188. Confirmed in the check stage (the probe
    quoted above ran on the old period-4 logistic_maps fixture): on logistic_maps_chaotic (x = process 0 drives y = process
    1 only) ccm_E-1_diff gives diff[1,0] = +0.0360 (dir-diff, pass) and the swapped input (processes [1, 0]) gives diff[0,1]
    = +0.0360 (dir-diff-swap, pass); ccm_E-10 at T=1024 gives mean A[1,0] = 0.5921 vs A[0,1] = -0.0512, diff[1,0] = +0.6432
    (stats3-E10, T=1024); the delegate kernel at E=2 (full library) gives ''y xmap x'' = A[1,0] = 0.8824 vs A[0,1] = 0.2909.
    So A[i,j] = rho(x_j | M_{x_i}) and a large A[i,j] is evidence that j -> i (row = target), the transpose of the glossary
    convention (glossary-of-terms.md:25-27, rows = sources) and of TE/GC (base.pair_handling|var2_bivariate|1024|pipeline|calls-gc_gaussian:
    row = source).'
  symmetry_expected: asym
  already_documented: 'tests/README.md bug 2 (ConvergentCrossMapping(embedding_dimension=None) picks max E (10), not best-rho
