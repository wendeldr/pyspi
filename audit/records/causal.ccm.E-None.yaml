optimisation:
  complexity_P_T: 'O(P^2 S L_n T L) ~ O(P^2 T^2): one pyEDM.CCM call per unordered pair (pyspi/statistics/causal.py:118-144), each cross-mapping both directions over S = 100 random libraries for each of L_n = 22 library sizes (L up to about T) with k-NN search over the library for about T prediction rows. Per-pair T exponent from 7x100 (golden data) to 8x256 (synthetic): 1.75; the check stage''s single E=10 pair took 85 s at T=1024 alone, which implies about 2.3 between T=256 and 1024, so the estimate is a lower bound. summary.json has no 118 projection (8x1024 skipped-budget): ESTIMATE 2.8e5 s per window at 118x1024 = per-ordered-pair 20.1 s at T=1024 x 13,806 ordered pairs (family-warm), plus O(P T^2) for one pyEDM.EmbedDimension per channel (1.5% at 4x256); the 85 s check-stage pair would give 5.9e5 s; pair term dominates.'
  hotspot_1: ~:<built-in method pyBindEDM.CCM> (third-party:pyEDM, C++ cppEDM via pyEDM/CoreEDM.py:CCM) 98.4% of the profiled SPI call at 4x256 (6 calls, one per unordered pair)
  hotspot_2: ~:<built-in method pyBindEDM.EmbedDimension> (third-party:pyEDM, via pyEDM/CoreEDM.py:EmbedDimension) 1.5% of the profiled SPI call at 4x256 (4 calls, one per channel)
  hotspot_owner: third-party:pyEDM
  opaque_share: 0.999
  profile_file: audit/profiles/micro/causal.ccm.E-None__4x256.pstats
  opportunities:
  - opportunity_id: ccm-1
    opportunity: 'Run the unordered-pair loop of ConvergentCrossMapping._from_cache (pyspi/statistics/causal.py:118-144) in a process pool: one pyEDM.CCM call per pair, each independent and seeded, results written into ccmf by index.'
    opp_type: parallel
    speedup_kind: throughput
    expected_speedup: 8-16x alone (at most ~2x inside a window worker)
    speedup_basis: 'profile:audit/profiles/micro/causal.ccm.E-None__4x256.pstats pyBindEDM.CCM 98.4% (6 calls, one per unordered pair) + complexity: 6,903 independent calls per window at P=118; each call already runs its two cross-map directions in two threads (cppEDM CCM.cc:80-90, CCM_THREADED; measured CPU/wall 2.00 for one call at T=256, audit/profiles/micro/probe_ccm_threads.json), so at most about 16 concurrent calls on the 32 physical cores (Threadripper 3970X, 64 logical CPUs) -> <= 16x per-window latency; no core-hour saving, and window-level parallelism (xc-window-parallel) competes for the same cores; the two are alternatives for those cores, not factors that multiply, so xc-window-parallel is not in depends_on: with the ~8 memory-bounded window workers running, about 4 physical cores per worker remain, so inside a window worker this pool lowers the unit''s latency by at most about 2x (two two-thread calls at a time). No ranking basis on this row. profiles/summary.json has no 118x1024 projection for this unit (its fresh and family-warm reasons read ''no 118x1024 measurement and no ok 8x1024 + 32x1024 records to fit (no extrapolation from 8x1024 alone)''), so rank_basis_s and projected_patient_s_after stay blank. build_csv ranks the row as saving 0 s, after every row of its tier and kind with a positive saving, then by output risk and effort (README ''Optimisation columns'', rule 5).'
    output_risk: unverified-bit-identical
    risk_evidence: every pyEDM.CCM call passes seed=42 and reads only its two columns of the same DataFrame; no state carries between calls
    effort: S
    depends_on: []
  - opportunity_id: ccm-3
    opportunity: 'Reuse the cross-map neighbour sets across targets: with seed 42, the same library sizes and the same E, the random libraries and the k-NN sets and simplex weights of a CCM call depend only on the source column, so compute them once per source channel and apply them to every target (O(P) neighbour searches per window instead of O(P^2)); needs a re-implementation of cppEDM''s CCM outside pyEDM.'
    opp_type: algorithmic
    expected_speedup: 10-50x
    speedup_basis: 'profile:audit/profiles/micro/causal.ccm.E-None__4x256.pstats pyBindEDM.CCM 98.4% + complexity: per call the k-NN search over each random library (O(S L_n T L), S=100 samples, L_n=22 sizes, library size L up to T) dominates; after reuse each target needs only the weighted gather and Pearson per row, O(S L_n T k); at P=118 each source is searched once instead of 117 times. No ranking basis on this row. profiles/summary.json has no 118x1024 projection for this unit (its fresh and family-warm reasons read ''no 118x1024 measurement and no ok 8x1024 + 32x1024 records to fit (no extrapolation from 8x1024 alone)''), so rank_basis_s and projected_patient_s_after stay blank. build_csv ranks the row as saving 0 s, after every row of its tier and kind with a positive saving, then by output risk and effort (README ''Optimisation columns'', rule 5).'
    output_risk: unverified-rng-stream
    risk_evidence: 'requires reproducing cppEDM''s random library draws outside cppEDM. The cppEDM source used by the check stage confirms the premise of the avenue: CrossMap seeds its own std::default_random_engine with seed=42 per direction (CCM.cc:114, 203) and draws row indices from uniform_int_distribution(RNGStart, RNGStop) (CCM.cc:175-176, 220) into an unordered_set until libSize are kept (CCM.cc:274-285), so the draws depend only on the seed, the number of library rows (N, E, tau) and the library size, not on the data values. They are implementation-defined (libstdc++ engine, distribution and unordered_set iteration order), so outside cppEDM they are reproduced only by emulating libstdc++; draws that differ change the curves within sampling error (the check stage matched an independent random-library implementation only within statistical tolerance)'
    effort: L
    depends_on: []
