unit_id: causal.ccm.E-None
status: profiled
correctness:
  metric_name_standard: Convergent cross mapping (CCM) cross-map skill rho(L) = corr(X_j, Xhat_j | M_{X_i}) summarised over
    library sizes L (mean, max) and the directional skill difference (diff)
  canonical_ref: 'Sugihara G, May R, Ye H, Hsieh C-h, Deyle E, Fogarty M, Munch S (2012) Detecting causality in complex ecosystems.
    Science 338(6106):496-500, main text and Supplementary Materials (cross-map estimate, simplex weights, convergence criterion);
    simplex projection: Sugihara G & May RM (1990) Nature 344:734-741; E selection by simplex forecast skill: Sugihara & May
    1990 and Chang, Ushio & Hsieh (2017) Ecol Res 32:785-796.'
  canonical_definition: Shadow manifold M_X = {x(t) = (X(t), X(t-tau), ..., X(t-(E-1)tau))}. For each t take the E+1 nearest
    library neighbours x(t_1..t_{E+1}) of x(t) (t itself excluded), u_i = exp(-d(x(t),x(t_i))/d(x(t),x(t_1))), w_i = u_i/sum
    u; cross-map estimate Yhat(t)|M_X = sum_i w_i Y(t_i); skill rho(L) = Pearson corr(Y, Yhat|M_X) for random libraries of
    length L. Y causes X ("X <- Y") is inferred when rho(Y|M_X) increases with L and converges; the two directions are compared.
    Convergence, not a summary of the curve, is the causal criterion.
  documented_definition: 'supplement §1.3.5, p.8-9 (pack lines 381-413): "there is a causal influence from time series x →
    y if the Takens time-delay embedding of y can be used to predict the observations of x"; E-None: "we infer the embedding
    dimension to be the maximum of the two univariate delay embeddings that best predicted each time series"; "we use 21 uniformly
    sampled library sizes between this minimum and maximum"; "summary statistics of the mean (modifier mean) and the maximum
    (max) across the curves"; keywords list "unsigned". The supplement lists six ccm SPIs (no diff). GitBook spi-descriptions/causal-inference.md
    (Convergent Cross-Mapping) repeats this text and adds "mean (mean), maximum (max) and difference (diff) across the curves"
    without defining diff; it lists all nine identifiers.'
  delegate_lib: 'pyEDM==1.15.2.0 (cppEDM 1.15.2, 2023-11-27, compiled in pyBindEDM): pyEDM.CCM(dataFrame, E=None->10, columns=proc_i,
    target=proc_j, libSizes="lowerE upperE inc", sample=100, seed=42) with defaults Tp=0, knn=0 -> E+1, tau=-1, exclusionRadius=0,
    random=True, replacement=False ; plus pyEDM.EmbedDimension(lib=pred="10 N-10", maxE=10, Tp=1) per process'
  implemented_as: 'Default pipeline z-scores each process. E=None: for each process, pyEDM.EmbedDimension (simplex, Tp=1,
    lib = pred = rows 10..N-10, E = 1..10) is run and embedding[i] = embed_df.max()["E"], the column maximum of E, which is
    always 10 (known bug 2), so E = 10 for every pair. Then for each unordered pair (i<j) one pyEDM.CCM call with E = max(E_i,
    E_j) = 10, tau = 1 sample, Tp = 0, knn = E+1 = 11 (exactly E+1: CCM does not expand ties, see below), no exclusion radius
    (self excluded), 100 random libraries per size drawn without replacement (seed 42), library sizes lowerE = 20 to upperE
    = floor((T-11)/10)*10 in steps floor((upperE-20)/21), first 22 sizes kept. Each library size gives the mean over 100 libraries
    of Pearson rho between observed and cross-mapped values over all prediction rows (rows 9..T-1). ccmf[i,j,:] = rho(x_j
    | M_{x_i})(L); ccmf[j,i,:] = rho(x_i | M_{x_j})(L). Statistics: mean = nanmean over the 22 L, max = nanmax over L, diff
    = nanmean over L of ccmf - ccmf^T. The result is bitwise identical to causal.ccm.E-10 (probe on var2_bivariate T=256:
    "mean E-None==E-10: True", "diff E-None==E-10: True"). Neighbour ties: cppEDM tie detection runs only when parameters.method
    == Method::Simplex (EDM_Neighbors.cc L282); CCM builds its Parameters with Method::CCM (API.cc L659) and reuses them unchanged
    in colToTarget/targetToCol (CCM.cc L21-26) and in the per-sample local SimplexClass (CCM.cc L342), so ties/anyTies stay
    false, the tie expansion in Simplex.cc L93-157 never runs, and exactly knn = E+1 neighbours are used: the first E+1 entries
    of std::sort by distance only (DistanceCompare, Common.cc L10-13; EDM_Neighbors.cc L226), whose order among equal distances
    is unspecified (std::sort is not stable). Exactly-zero distances still get weight 1 with all others at the 1e-6 floor
    (Simplex.cc L57-70). On logistic_maps the embedded process 1 (period-4 driver, 4 distinct values) has a tie at the (E+1)-th
    neighbour distance at every prediction row (probe fable_dt3/fm2.py, T=256, full library: 256 of 256 rows at E=1, 247 of
    247 at E=10), so the whole ccmf[1,0] curve on that dataset depends on which equal-distance rows std::sort places first.
    Probe fable_recheck_cdt_ccm_gwtau/ccm_tie_probe.py (T=256, full library, random=False), proc1:proc0: pyEDM.CCM 0.258036085716451
    (E=1) and 0.412996812927705 (E=10) vs a tie-expanded reference 0.449407364219300 / 0.438997955936925 (which pyEDM.Simplex(lib=pred=all,
    Tp=0) reproduces to <= 1.7e-16) and a plain stable-argsort E+1 reference 0.016209343992146 / 0.408547833137669; the tie-free
    column proc0:proc1 matches both references to <= 3.3e-16.'
