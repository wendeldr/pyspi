    Measured T exponent -0.02; 270 s projected at 118 (extrapolated-pairs-from-8).'
  hotspot_1: pyspi/statistics/infotheory.py:MutualInfo.bivariate (third-party:jidt KSG, self time) 100.0% cum / 96.1% self of the profiled SPI call at 8x1024
  hotspot_2: 'pyspi/statistics/infotheory.py:JIDTBase._set_theiler_window (pyspi) 3.8% cum, of which pyspi/utils.py:acf is 0.45% (56 calls, 0.023 s of the 5.13 s call; np.correlate 0.13%) and 3.3% is the
    frame''s own self time (0.171 s: the loop and the 56 JIDT setProperty calls, which JPype dispatches without cProfile entries), not acf. A self time that large shows up in 2 of the 5 DCE profiles, here and
    in te_kraskov_DCE_auto at 8x256 (0.299 s, 0.72%), against 0.06-0.08% in the tlmi_kraskov_DCE and te_kraskov_DCE k-1 / k-2 profiles at 8x1024. audit/profiles/micro/probe_theiler_window_calls.json times every
    call without cProfile (3 fresh processes x 2 SPI calls per DCE unit, two runs): after the window-building first call (16-35 ms here, almost all acf) a call takes a median of 0.02-0.03 ms, apart from rare
    single stalls, here one of 155 ms in 1 of 6 SPI calls in one run and none in the other. The stalls are not work of this frame: in the probe''s precall case (te_kraskov_DCE_auto) a trivial Java call timed
    just before each _set_theiler_window call takes them over and the frame stays below 0.06 ms, so they land on the first Java call of a pair. opaque_share is a lower bound: JPype dispatches Java methods
