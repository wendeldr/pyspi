    countPointsWithinR skips |dt| <= dynCorrExclTime and counts norm < r strictly (allowEqualToR=false)'
  deviation_from_documented: '(1) Window formula: documented as ''the product of the autocorrelation functions of both time series''; implemented as 2 × the inner product of the two full sample ACFs over
    lags 0..T−1, truncated with int(). (2) Documented as a heuristic for the autocorrelation time from Bartlett''s formula; the implemented value equals Bartlett''s 1 + 2Σ_{k>=1} r_i(k) r_j(k) plus exactly
    1 before truncation (probe p3: raw − Bartlett = 1.00 on every pair). (3) Because all T−1 lags are summed, W is not an autocorrelation time for oscillatory or trending inputs: it grows linearly with
    T (narrowband ≈ T/3: 22/85/339/1353 at T=64/256/1024/4096). (4) Other undocumented details as in infotheory.mi.kraskov (jitter, seed, nats, negative values).'
  deviation_from_canonical: 'KSG1 with Theiler window as implemented in JIDT (from-scratch KSG1 with |dt| <= W exclusion reproduces pyspi to <= 1e-12 at W = 2-85, probe p5). ψ(N) is not adjusted for the
    excluded points (JIDT notes this as an open TODO, MutualInfoCalculatorMultiVariateKraskov1.java:102-104 at JIDT a9b6b3e). The window size rule is a pyspi heuristic (see infotheory.theiler_window); canonical practice
    chooses W of the order of the autocorrelation time, whereas here W can exclude about two thirds of the series. Effect on values is large where W is large (narrowband_f0-0.1 T=256 pair (0,1): 1.448 without,
    2.239 with DCE).'
  units_and_range: nats; real, can be negative (probe iid_gaussian T=256 min -0.036); symmetric; NaN when T <= 4 + 2W (JIDT exception caught), not observed for MI on the audit datasets because W <= ~T/3
  direction_convention: 'Undirected: A[i, j] = A[j, i]. Directed.multivariate (base.py:88-94, called via super) computes bivariate(i, j) for every ordered pair i != j, lower triangle included; Undirected.multivariate
    (base.py:134-137) then overwrites the lower triangle with the transpose, so A[i, j] = A[j, i] = bivariate(min(i,j), max(i,j)) and the bivariate(max, min) result is computed and discarded. KSG1 itself
    is symmetric (probe p2: bivariate(0,1) = bivariate(1,0) = 0.033251782902); the DCE window matrix is symmetric (infotheory.py:208-211)'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'CANDIDATE (pack hypothesis confirmed): window = int(2·dot(acf_i, acf_j)) = int(Bartlett + 1); probe p3 shows raw2dot − (1 + 2Σ_{k>=1}) = 1.00 for every pair, e.g. iid_gaussian T=256 W = 2 where Bartlett
    gives 1.04; gauss_ar1_pair T=1024 W = 5 vs 4.14. The pair value is computed once per Data object and cached (infotheory.py:197-212), not recomputed per pair.'
  - 'CANDIDATE: W scales with T for oscillatory, trending or slowly varying inputs because the inner product runs over all T lags: narrowband_f0-0.1 W = 22/85/339/1353 (T=64..4096), logistic_maps 14/39/208/665,
    trending without detrend 1403 at T=4096 (2 with detrend), cointegrated 1277 at T=4096, shared_envelope 1084 at T=4096 (probe p3). A Theiler window of ~T/3 removes about 2/3 of candidate neighbours for
    every point.'
  - 'CANDIDATE: on these inputs DCE increases the estimate markedly instead of only removing a small bias: narrowband_f0-0.1 T=256 pair (0,1) 1.448 -> 2.239; narrowband_f0-0.25 T=64 min over pairs 0.329
    -> 1.227; logistic_maps T=64 0.186 -> 0.720 (probes p5, p13).'
  - 'CANDIDATE: the value depends on the machine''s core count at the 1e-14 level, because NUM_THREADS defaults to availableProcessors() (64 here) and per-thread digamma partial sums are added in thread
    order. Probe p2 (bivariate_gaussian T=1024): max |A(default) - A(NUM_THREADS=1)| = 7.1e-15 mi, 1.1e-14 mi_DCE, 1.6e-14 tlmi, 2.4e-15 te_k1, 4.2e-15 te_auto; repeat runs on the same machine are bit-identical.'
  - 'CANDIDATE: on tied or discrete-valued inputs the estimate is set by the 1e-8 jitter and its seed. Probe p12, logistic_maps T=256 (series 1 is the period-4 r=3.5 map, 4 distinct values): pair 1->0 for
    NOISE_SEED 42/43/44 gives mi 0.226622/0.226587/0.230899, tlmi 0.278902/0.276961/0.281417, te_k1 0.115063/0.113329/0.107266, te_auto 0.101410 (l,lt=7,2) / 0.089128 (10,2) / 0.044229 (6,1); bivariate_gaussian
    is identical for all seeds.'
  - 'CANDIDATE (estimator property, not a pyspi bug): labelled ''unsigned'' but KSG estimates are negative on independent data. Probe p13 minima at T=64: mi -0.167 (nonlinear_dependence), tlmi -0.143 (iid_gaussian),
    te_k1 -0.134 (logistic_maps), te_auto_DCE -0.178 (cointegrated); at T=256 iid_gaussian mi min -0.055.'
  - 'CANDIDATE (new, confirmed by probe): a deep copy of this SPI loses NOISE_SEED and prop_k. JIDTBase.__deepcopy__ (infotheory.py:77-82) deep-copies the JPype calculator, which yields a fresh Java object
    with JIDT constructor defaults (NOISE_SEED ''NONE'', k 4). CalculatorFrame.init_from_list deep-copies the base Calculator (calculator.py:556-563, deepcopy at :559), so CalculatorFrame runs this SPI
    with unseeded jitter. On tie-free data the value is unchanged (var2_bivariate T=256 diff 0.0, probe scratchpad it_kraskov_fix/p_te_copy.py). On tied input it is not reproducible: logistic_maps T=256
    pair 1->0 (channel 1 has 4 distinct values) mi_DCE 0.603752 on every run, three deep copies 0.592057/0.606156/0.603638 (probe scratchpad it_kraskov_fix/p_tied_dce.py). The k reset is harmless at NN-4
    but changes any NN-k with k != 4: mi_kraskov_NN-6 on bivariate_gaussian T=256 (0,1) 0.039668 -> 0.028352 after deepcopy (probe scratchpad it_kraskov_fix/r4_deepcopy.py). Pickle (JIDTBase.__setstate__
    via _getcalc/_setup) keeps NOISE_SEED and prop_k and reproduces the original.'
  - 'CANDIDATE (efficiency, correctness-neutral): every unordered pair is estimated twice. Directed.multivariate (base.py:88-94) runs bivariate for all P(P−1) ordered pairs and Undirected.multivariate (base.py:134-137)
    discards the lower triangle, so half of the KSG runs are thrown away; KSG1 MI is symmetric (probe p2), so computing i<j only would give the same matrix at half the cost.'
