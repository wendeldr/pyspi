optimisation:
  complexity_P_T: 'O(K*P*T log T) FFT + O(K*n_fft*P^2) two-sided taper-level CSM materialised as (1,1,5,n_fft,P,P) complex128 (connectivity.py:196-257) + O(n_fft*P^2) normalisation, K=5 tapers, n_fft=T; plus a P-independent DPSS cost (~17-20 ms, pure Python). Measured P exponent 1.06 (fit 8->32) and 2.71 between the 32x1024 and 118x1024 walls, T exponent 0.92: at P<=32 the fixed DPSS cost dominates (dpss_windows 71.3% of the 8x1024 profile), at 118x1024 the P^2 taper-level CSM term dominates (DPSS 1.6%) and the local exponent above 2 reflects GB-sized temporaries (memory-bound), not extra arithmetic.'
  hotspot_1: .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:coherency (third-party:spectral_connectivity) 74.1% of the profiled SPI call at 118x1024
  hotspot_2: '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_complex_inner_product 33.4% at 118x1024; numpy angle (numpy/lib/_function_base_impl.py:angle) 17.0%; at 8x1024 transforms.py:dpss_windows 71.3% (audit/profiles/spectral.phase__8x1024.pstats) | opaque_share is the 8x1024 profile-JSON value (audit/profiles/spectral.phase__8x1024__profile.json, builtin tottime over the whole profile); the 118x1024 pstats named in profile_file gives a builtin tottime share of 0.203 of the compute_spi frame (audit/profiles/micro/prof_spectral__index.json). Both are lower bounds: numpy ufunc work sits in the self time of the calling Python frame.'
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.098
  profile_file: audit/profiles/micro/prof_spectral.phase__118x1024.pstats
  basis_scope_note: 'Cache key (measure,) (pyspi/statistics/spectral.py:46-50): the untimed EEG bands read the cached array as the timed non-retained bands do (0.007-0.024 s each), apart from the second phase
    identifier, which rebuilds it through the first-insert string key (spectral.py:81; 2.63 s against the first build''s 2.29 s). CoherencePhase is the first spectral class in
    pyspi/workflow/retained185.yaml:218, so an EEG run pays that duplicate on phase too, and the configured sum stands in for one build, the duplicate and the band reads'
