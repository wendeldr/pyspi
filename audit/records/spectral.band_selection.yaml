unit_id: spectral.band_selection
status: profiled
correctness:
  metric_name_standard: band-limited summary (arithmetic mean or maximum over the frequency bins inside [fmin, fmax]) of a per-frequency spectral connectivity measure
  canonical_ref: 'No canonical source fixes inclusive vs exclusive band edges. The documented rule (supplement §1.5) uses closed intervals. For PSI the canonical band rule is Nolte et al. 2008, Phys. Rev. Lett. 100:234101, eq. 3 (sum over frequency pairs (f, f + df) at the native resolution within band F). Bastos & Schoffelen 2016, Front. Syst. Neurosci. 9:175 (supplement [59]) describes band-averaging of spectral measures. Nolte eq. 3 checked against arXiv:0712.2352v1 p.2 (not the PRL journal copy): Psi_tilde_ij = Im(sum_{f in F} C_ij^*(f) C_ij(f + delta_f)), where delta_f "is the frequency resolution", with C_ij from eq. 4. Bastos & Schoffelen is cited for practice only, without a section or equation, and was not re-checked.'
  canonical_definition: 'For a grid f_k and band [fmin, fmax]: B = {k : fmin <= f_k <= fmax} (closed, as documented); summary = (1/|B|) sum_{k in B} m(f_k) or max_{k in B} m(f_k). The same B for every SPI that shares an (fmin, fmax) label. For PSI: Psi = Im sum_{f in F} conj(C(f)) C(f + df) over adjacent frequencies.'
  documented_definition: 'supplement §1.5, p.13 (pack lines 582-613; heading at supplement.txt line 570): "In order to obtain SPIs, we take the mean (denoted by modifier mean) and the maximum (max) values of each measure over three ranges of the spectrum ... fmin-0_fmax-0-5: the full-frequency range, f in [0, fs/2]; fmin-0_fmax-0-25: the lower frequencies, f in [0, fs/4]; and fmin-0-25_fmax-0-5: the higher frequencies, f in [fs/4, fs/2]", on a grid of "125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T". GitBook spectral.md:16-20 has the same text. No rule is documented for PSI/GD sub-sampling or for the EEG bands (the EEG identifiers come from the retained list audit/env/retained_metrics.txt and are not in config.yaml).'
  delegate_lib: pyspi (numpy 2.5.4 np.where, np.nanmean, np.nanmax) for the multivariate, bivariate and SGC paths; spectral_connectivity==1.1.2 connectivity._bandpass and _get_independent_frequency_step for PhaseSlopeIndex and GroupDelay
  implemented_as: 'The grid is conn.frequencies = k/n_fft for k = 0..(n_fft+1)//2 - 1 (DC included, Nyquist excluded). Four paths apply different rules. (a) Multivariate SPIs (cohmag, phase, icoh, plv, pli, wpli, dspli, dswpli, ppc) use freq_id = (freq >= fmin) & (freq <= fmax), inclusive, then np.nanmean or np.nanmax over the frequency axis. NaN bins are skipped silently; an empty selection gives NaN with a RuntimeWarning (mean) or raises ValueError (max). For plv the statistic is applied to |PLV|. (b) Nonparametric SGC uses the same inclusive rule, but fmin <= 0 is overridden to 1e-5, which excludes DC. (c) Bivariate directed SPIs (dcoh, pdcoh, gpdcoh, dtf, ddtf) use a strict rule, (freq > fmin) & (freq < fmax). This drops DC from fmin=0 bands and drops the f = 0.25 bin from both half bands. (d) PSI and GD: pyspi first calls the library method with default arguments, which raises TypeError (PSI at connectivity.py:1329; GD at :1357). It then passes frequencies_of_interest=[fmin, fmax] and frequency_resolution=(fmax-fmin)/50. _bandpass is strict (connectivity.py:1329-1331). PSI keeps every step-th bandpassed bin, with step = ceil(n_fft (fmax-fmin)/50); at T=1024 the full band has step 11 and uses 47 bins. PSI then sums over all unordered pairs (M5). GD regresses the unwrapped phase on the largest significant cluster of the bandpassed bins, subsampled by step, and requires at least 3 points; otherwise the result is NaN. pyspi''s own freq_id is computed but not used for PSI (IndexError fallback) or GD (TypeError fallback). Bin counts (inclusive/strict): T=64 full 32/31, low 17/15, high 16/15; T=256 128/127, 65/63, 64/63; T=1024 512/511, 257/255, 256/255; T=4096 2048/2047, 1025/1023, 1024/1023. The f = 0.25 bin lies on the grid at every manifest T and is counted in both the low band and the high band under the inclusive rule.'
  implementation_trace:
  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fmax default fs/2; statistic mean -> np.nanmean, max -> np.nanmax, delay/slope/rvalue -> None; identifier uses fmin/fmax formatted .3g'
  - pyspi/statistics/spectral.py:72-77 TypeError fallback to _get_statistic; freq = conn.frequencies
  - pyspi/statistics/spectral.py:88 multivariate freq_id = np.where((freq >= fmin) * (freq <= fmax)) (inclusive)
  - pyspi/statistics/spectral.py:90-101 statfn(adj_freq[0, freq_id, :, :], axis=0); IndexError fallback adj_freq[0] (PSI, :92-93); TypeError fallback picks delay/slope/rvalue (GD, :94-100)
  - pyspi/statistics/spectral.py:132-134 bivariate freq_id = np.where((freq > fmin) * (freq < fmax)) (strict); statfn(bv_freq[0, freq_id, 0, 1])
  - pyspi/statistics/spectral.py:176-177 PhaseLockingValue wraps statfn with np.absolute
  - 'pyspi/statistics/spectral.py:297-301 PhaseSlopeIndex._get_statistic: frequencies_of_interest=[fmin, fmax], frequency_resolution=(fmax - fmin)/50'
  - 'pyspi/statistics/spectral.py:313-317 GroupDelay._get_statistic: same arguments'
  - 'pyspi/statistics/spectral.py:343-345 SpectralGrangerCausality: fmin <= 0 overridden to 1e-5; :421-423 inclusive freq_id and statfn; :425-435 NaN-fraction mask'
  - pyspi/calculator.py:327-339 (HEAD a1f20c7) any exception in multivariate -> the whole SPI table entry is NaN and the MetricReport has status failed with the error description
  - spectral_connectivity/connectivity.py:73-89 _non_negative_frequencies; :174-180 Connectivity.frequencies
  - 'spectral_connectivity/connectivity.py:1313-1335 _bandpass: (foi[0] < frequencies) & (frequencies < foi[1]) (strict)'
  - spectral_connectivity/connectivity.py:1338-1357 _get_independent_frequency_step = int(ceil(frequency_resolution / frequency_difference))
  - 'spectral_connectivity/connectivity.py:1060-1104 phase_slope_index: _bandpass (:1091-1093), step sub-sampling (:1095-1102), _inner_combination(...).imag (:1104; :1107-1113 all unordered pairs)'
  - 'spectral_connectivity/connectivity.py:902-987 group_delay: step (:930-934), _bandpass (:935-937), _find_significant_frequencies (:946-951; :1432-1482 with min_group_size=3 at :1408-1429), masked linregress (:962-967)'
  deviation_from_documented: '(1) The documentation uses closed intervals. The bivariate directed SPIs (spectral.py:132), PSI and GD (connectivity.py:1329-1331) use open intervals: DC is dropped from fmin=0 bands and f = fs/4 from both half bands. At T=1024 the strict path averages 511, 255 and 255 bins against 512, 257 and 256 for the multivariate path under the same identifier suffix. (2) The Nyquist bin is never on the grid, so [.., fs/2] is in effect [.., fs/2 - 1/n_fft] (already documented, REVIEW M4). (3) The inclusive multivariate rule puts the f = fs/4 bin in both the low and the high band, so the documented "lower" and "higher" ranges overlap by one bin. (4) The documented 125-bin grid from f0 = 4/T is not used: DC is inside every multivariate fmin=0 band and the bin count is n_fft/2. (5) PSI is computed on a sub-sampled grid (step = ceil(n_fft (fmax-fmin)/50)), which is not documented, and GD only on the largest significant cluster with at least 3 points.'
  deviation_from_canonical: 'There is no canonical edge rule, but one (fmin, fmax) label should denote one bin set. Here the bin set depends on the SPI class (inclusive multivariate, strict bivariate/PSI/GD, DC-excluded SGC). For PSI, Nolte 2008 eq. 3 uses adjacent frequency pairs at the native resolution. The library instead sums all pairs (M5, already documented) on a grid sub-sampled with frequency_resolution = band/50, which is not tied to the multitaper bandwidth 2W = 6/T (at T=1024: band/50 = 0.01 for the full band vs 2W = 0.0059). For the narrow EEG bands the bin sets are tiny. With the exact edges configured in pyspi/workflow/retained185.yaml (0.5, 2, 4, 6, 15, 35, 75 and 125 divided by 1024; check stage confirmed, the earlier hypothesis is resolved), T=1024 gives inclusive counts 2, 3, 3 and strict counts 1, 1, 1 for (0.5-2), (2-4) and (4-6); T=512 gives inclusive 1, 2, 2 and strict 0, 0, 0. With the rounded identifier values (0.000488, 0.00195, 0.00391, 0.00586), T=1024 would give inclusive and strict counts 1, 3, 2; the identifier string keeps only 3 significant digits, but the workflow configuration (retained185.yaml) stores the exact floats, so the exact-edge counts are the ones computed (check stage: masks runs).'
  units_and_range: n/a (selection and aggregation step). The output keeps the units of the per-frequency measure. nanmean/nanmax ignore NaN bins. An empty multivariate selection gives an all-NaN matrix (nanmean) or ValueError -> NaN table (nanmax). With fewer than 2 strict bins PSI raises IndexError -> NaN table; with fewer than 3 usable bins GD returns NaN, and with 0 bins it raises ValueError -> NaN table.
  direction_convention: 'n/a for the selection itself; orientation is unchanged: multivariate A[i,j] = stat over the selected bins of m[i,j](f) (row i leads when its CSM phase is positive, see spectral.multitaper_csm); bivariate A[i,j] = stat over bins of entry [0,1] of the 2-channel [i,j] result.'
  symmetry_expected: n/a
  already_documented: REVIEW M4 (DC included, Nyquist excluded, arithmetic mean of principal angles); REVIEW M5 (PSI sums all unordered frequency pairs in the band); REVIEW M6 (GD all-NaN cases observed in saved data); DEPENDENCY_COMPATIBILITY_REVIEW.md:74-84 (Nyquist inclusion and PSI band forwarding in newer spectral-connectivity); EEG_OPTIMIZATION_NOTES.md §review (spectral band forwarding, phase aggregation/endpoints)
  new_finding_candidates:
  - 'CANDIDATE (pack hypothesis confirmed): the edge rule differs by path. Multivariate uses >= / <= (spectral.py:88: "np.where((freq >= self._fmin) * (freq <= self._fmax))"). Bivariate directed uses > / < (spectral.py:132: "np.where((freq > self._fmin) * (freq < self._fmax))"). PSI/GD use the library''s strict _bandpass (connectivity.py:1329-1331). Probe counts, inclusive/strict: T=1024 full 512/511, low 257/255, high 256/255; T=64 32/31, 17/15, 16/15.'
  - 'CANDIDATE: the f = 0.25 bin is on the grid at every manifest T (probe: "bin 0.25 in grid: True" at T = 64, 256, 1024, 4096). The inclusive rule counts it in both fmin-0_fmax-0-25 and fmin-0-25_fmax-0-5; the strict rule counts it in neither.'
  - 'CANDIDATE (pack hypothesis confirmed, extends REVIEW M6): narrow EEG bands leave 0-3 bins. Probe on 3 iid channels with edges at exact k/1024: at T=1024, psi raises "IndexError: too many indices for array" for (0.5-2), (2-4) and (4-6), because one strict bin leaves no frequency pair (connectivity.py:1110-1111); gd returns [nan nan nan] (fewer than min_group_size = 3 points); cohmag returns single-bin values. At T=512, gd raises "ValueError: zero-size array to reduction operation maximum" and dcoh returns [nan nan nan] (0 strict bins). Calculator turns each exception into an all-NaN table (calculator.py:327-339 at HEAD a1f20c7, status failed in the MetricReport). Whether the EEG run hits these cases depends on the float band edges (recorded exactly in pyspi/workflow/retained185.yaml) and on the epoch length (0.5 s at 2048 Hz = 1024 samples in the workflow example).'
  - 'CANDIDATE (refines DEPENDENCY_COMPATIBILITY_REVIEW.md:84 for 1.1.2): with the pinned 1.1.2 the PSI band is forwarded, but only because the default-argument call fails. A spy on Connectivity.phase_slope_index shows "kwargs {}" (raises TypeError at connectivity.py:1329, "NoneType object is not subscriptable"), then "kwargs {frequencies_of_interest: [0, 0.25], frequency_resolution: 0.005}". GD fails at connectivity.py:1357. Any library version whose defaults do not raise would silently compute the full band.'
  - 'CANDIDATE: PSI sub-samples the bandpassed bins with step = ceil(n_fft (fmax-fmin)/50) (connectivity.py:1095-1102 with pyspi/statistics/spectral.py:300). Probe bin counts used: T=256 full band step 3 -> 43 bins; T=1024 step 11 -> 47; T=4096 step 41 -> 50. So PSI uses at most about 50 bins, at a spacing set by band width rather than by the taper bandwidth.'
  - 'CANDIDATE: aggregation is NaN-ignoring (np.nanmean/np.nanmax at spectral.py:29-32), so bins where the measure is NaN (for example zero power) are dropped silently and the effective bin count can vary per pair. An empty selection behaves differently by statistic: nanmean gives NaN with a RuntimeWarning, while nanmax raises "ValueError: zero-size array to reduction operation fmax which has no identity" (probe), so the whole table becomes NaN.'
