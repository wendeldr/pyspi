optimisation:
  complexity_P_T: 'O(P^2 T): ConditionalEntropy.bivariate (infotheory.py:246-249) = cached joint entropy (P(P-1)/2 JIDT calls, shared with je through data.joint_entropy) minus a cached marginal (P calls,
    data.entropy). Measured fresh P exponent 2.07, T exponent 0.95; family-warm after je only the P marginals remain (P exponent 1.12, 0.8 ms at 8x1024). At 118x1024 fresh the joint-entropy pairs dominate
    (11.6 s measured); family-warm 0.044 s projected.'
  hotspot_1: pyspi/statistics/infotheory.py:JIDTBase._compute_joint_entropy (third-party:jidt + jpype, self time) 93.5% cum / 92.8% self of the profiled SPI call at 8x1024
  hotspot_2: 'pyspi/statistics/infotheory.py:JIDTBase._compute_entropy (third-party:jidt, self time) 5.6% cum. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the
    JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jpype
  opaque_share: 0.0094
  profile_file: audit/profiles/infotheory.ce.gaussian__8x1024.pstats
  opportunities:
  - opportunity_id: it_gaussian-1
    opportunity: Compute the pairwise Gaussian SPIs for all pairs at once in numpy from one ddof=1 covariance of the z-scored rows (lag blocks x(t-m) and x(t+1) for tlmi and TE), with a batched slogdet
      over the pair sub-matrices, instead of one JIDT calculator call per pair through JPype (infotheory.py:JIDTBase._compute_joint_entropy, MutualInfo.bivariate, TimeLaggedMutualInfo.bivariate, TransferEntropy.bivariate).
    opp_type: replace-library
    expected_speedup: ~10x family-warm after je (fresh ~3000x)
    speedup_basis: 'microbench:audit/profiles/micro/opp_it_gaussian-1.json (ce_gaussian: candidate alone at 118x1024 3.6 ms including Data construction (2.9 ms), against the quiet summary.json 118x1024
      walls 11.63 s fresh (measured) and 0.0444 s family-warm (extrapolated-pairs-from-32) = 3189x / 12x; same-run speedups against the pyspi baseline on the shared machine 28x at 8x1024 and 271x at 32x1024
      in the latest run (29x / 446x in the first; the 32x1024 same-run baselines are noisy)) + profile:audit/profiles/infotheory.ce.gaussian__8x1024.pstats pyspi/statistics/infotheory.py:159 _compute_joint_entropy
      93.5% (the candidate replaces the whole multivariate call; its own cost is one (k+1)P-square covariance plus O(P^2) small slogdets, milliseconds at 118x1024); family-warm after je, ce is already a
