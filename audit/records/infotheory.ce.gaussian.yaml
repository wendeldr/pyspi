unit_id: infotheory.ce.gaussian
status: profiled
correctness:
  metric_name_standard: Conditional differential entropy H(Y|X) under a bivariate Gaussian model
  canonical_ref: Cover T.M. & Thomas J.A. 2006, Elements of Information Theory, 2nd ed., Wiley, §8.6 (conditional differential entropy h(Y|X) = h(X,Y) - h(X)); supplement cites MacKay 2003
  canonical_definition: H(Y|X) = H(X,Y) - H(X) = 0.5*ln(2*pi*e*sy^2*(1-rho^2)) nats
  documented_definition: 'supplement §1.4.2, p.10 (supplement.txt:451-457): ''Conditional entropy [33] quantifies the uncertainty over the observations in y in the context of simultaneously observing x'';
    keywords ''undirected, nonlinear, unsigned, bivariate, contemporaneous''. GitBook information-theory.md:46-64 same text.'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.EntropyCalculatorMultiVariateGaussian (joint entropy of (x_i,x_j) and univariate entropy of x_i)
  implemented_as: A[i,j] = H(x_i, x_j) - H(x_i) = H(x_j | x_i), both from the JIDT Gaussian entropy calculator on z-scored (ddof=1) data, reusing the je cache and the univariate cache. With z-scoring H(x_i)
    = 1.4189385332 exactly, so A[i,j] = 1.4189385332 + 0.5*ln(1-r^2) = 1.4189385332 - mi_gaussian, which is symmetric in (i,j) despite the Directed class.
  implementation_trace:
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 fill_diagonal NaN; :336-339 any exception from any pair -> the whole SPI entry becomes NaN (:337) and the error is recorded, warning issued at :354-355
  - 'pyspi/data.py:184-195 preprocessing in Data.set_data: optional scipy.signal.detrend(axis=1), then (default normalise=True) scipy.stats.zscore(axis=1, ddof=1)'
  - 'pyspi/base.py:84-94 Directed.multivariate: for every ordered pair i != j, A[i,j] = self.bivariate(data, i=i, j=j)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: _entropy_calc = _getcalc(''entropy'') (:36); identifier += ''_gaussian'' (:38); estimator ''gaussian'' -> labels += [''linear''], _dyn_corr_excl
    = None (:53-55)'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: every calculator gets setProperty(''BIAS_CORRECTION'',''false'') and setProperty(''NOISE_SEED'',''42''); no NORMALISE property is set'
  - 'pyspi/statistics/infotheory.py:103-134 _getcalc: ''gaussian'' (and any unrecognised estimator) falls to the else branches -> gaussian.EntropyCalculatorMultiVariateGaussian (:111-112), gaussian.MutualInfoCalculatorMultiVariateGaussian
    (:120-123), gaussian.TransferEntropyCalculatorGaussian (:129-130)'
  - pyspi/statistics/infotheory.py:237-250 ConditionalEntropy(JIDTBase, Directed); bivariate returns _compute_joint_entropy(i,j) - _compute_entropy(i) (conditioning variable = i)
  - pyspi/statistics/infotheory.py:137-156 _compute_entropy (univariate, cached); :159-177 _compute_joint_entropy (cached, shared with je)
  - 'pyspi/config.yaml:411-423 ConditionalEntropy configs: estimator gaussian'
  - 'https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/gaussian/EntropyCalculatorMultiVariateGaussian.java EntropyCalculatorMultiVariateGaussian
    (extends EntropyCalculatorMultiVariateCommon, :53-54): finaliseAddObservations :87-96 computes means and MatrixUtils.covarianceMatrix(observations, means); setCovariance :110-123 takes MatrixUtils.CholeskyDecomposition
    (throws on non-PD); computeAverageLocalOfObservations :162-175 returns 0.5*(d*(1+ln 2pi) + ln det(Sigma)) in nats'
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java :66 normalise = true by default, but
    finaliseAddObservations :178-212 only stacks observations and adds noise if addNoise (default false, :70); no normalisation is applied for the Gaussian estimator; NOISE_SEED handled :133-139 (no effect
    without addNoise)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] covarianceMatrix(double[][], double[]) :3426-3439 -> covarianceTwoColumns :3370-3377 divides by (n-1) (ddof=1);
    CholeskyDecomposition :4496-4498 (tol 10e-10 = 1e-9) / :4528-4560 throws NonPositiveDefiniteMatrixException when a pivot <= tol; determinantViaCholeskyResult :4673-4680
  deviation_from_documented: Quantity matches 'uncertainty in y given x' with x = process i, y = process j. Keywords say 'undirected' while the class is Directed (REVIEW M8 already notes the conditioning
    order). Under the default pipeline the output is exactly symmetric, so 'directed' has no effect on values (candidate below).
  deviation_from_canonical: none for H(x_j|x_i) under the Gaussian model; plug-in estimator, ddof=1. Under z-scoring the marginal-scale term vanishes and the value is 1.4189385 - mi_gaussian.
  units_and_range: nats; real, <= 1.4189385332 under z-scoring, -> -inf as |r| -> 1, raises on exact collinearity; with normalise=False shifts by ln(sample SD of x_j) and is asymmetric (A[i,j]-A[j,i] =
    ln(sd_j/sd_i))
  direction_convention: 'A[i,j] = H(x_j | x_i): row i is the conditioning (observed) process, column j the process whose uncertainty is measured (infotheory.py:248-250). Probe scaled_offset_T1024 with normalise=False:
    A[0,1]=2.0787 vs A[1,0]=-0.2373 (x1 has scale 2, x0 scale 0.2). symmetry_expected is sym because the check stage and Calculator use the default pipeline (normalise=True), where H(x_i) is the same constant
    for every channel and A = A.T exactly (probe scaled_offset_T1024 z-scored max |A - A.T| = 2.2e-16; var2_bivariate_T1024 A[0,1] = A[1,0] = 1.400065239580088); under Data(normalise=False) the matrix is
    asym, with A[i,j]-A[j,i] = ln(sd_j/sd_i)'
  symmetry_expected: sym
  already_documented: REVIEW M8 (Gaussian conditional entropy can be negative; ce is H(i,j)-H(i), conditioning order)
  new_finding_candidates:
  - 'CANDIDATE (degenerate direction): under default normalise=True ce_gaussian is exactly symmetric, A[i,j] = A[j,i] = 1.4189385332 - mi_gaussian. Probe var2_bivariate_T1024: A[0,1] = A[1,0] = 1.40006524
    and 1.41893853 - 0.01887329 = 1.40006524; scaled_offset_T1024 z-scored matrix symmetric to max |A - A.T| = 2.2e-16, while normalise=False gives an asymmetric matrix (A[0,1]=2.0787, A[1,0]=-0.2373).
    The ''directed'' label therefore carries no information in the default pipeline.'
  - 'CANDIDATE (redundancy): ce_gaussian = 1.4189385332 - mi_gaussian exactly under z-scoring (same probe), so ce, je and mi Gaussian are mutually affine.'
