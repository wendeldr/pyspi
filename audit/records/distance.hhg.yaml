  what_changed: 'The computation is the canonical Heller, Heller & Gorfine (2013) sum of Pearson chi-square statistics, reproduced bit for bit on continuous
    data by an independent from-scratch reference (14 def runs, max_abs 0.0; refs/hhg_mgc.py imports neither hyppo nor sklearn). Score mapping: on continuous
    data the numeric half of anchor 10 is met and its supplement half fails, because the supplement/GitBook text misdescribes the statistic (''RKHS-based
    statistic that uses the ranks of random variables to obtain sample kernel matrices'') and labels it undirected while the class is Directed. That is not
    one of anchor 9''s trivial value conventions; 9 is the score for ''canonical computation reproduced, supplement wrong'' (README "Score columns: original, rubric reading, adjusted"; for hhg the rubric reading is anchor 9 through the estimator-variance clause, see score_rubric_note), applied the same way
    to misc.gpfit.DotProduct and misc.coint.johansen_order-0_*. The one value deviation, on tied or grid-valued data, is placed under the anchor-9 clause
    ''within statistical tolerance consistent with estimator variance'', by analogy: ranks are taken over sklearn dot-product distances, so exact ties and
    near-ties are resolved by floating-point rounding of the dot-product distance formula (a numerical artefact, root cause REVIEW M2, not a convention).
    Against exact distances this moves the value by 2.6e-4 (shared_envelope T64 kernel, abs 62) to 4.9e-2 relative (raw logistic_maps T256), while the null
    sampling SD at n=256 is 14225 on a mean of 64514, about 22% (distance.hhg|iid_gaussian|256|pipeline|null); the sampling SD on dependent data was not measured,
    so the comparison is by analogy only. In absolute terms the analogy fits only part of the runs: the largest deviation (logistic_maps|256|kernel|exact, max_abs 39926 on the raw logistic maps) is 2.8 times the only SD measured (14225, the iid null at n=256), while shared_envelope T256 (max_abs 8128 kernel, 9188 pipeline, about 0.6 SD), logistic_maps T256 pipeline (11420, 0.8 SD) and the EEG T256 gaps (about 1.1e3 to 4.2e3, at most 0.3 SD) lie within it; the relative comparison above sets a deviation against a relative SD and overstates the fit for the raw logistic maps. Scope: the deviation is not confined to niche data. On a real EEG window (001_Baseline.EDF, channels EEG G1-G3,
    mid-recording; scratch probe wf4b2_high-optimiser-other/p_hhg.py, own numpy HHG) the samples are grid-valued (ADC step 2.66e-7, |x/step - round| <= 5e-11;
    341 to 446 distinct values per 1024 samples across the window''s six EEG channels): pyspi differs from the canonical statistic computed with exact ties
    on the integer codes by 2.24e-3 / 1.53e-3 / 3.69e-3 relative at T=256 (pairs 01/02/12) and 1.62e-3 / 1.18e-3 / 1.53e-3 at T=512, so it is not bit-exact
    on digitised recordings. The audit''s exact-distance reference (np.abs on pyspi''s z-scored floats) does not recover the canonical ties either: it differs
    from pyspi by 4.0e-6 to 4.8e-4 and from the integer-code value by about the same 1e-3 as pyspi does, because z-scoring breaks some exact ties by rounding.
    The check design therefore cannot separate canonical from rounded ties on grid-valued data; that needs a run on integer codes (not in the manifest). Separately,
    pyspi returns the raw T, whose null mean n(n-2)(n-3)/(n-1) grows like T^2, so values are not comparable across window lengths (an output scaling choice,
    not a value defect). distance.hhg is not in the retained 185-metric EEG set.'
