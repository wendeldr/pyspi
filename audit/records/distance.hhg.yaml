unit_id: distance.hhg
status: profiled
correctness:
  metric_name_standard: 'Heller-Heller-Gorfine (HHG) test statistic: sum over all ordered sample pairs of Pearson chi-square statistics of rank-of-distance 2x2 tables (sum.chisq variant, no p-value)'
  canonical_ref: Heller R, Heller Y, Gorfine M (2013) A consistent multivariate test of association based on ranks of distances. Biometrika 100(2):503-510, Section 2 (Table 2, definition of S(i,j) and T);
    arXiv:1201.3522v3 p.3
  canonical_definition: 'T = sum_{i=1}^N sum_{j!=i} S(i,j), S(i,j) = (N-2){A12(i,j)A21(i,j) - A11(i,j)A22(i,j)}^2 / {A1.(i,j)A2.(i,j)A.1(i,j)A.2(i,j)}, with A11(i,j) = sum_{k!=i,j} I{d(x_i,x_k) <= d(x_i,x_j)}
    I{d(y_i,y_k) <= d(y_i,y_j)} (A12, A21, A22 analogously, N-2 points per table); S(i,j) = 0 when a margin is 0. d is a norm-induced distance (here Euclidean, 1-D: |x_i - x_k|).'
  documented_definition: 'supplement §1.2.6, p.6 (supplement.txt:272-278; the pack listed 278-285): keywords ''undirected, nonlinear, unsigned, bivariate, contemporaneous''; ''The Heller-Heller-Gorfine
    (HHG) method [16] yields an RKHS-based statistic that uses the ranks of random variables to obtain sample kernel matrices, rather than their distances (cf. HSIC in Sec. 1.2.5). This SPI is computed
    via the hyppo package''. GitBook spi-descriptions/distance-similarity.md:184-199 repeats the text; base identifier hhg.'
  delegate_lib: hyppo==0.5.2 hyppo.independence.HHG().statistic (numba==0.68.0 jit kernel hyppo.independence.hhg._pearson_stat); distance matrices from scikit-learn==1.9.1 sklearn.metrics.pairwise_distances(metric='euclidean')
    via hyppo.tools.compute_dist
  implemented_as: 'Calculator default preprocessing: per-process z-score along time (scipy.stats.zscore ddof=1), no detrend. For each ordered pair (i,j), i!=j: x = process i, y = process j as (T,1) arrays
    (single realisation). Distances: sklearn euclidean_distances dot-product formula sqrt(max(x_a^2 + x_b^2 - 2 x_a x_b, 0)) with diagonal forced to 0 (not exactly |x_a - x_b| and not bit-symmetric; probe
    max |D - |x_a - x_b|| = 3.5e-14 at T=64). Kernel: for every ordered sample pair (a,b), a!=b: mask_x = D^x[a,:] <= D^x[a,b], mask_y likewise; t11 = sum(mask_x & mask_y) - 2 (removes k=a and k=b, which
    always satisfy both <=), t12, t21, t22 the other cells; S = (n-2)(t12 t21 - t11 t22)^2/denom if denom > 0 else 0; statistic = sum of off-diagonal S. Raw T is returned (no normalisation, no permutation
    p-value; auto/fast Hoeffding variant not used because auto=False). Directed base class: both orders (i,j) and (j,i) are computed; A has NaN diagonal.'
  implementation_trace:
  - pyspi/calculator.py:46-53 Calculator(detrend=False, normalise=True) defaults; :277 Data(..., normalise=self._normalise, detrend=self._detrend)
  - pyspi/data.py:184-197 optional detrend then zscore(data, axis=1, nan_policy='omit', ddof=1); :257-260 adds realisation axis (P,T,1); :108-118 to_numpy
  - pyspi/base.py:84-94 Directed.multivariate loops all ordered pairs, A[i,j] = self.bivariate(data, i=i, j=j), diagonal NaN; :27-49 parse_bivariate
  - pyspi/statistics/distance.py:10-15 imports hyppo.independence.HHG; :66-71 class HellerHellerGorfine(Directed, Unsigned), labels include 'directed'; :73-77 x, y = data.to_numpy()[[i, j]] (each (T,1));
    stat = HHG().statistic(x, y)
  - pyspi/config.yaml:179-188 HellerHellerGorfine listed with label 'undirected' (contradicts class label 'directed')
  - .venv/lib/python3.12/site-packages/hyppo/independence/hhg.py:144-149 HHG.__init__(compute_distance='euclidean'), is_distance False, auto False
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hhg.py:151-194 statistic: compute_dist (176-179), auto False branch -> _pearson_stat, mask diagonal, np.sum(S[mask]) (188-191)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hhg.py:274-297 _pearson_stat numba kernel: a = distx[i,:] <= distx[i,j]; t11 = np.sum(a*b) - 2; S[i,j] = ((n-2)*(t12*t21 - t11*t22)**2)/denom if
    denom > 0'
  - .venv/lib/python3.12/site-packages/hyppo/tools/common.py:436-503 compute_dist -> pairwise_distances(mat, metric=metric, n_jobs=workers) at :499
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/pairwise.py:2309 pairwise_distances; :1924 ''euclidean'' -> euclidean_distances; :268 euclidean_distances; :403-421 _euclidean_distances float64 path:
    distances = -2 X Y^T + XX + YY, clip at 0, fill diagonal 0 when X is Y'
  deviation_from_documented: (1) The supplement and GitBook describe HHG as 'an RKHS-based statistic that uses the ranks of random variables to obtain sample kernel matrices'. The code computes Heller et
    al.'s sum of Pearson chi-square statistics over 2x2 tables built from ranks of distances (hhg.py:282-295). No kernel or RKHS is involved and the ranks are ranks of distances, not of the variables. (2)
    The supplement keywords and config.yaml:180-186 say 'undirected', but the class is Directed with the label 'directed' (distance.py:66, 71). The statistic is exactly symmetric anyway. (3) 'unsigned'
    is consistent with the output (T >= 0).
  deviation_from_canonical: 'The kernel matches Heller et al. 2013 §2: ''<='' indicators, k = i and k = j excluded via the -2 on t11, S = 0 when a margin is 0 (denom > 0 test), and T sums over all ordered
    pairs. One input deviates: the distances are sklearn dot-product Euclidean distances, not the exact |x_a - x_b|. Near-equal and exactly tied distances can therefore be ordered differently from the exact
    metric, which changes the counts. In probes, exact and sklearn distances gave identical T on 17 of 19 datasets at T=256. The relative difference was 1.4% on logistic_maps (process 1 has 8 distinct values)
    and 0.43% on shared_envelope, and shared_envelope T=64 pair (0,1) differed by exactly 62 = n-2. Scope: pyspi returns the raw T, which grows like N^2 under independence and N^3 under dependence. It is
    not a normalised effect size, so values are not comparable across series lengths. Check-stage addition: on the raw (kernel-path) logistic_maps rows the rounding effect is larger, 4.9% relative at T=256
    (distance.hhg|logistic_maps|256|kernel|exact: pyspi 858472.24 vs exact-distance 818546.71), against 1.4% after z-scoring (|pipeline|exact: 825361.34 vs 813945.24). For the bit-identical copy shared_envelope
    (0,2) on raw rows at T=64, pyspi gives 242110 = N(N-2)(N-3) + (N-2), one more non-zero-margin table than the analytic maximum 242048 that exact distances reproduce.'
  units_and_range: 'Dimensionless, >= 0, unbounded, and dependent on T. Under independence each S ~ chi2_1 approximately, so T is near the number of non-zero-margin pairs, which is about N(N-1); iid T=64
    probe gave 2714-4212 against N(N-1)=4032. For identical 1-D series with no tied distances, every pair except each point''s nearest and farthest neighbour (zero margin) contributes N-2, giving T = N(N-2)(N-3).
    The probe on shared_envelope (0,2) at T=64 gave 242048 = 64*62*61. T is exactly symmetric in (x,y). The diagonal is NaN. Check-stage addition: under independence (continuous data) the exact null mean
    is E[T] = n(n-2)(n-3)/(n-1), derived from the hypergeometric table (E[S | margins > 0] = N/(N-1), N = n-2) and P(no zero margin) = ((n-3)/(n-1))^2: 3842.0 at n=64 and 64514.0 at n=256 (Monte Carlo of
    2000 iid pairs at n=256: 64814 +- 328 SE, skewness 0.98).'
  direction_convention: A[i,j] = HHG(x = process i, y = process j). Directed.multivariate at base.py:91-93 calls bivariate(data, i, j), which unpacks x, y = data[[i, j]] at distance.py:75-76. Swapping x
    and y swaps A12 with A21 and A1. with A.1, leaving S unchanged, and all counts are integer. The matrix is therefore exactly symmetric (probe max |A - A.T| = 0.0 on iid_gaussian, bivariate_gaussian,
    nonlinear_dependence, delayed_noise and shared_envelope at T=64) and carries no direction information.
  symmetry_expected: sym
  already_documented: REVIEW M2 (root cause only; consequence new)
  new_finding_candidates:
  - 'CANDIDATE: HHG is exactly symmetric but implemented as Directed (distance.py:66 ''class HellerHellerGorfine(Directed, Unsigned)'', labels at :71 include ''directed''), so pyspi computes both orders
    and reports a ''directed'' label for an undirected quantity. Evidence: algebraic symmetry of S(i,j) under swapping x and y, and the probe p1_hhg.py printed ''max|A-A.T|= 0.0'' on 5 datasets. config.yaml:180-186
    and supplement §1.2.6 both say ''undirected'', so the class label contradicts pyspi''s own documentation.'
  - 'CANDIDATE: the documentation misdescribes the method. Supplement §1.2.6 and GitBook distance-similarity.md:192 say ''RKHS-based statistic that uses the ranks of random variables to obtain sample kernel
    matrices'', but hhg.py:282-295 computes Pearson chi-square statistics of 2x2 tables built from ranks of distances, with no kernel.'
  - 'CANDIDATE: rank comparisons run on sklearn dot-product Euclidean distances (pairwise.py:409-411) instead of exact |x_a - x_b|, so ties and near-ties are resolved by rounding error. Probe p7_rounding_scope.py
    at T=256 reported ''logistic_maps HHG max rel diff 1.40e-02'' and ''shared_envelope HHG max rel diff 4.32e-03'', and 0 on the other 17 datasets. Probe p5_logistic.py reported ''HHG sklearn 825361.34
    exact 813945.24'' (logistic_maps T=256). Probe p2_ties.py found that sklearn distances create extra exact ties (shared_envelope T=256 row ties 180/240 vs 7/135 exact). This has the same root cause as
    docs/storage_comparison/REVIEW.md M2 (dot-product Euclidean distances), which was reported there only as last-bit asymmetry of pdist_euclidean. Here the consequence is a percent-level change in a rank
    statistic.'
  - 'HYPOTHESIS (kernel arithmetic probed; end-to-end HHG at this length not run): _pearson_stat (hhg.py:288-295) evaluates (n-2)*(t12*t21 - t11*t22)**2 in int64. numba inspect_types on the float64,float64
    signature (probe p_hhg_int3.py) types t11, t12, t21, t22, denom and n as int64 (a, b are bool arrays; np.sum of their products is int64). With N = n-2 points per table, |t12*t21 - t11*t22| <= floor(N/2)*ceil(N/2),
    so the numerator is bounded by (n-2)(floor(N/2)ceil(N/2))^2, which first exceeds 2^63-1 at n = 10812 (about 1.08e4); at n = 10502 the bound is 7.98e18 < 9.22e18 (probe p_hhg_int.py/p_hhg_int2.py). A
    numba njit replica of the hhg.py:295 numerator at n = 10812 with t11 = t22 = 5405, t12 = t21 = 0 returned -9220849508775795366 against the exact 9225894564933756250 (silent wrap). Such tables occur
    for identical or near-identical series (t12 = t21 = 0) at pairs whose distance rank is near N/2, so T >= 10812 on strongly dependent pairs may give wrapped, negative S(i,j). Not reachable at the audit''s
    T <= 4096; the full O(n^3) HHG at n >= 10812 was not run.'
  - 'CANDIDATE (interpretation): pyspi returns the raw permutation-test statistic T, whose null level grows like N(N-1). Values are therefore not comparable across series lengths or windows of different
    length, unlike the [−1,1]-normalised dcorr and mgc in the same family.'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - nonlinear_dependence
    - anm
    - contaminated
    - var2_bivariate
    path: kernel
    reference: From-scratch numpy implementation of Heller et al. 2013 §2. It uses exact distances |x_a - x_b| from np.abs of an outer difference, '<=' indicators excluding k = a, b, S = 0 when any margin
      is 0, and T = sum over ordered pairs. It is vectorised per a as an (n x n) boolean outer product and does not import hyppo or sklearn. Input is the z-scored process pair taken from pyspi's Data, so
      only the kernel is compared. Run at T in {64, 256, 1024} (T=4096 costs about 6 min per pyspi call).
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: Relative difference <= 1e-12 on these continuous datasets. Probes at T=64 and T=256 agreed to about 1e-15 relative, for example 2928.4725589238396 vs 2928.4725589238515.
  - datasets:
    - logistic_maps
    - shared_envelope
    path: kernel
    reference: The same from-scratch exact-distance HHG reference, compared with pyspi. As an attribution aid only, also run hyppo HHG(compute_distance=None) on the exact distance matrices. That comparison
      is labelled same-lineage and isolates the effect of the distance inputs.
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: pyspi is expected to DISAGREE with the exact-distance reference by up to about 1.4% relative (logistic_maps T=256) and about 0.4% (shared_envelope T=256), with the disagreement shrinking
      to 0 when hyppo is given exact distances. That would confirm sklearn rounding as the cause. If agreement is <= 1e-12, refute the rounding candidate.
  - datasets:
    - iid_gaussian
    - shared_envelope
    path: kernel
    reference: 'Analytic value for identical 1-D series with no tied distances: T = N(N-2)(N-3). Pairs: iid_gaussian process 0 with itself and with 2*x0 + 1 (constructed in the check), and shared_envelope
      (0,2), which is a bit-identical copy, at T=64 only, because exact distance ties appear at larger T.'
    reference_kind: analytic
    criterion: exact
    expected_outcome: pyspi HHG = N(N-2)(N-3) exactly, for example 242048 at T=64. The affine copy may deviate only if rounding flips a near-tie; report it if it does.
  - datasets:
    - var2_bivariate
    - logistic_maps
    - delayed_noise
    - gauss_ar1_pair
    path: pipeline
    reference: 'Direction convention: compute the full pyspi matrix A and compare A[i,j] with the from-scratch HHG(x_i, x_j) and HHG(x_j, x_i). These datasets have known source->target structure (var2_bivariate
      X->Y, logistic_maps y->x, delayed_noise x0 leads).'
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: A[i,j] == A[j,i] bit-for-bit. A[i,j] equals the reference for (x_i, x_j) within 1e-12 relative. HHG therefore carries no direction information despite the 'directed' label.
  - datasets:
    - iid_gaussian
    - gauss_ar1_pair
    path: kernel
    reference: 'Permutation null from the from-scratch reference: 200 random permutations of y per pair. Compute the percentile of the pyspi value within that null, and compare the null mean with N(N-1)
      minus the zero-margin pair count.'
    reference_kind: independent-impl
    criterion: statistical
    expected_outcome: For iid_gaussian, pyspi percentiles are consistent with Uniform(0,1) across pairs and T, and the null mean is within a few percent of the non-zero-margin pair count. gauss_ar1_pair
      may show dependence from contemporaneous coupling; record it.
  - datasets:
    - scaled_offset
    - bivariate_gaussian
    path: pipeline
    reference: 'Invariance: scaled_offset is the same draw as bivariate_gaussian, times a scale plus an offset. After pyspi''s z-scoring and with HHG''s rank invariance, the two matrices should coincide.'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: Matrices equal to within 1e-12 relative. A larger difference would indicate z-score rounding feeding the distance-rank comparisons.
  - datasets:
    - trending
    - bivariate_gaussian
    path: pipeline-detrend
    reference: 'Qualitative: linear trends induce spurious distance dependence. Compare trending with and without detrend against bivariate_gaussian (the same draw without trends).'
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: Without detrend, pairs in trending show very large T, of order N^3, including the pairs that are independent in bivariate_gaussian. With detrend=True, values fall back near the bivariate_gaussian
      levels. They are not expected to be identical, because scipy detrend removes the least-squares line of each realised series, not the true slope*t.
  check_method: independent-impl
  check_reference: 'audit/checks/refs/hhg_mgc.py:hhg_from_dist (Heller, Heller & Gorfine 2013 Sec. 2 from scratch: exact |x_a - x_b|, ''<='' indicators over k not in {i,j}, zero-margin rule, cumulative-histogram
    counts; cross-validated in --selftest against audit/checks/refs/_kernels_distance.py:hhg, including tied data); audit/checks/refs/hhg_mgc.py:ref_copies and ref_dup (analytic N(N-2)(N-3) for identical
    rankings); audit/checks/refs/hhg_mgc.py:ref_null (analytic E[T] = n(n-2)(n-3)/(n-1) with Monte Carlo SD); audit/checks/refs/hhg_mgc.py:mc_quantile_band (Monte Carlo null for Gaussian marginals, 2000
    draws; approximate for non-Gaussian marginals, see scratchpad hhg_mgc_check/p_null_marginals.py); audit/checks/refs/hhg_mgc.py:ref_hyppo_exact with probe audit/checks/probes/hhg_mgc_probes.py:hyppo_exact
    (same-lineage attribution aid: hyppo HHG fed exact distances); audit/checks/probes/hhg_mgc_probes.py:copies; audit/checks/refs/hhg_mgc.py:ref_perm (per-pair conditional permutation null, 200 permutations
    of y on exact distances; trace proposed check [4]); calibration probes scratchpad hhg_mgc_check/p_perm_ks_calibration.py, p_perm_other_draws.py, p_null_marginals.py'
  check_data: iid_gaussian, bivariate_gaussian, nonlinear_dependence, anm, contaminated, var2_bivariate T64/T256 kernel; bivariate_gaussian processes (2,3) T1024 kernel; bivariate_gaussian T256 pipeline;
    logistic_maps and shared_envelope T64/T256 kernel and T256 pipeline (tied-data attribution); iid_gaussian copies T64/T256; shared_envelope (0,2) T64; var2_bivariate, logistic_maps_chaotic, delayed_noise,
    gauss_ar1_pair T256 pipeline (direction); iid_gaussian T64/T256 pipeline (null); nonlinear_dependence, bivariate_gaussian, anm T256 (ordering); scaled_offset T256; trending T256 pipeline and pipeline-detrend;
    iid_gaussian and gauss_ar1_pair T64/T256 kernel (per-pair permutation null)
  agreement_criterion: 'tolerance rtol 1e-12 against the from-scratch statistic on exact distances (continuous data) or on sklearn-mirrored distances (tied data); exact rtol/atol 1e-12 against the analytic
    identical-ranking value; statistical |pyspi - E[T]| <= z_(1-0.025/m) Monte Carlo SD; qualitative: dependent pairs above and independent pairs inside the empirical family-wise null band [q(0.025/6),
    q(1-0.025/6)] of 2000 Monte Carlo draws; qualitative per-pair permutation null (200 permutations of y): iid_gaussian pass = KS of the 10 pair percentiles vs U(0,1) p >= 0.05 and no upper-tail permutation
    p < 0.05/10; gauss_ar1_pair pass = upper-tail p < 0.025 (detection only, permutation ignores autocorrelation)'
  closeness: 'Continuous data: all 14 def runs (6 datasets x T64/T256 kernel, bivariate_gaussian T256 pipeline, bivariate_gaussian (2,3) T1024) max_abs 0.0, i.e. pyspi equals the from-scratch Heller et
    al. statistic bit for bit; dir runs (var2_bivariate, logistic_maps_chaotic, delayed_noise, gauss_ar1_pair T256 pipeline) max_abs 0.0; scaled_offset|256|pipeline|scaleinv 0.0; trending trend/detrend
    0.0. Analytic: iid_gaussian|64|kernel|copies and |256|kernel|copies give exactly N(N-2)(N-3) = 242048 and 16451072 on the copy and affine-copy pairs (max_abs 0.0); shared_envelope|64|pipeline|dup 242048
    exactly. Tied data against EXACT distances (expected fails, rounding candidate): logistic_maps|256|kernel|exact max_rel 4.88e-2 (858472.24 vs 818546.71), |256|pipeline|exact 1.40e-2, |64|kernel|exact
    9.9e-3; shared_envelope|256|kernel|exact 3.73e-3 (abs 8128 = 32 x 254), |256|pipeline|exact 4.32e-3, |64|kernel|exact abs 62 = n-2; the same pairs match the reference on sklearn-mirrored distances (4
    skdist runs, max_abs 0.0) and hyppo fed exact distances matches the exact-distance reference (4 hyppo-exact runs, max_abs 0.0). Null: iid_gaussian|64|pipeline|null mean over pairs 3290.4 vs E[T] 3842.0
    (max_z 0.96), |256|pipeline|null 53204.2 vs 64514.0 (max_z 1.44). Ordering (T256): band [38512, 118786]; nonlinear_dependence (0,1) 3286900.5 and (2,3) 1620054.8, anm 2510927.2 / 5409301.4, bivariate_gaussian
    rho=0.8 1940899.5 > rho=0.3 150648.4, all independent pairs inside the band (largest anm (0,3) 103653.7, null upper tail 0.0165). Trend: (1,2) 2086441.8 and (1,3) 5532123.2 without detrend, 61082.4
    and 49758.8 after detrend. Permutation null (|perm, 200 permutations per pair): iid_gaussian|64|kernel|perm FAILS the uniformity criterion (KS p 0.0109, percentiles 0.085 to 0.695, mean 0.309; smallest
    upper-tail p 0.308, so no pair is flagged as dependent); |256|kernel|perm passes (KS p 0.124, percentiles 0.0 to 0.74, mean 0.2805, smallest upper-tail p 0.264). Both failures and near-failures are
    in the LOWER tail (pyspi below its own permutation null). The pooled permutation-null mean equals the analytic E[T] within MC error: z = -0.60 (iid T64), 1.08 (iid T256), -1.12 and 1.21 (gauss_ar1_pair
    T64, T256). gauss_ar1_pair|64|kernel|perm and |256|kernel|perm pass: pyspi 7945.2 and 315100.7 above all 200 permutations (percentile 1.0, p_upper 0.005; permutation means 3768.3 and 65778.0). Calibration
    probe (scratchpad hhg_mgc_check/p_perm_ks_calibration.py, 400 fresh 5 x 64 iid draws): the KS criterion fails on 5.75% of null draws and reaches KS p <= 0.012 on 0.75%; the mean pair percentile is 0.4955
    (SD 0.093) and is <= 0.31 on 2.0% of draws. The T256 draw (iid_gaussian_T256.npz, dataset seed 1000256, audit/checks/data/MANIFEST.json), on which the
    HHG percentiles are low but pass (mean 0.2805), is the same draw on which dcorr_hsic''s four distance.*|iid_gaussian|256|pipeline|null runs fail (mean dCor^2 at the
