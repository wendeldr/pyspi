optimisation:
  complexity_P_T: 'O(P^2 T^3): hyppo/independence/hhg.py:_pearson_stat loops over all T(T-1) sample pairs (i, j) and for each counts over T samples
    with four boolean temporaries; pyspi runs it for every ORDERED pair (HellerHellerGorfine is Directed, pyspi/base.py:Directed.multivariate).
    Measured T_exponent 2.93 (8x256 5.5 s -> 8x1024 321.6 s); never run above 8x1024, so the 118x1024 projection (79285 s) is pair-count scaling
    only. The P^2 T^3 term dominates at every shape.'
  hotspot_1: 'hyppo/independence/hhg.py:HHG.statistic (third-party:hyppo) 98.8% self time of the profiled SPI call at 8x256 (profiled in this
    stage, the 8x1024 and 8x256 profiler runs timed out): the numba _pearson_stat O(T^3) kernel is hidden in it'
  hotspot_2: hyppo/tools/common.py:compute_dist -> sklearn euclidean_distances (third-party:sklearn) 1.2% at 8x256
  hotspot_owner: third-party:hyppo
  opaque_share: 0.0016
  profile_file: audit/profiles/micro/distance.hhg__8x256.pstats
  opportunities:
  - opportunity_id: hhg_mgc-1
    opportunity: 'Compute one direction only: HHG is run as Directed (both ordered pairs) but _pearson_stat is symmetric in (x, y) by construction
      (swapping the arguments swaps t12 and t21, leaves t11, t22 and the integer denominator unchanged), so compute i < j and mirror.'
    opp_type: algorithmic
    expected_speedup: ~2x
    speedup_basis: 'complexity: halves the P(P-1) ordered-pair loop; profile:audit/profiles/micro/distance.hhg__8x256.pstats hhg.py:statistic
      98.8% is all per-pair work'
    output_risk: unverified-bit-identical
    risk_evidence: 'symmetry_observed: max|A - A.T| = 0.0 on every HHG check run although both orders are computed; integer contingency counts
      and the same float formula in both orders'
    effort: S
    depends_on: []
  - opportunity_id: hhg_mgc-2
    opportunity: 'Replace the O(T^3) _pearson_stat double loop with a per-row rank / 2-D dominance count: for each sample i, rank row i of both
      distance matrices once and get t11 for every j with a sort plus a Fenwick tree (O(T log T) per row, O(T^2 log T) per pair); t12, t21, t22
      follow from the row ranks. Counts stay integers, so S and the final sum are unchanged provided ties keep the ''<='' rule.'
    opp_type: algorithmic
    expected_speedup: 20-80x
    speedup_basis: 'profile:audit/profiles/micro/distance.hhg__8x256.pstats hhg.py:statistic 98.8% (Amdahl bound 83x) + complexity: T^3 -> T^2
      log2 T is ~100x at T=1024 (~30x at T=256) before constants; the gain grows about as T / log T'
