unit_id: spectral.dswpli
status: profiled
correctness:
  metric_name_standard: debiased estimator of the squared weighted phase lag index, with tapers as observations, band mean / band max
  canonical_ref: Vinck, Oostenveld, van Wingerden, Battaglia & Pennartz 2011, NeuroImage 55:1548-1565, debiased estimator of the squared wPLI (equation number not re-checked)
  canonical_definition: Omega_hat = sum_{j != k} Im X_j Im X_k / sum_{j != k} |Im X_j| |Im X_k| = ((sum Im X)^2 - sum (Im X)^2) / ((sum |Im X|)^2 - sum (Im X)^2) over N observations; targets wPLI^2, symmetric, can be negative.
  documented_definition: 'supplement §1.5.8, p.15 (supplement.txt:715-750): "... weighting components based on the imaginary coherence [68]: ... and the debiased squared weighted phase lag index (dswpli)." Labels undirected, unsigned (config.yaml:852-858). GitBook spectral.md:241, 282-293. Grid/band text: supplement §1.5, pp.12-13 (heading supplement.txt:570; grid text :582-599; the pack line ranges for §1.5.6-1.5.8 are offset, actual headings at :686, :701, :715): "Each measure is based on the cross- and power-spectral densities at a given frequency and sampling rate, which is estimated via the multitaper technique ... We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2], where fs/2 is the Nyquist frequency and f0 = 4/T ... we take the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5: f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]." Same text on GitBook spectral.md:16-20.'
  delegate_lib: spectral_connectivity==1.1.2 Multitaper.fft + Connectivity.debiased_squared_weighted_phase_lag_index (numpy 2.5.4); band mean/max native pyspi
  implemented_as: 'Per bin with sums over the K = 5 tapers (mean x n_observations): num = (sum Im S)^2 - sum (Im S)^2, den = (sum |Im S|)^2 - sum (Im S)^2, den == 0 -> NaN, value = num/den. DC bin: Im S = 0 so den = 0 -> NaN (dropped by nanmean/nanmax). Identical channels: NaN at every bin -> band value NaN. pyspi: np.nanmean / np.nanmax over bins with fmin <= f <= fmax.'
  implementation_trace:
  - 'pyspi/config.yaml:852-879 DebiasedSquaredWeightedPhaseLagIndex configs: (fs=1), (fmin=0, fmax=0.25), (fmin=0.25, fmax=0.5), and the same three with statistic=max; labels undirected, linear, unsigned, bivariate, frequency-dependent'
  - 'pyspi/statistics/spectral.py:210-219 DebiasedSquaredWeightedPhaseLagIndex(NonparametricSpectralMultivariate, Undirected): identifier "dswpli", _measure "debiased_squared_weighted_phase_lag_index", labels ["unsigned", "spectral", "undirected"]'
  - 'pyspi/data.py:184-195 Data preprocessing: optional scipy.signal.detrend(axis=1), then zscore(axis=1, nan_policy="omit", ddof=1) (default normalise=True, detrend=False)'
  - 'pyspi/calculator.py:295-355 Calculator.compute (cited at HEAD a1f20c7): :329 S = spi.multivariate(dataset); :332 np.fill_diagonal(S, nan); :336-337 any exception -> whole SPI table NaN (error recorded :338-339); :354-355 warning'
  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fmax None -> fs/2; statistic "mean" -> np.nanmean, "max" -> np.nanmax; identifier suffix f"_multitaper_{statistic}_fs-{fs}_fmin-{fmin:.3g}_fmax-{fmax:.3g}" with "." -> "-"'
  - 'pyspi/statistics/spectral.py:45-50 key = (self.measure,) for these classes: one cached spectrum per measure, shared by all band/statistic variants on a Data object'
  - 'pyspi/statistics/spectral.py:64-83 _get_cache: z = data.to_numpy(squeeze=True).T (T x P); m = sc.Multitaper(z, sampling_frequency=fs) (all other arguments default); conn = sc.Connectivity.from_multitaper(m); res = getattr(conn, measure)(); freq = conn.frequencies; first insert keyed by the bare string measure at :81 (one redundant recompute, tests/README.md worth knowing)'
  - 'pyspi/statistics/spectral.py:85-91 multivariate (parse_multivariate, pyspi/base.py:51-68): freq_id = np.where((freq >= fmin) * (freq <= fmax)); adj = statfn(res[0, freq_id, :, :], axis=0)'
  - 'pyspi/statistics/spectral.py:101-102 np.fill_diagonal(adj, nan); returned as is. MRO (probe): [cls, NonparametricSpectralMultivariate, NonparametricSpectral, Unsigned, Undirected, Directed, object], so Undirected.multivariate (pyspi/base.py:132-138) is never reached (REVIEW M1; tests/README.md bug 5 before b2f6d7e)'
  - pyspi/_spectral_compat.py:15-28 replaces spectral_connectivity.connectivity.np by a namespace whose in1d maps to np.isin; all other numpy calls unchanged (not on the path of these measures)
  - 'spectral_connectivity==1.1.2 .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-100 Multitaper.__init__ defaults: time_halfbandwidth_product=3, detrend_type="constant", n_tapers=None, n_fft_samples=None, time_window_duration=None (one window = the whole series), is_low_bias=True'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:155-164 n_tapers = floor(2*NW - 1) = 5; :469-543 dpss_windows, :668-673 _get_low_bias_tapers keeps eigenvalues > 0.9 (probe: 5 tapers kept at T = 64, 256, 1024, 4096)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:167-190 n_time_samples_per_window = T; n_fft_samples = scipy.fftpack.next_fast_len(T); frequencies = fftfreq(n_fft, 1/fs)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:238-260 fft(): _sliding_window (single window), detrend(type="constant") (:701-, subtracts each channel mean), _multitaper_fft (:335-354) fft(x * taper, n=n_fft)/fs -> fourier_coefficients (1 window, 1 trial, K=5 tapers, n_fft, P)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:156-172 from_multitaper(expectation_type="trials_tapers"); :45-53 EXPECTATION["trials_tapers"] = mean over axes (1, 2) = 1 trial x 5 tapers; :276-287 n_observations = 5
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:195-208 _cross_spectral_matrix = _complex_inner_product(X[..., None], X[..., None]) (:1187-1190 matmul(a, conj(b).T), :1485-1487) -> S_ij,k = X_i,k * conj(X_j,k)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:210-220 _expectation_cross_spectral_matrix(fcn): blocks None -> mean over tapers of fcn(S)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:73-89 _non_negative_frequencies keeps indices 0..(n_fft+1)//2 - 1 (DC kept, Nyquist dropped for even n_fft); :174-180 frequencies uses the same slice
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:626-670 debiased_squared_weighted_phase_lag_index: sums = mean x n_observations of Im S, (Im S)^2, |Im S| (:657-666); weights = (sum|Im|)^2 - sum Im^2, weights[weights == 0] = nan (:667-668); return ((sum Im)^2 - sum Im^2) / weights (:670); non-negative frequencies'
  deviation_from_documented: '(1) Labelled unsigned but takes negative values (M7). (2) Weighting is by |Im S| of the per-taper cross-spectrum, not by imaginary coherence (wording). (3) Frequency grid: documented 125 uniform bins on [f0 = 4/T, fs/2]; implemented n_fft/2 bins (n_fft = next_fast_len(T) = T for the probed powers of two) at f = m/n_fft, m = 0..n_fft/2-1, i.e. DC included, Nyquist excluded, f0 = 0 not 4/T (probe: 32/128/512/2048 bins at T = 64/256/1024/4096, first bin 0.0, last 0.484375 at T=64). Band rule freq >= fmin & freq <= fmax is inclusive at both ends, so the f = 0.25 bin is counted in both the low and the high band whenever 0.25 is a grid point, i.e. when n_fft = scipy.fftpack.next_fast_len(T) is a multiple of 4; this holds for every manifest size (T = 64/256/1024/4096) and for the 512- and 1024-sample EEG windows (probe: low band 17 bins 0..0.25, high band 16 bins 0.25..0.484 at T=64), but not in general (probe grid_tie.py: at T = 30 and 250, n_fft = 30 and 250 has no 0.25 bin and the inclusive low/high counts are 8/7 and 63/62). Taper count: K = 5 tapers pass the eigenvalue > 0.9 filter at every probed T >= 10 (10, 16, 30, 64, 100, 250, 256, 512, 1000, 1024, 4096); at T = 7 and 8 (n_fft = 8) only 4 tapers are kept and n_observations = 4, so every K = 5 statement in this record assumes T >= 10. The DC bin is NaN and therefore effectively excluded from band values.'
  deviation_from_canonical: 'Formula matches the canonical pairwise estimator exactly (algebraic identity; probe2 reproduction from the same coefficients max diff 2.2e-15). Deviations: observations are the 5 tapers of one window rather than trials (unbiasedness relies on taper independence; hypothesis); band max of a 5-observation estimate reaches 1 under independence for every pair of the audit iid_gaussian dataset at T >= 256, for 0.997 of off-diagonal entries at T = 256 over 30 fresh seeds and for every entry at T >= 1024 (probe sat.py); band aggregation is a pyspi construction.'
  units_and_range: 'dimensionless, symmetric (probe max |A - A^T| = 0.0), can be negative (M7; probe iid T=64 minimum band mean -0.18), <= 1; NaN at DC and for pairs with Im S identically 0 (shared_envelope x2==x0: A[0,2] = nan); null band mean ~0 (probe iid: 0.0139, -0.024, -0.0104, 0.0018 at T = 64..4096); dswpli_max = 1.0 for every pair of the audit iid_gaussian dataset at T >= 256 and every entry over 30 fresh seeds at T >= 1024, but for 0.997 of entries at T = 256 (probe sat.py).'
  direction_convention: 'Undirected: numerator and denominator are invariant to Im S -> -Im S, so A[i,j] = A[j,i] exactly (probe). No lead/lag information.'
  symmetry_expected: sym
  already_documented: REVIEW M7 and EEG_OPTIMIZATION_NOTES.md §review (legitimate negative estimators) (negative dswpli valid); REVIEW M1 (no symmetrisation; no effect, symmetric; tests/README.md bug 5 before b2f6d7e); REVIEW M4 and DEPENDENCY_COMPATIBILITY_REVIEW.md (DC included).
  new_finding_candidates:
  - 'CANDIDATE: a pair whose cross-spectrum is real at every bin (identical channels) yields NaN for every dswpli identifier (probe4 shared_envelope A[0,2] = nan at T = 256 and 1024; den == 0 -> NaN at spectral_connectivity/connectivity.py:668, then np.nanmean of an all-NaN slice). Canonically 0/0 is undefined, so NaN is defensible, but it injects NaN entries into the matrix for zero-lag-only coupling.'
  - 'CANDIDATE: dswpli_max saturates at 1.0 under independence: every pair of the audit iid_gaussian dataset at T >= 256 (probe3), 0.997 of off-diagonal entries at T = 256 and all entries at T >= 1024 over 30 fresh seeds (probe sat.py); same event as dspli_max = 1 (all 5 Im S share a sign).'
  - 'CANDIDATE: the DC bin is NaN (den = 0) and so is silently excluded from fmin=0 bands, unlike dspli where DC contributes -0.25 (probe2).'
