unit_id: misc.lmfit.SGDRegressor
status: profiled
correctness:
  metric_name_standard: 'in-sample mean squared error of a linear least-squares fit of y = x_j on x = x_i obtained by stochastic gradient descent (sklearn SGDRegressor
    defaults: squared loss, l2 penalty alpha = 1e-4, invscaling learning rate); an approximation to the OLS residual variance (T-1)/T (1 - r^2)'
  canonical_ref: 'Target quantity: ordinary least squares residual mean square (Legendre 1805 / Gauss 1809; any regression text, e.g. Seber & Lee 2003, Linear Regression
    Analysis, ch. 3); optimiser: Robbins & Monro 1951, Ann. Math. Stat. 22(3):400-407; Bottou 2010, Proc. COMPSTAT, "Large-scale machine learning with stochastic
    gradient descent" (sklearn user guide reference)'
  canonical_definition: 'OLS: w = sum(xc*yc)/sum(xc^2), b = ybar - w xbar, MSE = (1/T) sum (y - b - w x)^2 = ((T-1)/T)(1 - r^2) for z-scored inputs; SGD minimises
    (1/T) sum 0.5 (y_t - w x_t - b)^2 + 0.5 alpha w^2 (alpha = 1e-4) by per-sample updates and only approximates this minimiser'
  documented_definition: 'supplement §1.6.1, p.18 (supplement.txt lines 856-868; the briefing pack gives 874-887, which is off by 18 lines): "we use a number of linear
    models and record the mean squared error (MSE) of a regression of y on x. The following models (with the default parameters) from scikit-learn [2] are included:
    stochastic gradient descent regression with a squared loss (ordinary least squares fit) function (denoted by modifier SGDRegressor); Ridge regression, which uses l2-norm regularization
    (Ride); the Elastic-Net model [76, 77], which uses both l1 and l2-norm regularization (ElasticNet); and the Bayesian Ridge regressor uses a gamma distribution
    prior (with lambda1 = lambda2 = 1e-6) for the l2-norm regularizor in Ridge regression (BayesianRidge). This yields four SPIs: 215. lmfit_SGDRegressor 216. lmfit_Ridge
    217. lmfit_ElasticNet 218. lmfit_BayesianRidge"; keywords "directed, linear, unsigned, bivariate, contemporaneous"; rationale "Linear regression is commonly used
    for establishing independence through model fits (e.g., see additive noise models in Sec. 1.3.1)". GitBook spi-descriptions/miscellaneous.md "Linear Model Fit"
    repeats the text verbatim (including the typo "Ride") and lists the same four identifiers.'
  delegate_lib: scikit-learn==1.9.1 sklearn.linear_model.SGDRegressor(random_state=42).fit -> BaseSGDRegressor._fit -> _partial_fit -> _fit_regressor -> _sgd_fast._plain_sgd
    (Cython, CyHalfSquaredError loss); sklearn.metrics.mean_squared_error; numpy==2.5.4
  implemented_as: 'A[i, j] = in-sample MSE of SGDRegressor(loss="squared_error", penalty="l2", alpha=1e-4, fit_intercept=True, max_iter=1000, tol=1e-3, shuffle=True,
    learning_rate="invscaling", eta0=0.01, power_t=0.25, n_iter_no_change=5, early_stopping=False, average=False, random_state=42) fitted to z_j on z_i. Each epoch
    shuffles the samples (seeded), updates w and b per sample with eta_t = 0.01 / t^0.25 (t counts samples across epochs, starting at 1), and stops when the epoch-average
    running objective has not improved by more than 1e-3 for 5 consecutive epochs (probe n_iter_ = 15-20 at T=64, 7 at T=1024/4096; no ConvergenceWarning). The final
    iterate is not the OLS solution: probe bivariate_gaussian T=64 pair (0,1) coef 0.376 vs OLS 0.420, T=4096 intercept 0.017 vs 0; MSE excess over OLS up to 2.93e-3
    (T=64) and up to 1.98e-3 (T=4096, sparse_precision) in the check-stage ols runs; the MSE exceeds (T-1)/T, i.e. is worse than predicting the mean, in 0/2/11/30 of 120 entries
    at T = 64/256/1024/4096 (check-stage optimality runs; the trace probe saw 49 of 552 ordered pairs). Output is deterministic run to run (fixed seed) but changes with the seed by up to
    1.78e-3 (check-stage seed sweep, random_state 0-19, iid_gaussian T=4096; the trace probe over seeds 0-9 saw ~4.6e-4) and is not exactly symmetric (max |A - A.T| 1.43e-3
    on sparse_precision T=4096 over 14 datasets x 4 T, lmfit_fix/fix1.py; other dataset/T maxima <= 4.7e-4).'
  implementation_trace:
  - 'pyspi/config.yaml:1264-1278 .statistics.misc LinearModel: labels directed/linear/unsigned/bivariate/contemporaneous; configs model: Ridge, Lasso, SGDRegressor,
    ElasticNet, BayesianRidge (Lasso is the fifth, undocumented config)'
  - 'pyspi/calculator.py:230-267 Calculator._load_yaml (HEAD a1f20c7): for params in configs (252): spi = getattr(module, fcn)(**params) (256), i.e. LinearModel(model=...);
    self._spis[spi.identifier] = spi (257); the class attribute labels (misc.py:109) are what the calculator reports'
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False) (187), then scipy.stats.zscore(axis=1, nan_policy="omit",
    ddof=1) if normalise=True (default) (195); stored as (M, T, 1)'
  - 'pyspi/calculator.py:329-339 Calculator.compute (HEAD a1f20c7): S = self._spis[spi].multivariate(self.dataset) (329); np.fill_diagonal(S, np.nan) (332); any exception
    -> self._table[spi] = np.nan (336-337), so one failing pair makes the whole matrix NaN'
  - 'pyspi/base.py:84-94 Directed.multivariate: for j (outer), for i != j (inner): A[i, j] = self.bivariate(data, i=i, j=j); no mirroring'
  - 'pyspi/base.py:27-49 parse_bivariate: Data passed through unchanged (two raw arrays would be wrapped into a new z-scored Data with i, j = 0, 1)'
  - 'pyspi/data.py:108-118 Data.to_numpy(): returns the (M, T, 1) array, so z[i] is a (T, 1) design matrix with one feature'
  - pyspi/statistics/misc.py:106-109 class LinearModel(Directed, Unsigned); labels ["misc", "unsigned", "unordered", "normal", "linear", "directed"]
  - 'pyspi/statistics/misc.py:111-113 __init__: identifier "lmfit_<model>", self._model = getattr(sklearn.linear_model, model)'
  - 'pyspi/statistics/misc.py:117-124 bivariate: z = data.to_numpy(); warnings suppressed; if "random_state" in inspect.signature(model).parameters: model(random_state=42).fit(z[i],
    ravel(z[j])) else model().fit(z[i], ravel(z[j])) -> predictor = process i, target = process j'
  - pyspi/statistics/misc.py:125-126 y_predict = mdl.predict(z[i]); return mean_squared_error(y_predict, ravel(z[j])) -> in-sample (training) MSE on the same T samples
    used for fitting (argument order swapped, harmless because MSE is symmetric)
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_stochastic_gradient.py:1802 class SGDRegressor; defaults loss="squared_error", penalty="l2", alpha=1e-4,
    max_iter=1000, tol=1e-3, shuffle=True, learning_rate="invscaling", eta0=0.01, power_t=0.25, n_iter_no_change=5, random_state=None (probe inspect.signature)
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_stochastic_gradient.py:1432 loss_functions "squared_error" -> CyHalfSquaredError (0.5 (y - p)^2, sklearn/_loss/_loss.pxd:30)
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_stochastic_gradient.py:1640-1676 fit -> self._fit(alpha=self.alpha, loss, learning_rate)
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_stochastic_gradient.py:1580-1638 _fit: t_ = 1.0 (1601); _partial_fit(max_iter) (1603-1613); ConvergenceWarning
    only if n_iter_ == max_iter (1615-1626)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_stochastic_gradient.py:1712-1794 _fit_regressor: random_state = check_random_state(42) (1725); seed
    = random_state.randint (1728); make_dataset (1730-1732, intercept_decay 1.0 for dense, _base.py:108); _plain_sgd(..., shuffle, seed, eta0, power_t, t_, ...) (1747-1779)'
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_sgd_fast.pyx.tp:274 _plain_sgd; 467-474 epoch loop with dataset.shuffle(seed); 487-488 invscaling eta
    = eta0 / t^power_t; 523-530 dloss = loss.cy_gradient, update = -eta*dloss; 542-548 l2 shrink w *= (1 - eta*alpha), w += update*x; 549-554 intercept += update*intercept_decay;
    570 t += 1; 606-626 stop when objective_sum/train_count > best_objective - tol for n_iter_no_change epochs
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_stochastic_gradient.py:1697-1710 BaseSGDRegressor.predict -> _decision_function (1678-1695): safe_sparse_dot(X, coef_.T) + intercept_ (BaseSGDRegressor(RegressorMixin, BaseSGD), :1430, does not inherit LinearModel)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_stochastic_gradient.py:1794 intercept_ = np.atleast_1d(intercept): the intercept is learned by the SGD updates (_sgd_fast.pyx.tp:549-554); no _preprocess_data centring and no _set_intercept call'
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/_regression.py:524-600 mean_squared_error: _average((y_true - y_pred) ** 2, axis=0) (586-588), divisor T'
  deviation_from_documented: '(a) Documented as "stochastic gradient descent regression with a squared loss (ordinary least squares fit)": the default penalty is
    l2 with alpha = 1e-4 (a small ridge term, negligible here), and, more importantly, the SGD iterate is not converged to the OLS fit, so the reported MSE is not
    the OLS MSE (excess up to 2.9e-3, and above the trivial (T-1)/T in 49/552 probed pairs). (b) "With the default parameters": pyspi sets random_state=42 (non-default),
    which fixes the value; the value changes with the seed. (c) "directed": near-symmetric on z-scored data, the residual asymmetry (max 1.43e-3) is optimiser noise,
    not direction.'
  deviation_from_canonical: 'The canonical quantity behind the documented description is the OLS residual mean square ((T-1)/T)(1 - r^2) on z-scored data; the code
    returns the in-sample MSE of a stopped SGD iterate, which is >= the OLS value by an optimiser-dependent excess (probe: up to 2.93e-3 at T=64 on cointegrated,
    5.8e-4 at T=4096) that does not vanish with T because the stopping rule (tol = 1e-3 on the running epoch objective, 5 epochs) stops after ~7 epochs at large T
    with a step size eta0/t^0.25 still around 0.01/(7T)^0.25 ~ 1e-3. At T >= 1024 this excess is comparable to or larger than the null-pair spread of the OLS MSE
    (r^2 ~ 1/T), so weak dependencies are masked by optimiser noise.'
  units_and_range: units of the target variance; unsigned, >= OLS MSE >= 0; on z-scored data approximately ((T-1)/T)(1 - r^2) + excess, excess in [0, ~3e-3]; can
    exceed (T-1)/T (probe maximum 1.0003 at T=4096); approximately but not exactly symmetric (max |A - A.T| 1.43e-3, sparse_precision T=4096); deterministic for fixed
    seed and input order, seed sensitive.
  direction_convention: 'A[i, j] = in-sample MSE of the linear prediction of process j (target, column) from process i (predictor, row), per misc.py:122-126; LOWER
    = j better linearly predicted from i. Code-derived; with the default z-scoring the matrix is symmetric (see units_and_range), so the direction is only empirically
    identifiable with normalise=False, where column j scales with var(x_j) (probe on scaled_offset_T1024: column means of A track std_j^2 = 0.0395, 4.058, 24.78,
    97.89).'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (non-converged SGD, worse than the mean predictor): in 49 of 552 ordered pairs over 14 datasets x 4 T (34 at T=4096) A[i, j] > (T-1)/T = MSE of predicting
    the target mean; probe1.py "SGDRe ... rng=[0.9989,1.0002]" on iid_gaussian_T4096 and "[0.3685,1.0003]" on bivariate_gaussian_T4096; probe2.py T=4096 pair 0->1
    "coef=0.31505 wols=0.30861 icpt=1.74e-02".'
  - 'Candidate (not the documented OLS fit): excess MSE over the exact OLS value up to 2.93e-3 (probe3.py, cointegrated T=64), with coefficients shrunk at small T
    (probe2.py T=64 pair 0->1 coef 0.376 vs OLS 0.420); n_iter_ only 7 epochs at T >= 1024 with no ConvergenceWarning, because the stopping rule is relative to tol=1e-3.'
  - 'Candidate (seed dependence and spurious asymmetry): MSE minus OLS over seeds 0-9 spans e.g. 2.5e-05..3.9e-04 (T=4096 pair 0->1); |A - A.T| up to 1.43e-3 (sparse_precision
    T=4096; lmfit_fix/fix1.py over the same 14 datasets x 4 T as probe3.py, which printed only its top-8 rows by OLS excess and so missed this maximum) although the
    OLS target is symmetric; random_state=42 is a pyspi override of the documented "default parameters".'
  - 'Candidate (direction label is nominal under default preprocessing): after ddof=1 z-scoring every process has sum x^2 = T-1 and mean ~0, so the fit and its in-sample
    MSE are functions of (r_ij, T) only and the OLS target is symmetric; the remaining asymmetry (|A - A.T| up to 1.43e-3) is optimiser noise although the class is
    Directed (misc.py:106) and labelled "directed". Asymmetry appears only with normalise=False, where A[i, j] is in units of var(x_j).'
  - 'Candidate (documented rationale vs quantity): the supplement motivates lmfit by independence testing "through model fits (e.g., see additive noise models)",
    but the SPI is the raw in-sample MSE of a contemporaneous linear fit, which measures linear predictability (a transform of r^2 for the closed-form models), not
    residual independence; no residual-independence test is computed (misc.py:125-126).'
