unit_id: wavelet.dswpli
status: profiled
correctness:
  metric_name_standard: debiased squared phase lag index (unbiased estimator of PLI^2) from Morlet-wavelet cross-spectra, summarised by mean/max over band and time
  canonical_ref: 'Vinck, Oostenveld, van Wingerden, Battaglia & Pennartz 2011, NeuroImage 55:1548 (supplement ref [68]): unbiased estimator of squared PLI, (N PLI_hat^2 - 1)/(N - 1) (mne-connectivity comment
    epochs_bivariate.py:199 cites ''Vinck paper Eq. (30)''; equation number not re-checked).'
  canonical_definition: dsPLI = (N * PLI_hat^2 - 1)/(N - 1) = (1/(N(N-1))) sum_{j != k} sign(Im X_j) sign(Im X_k) over N trials; undefined for N = 1; can be negative.
  documented_definition: 'Not documented as such: the nine wavelet classes are absent from pyspi/config.yaml (tests/README.md:155 ''run today but are absent from pyspi/config.yaml''), from the supplement
    SPI list and from the GitBook page. Supplement §1.5.4, p.14 (supplement.txt heading line 644) states the opposite: PSI ''is the only spectral measure that is computed in the time-frequency domain (denoted by
    modifier wavelet)''; same on GitBook spectral.md:330. The closest documented text is the multitaper version: supplement §1.5.8, p.15 (supplement.txt heading line 715) / GitBook spectral.md:233-244: ''... we include
    weighted variations that make the measure more robust against ... noise, and sample-size bias ...: the weighted phase lag index (wpli), the debiased squared phase lag index (dspli), and the debiased
    squared weighted phase lag index (dswpli)''. Shared band rule, supplement §1.5 preamble, p.13 (supplement.txt heading line 570, text lines 589-599; GitBook spectral.md:14-20): ''We use 125 uniformly sampled bins across
    the entire frequency range, f in [f0, fs/2] ... f0 = 4/T ... the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5 ... [0, fs/2]; fmin-0_fmax-0-25 ... [0,
    fs/4]; fmin-0-25_fmax-0-5 ... [fs/4, fs/2]''.'
  delegate_lib: mne-connectivity==0.9.0 mne_connectivity.spectral_connectivity_epochs(mode='cwt_morlet', method='pli2_unbiased') -> mne==1.13.2 mne.time_frequency.tfr.morlet + cwt (scipy 1.17.1 scipy.fft,
    numpy 2.5.4); band mask, mean/max over (freq, time), lower->upper mirror and NaN diagonal are native pyspi (pyspi/statistics/wavelet.py)
  implemented_as: 'Input z-scored per channel (ddof=1, Data default; optional detrend first). pyspi hands mne-connectivity ONE epoch (z = moveaxis(data (P,T,1), 2, 0) -> (1,P,T)) with cwt_freqs = linspace(0.2,
    0.5, 125) and cwt_n_cycles = cwt_freqs/7 (0.029..0.071 cycles). mne.morlet sets sigma_t = n_cycles/(2 pi f) = 1/(14 pi) = 0.0227 samples for every f, so the time grid arange(0, 5 sigma_t, 1) = [0] and
    every wavelet is the single sample W = sqrt(2)+0j (probe: 125 wavelets, length 1, value 1.41421356). The ''CWT'' is X(f,t) = sqrt(2) x(t) for all 125 f up to FFT round-off (probe: max|Re X - sqrt2 x|
    2.7e-15, max|Im X| 7.2e-16, ~2-5% of Im exactly 0). csd(f,t) = X_hi(f,t) conj(X_lo(f,t)) = 2 x_hi(t) x_lo(t) + i*roundoff (hi = higher channel index, lower-triangular connections), psd = |X|^2 = 2 x^2.
    n_epochs = 1, so every across-epoch average in the estimator is a single term. pyspi then keeps the frequencies with fmin <= f <= fmax on the 0.2..0.5 grid (21 bins for fmin-0_fmax-0-25: 0.2..0.2476;
    104 for fmin-0-25_fmax-0-5; all 125 for 0..0.5), applies np.nanmean or np.nanmax over (freq, time) jointly, mirrors the lower triangle to the upper, sets the diagonal NaN. Estimator pli2_unbiased (epochs_bivariate.py:187-202):
    (n_epochs * pli_mean^2 - 1)/(n_epochs - 1) with n_epochs = 1 and pli_mean = sign(eps): 0/0 = NaN where Im != 0, -1/0 = -inf where Im == 0 exactly (probe iid T=256: 666 -inf, 31334 NaN, 0 finite). nanmean/nanmax
    -> -inf whenever any exact-zero Im point lies in the band (every probe), NaN if none (hypothesis). Identifier ''dspli'', class DebiasedSquaredWeightedPhaseLagIndex.'
  implementation_trace:
  - 'pyspi/statistics/wavelet.py:15-39 mne.__init__: fmax default fs/2; statistic ''mean'' -> np.nanmean, ''max'' -> np.nanmax; identifier suffix _wavelet_{statistic}_fs-{fs}_fmin-{fmin:.3g}_fmax-{fmax:.3g}
    with ''.''->''-'''
  - 'pyspi/data.py:184-195 Data.set_data preprocessing: optional scipy.signal.detrend(axis=1), then scipy.stats.zscore(axis=1, ddof=1) when normalise=True (default); pyspi/data.py:108-118 to_numpy returns
    the (P, T, R) array'
  - 'pyspi/statistics/wavelet.py:48-53 _get_cache: cache lookup data.mne[self.measure] (keyed by measure only); on miss z = np.moveaxis(data.to_numpy(), 2, 0) -> (R=1, P, T): a single epoch for an ordinary
    Data'
  - pyspi/statistics/wavelet.py:54-55 cwt_freqs = np.linspace(0.2, 0.5, 125); cwt_n_cycles = cwt_freqs / 7.0
  - pyspi/statistics/wavelet.py:56-67 mnec.spectral_connectivity_epochs(data=z, method=self.measure, mode='cwt_morlet', sfreq=fs, mt_adaptive=True, fmin=5/n_observations, fmax=fs/2, cwt_freqs, cwt_n_cycles)
  - pyspi/statistics/wavelet.py:68-74 conn = connectivity.get_data(output='dense') (shape P x P x 125 x T), freq = connectivity.freqs; stored in data.mne[measure]
  - pyspi/statistics/wavelet.py:76 freq_id = np.where((freq >= fmin) * (freq <= fmax)) (inclusive both ends)
  - 'pyspi/statistics/wavelet.py:163-170 DebiasedSquaredWeightedPhaseLagIndex(mne, Undirected): name ''Debiased squared phase lag index (wavelet)'', identifier ''dspli'', _measure ''pli2_unbiased'' (unweighted,
    despite ''Weighted'' in the class name)'
  - 'pyspi/statistics/wavelet.py:80-90 multivariate: adj = statfn(adj_freq[..., freq_id, :], axis=(2, 3)) (frequency AND time); ui = triu_indices(P, 1); adj[ui] = adj.T[ui] (lower -> upper); fill_diagonal
    NaN. The class MRO puts mne.multivariate before Undirected.multivariate (pyspi/base.py:132-138), so pyspi''s own mirror in wavelet.py:87-88 is the one that runs'
  - mne_connectivity/spectral/epochs.py:770 spectral_connectivity_epochs; :1143-1154 fmin/fmax to arrays (fmin = 5/T, fmax = 0.5)
  - 'mne_connectivity/spectral/epochs.py:216 -> :97-113 _check_freqs: fmin = 5/T only warns if below 5 cycles; :219 -> :116-138 _compute_freqs cwt branch (124-135): freqs_all = cwt_freqs, raises if any
    > sfreq/2'
  - 'mne_connectivity/spectral/epochs.py:222 -> :141-153 _compute_freq_mask: (freqs >= fmin) & (freqs <= fmax); for T >= 25 all 125 cwt freqs are kept (probe: T=16 keeps 78, T=24 keeps 121)'
  - 'mne_connectivity/spectral/epochs.py:262-276 indices=None and bivariate method -> np.tril_indices(n_signals, -1): connections (row i > col j) only; :1373 idx_map = searchsorted(sig_idx, indices)'
  - 'mne_connectivity/spectral/epochs.py:1332-1344 -> :320-367 _assemble_spectral_params cwt branch (345-365): cwt_n_cycles[freq_mask] (357); wavelets = morlet(sfreq, freqs, n_cycles=cwt_n_cycles, zero_mean=True)
    (361); mt_adaptive is only used in the multitaper branch (337-341) and is returned unchanged'
  - mne/time_frequency/tfr.py:65 morlet; :159 sigma_t = n_cycles/(2 pi f) = 1/(14 pi) = 0.0227; :165-166 t = arange(0, 5 sigma_t, 1/sfreq) = [0] -> single sample; :167-172 oscillation = 1 - exp(-2 (pi f
    sigma_t)^2) (zero_mean offset, 4.1e-4..2.5e-3); :173-174 envelope 1; :178 W /= sqrt(0.5) * norm(W) -> W = [sqrt(2)]
  - 'mne_connectivity/spectral/epochs.py:443-457 _compute_spectra cwt branch: this_x_t = cwt(x, wavelets, use_fft=True, mode=''same'') (451); psd = (X * conj X).real (457)'
  - 'mne/time_frequency/tfr.py:766-794 cwt -> :303-319 _get_nfft (next_fast_len(T), called at 793) -> :797-806 _cwt_array (called at 794; calls _cwt_gen at 799) -> :322-401 _cwt_gen: fft_Ws (366), ret = ifft(fft_x * fft_Ws[ii]) (377), _centered(ret, n_times) (400): real input times
    real constant, imaginary part is FFT round-off'
  - 'mne_connectivity/spectral/epochs.py:647-656 cwt accumulation: csd = x_t[idx_map[0]] * conj(x_t[idx_map[1]]) (652) = X_hi conj(X_lo); this_method.accumulate(con_idx, csd)'
  - mne_connectivity/spectral/epochs.py:1472-1474 n_epochs = epoch_idx = 1; psd /= 1; :1477-1493 compute_con(con_idx, n_epochs[, psd_xx, psd_yy])
  - 'mne_connectivity/spectral/epochs.py:1555-1567 dense assembly: zeros (P,P,...) then this_con[indices_use] = values (lower triangle only; upper and diagonal 0); :1621 SpectroTemporalConnectivity; mne_connectivity/base.py:721-790
    get_data(output=''dense'') reshape to (P, P, n_freqs, n_times)'
  - mne_connectivity/spectral/epochs_bivariate.py:163-177 _PLIEst.accumulate sign(Im csd); :187-202 _PLIUnbiasedEst.compute_con (n_epochs pli_mean^2 - 1)/(n_epochs - 1) (200); :359 'pli2_unbiased' -> _PLIUnbiasedEst
  deviation_from_documented: '(a) Frequency grid: documented 125 bins over [4/T, fs/2]; implemented 125 bins over [0.2, 0.5] for every T (wavelet.py:54), so the ''low'' band [0, 0.25] contains only 21 bins
    in [0.2, 0.248] and frequencies below 0.2 are never analysed; the mne fmin argument is 5/T, not 4/T (it only masks cwt freqs when T < 25). (b) No time-frequency decomposition: n_cycles = f/7 makes every
    Morlet wavelet one sample long (W = sqrt(2)), so X(f,t) = sqrt(2) x(t) at all 125 frequencies; the band choice changes nothing except which round-off pattern is averaged. (c) Aggregation runs over frequency
    AND time (axis=(2,3)) of per-(f,t) single-epoch values; the documentation for the multitaper versions describes a summary over frequency only. (d) Not in the documented SPI set at all (extra classes).
    (e) Output -inf (division by zero). (f) Naming: class name says ''Weighted'', computed measure is the unweighted debiased squared PLI; this matches the identifier ''dspli'' and the supplement''s dspli,
    not the class name.'
  deviation_from_canonical: Undefined for one trial; the library divides by N - 1 = 0 without a guard; pyspi's nanmean/nanmax return -inf (or NaN). Degenerate.
  units_and_range: Nominally [-1/(N-1), 1] (negative legitimate for N >= 2, REVIEW M7); implemented -inf (possibly NaN); symmetric; diagonal NaN.
  direction_convention: Undirected; A[i,j] = A[j,i] from conn[max(i,j), min(i,j)] (mne_connectivity/spectral/epochs.py:276, :652; wavelet.py:87-88).
  symmetry_expected: sym
  already_documented: tests/README.md 'Degenerate outputs in the extra wavelet set' (tests/README.md:217 'ppc and dspli are -inf everywhere'). REVIEW M7 concerns legitimate negative values of multi-trial
    estimators.
  new_finding_candidates:
  - 'CANDIDATE: whether the output is -inf or NaN depends on whether any FFT round-off imaginary part is exactly zero in the band (per point: -inf where Im == 0, NaN otherwise; probe 666 -inf / 31334 NaN);
    an input with no exact zeros would give NaN (not observed).'
  - 'CANDIDATE (naming): class DebiasedSquaredWeightedPhaseLagIndex computes the unweighted ''pli2_unbiased'' (wavelet.py:163-169); unit id wavelet.dswpli and class name suggest the weighted variant, which
    is actually the separate dwspli class.'
