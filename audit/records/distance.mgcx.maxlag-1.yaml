optimisation:
  complexity_P_T: 'O(P^2 (T^2 log T + L T^3)) with L=1: per ordered pair compute_stat runs MGC on the series and on the lag-1 distance-of-distance
    matrices (GEMM, O(T^3)), and MGCX.statistic then runs compute_scale_at_lag (another distance matrix pair, distance-of-distance and MGC().test(reps=0)
    with two multiscale_graphcorr calls). Measured T_exponent 2.07 (8x256 3.33 s -> 8x1024 58.8 s); projected by pair count (14507 s).'
  hotspot_1: scipy/stats/_mgc.py:_mgc_stat (third-party:scipy) 82.3% cumulative, 41.2% self time of the profiled SPI call at 8x1024, over 224
    MGC evaluations (four per ordered pair); numpy unique (rank transforms) 31.2%
  hotspot_2: 'hyppo/time_series/_utils.py:compute_scale_at_lag (third-party:hyppo) 51.4% cumulative: the discarded scale search (hyppo/independence/mgc.py:MGC.test
    50.6%, its perm_test observed statistic 21.0%)'
  hotspot_owner: third-party:scipy
  opaque_share: 0.2835
  profile_file: audit/profiles/distance.mgcx.maxlag-1__8x1024.pstats
  opportunities:
  - opportunity_id: lagged_dcorr_mgc-1
    opportunity: 'Skip MGCX''s discarded scale search: call hyppo time_series compute_stat(x, y, MGC, ''euclidean'', max_lag) instead of MGCX.statistic,
      which afterwards runs compute_scale_at_lag (a fresh distance-of-distance plus MGC().test(reps=0) = two more multiscale_graphcorr calls)
      only to return opt_scale, which pyspi/statistics/distance.py:CrossMultiscaleGraphCorrelation.bivariate discards.'
    opp_type: algorithmic
    expected_speedup: ~2x
    speedup_basis: profile:audit/profiles/distance.mgcx.maxlag-1__8x1024.pstats compute_scale_at_lag 51.4% (Amdahl 2.06x).
