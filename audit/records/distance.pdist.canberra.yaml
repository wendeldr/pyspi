unit_id: distance.pdist.canberra
status: profiled
correctness:
  metric_name_standard: Canberra distance between z-scored series
  canonical_ref: Lance & Williams 1966, Computer J. 9(1):60-64 'Computer programs for hierarchical polythetic classification (similarity analyses)'; Lance
    & Williams 1967, Aust. Comput. J. 1:15-20; signed-data form as in Deza & Deza 2016, entry 'Canberra distance'
  canonical_definition: 'd(x,y) = sum_t |x_t - y_t| / (|x_t| + |y_t|), with 0/0 := 0 (originally for non-negative data: |x_t - y_t|/(x_t + y_t))'
  documented_definition: 'GitBook distance-similarity.md ''Pairwise Distance'' (lines 297-321): "Pairwise distance between time-series, computed using sklearn''s
    pairwise distance function using the following distance metrics: Euclidean, Cityblock, Cosine, Chebyshev, Canberra, Braycurtis"; keywords "undirected,
    nonlinear, unsigned, unordered". No formula is given. pdist is absent from the supplement: supplement §1.2 ''Distance similarity (26 SPIs)'', p.5 (heading
    line 209) lists SPIs 22-47 (dcorr, dcorrx, mgc, mgcx, hsic, hhg, dtw, lcss, softdtw, bary) and no pdist entry.'
  delegate_lib: scipy==1.17.1 scipy.spatial.distance.pdist(X, 'canberra') (C++ _distance_pybind.pdist_canberra), reached through sklearn==1.9.1 pairwise_distances'
    SciPy branch, then squareform
  implemented_as: 'Rows z-scored (ddof=1) by default; scipy pdist computes sum_t |x_t - y_t| / (|x_t| + |y_t|) with 0/0 treated as 0 (probe: [0,1,2] vs
    [0,1,3] -> 0.2). Each term lies in [0,1] and equals 1 whenever x_t and y_t have opposite signs or one of them is 0.'
  implementation_trace:
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (Calculator defaults detrend=False, normalise=True,
    calculator.py:48-50; lines at HEAD a1f20c7)
  - pyspi/data.py:184-195 optional scipy.signal.detrend(axis=1), then zscore(data, axis=1, nan_policy='omit', ddof=1) per process
  - pyspi/calculator.py:329-335 S = self._spis[spi].multivariate(self.dataset); np.fill_diagonal(S, np.nan); self._table[spi] = S (HEAD a1f20c7)
  - 'pyspi/base.py:51-68 parse_multivariate: passes the Data object through unchanged'
  - pyspi/statistics/distance.py:28-36 class PairwiseDistance(Undirected, Unsigned); __init__ stores metric, identifier 'pdist_<metric>'
  - 'pyspi/statistics/distance.py:38-40 multivariate overrides Undirected.multivariate (base.py:132-138, never called): return pairwise_distances(data.to_numpy(squeeze=True),
    metric=self._metric)'
  - pyspi/data.py:108-118 to_numpy(squeeze=True) -> (M processes, T observations) float64; each row is one vector in R^T
  - sklearn/metrics/pairwise.py:2309 pairwise_distances(X, Y=None, metric, n_jobs=None, ensure_all_finite=True) (scikit-learn 1.9.1)
  - sklearn/metrics/pairwise.py:2472 else-branch (metric not precomputed, not in PAIRWISE_DISTANCE_FUNCTIONS, not callable); :2476 dtype = 'infer_float';
    :2482-2484 check_pairwise_arrays(X, None, dtype=dtype, ensure_all_finite=...) (sklearn/metrics/pairwise.py:171-172 infer_float -> float64, :174-175
    X = Y = check_array(X))
  - sklearn/metrics/pairwise.py:2490-2491 n_jobs==1 and X is Y -> distance.squareform(distance.pdist(X, metric))
  - scipy/spatial/distance.py:1816 pdist (scipy 1.17.1); scipy/spatial/distance.py:2133-2138 metric alias lookup -> metric_info.pdist_func
  - scipy/spatial/distance.py:1667-1672 MetricInfo('canberra', pdist_func=_distance_pybind.pdist_canberra) (compiled scipy/spatial/_distance_pybind.cpython-312-x86_64-linux-gnu.so)
  - scipy/spatial/distance.py:1150 canberra(u, v) Python reference; scipy/spatial/distance.py:1178 docstring 'When u[i] and v[i] are 0 for given i, then
    the fraction 0/0 = 0 is used'
  - scipy/spatial/distance.py:2154 squareform
  deviation_from_documented: 'None in substance: the code is sklearn.metrics.pairwise_distances with metric=''canberra'' as the GitBook page states. Not
    stated on the page: inputs are z-scored per process (ddof=1) by Data by default (optionally detrended first), sklearn forwards this metric to scipy.spatial.distance.pdist,
    and the Calculator sets the diagonal to NaN. No formula or normalisation (e.g. per-sample scaling) is documented.'
  deviation_from_canonical: 'Formula: matches the |x|+|y| generalisation with 0/0 := 0 (probe: max |A - scipy.spatial.distance.canberra loop| = 5.7e-14,
    exactly symmetric). Domain: Lance & Williams defined it for non-negative data; on z-scored signed data every opposite-sign sample contributes exactly
    1 regardless of magnitude (y = -x gives exactly T), and samples near zero are maximally weighted, so the statistic behaves largely as a sign-disagreement
    count.'
  units_and_range: 'Dimensionless; range [0, T] (each term in [0,1]); y = -x gives exactly T (probe T=256: 256.0); for independent Gaussian pairs canberra/T
    -> 1/2 + ln2/pi = 0.72064 (probe T=4e5: 0.71987). Grows linearly with T; never negative.'
  direction_convention: 'A[i,j] = d(z_i, z_j) for rows i, j of the (z-scored) M x T data; the metric is symmetric so A[i,j] = A[j,i]; no direction is encoded;
    diagonal NaN after Calculator.compute (confirmed in the check stage: sym runs).'
  symmetry_expected: sym
  already_documented: docs/storage_comparison/REVIEW.md M1 (PairwiseDistance overrides Undirected.multivariate; output exactly symmetric via squareform)
  new_finding_candidates:
  - 'Candidate (domain): Canberra is applied outside its original non-negative domain. On z-scored data any sign disagreement contributes 1 irrespective
    of amplitude and near-zero samples carry maximal weight. Probe: y = -x gives exactly T (256.0 at T=256); for Gaussian pairs canberra/T -> integral over
    the angle density (rho=0: 0.72064 analytic, 0.71987 probe).'
  - 'Candidate (interpretation): value grows linearly with T and is a dissimilarity (larger = less coupled); not stated in the GitBook page.'
