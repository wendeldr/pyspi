  what_changed: 'The code is the generalised Canberra distance sum |x-y| / (|x| + |y|) with 0/0 := 0 (Deza & Deza form), fp-exact. Lance & Williams defined
    it for non-negative data; pyspi applies it to z-scored signed data, where every sample of opposite sign contributes exactly 1 whatever its amplitude,
    samples near zero get maximal weight, and y = -x gives exactly T. Values stay in [0, T]; T-dependent; dissimilarity. Score 9: matches the canonical
