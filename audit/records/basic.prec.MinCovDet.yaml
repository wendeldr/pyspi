unit_id: basic.prec.MinCovDet
status: profiled
correctness:
  metric_name_standard: Off-diagonal entry of the inverse of the reweighted MCD robust covariance (robust precision matrix); prec-sq_MinCovDet is its square
  canonical_ref: 'Rousseeuw P.J. 1985, "Multivariate estimation with high breakdown point", in Mathematical Statistics and Applications Vol. B, 283-297 (MCD definition); Rousseeuw P.J. & Van Driessen K.
    1999, Technometrics 41(3):212-223 (FAST-MCD: C-step theorem, raw consistency factor med(d^2)/chi2_{p,0.5}, reweighting with hard weights d^2 <= chi2_{p,0.975}); consistency factor c_alpha = alpha /
    F_{chi2_{p+2}}(chi2_{p,alpha}): Croux C. & Haesbroeck G. 1999, J Multivar Anal 71:161-190; small-sample factors: Pison G., Van Aelst S., Willems G. 2002, Metrika 55:111-123; precision -> partial correlation:
    Whittaker J. 1990, Graphical Models in Applied Multivariate Statistics, Wiley, ch. 5 (Prop. 5.7.1 scaled-inverse identity)'
  canonical_definition: Omega = Sigma_MCD^{-1} (reweighted robust MCD scatter, see Covariance unit); the partial correlation is rho_ij|rest = -Omega_ij / sqrt(Omega_ii Omega_jj) (Whittaker 1990, Graphical
    Models in Applied Multivariate Statistics, ch. 5; Lauritzen 1996, Graphical Models). Omega_ij itself is not bounded and has the opposite sign of the partial correlation.
  documented_definition: 'supplement §1.1.2, p.4: "The precision matrix is the matrix inverse of the covariance matrix ... For normalized time-series data, the precision matrix is equivalent to the partial
    correlation between each pairwise time series, conditioned on all other time series, and is within [-1, 1]. The precision matrix is computed via the same module as the covariance matrix (in scikit-learn
    [2]), and has the same estimators." Items 10 prec_EllipticEnvelope, 11 prec_MinCovDet. GitBook basic-statistics.md:107 same text. The -sq variant is not described.'
  delegate_lib: 'scikit-learn==1.9.1 (scipy==1.17.1 linalg.pinvh, numpy==2.5.4): sklearn.covariance.MinCovDet().fit -> MinCovDet.fit -> fast_mcd, correct_covariance, reweight_covariance; attribute precision_'
  implemented_as: 'Data z-scored per channel over the full sample (ddof=1; optional detrend first). z (T x P) passed to sklearn MinCovDet() with all defaults and random_state=None (global numpy RNG). FAST-MCD
    raw search: h = ceil((T+P+1)/2); T<=500: 30 random h-subsets x 2 C-steps, best 10 refined; T>500: random partition into T//300 subsets, 500 trials, merge on <=1500 samples. Raw distances divided by
    the Croux-Haesbroeck factor c(P,h/T); rows with d2 < chi2_{P,0.975} kept; Sigma = c(P,0.975) * MLE covariance (divisor n_w) of kept rows; precision_ = scipy.linalg.pinvh(Sigma). pyspi returns the precision_
    matrix as is (no normalisation to correlation / partial correlation, no sign flip), diagonal set to NaN in place on the cached fit; prec-sq_MinCovDet returns its elementwise square. One fit per Data
    object per estimator name, shared by cov/prec and squared/unsquared identifiers.'
  implementation_trace:
  - 'pyspi/config.yaml:4-36 (Covariance) and :39-71 (Precision) list estimator EllipticEnvelope / MinCovDet with and without squared: True; pyspi/calculator.py:230-264 _load_yaml imports (:239 importlib.import_module,
    :256 getattr(module, fcn)(**params)) the module and instantiates getattr(module, fcn)(**params)'
  - 'pyspi/data.py:184-195 preprocessing before any SPI: optional scipy.signal.detrend(axis=1), then scipy.stats.zscore(axis=1, ddof=1, nan_policy="omit") over the FULL sample (outliers included); :199-203
    NaN after preprocessing raises ValueError'
  - pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :335 self._table[spi] = S (row i, column j)
  - pyspi/statistics/basic.py:66-72 class Precision(Estimators) identifier "prec", kind="precision"
  - 'pyspi/statistics/basic.py:9-29 class Estimators(Undirected, Signed): squared -> identifier "-sq" prefix, labels + ["unsigned"], issigned -> False; no estimator hyperparameters are forwarded'
  - pyspi/statistics/basic.py:46-47 Estimators.multivariate overrides Undirected.multivariate (pyspi/base.py:132-138 mirror never runs; REVIEW M1); parse_multivariate pyspi/base.py:51-68
  - 'pyspi/statistics/basic.py:31-44 _from_cache: cache key data.covariance["MinCovDet"] (estimator name only, shared by cov/prec and squared/unsquared); on miss z = data.to_numpy(squeeze=True).T (T x P,
    columns = processes), warnings.simplefilter("ignore") (:37-38, silences sklearn rank / determinant warnings), getattr(cov, "MinCovDet")().fit(z) with ALL defaults (:39) -> random_state=None, support_fraction=None,
    assume_centered=False, store_precision=True'
  - pyspi/statistics/basic.py:49 matrix = getattr(mycov, "precision_") (the cached array itself, no copy); :50 np.fill_diagonal(matrix, np.nan) mutates the cached fitted attribute in place; :51-54 returns
    np.square(matrix) if squared else matrix
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_robust_covariance.py:770-822 MinCovDet.fit: :788 validate_data; :789 random_state = check_random_state(None) -> global np.random.mtrand._rand
    (sklearn/utils/validation.py:1477-1478); :792-795 rank warning; :797-802 fast_mcd raw estimates; :818 correct_covariance(X) (return value discarded, only dist_ rescaled); :820 reweight_covariance(X)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_robust_covariance.py:399-618 fast_mcd: :475-476 n_support = min(ceil(0.5*(n+p+1)), n) (ceil, not floor); :511-589 n>500 path (n//300 random subsets,
    500 total trials, merge to <=1500 samples, permutations from random_state); :590-616 n<=500 path: 30 random starts x 2 C-steps, best 10 refined to convergence'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_robust_covariance.py:114-213 _c_step: :129 random initial support random_state.permutation(n)[:h]; :153-170 concentration steps on det(cov(H))
    with dist via linalg.pinvh; :143 cov_computation_method = empirical_covariance (MLE, bias=1)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_robust_covariance.py:253-396 select_candidates: keeps the `select` lowest-determinant C-step results'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_robust_covariance.py:824-861 correct_covariance: :858 consistency_factor = _consistency_factor(p, h/n); :860 dist_ /= factor; .venv/lib/python3.12/site-packages/sklearn/covariance/_robust_covariance.py:216-250
    _consistency_factor: c = alpha / chi2.cdf(chi2.ppf(alpha, p), p+2) (Croux & Haesbroeck 1999)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_robust_covariance.py:863-925 reweight_covariance: :906 mask = dist_ < chi2(p).isf(0.025); :910 location = mean(mask); :911-913 empirical_covariance(data[mask])
    (MLE); :917-920 _set_covariance(cov * _consistency_factor(p, 0.975))'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:65-107 empirical_covariance: np.cov(X.T, bias=1); :196-215 _set_covariance stores covariance_ and precision_ = scipy.linalg.pinvh(covariance,
    check_finite=False) (:213)'
  - 'documented version for comparison: https://raw.githubusercontent.com/scikit-learn/scikit-learn/0.24.1/sklearn/covariance/_robust_covariance.py (sklearn 0.24.1) correct_covariance :707 correction =
    np.median(self.dist_) / chi2(p).isf(0.5); reweight_covariance :747 mask, :756 self._set_covariance(covariance_reweighted) with NO consistency factor'
  deviation_from_documented: 'Version: documented sklearn v0.24.1, executed 1.9.1; the MCD correction and reweighting changed (raw median factor -> Croux-Haesbroeck factor; reweighted covariance now multiplied
    by c(P,0.975) = 1.055-1.104 for P=5..2), so values are not those of the documented version (probe p4.py, ratios 1.055-1.10). Definition: documented "equivalent to the partial correlation ... within
    [-1,1]" is false: the raw precision entry is returned, Omega_ij = -rho_ij|rest * sqrt(Omega_ii Omega_jj), opposite in sign to the partial correlation and unbounded (probe -2.63 vs partial correlation
    +0.81; up to 368 on narrowband). prec-sq_MinCovDet undocumented in the supplement. Stochastic output (global RNG) not documented in the supplement (documented in tests/README.md).'
  deviation_from_canonical: 'Close variant of reweighted FAST-MCD: (1) the search is a stochastic approximation of the MCD optimum (inherent to FAST-MCD) but the random starts come from the global numpy
    RNG, so the selected h-subset and hence values vary run to run (spread up to 0.34 at T=64); (2) h = ceil((n+p+1)/2) instead of floor; (3) reweighted covariance uses the MLE divisor n_w (robustbase:
    n_w - 1) and no small-sample correction (Pison et al. 2002); (4) raw consistency factor is the asymptotic Croux-Haesbroeck factor rather than RVD 1999 median rescaling; (5) the input is z-scored with
    non-robust mean/SD over the full sample before the robust fit, so the output is a robust covariance in units of the contaminated SD, not a robust correlation. (6) precision via pseudo-inverse pinvh:
    for singular scatter (collinear channels) a Moore-Penrose inverse is returned silently instead of failing.'
  units_and_range: 'prec: dimensionless (inverse z-score units), signed (sign opposite to partial correlation), symmetric up to round-off, unbounded (observed |value| up to 368 on narrowband_f0-0.25 T=64);
    prec-sq >= 0. Diagonal NaN. Finite pseudo-inverse values for singular scatter.'
  direction_convention: 'undirected: A[i,j] = A[j,i] = (i,j) entry of the robust precision matrix fitted on z (columns ordered as processes, basic.py:35); symmetry comes from the estimator (Undirected mirror
    bypassed, REVIEW M1); pinvh output symmetric to round-off (probe max|P-P.T| = 8.9e-16); confirmed empirically in the check stage (perm and dir runs)'
  symmetry_expected: sym
  already_documented: 'tests/README.md line 145 (tolerance-policy row: "sklearn robust covariance draws from the global numpy RNG; reproducible only via seed_all()", marker stochastic), line 134 (CALC_E2E_SKIP
    of cov*/prec*MinCovDet because a single seeded pass draws in a different order), line 135 (shared-cache test reseeding the 12 stochastic identifiers) and line 125 (FORCE_SLOW list names *MinCovDet*
    and *EllipticEnvelope*; a timing marker, not a stochasticity note); REVIEW M1 (Undirected mirror bypassed by cov/prec classes); REVIEW M2 (precision last-bit reciprocal asymmetry from pinvh)'
  new_finding_candidates:
  - 'CANDIDATE (redundancy, confirms briefing hypothesis 1): EllipticEnvelope covariance_/precision_ are bit-identical to MinCovDet given the same global RNG state. p1.py: np.random.seed(0) before each
    fit, np.array_equal(MCD.covariance_, EE.covariance_) and of precision_ -> True on iid_gaussian, sparse_precision, contaminated, delayed_noise at T=64,256,1024,4096 (16/16). Code reason: _elliptic_envelope.py:183
    super().fit(X), :184 only sets offset_. In a Calculator pass the two are fitted at different points of the global RNG stream (separate cache keys, basic.py:33), so *_EllipticEnvelope vs *_MinCovDet
    differ only by RNG noise. These are single unseeded draws that change from pass to pass: the first p3.py pass gave max|cov_EE - cov_MCD| = 0.0765 (sparse_precision T=64), 0.0519 (iid T=256), 0.0092-0.0142
    (T=1024); four further fresh-process p3.py passes gave per-pass maxima of 0-0.146 at T=64, 0-0.0337 at T=256 (iid T=256: 0.0176, 0.0212, 0.017, 0.0337) and 0-0.0149 at T=1024, with exactly 0 whenever
    both fits land on the same optimum. The EEG selection keeps prec_EllipticEnvelope and prec_MinCovDet (and -sq) as separate features of one estimator.'
  - 'CANDIDATE (reproducibility MAGNITUDE only; the stochasticity itself and the need for seed_all() are already documented at tests/README.md:145 and are not claimed here): the seed-to-seed spread is large,
    not last-bit. p1.py, 20 seeds of np.random.seed(s) then MinCovDet().fit on z-scored data: max spread of any covariance_ entry = 0.155 (iid_gaussian T=64), 0.341 (sparse_precision T=64), 0.070-0.163
    (T=256), 0.015-0.029 (T=1024), 0.0035-0.0087 (T=4096). p3.py, two fresh-process Calculator runs (config with only the 8 robust SPIs, no misc import so no np.random.seed(1717)): sparse_precision T=64
    cov_EllipticEnvelope[0,1] = 0.398263121046 then 0.321753737284; delayed_noise T=256 cov_MinCovDet[0,1] = -0.098336054359 then -0.088116611885. Full default config imports pyspi.statistics.misc -> pyspi/lib/ids/numpy_dependence.py:11-12
    np.random.seed(1717) at import, which (hypothesis, not probed) makes a full-config run reproducible only for a fixed SPI order and set.'
  - 'CANDIDATE (version drift from documented sklearn 0.24.1): sklearn 1.9.1 replaces the raw median correction (0.24.1 :707) by the Croux-Haesbroeck factor (_robust_covariance.py:858) and multiplies the
    reweighted covariance by c(p,0.975) (:917-920; absent in 0.24.1 :756). c(p,0.975) = 1.10447 (p=2), 1.07848 (p=3), 1.06447 (p=4), 1.05553 (p=5) (p4.py). p4.py from-scratch emulation of the 0.24.1 steps
    on the same raw fit: median off-diagonal ratio new/old = 1.0555 (iid_gaussian p=5), 1.0645 (bivariate_gaussian p=4), 1.0969-1.1045 (contaminated p=2); max abs entry change 0.0065-0.142; reweighted support
    size can differ (sparse_precision T=64: 57 vs 53). The emulation is a reading of the 0.24.1 source, not a run of 0.24.1.'
  - 'CANDIDATE (documented definition false; affects every prec_* estimator, not only robust ones): pyspi returns raw precision entries, not partial correlations. p2.py bivariate_gaussian T=256 seed 42:
    prec_MinCovDet[2,3] = -2.6276 while -Omega_23/sqrt(Omega_22 Omega_33) = +0.8126 (opposite sign, |value| > 1). p2.py max |prec off-diag| over 20 seeds: 3.99 (bivariate_gaussian T=64), 32.7 (cointegrated
    T=256), 368.3 (narrowband_f0-0.25 T=64).'
  - 'CANDIDATE (silent degenerate output): basic.py:37-38 suppress all warnings, including sklearn "covariance matrix ... not full rank" (_robust_covariance.py:792-795) and "Determinant has increased" (:188-195).
    For rank-deficient input the precision is a pseudo-inverse: p2.py shared_envelope T=64 (x2 == x0) gives prec[0,2] = +0.345 and prec[0,0] = 0.345 (pinvh of a singular scatter) with no warning reaching
    the user.'
  - 'CANDIDATE (side effect, value-neutral in Calculator): basic.py:49-50 return the cached fitted array and NaN its diagonal in place. p2.py: Covariance(MinCovDet).multivariate(d) is d.covariance["MinCovDet"].covariance_
    -> True and the cached diag becomes [nan nan nan nan]; Precision then reads precision_ from the same fit (True), so cov and prec are mutually consistent within one Data object. A caller that edits the
    returned unsquared matrix edits the cache.'
  - 'CANDIDATE (minor variant): default h = ceil((n+p+1)/2) (_robust_covariance.py:476) vs the canonical floor((n+p+1)/2) (Rousseeuw & Leroy 1987; robustbase h.alpha.n(0.5,n,p)); they differ by 1 when n+p+1
    is odd (p1.py raw support 34 for contaminated T=64, p=2: 67/2 -> 34 vs floor 33). Reweighted covariance uses the MLE divisor n_w (empirical_covariance bias=1) whereas robustbase cov.wt uses n_w - 1
    (factor 47/46 ~ 1.02 at T=64).'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - sparse_precision
    - contaminated
    - bivariate_gaussian
    - delayed_noise
    path: kernel
    reference: 'PARTIALLY independent: from-scratch numpy/scipy re-implementation of the correction and reweighting arithmetic only (no sklearn import inside the reference), fed with the raw FAST-MCD search
      result from sklearn, so it does not test the stochastic search (checks 2 and 3 cover that): given raw_location_/raw_covariance_/raw_support_ taken from the pyspi fit, d2 = Mahalanobis via np.linalg.solve,
      c_raw = alpha/chi2.cdf(chi2.ppf(alpha,p),p+2) with alpha = h/n, mask = d2/c_raw < chi2.isf(0.025,p), Sigma = c(p,0.975) * MLE covariance of masked rows, Omega = np.linalg.inv(Sigma); compare to the
      off-diagonal precision output'
    reference_kind: same-lineage
    criterion: tolerance
    expected_outcome: off-diagonal precision entries agree to <= 1e-10 relative at every T (isolates sklearn correction/reweight from the stochastic raw search; input raw support is sklearn-derived and
      is the only shared element). Labelled same-lineage because the compared output depends on that sklearn raw search; the arithmetic of c(p,h/n), c(p,0.975), the mask and the MLE covariance is independent
  - datasets:
    - iid_gaussian
    - sparse_precision
    - contaminated
    - delayed_noise
    path: kernel
    reference: 'from-scratch C-step concentration in numpy (Rousseeuw & Van Driessen 1999 Theorem 1): 2000 random h-subsets, h = ceil((n+p+1)/2) as sklearn, iterate C-steps to convergence; record the minimum
      log det(S_H) found'
    reference_kind: independent-impl
    criterion: optimality
    expected_outcome: 'log det of sklearn raw_covariance_ (seeded fit) is <= the from-scratch best + 1e-9 on most datasets; report the gap per T. Hypothesis: gaps > 0 appear at T=64 and explain the seed
