    reference_kind: same-lineage
    criterion: exact
    expected_outcome: precision_ of MinCovDet and EllipticEnvelope bit-identical at all T (probe already showed 16/16); in a seeded single Calculator pass the two identifiers differ only through RNG position
  - datasets:
    - iid_gaussian
    - sparse_precision
    - delayed_noise
    path: pipeline
    reference: 'reproducibility study: 20 fresh-process Calculator runs (config with the 8 robust SPIs) and 20 np.random.seed values for MinCovDet().fit; numpy only for the summary'
    reference_kind: independent-impl
    criterion: statistical
    expected_outcome: report per-T max spread of each off-diagonal entry; expected (probe) ~0.1-0.35 at T=64 shrinking to <0.01 at T=4096; any run-to-run difference in an unseeded pass confirms non-determinism
  - datasets:
    - sparse_precision
    - bivariate_gaussian
    path: pipeline
    reference: 'analytic: precision of the z-scored process Omega_z = S Omega S with S = diag(sqrt(diag(cov_true))) from precision_true / cov_true; partial correlation -Omega_ij/sqrt(Omega_ii Omega_jj)
      (bivariate_gaussian pair (2,3): Omega_23 = -0.8/0.36 = -2.222, partial corr 0.8)'
    reference_kind: analytic
