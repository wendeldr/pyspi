    expected_outcome: pyspi prec_* tracks Omega_z (e.g. ~ -2.2 for the rho=0.8 pair, ~ -0.4*s_i*s_j on the sparse_precision tridiagonal, ~0 elsewhere) within sampling error at T >= 1024; it does NOT equal
