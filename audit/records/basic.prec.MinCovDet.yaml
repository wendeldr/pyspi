optimisation:
  complexity_P_T: 'O(n_trials x iterations x (P^3 + T_sub P^2)): sklearn _robust_covariance.py:fast_mcd runs C-steps (_c_step) whose cost per iteration is one pinvh (eigh, P^3), one empirical covariance
    (h P^2) and one Mahalanobis pass (T_sub P^2); the trial count is fixed by T, not by P: 30 starts for T<=500, but for T>500 T//300 subsets x 500/(T//300) starts plus a merged pass (528 C-steps at T=1024).
    The measured T_exponent 1.90 (8x256 -> 8x1024) is this regime switch at T=500, not a T^2 law. Measured P_exponent 0.35 (8->32, sklearn validation still a large share at P=8); 32->118 implies ~1.46 (0.52
    s -> 3.49 s). At 118x1024 the P^3 eigh dominates (57.4% of the call in the 118x1024 profile).'
  hotspot_1: scipy/linalg/_decomp.py:eigh via scipy/linalg/_basic.py:pinvh in sklearn/covariance/_robust_covariance.py:_c_step (third-party:scipy) 57.4% of the profiled SPI call at 118x1024 (pinvh 62.5%,
    1154 calls; audit/profiles/micro/prof_basic.cov.MinCovDet__118x1024.pstats); pinvh 18.1% at 8x1024
  hotspot_2: sklearn/covariance/_empirical_covariance.py:empirical_covariance (third-party:sklearn) 13.5% at 118x1024 (np.cov 8.4%, check_array 4.9%); 46.1% at 8x1024 where sklearn input validation (check_array
    27.3%) is a large share; _c_step self time 14.9% at 118x1024
  hotspot_owner: third-party:scipy
  opaque_share: 0.24
  profile_file: audit/profiles/basic.prec.MinCovDet__8x1024.pstats; audit/profiles/micro/prof_basic.cov.MinCovDet__118x1024.pstats
  eeg_basis: family-warm
  basis_scope_note: 'The fit is cached by estimator name (pyspi/statistics/basic.py:31-43). The retained cov_MinCovDet fits it before this unit in the family-warm run (3.43 s at 118x1024) and in an
    EEG run (Covariance precedes Precision in pyspi/workflow/retained185.yaml, MinCovDet at line 19), so the family-warm figure stands for this unit''s EEG cost; the
    cov_EllipticEnvelope fit timed earlier in that run is a different cache entry'
  opportunities:
  - opportunity_id: cov_prec_robust-1
    opportunity: Inside FAST-MCD's C-steps (sklearn _robust_covariance.py:_c_step) replace linalg.pinvh(covariance) + (X_c @ precision * X_c).sum(1) by a Cholesky factor and a triangular solve for the Mahalanobis
      distances, taking log det from the same factor; needs a pyspi-side copy of fast_mcd/_c_step because sklearn exposes no hook for the inverse.
    opp_type: algorithmic
    expected_speedup: ~2x
    speedup_basis: 'profile:audit/profiles/micro/prof_basic.cov.MinCovDet__118x1024.pstats scipy/linalg/_decomp.py:eigh 57.4% (pinvh 62.5%, 1154 calls) + complexity: Cholesky ~1/10 of eigh flops at P=118;
      Amdahl bound 1/(1-0.574) = 2.3x'
    output_risk: unverified-within-tolerance
    risk_evidence: distances change at rounding level, but the support is chosen by np.argpartition(dist, h-1), so a near-tie at the h-th distance can select a different subset and move the whole fit (semantic
      in rare cases)
    effort: M
    depends_on: []
  - opportunity_id: cov_prec_robust-2
    opportunity: Run FAST-MCD's independent C-step trials in parallel (3 subsets x 166 random starts, then 30 merged-set refinements at T=1024) with the random permutations pre-drawn from the global RNG
      in the original loop order, so each worker gets exactly the starting subset the serial loop would have drawn; worker BLAS at 1 thread. This cuts per-window wall time only, not core-hours, and competes
      for the same cores with window-level parallelism (xc-window-parallel), which already parallelises the 600 windows.
    opp_type: parallel
    speedup_kind: throughput
    expected_speedup: 3-7x alone (at most ~4x inside a window worker)
    speedup_basis: 'profile:audit/profiles/micro/prof_basic.cov.MinCovDet__118x1024.pstats sklearn/covariance/_robust_covariance.py:_c_step 99.1% (528 calls in 4 select_candidates passes) + complexity:
      trials are independent within a pass; with 8 workers and two sequential passes Amdahl gives ~3x (subset pass only) to ~7x (both passes); per-window latency only, no core-hour saving; an alternative to xc-window-parallel for the same cores, not a factor on top of it, so only xc-blas-threads (worker BLAS at 1 thread) is in depends_on: inside one of the ~8 memory-bounded window workers about 4 physical cores remain, which caps this pool at about 4x'
    output_risk: unverified-bit-identical
    risk_evidence: each _c_step with initial_estimates=None consumes exactly one random_state.permutation at entry and nothing else; fast_mcd draws samples_shuffle and the merge selection outside the trial
      loops. Pre-drawing in loop order keeps the stream; per-worker RNGs would make it rng-stream, and workers with multi-threaded BLAS (joblib's default cpu_count()//n_jobs) could round the pinvh/eigh
      differently (within-tolerance)
    effort: L
    depends_on:
    - xc-blas-threads
