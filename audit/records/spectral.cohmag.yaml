  deviation_from_documented: '(1) Squaring: the code returns |C|^2; the supplement calls the SPI "coherence magnitude" but its text ("frequency domain equivalent of the squared time-domain cross correlation") describes the squared quantity, so the code agrees with the text and not with the plain reading of the name; that supplement sentence itself departs from its cited source [59], which calls the unsquared |C| the coherence coefficient and relates coherence to the (unsquared) cross-correlation function (pack hypothesis refined, see candidates). (2) Frequency grid: documented "125 uniformly sampled bins ... f ∈ [f0, fs/2], f0 = 4/T"; implemented the FFT grid k/n_fft, k = 0..(n_fft+1)//2 - 1 (T=64: 32 bins; T=256: 128 bins, 0..0.49609; T=67: zero-padded n_fft=72, 36 bins), DC (f=0) included in the [0, ...] bands, f0 = 4/T not applied, Nyquist (fs/2) never included for even n_fft. (3) Band edges closed at both ends: the f=0.25 bin (n_fft divisible by 4) belongs to both the low and the high band (probe T=256: low band last bin 0.25, high band first bin 0.25). (4) "undirected" with no mirroring (REVIEW M1; this was the earlier wording of tests/README.md bug 5, whose current item 5 is PLI signed antisymmetry, tests/README.md:206) has no numeric effect here: probe |A - A^T| = 0.0 exactly on every dataset tried. Items (2) and (3) are the shared band-selection rules owned and scored by the spectral.band_selection unit (its deviations (3) and (4)); they are listed here only with this unit''s numbers.'
  deviation_from_canonical: 'Per bin the quantity is the standard multitaper MSC estimator (unweighted average over K=5 DPSS tapers, NW=3, no adaptive weights). Because NW is fixed at 3 for every T, K and hence the estimator degrees of freedom are fixed: the bias does not shrink as T grows (only the bandwidth 2W = 6/T narrows). Probe: iid_gaussian null mean of cohmag_mean_full 0.2295 / 0.1983 / 0.1964 / 0.1994 at T = 64 / 256 / 1024 / 4096 (theory 1/K = 0.2); var2_bivariate full band 0.3648 at T=4096 vs population band mean 0.2465 (Carter bias approx (1-0.2465)^2/5 = 0.114 accounts for it); bivariate_gaussian rho=0.3 pair 0.2647 vs rho^2 = 0.09 at T=4096. The max statistic is the maximum of n_fft/2 noisy estimates and increases with T under the null (0.666 / 0.765 / 0.791 / 0.878). No bias correction. The supplement cites [59] for "coherence coefficient", which Bastos & Schoffelen define as |C| (unsquared); pyspi returns |C|^2.'
  units_and_range: 'Dimensionless, non-negative, nominally [0, 1] (max can exceed 1 by rounding: shared_envelope x0==x2 gives max 1.0000000000000009, mean 1.0). Symmetric exactly (|S_ij| = |S_ji|). NaN on the diagonal; an empty band gives an all-NaN matrix for mean (np.nanmean of an empty axis) and ValueError for max (whole Calculator table NaN).'
  direction_convention: Undirected. A[i,j] = band statistic of |C_ij(f)|^2 with C_ij = S_ij/sqrt(S_ii S_jj), S_ij = mean_k X_i,k(f) conj(X_j,k(f)) (connectivity.py:205-207, 1187-1190, 1485-1487); A[i,j] == A[j,i] exactly in the probe (no mirror needed).
  symmetry_expected: sym
  already_documented: docs/storage_comparison/REVIEW.md M1 (spectral classes bypass Undirected.multivariate; no numeric effect for cohmag; this was the earlier wording of tests/README.md bug 5, whose current item 5 at tests/README.md:206 is PLI signed antisymmetry, see briefing/KNOWN_ISSUES.md item 5); DEPENDENCY_COMPATIBILITY_REVIEW.md:74-82 and tests/README.md dependency constraints (1.1.2 drops the Nyquist bin, 2.x includes it; pinned at 1.1.2); REVIEW M4 notes DC included / Nyquist excluded (for phase); tests/README.md "worth knowing" (first cache insert keyed by measure string -> one redundant recompute).
  new_finding_candidates:
  - 'CANDIDATE (pack hypothesis, refined): "coherence magnitude" is the magnitude SQUARED. connectivity.py:343 "return _squared_magnitude(self.coherency())" and :1184 "xp.abs(x) ** 2"; probe bivariate_gaussian T=4096: pyspi 0.2647 / 0.6715 equals mean|C|^2 0.2647 / 0.6715, while mean|C| is 0.4766 / 0.8109. The supplement sentence "the frequency domain equivalent of the squared time-domain cross correlation [59]" describes the squared quantity, but its cited source does not: Bastos & Schoffelen 2016 write "the coherence is the frequency domain equivalent to the time domain cross-correlation function" (no "squared") and define the coherence coefficient, which the supplement equates with this SPI, as the unsquared |C|. So the code agrees with the supplement sentence but not with the definition in [59] or with the plain reading of the name "magnitude".'
  - 'CANDIDATE: documented frequency grid ("125 uniformly sampled bins", "f0 = 4/T") is not what runs: probe T=256 -> 128 bins from 0.0 to 0.49609375; T=64 -> 32 bins; T=67 -> n_fft 72 (zero padding), 36 bins; DC included whenever fmin=0. (The DC/Nyquist part is already in REVIEW M4 and DEPENDENCY_COMPATIBILITY_REVIEW.md; the 125-bin / f0 = 4/T mismatch is not listed in KNOWN_ISSUES.)'
  - 'CANDIDATE: fixed NW=3 (K=5) makes the band-mean MSC a biased, non-consistent estimator whose null level is about 1/K = 0.2 for every T (probe 0.2295, 0.1983, 0.1964, 0.1994 at T=64..4096) and whose max-statistic null level grows with T (0.666 -> 0.878); var2_bivariate T=4096 0.3648 vs population 0.2465.'
  - 'CANDIDATE: low and high bands share the f = fs/4 bin (closed interval at spectral.py:88; probe T=256 low band [0.0 .. 0.25], high band [0.25 .. 0.49609]); the high band never reaches fs/2.'
  - 'CANDIDATE: empty band behaviour. Probe T=64 with the EEG band fmin=1/2048, fmax=4/2048: statistic mean returns an all-NaN matrix (RuntimeWarning only), statistic max raises "ValueError: zero-size array to reduction operation fmax which has no identity" (Calculator turns it into an all-NaN table).'
  - 'CANDIDATE (hypothesis about the EEG identifiers, assuming fmin/fmax = Hz/2048 as the .3g strings suggest: 0.000488 = 1/2048, 0.00195 = 4/2048, ...): with n_fft = 512 the 1-4 Hz band holds 1 bin and 4-8 / 8-12 Hz hold 2 bins each, while the multitaper half-bandwidth W = 3/n_fft = 0.00586 (12 Hz at 2048 Hz) is wider than these bands, so the narrow-band values are not band-limited; with n_fft = 1024 the counts are 2 / 3 / 3 bins and W = 0.00293.'
