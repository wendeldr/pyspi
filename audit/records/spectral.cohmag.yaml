optimisation:
  complexity_P_T: 'O(K*P*T log T) FFT + O(K*n_fft*P^2) two-sided taper-level CSM materialised as (1,1,5,n_fft,P,P) complex128 (connectivity.py:196-257) + O(n_fft*P^2) normalisation, K=5 tapers, n_fft=T; plus a P-independent DPSS cost (~17-20 ms, pure Python). Measured P exponent 1.00 (fit 8->32) and 2.64 between the 32x1024 and 118x1024 walls, T exponent 0.92: at P<=32 the fixed DPSS cost dominates (dpss_windows 74.0% of the 8x1024 profile), at 118x1024 the P^2 taper-level CSM term dominates (DPSS 1.9%) and the local exponent above 2 reflects GB-sized temporaries (memory-bound), not extra arithmetic.'
  hotspot_1: .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:coherency (third-party:spectral_connectivity) 85.8% of the profiled SPI call at 118x1024 (two _power passes and one taper-level CSM; self time 24.8% is the normalisation and division)
