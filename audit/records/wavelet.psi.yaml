  deviation_from_documented: '(1) Aggregation domain: documented ''mean or max PSI across all time points'' within the low/high/full frequency range; implemented: mean/max of the full-band (0.2-0.5) PSI(t)
    over the time samples whose INDEX equals the index of a wavelet frequency in the requested range: t = 0..9 (full), t = 0,1 (low), t = 2..9 (high); the frequency band never restricts the frequencies
    (all bands use the same 10-frequency PSI). All selected samples lie inside the cone of influence (wavelet half-lengths 27, 23, 20, 18, 16, 15, 13, 12, 11, 11 samples > 9). Probe delayed_noise T=256:
    freqs_computed = [0.2, 0.2333, ..., 0.5]; pyspi A[1,0] = -1.5647 equals mean(psi[1,0,0,:10]) = -1.56467, while the all-time mean is -1.2219. Already documented as ''wavelet PSI axis selection'' (see
    already_documented). (2) Frequency range: documented ranges start at 0 (or fs/4); the computed wavelet grid is linspace(0.2, 0.5, 10), so even indexing the frequency axis the low band would contain only 0.2
    and 0.233, and 0.5 = Nyquist where the wavelet is real. (3) Directed vs output: documented as directed; config.yaml:1238 labels it undirected and the code mirrors lower to upper (wavelet.py:234-235),
    so A is symmetric and A[i,j] = A[j,i] = PSI(seed max(i,j) -> target min(i,j)): the sign encodes a direction relative to channel ORDER, not an undirected strength. (4) ''Unsigned'' keyword/label: the
    output is signed. Probe on delayed_noise T=256 (min, max over the matrix): psi_wavelet_mean_fs-1_fmin-0_fmax-0-5_mean [-1.565, +2.752]; mean low band [-3.757, +5.024]; mean high band [-1.504, +2.338];
    psi_wavelet_max_fs-1_fmin-0_fmax-0-5_max [-0.414, +5.640]; max low band [-3.269, +5.390]; max high band [-0.414, +5.640]. Every variant has negative entries. (5) ''Weighted by the coherence'': with
    one epoch the coherency has unit modulus, so no coherence weighting occurs. (6) Supplement cites MNE v0.23.0; the executed code is mne-connectivity 0.9.0 / mne 1.13.2.'
  deviation_from_canonical: '(a) Coherency is not an expectation: one epoch and no time/frequency smoothing, so |C| = 1 and PSI(t) = sum of sines of adjacent phase-difference increments (probe: mne PSI
    equals sum sin(diff dphi) to 2.2e-15). Canonical PSI requires coherency averaged over segments/trials. (b) No normalisation by the jackknife std (raw Psi_tilde; MNE also returns raw, common practice).
    (c) The adjacent-frequency kernel itself matches Nolte eq. 3 (unlike the multitaper all-pairs variant, REVIEW M5), on a 10-point Morlet grid with step 1/30 and the Nyquist frequency included; the Nyquist
    wavelet is real so its phase difference is 0 or pi and the last increment is not a phase slope. (d) Aggregation over time samples 0..9 at the signal start (zero-padding edge) instead of a time-averaged
    or band-limited quantity; observed effect: sign of pyspi output disagrees with the true lead/lag on delayed_noise and var2_bivariate (see candidates). (e) Canonical PSI is antisymmetric; output is symmetrised.
    (f) max is the signed maximum, not a canonical summary.'
  units_and_range: Dimensionless raw PSI per time point in [-9, 9] (9 adjacent pairs of unit-modulus coherency); mean/max over 2..10 time samples, so the output range is [-9, 9]; signed, can be negative
    (despite 'unsigned' label). NaN if a band selects no sample (T < 25 low band) or for constant input. Symmetric matrix by construction; diagonal NaN.
  direction_convention: 'MNE (docstring effective.py:52-53, and csd = seed * conj(target) at epochs.py:652): PSI for (seed, target) is positive when the seed leads. Seeds are rows of tril_indices (i > j),
    so the raw dense value psi[i, j] (i > j) is positive when the higher-index channel i leads j. pyspi copies it to the upper triangle: A[i,j] = A[j,i] = PSI(max(i,j) -> min(i,j)). Probe (time samples
    30..T-30, delayed_noise where x0 leads x1, x2, x3): psi[i,j] < 0 for every pair at every T (the higher index lags); var2_bivariate (x0 -> x1): psi[1,0] central mean -0.39/-0.39/-0.24/-0.18 at T = 64/256/1024/4096.
    The pyspi output itself (first-10-sample window) does not preserve this sign reliably (see candidates). Confirmed in the check stage for the library step (raw psi[i, j] for i > j is negative on every
    delayed_noise pair, rawpsi runs; the intended smoothed-coherency PSI has the truth sign on 100% of pairs, int runs); see direction_observed for what the stored value carries.'
  symmetry_expected: sym
  already_documented: 'EEG_OPTIMIZATION_NOTES.md §review (line 169 at a42ebc1, ''wavelet PSI axes''; line 168 at a1f20c7 read ''wavelet PSI axis selection''; KNOWN_ISSUES: ''pyspi indexes the time axis of the (N,N,1,T) PSI result with frequency indices'') and
    DEPENDENCY_MIGRATION.md:84-85 (''The PSI wavelet wrapper''s existing selection indexes the last result axis using positions from that frequency vector''). tests/README.md ''Degenerate outputs in the
    extra wavelet set'' (line 217) covers the nine OTHER wavelet classes and states the psi_wavelet SPIs are not degenerate; it does not discuss the unit-modulus single-epoch coherency inside PSI. REVIEW
    M5 (all-pairs PSI) applies to the multitaper spectral PSI, NOT to this unit (MNE uses adjacent pairs). The symmetrisation, the Nyquist frequency and the direction loss are not in the documented list, nor is the undirected/unsigned label of this signed, directed unit (REVIEW M9 and EEG_OPTIMIZATION_NOTES.md §review ''parameter-specific/shared labels'' discuss label structure in general without naming wavelet PSI; REVIEW M5 concerns the multitaper spectral PSI).'
  new_finding_candidates:
  - 'CANDIDATE (new): an antisymmetric directed quantity is mirrored into a symmetric matrix. wavelet.py:234-235 ''ui = np.triu_indices(data.n_processes, 1); adj[ui] = adj.T[ui]'' with MNE computing only
    seeds i > j (epochs.py:276 ''np.tril_indices(n_good_signals, -1)''). Consequences: the label ''undirected'' is produced by discarding the reverse-orientation value (which is exactly -PSI, so no information
    is lost but the sign meaning is tied to channel order), and reversing the channel order flips every entry''s sign. Probe delayed_noise T=256: mean variant max|A(reversed, mapped back) + A| = 2.2e-16;
    max variant A[1,0] = -0.414 vs 2.014 after reversal. Distinct from REVIEW M1 (tests/README.md bug 5 before b2f6d7e), which concerns classes where Undirected.multivariate is bypassed without mirroring.'
  - 'CANDIDATE (new): the pyspi output does not reliably carry the true direction. delayed_noise (x0 leads x1, x2, x3 by 1, 3, 5): central-window psi[i,j] < 0 for all 6 pairs at all T, but pyspi A[3,0]
    = +0.38, +1.67, +1.06, +1.23 at T = 64, 256, 1024, 4096 and A[2,0] = +1.26 at T = 4096. var2_bivariate (x0 -> x1): pyspi A[1,0] = +1.835, -1.588, +0.456, -0.695 at T = 64, 256, 1024, 4096 vs central
    mean -0.39, -0.39, -0.24, -0.18; analytic Nolte eq.3 on S_true gives PSI_01 = +0.489 for band [0.2, 0.5] (x0 leads, i.e. PSI(1->0) < 0). Hypothesis: edge (zero-padding) dominated first-10-sample window.'
  - 'CANDIDATE (new): single-epoch coherency has unit modulus, so the ''weighted by the coherence'' part of the documented definition is absent. Probe: |cohy| in [0.9999999999999997, 1.0000000000000004];
    mne psi[1,0,:] equals sum_k sin(dphi_{k+1} - dphi_k) from the CWT phases to 2.2e-15. Pack hypothesis confirmed (more precisely: sum of sines of adjacent-frequency INCREMENTS of the phase difference).'
  - 'CANDIDATE (new): the top wavelet frequency is the Nyquist frequency 0.5 where the Morlet wavelet exp(i pi t) is real (probe max |Im W(0.5)| = 1.17e-16, max |Im cohy(0.5)| = 7.6e-13), so dphi(0.5) is
    0 or pi (probe: unique values mod pi = {0, 3.141593}); the 9th increment sin(dphi(0.5) - dphi(0.4667)) carries no phase-slope information yet has mean |.| = 0.35 on delayed_noise T=1024.'
  - 'CANDIDATE (new, edge case): for T < 25 the MNE default fmin = 5/T drops wavelet frequencies, shifting freq_id; probe T=20: freqs_computed = [0.267 .. 0.5] (8 values), low band selects nothing -> ''Mean
    of empty slice'', A = NaN; for 25 <= T < 55 MNE warns that wavelets are longer than the signal but still computes. Not reachable with the audit datasets (T >= 64).'
  - 'CANDIDATE (minor): labels contradict the documentation and each other: supplement keywords ''directed ... unsigned'', config.yaml:1238-1239 ''undirected, unsigned'', class labels [''unsigned'',''wavelet'',''undirected''];
    output is signed (negative values in every probe).'
