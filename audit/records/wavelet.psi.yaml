  what_changed: 'Rubric anchor 0 (wrong axis indexed; already documented as the wavelet PSI axis selection, EEG_OPTIMIZATION_NOTES.md §review / KNOWN_ISSUES). All six identifiers store the mean or signed
    max of the same full-band (0.2-0.5, 10 Morlet frequencies) single-epoch PSI(t) over the first 10 (full), 2 (low) or 8 (high) TIME samples, because the frequency indices are applied to the time axis;
    the band never restricts frequencies. On the kernel path and the default (no-detrend) pipeline path the temporal content of input samples t >= 37 cannot reach the stored value (winperm-tail change 0.0; kernel-path tail perturbations <= 1.2e-13); on the default
    pipeline path those samples act only through the per-channel z-score mean (the SD is a positive rescaling that PSI ignores), and a tail offset of +0.5 moves the stored
    values by up to 3.13 because the zero-mean Morlet transform of a constant is not zero inside the zero-padded edge window (tailpert). With detrend (pipeline-detrend) this horizon does not hold: the fitted line is a time-weighted sum of the tail, so the time order of the tail reaches the stored value (wavelet.psi|delayed_noise|1024|pipeline-detrend|tailpert: rescaling x[:, 37:] about its own mean changes it by 0.087; the review probe review_detrend_rev.py shows the same for a time reversal of x[:, 37:]). On top of that: one epoch gives unit-modulus coherency, so PSI(t)
    is a sum of 9 unweighted sines (no coherence weighting, the documented and canonical weighting is absent); the 0.5 wavelet is real, so the last increment is a 0/pi phase; the antisymmetric quantity
    is mirrored into a symmetric matrix whose sign follows channel order; labels say undirected/unsigned for a signed, directed quantity. Consequences measured: sign agreement with the true lead/lag 0.10-0.50
    per identifier while the intended quantity scores 1.0 on the full and high variants and 0.86 on mean-low and max-low (ref_intended_whole_agree over the same 72 dir runs; 0.0 on logistic_maps_chaotic T64, 0.33 on var2_chain T64) and a numpy Welch PSI scores 1.0 (delayed_noise welch runs); null spread constant in T (SD about 1.28) instead of shrinking like the all-time mean (0.32 -> 0.06). The replica reproduces
    the computation to 1e-12, so the code does what the trace says; the stored number does not describe the documented or canonical PSI.'
