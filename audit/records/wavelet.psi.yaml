unit_id: wavelet.psi
status: profiled
correctness:
  metric_name_standard: phase slope index (PSI, Nolte et al. 2008), here a single-epoch, time-resolved Morlet-wavelet variant summarised by mean or max over a set of time samples
  canonical_ref: 'Nolte G, Ziehe A, Nikulin VV, Schloegl A, Kraemer N, Brismar T, Mueller K-R (2008), Robustly estimating the flow direction of information in complex physical systems, Phys. Rev. Lett.
    100, 234101; arXiv:0712.2352. Equation numbers as in the arXiv:0712.2352 text: eq. 3 (raw PSI, Psi_tilde_ij = Im sum_{f in F} C_ij*(f) C_ij(f+delta_f)), eq. 4 (coherency C_ij = S_ij/sqrt(S_ii S_jj)),
    eq. 5 (equivalent weighted sum of sines with weights alpha_ij(f) = |C_ij(f)|, the ''weighted by the coherence'' form), eq. 6 (normalisation Psi = Psi_tilde/std(Psi_tilde), std estimated by the jackknife
    over epochs); direction convention from eq. 2 and the text after it: S_12 = <y1 y2*>, a positive slope means y1 -> y2. Coherency C_ij(f) = S_ij(f)/sqrt(S_ii(f) S_jj(f)) with S an expectation (segment/epoch
    average) of the cross-spectrum (Nolte et al. 2004, Clin. Neurophysiol. 115:2292). Morlet wavelet transform: Grossmann & Morlet 1984; Tallon-Baudry et al. 1997 J. Neurosci. 17:722 (normalisation used
    by MNE). Note that unsmoothed, single-realisation wavelet coherency has unit modulus (Torrence & Webster 1999 J. Climate 12:2679, smoothing required). The Nolte 2008 equation numbers were checked against
    the arXiv:0712.2352 text; the other citation details are from memory and were not checked against copies.'
  canonical_definition: 'Psi_tilde_ij = Im( sum_{f in F} C_ij*(f) C_ij(f + delta_f) ), adjacent frequencies of the analysis grid within band F, C_ij the (expected) coherency; (Nolte eq. 3); normalised Psi
    = Psi_tilde / std(Psi_tilde) with a jackknife std (eq. 6). Antisymmetric: Psi_ji = -Psi_ij. Positive Psi_ij (with S_ij = E[x_i x_j*]) means i leads j (i is the sender). No canonical time-resolved single-trial
    version exists; time-resolved PSI requires coherency estimated across trials/epochs or with smoothing.'
  documented_definition: 'supplement §1.5.4, p.14 (heading at supplement.txt file line 644; the briefing pack numbered it 658): "The phase slope index (PSI) [62] is a directed measure of information flow
    computed using the complex-valued coherency ... evaluates the consistency of the changes in phase differences across a pre-specified frequency range, weighted by the coherence ... The time-frequency
    decomposition is given by a Morlet wavelet, with spectral densities indexed by a time-frequency tuple ... we take the average (denoted by the mean modifier) or the maximum (max) PSI across all time
    points. We use the same pre-specified frequency ranges as outlined at the beginning of this section (i.e., low, high or full)"; keywords "directed, linear/nonlinear, unsigned, bivariate, frequency-dependent
    and time-frequency dependent". Band rule from supplement §1.5, p.12-13 (heading at file line 570, band bullets at lines 595-599; the briefing pack gives §1.5 as lines 582-613): fmin-0_fmax-0-5 = f in
    [0, fs/2], fmin-0_fmax-0-25 = [0, fs/4], fmin-0-25_fmax-0-5 = [fs/4, fs/2], fs = 1. GitBook spectral.md:322-346 (Phase Slope Index) repeats the same text. [62] = Nolte et al. 2008.'
  delegate_lib: mne-connectivity==0.9.0 mne_connectivity.phase_slope_index(mode='cwt_morlet') -> spectral_connectivity_epochs(method='cohy') -> _compute_psi; wavelets and CWT from mne==1.13.2 mne.time_frequency.tfr.morlet
    / cwt; band/time selection, aggregation and mirroring are native pyspi
  implemented_as: 'Input z-scored per channel (ddof=1; optional detrend first). The whole (N,T) dataset is passed as ONE epoch (1,N,T). MNE builds 10 complex Morlet wavelets at f = linspace(0.2, 0.5, 10)
    (step 1/30, n_cycles = 7 default, zero_mean=True, sigma_t = 7/(2 pi f), support +-5 sigma_t, lengths 55..23 samples), computes the CWT by FFT linear convolution with zero padding, mode ''same'' (T samples
    per frequency). For each lower-triangle pair (seed i > target j) the single-epoch coherency C(f,t) = W_i W_j* / (|W_i| |W_j|) has unit modulus, so PSI(t) = Im sum_{k=0..8} C*(f_k,t) C(f_{k+1},t) = sum_k
    sin(dphi(f_{k+1},t) - dphi(f_k,t)) with dphi = phase_i - phase_j: a sum of 9 unweighted adjacent-frequency phase-difference increments, one band (all 10 frequencies), shape (N,N,1,T). The f = 0.5 (Nyquist)
    wavelet is purely real, so dphi(0.5,t) is 0 or pi. pyspi then takes freq = freqs_computed[0] (the 10 wavelet frequencies), freq_id = indices with fmin <= f <= fmax, and indexes the LAST (time) axis
    with these frequency indices: full band -> time samples t = 0..9, low band [0,0.25] -> t = 0,1, high band [0.25,0.5] -> t = 2..9. Statistic = np.nanmean or np.nanmax (signed) over axes (band, selected
    time). Lower triangle copied to upper (symmetric matrix), diagonal NaN. mt_adaptive=True is passed but unused in cwt mode. For T < 25 the default fmin = 5/T drops wavelet frequencies and the index mapping
    shifts (T=20: 8 frequencies, low band empty -> NaN).'
