unit_id: spectral.plv
status: profiled
correctness:
  metric_name_standard: phase locking value (multitaper, taper-averaged), band mean / band max
  canonical_ref: Lachaux, Rodriguez, Martinerie & Varela 1999, Human Brain Mapping 8:194-208 ("Measuring phase synchrony in brain signals"), PLV definition in Methods (equation number not re-checked); multitaper/Fourier formulation reviewed in Bastos & Schoffelen 2016, Front. Syst. Neurosci. 9:175 (supplement ref [59])
  canonical_definition: PLV(f) = | (1/N) sum_{n=1}^{N} exp(i (phi_x,n(f) - phi_y,n(f))) |, the modulus of the mean unit phasor of the relative phase over N trials (independent realisations) at fixed frequency (and latency); range [0, 1]; bias E[PLV] ~ sqrt(pi/(4N)) under independence.
  documented_definition: 'supplement §1.5.6, p.15 (supplement.txt:686-699): "The phase locking value (PLV) [65] is computed using the same formula as coherence, however applied to the amplitude-normalized Fourier transformed signals (i.e., normalized by individual tapers), which is argued to make it a more robust measure of phase synchronization than the coherence measures presented earlier [59]." GitBook spectral.md:297-316 (same wording, identifiers plv_multitaper_{mean,max}_...). Grid/band text: supplement §1.5, pp.12-13 (heading supplement.txt:570; grid text :582-599; the pack line ranges for §1.5.6-1.5.8 are offset, actual headings at :686, :701, :715): "Each measure is based on the cross- and power-spectral densities at a given frequency and sampling rate, which is estimated via the multitaper technique ... We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2], where fs/2 is the Nyquist frequency and f0 = 4/T ... we take the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5: f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]." Same text on GitBook spectral.md:16-20.'
  delegate_lib: spectral_connectivity==1.1.2 Multitaper.fft + Connectivity.phase_locking_value (numpy 2.5.4, scipy.fftpack 1.17.1); band mean/max native pyspi
  implemented_as: 'Whole series (after pyspi preprocessing; dependency subtracts each channel mean) tapered by K=5 DPSS tapers (NW=3), FFT length next_fast_len(T). Per bin f_m = m/n_fft (m = 0..n_fft/2-1, DC included, Nyquist excluded): PLV_ij(f) = | (1/5) sum_k S_ij,k / |S_ij,k| |, S_ij,k = X_i,k conj(X_j,k). Expectation is over the 5 tapers of one window (no trials, no time windows). pyspi then applies np.absolute (redundant, already non-negative) and np.nanmean or np.nanmax over bins with fmin <= f <= fmax. A bin is NaN if any |S_ij,k| = 0 (0/0), dropped by nan-aggregation. Pairwise-separable (probe: P-channel and 2-channel results identical).'
  implementation_trace:
  - 'pyspi/config.yaml:740-767 PhaseLockingValue configs: (fs=1), (fmin=0, fmax=0.25), (fmin=0.25, fmax=0.5), and the same three with statistic=max; labels undirected, linear, unsigned, bivariate, frequency-dependent'
  - 'pyspi/statistics/spectral.py:167-177 PhaseLockingValue(NonparametricSpectralMultivariate, Undirected): identifier "plv", _measure "phase_locking_value", labels ["unsigned", "spectral", "undirected"]'
  - 'pyspi/data.py:184-195 Data preprocessing: optional scipy.signal.detrend(axis=1), then zscore(axis=1, nan_policy="omit", ddof=1) (default normalise=True, detrend=False)'
  - 'pyspi/calculator.py:295-355 Calculator.compute (cited at HEAD a1f20c7): :329 S = spi.multivariate(dataset); :332 np.fill_diagonal(S, nan); :336-337 any exception -> whole SPI table NaN (error recorded :338-339); :354-355 warning'
  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fmax None -> fs/2; statistic "mean" -> np.nanmean, "max" -> np.nanmax; identifier suffix f"_multitaper_{statistic}_fs-{fs}_fmin-{fmin:.3g}_fmax-{fmax:.3g}" with "." -> "-"'
  - 'pyspi/statistics/spectral.py:45-50 key = (self.measure,) for these classes: one cached spectrum per measure, shared by all band/statistic variants on a Data object'
  - 'pyspi/statistics/spectral.py:64-83 _get_cache: z = data.to_numpy(squeeze=True).T (T x P); m = sc.Multitaper(z, sampling_frequency=fs) (all other arguments default); conn = sc.Connectivity.from_multitaper(m); res = getattr(conn, measure)(); freq = conn.frequencies; first insert keyed by the bare string measure at :81 (one redundant recompute, tests/README.md worth knowing)'
  - 'pyspi/statistics/spectral.py:85-91 multivariate (parse_multivariate, pyspi/base.py:51-68): freq_id = np.where((freq >= fmin) * (freq <= fmax)); adj = statfn(res[0, freq_id, :, :], axis=0)'
  - 'pyspi/statistics/spectral.py:101-102 np.fill_diagonal(adj, nan); returned as is. MRO (probe): [cls, NonparametricSpectralMultivariate, NonparametricSpectral, Unsigned, Undirected, Directed, object], so Undirected.multivariate (pyspi/base.py:132-138) is never reached (REVIEW M1; tests/README.md bug 5 before b2f6d7e)'
  - pyspi/_spectral_compat.py:15-28 replaces spectral_connectivity.connectivity.np by a namespace whose in1d maps to np.isin; all other numpy calls unchanged (not on the path of these measures)
  - 'spectral_connectivity==1.1.2 .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-100 Multitaper.__init__ defaults: time_halfbandwidth_product=3, detrend_type="constant", n_tapers=None, n_fft_samples=None, time_window_duration=None (one window = the whole series), is_low_bias=True'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:155-164 n_tapers = floor(2*NW - 1) = 5; :469-543 dpss_windows, :668-673 _get_low_bias_tapers keeps eigenvalues > 0.9 (probe: 5 tapers kept at T = 64, 256, 1024, 4096)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:167-190 n_time_samples_per_window = T; n_fft_samples = scipy.fftpack.next_fast_len(T); frequencies = fftfreq(n_fft, 1/fs)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:238-260 fft(): _sliding_window (single window), detrend(type="constant") (:701-, subtracts each channel mean), _multitaper_fft (:335-354) fft(x * taper, n=n_fft)/fs -> fourier_coefficients (1 window, 1 trial, K=5 tapers, n_fft, P)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:156-172 from_multitaper(expectation_type="trials_tapers"); :45-53 EXPECTATION["trials_tapers"] = mean over axes (1, 2) = 1 trial x 5 tapers; :276-287 n_observations = 5
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:195-208 _cross_spectral_matrix = _complex_inner_product(X[..., None], X[..., None]) (:1187-1190 matmul(a, conj(b).T), :1485-1487) -> S_ij,k = X_i,k * conj(X_j,k)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:210-220 _expectation_cross_spectral_matrix(fcn): blocks None -> mean over tapers of fcn(S)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:73-89 _non_negative_frequencies keeps indices 0..(n_fft+1)//2 - 1 (DC kept, Nyquist dropped for even n_fft); :174-180 frequencies uses the same slice
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:510-516 _phase_locking_value: fcn(x) = x / abs(x) applied to S per taper, then mean over tapers (complex), non-negative frequencies'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:518-539 phase_locking_value returns xp.abs(_phase_locking_value()) (docstring cites Lachaux 1999)
  - 'pyspi/statistics/spectral.py:176-177 statfn = lambda x: myfn(np.absolute(x)) (myfn = nanmean / nanmax)'
  deviation_from_documented: '(1) Frequency grid: documented 125 uniform bins on [f0 = 4/T, fs/2]; implemented n_fft/2 bins (n_fft = next_fast_len(T) = T for the probed powers of two) at f = m/n_fft, m = 0..n_fft/2-1, i.e. DC included, Nyquist excluded, f0 = 0 not 4/T (probe: 32/128/512/2048 bins at T = 64/256/1024/4096, first bin 0.0, last 0.484375 at T=64). Band rule freq >= fmin & freq <= fmax is inclusive at both ends, so the f = 0.25 bin is counted in both the low and the high band whenever 0.25 is a grid point, i.e. when n_fft = scipy.fftpack.next_fast_len(T) is a multiple of 4; this holds for every manifest size (T = 64/256/1024/4096) and for the 512- and 1024-sample EEG windows (probe: low band 17 bins 0..0.25, high band 16 bins 0.25..0.484 at T=64), but not in general (probe grid_tie.py: at T = 30 and 250, n_fft = 30 and 250 has no 0.25 bin and the inclusive low/high counts are 8/7 and 63/62). Taper count: K = 5 tapers pass the eigenvalue > 0.9 filter at every probed T >= 10 (10, 16, 30, 64, 100, 250, 256, 512, 1000, 1024, 4096); at T = 7 and 8 (n_fft = 8) only 4 tapers are kept and n_observations = 4, so every K = 5 statement in this record assumes T >= 10. (2) Otherwise consistent: per-taper amplitude normalisation S/|S| equals normalising each Fourier coefficient before forming the coherence-type ratio. (3) Values are symmetric, so the missing symmetrisation (REVIEW M1; tests/README.md bug 5 before b2f6d7e) has no effect for this unit.'
  deviation_from_canonical: 'Expectation over K=5 tapers of a single window instead of over trials (or time): the sample size behind each per-bin PLV is fixed at 5 regardless of T, so the independence-null level is E|mean of 5 unit phasors| = 0.4016 (Monte Carlo, probe3; asymptotic sqrt(pi/(4K)) = 0.396) at every T (probe iid_gaussian band mean: 0.418, 0.398, 0.395, 0.402 at T = 64, 256, 1024, 4096) and does not shrink with longer data. Taper estimates are only approximately independent (orthogonal DPSS on a locally flat spectrum). Phase is taken per FFT bin of the whole window, not from narrowband-filtered instantaneous phase. The DC bin has a real-valued cross-spectrum (relative phase 0 or pi only; per-bin PLV in {0.2, 0.6, 1.0}; probe delayed_noise T=256 DC PLV[0,1] = 0.6) and enters the fmin=0 bands. Band mean / band max over bins is a pyspi summary with no canonical counterpart; band max is a maximum over n_fft/2 biased estimates.'
  units_and_range: 'dimensionless, in [0, 1], symmetric, non-negative; null (independent) level ~0.40 for the mean variants at every T; max variants under the null grow with the number of bins (probe iid_gaussian upper-triangle mean of plv_max: 0.835, 0.934, 0.951, 0.978 at T = 64, 256, 1024, 4096); identical channels give 1.0 (shared_envelope x2==x0). NaN only if all bins in the band are NaN.'
  direction_convention: 'Undirected. PLV_ij(f) = |E_k exp(i(phi_i - phi_j))| is invariant to conjugation, so A[i,j] = A[j,i] exactly (probe: max |A - A^T| = 0.0 on iid_gaussian at every T and on delayed_noise). The value carries no lead/lag information.'
  symmetry_expected: sym
  already_documented: 'REVIEW M1 (no symmetrisation, no effect here because the measure is symmetric; tests/README.md bug 5 before b2f6d7e); REVIEW M4 and DEPENDENCY_COMPATIBILITY_REVIEW.md (DC bin included, Nyquist excluded for even n_fft); tests/README.md worth knowing (spectral cache first insert keyed by the bare measure). The wavelet PLV degeneracy (tests/README.md flagged: wavelet degenerate) concerns a different class, not this unit.'
  new_finding_candidates:
  - 'CANDIDATE (pack hypothesis confirmed): the PLV expectation domain is the 5 DPSS tapers of a single window (connectivity.py:45-53 EXPECTATION["trials_tapers"] over a (1, 1, 5, n_fft, P) array; probe n_observations = 5 at all T), so the independence-null level is ~0.40 at every T: probe iid_gaussian plv_mean upper-triangle mean 0.4183 / 0.3979 / 0.3946 / 0.4020 at T = 64 / 256 / 1024 / 4096 vs Monte Carlo E|R_5| = 0.4016 and sqrt(pi/(4K)) = 0.3963.'
  - 'CANDIDATE: plv_max under independence approaches 1 as T grows because it is the maximum over n_fft/2 bins of a 5-sample statistic: probe iid_gaussian plv_max upper-triangle mean 0.8346 / 0.9337 / 0.9514 / 0.9779 at T = 64 / 256 / 1024 / 4096 (minimum over pairs 0.62 / 0.89 / 0.92 / 0.96).'
  - 'CANDIDATE: documented grid (125 bins on [4/T, fs/2]) is not what runs: probe nbins 32 / 128 / 512 / 2048 at T = 64 / 256 / 1024 / 4096, first bin f = 0.0; the f = 0.25 bin is inside both fmin-0_fmax-0-25 and fmin-0-25_fmax-0-5 (spectral.py:88 inclusive at both ends).'
  - 'CANDIDATE: the DC bin contributes a non-phase quantity: for real input S_ij,k(0) is real (probe: Im S exactly 0 at DC), so PLV(0) = |mean of +-1| in {0.2, 0.6, 1.0} (probe delayed_noise T=256 PLV[0,1](0) = 0.6000000000000001); it is included in every fmin=0 identifier (1/32 of the full band at T=64).'
  - 'CANDIDATE (no numeric effect): PhaseLockingValue wraps statfn in np.absolute (spectral.py:176-177) although Connectivity.phase_locking_value already returns xp.abs(...) (connectivity.py:539); the hypothesis "plv statfn wraps np.absolute" is confirmed and the wrap is idempotent.'
  - 'CANDIDATE (hypothesis, EEG context): the EEG band identifiers fix the edges in cycles per sample at k/2048 (fs-1_fmin-0-000488_fmax-0-00195 is 1/2048..4/2048, and so on). Sampling rates and window lengths are recorded in the repo: docs/storage_comparison/REVIEW.md:164 (patient 004 at 1024 Hz, 105 and 111 at 2048 Hz, 512 vs 1024 samples per half-second window), REVIEW.md:16 (the same 185 metrics read for all three patients), EEG_OPTIMIZATION_NOTES.md:40 and :414-415 at HEAD a42ebc1 (:246-247 at a1f20c7) (mostly 2048 Hz; two EDFs at 1024 Hz and three at 512 Hz). The same identifier therefore covers 1-4 Hz at 2048 Hz but 0.5-2 Hz at 1024 Hz when each recording is computed at its native rate, as in the historical stored runs (patient 004: 1024 Hz, 512-sample windows, REVIEW.md:164). New runs at HEAD a42ebc1 bring every recording to the configured sampling_rate_hz before windowing, resampling native rates that differ (pyspi/workflow/_prepare.py:104-106), so with the example 2048 Hz (examples/workflow/preflight.yaml:8) the identifier covers 1-4 Hz and windows hold 1024 samples whatever the native rate; nothing in the configuration requires sampling_rate_hz to be 2048 (pyspi/workflow/_config.py:243-248). With the inclusive band rule (probe eeg.py, exact k/2048 edges / .3g-rounded edges as printed in the identifier): at T = 1024 the 1-4 band holds 2/1 bins, 4-8 3/3, 8-12 3/2; at T = 512 (the historical 1024 Hz windows) the 1-4 band holds 1/0 bins, 4-8 2/2, 8-12 2/1, so with the rounded edges the 1-4 identifier would be all-NaN (np.nanmean of an empty slice) for 512-sample windows. The multitaper half-bandwidth W = NW/T = 3/T cycles/sample (6 Hz in both cases) is wider than these bands, so band values would not be band-specific. The exact edges are in the repo (corrected in the check stage): pyspi/workflow/retained185.yaml:338-367 (PhaseLockingValue; the other five classes at :368-517) lists fs = 1 and fmin/fmax = 0.00048828125 ... 0.1220703125, exactly k/2048 for k = 1, 4, 8, 12, 30, 70, 150, 250, and pyspi/workflow/_config.py:230-235 (HEAD a42ebc1; :143-148 at a1f20c7) resolves the retained185 preset to that file (examples/workflow/preflight.yaml: 2048 Hz, 0.5 s windows). With these edges the 1-4 band holds 1 bin at 512 samples, so it is not all-NaN. Caveat: the file header (retained185.yaml:1-5) calls it a reconstruction from the saved-store inventory, so only the historical store confirms the edges of the historical run.'
  - 'CANDIDATE (added in the check stage): when a sinusoid lies exactly on the FFT grid (f0 * n_fft integer, e.g. narrowband_f0-0.25, or 50 Hz line noise at fs = 2048 Hz with 1024-sample windows), the odd DPSS tapers (k = 1, 3) have zero gain at zero frequency offset (sum_t w_k(t) = 0), so at that bin 2 of the 5 ''observations'' carry only noise and per-bin PLV drops from ~1 to 0.42-0.78; neighbouring bins stay ~1.'
