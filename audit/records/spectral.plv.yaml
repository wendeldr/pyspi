optimisation:
  complexity_P_T: 'O(K*P*T log T) FFT + O(K*n_fft*P^2) two-sided taper-level CSM materialised as (1,1,5,n_fft,P,P) complex128 (connectivity.py:196-257) + O(K*n_fft*P^2) elementwise fcn on the per-taper tensor before the taper mean, K=5 tapers, n_fft=T; plus a P-independent DPSS cost (~17-20 ms, pure Python). Measured P exponent 1.03 (fit 8->32) and 3.35 between the 32x1024 and 118x1024 walls, T exponent 1.11: at P<=32 the fixed DPSS cost dominates (dpss_windows 65.9% of the 8x1024 profile), at 118x1024 the P^2 taper-level CSM term dominates (DPSS 0.5%) and the local exponent above 2 reflects GB-sized temporaries (memory-bound), not extra arithmetic.'
  hotspot_1: .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_phase_locking_value.fcn (x/|x| on the (1,1,5,1024,118,118) per-taper tensor; numpy divide/abs hidden in its self time; third-party:spectral_connectivity) 78.5% of the profiled SPI call at 118x1024
  hotspot_2: '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_complex_inner_product 11.0% at 118x1024; at 8x1024 transforms.py:tridisolve (DPSS) 58.1% (audit/profiles/spectral.plv__8x1024.pstats) | opaque_share is the 8x1024 profile-JSON value (audit/profiles/spectral.plv__8x1024__profile.json, builtin tottime over the whole profile); the 118x1024 pstats named in profile_file gives a builtin tottime share of 0.053 of the compute_spi frame (audit/profiles/micro/prof_spectral__index.json). Both are lower bounds: numpy ufunc work sits in the self time of the calling Python frame.'
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.032
  profile_file: audit/profiles/micro/prof_spectral.plv__118x1024.pstats
  eeg_basis: retained-increments
  basis_scope_note: 'Cache key (measure,) (pyspi/statistics/spectral.py:46-50): the 10 untimed EEG bands read the cached array as the timed non-retained bands do (0.014-0.028 s each). The configured sum also holds a
    first-insert duplicate build (8.04 s on the second identifier, spectral.py:81) because plv ran first in its family-warm run; in an EEG run CoherencePhase, the first spectral class in
    pyspi/workflow/retained185.yaml:218, pays that duplicate, so the configured sum (15.92 s per window) overstates plv''s EEG cost by about that build. The retained fmin-0_fmax-0-5
    identifier was timed first in the unit and holds plv''s one build (7.80 s), so tier 0 ranks on that increment (eeg_basis retained-increments). The 10 untimed EEG band reads are
    left out and the basis understates the EEG cost by them (not timed; the unit''s 4 timed reads took 0.014-0.028 s each, 0.083 s together)'
  opportunities:
  - opportunity_id: spectral_csm-1
    opportunity: Form the taper-level products only on the (n_fft+1)//2 non-negative bins (slice the Fourier coefficients before connectivity.py:196-257 instead of dropping the negative bins afterwards), in frequency blocks so the per-taper temporaries stay small; for the linear measures (coherency, icoh, psi, gd) replace the (1,1,5,n_fft,N,N) complex128 tensor and its taper mean by one batched matmul over the taper axis.
    opp_type: algorithmic
    expected_speedup: 1.8-2.5x
    speedup_basis: microbench:audit/profiles/micro/opp_spectral_csm-1.json plv sliced, min of 3 repeats, 2.45x at 118x1024 (ratio of medians 2.88x; baseline walls 1.78/1.78/1.51 s, candidate 0.61-0.62 s) and 1.81x at 32x1024; a Workflow 3 recheck re-run of the same script gave 1.89x min of 3 at 118x1024 (ratio of medians 1.86x; not saved to the JSON). The 1.8-2.5x range is those min-of-3 figures, and its 2.5x upper end is also the challenge re-run's highest paired figure (2.46x below), the rule the four phase-sync units that time this candidate (plv, ppc, wpli, dswpli) share; the 4.14x and 9.64x of earlier single-repeat runs (paired repeats 2.8-9.8x) came from slow memory-bound baselines and are not used + profile:audit/profiles/micro/prof_spectral.plv__118x1024.pstats _phase_locking_value.fcn 78.5%. A Workflow 4c challenge re-run of the sliced candidate (paired, 3 repeats at 118x1024; scratchpad/wf4c_b1spec/paired.py run as paired.py 118x1024 3, which timed plv, ppc, wpli, dswpli and the psi bands in paired repeats in one process; its output paired_118x1024.json is not merged into the JSON and the probe archive keeps scripts only, so the per-repeat figures are quoted here, 2.46x, 2.10x and 1.83x) gave 1.83-2.46x per pair (2.28x min/min, 2.02x median/median) and matched the baseline bit for bit; one of its three pairs (1.83x) sits close to the 1.8x lower bound. The 118x1024 walls behind the ranking basis are single family-warm repeats, and these memory-bound builds vary up to about 6x with the machine's memory state (plv's build was 1.5-1.8 s in this micro-benchmark, 7.80 s in summary.json and 9.0-10.1 s in the challenge re-run), so this row's patient-second saving and its order against compute-bound rows are uncertain by that factor
