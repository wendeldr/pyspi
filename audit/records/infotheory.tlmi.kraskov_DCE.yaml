unit_id: infotheory.tlmi.kraskov_DCE
status: profiled
correctness:
  metric_name_standard: lag-1 time-lagged mutual information I(X_t; Y_{t+1}) in nats, KSG1 (k=4) with Theiler window W_ij
  canonical_ref: 'Lagged (time-delayed) mutual information I(X_t; Y_{t+τ}), as discussed by Schreiber 2000, Phys. Rev. Lett. 85, 461 (supplement [35]) as the conventional predecessor of transfer entropy;
    estimator Kraskov, Stögbauer & Grassberger 2004, Phys. Rev. E 69, 066138, algorithm 1. Theiler window: Theiler 1986, Phys. Rev. A 34, 2427.'
  canonical_definition: 'τ = 1: I(X_t; Y_{t+1}) = ∫∫ p(x_t, y_{t+1}) log[p(x_t, y_{t+1}) / (p(x_t) p(y_{t+1}))], estimated by KSG1 on the N = T − 1 pairs (x_t, y_{t+1}), t = 1..T−1; not symmetric in (X,
    Y). With a Theiler window W, pairs with |t − t''| <= W are excluded from neighbour searches and counts.'
  documented_definition: 'supplement §1.4.4, p.10 (pack lines 477-485): ''Keywords: undirected, nonlinear, unsigned, bivariate, time-dependent. Time-lagged mutual information [35] is an undirected measure
    of the dependence between time series x and a time-lagged instance of the series y. We include statistics for only lag-one mutual information''. GitBook information-theory.md:235-251: keywords ''directed'',
    ''Time-lagged mutual information is a directed measure ...'', lists tlmi_kraskov_NN-4 and tlmi_kraskov_NN-4_DCE. [35] = Schreiber 2000. Estimator text as in supplement §1.4, p.9. DCE text: supplement
    §1.4, p.9-10 (''we set the window as the product of the autocorrelation functions of both time series (a heuristic for the autocorrelation time based on Bartlett''s formula [10, 37])'').'
  delegate_lib: JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt, but its classes contain the NOISE_SEED property that JIDT master added after the v1.6.1 tag;
    build date 2024-04-21 matches master a9b6b3e of 2024-04-20, whose source is cited below) infodynamics.measures.continuous.kraskov.MutualInfoCalculatorMultiVariateKraskov1.computeAverageLocalOfObservations,
    called through jpype 1.7.1 on OpenJDK 21.0.12
  implemented_as: 'Each channel optionally detrended, then z-scored. bivariate(i, j): src = x_i[:-1], targ = x_j[1:] (pyspi slices the arrays itself; JIDT TIME_DIFF stays 0), then the KSG1 MI exactly as
    infotheory.mi.kraskov on N = T − 1 pairs: re-standardisation, 1e-8 jitter (seed 42), k = 4, max-norm, ψ(4) − ⟨ψ(n_x+1)+ψ(n_y+1)⟩ + ψ(T−1). Directed: all ordered pairs computed, no mirror. Before each
    pair DYN_CORR_EXCL = int(2·Σ_{k=0}^{T−1} r_i(k) r_j(k)) computed on the unshifted, preprocessed series (shared cache data.theiler); JIDT excludes |t − t''| <= W; raises (-> NaN) if T − 1 <= 4 + 2W.'
  implementation_trace:
  - pyspi/config.yaml:516-536 TimeLaggedMutualInfo configs (kraskov prop_k 4; kraskov prop_k 4 dyn_corr_excl AUTO)
  - 'pyspi/data.py:184-195 Data.set_data preprocessing: optional scipy.signal.detrend(axis=1), then scipy.stats.zscore(axis=1, ddof=1) when normalise=True (Calculator default normalise=True, detrend=False)'
  - 'pyspi/calculator.py:295-355 Calculator.compute: S = spi.multivariate(dataset); any exception escaping multivariate turns the whole SPI matrix NaN (per-pair JIDT exceptions are caught earlier inside
    bivariate and give a NaN entry)'
  - 'pyspi/base.py:84-94 Directed.multivariate: outer loop j, inner loop i != j, A[i, j] = self.bivariate(data, i=i, j=j) (no mirroring)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: identifier += ''_kraskov_NN-{prop_k}'', labels += [''nonlinear''], ''_DCE'' appended when dyn_corr_excl is truthy'
  - 'pyspi/statistics/infotheory.py:84-93 JIDTBase._setup: setProperty(''k'', ''4''); setProperty(''BIAS_CORRECTION'', ''false'') (not a property of the Kraskov calculators: probe getProperty(''BIAS_CORRECTION'')
    -> None, i.e. ignored); setProperty(''NOISE_SEED'', ''42'')'
  - 'pyspi/statistics/infotheory.py:195-216 JIDTBase._set_theiler_window (dyn_corr_excl=''AUTO''): on the first call for a Data object computes, for every pair _i<_j, theiler[_i,_j] = theiler[_j,_i] = 2
    * np.dot(utils.acf(z[_j]), utils.acf(z[_i])) and caches it as data.theiler; then setProperty(''DYN_CORR_EXCL'', str(int(data.theiler[i, j]))) on the calculator for the current pair'
  - 'pyspi/utils.py:47-60 acf(x): x = scipy.stats.zscore(x) (ddof=0); acf = np.correlate(x, x, ''full''); acf /= acf[T-1]; returns lags 0..T-1 (biased sample ACF, divisor sum x^2 at every lag, no lag truncation)'
  - 'pyspi/statistics/infotheory.py:301-317 TimeLaggedMutualInfo.bivariate: _set_theiler_window(data, i, j) (:303) then the lag-1 slices and KSG1 MI'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/MutualInfoMultiVariateCommon.java#L574-L643 MutualInfoMultiVariateCommon.finaliseAddObservations:
    copies data, computes means and std (MatrixUtils.stdDevs, divisor N-1, MatrixUtils.java#L2490-L2502), normalises each column when NORMALISE=true (default true, :164; MatrixUtils.normalise :2663-2672),
    then adds random.nextGaussian()*noiseLevel to every source then destination entry row by row from java.util.Random seeded with NOISE_SEED (:626-642; NOISE_SEED parsed at :265-271)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L180-L185 constructor:
    addNoise=true, noiseLevel=1e-8; :74 k default 4; :79 normType = NORM_MAX_NORM; :133 numThreads = availableProcessors() (probe: 64 here)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L225-L250 setProperty:
    k, NORM_TYPE, DYN_CORR_EXCL (dynCorrExcl = W > 0), NUM_THREADS; unknown names go to MutualInfoMultiVariateCommon.setProperty (unknown ignored)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L294-L308 finaliseAddObservations:
    throws if totalObservations <= k + 2*DYN_CORR_EXCL; digammaK = digamma(k), digammaN = digamma(totalObservations) (N not reduced for the exclusion window)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L315-L330 computeAverageLocalOfObservations
    -> computeFromObservations :427-526: splits time points over numThreads threads, sums per-thread partial digamma sums, returns digammaK - averageDiGammas + digammaN for algorithm 1 (:518-522)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L715-L738 ensureKdTreesConstructed:
    joint KdTree over (source, dest) and per-marginal NearestNeighbourSearcher (UnivariateNearestNeighbourSearcher for 1-D), all max-norm, carrying observationTimePoints for the exclusion window'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov1.java#L60-L123 partialComputeFromObservations:
    eps_t = distance of the k-th nearest neighbour in the joint space (kdTreeJoint.findKNearestNeighbours(k, t, dynCorrExclTime), :79-83); n_x, n_y = countPointsStrictlyWithinR(t, eps_t, dynCorrExclTime)
    in each marginal (:88-91); sum digamma(n_x+1) + digamma(n_y+1) (:97-99)'
  - 'JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/utils/KdTree.java#L751-L753 findKNearestNeighbours: a candidate is admissible only if it
    comes from another observation set or |timePoint(candidate) - timePoint(sample)| > dynCorrExclTime (so W=0 excludes only the sample itself); https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/utils/UnivariateNearestNeighbourSearcher.java#L497-L530
    countPointsWithinR skips |dt| <= dynCorrExclTime and counts norm < r strictly (allowEqualToR=false)'
  deviation_from_documented: 'As infotheory.tlmi.kraskov (documented ''undirected'', implemented directed) plus the window deviations of infotheory.mi.kraskov_DCE: W = int(Bartlett + 1) over all lags, not
    a product of ACFs, growing ∝ T on oscillatory/trending input. The window is computed from the unshifted series, which is immaterial for a 1-sample lag.'
  deviation_from_canonical: Lag-1 KSG1 with Theiler window as in JIDT (reproduced from scratch, probe p5). ψ(N) not adjusted for the exclusion. Window-size rule is a pyspi heuristic (see infotheory.theiler_window).
    Values rise strongly where W is large (narrowband_f0-0.25 T=64 min over pairs 0.344 -> 1.208, probe p13).
  units_and_range: nats; real, can be negative (iid_gaussian T=64 min -0.054); asymmetric; NaN when T−1 <= 4 + 2W (not reached on the audit datasets)
  direction_convention: 'A[i, j] = I(x_i(t); x_j(t+1)) with window W_ij = W_ji: row = earlier/source channel (same code path as infotheory.tlmi.kraskov); to be confirmed in the check stage'
  symmetry_expected: asym
  already_documented: docs/storage_comparison/REVIEW.md M8 ('tlmi is asymmetric by construction', recorded for tlmi_gaussian; the same lag construction is used here)
  new_finding_candidates:
  - 'CANDIDATE: the Theiler window rule over-estimates Bartlett''s autocorrelation time by 1 and grows ∝ T on oscillatory input (see infotheory.theiler_window; probe p3).'
  - 'CANDIDATE (documentation): supplement §1.4.4 ''undirected'' vs code ''directed'' (as infotheory.tlmi.kraskov).'
  - 'CANDIDATE: the value depends on the machine''s core count at the 1e-14 level, because NUM_THREADS defaults to availableProcessors() (64 here) and per-thread digamma partial sums are added in thread
    order. Probe p2 (bivariate_gaussian T=1024): max |A(default) - A(NUM_THREADS=1)| = 7.1e-15 mi, 1.1e-14 mi_DCE, 1.6e-14 tlmi, 2.4e-15 te_k1, 4.2e-15 te_auto; repeat runs on the same machine are bit-identical.'
  - 'CANDIDATE: on tied or discrete-valued inputs the estimate is set by the 1e-8 jitter and its seed. Probe p12, logistic_maps T=256 (series 1 is the period-4 r=3.5 map, 4 distinct values): pair 1->0 for
    NOISE_SEED 42/43/44 gives mi 0.226622/0.226587/0.230899, tlmi 0.278902/0.276961/0.281417, te_k1 0.115063/0.113329/0.107266, te_auto 0.101410 (l,lt=7,2) / 0.089128 (10,2) / 0.044229 (6,1); bivariate_gaussian
    is identical for all seeds.'
  - 'CANDIDATE (estimator property, not a pyspi bug): labelled ''unsigned'' but KSG estimates are negative on independent data. Probe p13 minima at T=64: mi -0.167 (nonlinear_dependence), tlmi -0.143 (iid_gaussian),
    te_k1 -0.134 (logistic_maps), te_auto_DCE -0.178 (cointegrated); at T=256 iid_gaussian mi min -0.055.'
  - 'CANDIDATE (new, confirmed by probe): a deep copy of this SPI loses NOISE_SEED and prop_k. JIDTBase.__deepcopy__ (infotheory.py:77-82) deep-copies the JPype calculator, which yields a fresh Java object
    with JIDT constructor defaults (NOISE_SEED ''NONE'', k 4). CalculatorFrame.init_from_list deep-copies the base Calculator (calculator.py:556-563, deepcopy at :559), so CalculatorFrame runs this SPI
    with unseeded jitter. On tie-free data the value is unchanged (var2_bivariate T=256 diff 0.0, probe scratchpad it_kraskov_fix/p_te_copy.py). On tied input it is not reproducible: logistic_maps T=256
    pair 1->0 (channel 1 has 4 distinct values) tlmi_DCE 0.650270 on every run, three deep copies 0.648670/0.645450/0.650404 (probe scratchpad it_kraskov_fix/p_tied_dce.py). The k reset is harmless at NN-4
    but changes any NN-k with k != 4: mi_kraskov_NN-6 on bivariate_gaussian T=256 (0,1) 0.039668 -> 0.028352 after deepcopy (probe scratchpad it_kraskov_fix/r4_deepcopy.py). Pickle (JIDTBase.__setstate__
    via _getcalc/_setup) keeps NOISE_SEED and prop_k and reproduces the original.'
