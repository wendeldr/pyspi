    per pair, the nearest alternative deterministic case still differs from pyspi by at least 8.1e-7 relative (restricted constant, iid_gaussian T1024) and
    3.7e-6 (no deterministic terms, cointegrated T4096) in the trace statistic (wf4b-2 scratch probe wf4b2_high-optimiser-other/p_coint.py, own RRR, no statsmodels),
