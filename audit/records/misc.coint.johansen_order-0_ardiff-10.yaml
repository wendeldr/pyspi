  complexity_P_T: 'O(P^2 (k^2 T + k^3)) with k = 10: one statsmodels coint_johansen per unordered pair (pyspi/statistics/misc.py:62-97 caches (i, j) and (j, i); the trace_stat identifier is then a cache hit, 0.008 s at 118x1024), residualising differences and lagged levels on 20 lagged differences plus det_order=0 terms by OLS over about T rows. Measured P_exponent 2.06, T_exponent 0.32: per-call statsmodels overhead still dominates at T=1024. Pair term dominates; measured 11.0 s per window at 118x1024 (family-warm, measured).'
