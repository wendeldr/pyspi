    ecdet=''none''), fp-exact against the textbook RRR, the kernel and R urca. Score mapping: the numeric half of anchor 10 is met (fp-exact against the textbook
    RRR case 3 and R urca, both independent of statsmodels, max_rel 2.0e-12 and 3.5e-12), and its second half, ''matches the pyspi supplement description'',
    fails: the supplement calls the outputs the ''maximum eigenvalue'' and ''trace'' of the VECM and the parameter ''autoregressive lags'', and its citation
    [81] is Pesaran & Shin (ARDL). These are naming and description errors, not one of anchor 9''s trivial value conventions; 9 is the nearest-anchor reading (README "Score columns: original, rubric reading, adjusted") for ''canonical
    computation reproduced, supplement wrong'', applied the same way to misc.gpfit.DotProduct and distance.hhg. The own kernel (_kernels_basic_misc.johansen,
