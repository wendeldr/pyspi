unit_id: infotheory.est.kernel
status: profiled
correctness:
  metric_name_standard: Box-kernel (fixed-radius, max-norm, 'step kernel') resubstitution density estimator used for differential entropy, MI and TE (JIDT kernel package), results in bits
  canonical_ref: Kantz H, Schreiber T (1997) Nonlinear Time Series Analysis, CUP (correlation sum / box kernel p_r(x) = (1/N) sum_n Theta(r - ||x - x_n||_max)); Schreiber T (2000) PRL 85:461 (kernel TE);
    Ahmad IA, Lin P-E (1976) IEEE Trans IT 22:372 (resubstitution entropy estimator); Beirlant J, Dudewicz EJ, Gyorfi L, van der Meulen EC (1997) Int J Math Stat Sci 6:17 (review); Lizier JT (2014) Front
    Robot AI 1:11 (JIDT)
  canonical_definition: 'p_hat(x_b) = C_b / (N * prod_d 2 r_d), C_b = #{t : |x_td - x_bd| <= r_d for all d}; H_hat = -(1/N) sum_b log p_hat(x_b); MI/TE as averages of log ratios of such densities (volumes
    cancel)'
  documented_definition: 'supplement §1.4, p.9 (supplement.txt:405-443; pack lines 414-453): ''Kernel estimation (kernel) uses a box kernel method with a specific kernel width (default width of 0.5 standard deviations (denoted
    by the modifier W-0.5))''; GitBook information-theory.md:14 same sentence; supplement §1.4 also states ''We primarily use v1.5 of the Java Information Dynamics Toolkit [32]'' while GitBook information-theory.md:11
    says v1.6.1. DCE (Theiler window) is documented for KSG only.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar, labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt but built from post-1.6.1 master: all entries are dated 2024-04-21 (unzip -l), the jar contains
    EntropyCalculatorMultiVariateCommon.class, which does not exist at the v1.6.1 tag, and the runtime superclass of EntropyCalculatorMultiVariateKernel is EntropyCalculatorMultiVariateCommon with NOISE_SEED
    stored (probe it_kernel_fix/p2_props.py); this matches master commit a9b6b3e of 2024-04-20 (''Adding property to set random seed for noise addition to EntropyMultiVariate estimators''), the same provenance
    as infotheory.est.ksg1. Of the kernel-path sources, EntropyCalculatorMultiVariateKernel.java and MutualInfoMultiVariateCommon.java differ from the v1.6.1 tag, while KernelEstimatorMultiVariate, MutualInfoCalculatorMultiVariateKernel,
    TransferEntropyCalculatorKernel, KernelEstimatorTransferEntropy, TransferEntropyCommon and MatrixUtils are byte-identical. Called via JPype 1.7.1: kernel.EntropyCalculatorMultiVariateKernel, kernel.MutualInfoCalculatorMultiVariateKernel,
    kernel.TransferEntropyCalculatorKernel, kernel.KernelEstimatorMultiVariate, kernel.KernelEstimatorTransferEntropy'
  implemented_as: 'Preprocessing: Calculator z-scores every series (ddof=1). pyspi passes KERNEL_WIDTH = str(kernel_width) (0.5 for je/ce/cce/xme/di/si, 0.25 for mi/tlmi/te via config); JIDT keeps NORMALISE=true,
    so per dimension the half-width is w_d = width * sampleSD(column passed to JIDT) (n-1 divisor), recomputed for every sub-array (lagged/embedded columns are not exactly unit-SD). Counting: closed box
    (a point is excluded only if |dx_d| > w_d), max norm, the query point counts itself, no Theiler window (pyspi never sets DYN_CORR_EXCL for kernel), no added noise, no bias correction (no kernel class
    has a bias-correction property; TransferEntropyCalculatorKernel.computeAverageLocalOfObservationsWithCorrection L338 at the JIDT v1.6.1 tag (byte-identical at a9b6b3e), a Grassberger digamma variant, is never called by pyspi). Bins of width w_d with
    +-1 neighbour search, hash bins, or all-pairs comparison give identical integer counts. Entropy = -mean log2(C/(N*prod 2w_d)); MI = mean log2(N C_xy/(C_x C_y)); TE = mean log2((C_nps/C_ps)/(C_np/C_p)).
    pyspi''s BIAS_CORRECTION=''false'' is not a property of any kernel class and is ignored. NOISE_SEED=''42'' is stored by EntropyCalculatorMultiVariateKernel (via EntropyCalculatorMultiVariateCommon)
    and by MutualInfoCalculatorMultiVariateKernel (via MutualInfoMultiVariateCommon), but noise is added only when NOISE_LEVEL_TO_ADD is non-zero and pyspi leaves it at the default 0, so the seed has no
    numerical effect; TransferEntropyCalculatorKernel ignores NOISE_SEED. Copy path: JIDTBase.__deepcopy__ resets the JIDT calculators to their defaults (KERNEL_WIDTH 0.25), so a CalculatorFrame computes
    every W-0.5 kernel SPI at width 0.25 under its W-0.5 identifier; the W-0.25 SPIs are unchanged only because 0.25 is JIDT''s default. Caches on the Data object: data.entropy and data.joint_entropy keyed
    by (''kernel'', width) shared by je/ce; data.causal_entropy keyed by (''kernel'', width, n) shared by cce/di.'
