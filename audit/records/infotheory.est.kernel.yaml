  deviation_from_documented: '''Width 0.5 standard deviations'' is the half-width of a closed box (full side 1 SD). JIDT version: supplement says v1.5, the GitBook and the jar label (version-1.6.1.txt)
    v1.6.1, and the jar contents are post-1.6.1 master a9b6b3e. Otherwise as documented.'
  deviation_from_canonical: 'Matches the Kantz-Schreiber box kernel with r_d = width * sample SD and resubstitution (self-inclusive) counts. Not included: leave-one-out, Theiler window, bias correction
    (Grassberger digamma variant exists in JIDT TE for testing only). Consequences: positive small-sample bias for MI/TE/SI under independence and saturation of counts (C = 1) in >= 6 dimensions at W-0.5
    for T <= 4096 (cce/di/xme_k10).'
  units_and_range: bits throughout (ln / ln 2). Entropies with W-0.5 on unit-SD columns have box volume 1 and lie in [0, log2 N]; MI/TE are averages of log count ratios (finite because self-inclusion makes
    every count >= 1).
  direction_convention: n/a (estimator); SPI-level conventions in each unit record. The estimator is invariant to the order of columns (max-norm counts), which makes je/mi/si exactly symmetric.
  symmetry_expected: n/a
  already_documented: 'no'
