optimisation:
  complexity_P_T: 'O(P^2 * 2 * 19 * (T k^2 + k^3)): inside every TransferEntropy.bivariate call (infotheory.py:376-389) JIDT''s MAX_CORR_AIS searches 19 (k, tau) candidates (k 1..10, tau 1..2, tau skipped
    at k=1) for the target and again for the source, then computes the TE. Measured fresh P exponent 2.21, T exponent 0.80; 12.5 ms per ordered pair at 8x1024 against 0.26 ms for the fixed k=1 TE. At 118x1024
    the pair term dominates: 209 s projected (extrapolated-pairs-from-32).'
  hotspot_1: 'pyspi/statistics/infotheory.py:TransferEntropy.bivariate (third-party:jidt: AIS search + TE in one Java call, self time) 99.9% cum / 99.6% self of the profiled SPI call at 8x1024'
  hotspot_2: 'no other frame above 0.1%; the split between search and TE is inside Java and invisible to cProfile. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries,
    so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.002
