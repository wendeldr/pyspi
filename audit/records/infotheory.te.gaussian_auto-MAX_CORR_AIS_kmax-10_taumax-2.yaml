  - 'CANDIDATE (estimator behaviour): MAX_CORR_AIS selection is unstable because penalised AIS curves are nearly flat. Probe var2_bivariate_T1024 source x0 (a true AR(2)): penalised AIS for k=2..10 (tau=1)
    ranged 0.11649..0.11801 and k=9 was selected; delayed_noise_T256: white-noise x0 was given k=7, and x1/x2 (white noise copies) k=10. Different pairs therefore mix very different model orders.'
  - 'CANDIDATE (efficiency, value-neutral): the target and source AIS searches (19 MI fits each) are recomputed inside every bivariate call (TransferEntropyCalculatorViaCondMutualInfo.java:865-869 at JIDT a9b6b3e, via finaliseAddObservations),
    i.e. 2*P*(P-1) searches where P are sufficient; results are deterministic, so caching per process would be bit-identical.'
