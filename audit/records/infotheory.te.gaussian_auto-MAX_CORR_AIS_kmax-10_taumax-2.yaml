unit_id: infotheory.te.gaussian_auto-MAX_CORR_AIS_kmax-10_taumax-2
status: profiled
correctness:
  metric_name_standard: Gaussian transfer entropy (half Geweke GC) with target and source embeddings selected by JIDT's MAX_CORR_AIS rule
  canonical_ref: 'Geweke J. 1982, J Am Stat Assoc 77:304-313, eq. (2.3)-(2.4) F_{X->Y} = ln(var(e_restricted)/var(e_full)); Barnett L., Barrett A.B. & Seth A.K. 2009, Phys Rev Lett 103:238701 (F_{X->Y}
    = 2 TE_{X->Y} for Gaussian variables); Schreiber T. 2000, Phys Rev Lett 85:461, eq. (4); embedding selection: Lizier J.T. 2014, Front Robot AI 1:11 (JIDT) and JIDT javadoc ActiveInfoStorageCalculatorViaMutualInfo.AUTO_EMBED_METHOD_MAX_CORR_AIS
    (''maximise bias-corrected AIS'')'
  canonical_definition: TE_{X->Y} = I(X^{(l,lt)}_t; Y_{t+1} | Y^{(k,kt)}_t) = 0.5*ln(RSS_r/RSS_f) with (k,kt) = argmax over k<=10, kt<=2 of [I(Y^{(k,kt)}_t; Y_{t+1}) - k/(2N_{k,kt})], where N_{k,kt} = T
    - (k-1)*kt - 1 is that candidate's own sample count (ActiveInfoStorageCalculatorViaMutualInfo.java a9b6b3e :440-451; the chi-square mean uses the MI calculator's observation count), so candidates with
    different k are penalised on different N, on the target and (l,lt) chosen the same way on the source's own AIS
  documented_definition: 'supplement §1.4.6, p.11 (supplement.txt:500-511): ''Granger causality [40] is obtained by assessing directed dependence of x -> y as the predictive power of a bivariate autoregressive
    model (comprising x and y) over the univariate autoregressive model (with y only). The statistic included in our framework is the log-ratio of residual variance for the two models, which is a variant
    of Granger causality popularized by Geweke [41] later found to be equivalent to transfer entropy with a Gaussian estimator [38]''; keywords ''directed, linear, unsigned, bivariate, time-dependent''.
    GitBook information-theory.md:90-107 same text. Supplement §1.4.5, p.10-11 (supplement.txt:476-493) defines k, kt (target) and l, lt (source). For the optimised variant: supplement §1.4.5, p.11 (supplement.txt:487-491):
    ''The optimized parameters are inferred by choosing the embedding parameters (up to a maximum embedding length of 10, denoted by k-max-10, and maximum time delay of 2, tau-max-2) that maximize a univariate
    information-theoretic measure known as active information storage (see the MAX_CORR_AIS method of [32] for details)''.'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.TransferEntropyCalculatorGaussian with AUTO_EMBED_METHOD=MAX_CORR_AIS (auto-embedding via gaussian.ActiveInfoStorageCalculatorGaussian)
  implemented_as: 'For each ordered pair (i=source, j=target) on z-scored data, JIDT first runs MAX_CORR_AIS on the target alone: for k = 1..10 and tau = 1..2 (tau skipped when k = 1) it computes the Gaussian
    MI between the k-dim delay vector (spacing tau) and the next sample, N = T-(k-1)tau-1, subtracts the analytic chi-square null mean k/(2N), and keeps the argmax -> (k, k_tau); the same search on the
    source alone gives (l, l_tau). It then computes Gaussian TE with those embeddings and delay 1 (start = max((k-1)k_tau, (l-1)l_tau)). The search is repeated for every ordered pair. No bias correction
    of the final TE. Probe var2_bivariate_T1024: selected k=2, k_tau=1 for target x1 and l=9, l_tau=1 for source x0.'
