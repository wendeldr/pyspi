  deviation_from_documented: 'Embedding search matches the documented MAX_CORR_AIS description (k-max-10, tau-max-2). Same factor-1/2 issue as the fixed-lag unit (value is TE = F/2, not the log-ratio F).
    Not stated in the docs: the source embedding (l, lt) is chosen from the source''s own AIS, not from TE, and the search is repeated per ordered pair so different pairs use different model orders.'
  deviation_from_canonical: 'As Gaussian TE given the chosen embeddings: none (probe: from-scratch numpy re-implementation of the AIS search and TE reproduced the selected parameters for every ordered pair
    and the values to <= 6e-14 on var2_bivariate T=64/1024 and delayed_noise T=256). The selection rule is JIDT-specific (AIC-like penalty k/(2N)), not a standard Geweke model-order criterion; source order
    chosen by source predictability rather than by the bivariate model.'
  units_and_range: nats; [0, +inf); asymmetric; scale invariant
  direction_convention: 'A[i,j] = TE(x_i -> x_j) with embeddings selected per pair. Probe var2_bivariate_T1024: A[0,1]=0.1631 > A[1,0]=0.0011'
  symmetry_expected: asym
