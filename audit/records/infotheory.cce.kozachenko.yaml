unit_id: infotheory.cce.kozachenko
status: profiled
correctness:
  metric_name_standard: Causally conditioned entropy H(Y^n || X^n) (Kramer), block length n=5, of target j given source i, with stationary sliding-window Kozachenko-Leonenko estimates
  canonical_ref: 'Kramer G (1998) Directed Information for Channels with Feedback, PhD thesis, ETH Zurich (Diss. ETH No. 12656), causal conditioning: H(Y^N || X^N) = sum_{n=1}^N H(Y_n | Y^{n-1}, X^n); Massey
    JL (1990) "Causality, feedback and directed information", Proc. ISITA; Amblard P-O, Michel OJJ (2011) J Comput Neurosci 30:7-16. Estimator Kozachenko & Leonenko (1987); Kraskov et al. (2004) Eq. (20).'
  canonical_definition: H(Y^n || X^n) = sum_{i=1}^{n} H(Y_i | Y_1..Y_{i-1}, X_1..X_i). The source enters up to and including the current time (no lag). For a jointly stationary pair, term i equals H(y_t
    | y_{t-i+1..t-1}, x_{t-i+1..t}).
  documented_definition: 'Supplement §1.4.7, p.11 (supplement.txt:513; the pack lists 524): "aims to measure the uncertainty remaining in time series y in the context of the entire (causal) past of both
    time series x and y ... computed as a sum of conditional entropies (of y given both the past of x and the past of y) with increasing history lengths ... for computational reasons, we restrict the history
    length to 10. This corresponds to the assumption that the joint process is, at maximum, a 10th-order Markov chain"; keywords "directed, nonlinear, unsigned, bivariate, time-dependent"; SPI 83 cce_kozachenko.
    GitBook information-theory.md lines 24-40 (same text, ''restrict the history length to 10'').'
  delegate_lib: 'JIDT jar (labelled 1.6.1, post-tag build matching commit a9b6b3e77c): infodynamics.utils.MatrixUtils.makeDelayEmbeddingVector and EntropyCalculatorMultiVariateKozachenko.computeAverageLocalOfObservations
    (d up to 10)'
  implemented_as: 'n = 5 (CausalEntropy.__init__ default; config.yaml:425-437 passes only ''estimator''). With src = z_i, targ = z_j (z-scored, ddof=1): for i = 1..5, Yp = makeDelayEmbeddingVector(targ,
    i-1)[:-1] (rows [y_{t-1}, ..., y_{t-i+1}]; for i=1 a (T+1)x0 array cut to Tx0), Xp = makeDelayEmbeddingVector(src, i) (rows [x_t, ..., x_{t-i+1}]), Yf = targ[i-1:]. Term_i = H_KL([Yf, Yp, Xp]) - H_KL([Yp,
    Xp]), over T-i+1 rows in dimensions 2i and 2i-1. The result is sum_i Term_i (a block quantity, not a rate). Cached in data.causal_entropy[(estimator, n)] and shared with di_kozachenko.'
  implementation_trace:
  - 'pyspi/calculator.py:277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (normalise=True default, :50); pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset);
    pyspi/calculator.py:332 np.fill_diagonal(S, np.nan) (HEAD lines)'
  - 'pyspi/base.py:85-94 Directed.multivariate: A[i,j] = bivariate(data, i=i, j=j)'
  - pyspi/statistics/infotheory.py:429-437 CausalEntropy(n=5) default; pyspi/config.yaml:425-437 configs set only estimator
  - 'pyspi/statistics/infotheory.py:459-474 bivariate: z = data.to_numpy(squeeze=True); _compute_causal_entropy(z[i], z[j]) cached by key (estimator, n)'
  - 'pyspi/statistics/infotheory.py:439-454 _compute_causal_entropy loop i=1..n: Yp (448), Xp (449), XYp (450), Yf (452), conditional entropy (453)'
  - pyspi/statistics/infotheory.py:180-193 _compute_conditional_entropy(Yf, XYp) = H([Yf, XYp]) - H(XYp)
  - 'JIDT v1.6.1 https://raw.githubusercontent.com/jlizier/jidt/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java:2084-2092 makeDelayEmbeddingVector(double[], k) -> (data, k, k-1, T-k+1); :2140-2158
    row t holds data[t - i], i=0..k-1 (most recent first); k=0 gives (T+1) x 0 (probe3: shape (7,0) for T=6)'
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/kozachenko/EntropyCalculatorMultiVariateKozachenko.java:82-115; EntropyCalculatorMultiVariateCommon.java:179-212
  - JIDT v1.6.1 java/source/infodynamics/utils/EuclideanUtils.java:30,69-75,85-110 (naive path for > 2000 rows)
  deviation_from_documented: '(1) History length: documented 10 (supplement §1.4.7, GitBook line 32), implemented n=5 (infotheory.py:435; probe1 prints n=5 for cce_kozachenko). (2) Label ''linear'' (infotheory.py:53-54)
    vs documented ''nonlinear''. Otherwise the prose matches (sum of conditional entropies of y given the past of y and the past-and-present of x, increasing history lengths).'
  deviation_from_canonical: 'The composition matches Kramer''s causal conditioning truncated at block length 5 under stationarity: a from-scratch reimplementation with cKDTree KL reproduces A[0,1] and A[1,0]
    to <= 7.1e-15 with noise off (probe3; var2_bivariate and iid_gaussian T=256). Estimator-level issues: (a) the sum of 10 differences of separate KL estimates in dimensions up to 10 does not cancel biases;
    (b) for T > 2004 (every term has > 2000 rows) the JIDT naive-distance defect collapses the value. Probe6 at T=4096: var2_bivariate 4.379 vs reference 6.218; iid_gaussian 4.484 vs 7.078. At T=1024 they
    agree (6.212 vs 6.212). (c) No Theiler window although the samples are serially dependent.'
  units_and_range: Nats; real, unbounded, can be negative (differential). For unit-variance white noise the population value is 5 * 0.5 log(2 pi e) = 7.09 (iid_gaussian T=256 estimate 7.19, probe3). Grows
    linearly with n (a block entropy, not a rate). Labelled 'unsigned'. Asymmetric.
  direction_convention: 'A[i,j] = H(Y^5 || X^5) with source X = process i and target Y = process j (infotheory.py:472 _compute_causal_entropy(z[i], z[j]), signature (src, targ)). Lower values mean the source
    reduces more of the target''s uncertainty. var2_bivariate (x0 -> x1) T=1024: A[0,1]=6.212 < A[1,0]=6.710 (probe7).'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (documentation vs code): history length is 5, not the documented 10. infotheory.py:435 ''def __init__(self, n=5, **kwargs)''; config.yaml:434-437 gives only ''estimator''; probe1 shows n=5.
    Supplement §1.4.7 and GitBook say 10.'
  - 'Candidate (third-party defect inherited, large effect): for T >= 2005 every term exceeds 2000 rows, so JIDT uses EuclideanUtils.computeMinEuclideanDistancesNaive, which underestimates NN distances
    for d >= 3. cce_kozachenko then drops by ~1.8-2.6 nats. Probe6, T=4096: var2_bivariate 4.379 vs reference 6.218, iid_gaussian 4.484 vs 7.078. T=1024 agrees exactly with noise off.'
  - 'Candidate (label): ''linear'' label for the nonparametric KL variant (probe1).'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
