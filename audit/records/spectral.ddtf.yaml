  what_changed: 'The delegate computes |ffDTF| x |PDC| instead of the dDTF of Korzeniewska et al. 2003 (ffDTF^2 x squared partial coherence): PDC replaces the partial coherence and moduli replace squares.
    Upstream master (138f3f7f0f, unreleased) now computes ffDTF^2 x partial coherence^2; v2.0.1 still has the 1.1.2 formula. In the bivariate setting nothing is conditioned out (the value is |ffDTF_ij|
    sqrt(DTF_ij); a canonical 2-channel dDTF would use the ordinary coherence), so on var2_chain the indirect 0 -> 2 gets 0.0091 where the conditioned value is 0. Values depend on the series length: the full-frequency normalisation runs over every
    non-negative bin, so the library value scales as (T/2)^-1/2. Canonical ffDTF on a T-dependent grid has the same property (the Korzeniewska form scales as T^-1 on the same exact spectrum, ddtfscale
    slopes -1.007/-1.002/-1.000), so only the exponent and the normalisation of the half-band identifiers by full-band energy are library-specific. Rubric anchor 3 (dDTF bivariate: the label does not describe the computation). Anchor 2 was checked and is not supported: in 3961 random stable 2-channel VAR(1) systems with unequal innovation variances, the band-mean sign of A - A.T from the library formula never differed from the canonical 2-channel dDTF (ffDTF^2 x coherence^2) on the exact spectrum (scratchpad wf4b_low-spectral/probe_ddtf_sign.py, numpy only; re-run in Workflow 4b-2, flips 0/3961).'
