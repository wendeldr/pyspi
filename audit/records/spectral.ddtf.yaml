unit_id: spectral.ddtf
status: profiled
correctness:
  metric_name_standard: Direct directed transfer function (dDTF), band mean / band max, bivariate nonparametric estimate
  canonical_ref: Korzeniewska A, Manczak M, Kaminski M, Blinowska KJ, Kasicki S (2003) Determination of information flow direction among brain structures by a modified directed transfer function (dDTF)
    method. J Neurosci Methods 125:195-207 (the PDF was not opened, so no equation numbers are given. The canonical form below, chi^2_ij = ffDTF^2_ij x kappa^2_ij with ffDTF^2 normalised over frequencies and inflows and kappa the partial coherence from the inverse spectral matrix, was checked against the docstring and code of direct_directed_transfer_function in upstream spectral_connectivity master 138f3f7f0f (unreleased), which cites this paper; that docstring also notes that SCoT and ConnectiviPy report the square root |ffDTF| |kappa|)
  canonical_definition: full-frequency DTF F^2_ij(f) = |H_ij(f)|^2 / sum_f sum_m |H_im(f)|^2 (sum over the analysed frequency range); partial coherence C_ij(f) = M_ij(f) / sqrt(M_ii(f) M_jj(f)) from the
    minors (equivalently the inverse) of the full multivariate spectral matrix; dDTF chi^2_ij(f) = F^2_ij(f) C^2_ij(f), flow j -> i, nonzero only for direct coupling
  documented_definition: 'supplement §1.5.9, p.16 (line 757-759): ''we include direct-DTF (ddtf) [70], which extends DTF by conditioning out the influence of other signals (using the partialized cross-spectrum)'';
    same text GitBook spectral.md:107. Band rule, supplement §1.5, p.12-13 (supplement.txt lines 570-599 in this checkout; the pack''s line numbers are offset by about 12-16): ''We use 125 uniformly sampled
    bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T'' and bands ''fmin-0_fmax-0-5: f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]'', summary
    = mean or max over the band. Directed measures ''are nonparametrically estimated through spectral matrix factorization [57, 58]'' (§1.5, p.12). Row/column meaning of the MPI: GitBook glossary-of-terms.md:27
    ''The rows in this table reflect the sources while the columns reflect the targets''. Section keywords for dtf/ddtf (supplement.txt:753): ''directed, linear, unsigned, bivariate, frequency-dependent''.'
  delegate_lib: spectral_connectivity==1.1.2 Connectivity.direct_directed_transfer_function (numpy 2.5.4, scipy 1.17.1)
  implemented_as: 'Same per-pair multitaper + Wilson pipeline; ffDTF = H / sqrt(sum over columns AND over all T/2 non-negative frequency bins of |H|^2) (modulus); value = |ffDTF| * sqrt(PDC^2) = |ffDTF_ij|
    * |PDC_ij| (product of MODULI, PDC in place of partial coherence). Kernel probe p2_kernel.py: library equals |F_ij| |pi_ij| to 6.2e-17 and differs from Korzeniewska F^2 C^2 by up to 0.048. The ffDTF
    normalisation is over the whole grid regardless of fmin/fmax, so values scale like 1/sqrt(T/2) (the canonical squared form on the same grid scales like 1/(T/2), see deviation (d)). A[i, j] = nanmean/nanmax of L[f, 0, 1] over fmin < f < fmax.'
