    * sqrt(self.partial_directed_coherence(keep_cupy=True)) (2 + 2 = 4 Wilson runs)'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:1222-1231 _total_inflow with axis=(-1, -3): sum over source columns and over the frequency axis (non-negative bins only, since
    _transfer_function is already trimmed)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:807-843 partial_directed_coherence (squared PDC; its sqrt gives |PDC|)
  deviation_from_documented: '(i) Direction: documented ''from x -> y'' with rows = sources; implemented A[i, j] = flow x_j -> x_i (row = target), probe p3_pipeline.py var2_bivariate A[1,0] = 0.0055 > A[0,1]
    = 0.0025 for x0 -> x1. (ii) ''nonparametrically estimated through spectral matrix factorization'' holds, but each ordered pair is factorised on its own 2-channel spectrum (bivariate, unconditioned on
    the other P-2 channels); the section keyword ''bivariate'' (supplement.txt:753) documents the pairwise fit, but the ddtf sentence promises conditioning on other signals, which a 2-channel fit cannot provide (rubric anchor 3 example ''dDTF bivariate''). (iii) Band rule: documented 125 bins from f0 = 4/T with closed bands; implemented: the multitaper grid k/n_fft (n_fft = T for power-of-two T, so T/2 non-negative bins, DC included,
    Nyquist absent) with open bands (fmin < f < fmax): DC is always dropped and the f = 0.25 bin belongs to neither half-band (p6_misc.py T=64: full band 31 bins 0.0156-0.4844, low band 15 bins ending 0.2344,
    high band 15 bins starting 0.2656). (iv) ''conditioning out the influence of other signals (using the partialized cross-spectrum)'': no partialised cross-spectrum/partial coherence is computed; the
    conditioning factor is the PDC of a 2-channel model, so nothing is conditioned out.'
  deviation_from_canonical: '(a) Uses |PDC| where Korzeniewska et al. use partial coherence; (b) returns the product of moduli |F||PDC| instead of the product of squares F^2 C^2 (p2_kernel.py: equals |F||pi|
    to 6e-17, differs from F^2 C^2 by 0.048); (c) bivariate 2-channel model, so for P > 2 nothing is partialised, and in 2x2 |PDC_ij| = sqrt(DTF_ij), i.e. the pyspi value is |F_ij| sqrt(DTF_ij); canonical
    bivariate dDTF would use the ordinary coherence (partial coherence with no third signal), which is symmetric; (d) length and band dependence: the ffDTF normalisation over the frequency grid is part
    of the canonical definition, so on an n_fft = T grid the canonical ffDTF^2 x pcoh^2 itself scales as about T^-1 (check run ddtfscale: slopes -1.007, -1.002, -1.000 on the exact var2_bivariate
    spectrum); the library-specific parts are only the exponent T^-1/2 (a consequence of the moduli in (b); p5_bias_T.py true direction 0.084, 0.044, 0.022, 0.011, 0.005 at T = 64..16384) and the normalisation
    over all T/2 non-negative bins for the half-band identifiers (fmin-0_fmax-0-25, fmin-0-25_fmax-0-5), where a band-restricted canonical analysis would normalise over the analysed band only. Values are
    not comparable across series lengths in either form.'
  units_and_range: dimensionless, non-negative, per-frequency in [0, 1] but O(1/sqrt(n_fft/2)) in practice (pipeline values about 0.002-0.018 at T=4096); asymmetric; diagonal NaN; magnitude depends on T
  direction_convention: 'A[i, j] = statfn over the band of L[0, 1] where L is the library measure on the ordered 2-channel array [x_i, x_j]; the library''s [a, b] entry is the flow from channel b to channel
    a (H[a, b] maps innovation b into signal a; kernel probe p2_kernel.py on the exact var2_bivariate spectrum: x0 -> x1 appears at L[1, 0], L[0, 1] = 0). Hence A[i, j] = estimated flow x_j -> x_i: ROW
    = TARGET, COLUMN = SOURCE. Confirming evidence: exact-spectrum toy VAR(1) with x0 -> x1 gives library DTF L[1,0] = 0.1608, L[0,1] = 0 (review probe pD_kernel_directed.py); pipeline probe p3_pipeline.py
    (T=4096, z-scored) var2_bivariate A[1,0] = 0.2617 > A[0,1] = 0.1281 (x0 -> x1). logistic_maps (y = process 1 drives x = process 0, audit/checks/make_data.py:207 (beta_xy = 0.1, beta_yx = 0) and :309-310 (update equations)) shows A[0,1] > A[1,0] in the pipeline,
    but the Wilson factorisation does not converge on that dataset at T >= 1024 (60 iterations, residual 0.32-0.38; p7_wilson.py, review pF_wilson.py), so it is not used as confirming evidence. This is
    the opposite of the glossary''s row = source convention. On delayed_noise the DTF/PDC/dcoh/ddtf matrices look row = source only because the estimator fails there (see candidates); gpdcoh on delayed_noise
    follows row = target.'
  symmetry_expected: asym
  already_documented: 'DEPENDENCY_COMPATIBILITY_REVIEW.md (ddtf depends internally on the whole frequency grid: differed by 7.20e-4 after changing only the aggregation boundary); tests/README.md (ddtf goldens
