    while the docstring (:878-880) says ''partial coherence''; p2_kernel.py ''dDTF lib vs K2003 ff^2*pcoh^2 0.048'', ''dDTF lib vs |ff|*|PDC| hyp 6.2e-17''.'
  - 'CANDIDATE (degenerate in the bivariate setting; pack hypothesis 1): with 2 channels |PDC_ij| = sqrt(DTF_ij) exactly, so ddtf = |ffDTF_ij| * sqrt(DTF_ij) carries no conditioning; on var2_chain pyspi
    ddtf A[2,0] = 0.0041 for a pair without direct coupling (p3_pipeline.py) whereas the 3-channel library value is 0.0 (p2_kernel.py var2_chain).'
  - 'CANDIDATE (length dependence; check stage: the T dependence itself is shared with canonical ffDTF, see deviation (d)): normalisation over all n_fft/2 bins (_total_inflow axis=(-1, -3)) makes ddtf scale like T^{-1/2}: p5_bias_T.py s=1.0 true-direction means 0.084, 0.044, 0.022, 0.011,
    0.005 for T = 64, 256, 1024, 4096, 16384; also the band identifiers (fmin-0-25 etc.) are normalised by full-band energy.'
  - 'CANDIDATE (direction reversed vs documentation and estimator inversion on delayed copies): p3_pipeline.py var2_bivariate ddtf [[nan, 0.0025], [0.0055, nan]] (row = target); delayed_noise A[0,k] ~0.0177
    > A[k,0] ~0.0023 (inverted by estimator, as for dtf).'
  - 'CANDIDATE (cost): 4 Wilson runs per call (p6_misc.py ''wilson calls direct_directed_transfer_function 4''); P=3 multivariate: 24 Wilson runs.'
