optimisation:
  complexity_P_T: 'O(P^2 T^2 d): JIDTBase._compute_joint_entropy, P(P-1)/2 JIDT EntropyCalculatorMultiVariateKozachenko calls (cached symmetrically), each a brute-force nearest-neighbour pass (EuclideanUtils.computeMinEuclideanDistances)
    over T x 2 jittered observations. Measured fresh P exponent 1.98, T exponent 2.21. At 118x1024 the pair term dominates: 89.9 s measured fresh.'
  hotspot_1: pyspi/statistics/infotheory.py:JIDTBase._compute_joint_entropy (third-party:jidt Kozachenko, self time) 99.8% cum / 99.6% self of the profiled SPI call at 8x1024
  hotspot_2: 'none visible inside Java. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0027
  profile_file: audit/profiles/infotheory.je.kozachenko__8x1024.pstats
  opportunities:
  - opportunity_id: it_kozachenko-2
    opportunity: Replace the brute-force nearest-neighbour search behind EntropyCalculatorMultiVariateKozachenko (EuclideanUtils.computeMinEuclideanDistances, O(N^2 d); measured T exponent 2.0-2.3) with
      a kd-tree query (scipy cKDTree, k=1, Euclidean) on the same normalised, jittered observations, keeping JIDT's digamma formula.
    opp_type: replace-library
    expected_speedup: 5-20x
    speedup_basis: 'profile:audit/profiles/infotheory.je.kozachenko__8x1024.pstats pyspi/statistics/infotheory.py:159 _compute_joint_entropy 99.8% (JIDT Java time booked as pyspi self time) + complexity:
      brute force evaluates N^2 = 1.05e6 distances of dimension 2 per call at T=1024 (measured T exponent 2.21); a kd-tree needs ~N log N queries in d <= 4 and loses most of its advantage near d = 10'
    output_risk: unverified-within-tolerance
    risk_evidence: 'check stage: a cKDTree-based replica with the java.util.Random(42) jitter port reproduces JIDT to <= 1.2e-14 (je.kozachenko jrand runs), 3.7e-14 (cce), 2.1e-14 (xme_k1) for <= 2000 rows;
      above 2000 rows JIDT switches to the naive routine whose distances differ (infotheory.est.kozachenko finding), so there the change is semantic'
    effort: M
    depends_on: []
