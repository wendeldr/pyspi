    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: '|A[i,j] - ref| <= 1e-6 nat for T in {64,256,1024} (noise-level differences; probe3 4e-8). At T=4096 still <= 1e-3, because the d=2 naive-distance defect is rare.'
