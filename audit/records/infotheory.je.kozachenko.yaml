unit_id: infotheory.je.kozachenko
status: profiled
correctness:
  metric_name_standard: Joint differential entropy H(X_i, X_j) of the paired samples, Kozachenko-Leonenko estimate
  canonical_ref: 'Cover TM, Thomas JA (2006) Elements of Information Theory, 2nd ed., Wiley, §8.4 (joint differential entropy h(X,Y) = -∫ f(x,y) log f(x,y)); estimator: Kozachenko & Leonenko (1987) Probl.
    Inf. Transm. 23(2):95-101, in the form of Kraskov, Stoegbauer & Grassberger (2004) Phys Rev E 69:066138 Eq. (20), k=1'
  canonical_definition: H(X,Y) = -E[log f_{XY}(X,Y)] for the joint density of contemporaneous pairs (x_t, y_t); KL estimate -psi(1) + psi(N) + log(pi/4) + (2/N) sum_t log(2 rho_t) with rho_t the Euclidean
    NN distance in R^2.
  documented_definition: 'Supplement §1.4.1, p.10 (supplement.txt:444; the pack lists 454): "The joint entropy [33] quantifies the uncertainty over the paired observations"; keywords "undirected, nonlinear,
    unsigned, bivariate, contemporaneous"; SPI 59 je_kozachenko. GitBook information-theory.md lines 139-155 (same text).'
  delegate_lib: JIDT jar (labelled 1.6.1, post-tag build matching commit a9b6b3e77c) EntropyCalculatorMultiVariateKozachenko.computeAverageLocalOfObservations, d=2
  implemented_as: 'Calculator default z-scoring (ddof=1). For pair (i,j): x, y = data.to_numpy()[[i, j]] (each (T,1)), concatenated to a (T,2) array, initialise(2), setObservations, computeAverageLocalOfObservations,
    using the shared Kozachenko estimator (Euclidean NN, 1e-8 noise with seed 42, nats; see infotheory.est.kozachenko). The result is cached in data.joint_entropy[(estimator,)] at both [i,j] and [j,i].
    Undirected.multivariate then mirrors the upper triangle. All T samples are used, with no Theiler window.'
  implementation_trace:
  - 'pyspi/calculator.py:277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (normalise=True default, :50); pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset);
    pyspi/calculator.py:332 np.fill_diagonal(S, np.nan) (HEAD lines)'
  - pyspi/base.py:132-138 Undirected.multivariate -> Directed.multivariate (base.py:85-94, A[i,j] = bivariate(data, i=i, j=j) for all i != j) then A[li] = A.T[li]
  - pyspi/statistics/infotheory.py:223-234 JointEntropy.bivariate -> _compute_joint_entropy
  - 'pyspi/statistics/infotheory.py:159-177 _compute_joint_entropy: initialise(2); setObservations(JArray(np.concatenate([x, y], axis=1))); cache [i,j] and [j,i]'
  - pyspi/statistics/infotheory.py:103-110 _getcalc('entropy') -> EntropyCalculatorMultiVariateKozachenko(); pyspi/statistics/infotheory.py:91 calc.setProperty(self._SEED, '42') (NOISE_SEED=42, in _setup
    :84-93)
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java:179-219 finaliseAddObservations / setObservations (noise added, no normalisation)
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/kozachenko/EntropyCalculatorMultiVariateKozachenko.java:82-115 computeAverageLocalOfObservations
  - JIDT v1.6.1 java/source/infodynamics/utils/EuclideanUtils.java:69-75 (fast path N<=2000, naive path N>2000)
  deviation_from_documented: 'Label: the class labels this SPI ''linear'' (infotheory.py:53-54 else-branch), but the supplement, GitBook and config.yaml:400 say ''nonlinear''. Otherwise none.'
  deviation_from_canonical: 'Estimator-level only (see infotheory.est.kozachenko): 1e-8 tie-breaking noise (|delta| ~4e-8 nat at T=256, probe3) and the JIDT naive-distance defect for N > 2000. At d=2 that
    defect is rare (probe5: 1 wrong NN distance of 2001 at N=2001, 0 of 4096 at N=4096; var2_bivariate T=4096 je 2.821 vs reference 2.821). The time series are treated as iid samples (no Theiler window),
    which the supplement allows for je (''intended to operate on serially independent observations'').'
  units_and_range: 'Nats; real, can be negative (differential entropy). After z-scoring, independent Gaussian pairs give about log(2 pi e) = 2.838. Tends to -inf for near-deterministic pairs: shared_envelope
    T=1024 pairs among rows 0-2 give -28.809 to 3 decimals (probe7, probe9), which is dominated by sub-1e-9 near-ties and the 1e-8 noise. Labelled ''unsigned''; the sign is not constrained.'
  direction_convention: 'Undirected: A[i,j] = A[j,i] = H(z_i, z_j). The cache writes both cells (infotheory.py:174-175) and Undirected.multivariate mirrors. Probe7: je matrices exactly symmetric on gauss_ar1_pair
    and shared_envelope.'
  symmetry_expected: sym
  already_documented: docs/storage_comparison/REVIEW.md M8 (differential entropies can be negative; stated there for the Gaussian joint entropy and applying equally here)
  new_finding_candidates:
  - 'Candidate (label): je_kozachenko carries the label ''linear'' (probe1: [''unsigned'',''infotheory'',''unordered'',''undirected'',''linear'']), set by the infotheory.py:53-54 else-branch for every non-kraskov/kernel/symbolic
    estimator. Supplement §1.4.1 and config.yaml:400 say ''nonlinear''. The KL estimator is nonparametric.'
  - 'Candidate (data sensitivity): with tied or near-tied samples the value is set by the 1e-8 noise. shared_envelope T=1024: je(0,1), je(0,2), je(1,2) are equal to 3 decimals (-28.809) but not identical:
    JointEntropy.bivariate gives -28.8093911325, -28.8093892384 and -28.8093878131 (probe9; they differ at the 1e-6 level through the noise layout). Rows 0-2 have only 181 distinct values when rounded to
    1e-9 (unique-count probe).'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
