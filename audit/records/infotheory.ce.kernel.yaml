optimisation:
  complexity_P_T: 'O(P^2 T^1.5): joint box-kernel entropy per unordered pair (shared with je through data.joint_entropy) minus a cached marginal per channel. Measured fresh P exponent 1.89, T exponent 1.55;
    family-warm after je only the marginals remain (0.040 s at 8x1024). At 118x1024 fresh the joint pairs dominate (38.2 s measured); family-warm 9.85 s projected (extrapolated-pairs-from-8, which overstates
    a P-linear marginal cost).'
  hotspot_1: pyspi/statistics/infotheory.py:JIDTBase._compute_joint_entropy (third-party:jidt, self time) 90.5% of the profiled SPI call at 8x1024
  hotspot_2: 'pyspi/statistics/infotheory.py:JIDTBase._compute_entropy (third-party:jidt, self time) 9.4% cum. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the
    JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.001
  profile_file: audit/profiles/infotheory.ce.kernel__8x1024.pstats
  opportunities:
  - opportunity_id: it_kernel-2
    opportunity: 'Replace JIDT''s box-kernel counting with per-(channel, width, lag window) neighbourhood bitsets: one T x T bit matrix marks |x(t) - x(s)| <= w_d (w_d = width x the column''s ddof=1 SD,
      as KernelEstimatorMultiVariate sets it) and every joint count of je/ce/mi/tlmi/te/si/xme/cce/di is a popcount of ANDed rows, so the neighbourhood search is shared by all P-1 partners and all composed
      terms.'
    opp_type: algorithmic
