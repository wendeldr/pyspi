unit_id: infotheory.ce.kernel
status: profiled
correctness:
  metric_name_standard: Conditional differential entropy h(X_j | X_i) of contemporaneous samples (box-kernel plug-in, bits)
  canonical_ref: Cover TM, Thomas JA (2006) Elements of Information Theory, 2nd ed., Ch. 8, Def. of conditional differential entropy h(Y|X) = h(X,Y) - h(X) (Sec. 8.4); estimator Kantz & Schreiber (1997)
    box kernel
  canonical_definition: 'h(Y|X) = -E[log2 p(y|x)] = h(X,Y) - h(X); box-kernel plug-in: h_hat(X,Y) - h_hat(X) with the same radius in SD units'
  documented_definition: 'supplement §1.4.2, p.10 (supplement.txt:451-458; pack lines 461-468): ''Conditional entropy [33] quantifies the uncertainty over the observations in y in the context of simultaneously observing x'' (equation
    not in the text extraction); keywords: undirected, nonlinear, unsigned, bivariate, contemporaneous; identifier 63 ce_kernel_W-0.5. supplement §1.4, p.9 (supplement.txt:405-443; pack lines 414-453): ''Kernel estimation (kernel)
    uses a box kernel method with a specific kernel width (default width of 0.5 standard deviations (denoted by the modifier W-0.5))''; GitBook information-theory.md:14 same sentence. GitBook information-theory.md:46-64
    same prose and keywords (undirected).'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): EntropyCalculatorMultiVariateKernel
    (joint 2-D and marginal 1-D), combined in pyspi'
  implemented_as: 'A[i,j] = bivariate(i,j) = JE_hat(z_i, z_j) - H_hat(z_i) = h_hat(X_j | X_i): the conditioning variable is the FIRST index (source i), the target is j. JE from the shared cache data.joint_entropy[(''kernel'',0.5)]
    (infotheory.py:159-177), H from data.entropy[(''kernel'',0.5)] (infotheory.py:137-156, 1-D kernel entropy on z_i). Both use closed max-norm boxes of half-width 0.5*sampleSD per dimension with self-inclusion;
    with z-scored data CE = -mean log2(C_xy/C_x) + log2(2*0.5*SD(z_j)) = -mean log2(C_xy/C_x) (>= 0).'
