  deviation_from_documented: '(1) Keyword ''undirected'' in supplement §1.4.2 and GitBook :48 contradicts the code (class Directed, label ''directed'', infotheory.py:237-241) and the asymmetric value (probe
    delayed_noise T=1024: A[0,1]=2.0356, A[1,0]=2.0302; nonlinear_dependence T=1024: H(x1|x0)=0.8608, H(x0|x1)=0.9217). (2) Prose ''uncertainty in y given x'' does not say which matrix index is y; code:
    target = j (column), conditioning = i (row) - see already_documented M8. (3) ''width 0.5 SD'' is the box half-width.'
  deviation_from_canonical: None beyond the shared estimator properties (resubstitution box kernel, self-inclusion, no bias correction; see infotheory.est.kernel).
  units_and_range: bits; with W=0.5 on z-scored data CE = -mean log2(C_xy/C_x) in [0, log2 T] (C_xy <= C_x), so non-negative; asymmetric; finite for finite input; diagonal NaN.
  direction_convention: A[i,j] = h_hat(X_j | X_i) (entropy of column/target j given row/source i). Smaller A[i,j] = X_i more informative about X_j.
  symmetry_expected: asym
  already_documented: 'docs/storage_comparison/REVIEW.md M8 (ce is H(i,j) - H(i): conditioning order)'
  new_finding_candidates:
  - 'Candidate (documentation label): supplement §1.4.2 and GitBook information-theory.md:48 list ce as ''undirected'', but the class is Directed and values are asymmetric (probe nonlinear_dependence T=1024
    A[0,1]=0.8608 vs A[1,0]=0.9217). Possibly overlaps REVIEW.md M9 (label structure); not listed there explicitly.'
  - 'Candidate (range): with W-0.5 on z-scored data the volume term log2(2*0.5*1) is 0, so ce_kernel equals -mean log2(C_xy/C_x) >= 0, unlike ce_gaussian/ce_kozachenko which can be negative. Evidence: numpy
    reference with this formula matched pyspi to 1.8e-15 (var2_bivariate T=256: 1.90003718262763).'
  - 'Candidate (copy path, confirmed by probe): a CalculatorFrame computes ce_kernel_W-0.5 with kernel width 0.25 while the identifier still reads W-0.5. JIDTBase.__deepcopy__ (infotheory.py:77-82) copies
