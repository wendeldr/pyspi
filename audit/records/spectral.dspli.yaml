    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: 'closed form agrees to <= 1e-12 on all bins of off-diagonal entries provided |Im S_ij,k| <= 1e-12 * max_k |S_ij,k| is set to exactly 0 (a sign tie) before the measure formula. Measured in the check stage (refs/spectral_phase_sync.py:csm, keys tie_* in results.json): the elementwise product X[:, None] * conj(X[None, :]) gives Im S exactly 0.0 at DC on every off-diagonal entry of every dataset (iid_gaussian, delayed_noise, var2_bivariate, narrowband_f0-0.25, shared_envelope at T = 64/256/1024), because the DC coefficient of real input is real; it leaves rounding noise only on the diagonal (1.1e-16 to 3.5e-15) and for the bit-identical channels shared_envelope (0,2) (2.6e-16 to 1.3e-15), where the library matmul (connectivity.py:1187-1190) returns exactly 0. Without the rule the identical pair differs by 1.0 for PLI, 1.25 for dsPLI, up to 0.993 (T=256) / 1.0 (T=1024) for wPLI, and dswPLI is finite where the library gives NaN (runs spectral.dspli|shared_envelope|{64,256,1024}|kernel|perbin, key no_tie_rule_*); the rule zeroed exactly the 5 x 2 x (n_bins - 1) identical-pair entries and nothing else (tie_zeroed_offdiag_nonDC 1270 at T=256). The diagonal is masked (pyspi NaN-fills it). pairwise form agrees on all non-DC bins and differs by exactly 0.25 at DC (band means in fmin=0 bands differ by 0.25/n_bins); shared_envelope (0,2): pairwise 0 vs implemented -0.25'
