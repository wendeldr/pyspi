unit_id: spectral.dspli
status: profiled
correctness:
  metric_name_standard: debiased (unbiased) estimator of the squared phase lag index, with tapers as observations, band mean / band max
  canonical_ref: Vinck, Oostenveld, van Wingerden, Battaglia & Pennartz 2011, NeuroImage 55:1548-1565, unbiased estimator of the squared PLI (pairwise-product form; equation number not re-checked)
  canonical_definition: PLI^2_unbiased = (1/(N(N-1))) sum_{j != k} sign(Im X_j) sign(Im X_k) over N independent observations; when no sign is zero this equals (N PLI_hat^2 - 1)/(N - 1) with PLI_hat = (1/N) sum sign(Im X). Targets PLI^2 (can be negative in finite samples), symmetric.
  documented_definition: 'supplement §1.5.8, p.15 (supplement.txt:715-750): "... weighted variations that make the measure more robust against electrophysical artifacts (namely, field spread), noise, and sample-size bias by weighting components based on the imaginary coherence [68]: ... the debiased squared phase lag index (dspli) ..." Labels undirected, unsigned (config.yaml:824-830). GitBook spectral.md:241, 269-280. Grid/band text: supplement §1.5, pp.12-13 (heading supplement.txt:570; grid text :582-599; the pack line ranges for §1.5.6-1.5.8 are offset, actual headings at :686, :701, :715): "Each measure is based on the cross- and power-spectral densities at a given frequency and sampling rate, which is estimated via the multitaper technique ... We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2], where fs/2 is the Nyquist frequency and f0 = 4/T ... we take the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5: f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]." Same text on GitBook spectral.md:16-20.'
  delegate_lib: spectral_connectivity==1.1.2 Multitaper.fft + Connectivity.debiased_squared_phase_lag_index (numpy 2.5.4); band mean/max native pyspi
  implemented_as: 'Per bin: dsPLI_ij(f) = (K PLI_ij(f)^2 - 1)/(K - 1) with K = n_observations = 5 and PLI the signed taper-mean of sign(Im S) (already restricted to non-negative frequencies). For non-DC bins (no zero signs) values are in {-0.2, 0.2, 1}; at DC (Im S = 0 exactly) PLI = 0 and dsPLI = -1/(K-1) = -0.25. pyspi: np.nanmean / np.nanmax over bins with fmin <= f <= fmax.'
  implementation_trace:
  - 'pyspi/config.yaml:824-851 DebiasedSquaredPhaseLagIndex configs: (fs=1), (fmin=0, fmax=0.25), (fmin=0.25, fmax=0.5), and the same three with statistic=max; labels undirected, linear, unsigned, bivariate, frequency-dependent'
  - 'pyspi/statistics/spectral.py:200-207 DebiasedSquaredPhaseLagIndex(NonparametricSpectralMultivariate, Undirected): identifier "dspli", _measure "debiased_squared_phase_lag_index", labels ["unsigned", "spectral", "undirected"]'
  - 'pyspi/data.py:184-195 Data preprocessing: optional scipy.signal.detrend(axis=1), then zscore(axis=1, nan_policy="omit", ddof=1) (default normalise=True, detrend=False)'
  - 'pyspi/calculator.py:295-355 Calculator.compute (cited at HEAD a1f20c7): :329 S = spi.multivariate(dataset); :332 np.fill_diagonal(S, nan); :336-337 any exception -> whole SPI table NaN (error recorded :338-339); :354-355 warning'
  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fmax None -> fs/2; statistic "mean" -> np.nanmean, "max" -> np.nanmax; identifier suffix f"_multitaper_{statistic}_fs-{fs}_fmin-{fmin:.3g}_fmax-{fmax:.3g}" with "." -> "-"'
  - 'pyspi/statistics/spectral.py:45-50 key = (self.measure,) for these classes: one cached spectrum per measure, shared by all band/statistic variants on a Data object'
  - 'pyspi/statistics/spectral.py:64-83 _get_cache: z = data.to_numpy(squeeze=True).T (T x P); m = sc.Multitaper(z, sampling_frequency=fs) (all other arguments default); conn = sc.Connectivity.from_multitaper(m); res = getattr(conn, measure)(); freq = conn.frequencies; first insert keyed by the bare string measure at :81 (one redundant recompute, tests/README.md worth knowing)'
  - 'pyspi/statistics/spectral.py:85-91 multivariate (parse_multivariate, pyspi/base.py:51-68): freq_id = np.where((freq >= fmin) * (freq <= fmax)); adj = statfn(res[0, freq_id, :, :], axis=0)'
  - 'pyspi/statistics/spectral.py:101-102 np.fill_diagonal(adj, nan); returned as is. MRO (probe): [cls, NonparametricSpectralMultivariate, NonparametricSpectral, Unsigned, Undirected, Directed, object], so Undirected.multivariate (pyspi/base.py:132-138) is never reached (REVIEW M1; tests/README.md bug 5 before b2f6d7e)'
  - pyspi/_spectral_compat.py:15-28 replaces spectral_connectivity.connectivity.np by a namespace whose in1d maps to np.isin; all other numpy calls unchanged (not on the path of these measures)
  - 'spectral_connectivity==1.1.2 .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-100 Multitaper.__init__ defaults: time_halfbandwidth_product=3, detrend_type="constant", n_tapers=None, n_fft_samples=None, time_window_duration=None (one window = the whole series), is_low_bias=True'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:155-164 n_tapers = floor(2*NW - 1) = 5; :469-543 dpss_windows, :668-673 _get_low_bias_tapers keeps eigenvalues > 0.9 (probe: 5 tapers kept at T = 64, 256, 1024, 4096)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:167-190 n_time_samples_per_window = T; n_fft_samples = scipy.fftpack.next_fast_len(T); frequencies = fftfreq(n_fft, 1/fs)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:238-260 fft(): _sliding_window (single window), detrend(type="constant") (:701-, subtracts each channel mean), _multitaper_fft (:335-354) fft(x * taper, n=n_fft)/fs -> fourier_coefficients (1 window, 1 trial, K=5 tapers, n_fft, P)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:156-172 from_multitaper(expectation_type="trials_tapers"); :45-53 EXPECTATION["trials_tapers"] = mean over axes (1, 2) = 1 trial x 5 tapers; :276-287 n_observations = 5
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:195-208 _cross_spectral_matrix = _complex_inner_product(X[..., None], X[..., None]) (:1187-1190 matmul(a, conj(b).T), :1485-1487) -> S_ij,k = X_i,k * conj(X_j,k)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:210-220 _expectation_cross_spectral_matrix(fcn): blocks None -> mean over tapers of fcn(S)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:73-89 _non_negative_frequencies keeps indices 0..(n_fft+1)//2 - 1 (DC kept, Nyquist dropped for even n_fft); :174-180 frequencies uses the same slice
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:603-624 debiased_squared_phase_lag_index: n_observations = 5; return (n * phase_lag_index()**2 - 1.0)/(n - 1.0) (no decorator of its own; phase_lag_index (:541-574) is already non-negative-frequency sliced)'
  deviation_from_documented: '(1) dsPLI involves no weighting by imaginary coherence (the text groups it with the weighted variations). (2) Labelled unsigned but takes negative values (M7). (3) Frequency grid: documented 125 uniform bins on [f0 = 4/T, fs/2]; implemented n_fft/2 bins (n_fft = next_fast_len(T) = T for the probed powers of two) at f = m/n_fft, m = 0..n_fft/2-1, i.e. DC included, Nyquist excluded, f0 = 0 not 4/T (probe: 32/128/512/2048 bins at T = 64/256/1024/4096, first bin 0.0, last 0.484375 at T=64). Band rule freq >= fmin & freq <= fmax is inclusive at both ends, so the f = 0.25 bin is counted in both the low and the high band whenever 0.25 is a grid point, i.e. when n_fft = scipy.fftpack.next_fast_len(T) is a multiple of 4; this holds for every manifest size (T = 64/256/1024/4096) and for the 512- and 1024-sample EEG windows (probe: low band 17 bins 0..0.25, high band 16 bins 0.25..0.484 at T=64), but not in general (probe grid_tie.py: at T = 30 and 250, n_fft = 30 and 250 has no 0.25 bin and the inclusive low/high counts are 8/7 and 63/62). Taper count: K = 5 tapers pass the eigenvalue > 0.9 filter at every probed T >= 10 (10, 16, 30, 64, 100, 250, 256, 512, 1000, 1024, 4096); at T = 7 and 8 (n_fft = 8) only 4 tapers are kept and n_observations = 4, so every K = 5 statement in this record assumes T >= 10.'
  deviation_from_canonical: '(1) Observations are the 5 tapers of one window, not trials; the estimator is unbiased only if the 5 taper estimates are independent (approximately, for locally flat spectra; hypothesis). (2) The closed form (K PLI^2 - 1)/(K - 1) differs from the pairwise-product definition whenever some sign(Im S) = 0: then sum_k sign^2 < K. This happens exactly at DC for real input (probe: dsPLI(DC) = -0.25 on delayed_noise T=256, pairwise form gives 0) and at every bin for identical channels (shared_envelope x2==x0: A[0,2] = -0.25, pairwise form 0). Bands with fmin = 0 therefore carry an offset of -0.25/n_bins (-0.0078 full band and -0.0147 low band at T=64). (3) Band max over a 3-valued per-bin statistic reaches 1 under independence for every pair of the audit iid_gaussian dataset at T >= 256, for 0.997 of off-diagonal entries at T = 256 over 30 fresh seeds (minimum per seed 0.9; review probe, upper triangle, 1.0) and for every entry at T >= 1024 (probe sat.py; 0.78 at T = 64).'
  units_and_range: 'dimensionless; per bin in {-0.25 (DC or zero Im only), -0.2, 0.2, 1}; band values in [-0.25, 1]; negative values are valid finite-sample outcomes (M7); symmetric (probe max |A - A^T| = 0.0); null band mean ~0 (probe iid: -0.0016, -0.0223, -0.0074, -0.0004 at T = 64..4096); dspli_max = 1.0 under independence for every pair of the audit iid_gaussian dataset at T >= 256 and for every entry over 30 fresh seeds at T >= 1024, but for 0.997 of entries at T = 256 (probe sat.py), so not universally at T = 256.'
  direction_convention: 'Undirected: PLI^2 is invariant to conjugation, so A[i,j] = A[j,i] exactly (probe). No lead/lag information.'
  symmetry_expected: sym
  already_documented: REVIEW M7 and EEG_OPTIMIZATION_NOTES.md §review (legitimate negative estimators) (negative dspli valid; closed form (K PLI^2 - 1)/(K - 1) noted there); REVIEW M1 (no symmetrisation; no effect, symmetric; tests/README.md bug 5 before b2f6d7e); REVIEW M4 and DEPENDENCY_COMPATIBILITY_REVIEW.md (DC included).
