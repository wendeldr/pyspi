  - 'CANDIDATE: identical (or exactly zero-lag, real cross-spectrum) channels return the minimum value -0.25 rather than 0: probe4 shared_envelope (x2 bit-identical to x0) dspli mean and max A[0,2] = -0.25 at T = 256 and 1024, below the independence level (~0).'
  - 'CANDIDATE: dspli_max saturates at 1.0 under independence: every pair of the audit iid_gaussian dataset at T >= 256 (probe3), 0.997 of off-diagonal entries at T = 256 and all entries at T >= 1024 over 30 fresh seeds (probe sat.py), because per-bin values are 1 whenever all 5 signs agree (probability 1/16).'
  - 'CANDIDATE (pack hypothesis confirmed): dspli = (K PLI^2 - 1)/(K - 1) with K = 5 tapers (probe n_observations = 5; probe2 reproduction from the same coefficients max diff 0.0).'
