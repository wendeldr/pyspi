optimisation:
  complexity_P_T: 'O(P^2 n_iter T^2): one DBA per unordered pair (Barycenter caches (i, j) and (j, i) on the Data object, pyspi/statistics/distance.py:Barycenter.bivariate),
    up to 30 iterations each with two numba DTW paths (O(T^2)) and dense T x T path matrices. Measured P_exponent 2.02 (8 -> 32), T_exponent 2.45;
    118x1024 projected from 32 by pair count (738 s fresh; 766 s family-warm from 8). The pair term dominates (t_fixed 0.24 s).'
  hotspot_1: tslearn/barycenters/dba.py:_subgradient_valence_warping (third-party:tslearn, via _mm_valence_warping) 48.1% cumulative, 30.8% self
    time of the profiled SPI call at 8x1024 (Python loop over the path filling dense zeros; numpy.zeros 11.2% overall)
  hotspot_2: tslearn/barycenters/dba.py:_mm_assignment (third-party:tslearn) 28.7% (numba _njit_dtw_path hidden in it); _mm_update_barycenter
    19.7% (dense dot 13.3% overall, diag 5.7%)
  hotspot_owner: third-party:tslearn
  opaque_share: 0.3442
  profile_file: audit/profiles/distance.bary.dtw__8x1024.pstats
  opportunities:
  - opportunity_id: barycenters-1
    opportunity: 'Replace the dense T x T path matrices in tslearn''s barycenter updates with path-index accumulation: _subgradient_valence_warping
      (tslearn/barycenters/dba.py:308-352) allocates numpy.zeros((T, T)) per series per iteration and sets w_k[i, j] = 1 in a Python loop over
      the path; _mm_update_barycenter / _subgradient_update_barycenter then multiply the dense matrices (w_k.dot(x_k), numpy.diag(1/V).dot(...)).
      A numba pass over the path gives the valence and the warped sums in O(T).'
    opp_type: rewrite-numba-rust-cpp
    expected_speedup: ~2x
    speedup_basis: profile:audit/profiles/distance.bary.dtw__8x1024.pstats _subgradient_valence_warping 48.1% + most of _mm_update_barycenter
      19.7% removable (Amdahl 2.5-3x; DTW paths 28.7% remain)
    output_risk: unverified-within-tolerance
    risk_evidence: sums over path entries change order from a dense BLAS dot to a sequential pass; DBA's |cost change| < 1e-5 stopping test could
      occasionally stop at a different iteration
    effort: M
    depends_on:
    - xc-window-parallel
