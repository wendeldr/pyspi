unit_id: distance.bary.dtw
status: profiled
correctness:
  metric_name_standard: Summary (time-mean or time-max) of the DTW barycenter (DBA / Fréchet mean under DTW) of two z-scored series; squared variant summarises its square
  canonical_ref: 'Petitjean, Ketterlin & Gançarski 2011, Pattern Recognit. 44(3):678-693 (DBA, §4 Alg. 5); Schultz & Jain 2018, Pattern Recognit. 74:340-358 (Fréchet function, MM algorithm Alg. 2). Mean/max summary: pyspi construction (supplement §1.2.10).'
  canonical_definition: 'b* in argmin_b F(b) = (1/n) sum_k DTW(b, x_k)^2 with DTW(b,x)^2 = min over warping paths of sum (b_t - x_s)^2 (unconstrained); DBA/MM iterate: align each x_k to b by DTW, set b_t = average of all x_k samples aligned to t; non-convex, returns a local minimiser. SPI = mean_t b(t) or max_t b(t) (squared: of b(t)^2).'
  documented_definition: 'supplement §1.2.10, p.7 (supplement.txt lines 321-335): "A barycenter (or Fréchet mean) [21, 22] is a (univariate) time series that minimizes the sum of squared distances between MTS ... For each pair of (bivariate) time series ... we compute the raw barycenters then summarize them by taking their mean (modifier mean) and maximum (max), yielding seven SPIs" (keywords: undirected, nonlinear, unsigned, bivariate, time-dependent). GitBook distance-similarity.md:41-75 repeats this, adds "timepoint at which the maximum occurs (max_time)" and lists 12 identifiers bary_{euclidean,dtw,softdtw,sgddtw}_{mean,max,max_time}; neither source documents the squared (bary-sq_*) variants. Mode dtw is documented as "alignment via expectation maximization".'
  delegate_lib: tslearn==0.9.0 tslearn.barycenters.dtw_barycenter_averaging (Majorize-Minimize variant; defaults n_init=1, max_iter=30, tol=1e-5, barycenter_size=T, init=None, metric_params=None) with numba 0.68.0 _njit_dtw_path
  implemented_as: 'z-scored pair (ddof=1). Init b0 = nanmean of the two series = Euclidean barycenter (dba.py:23-25, 707). Up to 30 iterations: DTW path of b against each x_k (squared-Euclidean local cost, no global constraint), cost = mean_k DTW^2 (weights ones/2); valence V = sum of path counts per barycenter index, b <- diag(1/V) sum_k W_k x_k (Petitjean averaging); stop when |cost_prev - cost| < 1e-5 (absolute) or the cost increases (ConvergenceWarning). The returned b is the update after the last assignment step. Single initialisation; deterministic; input order irrelevant (probe2 order-diff 0). Then nanmean/nanmax of b or b**2.'
  implementation_trace:
  - pyspi/statistics/distance.py:4-9 imports euclidean_barycenter, dtw_barycenter_averaging, dtw_barycenter_averaging_subgradient, softdtw_barycenter from tslearn.barycenters
  - pyspi/statistics/distance.py:211-215 class Barycenter(Directed, Signed); class labels ['distance','signed','undirected','temporal','nonlinear']
  - pyspi/statistics/distance.py:220-221 mode 'dtw' -> self._fn = dtw_barycenter_averaging
  - pyspi/statistics/distance.py:230-234 squared=True sets preproc x**2 and identifier prefix 'bary-sq'
  - 'pyspi/statistics/distance.py:236-243 statistic: mean -> np.nanmean(preproc(bc)); max -> np.nanmax(preproc(bc)); max_time -> np.argmax(preproc(bc)) (not in any config)'
  - pyspi/statistics/distance.py:245 identifier suffix _{mode}_{statistic}
  - 'pyspi/statistics/distance.py:247-263 bivariate: looks up data.barycenter[mode][(i,j)]; on miss z = data.to_numpy(squeeze=True); bc = self._fn(z[[i, j]]) with library defaults; caches bc under (i,j) AND (j,i) (line 261); returns statfn(bc)'
  - pyspi/base.py:27-48 parse_bivariate (wraps raw arrays in a Data object, default normalise=True)
  - 'pyspi/base.py:85-94 Directed.multivariate: j outer, i inner, A[i,j] = bivariate(i, j); the first call for pair {a<b} is (i=b, j=a), so the cached barycenter is computed from z[[b, a]] and reused for A[a,b]'
  - pyspi/data.py:59-71 Data defaults detrend=False, normalise=True; pyspi/data.py:184-195 optional scipy detrend then zscore(axis=1, ddof=1)
  - pyspi/data.py:108-116 to_numpy(squeeze=True) -> (P, T) array
  - pyspi/calculator.py:252-266 configs instantiated as Barycenter(**params); spi.labels come from the class (config labels at pyspi/config.yaml:256-261 are not applied); pyspi/calculator.py:329 every SPI's multivariate() receives the same self.dataset, so all statistics/squared variants of one mode share one cached barycenter per pair
  - 'pyspi/config.yaml:255-311 Barycenter configs: 4 modes x {mean,max} x {squared False, True} = 16 identifiers'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/utils.py:7-13 _set_weights(None, 2) -> numpy.ones(2) (unnormalised uniform weights)
  - '.venv/lib/python3.12/site-packages/tslearn/utils/utils.py:215 to_time_series_dataset: (2, T) -> (2, T, 1)'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:485-496 dtw_barycenter_averaging signature (max_iter=30, tol=1e-5, n_init=1)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:599-618 n_init loop keeps the lowest-loss barycenter (one init here)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:621-631 dtw_barycenter_averaging_one_init; 702-707 to_time_series_dataset, _set_weights, _init_avg
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:23-25 _init_avg: numpy.nanmean(X, axis=0) when barycenter_size == T'
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:715-736 MM loop: _mm_assignment, _mm_valence_warping, _mm_update_barycenter; 729-734 stopping (abs change < tol, or increase -> warning + break)'
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:229-305 _mm_assignment: _njit_dtw_path(barycenter, X[i]) per series, cost += dist^2 * w_i, cost /= sum(w)'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:308-352 _subgradient_valence_warping (W_k path indicator, V_k = row sums); 355-397 _mm_valence_warping sums V_k
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:400-434 _mm_update_barycenter: diag(1/sum V_k) . sum_k W_k x_k'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:325-344 _njit_accumulated_matrix: local cost sum_d (s1-s2)^2, recursion min of three predecessors'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:415-443 _njit_dtw_path: mask, accumulated matrix, path; returns sqrt(cum_sum[-1,-1]) (line 435)'
  - .venv/lib/python3.12/site-packages/tslearn/metrics/utils.py:18-50 _njit_compute_path backtracking of the optimal warping path
  deviation_from_documented: 'Documented keyword "unsigned", but the class is Signed (issigned() True, class label "signed"); the config labels (undirected, nonlinear, unsigned, bivariate, time-dependent) are never attached to the SPI (calculator.py:252-266 uses class labels). Documented "undirected", but the class inherits Directed; symmetry comes only from the per-Data cache writing (j,i) = (i,j) (distance.py:261), not from Undirected.multivariate mirroring. Supplement says "seven SPIs" (lists euclidean_max, dtw_mean/max, softdtw_mean/max, sgddtw_mean/max); config computes 16, including bary_euclidean_mean and all eight bary-sq_* variants, none of which are documented; GitBook lists max_time variants that exist in code (distance.py:240-241) but are absent from every config. "Expectation maximization" is loose wording: tslearn runs the Majorize-Minimize mean algorithm (Schultz & Jain 2018 Alg. 2), whose update equals the DBA averaging step; the tslearn docstring itself says "Expectation-Maximization".
    bary-sq_dtw_* undocumented.'
  deviation_from_canonical: 'Algorithm matches DBA/MM. Differences from Petitjean 2011 practice: initialised at the Euclidean mean (Petitjean initialises from a selected input sequence), one initialisation, max_iter 30 and absolute tol 1e-5, so the result is a local minimiser near the Euclidean mean. Probe2: on narrowband_f0-0.25 (phase-shifted sinusoids) the final cost equals the cost of the Euclidean init (9.5464, 37.6819, 151.2988 at T=64/256/1024) after 2 iterations, i.e. DBA did not move; on bivariate_gaussian it lowers the cost (65.13 -> 44.69 at T=256). The mean/max summaries are pyspi-defined.'
  units_and_range: 'z-score units. mean: near 0 but not structurally zero, either sign; max over pairs of |bary_dtw_mean| (cleanup probe p_dtwmean.py, Barycenter(mode=''dtw'', statistic=''mean'').multivariate on audit/checks/data) is 0.016-0.090 at T=64 (logistic_maps 0.0901, delayed_noise 0.0757, iid_gaussian 0.0707, narrowband_f0-0.25 0.0519, bivariate_gaussian 0.0508), 0.006-0.063 at T=256 and 0.004-0.012 at T=1024 except logistic_maps (0.0712). max: typically positive, of order max of the inputs (bary_dtw_max 1.16-3.20 on the same datasets). sq variants >= 0. Finite for finite input. Symmetric.'
  direction_convention: 'undirected: A[i,j] = A[j,i] bit-identical via the cache; DBA with mean init is invariant to input order (probe2 max|b(x,y) - b(y,x)| = 0)'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate: for some pairs DBA returns its Euclidean initialisation unchanged, so bary_dtw_* equals bary_euclidean_* there. Evidence: probe2 narrowband_f0-0.25 pair (1,0): DBA epochs=2, cost == cost_init_eu (37.6819 at T=256), mean 0.0000; hypothesis: the initial DTW path from the mean is the diagonal, a fixed point of the MM update.'
  - 'Candidate: bary_dtw_mean is near-degenerate (small relative to bary_dtw_max of 1.2-3.2), inheriting the zero mean of the Euclidean init; it only departs from 0 through warping-induced duplicated samples. Evidence: cleanup probe p_dtwmean.py (Barycenter(mode=''dtw'', statistic=''mean'').multivariate on audit/checks/data), max over pairs of |bary_dtw_mean| up to ~0.09 at T=64 (logistic_maps 0.0901, delayed_noise 0.0757, iid_gaussian 0.0707, narrowband_f0-0.25 0.0519, bivariate_gaussian 0.0508), shrinking to 0.004-0.012 at T=1024 except logistic_maps (0.0712). The earlier probe2 values (0.0334, -0.0052, 0.0199) were single pairs, not a bound.'
  - 'Candidate: the label inconsistencies (Signed vs documented unsigned; Directed base vs "undirected") and the undocumented bary-sq_dtw_* identifiers, see deviation_from_documented.'
  - 'Candidate: DBA is a local optimiser started at a fixed point; the returned barycenter may not be the Fréchet mean, so values depend on the init rule (to be quantified by the optimality check).'
