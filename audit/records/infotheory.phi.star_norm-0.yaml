unit_id: infotheory.phi.star_norm-0
status: profiled
correctness:
  metric_name_standard: integrated information Phi* (mismatched-decoding Phi, Gaussian), unnormalised, nats
  canonical_ref: 'Oizumi M, Amari S, Yanagawa T, Fujii N, Tsuchiya N (2016) ''Measuring integrated information from the decoding perspective'',
    PLoS Comput Biol 12:e1004654: Eq. 9 (Phi* = I - I*), Eq. 8 mismatched decoder q(X_t|X_t-tau) = prod_i p(M_i,t|M_i,t-tau), Eq. 20
    I* = max_beta tilde-I(beta), Gaussian case in Methods ''Analytical computation of Phi* under the Gaussian assumption'': Eq. 23 (Gaussian
    I), Eq. 24 (conditional covariance), Eq. 25 (closed form of tilde-I(beta)), Eqs. 26-27 (Q and R), Eq. 28 (block-diagonal covariances),
    Eqs. 29-33 (d tilde-I/d beta); the same Methods text states that I* is ''a convex function with respect to beta'', that d tilde-I/d
    beta = 0 ''is a quadratic equation with respect to beta'', and that ''beta can be analytically computed without resorting to numerical
    optimization'' (statements quoted, not re-derived here; equation numbers from a fetch of the article page, whose equations are images,
    consistent with the vendored code''s comment ''2nd term of eq. (26)'' at phi_star_Gauss.m:87 and utility/I_s_I_s_d.m:2); mismatched
    decoding: Merhav et al. 1994 IEEE Trans Inf Theory 40:1953 (supplement [54]); PhiToolbox: Kitazono & Oizumi 2020 (supplement [52]).'
  canonical_definition: 'Phi* = I(X_{t-tau}; X_t) - I*(X_{t-tau}; X_t), I* = max_beta tilde-I(beta), tilde-I(beta) = -sum_y p(y) log
    sum_x p(x) q(y|x)^beta + sum_{x,y} p(x,y) log q(y|x)^beta with q(y|x) = prod_k p(y_k|x_k) over the parts of the partition; for the
    bivariate atomic partition the parts are the two channels. Gaussian case: tilde-I(beta) = 1/2 log|Q^-1| + 1/2 log|Sigma_X| + 1/2
    tr(Sigma_Y R) - beta N/2, Q^-1 = Sigma_X^-1 + beta A_D'' D^-1 A_D, R = beta D^-1 - beta^2 D^-1 A_D Q A_D'' D^-1 (A_D, D block-diagonal
    regression and residual covariance of each part). Property 0 <= Phi* <= I.'
  documented_definition: 'supplement §1.4.10, p.12 (supplement.txt lines 550-562; keywords line 551 ''undirected, nonlinear, unsigned,
    bivariate, time-dependent''): ''We implement two proxy measures for IIT 2.0 [51] from the PhiToolbox [52]''; ''Phi* is a proxy of
    integrated information [53]. It is an undirected measure that uses the concept of mismatched decoding in information theory [54]
    and can be considered as the amount of loss of information due to the disconnection between two variables.'' ''Both measures are
    optionally normalized (divided) by entropy (denoted by the modifier norm)'' (supplement §1.4.10, p.12, line 564). GitBook information-theory.md
    lines 111-133 repeat the same text. Identifier phi_star_t-1_norm-0.'
  delegate_lib: 'pyspi (pyspi/lib/phi_native.py, native port of PhiToolbox phi_star_Gauss.m) + scipy==1.17.1 scipy.linalg.solve/inv
    and scipy.optimize.minimize(method=''L-BFGS-B''); executed: phi_native.phi_comp -> phi_star_gauss'
  implemented_as: Calculator default z-scores each channel (ddof=1). For pair (i,j), rows [i,j] form a 2xT array; tau = delay = 1; past
    window X1 = x[:, 0:T-1], present X2 = x[:, 1:T], each centred by its own mean, covariances with denominator T-2 (Cov_X, Cov_Y, Cov_XY
    = E[X(t-1)X(t)']); partition [1,2] (each channel its own part; the only bipartition, so no MIP search). I = H(Y) - H(Y|X) from Gaussian
    log-determinants; I_s(beta) is the closed-form Gaussian tilde-I(beta) of the per-channel mismatched decoder; beta maximised by scipy
    L-BFGS-B from beta=1 with finite-difference gradient and default tolerances (pgtol 1e-5), unbounded; Phi* = I - I_s(beta_opt) in
    nats. The closed form was re-derived from scratch in a probe and matches i_s_objective term by term (tr(D^-1 S) = N gives the beta*N/2
    constant). Any exception inside bivariate returns NaN (logged).
  implementation_trace:
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend); defaults normalise=True,
    detrend=False (calculator.py:48-50)
  - pyspi/data.py:184-195 optional scipy.signal.detrend, then scipy.stats.zscore(data, axis=1, nan_policy='omit', ddof=1)
  - pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset)
  - 'pyspi/base.py:132-138 Undirected.multivariate -> Directed.multivariate (base.py:85-94: every ordered pair i != j calls bivariate)
    then A[li] = A.T[li] copies the upper triangle (bivariate(i,j), i<j) into the lower'
  - pyspi/base.py:27-47 parse_bivariate (two raw arrays are wrapped by Data.add_process; see open questions on preprocessing of that
    path)
  - pyspi/statistics/infotheory.py:537-547 IntegratedInformation(Undirected, Unsigned); labels ['linear','unsigned','infotheory','temporal','undirected'];
    identifier phi_{phitype}_t-{delay}_norm-{normalization}
  - 'pyspi/statistics/infotheory.py:549-573 bivariate: P = np.array([1, 2]) (atomic bipartition), X = data.to_numpy(squeeze=True)[[i,
    j]], params {''tau'': delay}, options {type_of_phi, type_of_dist ''Gauss'', normalization}; phi_comp(X, P, params, options); any
    exception -> logging.error and np.nan'
  - 'pyspi/lib/phi_native.py:394-433/443 phi_comp: cov_comp(X, tau, isjoint=True) then phi_star_gauss or phi_g_gauss'
  - 'pyspi/lib/phi_native.py:46-77 cov_comp: X1 = X[:, :T-tau], X2 = X[:, tau:], each centred by its own mean; Cov_X = X1 X1''/(T-tau-1),
    Cov_Y = X2 X2''/(T-tau-1), Cov_XY = X1 X2''/(T-tau-1) (= E[X(t-tau) X(t)''])'
  - 'pyspi/lib/phi_native.py:21-43 logdet: Cholesky 2*sum(log(diag L)); on LinAlgError np.linalg.eigvals, keeps eigenvalues > 1e-12,
    returns sum(log) (complex dtype); -inf if none kept'
  - pyspi/lib/phi_native.py:104-115 h_gauss = 0.5*logdet(C) + 0.5*n*log(2*pi*e) (nats)
  - 'pyspi/lib/phi_native.py:148-178 phi_star_gauss: Cov_Y_X = Cov_Y - Cov_YX Cov_X^-1 Cov_XY (cov_cond 84-101, scipy.linalg.solve,
    pinv fallback); I = h_gauss(Cov_Y) - h_gauss(Cov_Y_X); returns NaN if H_cond is inf (169-171)'
  - 'pyspi/lib/phi_native.py:180-199 per-part blocks: X_D = blockdiag Cov_X, YX_D = blockdiag Cov_XY'', C_D_cond = blockdiag conditional
    covariances (the mismatched decoder q(y|x) = prod_k p(y_k|x_k))'
  - pyspi/lib/phi_native.py:202-214 C_D_beta1_inv = X_D^-1 YX_D' C_D_cond^-1 YX_D X_D^-1 (= A_D' D^-1 A_D), S_left = C_D_cond'^-1 YX_D
    X_D^-1, S_right = X_D^-1 YX_D' C_D_cond^-1, constant N/2
  - 'pyspi/lib/phi_native.py:118-145 i_s_objective(beta): Q_inv = Cov_X^-1 + beta*C_D_beta1_inv; I_s = 0.5 logdet(Q_inv) + 0.5 logdet(Cov_X)
    + 0.5 tr(Cov_Y R) - beta*N/2 with R = beta*inv(C_D_cond) - beta^2 S_left Q_inv^-1 S_right; inv(C_D_cond) recomputed on every call
    (line 136); LinAlgError -> +inf'
  - pyspi/lib/phi_native.py:216-225 scipy.optimize.minimize(i_s_objective, beta_init=1.0, method='L-BFGS-B'), no bounds, no jac (finite-difference
    gradient), default tolerances (pgtol 1e-5); I_s = -result.fun
  - 'pyspi/lib/phi_native.py:232-246 phi_star = I - I_s; normalization==1: divide by (N_c-1)*min_k h_gauss(Cov_X[M_k, M_k]) (N_c=2 ->
    min of the two PAST marginal Gaussian entropies)'
  - scipy.optimize (.venv/lib/python3.12/site-packages/scipy/optimize/_lbfgsb_py.py:294-296 _minimize_lbfgsb defaults gtol=1e-5, ftol=2.2e-09;
    jac=None -> 2-point finite differences)
  - 'MATLAB/Octave, pyspi vendored PhiToolbox copy (see note at end of entry) (git show 76ab2bb^:pyspi/lib/PhiToolbox/Phi/phi_star_Gauss.m:50-126;
    utility/I_s_I_s_d.m:1-17; utility/Gauss/logdet.m:1-9; Cov_comp.m:25-47; Cov_cond.m:14; H_gauss.m:13-14): identical algebra; fminunc(fh,
    beta, Options) at phi_star_Gauss.m:108 with Options.Method=''lbfgs'' (a minFunc field) and no GradObj, so Octave 8.4 fminunc (/usr/share/octave/8.4.0/m/optimization/fminunc.m:130,147:
    GradObj default ''off'') used finite differences in the vendored copy and its analytic gradient (I_s_I_s_d.m:12-16) was not consumed
    there; upstream PhiToolbox calls minFunc(@I_s_I_s_d, beta, Options), and minFunc uses the gradient returned as the second output,
    so the published toolbox maximises beta with the analytic gradient. Provenance: pyspi''s vendored PhiToolbox copy (git show 76ab2bb^:pyspi/lib/PhiToolbox;
    Phi/phi_star_Gauss.m there calls fminunc(fh, beta, Options) at line 108 where upstream oizumi-lab/PhiToolbox master calls minFunc(@I_s_I_s_d,
    beta, Options); phi_G_Gauss.m, phi_G_Gauss_AL.m and utility/Gauss/logdet.m are identical to upstream master apart from whitespace
    (diff -w against raw.githubusercontent.com/oizumi-lab/PhiToolbox/master, fetched 2026-10-14))'
  deviation_from_documented: 'Supplement keyword ''nonlinear'' (and config.yaml label) contradicts the Gaussian/linear implementation
    and the class label ''linear''. Otherwise the prose matches (undirected; Gaussian model; PhiToolbox algorithm). Beyond the prose:
    the documented ''proxy ... from the PhiToolbox'' is reproduced in Python; the optimiser matches pyspi''s vendored MATLAB copy (fminunc,
    finite differences) but not the published PhiToolbox, which uses minFunc L-BFGS with the analytic gradient of I_s_I_s_d; the native
    finite-difference L-BFGS-B is therefore a behavioural change relative to the toolbox the supplement cites [52] (size of the effect
    relative to minFunc not measured).'
  deviation_from_canonical: 'Structure matches Oizumi et al. 2016 (Phi* = I - max_beta tilde-I) with plug-in sample covariances. Deviations:
    (1) the maximisation is approximate: L-BFGS-B stops at the initial beta = 1 whenever |d tilde-I/d beta| < 1e-5, so I* is under-estimated
    and Phi* over-estimated; absolute error up to ~5e-8 (max 4.65e-8 on narrowband_f0-0.25 T256 pair (1,2), phi* 3.891, pyspi beta stuck
    at 1.0 vs reference 0.922; next 3.3e-8 and 2.8e-8, all nit 0; over 136 pairs = 8 datasets x T in {64,256,1024,4096}), relative error
    up to ~6.4e-4 on near-null pairs (probe iid_gaussian T1024 (2,3): 1.50073e-05 vs independent maximum 1.49977e-05); inherited from
    pyspi''s vendored PhiToolbox copy (fminunc, finite differences), whose Octave run gives 1.50072e-05. (2) beta is unconstrained;
    the paper (Methods) states that d tilde-I/d beta = 0 is quadratic in beta so beta can be computed analytically, whereas pyspi (like
    PhiToolbox) optimises numerically; all probe optima were 0.64-1.33. (3) degenerate (singular) covariances: a singular conditional
    covariance gives finite/complex values via the logdet eigenvalue filter instead of +inf/undefined (exact one-step delay pair); an
    exactly singular Cov_X (bit-identical copy, T <= 1024) gives NaN with a UserWarning; a numerically ill-conditioned Cov_X (same copy
    at T=4096) lets a complex logdet reach scipy.optimize.minimize, which raises TypeError -> NaN via the class except. None of these
    is +inf. Plug-in sample covariances with separate past/present means and T-2 denominators (the denominator cancels in the unnormalised
    value). Check-stage correction: (2) the stationarity condition is not quadratic in beta for the atomic bipartition in this parametrisation:
    d tilde-I/d beta x det(Q^-1)^2 is a quartic (dI x det(Q^-1) is not a polynomial) with exactly one positive root, the optimum (D15
    0.86440, D5 0.96505), and tilde-I is concave in beta (scratchpad phi_check/beta_poly.py; pop runs ref_deriv_numerator_poly_degree
    4, ref_deriv_decreasing_on_0_6 1). (3) on the exact-delay construction the check runs give small NEGATIVE values (z-scored -0.00110,
    raw -0.0215 at delayed_noise T1024), not only finite/complex ones.'
  units_and_range: 'nats; 0 <= Phi* <= I in theory, finite-sample positive bias on independent data; invariant to per-channel affine
    rescaling; symmetric; NaN when an exception occurs (e.g. constant channel); degenerate pairs never give inf: an exactly predictable
    pair gives finite or complex-typed values, a bit-identical copy gives NaN at T <= 1024 and, at T=4096, NaN (star, TypeError caught)
    or a finite negative value -0.3466 (Geo). Check stage: exactly predictable pairs can also return small negative values (exact-delay
    construction, delayed_noise T1024).'
  direction_convention: 'Undirected: A[i,j] = A[j,i] = value of bivariate(min(i,j), max(i,j)) on rows [i, j] with partition [1, 2] (base.py:136-137
    mirrors the upper triangle; the lower-triangle bivariate calls are computed and discarded). The quantity is symmetric under swapping
    the parts; computing the pair in the other row order differs only by optimiser tolerance. Probe on the Calculator/Data path (both
    rows z-scored, phi_comp on rows [0,1] vs [1,0], gauss_ar1_pair T4096): star 0.031018450195045 vs 0.031018450195543 (diff -5.0e-13),
    Geo 0.08925335492965669 in both orders (bit-identical). The larger gaps seen earlier (star 7.0e-13, Geo 1.3e-9) came from the raw-array
    call spi.bivariate(x0, x1) vs (x1, x0), where parse_bivariate z-scores only the first array (data.py:219-238), so they are not the
    Calculator-path numbers. Off-diagonal entries of the returned matrix are bitwise equal (var2_chain T1024: np.array_equal(A[off],
    A.T[off]) True); np.array_equal(A, A.T) is False only because the diagonal is NaN, and np.array_equal(A, A.T, equal_nan=True) is
    True.'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (optimiser accuracy): L-BFGS-B with default pgtol 1e-5 terminates at beta_init = 1 without iterating when the finite-difference
    gradient is below 1e-5, leaving Phi* too large by up to ~5e-8 absolute (~6.4e-4 relative on near-null pairs). Evidence: probe5 spy
    on minimize: ''nit 0 nfev 2 x [1.] jac [9.70e-06] CONVERGENCE: NORM OF PROJECTED GRADIENT <= PGTOL'' for iid_gaussian T1024 (2,3);
    differences vs the from-scratch maximiser all >= -9e-16 over 136 pairs (8 datasets x T in {64,256,1024,4096}); max 4.65e-8 (narrowband_f0-0.25
    T256 (1,2)), then 3.3e-8 and 2.8e-8 (narrowband T1024), all with nit 0; the earlier figure 9.55e-09 is the absolute gap of the
    iid_gaussian T1024 (2,3) pair (that pair''s relative gap, 6.4e-4, is the largest relative gap), misread as the maximum of probe2''s T in {64,1024} subset, which also held narrowband_f0-0.25 T1024
    (0,1) at 3.35e-8. Same-lineage Octave run of pyspi''s vendored copy (fminunc, finite differences) stops similarly (beta 0.99999,
    phi 1.50072e-05). Whether upstream minFunc with the analytic gradient also stops at beta = 1 (its own first-order tolerance) is
    not checked here.'
  - 'Candidate (hypothesis check, confirmed relative to the published toolbox): ''MATLAB original had an analytic gradient''. Upstream
    oizumi-lab/PhiToolbox Phi/phi_star_Gauss.m calls ''[beta_opt,minus_I_s,~,~] = minFunc(@I_s_I_s_d,beta,Options);'' with Options.Method=''lbfgs'',
    and minFunc consumes the gradient returned as the second output of I_s_I_s_d (I_s_I_s_d.m:12-16), so the published algorithm used
    the analytic gradient. pyspi''s vendored copy (git ef478a8 initial commit, removed in 76ab2bb) replaced that call with fminunc(fh,
    beta, Options) at phi_star_Gauss.m:108 while keeping the minFunc header (lines 29-31) and the ''% set options of minFunc'' comment
    (line 99); with no GradObj, Octave 8.4 fminunc.m:130,147 defaults GradObj ''off'', so the vendored path used finite differences.
    The native port''s finite-difference L-BFGS-B therefore reproduces the vendored copy but is a behavioural change relative to the
    published toolbox. inv(C_D_cond) recomputed per objective evaluation: confirmed in both (phi_native.py:136, I_s_I_s_d.m:6) -- efficiency
    only.'
  - 'Candidate (degenerate input handling): logdet''s eigenvalue fallback (phi_native.py:37-43) silently drops eigenvalues <= 1e-12,
    including negative ones, and returns a complex-dtype number; for a singular conditional covariance this replaces -inf by a finite
    value, so an exactly predictable pair can be reported as almost unintegrated. Evidence: probe6 exact one-step delay pair, eig(Cov_Y|X)
    = [-2.2e-16, 1.0015] on z-scored input -> Cholesky fails -> logdet 0.00153+0j -> phi* 0.000636+0j; the same series unnormalised
    has eigenvalue +2.2e-16 -> Cholesky succeeds -> phi* 18.03. The guards np.isinf(H_cond) / np.iscomplex(H_cond) (lines 169-175) never
    fire because the fallback filters zeros and np.iscomplex(x+0j) is False. MATLAB logdet.m used log(det(X)) (-inf or complex). Bit-identical
    copies (shared_envelope (0,2), rows still bit-identical after the Data z-score) do NOT go through the logdet fallback on the Calculator/Data
    path: at T = 64, 256 and 1024 scipy.linalg.inv(Cov_X) (phi_native.py:203, star) and scipy.linalg.solve(Cov_X, Cov_XY) (phi_native.py:374,
    Geo) raise LinAlgError and both return NaN with UserWarning ''Matrix inversion failed in phi_star computation'' / ''Singular covariance
    matrix in phi_G computation''. At T = 4096 the computed Cov_X is only ill-conditioned (LinAlgWarning, no exception): star then raises
    TypeError "''<'' not supported between instances of ''complex'' and ''float''" inside L-BFGS-B once a complex logdet reaches the
    objective, which bivariate''s except (infotheory.py:571-573) logs and turns into NaN, while Geo returns a finite NEGATIVE value
    -0.3465735902 (numerically -ln(2)/2), below the canonical lower bound 0. The finite values 0.0657 (phi*) and 0.2350 (phi_G) quoted
    earlier come only from the raw-array call spi.bivariate(x[0], x[2]) at T1024, where the second array is not z-scored (channels affinely
    related, not identical); that path gives other T-dependent finite/complex values (probe T256 star 0.2689+0j, T4096 star -0.0293+0j).
    Outcome therefore depends on T and on the call path.'
  - 'Candidate (documentation/labels): supplement §1.4.10 keywords and config.yaml:616-622 say ''nonlinear'', while the class labels
    say ''linear'' (infotheory.py:541) and the estimator is purely Gaussian/second-order (cov_comp); config labels are not used at runtime
    (calculator.py:253-259 instantiates the class, spi.labels is the class attribute). The supplement also says ''normalized (divided)
    by entropy'' without stating which entropy (code: min of the past marginal entropies).'
