optimisation:
  complexity_P_T: 'O(P^2 T^2): tslearn dtw with the Sakoe-Chiba radius-1 mask per ordered pair (TimeWarping is Undirected over Directed.multivariate,
    both orders computed, pyspi/statistics/distance.py:TimeWarping.bivariate), a T x T mask plus a numba DP over the full grid. Measured P_exponent
    2.08, T_exponent -0.22 (8x256 -> 8x1024; a fixed per-call cost of tens of microseconds and a ~50 ms 8x256 overhead flatten it); 118x1024 measured
    (9.49 s per window). The P^2 pair term dominates.'
  hotspot_1: 'tslearn/metrics/_dtw.py:dtw (third-party:tslearn) 83.0% self time of the profiled SPI call at 8x1024: the numba T x T mask build
    and full-grid scan (only 3T-2 cells do work)'
  hotspot_2: tslearn/backend/backend.py:instantiate_backend (third-party:tslearn) 13.4%, of which numpy arrayprint 10.9%
  hotspot_owner: third-party:tslearn
  opaque_share: 0.04
  profile_file: audit/profiles/distance.dtw.constraint-sakoe_chiba__8x1024.pstats
  opportunities:
  - opportunity_id: dtw_family-2
    opportunity: 'Banded DP for the constrained DTW: iterate only over the admissible cells (|i - j| <= 1 for sakoe_chiba: 3T-2 cells, 0.29% of
      the grid at T=1024; the Itakura parallelogram rows for itakura, about 1/3 of the grid) instead of scanning the whole T x T mask; cells outside
      the mask stay +inf exactly as now.'
