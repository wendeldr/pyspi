  what_changed: 'tslearn''s DTW is sqrt(min over warping paths of sum (x_i - y_j)^2) with weight-1 steps and no length normalisation. Sakoe & Chiba 1978 (symmetric
    form, P = 0) uses |x_i - y_j| with diagonal weight 2 and divides by n + m. On this unit''s 4 canon runs the two disagree in scale by a factor 24.4-51.1 (pyspi / 1978 form) and in ranking (Spearman 0.76-0.94 over the 6 pairs of a dataset), so this is a value-changing convention rather than a constant factor. In addition the band radius is fixed at 1 sample
    at every T (tslearn default, pyspi passes no radius), an undocumented choice. Sakoe & Chiba treat r as a tuning parameter, usually a fraction of the length;
    with r = 1 the SPI absorbs at most a 1-sample shift and stays at 70-74% of the lock-step Euclidean distance on noise, so it behaves as a slightly relaxed Euclidean distance. Documented statement the r = 1 band contradicts: the supplement (supplement.txt:283-286; GitBook distance-similarity.md:150) describes DTW as finding the minimum distance ''through alignment (shifting and dilating of the sequences)'' and adds the band ''to prevent pathological warpings''. With r = 1 the band also prevents ordinary shifts: delays of 3 and 5 samples keep dtw/||z0 - zk|| at 0.724 / 0.731 (distance.dtw.constraint-sakoe_chiba|delayed_noise|1024|pipeline|delay), against 0.098 / 0.123 under the itakura parallelogram on the same data (distance.dtw.constraint-itakura|delayed_noise|1024|pipeline|delay). The unit therefore deviates from the documented description as well as from canonical practice, in an interpretable way (rubric 6); the itakura unit (rubric 7) does perform the documented shifting.'
