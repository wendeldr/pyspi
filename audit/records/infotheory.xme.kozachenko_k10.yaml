unit_id: infotheory.xme.kozachenko_k10
status: profiled
correctness:
  metric_name_standard: Lagged conditional entropy of the target present given the source past (pyspi 'cross-map entropy', history_length=10; actually 9 source lags), Kozachenko-Leonenko estimate
  canonical_ref: 'No published definition of ''cross-map entropy'' found. Closest standard quantity: the conditional differential entropy of the target''s present given the source''s past, H(Y_t | X_{t-1},...,X_{t-k})
    (Cover & Thomas 2006, Elements of Information Theory 2nd ed. §8.4; h(Y|X) = h(X,Y) - h(X)). The name echoes convergent cross mapping (Sugihara et al. 2012 Science 338:496-500), but no cross-mapping
    is performed. Estimator Kozachenko & Leonenko (1987); Kraskov et al. (2004) Eq. (20).'
  canonical_definition: 'Reading ''history length k'' as the k most recent source samples: H(Y_t | X_{t-1..t-k}); for k=10, conditioning on x_{t-1},...,x_{t-10} (joint dimension 11).'
  documented_definition: No supplement section (supplement.txt has no 'xme', 'cross-map entropy' or 'crossmap' entry). GitBook table-of-spis.md line 73 only lists 'Cross-Map Entropy', base identifier xme,
    with xme_kozachenko_k1 and xme_kozachenko_k10; information-theory.md has no xme section. Class name 'Cross-map entropy' (infotheory.py:396); config.yaml:439-446 labels 'unsigned, directed, time-dependent,
    bivariate'. The documented meaning of history_length is therefore only implicit in the identifier suffix _k1/_k10.
  delegate_lib: JIDT jar (labelled 1.6.1, post-tag build matching commit a9b6b3e77c) EntropyCalculatorMultiVariateKozachenko.computeAverageLocalOfObservations, d=10 and d=9
  implemented_as: 'k=10: targ_future = z_j[10:] (t = 10..T-1); src_past columns src[9:-1] (lag 1) then src[10-m:-m] for m = 2..9 (lags 2..9). So 9 source lags, not 10, and the sample at t-10 is never used,
    although the first 10 targets are dropped. A[i,j] = H_KL([x_{t-1..t-9}, y_t]) - H_KL(x_{t-1..t-9}) over T-10 rows (d = 10 and 9). Noise 1e-8 seed 42, Euclidean, nats, no Theiler window.'
  implementation_trace:
  - 'pyspi/calculator.py:277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (normalise=True default, :50); pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset);
    pyspi/calculator.py:332 np.fill_diagonal(S, np.nan) (HEAD lines)'
  - 'pyspi/base.py:85-94 Directed.multivariate: A[i,j] = bivariate(data, i=i, j=j)'
  - 'pyspi/config.yaml:439-464 CrossmapEntropy configs: estimator kozachenko with history_length 1 and 10'
  - pyspi/statistics/infotheory.py:394-403 CrossmapEntropy(history_length=10 default); identifier suffix _k{history_length}
  - 'pyspi/statistics/infotheory.py:405-415 bivariate: src, targ = z[i], z[j]; targ_future = targ[k:]; src_past = src[k-1:-1]; loop ''for i in range(2, k)'' appends src[k-i:-i] (loop variable shadows the
    argument i; harmless because i is not used afterwards)'
  - pyspi/statistics/infotheory.py:416-426 joint = [src_past, targ_future]; H_xy = H_KL(joint); H_y = H_KL(src_past); return H_xy - H_y
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java:179-219 (noise seed 42, no normalisation)
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/kozachenko/EntropyCalculatorMultiVariateKozachenko.java:82-115
  - JIDT v1.6.1 java/source/infodynamics/utils/EuclideanUtils.java:30,69-75,85-110
  deviation_from_documented: 'No definition is documented. Against the identifier suffix _k10: only 9 source lags are used (probe3: k=10 -> 9 columns; first row target t=10 with source times 9..1). Label
    ''linear'' vs nonparametric estimator. The name ''cross-map'' does not describe the computation.'
  deviation_from_canonical: '(a) Off-by-one: history_length=k gives k-1 source lags for k >= 2 (k=1 and k=2 both give one lag). (b) For T >= 2011 (T-10 > 2000 rows) the JIDT naive-distance defect corrupts
    both 10-d and 9-d entropies. Probe6: T=2010 (2000 rows) pyspi 1.4637 = ref 1.4637; T=2011 (2001 rows) pyspi -0.2084 vs ref 1.4626. T=4096: var2_bivariate -0.048 vs ref 1.329; iid_gaussian -0.156 vs
    1.458. (c) Separate KL estimates in d=10 and d=9 with no bias cancellation. As coded, the composition is reproduced by a from-scratch KL to <= 2.3e-14 with noise off (probe3, T=256).'
  units_and_range: 'Nats; real, unbounded, can be negative (pipeline T=4096 values go negative through the defect). Ties make it noise-dominated (logistic_maps T=1024: -1.80 / 99.16). Labelled ''unsigned''.
    Asymmetric.'
  direction_convention: 'A[i,j] = H(x_j(t) | x_i(t-1..t-9)): row i = source, column j = target (infotheory.py:407-416). var2_bivariate (x0 -> x1) T=1024: A[0,1]=1.315 < A[1,0]=1.509 (probe7). At T=256 the
    ordering is reversed (1.561 vs 1.527, probe3), within estimator noise in d=10.'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (off-by-one): history_length=10 yields 9 source lags. infotheory.py:410-414 builds src[k-1:-1] plus ''for i in range(2, k)'' -> lags 1..k-1. Probe3: xme_ref column count k=1 -> 1, k=2 ->
    1, k=10 -> 9; first row of the k=10 design pairs target time 10 with source times [9 8 7 6 5 4 3 2 1]. The same composition is used by xme_gaussian_k10 and xme_kernel_k10 (hypothesis for those families).'
  - 'Candidate (third-party defect inherited, large effect): for T >= 2011 the JIDT naive NN path is used and xme_kozachenko_k10 jumps. Probe6: T=2010 1.4637 (= reference) vs T=2011 -0.2084 (reference 1.4626);
    T=4096 var2_bivariate -0.048 vs 1.329, iid_gaussian -0.156 vs 1.458.'
  - 'Candidate (naming/doc): no documented definition; no cross-mapping performed.'
  - 'Candidate (label): ''linear'' label for the nonparametric KL variant (probe1).'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
