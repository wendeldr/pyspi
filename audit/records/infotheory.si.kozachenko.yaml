unit_id: infotheory.si.kozachenko
status: profiled
correctness:
  metric_name_standard: Stochastic interaction (first-order Markov / one-step version) of the bivariate process, Kozachenko-Leonenko estimate
  canonical_ref: Ay N (2001/2015) "Information geometry on complexity and stochastic interaction", Entropy 17:2432-2458 (supplement ref. [47]); Ay N, Wennekers T (2003) "Temporal infomax leads to almost
    deterministic dynamical systems", Neurocomputing 52-54:461-466 (supplement ref. [48]); Barrett AB, Seth AK (2011) "Practical measures of integrated information for time-series data", PLoS Comput Biol
    7:e1001052 (SI for continuous/Gaussian processes). Estimator Kozachenko & Leonenko (1987); Kraskov et al. (2004) Eq. (20).
  canonical_definition: 'For a stationary Markov process X = (X^1, X^2) with lag tau: SI_tau = sum_k H(X^k_t | X^k_{t-tau}) - H(X_t | X_{t-tau}) >= 0 (a KL divergence between the joint transition kernel
    and the product of the marginal kernels); 0 when the two components evolve independently.'
  documented_definition: 'Supplement §1.4.9, p.12 (supplement.txt:539; the pack lists 551): "a measure of integrated information between two processes in the context of their own past. It is quantified
    by the difference between the joint entropy of the bivariate process and the individual entropies of each univariate process. Both entropies are measured in context of (conditioned on) the history of
    the processes; we restrict this history to be only one-step, assuming a first-order Markov process"; keywords "undirected, nonlinear, unsigned, bivariate, time-dependent"; SPI 89 si_kozachenko_k-1.
    GitBook information-theory.md lines 184-200 (same text).'
  delegate_lib: JIDT jar (labelled 1.6.1, post-tag build matching commit a9b6b3e77c) EntropyCalculatorMultiVariateKozachenko.computeAverageLocalOfObservations (d = 1, 2, 4)
  implemented_as: 'delay tau = 1 (StochasticInteraction(delay=1) default; identifier suffix _k-1). With x, y = z_i, z_j as (T,1) columns and xy = [x, y]: H_joint = H_KL([xy_t, xy_{t-1}]) - H_KL(xy_{t-1})
    (d = 4 and 2), H_src = H_KL([x_t, x_{t-1}]) - H_KL(x_{t-1}), H_targ likewise for y (d = 2 and 1); A[i,j] = H_src + H_targ - H_joint. Six independent KL estimates over T-1 rows. Undirected.multivariate
    computes both orders and mirrors the upper triangle.'
  implementation_trace:
  - 'pyspi/calculator.py:277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (normalise=True default, :50); pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset);
    pyspi/calculator.py:332 np.fill_diagonal(S, np.nan) (HEAD lines)'
  - pyspi/base.py:132-138 Undirected.multivariate -> Directed.multivariate (85-94) then mirror upper -> lower
  - pyspi/statistics/infotheory.py:513-522 StochasticInteraction(delay=1), identifier += _k-{delay}
  - 'pyspi/statistics/infotheory.py:524-534 bivariate: x, y = data.to_numpy()[[i, j]]; xy = concat; three _compute_conditional_entropy calls; return H_src + H_targ - H_joint'
  - pyspi/statistics/infotheory.py:180-193 _compute_conditional_entropy(X, Y) = H([X,Y]) - H(Y)
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java:179-219
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/kozachenko/EntropyCalculatorMultiVariateKozachenko.java:82-115
  - JIDT v1.6.1 java/source/infodynamics/utils/EuclideanUtils.java:30,69-75,85-110
  deviation_from_documented: 'The formula matches the prose up to its ordering: the prose says ''difference between the joint entropy ... and the individual entropies'', while the code returns individual
    minus joint (the canonical sign). Label ''linear'' (infotheory.py:53-54) vs documented ''nonlinear''. Otherwise none.'
  deviation_from_canonical: 'The formula matches Ay''s SI with tau=1. A from-scratch KL composition reproduces A[0,1] to <= 1.3e-15 with noise off (probe3; var2_bivariate, iid_gaussian T=256). Estimator
    level: six separate KL estimates in dimensions 1, 2, 4 do not cancel biases, so the null value is not 0 and the sign is not guaranteed. iid_gaussian pair (0,1): -0.31 (T=64), -0.23 (T=256), +0.23 (T=1024),
    +0.13 (T=4096) (probe4). Across iid T=64 pairs the spread is -0.48..+0.36 (probe7). gauss_ar1_pair T=1024 gives 0.025 vs a Gaussian population value of 0.0999 (computed from A, Sigma_E with solve_discrete_lyapunov).
    For T > 2001 the naive-distance defect touches the d=4 terms, but the effect is small here (probe6 T=4096: var2 0.168 vs ref 0.166; iid 0.125 vs 0.120).'
  units_and_range: Nats; canonical value >= 0, but estimates can be negative (probe7 iid_gaussian T=64 down to -0.48). Labelled 'unsigned'. Symmetric.
  direction_convention: 'Undirected: A[i,j] = A[j,i] (formula symmetric up to column order; Undirected.multivariate mirrors). Direct bivariate(0,1) vs bivariate(1,0) differ only at noise level (-0.171670528
    vs -0.171670600, probe3) and are identical with noise off.'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (estimator behaviour): the KL composition gives nonzero, sign-varying null values and a large relative bias on a known Gaussian process. iid_gaussian pair (0,1) -0.31/-0.23/+0.23/+0.13 at
    T=64/256/1024/4096 (probe4); gauss_ar1_pair T=1024 0.025 vs population 0.0999. The supplement says that summing separate entropy estimates introduces bias (§1.4, KSG bullet), so this is expected behaviour
    of the chosen construction, recorded for interpretation.'
  - 'Candidate (label): ''linear'' label for the nonparametric KL variant (probe1: [''unsigned'',''infotheory'',''temporal'',''undirected'',''linear'']).'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
