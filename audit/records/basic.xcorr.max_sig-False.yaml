optimisation:
  complexity_P_T: 'O(P^2 T log T): pyspi/statistics/basic.py:CrossCorrelation.bivariate runs scipy.signal.correlate(x, y, ''full'') once per unordered pair (data.xcorr caches the second ordered call); method=''auto''
    picks fftconvolve at T=1024 (all 28 calls in the 8x1024 profile), then O(T) std, normalisation and window slicing. Measured fresh P_exponent 2.06, T_exponent 0.09; at 118x1024 the pair term dominates
    (6903 correlate calls, ~0.18 ms each).'
  hotspot_1: scipy/signal/_signaltools.py:correlate -> fftconvolve (third-party:scipy) 72.1% of the profiled SPI call at 8x1024
  hotspot_2: numpy/_core/_methods.py:_std (third-party:numpy) 13.8% at 8x1024 (two std calls per pair); pyspi/statistics/basic.py:CrossCorrelation.bivariate self time 7.9%
  hotspot_owner: third-party:scipy
  opaque_share: 0.314
  profile_file: audit/profiles/basic.xcorr.max_sig-False__8x1024.pstats
  eeg_basis: fresh
  basis_scope_note: 'CrossCorrelation.bivariate caches each pair''s cross-correlation in data.xcorr (pyspi/statistics/basic.py:95-113), shared by every CrossCorrelation identifier on the Data.
    The family-warm run at 118x1024 filled it on xcorr_max_sig-True (1.37 s), which is outside the EEG selection. pyspi/workflow/retained185.yaml:98-109 lists statistic max
    before mean and the workflow computes in that order (pyspi/workflow/_run.py:108-116), so in an EEG run xcorr_max_sig-False is the first CrossCorrelation identifier and fills
    the cache. The family-warm figure (0.0862 s per window) leaves that out; the fresh projection (both identifiers in one fresh process, 1.24 s per window) includes it and
    stands for the unit''s EEG cost'
  opportunities:
  - opportunity_id: xcorr-1
    opportunity: 'Compute every pair''s cross-correlation from one rfft per channel: for each a, one batched irfft of F[b]*conj(F[a]) over b>a, keep the 2*(T//4) lags of pyspi''s window in its (higher index,
      lower index) orientation, normalise by the channel std once, and cache the (P, P, 2*(T//4)) array on Data for all eight xcorr identifiers (replaces scipy.signal.correlate per pair in basic.py:CrossCorrelation.bivariate).'
    opp_type: vectorise-batch
    expected_speedup: ~15x
    speedup_basis: 'microbench:audit/profiles/micro/opp_xcorr-1.json (118x1024: xcorr_mean_sig-False 1.18 s -> 0.076 s = 15.5x; xcorr_max_sig-False 1.15 s -> 0.068 s = 16.9x; xcorr-sq_mean_sig-False 1.19
