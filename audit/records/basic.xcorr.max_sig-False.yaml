unit_id: basic.xcorr.max_sig-False
status: profiled
correctness:
  metric_name_standard: maximum of the sample cross-correlation function over lags |h| <= T/4 (and of its square for the -sq
    identifier)
  canonical_ref: 'Brockwell & Davis, Time Series: Theory and Methods (Springer Science & Business Media, 2009, as cited in
    the supplement; edition not stated there), the supplement''s reference [8] (supplement.txt:1987-1988): sample cross-covariance
    gamma_hat_ij(h), sample cross-correlation rho_hat_ij(h) and the +-1.96 n^-1/2 bound for two independent series of which
    one is white noise. UNVERIFIED locator: the section/theorem numbers (§11.2, Theorem 11.2.2) were recalled from memory
    and no copy of the book was consulted; see Open questions. Lag truncation: the supplement (§1.1.5, p.5; supplement.txt:197-198)
    cites [9] Afyouni, Smith & Nichols 2019, NeuroImage 199:609 and [10] Cliff, Novelli, Fulcher, Shine & Lizier 2021, Phys
    Rev Res 3:013145 (supplement.txt:1990-1995) for the practice of truncating the CCF "at a given level"; the specific T/4
    cut is pyspi''s choice, and no canonical source for it was consulted.'
  canonical_definition: rho_hat_xy(h) = gamma_hat_xy(h) / sqrt(gamma_hat_xx(0) gamma_hat_yy(0)), gamma_hat_xy(h) = (1/n) sum_{t=1}^{n-h}
    (x_{t+h} - xbar)(y_t - ybar) for 0 <= h < n and gamma_hat_xy(h) = gamma_hat_yx(-h) for h < 0 (mean-centred, divisor n
    at every lag, so |rho_hat| <= 1); lag-h sample CCF considered significant when |rho_hat| > 1.96/sqrt(n) (valid under independence
    with at least one white series). The scalar summary (max or mean of the CCF over a lag window) is a pyspi construction
    with no canonical source.
  documented_definition: 'supplement §1.1.5, p.5 (pack lines 197-213; heading at supplement.txt line 192): "The cross-correlation
    function is defined as the Pearson correlation between two time series for all lags [8], giving values in [-1, 1] for
    each lag ... the correlation from the MLE of the cross-covariance at a given lag, normalised by the autocovariance ...
    we do by only using the first T/4 lags ... a correlation below 1.96/sqrt(T) is considered statistically insignificant
    [8], thus we optionally cut-off the lags at this level (sig-True means we only use the statistically significant values,
    and sig-False means we use all values) ... the maximum over the considered lags (max), and the average over the considered
    lags (mean)." Same text on GitBook basic-statistics.md:55-57 (Cross Correlation), which lists xcorr_max_sig-True, xcorr_mean_sig-True,
    xcorr_mean_sig-False and their -sq versions (lines 63-75). [8] = Brockwell & Davis, Time Series: Theory and Methods (supplement.txt:1987).
    NOTE: xcorr_max_sig-False / xcorr-sq_max_sig-False are not among the identifiers listed in the supplement or GitBook;
    the definition is the class description applied with sigonly=False.'
  delegate_lib: scipy==1.17.1 scipy.signal.correlate(x, y, 'full') (method 'auto' -> fftconvolve for the (T,1) inputs); normalisation,
    lag slicing, sigonly window and summary are native pyspi (numpy 2.5.4)
  implemented_as: Input z-scored per channel with ddof=1 (Data default; optional detrend first). For the pair (x=x_hi, y=x_lo)
    pyspi computes z = scipy.signal.correlate(x, y, 'full'), r = z / (std0(x) std0(y) (T-1)) which for z-scored input equals
    T/(T-1) times the Brockwell-Davis sample CCF at every lag, keeps lags -(T//4-1)..+T//4 (2*(T//4) values, one more positive
    than negative lag); sigonly=False uses all 2*(T//4) lags; returns np.max of r (signed) or of r**2 (-sq). No mean removal
    inside the SPI. Result mirrored to a symmetric matrix from the (hi, lo) orientation.
  implementation_trace:
  - pyspi/config.yaml:99-124 CrossCorrelation configs (max, max-sq, mean, mean-sq, mean sig-False, mean-sq sig-False); defaults
    squared=False, statistic='max', sigonly=True from pyspi/statistics/basic.py:80
  - 'pyspi/data.py:184-195 Data.set_data preprocessing: optional scipy.signal.detrend(axis=1) then scipy.stats.zscore(axis=1,
    nan_policy=''omit'', ddof=1) when normalise=True (default)'
  - pyspi/calculator.py:327-339 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset) (:329);
    any exception (except branch :336-339) sets the whole SPI table to NaN, records a failed MetricReport and warns (:355)
  - 'pyspi/base.py:132-138 Undirected.multivariate: calls Directed.multivariate then mirrors A[lower] = A.T[lower] (upper
    triangle kept)'
  - 'pyspi/base.py:85-94 Directed.multivariate: outer loop j, inner loop i != j, A[i,j] = bivariate(data, i=i, j=j); for a
    pair a<b the first call is bivariate(i=b, j=a) (outer j=a comes first)'
  - pyspi/base.py:27-49 parse_bivariate wrapper (wraps two raw arrays into a Data object, passes i, j)
  - 'pyspi/statistics/basic.py:75-92 CrossCorrelation(Undirected, Signed): identifier ''xcorr'' [+''-sq''] + f''_{statistic}_sig-{sigonly}'';
    squared sets issigned False'
  - pyspi/statistics/basic.py:97-104 T = n_observations; x, y = data.to_numpy()[[i, j]] (each shape (T,1)); r = squeeze(scipy.signal.correlate(x,
    y, 'full')) / x.std() / y.std() / (T-1)  (numpy std ddof=0, no mean removal inside the SPI)
  - 'pyspi/statistics/basic.py:107 r = r[T - T//4 : T + T//4] -> 2*(T//4) values at lags -(T//4-1) .. +T//4 (probe: T=64 lags
    -15..16; T=256 lags -63..64; lag 0 at position T//4-1)'
  - 'pyspi/statistics/basic.py:109-113 cache: data.xcorr[(i,j)] = r and data.xcorr[(j,i)] = the SAME unreversed array (r_ji(k)
    should equal r_ij(-k)); the cache is shared by all six xcorr SPIs on the same Data'
  - 'pyspi/statistics/basic.py:116-120 sigonly branch: N = len(r)//2 (= T//4, the element at lag +1); thr = 1.96/sqrt(N);
    fzf = first index in r[N:] with |r| <= thr; fzr = LAST index in r[:N] with |r| <= thr; r = r[N - fzr : N + fzf]; [0][0]
    / [0][-1] on an empty np.where raise IndexError'
  - 'pyspi/statistics/basic.py:122-133 statistic: max -> np.max(r) or np.max(r**2); mean -> np.mean(r) or np.mean(r**2)'
  - scipy 1.17.1 .venv/lib/python3.12/site-packages/scipy/signal/_signaltools.py:104 correlate(in1, in2, mode='full', method='auto');
    docstring :168-170 z[k] = sum_l x_l conj(y_{l-k}), k = -(M-1)..(N-1), output index k+(M-1)
  - scipy _signaltools.py:258-259 method 'auto' -> convolve(in1, _reverse_and_conj(in2, xp), mode, method); :1165-1182 _reverse_and_conj
    reverses every axis (both axes of the (T,1) input)
  - 'scipy _signaltools.py:1377 convolve; :1490-1494 method ''auto'' -> choose_conv_method(volume, kernel, mode) -> fftconvolve;
    :1236-1374 choose_conv_method (:1371 _fftconv_faster). Probe: for (T,1) float64 inputs it returns ''fft'' at T = 64, 256,
    1024, 4096'
  - scipy _signaltools.py:591 fftconvolve -> :706-708 _freq_domain_conv + _apply_conv_mode (FFT-based linear correlation;
    round-off ~1e-16 relative, not exact sums)
  deviation_from_documented: '(1) Normalisation: documented as ''Pearson correlation ... giving values in [-1, 1]'', but r
    = z/(std_ddof0(x) std_ddof0(y)(T-1)) on ddof=1 z-scored input equals T/(T-1) times the sample correlation at every lag
    (probe T=64: lag-0 ratio to Pearson r 1.0158730 = 64/63; ratio to the B&D CCF 1.0158730 at every lag), so identical series
    give 1.0159 > 1 at T=64. (2) Lag window: documented ''first T/4 lags''; implemented lags -(T//4-1)..+T//4 (both sides,
    2*(T//4) lags, asymmetric by one lag). (3) This configuration (statistic=''max'', sigonly=False) is not listed in the
    supplement, the GitBook page or pyspi/config.yaml / fast_config.yaml; it comes from the retained EEG metric list (audit/env/retained_metrics.txt:186,188),
    so its documented definition is inferred from the class description.'
  deviation_from_canonical: Constant inflation by T/(T-1) relative to the B&D sample CCF (divisor (T-1)^2/T instead of T-1
    for z-scored data); window not symmetric about lag 0 (+T//4 included, -T//4 excluded); with normalise=False no centring
    at all (non-centred cross-product), whereas rho_hat is mean-centred; the max/mean summary over lags has no canonical definition
    (pyspi construction); signed max ignores negative peaks (max |rho_hat| is the more common peak-CCF summary; -sq covers
    it).
  units_and_range: Dimensionless, signed (plain) / non-negative (-sq). Nominally in [-1, 1] / [0, 1] but scaled by T/(T-1)
    so can slightly exceed 1 (1.0159 at T=64 for identical series). Symmetric by construction (mirror); channel order matters
    only when the maximum sits on lag +-T//4 (not observed on the datasets, perm-selfcons gap <= 2.2e-16; on a constructed
    pair with the peak at lag T//4 the value changes from 0.7596 to 0.1054 at T=1024, |endlag runs). No error path; finite for finite input. In the EEG selection.
  direction_convention: 'Undirected; A is symmetric by the mirror in pyspi/base.py:137. A[i,j] = A[j,i] = statistic over a
    lag window of r from scipy.signal.correlate(x_hi, x_lo) where hi = max(i,j), lo = min(i,j) (first bivariate call is (i=hi,
    j=lo), and the cache at basic.py:113 returns the same unreversed array for (lo,hi)); probe: data.xcorr[(0,1)] equals the
    slice computed from correlate(x1, x0). Sign convention of the lag axis (probe and scipy docstring :168): a peak at positive
    lag k in correlate(x, y) means x(t) ~ y(t-k), i.e. y leads x by k; so positive lags in the stored r mean the LOWER-index
    channel leads. Same orientation as Brockwell & Davis gamma_12(h) = Cov(X_{t+h,1}, X_{t,2}) with series 1 = x_hi.'
  symmetry_expected: sym
  already_documented: 'no (calculation). Metadata only: docs/storage_comparison/REVIEW.md:200 notes that saved metadata for
    xcorr_max_sig-False and xcorr-sq_max_sig-False lacks pyspi labels and that the summary is mirrored by its implementation.'
