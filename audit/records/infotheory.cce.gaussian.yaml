optimisation:
  complexity_P_T: 'O(P^2 n T n): CausalEntropy._compute_causal_entropy (infotheory.py:439-454) builds, for m = 1..5, delay embeddings with MatrixUtils.makeDelayEmbeddingVector (Java), concatenates them
    with np.concatenate over the returned Java double[][] (iterating rows through JPype: 57,400 __next__ calls at 8x1024) and runs one conditional entropy (2 JIDT calls, 2-D conversions up to T x 10) per
    term: 10 JIDT calls per ordered pair. Measured fresh P exponent 2.12, T exponent 0.98. At 118x1024 the pair term dominates: 370 s projected (extrapolated-pairs-from-32).'
  hotspot_1: 'pyspi/statistics/infotheory.py:CausalEntropy._compute_causal_entropy (third-party:jpype: np.concatenate over Java arrays, self time) 100.0% cum / 55.1% self of the profiled SPI call at 8x1024'
  hotspot_2: 'pyspi/statistics/infotheory.py:JIDTBase._compute_conditional_entropy (third-party:jpype 2-D conversion + jidt, self time) 42.2%; jpype/_jarray.py:__next__ 2.4%. opaque_share is a lower bound:
    JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jpype
  opaque_share: 0.0042
  profile_file: audit/profiles/infotheory.cce.gaussian__8x1024.pstats
