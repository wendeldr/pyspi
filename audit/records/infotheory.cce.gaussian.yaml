    (throws on non-PD); computeAverageLocalOfObservations :162-175 returns 0.5*(d*(1+ln 2pi) + ln det(Sigma)) in nats'
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java :66 normalise = true by default, but
    finaliseAddObservations :178-212 only stacks observations and adds noise if addNoise (default false, :70); no normalisation is applied for the Gaussian estimator; NOISE_SEED handled :133-139 (no effect
    without addNoise)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] covarianceMatrix(double[][], double[]) :3426-3439 -> covarianceTwoColumns :3370-3377 divides by (n-1) (ddof=1);
    CholeskyDecomposition :4496-4498 (tol 10e-10 = 1e-9) / :4528-4560 throws NonPositiveDefiniteMatrixException when a pivot <= tol; determinantViaCholeskyResult :4673-4680
  deviation_from_documented: (1) History restricted to n = 5 terms (infotheory.py:435), not 10 as documented (supplement §1.4.7; GitBook). (2) Each term conditions on the present x(t) as well as the past
    ('past of x' in the text); this follows Kramer's definition but not the supplement wording. (3) The value is a sum over 5 terms (magnitude approx 5 x per-sample entropy, e.g. 6.12 nats on var2_bivariate_T1024),
    not 'the uncertainty remaining in y' per sample.
  deviation_from_canonical: 'Matches Kramer''s causally conditioned entropy for block length N = 5 under stationarity (probe var2_bivariate_T1024: A[0,1] = 6.12472743 and A[1,0] = 6.63088572 equal a numpy
    re-implementation 6.124727425882034 / 6.630885716374198). Finite truncation (5) instead of the whole past; terms estimated on different sample counts (T-m+1).'
  units_and_range: nats; real (sum of differential conditional entropies), approx 5*1.4189 = 7.09 for independent white series under z-scoring, can be negative for strongly coupled pairs; asymmetric; raises
    on singular embeddings (Calculator blanks the matrix)
  direction_convention: 'A[i,j] = H(x_j^5 || x_i^5): column j is the target whose uncertainty is measured, row i the causally conditioning source (infotheory.py:472 passes z[i] as src, z[j] as targ). Probe
    var2_bivariate_T1024 (x0 drives x1): A[0,1]=6.125 < A[1,0]=6.631'
  symmetry_expected: asym
  already_documented: REVIEW M8 (sign of Gaussian entropies) by the same mechanism; tests/README.md lists cce_* as FORCE_SLOW only
  new_finding_candidates:
  - 'CANDIDATE (documented parameter mismatch, hypothesis confirmed): CausalEntropy uses n = 5 (infotheory.py:435 ''def __init__(self, n=5, ...)''; config.yaml:425-437 passes no n) while supplement §1.4.7
    and GitBook say the history is restricted to 10.'
  - 'CANDIDATE (documentation wording): every term conditions on x(t) (makeDelayEmbeddingVector(src, i) contains lags 0..i-1, infotheory.py:449), i.e. ''past and present of x'', matching Kramer''s X^n but
    not the supplement''s ''past of x''.'
  - 'CANDIDATE (scale of output): the value is a 5-term block sum, so it scales with n and is not comparable to a per-sample conditional entropy (iid z-scored data give approx 7.09 nats, not approx 1.42).'
