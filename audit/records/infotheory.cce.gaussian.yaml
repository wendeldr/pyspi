unit_id: infotheory.cce.gaussian
status: profiled
correctness:
  metric_name_standard: Causally conditioned (block) entropy H(Y^n || X^n) with block length n = 5, Gaussian model
  canonical_ref: Kramer G. 1998, PhD thesis 'Directed information for channels with feedback', ETH Zurich, eq. (3.x) causal conditioning H(Y^N||X^N) = sum_{n=1}^N H(Y_n | Y^{n-1}, X^n); Ziebart B.D., Bagnell
    J.A. & Dey A.K. 2010, ICML (maximum causal entropy); Amblard P.-O. & Michel O.J.J. 2011, J Comput Neurosci 30:7-16
  canonical_definition: H(Y^N || X^N) = sum_{n=1}^{N} H(Y_n | Y_1..Y_{n-1}, X_1..X_n) (X up to and including time n)
  documented_definition: 'supplement §1.4.7, p.11 (supplement.txt:513-524): ''Causally conditioned entropy [42-44] aims to measure the uncertainty remaining in time series y in the context of the entire
    (causal) past of both time series x and y. The measure is computed as a sum of conditional entropies (of y given both the past of x and the past of y) with increasing history lengths. ... for computational
    reasons, we restrict the history length to 10. This corresponds to the assumption that the joint process is, at maximum, a 10th-order Markov chain.'' Keywords ''directed, nonlinear, unsigned, bivariate,
    time-dependent''. GitBook information-theory.md:24-42 same text.'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.EntropyCalculatorMultiVariateGaussian (2 entropies per term, 5 terms) and infodynamics.utils.MatrixUtils.makeDelayEmbeddingVector
  implemented_as: A[i,j] = sum_{m=1}^{5} H(x_j(t) | x_j(t-1..t-m+1), x_i(t..t-m+1)) with each term a stationary (sliding-window, T-m+1 samples) Gaussian conditional entropy on z-scored data (ddof=1). This
    is the block quantity H(Y^5 || X^5) under stationarity (not a per-sample rate), it includes the contemporaneous source sample x_i(t) in every term, and n = 5 (constructor default) rather than the documented
    10.
  implementation_trace:
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 fill_diagonal NaN; :336-339 any exception from any pair -> the whole SPI entry becomes NaN (:337) and the error is recorded, warning issued at :354-355
  - 'pyspi/data.py:184-195 preprocessing in Data.set_data: optional scipy.signal.detrend(axis=1), then (default normalise=True) scipy.stats.zscore(axis=1, ddof=1)'
  - 'pyspi/base.py:84-94 Directed.multivariate: for every ordered pair i != j, A[i,j] = self.bivariate(data, i=i, j=j)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: _entropy_calc = _getcalc(''entropy'') (:36); identifier += ''_gaussian'' (:38); estimator ''gaussian'' -> labels += [''linear''], _dyn_corr_excl
    = None (:53-55)'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: every calculator gets setProperty(''BIAS_CORRECTION'',''false'') and setProperty(''NOISE_SEED'',''42''); no NORMALISE property is set'
  - 'pyspi/statistics/infotheory.py:103-134 _getcalc: ''gaussian'' (and any unrecognised estimator) falls to the else branches -> gaussian.EntropyCalculatorMultiVariateGaussian (:111-112), gaussian.MutualInfoCalculatorMultiVariateGaussian
    (:120-123), gaussian.TransferEntropyCalculatorGaussian (:129-130)'
  - pyspi/statistics/infotheory.py:429-437 CausalEntropy(JIDTBase, Directed).__init__(n=5) -> self._n = 5 (config passes no n)
  - 'pyspi/statistics/infotheory.py:439-454 _compute_causal_entropy(src, targ): for i = 1..n: Yp = MatrixUtils.makeDelayEmbeddingVector(targ, i-1)[:-1] (targ lags 1..i-1), Xp = makeDelayEmbeddingVector(src,
    i) (src lags 0..i-1, i.e. including the present x(t)), Yf = targ[i-1:]; sum of _compute_conditional_entropy(Yf, [Yp, Xp]) = H(y(t) | y(t-1..t-i+1), x(t..t-i+1)) on T-i+1 samples'
  - pyspi/statistics/infotheory.py:180-193 _compute_conditional_entropy(X, Y) = H(X,Y) - H(Y) with the Gaussian entropy calculator
  - pyspi/statistics/infotheory.py:456-457 _getkey adds n to the cache key; :459-474 bivariate caches data.causal_entropy[(estimator, n)][i,j] = _compute_causal_entropy(z[i], z[j]) (src = i, targ = j)
