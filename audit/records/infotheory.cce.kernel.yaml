  deviation_from_documented: '(1) History length: documented 10, code n=5 (infotheory.py:435; config passes no n). (2) The documented ''past of x'' is implemented as x_t..x_{t-m+1}, i.e. it includes the
    current source sample (this matches Kramer''s definition, not the prose). (3) ''Width 0.5 SD'' is the box half-width.'
  deviation_from_canonical: 'Formula matches Kramer''s H(Y^n||X^n) for n=5 under stationarity (each term estimated on its own T-m+1 samples). Estimator: with 0.5-SD boxes in 2m <= 10 dimensions the counts
    collapse to 1 for most points at T <= 4096, so the high-order terms are driven to ~0 and the sum is heavily underestimated (probe iid_gaussian, truth 5*2.047 = 10.24 bits: per-term [2.039, 1.934, 1.232,
    0.277, 0.024] = 5.51 at T=4096; 2.22, 3.42, 4.50 at T=64, 256, 1024).'
  units_and_range: bits; sum of 5 kernel conditional entropies; individual high-order terms can be slightly negative (observed -0.033); total positive, strongly T-dependent; asymmetric; finite.
  direction_convention: 'A[i,j] = H(X_j^5 || X_i^5): row i = conditioning (source), column j = target. Lower = more of j explained causally by i. Probe delayed_noise T=1024: A[0,1] = 2.405 (x0 drives x1)
    vs A[1,0] = 7.169.'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (documented parameter): supplement §1.4.7 and GitBook state a history length of 10; the code uses n=5 (CausalEntropy.__init__(n=5), infotheory.py:435; config.yaml:425-437 sets only the estimator).
    Evidence: numpy reference summing exactly 5 terms matched pyspi to 8.9e-16 (var2_bivariate T=256: 3.42173375502882).'
  - 'Candidate (estimator collapse): kernel CCE terms of order m >= 3 are near 0 at practical T because 0.5-SD boxes in 6-10 dimensions contain only the query point; probe iid_gaussian per-term at T=1024
    [2.012, 1.702, 0.675, 0.099, 0.012] vs truth 2.047 each, so cce_kernel_W-0.5 mostly reflects the m=1,2 terms and T.'
