unit_id: infotheory.cce.kernel
status: profiled
correctness:
  metric_name_standard: Causally conditioned entropy H(Y^n || X^n) of target j given source i over a block of n = 5 samples (Kramer), box-kernel plug-in under stationarity, bits
  canonical_ref: Kramer G (1998) Directed Information for Channels with Feedback, PhD thesis ETH Zurich (Hartung-Gorre), Def. of causally conditioned entropy H(Y^N||X^N) = sum_{n=1}^N H(Y_n | Y^{n-1}, X^n);
    Massey JL (1990) Proc. ISITA 'Causality, feedback and directed information'; Quinn CJ, Coleman TP, Kiyavash N, Hatsopoulos NG (2011) J Comput Neurosci 30:17-44
  canonical_definition: H(Y^n || X^n) = sum_{m=1}^{n} H(Y_m | Y^{m-1}, X^m), where X^m includes the current X_m; under stationarity term m = H(Y_t | Y_{t-1..t-m+1}, X_{t..t-m+1})
  documented_definition: 'supplement §1.4.7, p.11 (supplement.txt:513-525; pack lines 524-536): ''Causally conditioned entropy [42-44] aims to measure the uncertainty remaining in time series y in the context of the entire (causal)
    past of both time series x and y. The measure is computed as a sum of conditional entropies (of y given both the past of x and the past of y) with increasing history lengths ... for computational reasons,
    we restrict the history length to 10. This corresponds to the assumption that the joint process is, at maximum, a 10th-order Markov chain.'' identifier 84 cce_kernel_W-0.5; keywords directed, nonlinear,
    unsigned, bivariate, time-dependent. GitBook information-theory.md:24-42 same text.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): EntropyCalculatorMultiVariateKernel
    (up to 10-D) and infodynamics.utils.MatrixUtils.makeDelayEmbeddingVector, combined in pyspi'
  implemented_as: 'CausalEntropy._compute_causal_entropy(src=z_i, targ=z_j) with n=5 (class default; config passes no n): for m = 1..5, Yp = makeDelayEmbeddingVector(targ, m-1)[:-1] (y_{t-1}..y_{t-m+1};
    zero-width for m=1), Xp = makeDelayEmbeddingVector(src, m) (x_t..x_{t-m+1}, includes the CURRENT source value), Yf = y_t for t = m-1..T-1; term_m = H_kernel([Yf, Yp, Xp]) - H_kernel([Yp, Xp]) (2m-dimensional
    joint); CCE = sum of the 5 terms (a block quantity in bits, not a rate). Cached in data.causal_entropy[(''kernel'', 0.5, 5)][i,j] (shared with DirectedInfo). Kernel: half-width 0.5*sampleSD per column,
    closed max-norm box, self-included; joint dimension 2m up to 10.'
