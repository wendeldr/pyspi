    deep-copies the base Calculator (calculator.py:556-562). Probe it_kernel_fix/p1_frame_all.py, A[0,1]: bivariate_gaussian T=256 Calculator 3.4050629409 vs CalculatorFrame -1.7929180304; var2_bivariate
