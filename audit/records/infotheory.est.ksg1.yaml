  deviation_from_documented: 'Estimator matches ''KSG, NN-4''. Version: documented v1.5 (supplement) / v1.6.1 (GitBook); the jar is a post-1.6.1 master build. Undocumented: max-norm, 1e-8 jitter with seed
    42, no bias correction (pyspi''s BIAS_CORRECTION=false is a no-op), multi-threading over all cores, nats.'
  deviation_from_canonical: 'Algorithm 1 exactly as published (from-scratch brute-force MI/CMI reproduce pyspi to <= 3e-15 for MI and 12 decimals for CMI on five datasets, probes p5-p7, including the jitter
    regenerated with a Python java.util.Random). Additions: standardisation, 1e-8 jitter (tie-breaking; changes values on tied data), ψ(N) not adjusted when a Theiler window is used.'
  units_and_range: nats; real-valued and can be negative (finite-sample bias); invariant to per-variable affine transforms up to the jitter scale
  direction_convention: n/a (estimator); MI symmetric in its two arguments up to the jitter assignment (probe p2 exact equality), CMI asymmetric only through which variable is conditioned
  symmetry_expected: n/a
  already_documented: 'no'
  new_finding_candidates:
  - 'CANDIDATE (provenance): the bundled jar is not the v1.6.1 release. Evidence: `strings` on the jar''s MutualInfoMultiVariateCommon.class lists NOISE_SEED, noiseSeedSet, setSeed; the v1.6.1 tag source
    https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/measures/continuous/MutualInfoMultiVariateCommon.java#L519-L529 uses ''Random random = new Random();'' with no seed and its setProperty
    (:201-229) has no NOISE_SEED; the jar contains EntropyCalculatorMultiVariateCommon.class (entry dated 2024-04-21 06:42, like all 337 entries, unzip -l). That content is the primary evidence: NOISE_SEED
    for MI/CMI arrives in master commit 2a18cd0 (''Adding property to allow used to set random seed for noise addition to data in MI, CMI and wrapped estimators'', closes issue #99), EntropyCalculatorMultiVariateCommon
    in 3d1f3fe (''Gathering common functionality of EntropyMultiVariate estimators into a Common class''), and NOISE_SEED for the entropy estimators in a9b6b3e. Commit dates come from the GitHub REST API
    (https://api.github.com/repos/jlizier/jidt/commits/<sha>, commit.author.date = committer date): 2a18cd0 2024-04-16T04:08:04Z, 3d1f3fe 2024-04-20T07:57:38Z, a9b6b3e 2024-04-20T08:52:10Z; the master listing
    for 2024-04-15 to 2024-05-31 contains only these three commits, so a9b6b3e is the last master commit before the jar''s entry date. The commit HTML pages show hashes and messages but not dates. With
    the real v1.6.1 the NOISE_SEED=42 that pyspi sets would be silently ignored and the jitter unseeded. The documented versions are v1.5 (supplement §1.4) and v1.6.1 (GitBook).'
  - 'CANDIDATE: the value depends on the machine''s core count at the 1e-14 level, because NUM_THREADS defaults to availableProcessors() (64 here) and per-thread digamma partial sums are added in thread
    order. Probe p2 (bivariate_gaussian T=1024): max |A(default) - A(NUM_THREADS=1)| = 7.1e-15 mi, 1.1e-14 mi_DCE, 1.6e-14 tlmi, 2.4e-15 te_k1, 4.2e-15 te_auto; repeat runs on the same machine are bit-identical.'
  - 'CANDIDATE: on tied or discrete-valued inputs the estimate is set by the 1e-8 jitter and its seed. Probe p12, logistic_maps T=256 (series 1 is the period-4 r=3.5 map, 4 distinct values): pair 1->0 for
    NOISE_SEED 42/43/44 gives mi 0.226622/0.226587/0.230899, tlmi 0.278902/0.276961/0.281417, te_k1 0.115063/0.113329/0.107266, te_auto 0.101410 (l,lt=7,2) / 0.089128 (10,2) / 0.044229 (6,1); bivariate_gaussian
    is identical for all seeds.'
  - 'CANDIDATE (no-op setting): pyspi sets BIAS_CORRECTION=false (infotheory.py:90) but neither Kraskov calculator defines that property; probe p1 getProperty(''BIAS_CORRECTION'') returns None for all nine
