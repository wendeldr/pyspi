optimisation:
  complexity_P_T: 'Per call O(N log N d) kd-tree KSG1 (MutualInfoCalculatorMultiVariateKraskov1 / ConditionalMutualInfoCalculatorMultiVariateKraskov1), split over NUM_THREADS = availableProcessors() = 64
    threads because pyspi never sets the property. At T <= 1024 the per-call thread fan-out dominates: the consumer units show T exponents -0.13 to 0.23 between 8x256 and 8x1024.'
  hotspot_1: 'pyspi/statistics/infotheory.py:MutualInfo.bivariate (third-party:jidt KSG, self time) 100.0% cum of the profiled mi_kraskov call at 8x1024 (infrastructure unit: mi.kraskov pstats)'
  hotspot_2: 'none visible inside Java. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0004
  profile_file: audit/profiles/infotheory.mi.kraskov__8x1024.pstats (mi.kraskov; infrastructure unit)
  opportunities:
