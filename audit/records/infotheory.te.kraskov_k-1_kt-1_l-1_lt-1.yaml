  deviation_from_documented: 'Matches the documented fixed minimal embedding (k-1, l-1, delays 1). Undocumented: nats, 1e-8 jitter with seed 42, negative values despite ''unsigned'', source-target delay
    fixed at u = 1, JIDT version (post-1.6.1 build).'
  deviation_from_canonical: 'Schreiber TE with finite embedding estimated by KSG1 CMI (Frenzel-Pompe form); a from-scratch implementation reproduces pyspi to 12 decimals (probe p5, T=256, five datasets).
    Finite k=1 history: for processes with longer memory (var2_bivariate is order 2) the quantity is the TE for this embedding, not the full-history TE. Autocorrelated samples treated as i.i.d. neighbours.'
  units_and_range: nats; real, can be negative (probe p13 T=64 minimum -0.134 on logistic_maps); asymmetric; NaN only when JIDT raises (N <= 4 + 2W)
