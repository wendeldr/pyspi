  hotspot_1: ~:<built-in method pyBindEDM.CCM> (third-party:pyEDM, C++ cppEDM via pyEDM/CoreEDM.py:CCM) 99.7% of the profiled SPI call at 4x256 (6 calls, one per unordered pair)
  hotspot_2: pandas/core/frame.py:__init__ (third-party:pandas, DataFrame round trips in pyEDM/AuxFunc.py:GetDF) 0.1% of the profiled SPI call at 4x256; nothing else outside the C++ call is visible
  hotspot_owner: third-party:pyEDM
  opaque_share: 0.997
  profile_file: audit/profiles/micro/causal.ccm.E-1__4x256.pstats
  opportunities:
  - opportunity_id: ccm-1
    opportunity: 'Run the unordered-pair loop of ConvergentCrossMapping._from_cache (pyspi/statistics/causal.py:118-144) in a process pool: one pyEDM.CCM call per pair, each independent and seeded, results written into ccmf by index.'
    opp_type: parallel
    speedup_kind: throughput
    expected_speedup: 8-16x alone (at most ~2x inside a window worker)
    speedup_basis: 'profile:audit/profiles/micro/causal.ccm.E-1__4x256.pstats pyBindEDM.CCM 99.7% (6 calls, one per unordered pair) + complexity: 6,903 independent calls per window at P=118; each call already runs its two cross-map directions in two threads (cppEDM CCM.cc:80-90, CCM_THREADED; measured CPU/wall 2.00 for one call at T=256, audit/profiles/micro/probe_ccm_threads.json), so at most about 16 concurrent calls on the 32 physical cores (Threadripper 3970X, 64 logical CPUs) -> <= 16x per-window latency; no core-hour saving, and window-level parallelism (xc-window-parallel) competes for the same cores; the two are alternatives for those cores, not factors that multiply, so xc-window-parallel is not in depends_on: with the ~8 memory-bounded window workers running, about 4 physical cores per worker remain, so inside a window worker this pool lowers the unit''s latency by at most about 2x (two two-thread calls at a time). No ranking basis on this row. profiles/summary.json has no 118x1024 projection for this unit (its fresh and family-warm reasons read ''no 118x1024 measurement and no ok 8x1024 + 32x1024 records to fit (no extrapolation from 8x1024 alone)''), so rank_basis_s and projected_patient_s_after stay blank. build_csv ranks the row as saving 0 s, after every row of its tier and kind with a positive saving, then by output risk and effort (README ''Optimisation columns'', rule 5).'
