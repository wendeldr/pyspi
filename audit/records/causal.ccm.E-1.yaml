  - opportunity_id: ccm-3
    opportunity: 'Reuse the cross-map neighbour sets across targets: with seed 42, the same library sizes and the same E, the random libraries and the k-NN sets and simplex weights of a CCM call depend only on the source column, so compute them once per source channel and apply them to every target (O(P) neighbour searches per window instead of O(P^2)); needs a re-implementation of cppEDM''s CCM outside pyEDM.'
    opp_type: algorithmic
    expected_speedup: 10-50x
    speedup_basis: 'profile:audit/profiles/micro/causal.ccm.E-1__4x256.pstats pyBindEDM.CCM 99.7% + complexity: per call the k-NN search over each random library (O(S L_n T L), S=100 samples, L_n=22 sizes, library size L up to T) dominates; after reuse each target needs only the weighted gather and Pearson per row, O(S L_n T k); at P=118 each source is searched once instead of 117 times. No ranking basis on this row. profiles/summary.json has no 118x1024 projection for this unit (its fresh and family-warm reasons read ''no 118x1024 measurement and no ok 8x1024 + 32x1024 records to fit (no extrapolation from 8x1024 alone)''), so rank_basis_s and projected_patient_s_after stay blank. build_csv ranks the row as saving 0 s, after every row of its tier and kind with a positive saving, then by output risk and effort (README ''Optimisation columns'', rule 5).'
    output_risk: unverified-rng-stream
    risk_evidence: 'requires reproducing cppEDM''s random library draws outside cppEDM. The cppEDM source used by the check stage confirms the premise of the avenue: CrossMap seeds its own std::default_random_engine with seed=42 per direction (CCM.cc:114, 203) and draws row indices from uniform_int_distribution(RNGStart, RNGStop) (CCM.cc:175-176, 220) into an unordered_set until libSize are kept (CCM.cc:274-285), so the draws depend only on the seed, the number of library rows (N, E, tau) and the library size, not on the data values. They are implementation-defined (libstdc++ engine, distribution and unordered_set iteration order), so outside cppEDM they are reproduced only by emulating libstdc++; draws that differ change the curves within sampling error (the check stage matched an independent random-library implementation only within statistical tolerance)'
    effort: L
