  deviation_from_documented: '(1) 22 library sizes, not 21; truncated at T=64 (10..52 of 10..60). (2) diff undefined in the
    supplement (GitBook names it only); code: mean - mean^T. (3) Keywords unsigned vs Signed class. (4) Orientation candidate:
    A[i,j] is evidence for j -> i. (5) The documented description of CCM as using "the Takens time-delay embedding" does not
    hold for E=1, where no delay coordinate is used.'
  deviation_from_canonical: '(1) E=1 is not a delay embedding: Takens'' theorem needs E > 2d, so the cross map is a 2-nearest-neighbour
    regression of x_j(t) on x_i(t); it responds to static (instantaneous) functional dependence without any dynamics (from-scratch
    probe on iid x1 = x0^2 + noise: rho(x1|x0) = 0.972, rho(x0|x1) = -0.032). (2) Convergence criterion replaced by mean/max
    of rho over L (documented). (3) diff is pyspi-specific. (4) Per-library cross-map algorithm otherwise matches Sugihara
    2012 (E+1 neighbours, exp(-d/d_min) weights, Pearson rho) (Sugihara 2012 does not specify a tie rule; when the (E+1)-th
    neighbour distance is tied, cppEDM CCM keeps the first E+1 entries of std::sort by distance with no tie expansion (the
    expansion in Simplex.cc L93-157 is gated to Method::Simplex, EDM_Neighbors.cc L282), so the neighbours chosen among equal
    distances depend on the implementation-defined sort order; this affects values only when neighbour distances tie, e.g.
    the period-4 process of logistic_maps).'
  units_and_range: 'Dimensionless Pearson correlations. mean and max in [-1, 1] (negative values occur; cppEDM returns rho
    = 0, not NaN, when either vector has zero variance, Common.cc L205-207); diff in [-2, 2] and antisymmetric (diff = mean
    - mean^T). Diagonal: 0 from a direct .multivariate call (ccmf initialised to zeros), NaN after Calculator.compute. Whole
    matrix NaN when cppEDM throws (short series). Not symmetric for mean/max.'
  direction_convention: 'A[i,j] = summary over L of rho(x_j | M_{x_i}): skill of predicting process j from the delay embedding
    of process i (pyEDM column "proc_i:proc_j", causal.py:143). By Sugihara''s criterion a large A[i,j] is evidence that j
    causes i (j -> i), the transpose of pyspi''s generic Directed orientation A[i,j] = i -> j (base.py:91-93; TE infotheory.py:377-383).
    diff[i,j] = mean_L[rho(x_j|M_i) - rho(x_i|M_j)] > 0 means j -> i dominates. Probe (logistic_maps T=256, process 1 drives
    process 0, E=2): A_mean[0,1] = 0.7415 > A_mean[1,0] = 0.3226, diff[0,1] = +0.4188. Confirmed in the check stage (the probe
    quoted above ran on the old period-4 logistic_maps fixture): on logistic_maps_chaotic (x = process 0 drives y = process
    1 only) ccm_E-1_diff gives diff[1,0] = +0.0360 (dir-diff, pass) and the swapped input (processes [1, 0]) gives diff[0,1]
    = +0.0360 (dir-diff-swap, pass); ccm_E-10 at T=1024 gives mean A[1,0] = 0.5921 vs A[0,1] = -0.0512, diff[1,0] = +0.6432
    (stats3-E10, T=1024); the delegate kernel at E=2 (full library) gives ''y xmap x'' = A[1,0] = 0.8824 vs A[0,1] = 0.2909.
    So A[i,j] = rho(x_j | M_{x_i}) and a large A[i,j] is evidence that j -> i (row = target), the transpose of the glossary
    convention (glossary-of-terms.md:25-27, rows = sources) and of TE/GC (base.pair_handling|var2_bivariate|1024|pipeline|calls-gc_gaussian:
    row = source).'
  symmetry_expected: asym
  already_documented: 'no (family-level references: EEG_OPTIMIZATION_NOTES.md:169 and DEPENDENCY_MIGRATION.md:51 / DEPENDENCY_COMPATIBILITY_REVIEW.md:88-90
    record that pyEDM 2.x changes CCM values; tests/README.md bug 2 concerns only E=None)'
  new_finding_candidates:
  - 'CANDIDATE orientation: pyspi stores ccmf[i,j] = pyEDM column "proc_i:proc_j" = rho(x_j | M_{x_i}) (causal.py:134-144;
    cppEDM CCM.cc L475-491 names col:target for the colToTarget mapping, which embeds columns and predicts target). Under
    the documented reading "x -> y if the embedding of y predicts x", A[i,j] large means j -> i, the opposite of pyspi''s
    Directed convention A[i,j] = i -> j (base.py:91-93, TE infotheory.py:377-383). Evidence: probe on logistic_maps T=256
    (process 1 drives process 0), E=1 mean [[0, 0.5484], [0.2913, 0]], E=2 mean [[0, 0.7415], [0.3226, 0]]; from-scratch probe:
    "proc0:proc1" reproduced exactly by embedding x0 and predicting x1 (0.972222487974537 vs 0.9722224879745365).'
  - 'CANDIDATE library schedule: the curve has 22 points, not the documented 21 (nlibs + 1, causal.py:116-117, 143), and at
    short T it is truncated: cppEDM expands "lo up inc" to (up-lo)//inc + 1 sizes (Parameter.cc L271-279), pyspi keeps the
    first 22. Probe: libSizes "20 50 1" (T=64, E=10) -> "LibSize rows 31 first22 last 41.0 last 50.0"; analytic: T=64 E=1
    keeps 10..52 of 10..60, T=256 E=10 keeps 20..230 of 20..240. The maximum library used is below the documented upper bound.'
  - 'CANDIDATE short-series failure: inc = int((upperE-lowerE)/21) is 0 when upperE-lowerE < 21 and cppEDM throws. Probe:
    T=50 and T=55 with E=10 -> "RuntimeError Parameters::Validate(): CCM librarySizes increment 0 is invalid."; analytic threshold
    T <= 60 for E=10 (and E=None) and T <= 41 for E=1. Calculator.compute turns this into an all-NaN matrix with a warning
    (calculator.py:336-339, warning 354-355).'
  - 'CANDIDATE no temporal exclusion: exclusionRadius=0 (CoreEDM.py:372 default, not overridden) so only the prediction row
    itself is excluded (EDM_Neighbors.cc L153-155); temporally adjacent library vectors can be nearest neighbours, which may
    inflate rho for autocorrelated or oversampled signals (e.g. EEG). tau is fixed at 1 sample. Hypothesis to quantify with
    a from-scratch cross-map with a Theiler window.'
  - 'CANDIDATE reproducibility: random libraries come from std::default_random_engine and std::uniform_int_distribution (CCM.cc
    L203, L220), both implementation-defined in C++, so values with seed=42 may differ between builds/platforms (libstdc++
    vs libc++); the same seed is used for both directions and every pair, so both directions share library subsets. A second
    implementation-defined element: when the (E+1)-th neighbour distance is tied, CCM keeps the first E+1 rows of std::sort
    (not stable; DistanceCompare compares distance only, Common.cc L10-13, EDM_Neighbors.cc L226) with no tie expansion (gated
    to Method::Simplex, EDM_Neighbors.cc L282), so tied columns (e.g. logistic_maps proc1:proc0) may also differ between standard-library
    implementations.'
  - 'CANDIDATE diagonal: ccmf is created with np.zeros and only i != j are filled (causal.py:117-144), so a direct ConvergentCrossMapping.multivariate
    call returns 0 on the diagonal (probe: "diag ccmf[0,0] all zero: True"); only Calculator.compute sets NaN (calculator.py:332).'
  - 'CANDIDATE labels: supplement keywords and config.yaml:371-376 say "unsigned", the class is Signed (causal.py:68, 72);
    the code label is the consistent one because rho and diff are negative in practice (probe diff [[0, 0.2571], [-0.2571,
    0]]). Documentation-only inconsistency.'
  - 'CANDIDATE static dependence read as causality: with E=1 the measure is a contemporaneous kNN regression skill, so a static
    asymmetric function produces a large asymmetric "causal" score. Evidence: from-scratch probe reproducing pyEDM exactly
    on iid x0 ~ U(-1,1), x1 = x0^2 + 0.05 noise, N=300: "proc0:proc1" = 0.9722, "proc1:proc0" = -0.0315, although the data
    have no temporal structure.'
