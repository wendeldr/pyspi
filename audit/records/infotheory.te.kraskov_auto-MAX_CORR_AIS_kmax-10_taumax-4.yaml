  deviation_from_documented: '(1) Maximum embedding delay: the prose says ''maximum time delay of 2, tau-max-2'' (supplement §1.4.5 line 489, GitBook :216), but the SPI lists printed with it say tau-max-4
    (supplement lines 495-496, GitBook :222-223); the code uses tau_search_max = 4 (config.yaml:556), matching the identifiers (check-stage correction: a slip inside the documentation, not a code deviation).
    (2) The documentation says the parameters maximise AIS; the code does this for target and source separately (both from their own AIS), which the text implies only for the target. (3) Values can be negative
    though labelled ''unsigned''; nats; jitter/seed undocumented; JIDT version as in infotheory.est.ksg1. (4) config.yaml:551 comment mentions DCE for this non-DCE entry.'
  deviation_from_canonical: Schreiber TE with KSG1 CMI as implemented in JIDT; a from-scratch KSG1 CMI + MAX_CORR_AIS search reproduces the chosen embedding and the value to 12 decimals on var2_bivariate,
    gauss_ar1_pair and logistic_maps (T=256, probe p6). The AIS-maximisation criterion (Garland et al. 2016) differs from Ragwitz's prediction-error criterion and from selecting the source embedding to
    maximise TE (JIDT's MAX_CORR_AIS_AND_TE); AIS values for different (k, tau) use different N and are compared without bias correction, so the choice can drift to large k (var2_bivariate T=256 target
    k=10). Only u = 1 is considered.
  units_and_range: nats; real, can be negative (probe p13 T=64 min -0.095); asymmetric; NaN when JIDT raises (caught per pair)
  direction_convention: 'A[i, j] = TE(x_i -> x_j): row = source, column = target (infotheory.py:383-388, bivariate docstring "from i->j"; probe p4 var2_bivariate T=1024: A[0,1] 0.132, A[1,0] 0.015, truth
    x0 -> x1). To be confirmed in the check stage.'
  symmetry_expected: asym
  already_documented: 'tests/README.md worth knowing: ''auto-embedding TE kraskov equals fixed k=1 on cml7'' (confirmed here: cml7 first 3 channels give k,kt,l,lt = 1,1,1,1 and te value equal to te_k1,
    probe p11)'
  new_finding_candidates:
  - 'CANDIDATE (new, confirmed by probe): copying a TransferEntropy SPI silently changes its configuration while keeping the identifier, and pickle and deepcopy lose different things. Pickle (TransferEntropy.__setstate__,
    infotheory.py:369-374) rebuilds the calculator through _getcalc/_setup, keeping k = prop_k and NOISE_SEED 42 but dropping AUTO_EMBED_METHOD and k_HISTORY/l_HISTORY (probe p9: k_HISTORY ''1'', AUTO_EMBED_METHOD
    ''NONE''). Deepcopy (JIDTBase.__deepcopy__, :77-82) deep-copies the JPype object, which yields a fresh Java calculator with JIDT constructor defaults: in addition to the embedding it loses NOISE_SEED
    (''NONE'', so the 1e-8 jitter is unseeded) and prop_k (JIDT default 4; harmless for these NN-4 units, not for NN-k with k != 4). CalculatorFrame.init_from_list deep-copies the base Calculator (calculator.py:556-563,
    deepcopy at :559), so a CalculatorFrame computes unseeded fixed k=1 TE under these identifiers. Probe p10 (repeated in scratchpad it_kraskov_fix/p_te_copy.py), var2_bivariate T=256, A[0,1]: te_kraskov_NN-4_k-max-10_tau-max-4
    Calculator 0.060599 vs CalculatorFrame/deepcopy/pickle 0.133643 (= te_k1 0.133643); te_kraskov_NN-4_DCE_k-2_kt-1_l-1_lt-1 Calculator 0.159244 vs deepcopy/pickle 0.134372. On tied input the deepcopy
    is also not reproducible: logistic_maps T=256 pair 1->0 te_auto original 0.101410 on every run, pickle 0.115063, three deep copies 0.114476/0.109197/0.111046 (scratchpad it_kraskov_fix/p_tied_dce.py).
    MI, TLMI and k=l=1 TE keep their values under pickle; under deepcopy they keep them only on tie-free data, because the lost NOISE_SEED then does not move any neighbour count (var2_bivariate diff 0.0).
    Cross-family: the same deepcopy path resets KERNEL_WIDTH to 0.25 for kernel SPIs (probe scratchpad it_kraskov_fix/r4_deepcopy.py: je_kernel_W-0.5 3.982283 -> 3.748712), for it_kernel to record.'
  - 'CANDIDATE (pack hypothesis confirmed beyond cml7): the embedding is selected per ordered pair and differs between pairs and T; probe p4: var2_bivariate 0->1 (k,kt,l,lt) = (3,3,1,1) at T=64, (10,1,1,1)
    at T=256, (3,1,2,1) at T=1024; gauss_ar1_pair 1->0 (2,4,1,1)/(2,3,5,1)/(2,4,2,3). Equal to fixed k=1 on cml7 (documented).'
  - 'CANDIDATE (documentation): tau_search_max = 4 in config and identifier, documented as tau-max-2 in the supplement and GitBook.'
  - 'CANDIDATE (efficiency, correctness-neutral): without DCE the AIS search for a channel''s embedding does not depend on the partner, yet it is repeated for each of the P−1 pairs where the channel is
    target and P−1 where it is source (TransferEntropyCalculatorViaCondMutualInfo.java:779-797 at JIDT a9b6b3e runs on every setObservations).'
  - 'CANDIDATE: the value depends on the machine''s core count at the 1e-14 level, because NUM_THREADS defaults to availableProcessors() (64 here) and per-thread digamma partial sums are added in thread
    order. Probe p2 (bivariate_gaussian T=1024): max |A(default) - A(NUM_THREADS=1)| = 7.1e-15 mi, 1.1e-14 mi_DCE, 1.6e-14 tlmi, 2.4e-15 te_k1, 4.2e-15 te_auto; repeat runs on the same machine are bit-identical.'
  - 'CANDIDATE: on tied or discrete-valued inputs the estimate is set by the 1e-8 jitter and its seed. Probe p12, logistic_maps T=256 (series 1 is the period-4 r=3.5 map, 4 distinct values): pair 1->0 for
    NOISE_SEED 42/43/44 gives mi 0.226622/0.226587/0.230899, tlmi 0.278902/0.276961/0.281417, te_k1 0.115063/0.113329/0.107266, te_auto 0.101410 (l,lt=7,2) / 0.089128 (10,2) / 0.044229 (6,1); bivariate_gaussian
    is identical for all seeds.'
  - 'CANDIDATE (estimator property, not a pyspi bug): labelled ''unsigned'' but KSG estimates are negative on independent data. Probe p13 minima at T=64: mi -0.167 (nonlinear_dependence), tlmi -0.143 (iid_gaussian),
    te_k1 -0.134 (logistic_maps), te_auto_DCE -0.178 (cointegrated); at T=256 iid_gaussian mi min -0.055.'
  - 'CANDIDATE (no-op setting): pyspi sets BIAS_CORRECTION=false (infotheory.py:90) but neither Kraskov calculator defines that property; probe p1 getProperty(''BIAS_CORRECTION'') returns None for all nine
    units, so the call has no effect and no bias correction exists for KSG here.'
