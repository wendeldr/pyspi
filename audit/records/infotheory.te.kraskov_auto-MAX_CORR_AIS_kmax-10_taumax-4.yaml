unit_id: infotheory.te.kraskov_auto-MAX_CORR_AIS_kmax-10_taumax-4
status: profiled
correctness:
  metric_name_standard: transfer entropy T_{X→Y} in nats, KSG1 conditional-MI estimator (k=4 neighbours), target and source embeddings (k, kt), (l, lt) selected per pair by maximum KSG active information
    storage (k <= 10, tau <= 4), source-target delay u = 1
  canonical_ref: 'Schreiber 2000, Phys. Rev. Lett. 85, 461, Eq. (4) (supplement [35]); embedding delays and source-target delay u: Wibral et al. 2013, PLoS ONE 8, e55809; estimator: Frenzel & Pompe 2007,
    Phys. Rev. Lett. 99, 204101 (KSG-type conditional MI) with Kraskov et al. 2004 algorithm 1; JIDT: Lizier 2014, Front. Robot. AI 1:11 (supplement [32]). Equation numbers from memory. Embedding selection:
    Garland, James & Bradley 2016, Phys. Rev. E 93, 022221 (cited by JIDT for MAX_CORR_AIS).'
  canonical_definition: 'T_{X→Y} = I(Y_{t+1}; X_t^{(l,lt)} | Y_t^{(k,kt)}) = E[log p(y_{t+1} | y_t^{(k)}, x_t^{(l)}) / p(y_{t+1} | y_t^{(k)})], with y_t^{(k,kt)} = (y_t, y_{t−kt}, ..., y_{t−(k−1)kt}) and
    source embedding ending at t+1−u (u = 1). KSG CMI (algorithm 1): Î = ψ(K) + ⟨ψ(n_z+1) − ψ(n_xz+1) − ψ(n_yz+1)⟩, ε from the K-th neighbour (max-norm) in the joint (x, y, z) space. Embedding selection
    (MAX_CORR_AIS, Garland, James & Bradley 2016, Phys. Rev. E 93, 022221, as cited by JIDT): for each series choose (k, τ), k <= k_max, τ <= τ_max, maximising the (bias-corrected) active information storage
    A = I(Y_t^{(k,τ)}; Y_{t+1}); target embedding from the target''s AIS, source embedding from the source''s AIS.'
  documented_definition: 'supplement §1.4.5, p.10-11 (pack lines 486-510): ''Transfer entropy [35] is a measure of information transfer from a source time series x to a target time series y, based on the
    Takens time-delay embedding ... The embedding lengths are denoted by modifier''s l and k for the source, x, and target, y, respectively; the time delay is denoted lt and kt ... The fixed parameters
    are minimal values, i.e., typically with a fixed target embedding length of 1 (denoted by k-1) or 2 (denoted by k-2). The optimized parameters are inferred by choosing the embedding parameters (up to
    a maximum embedding length of 10, denoted by k-max-10, and maximum time delay of 2, tau-max-2) that maximize a univariate information-theoretic measure known as active information storage (see the MAX_CORR_AIS
    method of [32] for details).'' Same text GitBook information-theory.md:206-226 (also ''tau-max-2''), which lists the five te_kraskov identifiers.'
  delegate_lib: JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1; contents match post-1.6.1 master a9b6b3e, see infotheory.est.ksg1) infodynamics.measures.continuous.kraskov.TransferEntropyCalculatorKraskov
    (KSG algorithm 1 conditional MI ConditionalMutualInfoCalculatorMultiVariateKraskov1) .setObservations/.computeAverageLocalOfObservations, via jpype 1.7.1 on OpenJDK 21.0.12
  implemented_as: 'For each ordered pair (i, j), with src = x_i, targ = x_j (z-scored): JIDT searches k_candidate = 1..10, tau = 1..4 (tau only 1 for k = 1) maximising the KSG1 AIS I(y_t^{(k,tau)}; y_{t+1})
    of the target (no extra bias correction for KSG), then the same for the source to set (l, lt); then computes the KSG1 conditional MI I(x_t^{(l,lt)}; y_{t+1} | y_t^{(k,kt)}) with u = 1 on N = T − 1 −
    max((k−1)kt, (l−1)lt) samples, each embedding column standardised, 1e-8 jitter (seed 42), max-norm, ψ(4) + ⟨ψ(n_z+1) − ψ(n_xz+1) − ψ(n_yz+1)⟩, nats. Embedding search repeated for every ordered pair.
    No Theiler window.'
