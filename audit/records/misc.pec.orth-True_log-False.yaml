unit_id: misc.pec.orth-True_log-False
status: profiled
correctness:
  metric_name_standard: Orthogonalised amplitude envelope correlation (Hipp 2012 pairwise orthogonalisation, "AEC-orth"), broadband; pec_orth_abs averages the absolute directional correlations
  canonical_ref: 'Hipp J.F., Hawellek D.J., Corbetta M., Siegel M., Engel A.K. 2012, "Large-scale cortical correlation structure of spontaneous oscillatory activity", Nat Neurosci 15(6):884-890, Methods "Orthogonalization"
    (supplement ref [82]); MNE implementation and absolute option per Khan et al. 2018 NeuroImage 174:57-68 (ref [83]) [check stage: Online Methods re-read in the PMC author manuscript PMC3861400: Y_perp_X(t,f) = imag(Y(t,f)
    X(t,f)*/|X(t,f)|), power = |.|^2, log-transformed, Pearson correlation, computed in both orthogonalisation directions and averaged, Morlet wavelets 2-128 Hz in 1/4-octave steps]'
  canonical_definition: Y_perp_X(t,f) = Im(Y(t,f) X*(t,f) / |X(t,f)|); c(Y->X) = corr_t(env X, env Y_perp_X), c(X->Y) likewise; reported value (c(Y->X) + c(X->Y)) / 2 per carrier frequency f (Hipp 2012 correlates log-transformed
    power envelopes; that is the orth-log unit)
  documented_definition: 'supplement §1.6.4, p.19 (heading at supplement.txt line 915): keywords "undirected, linear, unsigned, bivariate, time-dependent"; "The envelope correlation [82, 83] is the correlation between the
    two amplitude envelopes of x and y. Power envelope correlation is computed using MNE, where we use six combinations of parameters, including whether the method was orthogonalized (modifier orth), the envelopes were squared
    and logs were taken prior to correlation (log), or the absolute of the correlation coefficient was used (abs)"; refs [82] Hipp et al. 2012 Nat Neurosci 15:884, [83] Khan et al. 2018 NeuroImage 174:57, [63] MNE v0.23.0.
    GitBook spi-descriptions/miscellaneous.md:92-113 repeats the text and lists pec, pec_orth, pec_log, pec_orth_log, pec_orth_abs, pec_orth_log_abs. Neither source names a frequency band, the orthogonalisation formula, or
    whether "abs" is applied before or after averaging the two directions.'
  delegate_lib: mne-connectivity==0.9.0 mne_connectivity.envelope_correlation (with mne==1.13.2 mne.filter.next_fast_len, scipy==1.17.1 scipy.signal.hilbert, numpy==2.5.4); result post-processed by EpochTemporalConnectivity.combine("mean").get_data(output="dense")
  implemented_as: 'z-scored broadband channels; analytic signal as for pec. For each ordered pair (seed i, reference k): o_ik(t) = |Im(z_i(t) conj(z_k(t)) / |z_k(t)|)| = |z_i| |sin(phi_i - phi_k)|; c_ik = centred Pearson(o_ik,
    |z_k|) (amplitudes, not powers); self row forced constant. pec_orth = (c_ik + c_ki) / 2; pec_orth_abs = (|c_ik| + |c_ki|) / 2 (abs per direction before averaging). Upper triangle mirrored; diagonal NaN.'
