  deviation_from_documented: 'Orthogonalisation method is not specified in the documentation; the code uses Hipp 2012 pairwise orthogonalisation (consistent with ref [82]). "the absolute of the correlation coefficient was
    used (abs)": implemented as the mean of the absolute directional coefficients, which is >= |pec_orth| and differs from abs(pec_orth) whenever the two directions differ in sign. Metadata: pec_orth labelled unsigned but
    signed (probe minimum -0.385 on shared_envelope_T256; extends REVIEW M8, which names only pec/pec_log); pec_orth_abs is in [0,1], consistent with the label.'
  deviation_from_canonical: (1) Broadband, no carrier frequency. (2) Amplitude envelopes correlated, not (log) power envelopes as in Hipp 2012. (3) pec_orth_abs is an MNE option (absolute=True default in the library), not
    part of Hipp 2012. (4) Hilbert zero-padding to 5-smooth length. (5) Exactly collinear channels give roundoff-driven values instead of 0/undefined (candidate).
  units_and_range: dimensionless; pec_orth signed in [-1,1]; pec_orth_abs in [0,1] with positive bias under independence; exactly symmetric; NaN diagonal; bounded numerically (seed centred) but arbitrary for constant envelopes
    or collinear channels
  direction_convention: 'undirected: A[i,j] = A[j,i] exactly; the value is MNE row min(i,j), column max(i,j) of the row-wise matrix, mirrored by get_data (mne_connectivity/base.py:802-810); for orth variants that row already
    holds the average of both orthogonalisation directions (envelope.py:188). Zero-lag, no direction. Probe: bit-exact symmetry on iid_gaussian, bivariate_gaussian, shared_envelope, narrowband_f0-0.25, delayed_noise at T=64
    and 1024.'
  symmetry_expected: sym
  already_documented: 'REVIEW M1 (PowerEnvelopeCorrelation.multivariate overrides Undirected.multivariate); REVIEW M2 (pec/pec_log last-bit reciprocal asymmetry from MNE row-wise normalisation, measured on historical saved
    data); REVIEW M8 (pec and pec_log can be negative despite the unsigned label; orthogonalised absolute variants need their own metadata); DEPENDENCY_COMPATIBILITY_REVIEW.md:69 (MNE 0.23 vs mne-connectivity agree to ~1e-15
    for ordinary, log and pairwise-orth); DEPENDENCY_MIGRATION.md:78-79 (dense conversion and explicit combine("mean")); REVIEW M2 elaboration in the current environment (not a new finding): the output is now exactly symmetric
    because envelope.py:210-212 keeps only the upper triangle and mne_connectivity/base.py:802-810 mirrors it. Probe on iid_gaussian_T1024 (pec): pre-mirror row-wise matrix max |C - C^T| = 5.2e-16; dense upper triangle ==
    C upper (True), dense lower == C lower (False); exact symmetry held for all six identifiers on every probed dataset. The M2 roundoff asymmetry therefore does not reproduce with mne-connectivity 0.9.0, and current lower-triangle
    values differ from those of the historical MNE 0.23 path (full row-wise matrix, mne 0.23 envelope.py:140-151) at roundoff level'
  new_finding_candidates:
  - 'CANDIDATE (numerical, degenerate input): for bit-identical or exactly proportional channels the orthogonalised signal is zero in exact arithmetic, but envelope.py:168 computes Im(z_i * (conj(z_k)/|z_k|)) with residue
    ~1e-16 that scales with |z| and therefore correlates with the envelope. The zero-variance guard (:178) only catches exact zeros. Probe: shared_envelope (x2 bit-identical to x0) pec_orth A[0,2] = 0.218, 0.360, 0.326, 0.314
    at T = 64, 256, 1024, 4096 (pec_orth_abs identical); synthetic [a, 2a] gives 0.387 (probe: a, b = successive np.random.default_rng(0).standard_normal(1024) draws, channels [a, 2a, a + 0.3 b, b], pipeline z-scoring, pair
    (0,1)); the value is roundoff-driven and draw-dependent (2 channels [a, 2a] with a = np.random.default_rng(0).standard_normal(256): 0.4645); max |Im residue| 1.2e-16 to 1.8e-16 with no exact zeros. Expected 0 (or NaN).
    Relevant to duplicated or bridged EEG channels.'
  - 'CANDIDATE (semantics of abs): envelope.py:186-188 applies abs before the symmetric average, so pec_orth_abs = (|c_ik| + |c_ki|)/2, not |pec_orth|; under independence it is positively biased (probe iid_gaussian_T1024 range
    0.0045..0.040, all > 0).'
  - 'CANDIDATE (preprocessing sensitivity): scipy.signal.hilbert keeps the DC bin (_signaltools.py:2520-2525), so |z| of x + c is not the envelope of x; with normalise=False the value depends on per-channel offsets. Probe:
    bivariate_gaussian_T1024 + offsets [0,1,-2,5] on the kernel path changes the matrix by up to 1.32 (pec), 1.14 (pec_log), 0.176 (pec_orth); scaling alone changes it by <= 1.6e-15. The default z-scoring removes this; trends
    are not removed without detrend (trending_T1024 pec (2,3): 0.964 plain pipeline, 0.612 detrended, 0.611 clean).'
  - 'CANDIDATE (definition scope): no band-pass filter or carrier frequency is applied anywhere (misc.py:168-176 passes the z-scored broadband series; envelope.py:138-140 only Hilbert-transforms). The canonical AEC/PEC (Bruns
    2000; Hipp 2012) is defined on narrow-band signals per frequency; here the "envelope" of a broadband signal is used and one broadband value is returned.'
  - 'CANDIDATE (metadata): instance labels are ["unsigned", "misc", "undirected"] for all six identifiers (probe); the config keywords linear/bivariate/time-dependent are never attached (calculator.py:252-259 does not read
    YAML labels). "linear" is questionable for an envelope (nonlinear transform) statistic, and "time-dependent" describes a contemporaneous zero-lag statistic. The pairwise value does depend only on the pair (probe: iid_gaussian_T1024
    pair (1,3) bit-identical when computed from the 2-channel subset), so "bivariate" is accurate.'
