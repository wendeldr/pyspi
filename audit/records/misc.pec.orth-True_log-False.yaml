optimisation:
  complexity_P_T: O(P T log T) Hilbert + O(P^2 T) envelope correlation with a per-row orthogonalisation loop (P^2 T complex products) + O(P^2) Python-level work in mne-connectivity's combine/get_data (pyspi/statistics/misc.py:167-176). Measured power-law P_exponent 0.70 (fixed container overhead dominates up to P=32), T_exponent 0.05-0.18. At 118x1024 the O(P^2) combine and the O(P^2 T) loop share the time; measured 0.177 (pec_orth 0.088 + pec_orth_abs 0.089) s per window at 118x1024 (family-warm, measured).
  hotspot_1: mne_connectivity/base.py:combine (third-party:mne_connectivity, xarray apply_ufunc with numpy.vectorize, one np.mean per connection) 51.2% of the profiled SPI call at 8x1024
  hotspot_2: mne_connectivity/envelope.py:envelope_correlation (third-party:mne_connectivity) 45.3% of the profiled SPI call at 8x1024; scipy hilbert only 4.1%
  hotspot_owner: third-party:mne_connectivity
  opaque_share: 0.222
  profile_file: audit/profiles/misc.pec.orth-True_log-False__8x1024.pstats
  opportunities:
  - opportunity_id: pec-2
    opportunity: Compute the directional orthogonalised correlation matrix once per (orth, log) and Data, and derive both the signed and the _abs identifiers from it (MNE applies abs and (C + C.T)/2 only after the loop, envelope.py:184-188); today pec_orth and pec_orth_abs (and the log pair) each recompute the analytic signal and the O(P^2 T) loop.
    opp_type: cache-sharing
    expected_speedup: ~2x
    speedup_basis: 'complexity: family-warm 118x1024 increments pec_orth 0.088 s + pec_orth_abs 0.089 s, pec_orth_log 0.152 s + pec_orth_log_abs 0.152 s, no cache between them; with the shared matrix the second identifier is an O(P^2) abs/symmetrise; profile:audit/profiles/micro/misc.pec.orth-True_log-True__118x1024.pstats envelope_correlation 64.1% (51.5% self in the per-row orthogonalisation loop)'
    output_risk: unverified-bit-identical
    risk_evidence: both identifiers run the same per-row loop on the same analytic signal and differ only in the post-loop abs; caching C and applying the two post-steps repeats the same floating-point operations
    effort: S
    depends_on: []
  - opportunity_id: pec-1
    opportunity: Skip mne-connectivity's combine('mean') for the single epoch pyspi passes and read the stored upper triangle directly (PowerEnvelopeCorrelation.multivariate, pyspi/statistics/misc.py:170-174); combine runs xarray.apply_ufunc(vectorize=True), one np.mean call per connection (7,021 at P=118).
    opp_type: replace-library
    expected_speedup: ~1.5x
    speedup_basis: 'profile:audit/profiles/misc.pec.orth-True_log-False__8x1024.pstats mne_connectivity/base.py:combine 51.2% at 8x1024 (cProfile share, inflated); unprofiled wall share at 118x1024 0.38 (audit/profiles/micro/probe_pec_combine.json: combine 31.9 ms of 84.8 ms; the orthogonalisation loop is untouched) -> Amdahl bound 1.6x + complexity: O(P^2) Python-level calls that do no arithmetic for one epoch.
      Independent of pec-2 (independent_of), because pec-2 serves the abs identifier from the other identifier''s matrix (one envelope_correlation call instead of two) and this avenue
      cuts the combine cost inside each call that remains (fewer calls times a cheaper call), so the savings multiply'
