    21.90 / 45.63. Hypothesis: with unconstrained warping any two noise series align closely, so the SPI mostly reflects T and marginal shape.
    To be quantified on iid_gaussian vs bivariate_gaussian.'
  - 'Cross-family (infrastructure) candidate, affects direct two-array calls only: parse_bivariate (pyspi/base.py:33-36) builds Data() (normalise=True)
    and calls add_process(x) then add_process(y); the first call goes through set_data and is z-scored, the second is np.append-ed raw (pyspi/data.py:230-234).
    Probe with x, y ~ 5 + 3 N(0,1), T=64: stored means [0.0, 4.783], stds [1.0, 2.995]. So spi.bivariate(x, y) compares z-scored x with raw y.
    Calculator/multivariate paths are unaffected.'
