  what_changed: tslearn's DTW is sqrt(min over warping paths of sum (x_i - y_j)^2) with weight-1 steps and no length normalisation. Sakoe & Chiba 1978 (symmetric
    form, P = 0) uses |x_i - y_j| with diagonal weight 2 and divides by n + m. On this unit's 4 canon runs the two disagree in scale by a factor 23.96-55.18 (pyspi / 1978 form) and in ranking (Spearman 0.77-0.96 over the 6 pairs of a dataset), so this is a value-changing convention rather than a constant factor. pyspi documents only 'computed with tslearn', so
    it matches the supplement variant (rubric 7). The value grows with T (null mean 11.2 at T256, 21.8 at T1024, about sqrt(T)). Without z-scoring the value
    scales with amplitude (scaled_offset kernel/z-scored ratio 3.0-15.5) and a linear trend changes it by up to 279% (trending pipeline without detrend).
    On z-scored noise it barely separates an anti-correlated pair from independent pairs (see candidate 1).
