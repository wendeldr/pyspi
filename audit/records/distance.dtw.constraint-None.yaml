optimisation:
  complexity_P_T: 'O(P^2 T^2): tslearn dtw per ordered pair (TimeWarping is Undirected over Directed.multivariate, both orders computed, pyspi/statistics/distance.py:TimeWarping.bivariate),
    a T x T mask plus a numba DP over the full grid. Measured P_exponent 2.09, T_exponent 0.79 (8x256 -> 8x1024; a fixed per-call cost of tens
    of microseconds and a ~50 ms 8x256 overhead flatten it); 118x1024 measured (47.5 s per window). The P^2 pair term dominates.'
  hotspot_1: 'tslearn/metrics/_dtw.py:dtw (third-party:tslearn) 92.5% self time of the profiled SPI call at 8x1024 (numba _njit_dtw: mask and
    _njit_accumulated_matrix hidden in it)'
  hotspot_2: tslearn/backend/backend.py:instantiate_backend (third-party:tslearn) 5.6%, of which numpy arrayprint (str() of the input array) 4.6%
  hotspot_owner: third-party:tslearn
  opaque_share: 0.0184
  profile_file: audit/profiles/distance.dtw.constraint-None__8x1024.pstats
  opportunities:
  - opportunity_id: dtw_family-1
    opportunity: 'One batched numba kernel over the unordered pairs: call tslearn''s njit accumulated-matrix kernels directly (_njit_accumulated_matrix
      / njit_lcss_accumulated_matrix) from a loop over i < j, build the global-constraint mask once per window (it depends only on T and the constraint)
      and skip the per-call Python layer (instantiate_backend, which formats each input array with str() to sniff the backend; to_time_series;
      compute_mask). A prange over pairs adds thread parallelism (the kernels are nogil).'
