optimisation:
  complexity_P_T: 'O(P^2 T) in one call (pyspi/statistics/distance.py:PairwiseDistance.multivariate -> sklearn pairwise_distances, compiled scipy/sklearn
    kernel), but at EEG sizes the fixed per-call cost dominates: measured 0.49 ms at 8x1024 and 7.52 ms at 118x1024 (P_exponent 0.02-0.45, T_exponent
    about 0.1 between 8x256 and 8x1024).'
  hotspot_1: 'sklearn/metrics/pairwise.py:check_pairwise_arrays -> sklearn/utils/validation.py:check_array (third-party:sklearn) 33.4% of the profiled SPI call at 8x1024 (1.00 ms profiled; called from manhattan_distances): fixed per-call input validation, the largest deep frame at 8x1024. Everything runs under the sklearn/utils/_param_validation.py:wrapper (about 95%, a wrapper). At 118x1024 the compute grows with P^2 and this fixed cost becomes a small share'
  hotspot_2: 'scipy/spatial/distance.py:cdist (third-party:scipy) 5.5%, the compiled cityblock kernel over both triangles; manhattan_distances 42.8% includes the validation above'
  hotspot_owner: third-party:sklearn
  opaque_share: 0.3056
  profile_file: audit/profiles/distance.pdist.cityblock__8x1024.pstats
  no_opportunity_reason: 'No opportunity is listed: pdist is one compiled call per window, and the six pdist units together cost about 24 ms per 118x1024 window (about 14 core-seconds per 600-window patient). Calling scipy pdist + squareform directly would skip sklearn''s validation, a few percent of the call at 118x1024, and is not material at these walls (notes/pdist.md, Optimisation, Opportunities).'
  opportunities: []
