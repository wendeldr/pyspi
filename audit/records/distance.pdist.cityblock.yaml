unit_id: distance.pdist.cityblock
status: profiled
correctness:
  metric_name_standard: Manhattan / city-block / L1 distance between the two z-scored time series
  canonical_ref: Deza & Deza 2016, Encyclopedia of Distances (4th ed., Springer), entry 'Manhattan metric' (l1-metric; Minkowski p=1)
  canonical_definition: d(x,y) = sum_{t=1..T} |x_t - y_t|
  documented_definition: 'GitBook distance-similarity.md ''Pairwise Distance'' (lines 297-321): "Pairwise distance between time-series, computed using sklearn''s
    pairwise distance function using the following distance metrics: Euclidean, Cityblock, Cosine, Chebyshev, Canberra, Braycurtis"; keywords "undirected,
    nonlinear, unsigned, unordered". No formula is given. pdist is absent from the supplement: supplement §1.2 ''Distance similarity (26 SPIs)'', p.5 (heading
    line 209) lists SPIs 22-47 (dcorr, dcorrx, mgc, mgcx, hsic, hhg, dtw, lcss, softdtw, bary) and no pdist entry.'
  delegate_lib: scikit-learn==1.9.1 sklearn.metrics.pairwise.manhattan_distances -> scipy==1.17.1 scipy.spatial.distance.cdist(X, X, 'cityblock') (C++ _distance_pybind.cdist_cityblock)
  implemented_as: Rows z-scored (ddof=1) by default; sklearn manhattan_distances on dense numpy input calls scipy cdist(X, X, 'cityblock'), i.e. sum_t |x_t
    - y_t| for every ordered pair; diagonal later set to NaN by Calculator.
  implementation_trace:
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (Calculator defaults detrend=False, normalise=True,
    calculator.py:48-50; lines at HEAD a1f20c7)
  - pyspi/data.py:184-195 optional scipy.signal.detrend(axis=1), then zscore(data, axis=1, nan_policy='omit', ddof=1) per process
  - pyspi/calculator.py:329-335 S = self._spis[spi].multivariate(self.dataset); np.fill_diagonal(S, np.nan); self._table[spi] = S (HEAD a1f20c7)
  - 'pyspi/base.py:51-68 parse_multivariate: passes the Data object through unchanged'
  - pyspi/statistics/distance.py:28-36 class PairwiseDistance(Undirected, Unsigned); __init__ stores metric, identifier 'pdist_<metric>'
  - 'pyspi/statistics/distance.py:38-40 multivariate overrides Undirected.multivariate (base.py:132-138, never called): return pairwise_distances(data.to_numpy(squeeze=True),
    metric=self._metric)'
  - pyspi/data.py:108-118 to_numpy(squeeze=True) -> (M processes, T observations) float64; each row is one vector in R^T
  - sklearn/metrics/pairwise.py:2309 pairwise_distances(X, Y=None, metric, n_jobs=None, ensure_all_finite=True) (scikit-learn 1.9.1)
  - sklearn/metrics/pairwise.py:2463-2464 metric in PAIRWISE_DISTANCE_FUNCTIONS -> func (table at sklearn/metrics/pairwise.py:1919-1931)
  - sklearn/metrics/pairwise.py:2494 -> _parallel_pairwise; sklearn/metrics/pairwise.py:1971-1981 Y=None -> Y=X; effective_n_jobs(None)==1 -> func(X, X)
  - sklearn/metrics/pairwise.py:1055 manhattan_distances; sklearn/metrics/pairwise.py:1094 check_pairwise_arrays; sklearn/metrics/pairwise.py:1109 numpy
    namespace -> return distance.cdist(X, Y, 'cityblock')
  - scipy/spatial/distance.py:2606 cdist; scipy/spatial/distance.py:2922-2926 alias lookup -> metric_info.cdist_func = _distance_pybind.cdist_cityblock
    (scipy/spatial/distance.py:1681-1686, compiled scipy/spatial/_distance_pybind.cpython-312-x86_64-linux-gnu.so)
  - scipy/spatial/distance.py:948 cityblock(u, v) Python reference definition sum(|u - v|)
  deviation_from_documented: 'None in substance: the code is sklearn.metrics.pairwise_distances with metric=''cityblock'' as the GitBook page states. Not
    stated on the page: inputs are z-scored per process (ddof=1) by Data by default (optionally detrended first), sklearn forwards this metric to SciPy
    (cdist ''cityblock''), and the Calculator sets the diagonal to NaN. No formula or normalisation (e.g. per-sample scaling) is documented.'
  deviation_from_canonical: 'Formula: none (probe on 64x1024: max |A - scipy pdist| = 0.0, exactly symmetric). Domain: applied to z-scored data, so it measures
    mean absolute difference of standardised series.'
  units_and_range: 'Dimensionless (z-units) summed over T samples; range [0, 2 sum_t |x_t|] <= 2 sqrt(T (T-1)); 0 iff identical; for a bivariate Gaussian
    pair cityblock/T -> 2 sqrt((1-rho)/pi) (probe T=4e5, rho=0.8: 0.5045 vs 0.5046). Grows linearly with T; never negative.'
  direction_convention: 'A[i,j] = d(z_i, z_j) for rows i, j of the (z-scored) M x T data; the metric is symmetric so A[i,j] = A[j,i]; no direction is encoded;
    diagonal NaN after Calculator.compute (confirmed in the check stage: sym runs).'
  symmetry_expected: sym
  already_documented: docs/storage_comparison/REVIEW.md M1 (PairwiseDistance overrides Undirected.multivariate; output here is nevertheless exactly symmetric)
  new_finding_candidates:
  - 'Candidate (interpretation): value grows linearly with T (cityblock/T -> 2 sqrt((1-rho)/pi) for Gaussian pairs; probe rho=0: 1.1277 vs 1.1284), so values
    are not comparable across window lengths; it is a dissimilarity (larger = less coupled). Neither is stated in the GitBook page.'
  - 'Candidate (labels): for jointly Gaussian pairs cityblock/T is asymptotically a monotone function of rho only, so on Gaussian data it carries no information
    beyond linear correlation; ''nonlinear'' holds only in the sense that it is not an exact function of r on finite non-Gaussian samples.'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - nonlinear_dependence
    - anm
    path: kernel
    reference: 'from-scratch numpy loop over row pairs: sum(abs(x - y)) (no sklearn, no scipy.spatial)'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: PairwiseDistance(metric).multivariate(Data(x, normalise=False)) equals the numpy reference off the diagonal to rel 1e-12 at every
      T
  - datasets:
    - var2_bivariate
    - gauss_ar1_pair
    - iid_gaussian
    path: pipeline
    reference: A versus A.T (direction convention) and A[i,j] versus the numpy reference d(z_i, z_j) on the z-scored rows
    reference_kind: analytic
    criterion: direction
    expected_outcome: 'A[i,j] = A[j,i] = d(z_i, z_j): symmetric, no direction; diagonal NaN after Calculator; reciprocal entries bit-identical'
  - datasets:
    - bivariate_gaussian
    - scaled_offset
    path: pipeline
    reference: pipeline output on scaled_offset compared with pipeline output on bivariate_gaussian (same draw; positive scale + offset removed by z-scoring)
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: 'identical to rel 1e-12: default z-scoring makes every pdist metric invariant to positive per-channel scale and offset'
  - datasets:
    - trending
    - bivariate_gaussian
    path: pipeline-detrend
    reference: pipeline-detrend output on trending compared with pipeline-detrend output on bivariate_gaussian; plain pipeline on trending for contrast
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: with detrend the two agree to rel 1e-10 (linear trend removed exactly by scipy detrend); without detrend trending values differ markedly
      (trend dominates the distance)
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: same data with a common random permutation of the time index (numpy permutation)
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: 'unchanged to rel 1e-12: every pdist metric is invariant to a joint reordering of samples (supports the ''unordered'' label; shows
      no temporal structure is used)'
  - datasets:
    - delayed_noise
    path: pipeline
    reference: qualitative comparison of d(x0, x_k) for delays 1,3,5 against d on iid_gaussian pairs
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: 'delayed copies look as dissimilar as independent noise (e.g. cosine ~ 1): the metric is lag-0 only and cannot see delayed coupling'
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: population value T * 2 sqrt((1 - rho)/pi) (E|X-Y| for X-Y ~ N(0, 2(1-rho))) with rho from the dataset truth
    reference_kind: analytic
    criterion: statistical
    expected_outcome: cityblock/T within 3 standard errors of 2 sqrt((1-rho)/pi) at T=4096; error decreasing with T
  check_method: independent-impl
  check_reference: 'audit/checks/refs/pdist.py handlers run for this unit (run tag in parentheses): ref_def -> audit/checks/refs/_kernels_basic_misc.py:pdist_metric
