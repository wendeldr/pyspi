  verdict: related-quantity
  score_0_10: 4
  score_rubric: 4
  score_rubric_basis: anchor
  score_rubric_note: 'Anchor 4: the GP has no noise term and interpolates (std(r)/std(y) <= 1.3e-9 in 7/7 collapse runs), so the score is m*HSIC_b of x and (K + alpha
    I)^-1 y, a near-symmetric dependence score. It is within the raw-pair tolerance (median rel < 0.1, max < 0.3) of plain m*HSIC_b(x, y) in 10 of 13 runs. The replica
    at sklearn''s theta agrees to <= 1.6e-15 on 8 of 9 runs.'
  documentation_status: misdescribed
  verdict_adjusted: related-quantity
  score_adjusted: 4
  score_adjustment_rules: ''
  score_adjustment_reason: ''
  identifier_exceptions: ''
  what_changed: The GP has no noise term, so the marginal-likelihood fit interpolates (length scale at or near the 1e-5 bound) and the 'residual'
    is r = -alpha (K + alpha I)^-1 y ~ -(alpha/c) y. The score is therefore m*HSIC_b(x, (K + alpha I)^-1 y), a near-symmetric dependence
    score between x and y, not the residual-independence statistic of Hoyer et al.; it ranks the cubic anm pair wrongly at T=1024 and the
    tanh pair at T=256 where a canonical ANM (noise kernel) recovers both. The statistic is m*HSIC_b with m = min(T, 200) on a stride subsample.
    The value is defined only to ~1e-6 relative (one ulp of the fitted constant, BLAS thread count, SciPy build) and to the optimiser's end
    point (1.2% on iid_gaussian_T256).
  new_finding: true
  definition_under_review: false
