unit_id: causal.anm
status: profiled
correctness:
  metric_name_standard: 'additive-noise-model (ANM) residual-independence score for the hypothesis x -> y: HSIC between the GP-regression
    residual of y on x and x (Hoyer et al. 2008); here a single-direction HSIC statistic'
  canonical_ref: 'Hoyer, Janzing, Mooij, Peters & Scholkopf 2008, NIPS 21:689-696, sections 4-5 (procedure; GP regression "using a Gaussian
    kernel and independent Gaussian noise, optimizing the hyperparameters", HSIC test with gamma approximation of the null, accept/reject
    both directions); HSIC_b: Gretton, Bousquet, Smola & Scholkopf 2005, ALT, LNCS 3734:63-77; gamma-approximation test statistic m*HSIC_b:
    Gretton et al. 2008, NIPS 20 (hsicTestGamma)'
  canonical_definition: Fit y = f(x) + n by GP regression with RBF kernel plus a white-noise term (hyperparameters by marginal likelihood);
    residual n_hat = y - f_hat(x); test n_hat independent of x with HSIC (p-value); accept x -> y if independence is not rejected and y ->
    x is rejected. A score version uses the HSIC statistic HSIC_b(n_hat, x) = (1/m^2) tr(K H L H) (lower = more consistent with x -> y).
  documented_definition: 'supplement §1.3.1, p.8: ''we use the statistic from cdt as our SPI, which is computed by first predicting y from
    x via a Gaussian process (with a radial basis function kernel), and then computing the normalized HSIC test statistic from the residuals
    (see Sec. 1.2.5 above)''; keywords ''directed, nonlinear, unsigned''; cdt stated as v0.5.23 (supplement p.7). GitBook causal-inference.md
    ''Additive Noise Model'' repeats the text.'
  delegate_lib: cdt==0.6.0 cdt.causality.pairwise.ANM.normalized_hsic -> FastHsicTestGamma; scikit-learn==1.9.1 GaussianProcessRegressor
    (default kernel, fmin_l_bfgs_b via scipy==1.17.1 scipy.optimize.minimize L-BFGS-B); the GP+residual step is pyspi's own monkeypatch AdditiveNoiseModel.corrected_anm_score
    (replaces cdt ANM.anm_score)
  implemented_as: 'A[i, j] = corrected_anm_score(x = z[i], y = z[j]) on z-scored (ddof=1) data, single direction only (cdt predict_proba,
    which differences both directions and applies sklearn.scale, is NOT used). GP: GaussianProcessRegressor(random_state=42) with default
    kernel ConstantKernel(1.0, bounds 1e-5..1e5) * RBF(1.0, bounds 1e-5..1e5), alpha = 1e-10 jitter and NO noise kernel, hyperparameters
    by one L-BFGS-B run from theta = (0, 0). Residual r = gp.predict(x).reshape(-1, 1) - y. Score = normalized_hsic(r, x): both standardised
    (ddof=0), stride-subsampled to 200 points when T > 200 (indices floor(0 : m : (m-1)/199)), Gaussian kernels with sigma = sqrt(0.5 * median
    of positive squared pairwise distances) per variable, statistic = (1/m) * sum(Kc * Lc) = m * HSIC_b with m = min(T, 200); non-finite
    -> 0. Probe: on every tested pair the optimiser drives the RBF length scale to ~1e-5..8.3e-4 (max on anm_T64 pair 2 -> 3: 8.33e-4) (lower
    bound 1e-5, sklearn ConvergenceWarning), R^2 = 1.0 and residual std ~1e-10 with r ~= -(alpha / c^2) * y (median ratio 1.000001), so the
    score is essentially m*HSIC_b(y, x) of the raw pair. Exactly, r = K(K + alpha I)^-1 y - y = -alpha (K + alpha I)^-1 y, so the score is
    m*HSIC_b(x, standardised (K + alpha I)^-1 y); it equals m*HSIC_b(x, y) when K ~ c I (no x-spacings below the fitted length scale) and
    departs from it where near-coincident x values are smoothed together (check stage: contaminated, nonlinear_dependence_T64).'
  implementation_trace:
  - 'pyspi/data.py:184-195 Data.set_data: detrend only if detrend=True (default False), then scipy.stats.zscore(axis=1, ddof=1) if normalise=True
    (default); stored as (M, T, 1)'
  - 'pyspi/calculator.py:251-267 Calculator._load_yaml: configs is empty for the four causal classes, so iterating None raises TypeError
    and the class is instantiated with no arguments (261-267); labels come from the class attribute'
  - 'pyspi/calculator.py:327-339 Calculator.compute: S = spi.multivariate(dataset) (329); fill_diagonal(S, nan) (332); any exception -> whole
    matrix NaN (336-339) with a warning (354-355)'
  - 'pyspi/base.py:84-94 Directed.multivariate: A[i, j] = self.bivariate(data, i=i, j=j) for every ordered pair i != j (no mirroring)'
  - 'pyspi/base.py:27-49 parse_bivariate: two raw arrays are wrapped into a new Data object (base.py:33-36) and i, j = 0, 1 is set (base.py:41-43);
    Data.add_process z-scores only the first array (data.py:238 set_data, normalise=True) and appends the second raw (data.py:230-234); the
    Calculator/multivariate path passes the already z-scored Data through unchanged. Owned by unit preproc.two_array_api'
  - pyspi/data.py:108-118 Data.to_numpy returns the (M, T, 1) array, so z[i] is a (T, 1) column
  - 'pyspi/config.yaml:326-334 AdditiveNoiseModel: labels directed/nonlinear/unsigned/bivariate/contemporaneous, configs empty'
  - pyspi/statistics/causal.py:3-6 imports ANM from cdt.causality.pairwise, sklearn GaussianProcessRegressor and cdt normalized_hsic
  - pyspi/statistics/causal.py:15 class labels ['unsigned', 'causal', 'unordered', 'linear', 'directed'] (says 'linear')
  - 'pyspi/statistics/causal.py:17-24 corrected_anm_score: gp = GaussianProcessRegressor(random_state=42).fit(x, y); y_predict = gp.predict(x).reshape(-1,
    1); return normalized_hsic(y_predict - y, x); line 24 ANM.anm_score = corrected_anm_score executed in the class body (patches cdt''s
    ANM class globally at import, comment cites cdt PR #155)'
  - 'pyspi/statistics/causal.py:26-29 bivariate: z = data.to_numpy(); return ANM().anm_score(z[i], z[j])'
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/ANM.py:178-192 original anm_score (bypassed): gp.predict(x) is (T,) and y
    is (T, 1), so y_predict - y would broadcast to (T, T); this is what the pyspi patch fixes'
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/ANM.py:106-111 normalized_hsic: x and y standardised with np.mean/np.std (ddof=0),
    then FastHsicTestGamma(x, y)'
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/ANM.py:69-103 FastHsicTestGamma(sig=[-1, -1], maxpnt=200): stride subsample
    when m > 200 (81-86), H = I - 11''/m (91), K = rbf_dot(X, -1), L = rbf_dot(Y, -1) (93-94), centring (96-97), testStat = (1/m) * (Kc.T
    * Lc).sum() (99), non-finite -> 0 (100-101); no gamma p-value despite the name'
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/ANM.py:53-66 rbf_dot: squared distances H; deg = sqrt(0.5 * median(positive
    upper-triangle squared distances)) (61-63); K = exp(-H / (2 deg^2)) (64)'
  - '.venv/lib/python3.12/site-packages/sklearn/gaussian_process/_gpr.py:211-230 __init__ defaults: kernel=None, alpha=1e-10, optimizer=''fmin_l_bfgs_b'',
    n_restarts_optimizer=0, normalize_y=False'
  - .venv/lib/python3.12/site-packages/sklearn/gaussian_process/_gpr.py:249 kernel_ = C() * RBF() when kernel is None
  - .venv/lib/python3.12/site-packages/sklearn/gaussian_process/kernels.py:1236 ConstantKernel(constant_value=1.0, constant_value_bounds=(1e-5,
    1e5)); :1511 RBF(length_scale=1.0, length_scale_bounds=(1e-5, 1e5)) (bounds not fixed, so 2 hyperparameters are optimised)
  - .venv/lib/python3.12/site-packages/sklearn/gaussian_process/_gpr.py:299-341 hyperparameter optimisation by maximising log marginal likelihood;
    restarts (322-333) only when n_restarts_optimizer > 0, the only use of self._rng (251), so random_state=42 has no effect
  - '.venv/lib/python3.12/site-packages/sklearn/gaussian_process/_gpr.py:658-674 _constrained_optimization: scipy.optimize.minimize(method=''L-BFGS-B'',
    jac=True, bounds)'
  - .venv/lib/python3.12/site-packages/sklearn/gaussian_process/_gpr.py:346-368 K + alpha*I Cholesky (LinAlgError re-raised -> pyspi NaN
    matrix), alpha_ = cho_solve(L, y)
  - '.venv/lib/python3.12/site-packages/sklearn/gaussian_process/_gpr.py:445-454 predict: y_mean = K_trans @ alpha_, squeezed to (T,) for
    a single target'
  deviation_from_documented: (a) 'see Sec. 1.2.5' points to pyspi's hsic SPI (hyppo, normalised and square-rooted HSIC with x-only bandwidth);
    anm uses cdt's own statistic m*HSIC_b (m = min(T, 200), stride subsample to 200 points, per-variable median-heuristic bandwidth on squared
    distances), which is neither normalised nor bounded and scales with m up to 200. (b) 'Gaussian process (with a radial basis function
    kernel)' is accurate, but the GP has no noise term and its fitted length scale collapses to the 1e-5 bound, so the 'residuals' are ~1e-10*y
    roundoff-level quantities, not noise estimates (candidate below). (c) Class label 'linear' (causal.py:15) contradicts the documented
    keyword 'nonlinear' and config.yaml:329. (d) Documented cdt v0.5.23; installed cdt 0.6.0 (already documented). (e) Only one direction
    is returned; the documentation does not say that cdt's ANM decision (score(b,a) - score(a,b)) is not used, nor that lower values mean
    'more consistent with i -> j'.
  deviation_from_canonical: '(1) Regression lacks the independent Gaussian noise term that Hoyer et al. 2008 §5 use; with alpha = 1e-10 the
    marginal-likelihood optimum interpolates the data (length scale -> 1e-5 bound, R^2 = 1.0), which is exactly the overfitting Hoyer et
    al. §4 warn ''may lead one to falsely accept models''; the resulting score tracks HSIC(x, y) of the raw pair rather than residual independence
    (probe: anm_T64 9/12 entries equal the plain m*HSIC_b(y, x) to 4 decimals, the exceptions being (2,0), (2,1), (2,3); max relative difference
    0.09-0.24 across 5 datasets). (2) Returns the test statistic m*HSIC_b, not a p-value or a two-direction comparison. (3) HSIC computed
    on a deterministic 200-point stride subsample for T > 200. (4) Time-series samples treated as iid (as in the original method).'
  units_and_range: 'dimensionless; >= 0 (centred Gaussian Gram matrices are PSD); scales with m = min(T, 200) (statistic is m*HSIC_b), so
    values are not comparable across T < 200; set to 0 if non-finite; observed 0.078-0.35 on independent pairs (check stage) and 2-23 on
    strongly dependent pairs; not symmetric by construction but nearly symmetric in practice because of the collapse (anm_T256: A[0,1] =
    8.017, A[1,0] = 8.201; A[2,3] = 22.16, A[3,2] = 20.03); NaN matrix if the Cholesky fails.'
  direction_convention: A[i, j] = score for the hypothesis i -> j (x = process i regressed onto, y = process j predicted); under the ANM
    principle LOWER means more consistent with i -> j. Code-derived; to be confirmed empirically on the anm dataset (x0 -> x1, x2 -> x3).
  symmetry_expected: asym
  already_documented: 'partly: installed cdt 0.6.0 vs documented 0.5.23 and SciPy 1.18 changing anm beyond tolerances are in DEPENDENCY_MIGRATION.md
    (SciPy 1.17.1 row, CDT 0.6.0 row) and EEG_OPTIMIZATION_NOTES.md §review (''SciPy 1.18 / ANM drift''); the GP collapse, the HSIC-of-raw-pair
    behaviour and the label mismatch are not documented (label structure generally: docs/storage_comparison/REVIEW.md M9)'
  new_finding_candidates:
  - 'Candidate (GP collapse makes anm a near-symmetric HSIC(x, y) dependence score): probe with sklearn defaults gives kernel_ ''1**2 * RBF(length_scale=5.29e-05)''
    (anm_T256 0->1), ''0.992**2 * RBF(length_scale=1e-05)'' (anm_T64), ''1**2 * RBF(length_scale=1e-05)'' (anm_T1024, bivariate_gaussian_T1024)
    with ConvergenceWarning ''k2__length_scale is close to the specified lower bound 1e-05''; residual std 1.0e-10 vs y std 0.998, R^2 =
    1.0; median of r / (-1e-10 * y / c^2) = 1.0000; anm_T64 matrix equals m*HSIC_b(z_j, z_i) for 9 of 12 entries to 4 decimals (exceptions
    (2,0) 0.6091 vs 0.6409, (2,1) 0.5530 vs 0.5896, (2,3) 6.314 vs 7.417; anm_T256 0 of 12 at 4 decimals, max relative 0.124; probe fix_cdt/anm_count.py),
    fitted length scales 1e-5..8.33e-4 on anm_T64, max relative difference 0.15 (anm_T64), 0.18 (anm_T1024), 0.14 (iid_gaussian_T256), 0.24
    (nonlinear_dependence_T256), 0.09 (bivariate_gaussian_T1024).'
  - 'Candidate (wrong causal ranking as a consequence): anm_T256 true pair x2 -> x3 gives A[2,3] = 22.16 > A[3,2] = 20.03 and anm_T1024 x0
    -> x1 gives A[0,1] = 7.976 > A[1,0] = 7.677 (lower should be causal); a GP with C*RBF + WhiteKernel ranks the true direction lower (anm_T64
    0.352 vs 0.475; anm_T1024 0.410 vs 2.377; nonlinear_dependence_T256 0.314 vs 11.03).'
  - 'Candidate (mechanism for documented SciPy drift): because the residual is r ~= -(1e-10/c^2) y plus roundoff of the near-singular solve
    (corr(r, y) ranges -0.21 to -1.0 across probes), the score depends on optimiser end points at the bound and on last-bit linear algebra;
    this may explain the SciPy 1.18 sensitivity recorded in DEPENDENCY_MIGRATION.md (hypothesis, not tested).'
  - 'Candidate (random_state=42 is a no-op): _gpr.py:322 uses the RNG only for restarts and n_restarts_optimizer=0; probe max |predict(rs=42)
    - predict(rs=7)| = 0.0.'
  - 'Candidate (label metadata): AdditiveNoiseModel.labels contains ''linear'' (causal.py:15) while config.yaml:329 and supplement §1.3.1
    say ''nonlinear''; calculator.py:258-260 and 265-267 report the class labels.'
  - 'Candidate (global side effect): causal.py:24 replaces cdt.causality.pairwise.ANM.anm_score for the whole process at import (probe: ANM.anm_score
    is AdditiveNoiseModel.corrected_anm_score -> True), so any cdt ANM use in the same interpreter silently gets pyspi''s version.'
  - 'Candidate (T-dependent scale): statistic = (1/m) sum(Kc*Lc) = m*HSIC_b (ANM.py:99) with m = min(T, 200), so for T < 200 values grow
    with T even at fixed dependence; HSIC is computed on a 200-point stride subsample for T > 200 (ANM.py:81-86).'
