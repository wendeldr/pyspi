    RRR, the kernel and R urca. Score mapping (as for johansen_order-0_ardiff-10, whose note section covers both): the numeric half of anchor 10 is met (fp-exact against the textbook RRR case 3, 8/8 at max_rel 5.2e-14, and R urca ca.jo, 8/8 at max_rel 3.3e-13, both independent of statsmodels), and its second half, ''matches the pyspi supplement description'', fails: the supplement calls the outputs the ''maximum eigenvalue'' and ''trace'' of the VECM and the parameter ''autoregressive lags of 1''. These are description errors, not one of anchor 9''s trivial value conventions, so 9 is the nearest-anchor reading (score_rubric_note). The own kernel (_kernels_basic_misc.johansen, 19/19 at max_rel 1.35e-12) transcribes statsmodels'' placement of the deterministic terms, so it does not carry the independent-impl label. Conventions: ''ardiff'' counts lagged differences (VAR order k+1) where the supplement says ''autoregressive lags''; ''maximum eigenvalue'' and ''trace'' name the LR statistics.
