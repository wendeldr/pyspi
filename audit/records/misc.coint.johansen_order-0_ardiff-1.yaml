optimisation:
  complexity_P_T: 'O(P^2 (k^2 T + k^3)) with k = 1: one statsmodels coint_johansen per unordered pair (pyspi/statistics/misc.py:62-97 caches (i, j) and (j, i); the trace_stat identifier is then a cache hit, 0.008 s at 118x1024), residualising differences and lagged levels on 2 lagged differences plus det_order=0 terms by OLS over about T rows. Measured P_exponent 2.06, T_exponent 0.09: per-call statsmodels overhead still dominates at T=1024. Pair term dominates; measured 5.7 s per window at 118x1024 (family-warm, measured).'
  hotspot_1: statsmodels/tsa/vector_ar/vecm.py:detrend (third-party:statsmodels) 67.5% of the profiled SPI call at 8x1024 (112 statsmodels OLS fits, OLS.fit 33.8%); coint_johansen 97.9% overall
  hotspot_2: statsmodels/tsa/vector_ar/vecm.py:resid (third-party:statsmodels, numpy pinv/svd inside) 13.3% of the profiled SPI call at 8x1024; numpy/linalg/_linalg.py:svd 19.1% in total
  hotspot_owner: third-party:statsmodels
  opaque_share: 0.18
  profile_file: audit/profiles/misc.coint.johansen_order-0_ardiff-1__8x1024.pstats
  opportunities:
  - opportunity_id: coint-1
    opportunity: 'Batch the Johansen moment matrices: the regressors of a pair are the union of two per-channel blocks (lagged differences plus the deterministic terms), so build one Gram matrix of all channels'' detrended level, difference and lagged-difference columns per window, form each pair''s S00/S0k/Skk by Schur complements of 2(k+1)-sized blocks, and solve the 2x2 generalised eigenproblems for all pairs in one vectorised call (replaces statsmodels vecm.py:coint_johansen per pair).'
    opp_type: vectorise-batch
    expected_speedup: 10-50x
    speedup_basis: 'profile:audit/profiles/misc.coint.johansen_order-0_ardiff-1__8x1024.pstats base.py:multivariate 99.926% (the pair loop, replaced as a whole by the batched computation) -> Amdahl bound 1,350x at 8x1024; vecm.py:coint_johansen alone 97.92% (detrend 67.5% via statsmodels OLS, resid 13.3% via numpy pinv/svd) -> bound 48x if only the per-pair Johansen call were replaced + complexity: per pair O(T k^2) OLS with statsmodels object overhead becomes O(k^3) on precomputed moments after one O(P^2 k^2 T) Gram product'
    output_risk: unverified-within-tolerance
    risk_evidence: same reduced-rank regression, but normal-equation Schur complements replace statsmodels OLS/pinv residualisation (vecm.py:650-683), a different factorisation and float order; the check stage already sees column-order changes of <= 5.2e-12 relative
    effort: L
    depends_on: []
