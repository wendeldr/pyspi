unit_id: basic.cov.EmpiricalCovariance
status: profiled
correctness:
  metric_name_standard: sample (maximum-likelihood, divisor T) covariance matrix
  canonical_ref: Anderson 2003, An Introduction to Multivariate Statistical Analysis (3rd ed.), Wiley, §3.2 (MLE of the covariance matrix, divisor N)
  canonical_definition: Sigma_hat = (1/T) sum_t (x_t - xbar)(x_t - xbar)^T; for unit-variance inputs the off-diagonal is Pearson r
  documented_definition: 'supplement §1.1.1, p.3-4 (supplement.txt:136-157): ''Due to the z-scoring of the time series, the correlation and covariance matrices are equivalent and thus the covariance statistic is within [-1, 1].'' Keywords: undirected, linear, signed, multivariate, contemporaneous. GitBook basic-statistics.md:15-45 repeats the text (its keyword line says ''undirected, nonlinear, unsigned, bivariate''). Neither source documents the ''-sq'' (squared) variants generated by pyspi/config.yaml.'
  delegate_lib: scikit-learn==1.9.1 sklearn.covariance.EmpiricalCovariance().fit(X).covariance_; numpy==2.5.4
  implemented_as: Data z-scores each channel with ddof=1 (pipeline default); sklearn.covariance.EmpiricalCovariance() with defaults is fit on the (T x P) array; no shrinkage; covariance_ off-diagonal returned (diagonal NaN). Sample covariance uses divisor T (np.cov bias=1) after sample-mean centring, so on the default pipeline the off-diagonal equals (T-1)/T * Pearson r. Squared variant (cov-sq_*) = np.square of the same matrix, labelled unsigned.
  implementation_trace:
  - pyspi/data.py:59-71 Data.__init__ default normalise=True, detrend=False
  - pyspi/data.py:184-195 optional scipy.signal.detrend then zscore(data, axis=1, nan_policy='omit', ddof=1)
  - pyspi/calculator.py:327-339 (HEAD a1f20c7) Calculator.compute try block; :329 calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :335 stores S in the table; :336-339 any exception -> the whole SPI entry set to NaN and the error recorded, warning issued at :354-355
  - 'pyspi/base.py:51-66 parse_multivariate (inplace=True: the cache written onto the Data object persists across SPIs)'
  - pyspi/statistics/basic.py:9 class Estimators(Undirected, Signed); its multivariate overrides Undirected.multivariate (pyspi/base.py:132-138), so no triangle mirroring
  - 'pyspi/statistics/basic.py:18-29 Estimators.__init__: identifier suffix ''_<estimator>'' or ''-sq_<estimator>''; squared sets labels+[''unsigned''] and issigned()->False'
  - 'pyspi/statistics/basic.py:31-44 _from_cache: z = data.to_numpy(squeeze=True).T (observations x processes); getattr(sklearn.covariance, estimator)().fit(z) with ALL sklearn defaults; fitted object cached in data.covariance[estimator] and shared by cov_* and prec_* of that estimator'
  - 'pyspi/statistics/basic.py:46-54 multivariate: matrix = getattr(mycov, ''covariance_'') (line 49); np.fill_diagonal(matrix, np.nan) IN PLACE on the cached sklearn attribute (line 50); returns np.square(matrix) if squared (line 52) else the cached array object itself (line 54)'
  - pyspi/statistics/basic.py:57-63 Covariance(kind='covariance'), identifier 'cov'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:232-256 EmpiricalCovariance.fit: location_ = X.mean(0) (line 253); covariance = empirical_covariance(X) (line 254); self._set_covariance (line 255)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:65-110 empirical_covariance: assume_centered=False -> np.cov(X.T, bias=1) (line 107), i.e. divisor T'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:196-215 _set_covariance: covariance_ = covariance (line 210); store_precision=True default (line 192) -> precision_ = scipy.linalg.pinvh(covariance, check_finite=False) (line 213)'
  deviation_from_documented: Docs say covariance equals correlation and lies in [-1,1]. Implemented value is (T-1)/T * r on the default pipeline (ddof=1 z-score vs divisor-T covariance). With normalise=False the value is the raw MLE covariance, not bounded by 1. The '-sq' squared variants are undocumented in the supplement and GitBook. GitBook keyword line ('undirected, nonlinear, unsigned, bivariate') contradicts the supplement and the code labels (linear, signed, multivariate).
  deviation_from_canonical: none for the estimator (canonical MLE divisor T); the (T-1)/T factor relative to Pearson r arises from pyspi's ddof=1 z-scoring
  units_and_range: 'dimensionless (input units squared on the kernel path); signed; symmetric (bitwise); cov-sq in [0,1). Pipeline path: |value| <= (T-1)/T; NaN diagonal.'
  direction_convention: 'undirected: A[i,j] is the (i,j) entry of the fitted sklearn covariance_ for processes i and j (rows of the Data array); no ordering, symmetric bitwise; to be confirmed empirically in the check stage'
  symmetry_expected: sym
  already_documented: REVIEW M1 (Estimators.multivariate bypasses Undirected mirror)
  new_finding_candidates:
  - 'Candidate: multivariate() mutates the cached sklearn estimator in place and returns an alias of it. pyspi/statistics/basic.py:49-50 ''matrix = getattr(mycov, self._kind + "_")'' then ''np.fill_diagonal(matrix, np.nan)''; probe: after Covariance(...).multivariate(dat), dat.covariance[''EmpiricalCovariance''].covariance_ diagonal is [nan nan nan nan] and ''returned is cache: True''. No current output changes (precision_ is computed at fit time, before the mutation, and nothing else reads data.covariance), but any later consumer of the cached fit (get_precision, score, mahalanobis) or of the returned array would see the NaN diagonal or alias the cache.'
  - 'Candidate (documentation): the supplement claim ''covariance and correlation matrices are equivalent'' is exact only up to (T-1)/T; probe bivariate_gaussian T=1024: max |C - (1-s)(T-1)/T r| <= 4.4e-16, while C[2,3] = 0.79671 vs r = 0.79749.'
  - 'Candidate (documentation): the ''cov-sq_*''/''prec-sq_*'' variants (pyspi/config.yaml:21-36, 56-71) are not described in supplement §1.1.1-1.1.2 or GitBook; probe confirms they are exactly np.square of the unsquared matrix (np.array_equal True).'
  - 'Candidate (documentation): GitBook basic-statistics.md:17 lists Covariance keywords ''undirected, nonlinear, unsigned, bivariate'', contradicting supplement §1.1.1 (''undirected, linear, signed, multivariate'') and pyspi/config.yaml:5-10.'
