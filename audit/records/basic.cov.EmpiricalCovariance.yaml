optimisation:
  complexity_P_T: 'O(P^2 T) for the empirical covariance + O(P^3) for scipy.linalg.pinvh (a full eigh) that sklearn _empirical_covariance.py:_set_covariance runs for precision_ on every fit; one fit per
    Data and estimator (pyspi/statistics/basic.py:Estimators._from_cache). Measured fresh P_exponent 0.13, T_exponent 0.14: between 8 and 32 channels and 256 and 1024 samples the ~0.7 ms of fixed sklearn
    validation dominates, so neither exponent reflects the algorithm. At 118x1024 the P^3 term dominates: in the 118x1024 EmpiricalCovariance profile eigh is 58.7% and np.cov 15.4% of the call; the same
    pinvh on a 118x118 matrix runs for every estimator of this family.'
  hotspot_1: scipy/linalg/_basic.py:pinvh (third-party:scipy) 13.1% cumulative of the profiled SPI call at 8x1024, of which scipy/linalg/_decomp.py:eigh 5.9%; at 118x1024 eigh is 58.7% (pinvh 63.0%) of
    this call (audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats, index prof_basic__index.json), the same 118x118 pinvh this estimator runs
  hotspot_2: sklearn/utils/validation.py:check_array (third-party:sklearn) 31.6% at 8x1024 (fixed input validation; 10.6% at 118x1024 in the EmpiricalCovariance profile); numpy/lib/_function_base_impl.py:cov
    11.4% at 8x1024
  hotspot_owner: third-party:scipy
  opaque_share: 0.212
  profile_file: audit/profiles/basic.cov.EmpiricalCovariance__8x1024.pstats; audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats
  opportunities:
  - opportunity_id: cov_prec_simple-1
    opportunity: Compute precision_ with a Cholesky factorisation (scipy.linalg.cho_factor + cho_solve, or LAPACK potri) instead of scipy.linalg.pinvh, which sklearn's _empirical_covariance.py:_set_covariance
      runs as a full eigh for every fit; in pyspi this means fitting with store_precision=False in basic.py:Estimators._from_cache and inverting there at fit time (before any identifier's in-place np.fill_diagonal
      at basic.py:49-50), with a pinvh fallback when the factorisation fails.
    opp_type: algorithmic
    expected_speedup: ~2x
    speedup_basis: 'profile:audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats scipy/linalg/_decomp.py:eigh 58.7% (pinvh 63.0%) of this call, the same 118x118 pinvh + complexity: Cholesky
      inverse ~P^3 vs eigh ~9P^3 flops; scratch timing at 118x118 pinvh 2.17 ms vs Cholesky inverse 0.21 ms; this unit''s measured fresh 118x1024 wall is 3.77 ms (summary.json), so the 2.17 ms pinvh is
      ~58% of it and the Amdahl bound is 1/(1-0.58) = 2.4x.
      Subsumed by cov_prec_simple-2 on this unit (subsumed_by), because in a cov-only run that avenue skips the pinvh this one makes cheaper; cov_prec_simple-2 gives no gain on the EEG
      selection (eeg_applicable false), so in tier 0 this avenue is ranked on its own k'
    output_risk: unverified-bit-identical
    risk_evidence: the cov/cov-sq identifiers read only covariance_, which sklearn _empirical_covariance.py:_set_covariance assigns (line 210) before and independently of the precision step (line 213),
      so a different inverse cannot change it; the ~1e-15 rounding change and the rank-deficient pinvh fallback concern precision_ only (the basic.prec.* units)
    effort: M
    depends_on: []
    subsumed_by:
    - cov_prec_simple-2
  - opportunity_id: cov_prec_simple-2
    opportunity: 'Make the precision lazy for cov/cov-sq identifiers: fit with store_precision=False when only covariance_ is read, keep a copy of covariance_ taken at fit time, and compute precision_ from
      that copy on the first prec/prec-sq request for the same cached estimator (basic.py:Estimators._from_cache / multivariate). The copy is required because the cov identifiers overwrite the cached covariance_''s
      diagonal with NaN in place (basic.py:47-50).'
    opp_type: cache-sharing
    expected_speedup: ~2x
    speedup_basis: 'profile:audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats scipy/linalg/_basic.py:pinvh 63.0% of this call + complexity: covariance_ is final before _set_covariance
      calls pinvh, so a cov-only run skips the O(P^3) step; this unit''s measured fresh 118x1024 wall is 3.77 ms (summary.json), so the 2.17 ms pinvh is ~58% of it and the Amdahl bound is 1/(1-0.58) = 2.4x;
      no gain when the prec sibling is also computed (the EEG selection keeps both).
      eeg_applicable false, because the Precision unit of the same estimator reads this unit''s cached fit (data.covariance keyed by estimator, pyspi/statistics/basic.py:31-44) and the
      EEG selection keeps both, so in an EEG run the pinvh moves to the prec identifier instead of disappearing; the row is ranked outside tier 0 on the configured identifiers'
    output_risk: unverified-bit-identical
    risk_evidence: 'pinvh of the fit-time copy is the same call on the same bits as today''s _set_covariance pinvh (line 213), and covariance_ is assigned before and independently of it (line 210). Without
      the copy, a prec/prec-sq request after a cov identifier (the config and EEG order) would invert the NaN-diagonal matrix that basic.py:49-50 writes into the cached covariance_ (check_array in _set_covariance
      rejects NaN): semantic. The output at risk is the prec/prec-sq value of the same run'
    effort: S
    depends_on: []
    eeg_applicable: false
