unit_id: basic.cov.GraphicalLasso
status: profiled
correctness:
  metric_name_standard: graphical-lasso (l1-penalised Gaussian MLE) covariance estimate W = Theta_hat^{-1}, off-diagonal entries; alpha = 0.01; cov-sq is its square
  canonical_ref: 'Friedman J, Hastie T, Tibshirani R 2008, ''Sparse inverse covariance estimation with the graphical lasso'', Biostatistics 9(3):432-441, eq. (1)/(2.1) (diagonal penalised); off-diagonal-only
    penalty: Yuan M, Lin Y 2007, ''Model selection and estimation in the Gaussian graphical model'', Biometrika 94(1):19-35, eq. (4); Banerjee O, El Ghaoui L, d''Aspremont A 2008, JMLR 9:485-516'
  canonical_definition: 'Theta_hat = argmin_{Theta > 0} -log det Theta + tr(S Theta) + alpha * sum_{i != j} |Theta_ij| (Friedman 2008 sums over all i,j incl. the diagonal; Yuan & Lin 2007 penalise off-diagonals
    only); Sigma_hat = W = Theta_hat^{-1}; KKT: W_ii = S_ii (+alpha if diagonal penalised), W_ij = S_ij + alpha*sign(Theta_ij) if Theta_ij != 0, |W_ij - S_ij| <= alpha otherwise; partial correlation rho_ij|rest
    = -Theta_ij / sqrt(Theta_ii Theta_jj)'
  documented_definition: 'supplement §1.1.1, p.3-4: ''Due to the z-scoring of the time series, the correlation and covariance matrices are equivalent and thus the covariance statistic is within [-1, 1].
    We use v0.24.1 of scikit-learn ... the Lasso technique, which uses an l1-regularization to sparsify the covariance matrix GraphicalLasso (as well as a method with the regularization method chosen through
    cross validation with five splits, GraphicalLassoCV)''; keywords ''undirected, linear, signed, multivariate, contemporaneous''. GitBook basic-statistics.md (Covariance) repeats the text but gives keywords
    ''undirected, nonlinear, unsigned, bivariate, contemporaneous''. The -sq (squared) identifiers are not described in the supplement. Identifiers: cov_GraphicalLasso, cov-sq_GraphicalLasso.'
  delegate_lib: scikit-learn==1.9.1 sklearn.covariance.GraphicalLasso().fit (solver sklearn.covariance._graph_lasso._graphical_lasso, inner sklearn.linear_model._cd_fast.enet_coordinate_descent_gram); numpy==2.5.4,
    scipy==1.17.1 (zscore, pinvh)
  implemented_as: 'Each channel z-scored (ddof=1, optional detrend); X = (T, P) array; sklearn.GraphicalLasso() with library defaults: S = biased empirical covariance (divide by T, so S_ii=(T-1)/T); alpha
    = 0.01 fixed (absolute, on the (T-1)/T-scaled correlation matrix). Solver: sklearn block coordinate descent (Friedman 2008 glasso algorithm) with off-diagonal-only l1 penalty, start 0.95*S off-diagonal,
    stop when |dual gap| < 1e-4 or after 100 sweeps (warning silenced). Returns covariance_ (the solver''s W iterate, diagonal = S_ii) with diagonal set to NaN; -sq returns the elementwise square. Fit shared
    through data.covariance[''GraphicalLasso''] by cov, cov-sq, prec, prec-sq; exactly symmetric because rows/columns are written together.'
  implementation_trace:
