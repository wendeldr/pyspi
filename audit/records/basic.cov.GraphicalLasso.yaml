    changed afterwards: diagonal unpenalised); precision_ = pinvh(covariance_)'
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/sklearn/covariance/_graph_lasso.py:119-177 block coordinate descent over columns: inner lasso via cd_fast.enet_coordinate_descent_gram warm-started
    from -precision_[:,idx]/precision_[idx,idx] (:134-156, inner max_iter=max(20,max_iter), tol=enet_tol); precision_ column/row and covariance_ column/row are written symmetrically (:169-177)'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/sklearn/linear_model/_cd_fast.pyx:1092 enet_coordinate_descent_gram; :1173 tol *= ||y||^2; :1176-1182 returns before any coordinate update
    (n_iter 0) when the warm-start duality gap is already 0 <= gap <= tol
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/sklearn/covariance/_graph_lasso.py:178-201 after each sweep: FloatingPointError if precision_ not finite or cost not finite; d_gap = _dual_gap
    (:56-65, off-diagonal |Theta| penalty, :43-53 objective likewise); stop when |d_gap| < tol; otherwise ConvergenceWarning after max_iter (silenced by pyspi)'
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/sklearn/covariance/_graph_lasso.py:206 returns (covariance_, precision_, costs, n_iter): both matrices are the solver''s running iterates;
    neither is recomputed as the inverse of the other at exit'
  deviation_from_documented: '(1) The supplement says the l1 penalty ''sparsif[ies] the covariance matrix''; it sparsifies the precision matrix (penalty on Theta, _graph_lasso.py:52, :64); W = covariance_
    is generally dense (probe sparse_precision T=1024: no exact zeros in W while Theta has 2). (2) ''correlation and covariance matrices are equivalent'': here W is a shrunk estimate with |W_ij - S_ij|
    <= alpha and S_ij = (T-1)/T * r_ij, so values differ from Pearson r by up to alpha + r/T. Range [-1,1] holds. (3) Documented scikit-learn v0.24.1; executed 1.9.1 (inner CD max_iter changed from max_iter
    to max(20, max_iter), do_screening and a pre-loop duality-gap early exit added (1.9.1 _cd_fast.pyx:1173-1182; absent in 0.24.1, whose first gap check is inside the loop after a coordinate pass, 0.24.1
    _cd_fast.pyx:571-610). Overall numeric effect versus 0.24.1 not measured; the 1.9.1 exit causes the var2_bivariate T=4096 stall, see candidates). (4) GitBook keywords ''nonlinear, unsigned, bivariate''
    contradict the supplement/class labels ''linear, signed, multivariate''. (5) -sq variants undocumented.'
  deviation_from_canonical: 'Variant of Friedman et al. 2008: the diagonal is not penalised (sklearn docstring _graph_lasso.py:328-329; W_ii = S_ii exactly, probe), which matches Yuan & Lin 2007 / R glasso(penalize.diagonal=FALSE).
    S uses divisor T on ddof=1 z-scored data. Optimisation is approximate: default tol=1e-4 on the absolute dual gap, 100 sweeps, and the result is returned even without convergence; on ill-conditioned
    inputs the output can be measurably sub-optimal (candidate). alpha=0.01 is an arbitrary fixed absolute penalty, not data-adaptive. The reported value is W itself; canonical W = Theta_hat^{-1} holds
    only to solver tolerance.'
  units_and_range: dimensionless (data are z-scored); signed, off-diagonals within [-(T-1)/T, (T-1)/T] by positive definiteness; -sq in [0, ((T-1)/T)^2]; exactly symmetric; diagonal NaN; exact 0 when |S_ij|
    is small only through the Theta support (W itself rarely exactly 0); whole matrix NaN when the solver raises FloatingPointError
  direction_convention: 'undirected: A[i,j] = A[j,i] (bit-exact in probes), i and j index processes in input row order; no lag; diagonal NaN'
  symmetry_expected: sym
  already_documented: REVIEW M1 (Estimators.multivariate overrides Undirected.multivariate, no mirroring; values are nevertheless exactly symmetric here). Otherwise no.
  new_finding_candidates:
  - 'CANDIDATE (silent non-convergence): pyspi suppresses every warning around the fit (basic.py:37-38), so sklearn''s ConvergenceWarning (_graph_lasso.py:196-201) never reaches the user. Probe over the
    76 audit dataset files (default pipeline preprocessing): 14 GraphicalLasso fits (plus 1 FloatingPointError) emitted ConvergenceWarning: cointegrated T=256/1024/4096, narrowband_f0-0.1 T=64/4096, narrowband_f0-0.25
    T=256 (gap -0.13), narrowband_f0-0.4 T=1024, shared_envelope all four T (gap up to 0.27), trending T=256/1024, var2_bivariate T=4096. Against a tight refit (tol=1e-10, enet_tol=1e-12) the default-tolerance
    precision differs by up to 0.27 absolute (shared_envelope T=256, rel 5.4e-3) and covariance by up to 1.3e-4 (8.7e-4 in the var2_bivariate T=4096 stall).'
  - 'CANDIDATE (solver stall, sklearn 1.9.1): on var2_bivariate T=4096 (P=2, well conditioned) GraphicalLasso returns its starting point: covariance_[0,1] == 0.95*S_12 (np.allclose rtol 1e-10 True), 0.20643823
    versus the closed-form optimum soft(S_12, 0.01) = 0.20730340 (error 8.65e-4; precision error 9.85e-4), n_iter_=100, dual gap stuck at -3.73e-4. Mechanism (probe): the inner enet_coordinate_descent_gram
    exits with n_iter 0 because the warm-start gap 3.4e-7 <= enet_tol*||row||^2 (_cd_fast.pyx:1173-1182), so the outer loop never moves; enet_tol=1e-8 or mode=''lars'' gives the exact optimum. sklearn 0.24.1
    (the documented version) has no such pre-loop exit: in its enet_coordinate_descent_gram (_cd_fast.pyx:470-621 at tag 0.24.1, fetched source) the first duality gap is computed only inside the main loop
    after a full coordinate pass (:571-607), the break is at :608-610 and there is no screening, so an n_iter=0 return cannot occur there. For P=2 the inner lasso has one coordinate, so one pass gives the
    soft-threshold solution; that 0.24.1 therefore returns the closed-form optimum on this input is inferred from the source, not run (no 0.24.1 environment). Probe (1.9.1): warm-start gap 3.378e-7 <= enet_tol*|y|^2
    = 4.722e-6 gives n_iter 0; enet_tol 1e-6 or 1e-8 reaches the inner coefficient 0.207354 (= soft(S_12, 0.01)/S_22) in 2 iterations.'
  - 'CANDIDATE (cov/prec mutual consistency): covariance_ and precision_ are the solver''s running iterates (_graph_lasso.py:169-177, 206), not exact inverses of each other. Probe max|inv(covariance_) -
    precision_|: 5.9e-6 to 2.6e-4 on sparse_precision/bivariate_gaussian over T=64/256/1024/4096 (GraphicalLasso 9.5e-6 to 2.4e-4, GraphicalLassoCV 5.9e-6 to 2.6e-4; largest at bivariate_gaussian T=4096),
    0.41 on shared_envelope T=1024, 0.51 for GraphicalLassoCV on narrowband_f0-0.25 T=4096. So cov_GraphicalLasso and prec_GraphicalLasso are not exactly inverse pairs. This refutes the briefing wording
    ''covariance from its inverse'': both come from the solver.'
  - 'CANDIDATE (side effect, value-neutral for these SPIs): multivariate() returns the cached estimator''s own array and np.fill_diagonal(matrix, np.nan) (basic.py:49-50) overwrites the diagonal of data.covariance[estimator].covariance_
    / .precision_ in place. Probe: after Precision(...).multivariate(d), np.diag(d.covariance[''GraphicalLasso''].precision_) is all NaN and the returned array ''is'' the cached array. Anything that later
    reads the cached estimator (e.g. its diagonal, score(), mahalanobis()) sees NaNs.'
  - 'CANDIDATE (failure -> NaN, repeated refits): a FloatingPointError from the solver propagates out of _from_cache (not cached), Calculator.compute turns it into an all-NaN entry (calculator.py:336-339 at HEAD a1f20c7),
    and each of the four identifiers sharing the estimator refits and fails again. Probe: GraphicalLasso on trending T=4096 raises ''Non SPD result'' at _graph_lasso.py:193 via :577; with detrend=True it
    succeeds (max|prec| 2.04).'
  - 'CANDIDATE (scale): pyspi z-scores with ddof=1 (data.py:195) but sklearn''s empirical_covariance divides by T (np.cov bias=1, _empirical_covariance.py:107), so S_ii = (T-1)/T (probe: diag 0.984375 at
    T=64, 0.99902 at T=1024). The documented ''correlation and covariance matrices are equivalent'' holds only up to the factor (T-1)/T, and alpha acts on this scale.'
