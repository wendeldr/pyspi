optimisation:
  complexity_P_T: O(P^2 T) empirical covariance + O(sweeps x P x P^2 x cd_iterations) for sklearn _graph_lasso.py:_graphical_lasso (one lasso on the (P-1)x(P-1) Gram per column per sweep, alpha=0.01, max_iter
    100); T enters only through the covariance. Measured fresh P_exponent 0.70 (8->32, with fixed sklearn overhead at P=8), T_exponent ~0.01; at 118x1024 the glasso sweeps dominate (_graphical_lasso 97.8%
    of the call, 709 column subproblems).
  hotspot_1: sklearn/covariance/_graph_lasso.py:_graphical_lasso (third-party:sklearn; its self time hides the Cython cd_fast.enet_coordinate_descent_gram) 88.6% self / 97.8% cumulative of the profiled
    SPI call at 118x1024 (audit/profiles/micro/prof_basic.cov.GraphicalLasso__118x1024.pstats); 52.2% cumulative (34.8% self) at 8x1024
  hotspot_2: scipy/linalg/_basic.py:pinvh (third-party:scipy) 3.6% at 118x1024; sklearn/utils/validation.py:check_array 11.9% at 8x1024 (fixed validation cost)
  hotspot_owner: third-party:sklearn
  opaque_share: 0.146
  profile_file: audit/profiles/basic.cov.GraphicalLasso__8x1024.pstats; audit/profiles/micro/prof_basic.cov.GraphicalLasso__118x1024.pstats
  opportunities:
  - opportunity_id: cov_prec_glasso-2
    opportunity: Replace sklearn's per-column Python loop in _graph_lasso.py:_graphical_lasso (fancy-indexed sub_covariance copy, np.errstate context, check_random_state and a Cython lasso call for each
      of P columns per sweep) by one compiled glasso sweep (numba/C), or a compiled solver such as QUIC/skggm.
    opp_type: rewrite-numba-rust-cpp
    expected_speedup: 1-3x
    speedup_basis: 'profile:audit/profiles/micro/prof_basic.cov.GraphicalLassoCV__118x1024.pstats sklearn/covariance/_graph_lasso.py:_graphical_lasso 89.1% self time over 81066 column subproblems (~62 us
      each) + complexity: cProfile cannot split that self time between the Python per-column work and the hidden Cython cd_fast solver, so the share removed is unknown (visible helper calls alone are ~4%)'
    output_risk: unverified-within-tolerance
    risk_evidence: a re-implemented coordinate descent reorders float operations and stops on the same tolerance at a slightly different iterate; fits that end at max_iter (the 118x1024 final refit did)
      can move by more than rounding
    effort: L
    depends_on: []
