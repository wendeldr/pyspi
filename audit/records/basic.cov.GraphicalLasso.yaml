    getattr(module, fcn)(**params)
  - 'pyspi/data.py:184-195 preprocessing before any SPI: optional scipy.signal.detrend(axis=1) (default detrend=False, data.py:63), then scipy.stats.zscore(axis=1, ddof=1, nan_policy=''omit'') (default
    normalise=True, data.py:64)'
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :335 stores S in the table; :336-339 any exception -> the whole SPI entry set to NaN and the error recorded, warning issued at :354-355
  - pyspi/base.py:51-67 parse_multivariate passes a Data object straight through (no copy when inplace=True)
  - pyspi/statistics/basic.py:57-63 class Covariance(Estimators), identifier 'cov', kind='covariance'
  - 'pyspi/statistics/basic.py:9-29 class Estimators(Undirected, Signed): identifier += ''_'' + estimator, ''-sq'' prefix and issigned->False when squared=True; labels = [''basic'',''unordered'',''linear'',''undirected'']
    + [''signed''|''unsigned''] (new list, no class-level mutation)'
