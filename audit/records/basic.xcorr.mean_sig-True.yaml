  what_changed: 'The same rule defects as max_sig-True (T/(T-1), threshold 1.96/sqrt(T//4), centre at lag +1, mirrored left
    cut, IndexError on structured data), plus NaN on an empty window. For the mean they are decisive: the kept window averages
    about T//4 mostly insignificant lags (at most 0.39% significant at T=1024). ''sig-True'' (mean of the significant correlations)
    therefore does not describe the computation. A rho=0.8 contemporaneous pair scores 0.0010, against 0.80 under the contiguous
    reading. The sign can differ from the documented value under the filter reading (delayed_noise pair (0,3), T=1024: -0.0028 against
    +0.048 under the filter reading, 0 under the contiguous reading; T=256: -0.0025 against +0.323 / 0), and it flips under channel
    reversal at T=1024 (-0.0028 -> +0.0021) and T=256 (-0.0025 -> +0.0062). Rubric anchor 3: the label does not describe the
    computation (holds under both readings; anchor 2 would also apply on the sign, but under the filter reading only).'
