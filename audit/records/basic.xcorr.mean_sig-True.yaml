  complexity_P_T: 'O(P^2 T log T): pyspi/statistics/basic.py:CrossCorrelation.bivariate runs scipy.signal.correlate(x, y, ''full'') once per unordered pair (data.xcorr caches the second ordered call); method=''auto''
    picks fftconvolve at T=1024 (all 28 calls in the 8x1024 profile), then O(T) std, normalisation and window slicing, plus the O(T) per-call sigonly truncation (np.where on both halves). Measured fresh
    P_exponent 2.06, T_exponent 0.10; at 118x1024 the pair term dominates (6903 correlate calls, ~0.18 ms each).'
  hotspot_1: scipy/signal/_signaltools.py:correlate -> fftconvolve (third-party:scipy) 65.0% of the profiled SPI call at 8x1024
  hotspot_2: numpy/_core/_methods.py:_std (third-party:numpy) 12.6% at 8x1024 (two std calls per pair); pyspi/statistics/basic.py:CrossCorrelation.bivariate self time 13.7% (sigonly truncation)
  hotspot_owner: third-party:scipy
  opaque_share: 0.285
  profile_file: audit/profiles/basic.xcorr.mean_sig-True__8x1024.pstats
  opportunities:
  - opportunity_id: xcorr-1
    opportunity: 'Compute every pair''s cross-correlation from one rfft per channel: for each a, one batched irfft of F[b]*conj(F[a]) over b>a, keep the 2*(T//4) lags of pyspi''s window in its (higher index,
      lower index) orientation, normalise by the channel std once, and cache the (P, P, 2*(T//4)) array on Data for all eight xcorr identifiers (replaces scipy.signal.correlate per pair in basic.py:CrossCorrelation.bivariate).'
    opp_type: vectorise-batch
    expected_speedup: ~5x
    speedup_basis: 'profile:audit/profiles/basic.xcorr.max_sig-True__8x1024.pstats scipy/signal/_signaltools.py:correlate 66.3%, std 13.5%; the per-pair sigonly truncation (bivariate self time
      14.1%; 0.16-0.18 s per sig-True identifier with a warm cache in family-warm) stays until xcorr-2 + complexity:the sig-True identifiers get r from the same per-pair correlate and pair cache
      as the sig-False ones (pyspi/statistics/basic.py:99-113), so the sig-False figure is carried over for that part; no sig-True identifier was run in audit/profiles/micro/opp_xcorr-1.json,
