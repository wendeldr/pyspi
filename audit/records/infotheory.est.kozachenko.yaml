unit_id: infotheory.est.kozachenko
status: profiled
correctness:
  metric_name_standard: Kozachenko-Leonenko (k=1 nearest-neighbour) differential entropy estimator, Euclidean norm, natural units; the shared entropy kernel behind every *_kozachenko SPI (je, ce, cce, xme,
    di, si)
  canonical_ref: Kozachenko LF, Leonenko NN (1987) "Sample estimate of the entropy of a random vector", Problems of Information Transmission 23(2):95-101 (Probl. Peredachi Inf. 23(2):9-16); in the digamma
    form of Kraskov A, Stoegbauer H, Grassberger P (2004) "Estimating mutual information", Phys Rev E 69:066138, Eq. (20) with k=1 (c_d = volume of the d-dimensional ball of unit diameter; Euclidean c_d
    = pi^(d/2) / Gamma(1+d/2) / 2^d).
  canonical_definition: For N iid samples x_i in R^d, eps_i = 2 * min_{j != i} ||x_i - x_j||_2 and H_hat = -psi(1) + psi(N) + log c_d + (d/N) sum_i log eps_i (nats); equivalently -psi(1) + psi(N) + log
    V_d + (d/N) sum_i log rho_i with rho_i the NN distance and V_d the unit-radius ball volume. The 1987 original uses log(N-1) + gamma instead of psi(N) - psi(1) (difference O(1/N)). Consistent for the
    differential entropy of a density; assumes iid samples, no ties.
  documented_definition: 'Supplement §1.4, p.9 (supplement.txt:405; the pack lists line 414): "The Kozachenko-Leonenko technique (kozachenko) is a nearest-neighbour approach that is suitable when measures
    can only be constructed using entropy or joint entropy (not mutual information)"; "We primarily use v1.5 of the Java Information Dynamics Toolkit [32]". GitBook information-theory.md lines 11 and 15
    repeat the description and say "v1.6.1" of JIDT. No norm, k, noise or normalisation setting is documented.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar, labelled 1.6.1 (version-1.6.1.txt dated 22/08/2023) but its class files are dated 2024-04-21 and match post-tag commits 3d1f3fec86 / a9b6b3e77c
    (2024-04-20): infodynamics.measures.continuous.kozachenko.EntropyCalculatorMultiVariateKozachenko (extends EntropyCalculatorMultiVariateCommon).computeAverageLocalOfObservations, via jpype'
  implemented_as: 'pyspi builds one EntropyCalculatorMultiVariateKozachenko per SPI instance (JIDTBase.__init__ -> _getcalc(''entropy'')) and sets BIAS_CORRECTION=false (ignored by this class) and NOISE_SEED=42
    (honoured by this jar). Inputs are the pyspi Data rows, z-scored per series with ddof=1 by the Calculator default (normalise=True); every composed SPI passes a (n_obs x d) double[][] to initialise(d)/setObservations.
    JIDT then: (1) copies observations; (2) adds iid N(0, (1e-8)^2) noise to every coordinate from java.util.Random seeded with 42 at every setObservations call (same noise sequence each call, so results
    are deterministic); (3) does NOT normalise, although getProperty (''NORMALISE'') returns ''true''; (4) computes each point''s Euclidean nearest-neighbour distance, by an O(N^2) ''fast'' routine with
    O(N^2) memory when N <= 2000 and by a ''naive'' routine when N > 2000; (5) returns (d/N) sum log(2 rho_i) + [psi(N) - psi(1)] + log[(pi/4)^(d/2) / Gamma(d/2+1)] in nats. psi(N) - psi(1) is the exact
    harmonic number H_{N-1} for N < 10000 (the truncated constant gamma = 0.5772156 cancels). No Theiler window, no k > 1.'
