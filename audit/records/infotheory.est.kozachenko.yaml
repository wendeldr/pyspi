  deviation_from_documented: 'At <= 2000 rows none in substance (the supplement only names the technique). Above 2000 rows and for d >= 2 the output is not the nearest-neighbour
    (Kozachenko-Leonenko) estimate the supplement names: JIDT''s naive search can return distances shorter than the nearest-neighbour distance at points whose nearest-neighbour distance
    exceeds 1 (iid_gaussian d=10, T=4096: pyspi 9.82 nats against 14.19 for the population d*H1 and 14.15 for the canonical KL estimate on the same rows). At d = 1 no such gap appears:
    with noise off, JIDT differs from the canonical estimate by 1.8e-14 at T=4096 (runs infotheory.est.kozachenko|iid_gaussian|4096|kernel|truth and |direct-noiseoff).
    Version text differs: supplement says JIDT v1.5, GitBook says v1.6.1, and the shipped jar is a post-1.6.1 build (2024-04-20 commits). The documentation does not say that
    the Euclidean norm, k=1, 1e-8 noise with seed 42 and no Theiler window are used.'
  deviation_from_canonical: '(a) Tie-breaking noise: iid N(0,1e-16) is added to every coordinate (seed 42). This is not in the canonical estimator. Effect on z-scored continuous data: |delta H| ~ 4e-8 (d=2)
    to ~5e-6 (d=1) nats at T=256 (probe3). The d=1 effect is data-dependent and can be larger: over 10 z-scored AR(1) seeds it reaches 9.5e-5 nat at T=256 and 2.7e-4 nat at T=1024, while d=2..5 stay <=
    2e-7 (noise off: <= 1.4e-14; cleanup probes probe_noise_T, probe_noise_d1_probe8data). This d=1 term is the whole probe8 DI residual (<= 2.7e-4 nat, see infotheory.di.kozachenko). (b) For N > 2000 the
    JIDT ''naive'' nearest-neighbour routine can return a distance SHORTER than the true NN distance rho_i, but only for d >= 2 and only at points with rho_i > 1; the wrong value then lies in (1, rho_i)
    (JIDT v1.6.1 tag EuclideanUtils.java:96,101-104, identical at a9b6b3e77c; probe10: 0 exceptions over d in {1,2,3,5,6,10}, N in {2001,4096}, scales 0.05/1/10, 2 seeds). The affected share is therefore set by how many z-scored points have rho_i
    > 1, which grows with d and falls with N. probe5 (cKDTree truth, iid N(0,I_d), noise off), points with a wrong distance: d=3 N=4096 10/4096; d=5 N=4096 188/4096; d=6 N=4096 572/4096; d=10 N=4096 3998/4096
    (min ratio 0.31). Entropy at d=10, N=4096: 9.82 vs reference 14.19 (true 14.19). For N <= 2000 the ''fast'' routine matches cKDTree exactly (0 wrong points). (c) psi(N) - psi(1) as in Kraskov 2004 Eq.
    20, not log(N-1) + gamma (O(1/N)). Otherwise the formula matches: with noise disabled, JIDT equals a from-scratch scipy cKDTree KL estimate to 0.0 (d=1) and 3.6e-15 (d=2) at N=256 (probe1). Check stage
    (exact replica of the seeded jitter, audit/checks/refs/it_kozachenko.py:JavaRandom): the jitter changes a d=1 entropy by 1.1e-5 to 4.4e-5 nat (bivariate_gaussian T256, iid_gaussian T1024/T4096) and
    composed SPIs by up to 2.7e-4 nat at T <= 1024 (si logistic_maps_bidir) and 1.1e-3 at T = 4096 (cce/di iid_gaussian), so the T=256 figure above understates the d=1 effect at larger T; d >= 2 terms stay
    <= 5.1e-8.'
  units_and_range: 'Nats. Real-valued, unbounded in both directions (differential entropy). It goes to -inf for duplicate points without noise. With the 1e-8 noise, ties give values near d*log(2e-8) scale
    (probe1: half-step-rounded N(0,1) data, T=256 -> -14.88 nats; noise off -> -inf). Scale-equivariant for N <= 2000: H(c x) = H(x) + d log c (probe3: H(10x) - H(x) = 2.302585092994038 vs log 10). For
    N > 2000 the naive-routine defect depends on whether distances exceed 1, so the shift is not exactly d log c.'
  direction_convention: 'n/a (estimator); argument order of columns does not change the value except through the noise layout (probe3 si/je: differences ~1e-7 with noise, 0 without)'
  symmetry_expected: n/a
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (third-party defect, large effect): JIDT EuclideanUtils.computeMinEuclideanDistancesNaive, used whenever an estimate has more than 2000 observations, underestimates the nearest-neighbour
    distance of a point only when its true NN distance rho_i exceeds 1 (and d >= 2). Its early-exit condition (JIDT v1.6.1 tag EuclideanUtils.java:96, identical at a9b6b3e77c; ''for (int d = 0; (d < dimensions) && (thisDistance < minDistance);
    d++)'') compares the running SQUARED distance with an un-squared minimum m. A candidate is abandoned after a partial sum S with S >= m, and sqrt(S) is accepted as its distance when sqrt(S) < m (lines
    101-104); both hold only if m > 1, so the accepted wrong value is > 1. Once the true NN (rho_i <= 1) is reached its full distance is accepted and later wrong acceptances are impossible, so points with
    rho_i <= 1 always get their true NN distance; points with rho_i > 1 can end with a value in (1, rho_i). With d = 1 the loop always completes, so d = 1 is immune. probe10 (iid N(0,I_d) times 0.05, 1, 10; 2 seeds; N
    2001 and 4096): 0 exceptions to ''wrong implies rho_i > 1 and 1 < value < rho_i''; at scale 0.05 no point has rho_i > 1 and nothing is wrong even at d=10; at scale 10, d=2 has 159-184 wrong points.
    On z-scored data the event depends on d and N: d <= 2 rarely has rho_i > 1 (probe5: 1 wrong of 2001 at d=2, N=2001, seed 3; 0 of 4096 at N=4096), which is why je, ce and xme_k1 are unaffected in practice
    while d >= 3 terms (cce, di, si d=4, xme_k10) are hit. Evidence (probe5, iid N(0,I), noise off): wrong points / N at N=4096: d=2 0, d=3 10, d=5 188, d=6 572, d=10 3998. H_jidt vs H_ref: d=5 7.013 vs
    7.052; d=6 8.285 vs 8.435; d=10 9.823 vs 14.186. Discontinuity at the threshold: d=10, N=2000 gives 14.251 (matches the reference); N=2001 gives 9.137 vs 14.191. The code is unchanged since 2014 (commit
    bc2783b971), so it affects every *_kozachenko SPI whenever any internal estimate uses > 2000 rows.'
  - 'Candidate (provenance): the shipped infodynamics.jar is not the v1.6.1 tag despite version-1.6.1.txt. Jar entries are dated 2024-04-21. The Kozachenko class extends EntropyCalculatorMultiVariateCommon,
    a class that does not exist at the tag (probe2 reflection). The class source matches commits 3d1f3fec86 and a9b6b3e77c (2024-04-20). Practical consequence: pyspi''s NOISE_SEED=42 is honoured (repeat
    calls bit-identical, probe1). Against the tag source the noise would be unseeded and results non-reproducible at the ~1e-6 nat level.'
  - 'Candidate (inert property, refutes pack hypothesis): NORMALISE reads ''true'' (probe1 getProperty) but no code applies it. Common.finaliseAddObservations (179-212) only copies the data and adds noise.
    probe3 confirms H(10x) - H(x) = 2.302585092994038 = log 10. Normalisation therefore comes only from pyspi''s Data z-scoring. With Calculator(normalise=False) values depend on the raw units (additive
    d log c).'
  - 'Refuted pack hypothesis (norm): the estimator uses the Euclidean norm (computeMinEuclideanDistances; sdTerm = log of the Euclidean unit-diameter ball volume, checked for d=1..5 in the source arithmetic),
    not the max-norm. The max-norm applies to JIDT''s KSG estimators, not to this class.'
  - 'Candidate (label): the kozachenko variants get the label ''linear'' through the else-branch at infotheory.py:53-54, which treats every estimator other than kraskov/kernel/symbolic as Gaussian. The
    KL estimator is nonparametric. Supplement/GitBook keywords and config.yaml (infotheory.py-independent labels, config.yaml:400,414,428,469,483) say ''nonlinear''.'
  - 'Candidate (ties): with quantised or repeated values the estimate is set by the 1e-8 noise level, not by the data. probe1: rounding N(0,1) to 0.5 steps (T=256) gives -14.88 nats with noise and -inf
    without, vs about 1.42 for the continuous source.'
  - 'Note (pack hypothesis ''BIAS_CORRECTION''): pyspi sets BIAS_CORRECTION=false, but this calculator silently ignores the name (Common.setProperty else-branch 140-142; getProperty returns None, probe1).'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - var2_bivariate
    path: kernel
    reference: 'from-scratch KL in numpy/scipy: rho_i from scipy.spatial.cKDTree(X).query(X, k=2, p=2)[0][:,1]; H = -digamma(1) + digamma(N) + (d/2) log(pi) - gammaln(d/2+1) + d*mean(log rho_i); applied
      to delay-embedded matrices of the z-scored rows with d in {1,2,3,5,6,10} and N = T - offset; JIDT calculator with setProperty(''NOISE_LEVEL_TO_ADD'',''0'')'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: For N <= 2000 (T in {64, 256, 1024}), |H_jidt - H_ref| <= 1e-12 for every d (probe gave 0.0 and 3.6e-15). For N > 2000 (T = 4096) exact agreement for d = 1 always, and for d = 2 unless
      an isolated point has NN distance > 1 (then a tiny difference). For d >= 3, H_jidt < H_ref by 0.001-4.4 nats, growing with d (documents the naive-distance defect).
  - datasets:
    - iid_gaussian
    path: kernel
    reference: cKDTree exact nearest-neighbour distances vs JIDT EuclideanUtils.computeMinEuclideanDistancesNaive and computeMinEuclideanDistancesFast called directly on the same double[][] (d in {1,2,3,5,10},
      N in {1024, 2000, 2001, 4096}; iid_gaussian rows stacked/embedded to reach d)
    reference_kind: independent-impl
    criterion: exact
    expected_outcome: Fast routine is equal to cKDTree for all points. Naive routine gives distances <= truth, with strict inequality only at points whose true NN distance exceeds 1, and every wrong value
      lies in (1, true distance); 0 wrong points for d=1, and for any d after scaling the data so all NN distances are < 1. Dispatch switches between N=2000 and N=2001.
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    path: kernel
    reference: analytic Gaussian entropy 0.5*log((2 pi e)^d det S) with S the population covariance (identity for iid_gaussian; cov_true for bivariate_gaussian, after z-scoring use the sample correlation
      for a conditional comparison)
    reference_kind: analytic
    criterion: statistical
    expected_outcome: For d <= 2 the bias shrinks with T (|bias| < 0.1 nat by T=1024). For d >= 3 the T=4096 estimate departs from the trend (drops below the T=1024 value). This flags the defect without
      relying on the from-scratch code.
  - datasets:
    - iid_gaussian
    path: kernel
    reference: analytic scale law H(c X) = H(X) + d log c, c in {0.1, 10, 1000}; repeat-call determinism
    reference_kind: analytic
    criterion: exact
    expected_outcome: 'Holds to 1e-12 for N <= 2000 with noise off (NORMALISE is inert). Repeated setObservations/compute on the same data give bit-identical results with the default noise (seed 42). For
      N > 2000 the scale law fails for d >= 2 whenever c makes some NN distances exceed 1 (probe10: c=10 corrupts 159-184 of ~2000-4096 points at d=2); with c small enough that all NN distances are < 1
      it holds.'
  - datasets:
    - iid_gaussian
    path: kernel
    reference: same series rounded to a grid (np.round(x*2)/2), JIDT default noise vs noise off
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: With ties the value is about -15 nats with noise and -inf with noise off. This documents that tied data give a noise-determined value.
