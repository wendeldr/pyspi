  what_changed: 'For estimates with <= 2000 rows JIDT computes the canonical Kozachenko-Leonenko estimate (Euclidean norm, k = 1, psi(N) - psi(1), nats) to fp precision; the only convention is the seeded
    1e-8 jitter (effect <= 2.7e-4 nat, from d = 1 terms). For > 2000 rows JIDT switches to EuclideanUtils.computeMinEuclideanDistancesNaive, whose early exit compares a squared partial sum with the un-squared
    running minimum; in d >= 2 it returns a distance shorter than the nearest-neighbour distance at points whose true NN distance exceeds 1, so the output is no longer the KL estimate (iid N(0,1): -0.038
