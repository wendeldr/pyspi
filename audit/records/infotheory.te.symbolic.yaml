unit_id: infotheory.te.symbolic
status: profiled
correctness:
  metric_name_standard: Symbolic transfer entropy (documented) - actually Gaussian transfer entropy with k=1 or k=10, l=1
  canonical_ref: Staniek M. & Lehnertz K. 2008, Phys Rev Lett 100:158101 (symbolic transfer entropy on ordinal patterns)
  canonical_definition: STE_{X->Y} = sum p(s^y_{t+delta}, s^y_t, s^x_t) log [p(s^y_{t+delta} | s^y_t, s^x_t) / p(s^y_{t+delta} | s^y_t)] where s are ordinal (permutation) symbols of embedding vectors (order
    m, delay l)
  documented_definition: 'supplement §1.4.5, p.11 (supplement.txt:492-497): ''We also include a symbolic estimator for transfer entropy (denoted by the modifier symbolic), with details in [39]'' ([39] =
    Staniek & Lehnertz 2008); listed as 78. te_symbolic_k-1_kt-1_l-1_lt-1 and 79. te_symbolic_k-10_kt-1_l-1_lt-1. GitBook information-theory.md:206-231 same.'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.TransferEntropyCalculatorGaussian (estimator 'symbolic' falls through the else branch of _getcalc)
  implemented_as: JIDTBase.__init__ keeps identifier 'te' + '_symbolic', adds label 'symbolic' and returns early (infotheory.py:38, 45-52); _getcalc('TransferEntropy') has no 'symbolic' branch so the else branch
    builds TransferEntropyCalculatorGaussian (:129-130). The result is Gaussian TE (= Geweke F/2) with k_HISTORY = 1 or 10, k_TAU = 1, l_HISTORY = 1, l_TAU = 1, delay 1 on z-scored data. No ordinal symbolisation
    happens anywhere.
  implementation_trace:
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 fill_diagonal NaN; :336-339 any exception from any pair -> the whole SPI entry becomes NaN (:337) and the error is recorded, warning issued at :354-355
  - 'pyspi/data.py:184-195 preprocessing in Data.set_data: optional scipy.signal.detrend(axis=1), then (default normalise=True) scipy.stats.zscore(axis=1, ddof=1)'
  - 'pyspi/base.py:84-94 Directed.multivariate: for every ordered pair i != j, A[i,j] = self.bivariate(data, i=i, j=j)'
  - 'pyspi/statistics/infotheory.py:338-341 TransferEntropy.__init__: estimator ''symbolic'' -> identifier stays ''te''; _calc = _getcalc(''TransferEntropy'')'
  - 'pyspi/statistics/infotheory.py:45-52 JIDTBase.__init__: estimator == ''symbolic'' -> labels += [''symbolic''], _dyn_corr_excl = None, return (no ''linear'' label)'
  - 'pyspi/statistics/infotheory.py:124-130 _getcalc(''TransferEntropy''): only ''kernel'' and ''kraskov'' branches; ''symbolic'' -> gaussian.TransferEntropyCalculatorGaussian'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: every calculator gets setProperty(''BIAS_CORRECTION'',''false'') and setProperty(''NOISE_SEED'',''42''); no NORMALISE property is set'
  - pyspi/statistics/infotheory.py:357-365 fixed embedding properties k_HISTORY (1 or 10), k_TAU 1, l_HISTORY 1, l_TAU 1
  - pyspi/statistics/infotheory.py:376-391 bivariate as for gc_gaussian
  - 'pyspi/config.yaml:608-614 configs: estimator symbolic with k_history 1 / 10, l_history 1'
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/measures/continuous/gaussian/TransferEntropyCalculatorGaussian.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] constructor :117-119 builds TransferEntropyCalculatorViaCondMutualInfo
    around ConditionalMutualInfoCalculatorMultiVariateGaussian; setProperty :165-180 forwards to parent
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/TransferEntropyCalculatorViaCondMutualInfo.java defaults k=1 (:98), delay=1
    (:116); setProperty :435-471 (k_HISTORY, k_TAU, l_HISTORY, l_TAU, AUTO_EMBED_*; anything else forwarded to the CMI calculator and remembered in props :463-464); computeStartTimeForFirstDestEmbedding
    :375-384 = max((k-1)*k_tau, (l-1)*l_tau + delay - 1); finaliseAddObservations :865-869 -> prepareCMICalculator :923-929 initialise(l, 1, k)
  - 'https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/TransferEntropyCalculatorViaCondMutualInfo.java addObservationsWithGivenParams
    :586-621: dest past = makeDelayEmbeddingVector(dest, k, k_tau, start, N) (:606), dest next = dest[start+1 ...] (:610), source past = makeDelayEmbeddingVector(source, l, l_tau, start+1-delay, N) (:614),
    N = T - start - 1'
  - 'https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] makeDelayEmbeddingVector(double[], k, tau, startKthPoint, n) :2212-2230: row r = [x[t], x[t-tau], ..., x[t-(k-1)tau]]
    with t = startKthPoint + r'
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/measures/continuous/gaussian/ConditionalMutualInfoCalculatorMultiVariateGaussian.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] constructor :143-147 normalise = false; finaliseAddObservations
    :236-253 covariance of (var1=source past, var2=dest next, cond=dest past) with ddof=1; computeAverageLocalOfObservations :427-482 returns 0.5*ln(det(S_c1)*det(S_c2)/(det(S_all)*det(S_cc))) (0 if var1
    or var2 fully redundant given cond; +Infinity if L==null); no bias correction (pyspi BIAS_CORRECTION=false)
  deviation_from_documented: 'Complete: documented as symbolic TE after Staniek & Lehnertz 2008, implemented as linear-Gaussian TE. Probe var2_bivariate_T1024: te_symbolic_k-1 matrix bitwise equal to gc_gaussian_k-1
    (np.array_equal True); te_symbolic_k-10 A[0,1] = 0.138939272 equals numpy 0.5*ln(RSS_r/RSS_f) with 10 target lags and 1 source lag (0.13893927237035966).'
  deviation_from_canonical: Complete (no ordinal patterns; Gaussian covariance estimator; continuous values).
  units_and_range: nats; [0, +inf); asymmetric; scale invariant (STE would be invariant to monotone transforms, this is not)
  direction_convention: 'A[i,j] = (Gaussian) TE from x_i to x_j, as for gc_gaussian. Probe var2_bivariate_T1024: k-1 A[0,1]=0.1483 > A[1,0]=0.0127; k-10 A[0,1]=0.1389 > A[1,0]=1.5e-6'
  symmetry_expected: asym
