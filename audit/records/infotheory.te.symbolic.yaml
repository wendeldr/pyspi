optimisation:
  complexity_P_T: 'O(P^2 T k^2): known bug 1 routes estimator=''symbolic'' to TransferEntropyCalculatorGaussian (infotheory.py:_getcalc else-branch), so each identifier is one Gaussian TE call per ordered
    pair (k = 1 or 10 target lags; (k+2)-square covariance). Measured fresh (k-1 representative) P exponent 2.37, T exponent 0.83; family-warm increments at 32x1024 0.37 s (k-1) and 0.78 s (k-10). At 118x1024
    the pair term dominates: 6.25 s measured fresh for k-1, 15.9 s projected family-warm for both identifiers.'
  hotspot_1: pyspi/statistics/infotheory.py:TransferEntropy.bivariate (third-party:jidt via JPype, self time) 99.8% cum / 99.3% self of the profiled SPI call at 8x1024 (te_symbolic_k-1 representative)
  hotspot_2: 'no other frame above 0.2% (the whole call is the JIDT Gaussian TE). opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked
    as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0039
  profile_file: audit/profiles/infotheory.te.symbolic__8x1024.pstats
  opportunities:
  - opportunity_id: it_gaussian-1
    opportunity: Compute the pairwise Gaussian SPIs for all pairs at once in numpy from one ddof=1 covariance of the z-scored rows (lag blocks x(t-m) and x(t+1) for tlmi and TE), with a batched slogdet
      over the pair sub-matrices, instead of one JIDT calculator call per pair through JPype (infotheory.py:JIDTBase._compute_joint_entropy, MutualInfo.bivariate, TimeLaggedMutualInfo.bivariate, TransferEntropy.bivariate).
    opp_type: replace-library
    expected_speedup: ~100x
    speedup_basis: 'microbench:audit/profiles/micro/opp_it_gaussian-1.json (candidates alone at 118x1024, shapes 118x1024_candidate_only: te_symbolic_k-10 145.9 ms and te_symbolic_k-1 = gc_gaussian_k-1
      closed form 11.8 ms, each including Data construction (2.9 ms), so 157.7 ms counts Data construction twice; with it counted once, 154.8 ms against the quiet family-warm 118x1024 projection for both
      identifiers of 15.86 s (extrapolated-pairs-from-32) = 102x. The basis times compute_spi on a prebuilt Data (profile_units.py leaves Data construction untimed), so the like-for-like cost is the
      math alone: shapes 118x1024_split (Workflow 4c run) gives te_symbolic_k-10 119.6 ms and te_symbolic_k-1 9.4 ms on one prebuilt Data, 129.0 ms in all = 123x (120x with one 3.3 ms Data construction
      added). The lower bound 100x is below both. The k-10 identifier carries about two thirds of the basis (family-warm increments at 32x1024 0.78 s of 1.14 s, about 10.9 s of the 15.86 s at 118) and is
      neither profiled (the pstats below is the k-1 representative) nor measured at 118x1024 by the profiler: its share is a pairs-from-32 extrapolation. The 4c one-shot baselines (shared machine) give
      k-10 / k-1 = 28.0 s / 13.3 s = 2.1, which on the quiet fresh k-1 wall (6.25 s) puts k-10 near 13 s, so the extrapolated basis looks conservative rather than inflated (historical EEG figure
      31.6 s per window, notes/it_gaussian.md). Same-run speedups for te_symbolic_k-10 16x at 8x1024 and 224x at 32x1024 in the Workflow 3 latest run (17x / 174x in the first)) + profile:audit/profiles/infotheory.te.symbolic__8x1024.pstats pyspi/statistics/infotheory.py:376 TransferEntropy.bivariate
      99.8% (the candidate replaces the whole multivariate call; its own cost is one (k+1)P-square covariance plus O(P^2) small slogdets, milliseconds at 118x1024); te_symbolic_k-1 is bitwise gc_gaussian_k-1,
      whose closed form is measured under that identifier'
    output_risk: within-tolerance
    risk_evidence: 'audit/profiles/micro/opp_it_gaussian-1.json, te_symbolic_k-10: max_abs_diff 1.2e-14 (8x1024) and 6.8e-15 (32x1024); max_rel_diff 2.2e-9 (8x1024) and 8.0e-7 (32x1024), the relative figure on
      a near-zero entry (|value| <= max_abs/max_rel ~ 8.5e-9 at 32x1024). te_symbolic_k-1 is bitwise gc_gaussian_k-1 (check stage k1-identity-gc1), whose closed form is measured under that identifier:
      max_abs_diff 9.2e-16 / 9.1e-16, max_rel_diff 7.0e-11 / 2.2e-6 (8x1024 / 32x1024; the 2.2e-6 on a near-zero entry, |value| <= ~4.1e-10). At 118x1024 (shapes 118x1024_split, one-shot pyspi
      baselines against the math-only candidates): te_symbolic_k-10 max_abs_diff 5.3e-15, max_rel_diff 5.8e-4 on a near-zero entry (|value| <= ~9e-12); te_symbolic_k-1 max_abs_diff 1.0e-15, max_rel_diff
      1.9e-5 (|value| <= ~5e-11). NaN masks equal for both, not bit-identical (np.cov + slogdet instead of JIDT''s covariance + Cholesky). The avenue reproduces today''s output, which is Gaussian TE
      only because known bug 1 sends estimator=''symbolic'' to the Gaussian TE calculator; the saving holds only while bug 1 stands, and fixing bug 1 (a semantic change to a real symbolic
      estimator) replaces this avenue and its saving'
    effort: M
    depends_on: []
