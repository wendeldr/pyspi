    r_i(k) r_j(k)) over all lags of the biased sample ACFs. That is exactly Bartlett''s factor 1 + 2 sum_{k>=1} r_i r_j plus 1 (lag 0 counted twice), with no lag truncation, so on cross-correlated pairs
