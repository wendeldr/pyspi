unit_id: infotheory.theiler_window
status: profiled
correctness:
  metric_name_standard: Theiler window (dynamic correlation exclusion) size chosen from the autocorrelation time of the pair via Bartlett's formula
  canonical_ref: Theiler 1986, Phys. Rev. A 34, 2427 (window, supplement [36]); Bartlett 1946, J. R. Stat. Soc. Suppl. 8, 27 (supplement [37]) for the variance of the sample cross-correlation of two autocorrelated
    series, Var(r_xy) ≈ (1/T) Σ_{k=−∞}^{∞} ρ_x(k) ρ_y(k); the effective-sample-size form T_eff = T / (1 + 2 Σ_{k>=1} ρ_x(k) ρ_y(k)) as used by Cliff et al. 2021, Phys. Rev. Research 3, 013145 (supplement
    [10]). Forms from memory; see Open questions.
  canonical_definition: Autocorrelation time of the pair τ = Σ_{k=−∞}^{∞} ρ_x(k) ρ_y(k) = 1 + 2 Σ_{k>=1} ρ_x(k) ρ_y(k) (population ACFs; in practice the sum is truncated at a lag where the sample ACF is
    no longer distinguishable from 0); Theiler window W of about τ samples, excluding neighbours with |t − t'| <= W.
  documented_definition: 'supplement §1.4, p.9-10 (pack lines 414-453): ''The window size should be large enough to render observations included in the density estimate uncorrelated (sometimes called the
    "autocorrelation time" [36]); here, we set the window as the product of the autocorrelation functions of both time series (a heuristic for the autocorrelation time based on Bartlett''s formula [10,
    37]). The DCE modifier indicates that the Theiler window is used for the KSG estimator.'' GitBook information-theory.md:20 same text.'
  delegate_lib: pyspi (numpy 2.5.4 np.correlate / np.dot, scipy 1.17.1 scipy.stats.zscore); consumed by JIDT DYN_CORR_EXCL
  implemented_as: 'On the first DCE call for a Data object: for every pair _i < _j, W[_i,_j] = W[_j,_i] = 2 · Σ_{k=0}^{T−1} r_i(k) r_j(k), with r the biased sample ACF of the z-scored (ddof=0) preprocessed
    series over all lags 0..T−1 (np.correlate ''full'', normalised by lag 0); cached as data.theiler and shared by every DCE SPI on that Data. Per pair the calculator receives DYN_CORR_EXCL = int(W[i,j])
    (truncation toward 0). In JIDT a neighbour is excluded when |t − t''| <= W; W = 0 or 1 still excludes only very close points.'
  implementation_trace:
  - pyspi/statistics/infotheory.py:57-58 '_DCE' added to the identifier when dyn_corr_excl is truthy ('AUTO' in config.yaml:512, :534, :563, :570, :577)
  - 'pyspi/statistics/infotheory.py:195-216 JIDTBase._set_theiler_window (dyn_corr_excl=''AUTO''): on the first call for a Data object computes, for every pair _i<_j, theiler[_i,_j] = theiler[_j,_i] = 2
    * np.dot(utils.acf(z[_j]), utils.acf(z[_i])) and caches it as data.theiler; then setProperty(''DYN_CORR_EXCL'', str(int(data.theiler[i, j]))) on the calculator for the current pair'
  - 'pyspi/utils.py:47-60 acf(x): x = scipy.stats.zscore(x) (ddof=0); acf = np.correlate(x, x, ''full''); acf /= acf[T-1]; returns lags 0..T-1 (biased sample ACF, divisor sum x^2 at every lag, no lag truncation)'
  - pyspi/statistics/infotheory.py:217-220 numeric dyn_corr_excl alternative (not used by any config)
  - pyspi/statistics/infotheory.py:270, :303, :381 MutualInfo/TimeLaggedMutualInfo/TransferEntropy.bivariate call _set_theiler_window(data, i, j) before initialise
  - JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/MutualInfoCalculatorMultiVariateKraskov.java#L231-L233 DYN_CORR_EXCL
    -> dynCorrExclTime, dynCorrExcl = W > 0; :298-303 throws if N <= k + 2W
  - JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/kraskov/ConditionalMutualInfoCalculatorMultiVariateKraskov.java#L269-L271
    and :316 same for CMI; https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/TransferEntropyCalculatorViaCondMutualInfo.java#L462-L465
    forwards and stores it, :752-754 copies it into the auto-embedding AIS calculator
  - JIDT https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/utils/KdTree.java#L751-L753 and utils/UnivariateNearestNeighbourSearcher.java#L503-L505 exclusion
    test |dt| <= dynCorrExclTime
  deviation_from_documented: 'Documented as ''the product of the autocorrelation functions of both time series''; implemented as twice the inner product of the two full sample ACFs (lags 0..T−1), then int().
    Documented as a heuristic for the autocorrelation time; for oscillatory, periodic, trending or random-walk inputs the value grows linearly with T (probe p3: narrowband 22/85/339/1353 at T=64/256/1024/4096)
    and is not an autocorrelation time.'
  deviation_from_canonical: 'Relative to Bartlett''s 1 + 2Σ_{k>=1} ρ_xρ_y: (1) the lag-0 term is doubled, so the raw value is exactly Bartlett + 1 (probe p3: difference 1.00 on every pair); (2) int() truncation;
    (3) the sum uses the biased sample ACF over all T−1 lags with no truncation, so noisy high-lag products accumulate and periodic components contribute ≈ T/3 (2 Σ (1−k/T)² cos²(ωk)); (4) the window is
    a pair quantity (product of both ACFs) while a Theiler window is usually set from the autocorrelation time of the embedded variables. For white noise W = 1 or 2 depending on sampling noise (probe p3
    iid_gaussian T=1024: [2,2,1,1,2,2,2,2,1,1]).'
  units_and_range: integer number of samples, >= 0 in practice (can be 0 or negative only if the ACF inner product is below 0.5, not observed); symmetric in (i, j); grows ∝ T for non-decaying ACFs
  direction_convention: n/a (symmetric pair quantity W[i,j] = W[j,i])
  symmetry_expected: n/a
  already_documented: 'no'
  new_finding_candidates:
  - 'CANDIDATE (pack hypothesis confirmed): W = int(2·dot(acf_i, acf_j)) = int(1 + [1 + 2Σ_{k>=1} r_i r_j]), i.e. Bartlett''s value plus one before truncation; probe p3 raw − Bartlett = 1.00 on all pairs
    of 11 datasets × 4 T × 2 preprocessing variants.'
  - 'CANDIDATE (pack hypothesis refined): the window is pair-specific but is not recomputed per pair: all pairs are computed on the first call and cached as data.theiler (infotheory.py:197-212), shared
    across all DCE SPIs on that Data object.'
  - 'CANDIDATE: summing all T−1 lags makes W ∝ T for oscillatory/periodic/trending/random-walk input (probe p3: narrowband ≈ 0.33 T, logistic_maps 665 at T=4096, trending without detrend 1403 at T=4096
    but 2 after detrend, cointegrated 1277 at T=4096, shared_envelope 1084), so the ''autocorrelation time'' heuristic removes about 2/3 of the series from every neighbour search.'
  - 'CANDIDATE: large W makes the auto-embedding TE unit return NaN at small T (N = T − 37 <= 4 + 2W; probe p13 T=64 narrowband, logistic_maps, shared_envelope) — see infotheory.te.kraskov_DCE_auto-MAX_CORR_AIS_kmax-10_taumax-4.'
  - 'CANDIDATE (efficiency): acf of each channel is recomputed inside the pair loop with np.correlate ''full'' (O(T²) each), i.e. P(P−1) ACF evaluations instead of P.'
