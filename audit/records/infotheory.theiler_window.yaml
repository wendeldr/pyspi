optimisation:
  complexity_P_T: 'O(P^2 T^2): JIDTBase._set_theiler_window (infotheory.py:195-216) loops over i<j and calls utils.acf (z-score + np.correlate ''full'', O(T^2)) for both channels of every pair: P(P-1) acf calls
    once per Data (~0.41 ms each at T=1024 in the mi_kraskov_DCE and tlmi_kraskov_DCE profiles, 56 calls in 0.023 s; 0.27-0.77 ms each without cProfile in audit/profiles/micro/probe_theiler_window_calls.json;
    ~13806 x 0.41 ms = ~5.7 s per window at P=118, 3.7-10.6 s over the un-profiled range), cached in data.theiler for all DCE SPIs.'
  hotspot_1: 'pyspi/statistics/infotheory.py:JIDTBase._set_theiler_window (pyspi) 3.8% cum / 3.3% self of the profiled mi_kraskov_DCE call at 8x1024 (infrastructure unit: mi.kraskov_DCE pstats); the window
    build itself, pyspi/utils.py:acf (56 calls, 0.023 s of the 5.13 s call, ~0.41 ms per call), is 0.45%; the 3.3% self time (0.171 s) is outside acf (the loop and the 56 JIDT setProperty calls, which JPype
    dispatches without cProfile entries). A self time that large shows up in 2 of the 5 DCE profiles (also te_kraskov_DCE_auto at 8x256: 0.299 s of 41.7 s, 0.72%); the other three have 0.06-0.08%
    (tlmi_kraskov_DCE 0.0023 s of 3.76 s, te_kraskov_DCE k-1 / k-2 0.0053 s of 7.75 s and 0.0038 s of 4.81 s at 8x1024). It is not this frame''s work: audit/profiles/micro/probe_theiler_window_calls.json (every
    call timed without cProfile, five DCE units, 3 fresh processes x 2 SPI calls each, two runs) gives a median of 0.02-0.05 ms per call after the window build, apart from stalls that land on the first Java
    call of a pair (in the precall case a trivial Java call timed just before takes them over and this frame stays below 0.06 ms): in te_kraskov_DCE_auto at 8x256 every SPI call has them (largest 132-208 ms,
    0.44-1.26 s per SPI call, 1.1-3.3% of it), in the four 8x1024 units one stall in 1 of 24 SPI calls per run (137 ms, 155 ms)'
  hotspot_2: pyspi/utils.py:acf 0.45% of the same call (np.correlate 'full' on z-scored series, called twice per i<j pair on the first DCE call per Data)
