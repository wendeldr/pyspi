  deviation_from_documented: 'Matches the documented fixed minimal embedding (k-1, l-1, delays 1). Window rule deviates as described in infotheory.theiler_window (int(Bartlett + 1), all lags, ∝ T on oscillatory
    input). Undocumented: nats, 1e-8 jitter with seed 42, negative values despite ''unsigned'', source-target delay fixed at u = 1, JIDT version (post-1.6.1 build).'
  deviation_from_canonical: 'Schreiber TE with finite embedding estimated by KSG1 CMI (Frenzel-Pompe form); a from-scratch implementation reproduces pyspi to 12 decimals (probe p5, T=256, five datasets,
    W up to 85). Finite k=1 history: for processes with longer memory (var2_bivariate is order 2) the quantity is the TE for this embedding, not the full-history TE. ψ(N) unadjusted for the exclusion window.'
  units_and_range: nats; real, can be negative (probe p13 T=64 minimum -0.114 on logistic_maps); asymmetric; NaN only when JIDT raises (N <= 4 + 2W)
  direction_convention: 'A[i, j] = TE(x_i -> x_j): row = source, column = target (infotheory.py:383-388; probe p5 T=256 delayed_noise, x0 leads x1 by 1: te_k1 A[0,1] 1.616 vs A[1,0] -0.016 (non-DCE path,
    same code)). To be confirmed in the check stage.'
