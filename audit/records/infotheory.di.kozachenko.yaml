unit_id: infotheory.di.kozachenko
status: profiled
correctness:
  metric_name_standard: Directed information I(X^n -> Y^n) (Massey), intended as H(Y^n) - H(Y^n || X^n) with n=5; pyspi replaces H(Y^n) by a sum of normalised block entropies
  canonical_ref: 'Massey JL (1990) "Causality, feedback and directed information", Proc. Int. Symp. Inf. Theory Appl. (ISITA-90), pp. 303-305: I(X^N -> Y^N) = sum_{n=1}^N I(X^n; Y_n | Y^{n-1}); Kramer G
    (1998) PhD thesis ETH Zurich: I(X^N -> Y^N) = H(Y^N) - H(Y^N || X^N); Amblard & Michel (2011) J Comput Neurosci 30:7-16. Estimator Kozachenko & Leonenko (1987); Kraskov et al. (2004) Eq. (20).'
  canonical_definition: DI_n = H(Y^n) - H(Y^n || X^n) = sum_{i=1}^n [H(Y_i | Y^{i-1}) - H(Y_i | Y^{i-1}, X^i)] >= 0, where H(Y^n) = sum_i H(Y_i | Y^{i-1}) is the n-block joint entropy of the target. It
    is zero when X and Y are independent.
  documented_definition: 'Supplement §1.4.8, p.11 (supplement.txt:526; the pack lists 537): "a measure of information flow from a source time series x to a target time series y that is related to transfer
    entropy, but has no time lag between source and target ... can be computed as a difference between the conditional entropy of y given its own past, and causally conditioned entropy ... we restrict its
    computation up to a history length of 10"; keywords "directed, nonlinear, unsigned, bivariate, time-dependent"; SPI 86 di_kozachenko. GitBook information-theory.md lines 68-84 (same text). Docstring
    infotheory.py:505 "Compute directed information from i to j".'
  delegate_lib: 'JIDT jar (labelled 1.6.1, post-tag build matching commit a9b6b3e77c): MatrixUtils.makeDelayEmbeddingVector + EntropyCalculatorMultiVariateKozachenko.computeAverageLocalOfObservations'
  implemented_as: n = 5 (DirectedInfo.__init__ default; config.yaml:466-478 sets only 'estimator'). A[i,j] = sum_{k=1}^{5} H_KL(Y^{(k)}) / k - CCE_5(src=z_i, targ=z_j), where Y^{(k)} = makeDelayEmbeddingVector(z_j,
    k) (T-k+1 rows, d=k) and CCE_5 is exactly cce_kozachenko (same cache data.causal_entropy[(estimator, 5)]). The first term ('entropy_rate_sum', infotheory.py:492-501) is a sum of per-symbol block entropies
    H_k/k. It is not H(Y^5) = sum_k H(Y_k | Y^{k-1}) = H_5.
  implementation_trace:
  - 'pyspi/calculator.py:277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (normalise=True default, :50); pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset);
    pyspi/calculator.py:332 np.fill_diagonal(S, np.nan) (HEAD lines)'
  - 'pyspi/base.py:85-94 Directed.multivariate: A[i,j] = bivariate(data, i=i, j=j)'
  - pyspi/statistics/infotheory.py:477-485 DirectedInfo(CausalEntropy) n=5 default
  - 'pyspi/statistics/infotheory.py:503-510 bivariate: entropy_rates(z_j) - CausalEntropy.bivariate(data, i, j)'
  - 'pyspi/statistics/infotheory.py:487-501 _compute_entropy_rates: for i=1..n, initialise(i), setObservations(makeDelayEmbeddingVector(targ, i)), add H/i'
  - pyspi/statistics/infotheory.py:459-474,439-454 CausalEntropy.bivariate/_compute_causal_entropy (see infotheory.cce.kozachenko)
  - JIDT v1.6.1 https://raw.githubusercontent.com/jlizier/jidt/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java:2084-2092,2140-2158 makeDelayEmbeddingVector
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/kozachenko/EntropyCalculatorMultiVariateKozachenko.java:82-115; EntropyCalculatorMultiVariateCommon.java:179-212
  - JIDT v1.6.1 java/source/infodynamics/utils/EuclideanUtils.java:30,69-75,85-110
  deviation_from_documented: (1) History length 5 instead of the documented 10. (2) The documented construction ('conditional entropy of y given its own past' minus CCE) corresponds to H(Y^n) = sum_k H(Y_k
    | Y^{k-1}). The code instead uses sum_k H(Y^k)/k, which is a different quantity. (3) Label 'linear' vs documented 'nonlinear'.
  deviation_from_canonical: 'The target term differs from Massey/Kramer. For a stationary target with block entropies H_k, sum_{k=1}^n H_k/k >= H_n (H_k/k is non-increasing), with equality only for a serially
    independent target. pyspi DI = canonical DI + B, with B = sum_k H_k/k - H_n >= 0. B is not zero under independence of X and Y when Y is autocorrelated. For a Gaussian AR(1) target with coefficient phi,
    B = (H_5harmonic - 1) * (-0.5 log(1 - phi^2)) = 1.2833 * (-0.5 log(1-phi^2)): 0.185 nat (phi=0.5), 1.066 nat (phi=0.9). The gap di_pyspi - [H_KL(Y^5) - CCE] is, sample by sample, the KL plug-in of B
    (sum_k H_KL(Y^k)/k - H_KL(Y^5) on the same estimates; probe8 agreement <= 2.7e-4 nat, the residual being the 1e-8 noise). At T=1024 one realisation of that KL gap is noisy and seed-dependent: probe8,
    10 seeds of independent AR(1) pairs, mean (sd, range) 0.040 (0.046, -0.039..0.116) at phi=0, 0.200 (0.069, 0.096..0.318) at phi=0.5, 1.036 (0.148, 0.881..1.414) at phi=0.9; the single probe4 draws were
    0.034, 0.322 and 1.111. The Gaussian plug-in of B on the same targets (0.5 log det of the sample k-lag covariances) is tighter: 0.001 (0.001), 0.190 (0.020), 1.082 (0.081), close to the population B.
    Composition as coded is reproduced by a from-scratch KL to <= 1.4e-14 with noise off (probe3). At T >= 2005 the JIDT naive-distance defect corrupts the CCE term (probe6 T=4096 iid_gaussian: 2.614 vs
    reference 0.028; var2_bivariate 2.409 vs 0.574).'
  units_and_range: 'Nats; real, can be negative in estimates (probe7: delayed_noise reverse cells to -2.34; iid_gaussian T=64 down to -1.72), and strongly positive under independence when the target is
    autocorrelated (bias B). Canonical DI is >= 0. Labelled ''unsigned''. Asymmetric. Includes zero-lag coupling: X^i contains x_t, so instantaneous correlation contributes in both directions.'
  direction_convention: 'A[i,j] = DI from source i to target j (infotheory.py:505-510; target term uses z_j). var2_bivariate (x0 -> x1) T=1024: A[0,1]=0.614 > A[1,0]=0.134. delayed_noise (x0 leads x1 by
    1): A[0,1]=5.76 > A[1,0]=-2.34 (probe7). gauss_ar1_pair (A[0,1]=0.3: x1 -> x0 stronger than x0 -> x1, 0.2): A[1,0]=0.767 > A[0,1]=0.49 (probe7).'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (definition): the target term is sum_{k=1}^{n} H(Y^{(k)})/k (infotheory.py:493-499 ''entropy_rate_sum = entropy_rate_sum + ... computeAverageLocalOfObservations() / i''), not H(Y^n). DI is
    therefore biased upward by B = sum_k H_k/k - H_n >= 0 for autocorrelated targets, and is nonzero for independent pairs. Evidence: the definition deviation is shown by the code (reproduced to 1.4e-14,
    probe3) and by the Gaussian AR(1) population values of B. Its size on data: probe8, 10 seeds of independent AR(1) pairs at T=1024, Gaussian plug-in of B 0.190 (sd 0.020) at phi=0.5 and 1.082 (sd 0.081)
    at phi=0.9 (population 0.185 and 1.066). The KL gap on the same pairs is noisier: mean 0.200 (sd 0.069) and 1.036 (sd 0.148), 0.040 (sd 0.046) at phi=0; a single draw (probe4: 0.322 and 1.111) should
    not be read as a measurement of B. Composition is estimator-agnostic (infotheory.py:487-510), so the same construction applies to di_gaussian and di_kernel (hypothesis for those families).'
  - 'Candidate (documentation vs code): history length 5 (infotheory.py:483 ''n=5''; config.yaml sets none) vs documented 10.'
  - 'Candidate (third-party defect inherited): for T >= 2005 the JIDT naive NN path corrupts the CCE term and the d=5 block entropy. Probe6, T=4096: iid_gaussian 2.614 vs reference 0.028; var2_bivariate
    2.409 vs 0.574. Probe4: independent white pairs jump from -0.07 (T=1024) to 2.48 (T=4096).'
  - 'Candidate (label): ''linear'' label for the nonparametric KL variant (probe1).'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
