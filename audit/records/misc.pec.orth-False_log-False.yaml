unit_id: misc.pec.orth-False_log-False
status: profiled
correctness:
  metric_name_standard: 'Amplitude envelope correlation (AEC): Pearson correlation of Hilbert amplitude envelopes, broadband, without leakage correction'
  canonical_ref: Bruns A., Eckhorn R., Jokeit H., Ebner A. 2000, "Amplitude envelope correlation detects coupling among incoherent brain signals", NeuroReport 11(7):1509-1514; power-envelope form in Hipp et al. 2012 Nat Neurosci
    15(6):884-890 (supplement ref [82]), Methods "Power envelope correlation"
  canonical_definition: r_xy(f) = corr_t(|x_f(t)|, |y_f(t)|), x_f = analytic (Hilbert or complex wavelet) signal of x band-limited around carrier f; Pearson correlation over time
  documented_definition: 'supplement §1.6.4, p.19 (heading at supplement.txt line 915): keywords "undirected, linear, unsigned, bivariate, time-dependent"; "The envelope correlation [82, 83] is the correlation between the
    two amplitude envelopes of x and y. Power envelope correlation is computed using MNE, where we use six combinations of parameters, including whether the method was orthogonalized (modifier orth), the envelopes were squared
    and logs were taken prior to correlation (log), or the absolute of the correlation coefficient was used (abs)"; refs [82] Hipp et al. 2012 Nat Neurosci 15:884, [83] Khan et al. 2018 NeuroImage 174:57, [63] MNE v0.23.0.
    GitBook spi-descriptions/miscellaneous.md:92-113 repeats the text and lists pec, pec_orth, pec_log, pec_orth_log, pec_orth_abs, pec_orth_log_abs. Neither source names a frequency band, the orthogonalisation formula, or
    whether "abs" is applied before or after averaging the two directions.'
  delegate_lib: mne-connectivity==0.9.0 mne_connectivity.envelope_correlation (with mne==1.13.2 mne.filter.next_fast_len, scipy==1.17.1 scipy.signal.hilbert, numpy==2.5.4); result post-processed by EpochTemporalConnectivity.combine("mean").get_data(output="dense")
  implemented_as: 'Default pipeline z-scores each channel (optionally detrends first). Per channel: analytic signal z = x + iH(x) via scipy FFT Hilbert, zero-padded to the next 5-smooth length and truncated to T (no padding
    for powers of two); envelope e = |z| (amplitude, not power). Correlation row i: sum_t e_i(t) (e_j(t) - mean e_j) / ||e_j - mean e_j|| / ||e_i - mean e_i|| (seed uncentred; equal to Pearson in exact arithmetic). No band-pass,
    no lag, no symmetrisation step inside MNE; the stored upper triangle (i <= j) is mirrored by get_data, single-epoch mean is identity, diagonal NaN.'
