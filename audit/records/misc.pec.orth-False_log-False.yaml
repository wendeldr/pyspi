    matrix (corr = fun(corrs), :151) without upper-triangle mirroring'
  deviation_from_documented: 'Value: matches the text "correlation between the two amplitude envelopes" (amplitude |z|, although the SPI is called power envelope correlation). Metadata: labelled unsigned but signed in [-1,1]
    (REVIEW M8; probe minimum -0.441 on nonlinear_dependence_T256). Delegate: supplement cites MNE v0.23.0; the code now runs mne-connectivity 0.9.0 with the same algorithm but upper-triangle mirroring (exact symmetry instead
    of the historical last-bit asymmetry, REVIEW M2). Config keywords linear/bivariate/time-dependent are not attached to instances.'
  deviation_from_canonical: '(1) Broadband: no band-pass/carrier frequency, so this is the correlation of broadband Hilbert envelopes, one value per pair, not a frequency-resolved AEC. (2) Amplitude rather than power: for
    a white bivariate Gaussian with rho=0.8 the amplitude correlation is 0.614 while the power-envelope correlation is 0.640 (analytic, Monte Carlo confirmed). (3) Hilbert zero-padding to a 5-smooth length (no effect at powers
    of two; probe, max over pairs vs an unpadded analytic signal: 7.1e-3 on z-scored iid_gaussian_T4096[:, :1031], 2.2e-3 on z-scored np.random.default_rng(3).standard_normal((3, 1031))). (4) Numerically, the uncentred seed
    (envelope.py:165,181) does not guarantee |r| <= 1 when envelopes are nearly constant (candidate).'
  units_and_range: 'dimensionless; mathematically a Pearson r in [-1,1], signed (negative values occur, REVIEW M8); numerically unbounded for near-constant envelopes (probe, pipeline path: T=256 pure sinusoids sin(2 pi 0.25
    t) and sin(2 pi 0.25 t + 0.7), pair (0,1): 1.31e14); exactly symmetric; NaN diagonal; scale-invariant, not offset-invariant without z-scoring'
  direction_convention: 'undirected: A[i,j] = A[j,i] exactly; the value is MNE row min(i,j), column max(i,j) of the row-wise matrix, mirrored by get_data (mne_connectivity/base.py:802-810). Zero-lag, no direction. Probe: bit-exact
    symmetry on iid_gaussian, bivariate_gaussian, shared_envelope, narrowband_f0-0.25, delayed_noise at T=64 and 1024.'
  symmetry_expected: sym
  already_documented: 'REVIEW M1 (PowerEnvelopeCorrelation.multivariate overrides Undirected.multivariate); REVIEW M2 (pec/pec_log last-bit reciprocal asymmetry from MNE row-wise normalisation, measured on historical saved
    data); REVIEW M8 (pec and pec_log can be negative despite the unsigned label; orthogonalised absolute variants need their own metadata); DEPENDENCY_COMPATIBILITY_REVIEW.md:69 (MNE 0.23 vs mne-connectivity agree to ~1e-15
    for ordinary, log and pairwise-orth); DEPENDENCY_MIGRATION.md:78-79 (dense conversion and explicit combine("mean")); REVIEW M2 elaboration in the current environment (not a new finding): the output is now exactly symmetric
    because envelope.py:210-212 keeps only the upper triangle and mne_connectivity/base.py:802-810 mirrors it. Probe on iid_gaussian_T1024 (pec): pre-mirror row-wise matrix max |C - C^T| = 5.2e-16; dense upper triangle ==
    C upper (True), dense lower == C lower (False); exact symmetry held for all six identifiers on every probed dataset. The M2 roundoff asymmetry therefore does not reproduce with mne-connectivity 0.9.0, and current lower-triangle
    values differ from those of the historical MNE 0.23 path (full row-wise matrix, mne 0.23 envelope.py:140-151) at roundoff level'
  new_finding_candidates:
  - 'CANDIDATE (numerical, degenerate input): the non-orth branch correlates the uncentred seed envelope with the centred column envelopes and divides by both centred norms (envelope.py:165 label_data_orth = data_mag[li];
    :181-183). The residual mean(e_i) * sum_t(e_j - mean e_j), which is roundoff, is then divided by two tiny norms when envelopes barely vary. Probe (T=256; pipeline path (Data default z-scoring, no detrend); channels (1
    + m a(t)) sin(2 pi 0.25 t) and (1 + m b(t)) sin(2 pi 0.25 t + 0.7); a, b = first 256 samples of a 45-point moving average (''valid'' mode) of 300 standard normals each from one np.random.default_rng(5) stream, a drawn
    first; pair (0,1); m = 1e-6, 1e-9, 1e-12, 0 give envelope CV (channel a / channel b) 1.5e-7/1.8e-7, 1.5e-10/1.8e-10, 1.5e-13/1.8e-13, 1.9e-16/5.2e-15; the orthogonalised variants stay in [-1,1] on the same inputs, e.g.
    pec_orth -0.282 and pec_orth_log -0.281 for pure sinusoids): m=1e-6 -> pec 0.06184 vs centred 0.06310; m=1e-9 -> -1071.2; m=1e-12 -> -5.3e9; m=0 (pure sinusoids) -> +1.31e14, all returned without error. These magnitudes
    are roundoff and change with phases and draw; the stable feature is the out-of-range value. Kernel path (normalise=False, same unit-amplitude signals): pec stays unstable (m=1e-9 -> +1431.6, m=1e-12 -> -1.65e9; pure sinusoids
    +0.160), but pec_log stays bounded (0.0631 at m=1e-9, 0.0628 at m=1e-12, 0 for pure sinusoids) because log(|z|^2) ~ 0 (mean -3e-11 at m=1e-9) leaves the uncentred seed almost centred; the pec_log instability needs a non-zero
    mean log-power, which pipeline z-scoring supplies (amplitude ~sqrt(2), mean log-power 0.689). For realistic envelopes (CV ~0.5) the effect is roundoff (probe <= 2.1e-14 vs centred reference on narrowband_f0-0.25). This
    also explains part of the historical M2 asymmetry: reciprocal entries use different numerators, sum(e_i (e_j - mean)) vs sum(e_j (e_i - mean)), not only different division order.'
  - 'CANDIDATE (naming): the identifier and supplement title say "power envelope", but with log=False MNE correlates amplitudes |z| (envelope.py:146, 165), not powers |z|^2; only the log variant squares.'
  - 'CANDIDATE (preprocessing sensitivity): scipy.signal.hilbert keeps the DC bin (_signaltools.py:2520-2525), so |z| of x + c is not the envelope of x; with normalise=False the value depends on per-channel offsets. Probe:
    bivariate_gaussian_T1024 + offsets [0,1,-2,5] on the kernel path changes the matrix by up to 1.32 (pec), 1.14 (pec_log), 0.176 (pec_orth); scaling alone changes it by <= 1.6e-15. The default z-scoring removes this; trends
    are not removed without detrend (trending_T1024 pec (2,3): 0.964 plain pipeline, 0.612 detrended, 0.611 clean).'
  - 'CANDIDATE (definition scope): no band-pass filter or carrier frequency is applied anywhere (misc.py:168-176 passes the z-scored broadband series; envelope.py:138-140 only Hilbert-transforms). The canonical AEC/PEC (Bruns
    2000; Hipp 2012) is defined on narrow-band signals per frequency; here the "envelope" of a broadband signal is used and one broadband value is returned.'
  - 'CANDIDATE (metadata): instance labels are ["unsigned", "misc", "undirected"] for all six identifiers (probe); the config keywords linear/bivariate/time-dependent are never attached (calculator.py:252-259 does not read
    YAML labels). "linear" is questionable for an envelope (nonlinear transform) statistic, and "time-dependent" describes a contemporaneous zero-lag statistic. The pairwise value does depend only on the pair (probe: iid_gaussian_T1024
    pair (1,3) bit-identical when computed from the 2-channel subset), so "bivariate" is accurate.'
