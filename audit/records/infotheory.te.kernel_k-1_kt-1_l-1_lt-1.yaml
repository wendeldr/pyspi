unit_id: infotheory.te.kernel_k-1_kt-1_l-1_lt-1
status: profiled
correctness:
  metric_name_standard: Transfer entropy T_{X->Y} with target history k=1, source history l=1, lag 1, box-kernel (Schreiber) estimate, bits
  canonical_ref: Schreiber T (2000) 'Measuring information transfer', Phys Rev Lett 85:461-464, Eq. (4) and the kernel estimator p_r(.) = (1/N) sum Theta(r - |.|) (max norm) described there; Kaiser A, Schreiber
    T (2002) Physica D 166:43-62; Kantz & Schreiber (1997)
  canonical_definition: 'T_{X->Y} = sum p(y_{t+1}, y_t^(k), x_t^(l)) log2[ p(y_{t+1} | y_t^(k), x_t^(l)) / p(y_{t+1} | y_t^(k)) ]; with k=l=1 and box kernel: mean_t log2[ (C_nps/C_ps) / (C_np/C_p) ] over
    t = 1..T-1'
  documented_definition: 'supplement §1.4.5, pp.10-11 (supplement.txt:476-499; pack lines 486-510): ''Transfer entropy [35] is a measure of information transfer from a source time series x to a target time series y, based on the
    Takens time-delay embedding ... The embedding lengths are denoted by modifier''s l and k for the source, x, and target, y ... The fixed parameters are minimal values, i.e., typically with a fixed target
    embedding length of 1 (denoted by k-1)''; identifier 77 te_kernel_W-0.25_k-1; keywords directed, nonlinear, unsigned, bivariate, time-dependent. GitBook information-theory.md:206-231 same; identifier
    te_kernel_W-0.25_k-1.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): infodynamics.measures.continuous.kernel.TransferEntropyCalculatorKernel.computeAverageLocalOfObservations
    with KernelEstimatorTransferEntropy'
  implemented_as: 'config.yaml:593-596 (estimator kernel, kernel_width 0.25, k_history 1, l_history 1). Constructor sets only k_HISTORY=1 on the JIDT calculator (k_tau, l_history, l_tau are skipped for
    kernel). bivariate(i,j): src = z_i, targ = z_j; initialise() -> teKernelEstimator.initialise(k=1, 0.25). JIDT builds destPast = y_{t-1} (rows t=1..T-1), destNext = y_t, source = x_{t-1} (source value
    at the same time as the last past value; l=1, lag 1 fixed in this class). Half-widths: past 0.25*SD(y[0:T-1]); source 0.25*SD(x[0:T-1]); next uses the PAST width (kernelWidthsInUse[0]). Counts (closed
    boxes, self included): C_p over past, then via callbacks C_ps, C_np, C_nps; TE = mean log2[(C_nps/C_ps)/(C_np/C_p)] over T-1 points. No Theiler window, no bias correction. A[i,j] = TE(i -> j).'
  implementation_trace:
