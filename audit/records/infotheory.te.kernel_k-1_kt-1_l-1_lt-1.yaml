  deviation_from_documented: 'None for the configured values (k=1, l=1). The documented l/lt/kt modifiers cannot be honoured by this estimator: pyspi silently drops l_history, k_tau and l_tau for kernel
    (JIDT would raise ''Unsupported property''), and the identifier records only k. ''Width 0.25'' is the box half-width.'
  deviation_from_canonical: 'Matches Schreiber (2000) Eq. 4 with k=l=1, lag 1 and a max-norm box kernel. Minor: (a) the next-value box uses the past series'' SD (KernelEstimatorTransferEntropy L151-153 at the JIDT v1.6.1 tag, byte-identical at a9b6b3e;
    comment ''epsilons ... should all be approximately equal, so just use the first one''); (b) resubstitution counts include the point itself and there is no bias correction (JIDT keeps the Grassberger-corrected
    variant, TransferEntropyCalculatorKernel L338-396 at the v1.6.1 tag, for testing only), giving a large positive null bias (probe iid_gaussian means 1.440/1.045/0.522/0.196 bits at T=64/256/1024/4096).'
  units_and_range: bits; mean of log count ratios, can be negative in principle, typically positive (null bias); asymmetric; NaN only on exception.
  direction_convention: 'A[i,j] = TE(X_i -> X_j): row i = source, column j = target (docstring ''from i->j''). Probe delayed_noise T=1024: A[0,1] = 2.571 (x0 drives x1) vs A[1,0] = 0.501 (null level); var2_bivariate
    T=4096 A[0,1] = 0.348 vs A[1,0] = 0.187; logistic_maps (y=1 drives x=0) T=4096 A[1,0] = 0.066 > A[0,1] = 0.016.'
  symmetry_expected: asym
  already_documented: 'no'
