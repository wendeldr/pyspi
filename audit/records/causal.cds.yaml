    over all 76 check files (19 datasets x T in {64, 256, 1024, 4096}): 91 exact-zero entries, all at T=64; 90 have row process i with <=
    1 qualifying bin (anm_T64: 3 entries from process 0 with no qualifying bin, 9 from processes 1-3 with one; iid_gaussian_T64: 8 entries
    from rows 0 and 2 with one), and 1 (narrowband_f0-0.25_T64 A[1,0]) has two qualifying bins of 32 samples with identical y-level counts
    {-2: 4, -1: 12, 1: 11, 2: 5}; every process with <= 1 qualifying bin gave an all-zero row. The no-bin branch cannot occur for T > 156,
    but the single-bin branch is not tied to short T: probe fix_cdt/cds_zero3.py built a spike-heavy x at T = 458 (406 samples in bin 0,
    every other bin <= 11) and cds_score returned 0.0. A 0 reads as the most causal possible value rather than "not computable".'
  - 'Candidate (documentation ambiguity): the supplement wording ''standard deviation of the conditional probability distribution of y given
