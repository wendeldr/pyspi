optimisation:
  complexity_P_T: 'O(P^2 T) with a large per-pair constant: cdt CDS.cds_score per ordered pair (pyspi/statistics/causal.py:38-41) discretises x and y with pandas, then loops over the qualifying x-bins (up to 13) with pandas Series operations each. Measured P_exponent 2.09 (pairs model, t_fixed pinned 0), T_exponent 0.31 (per-call pandas overhead hides the O(T) term up to T=1024). Pair term dominates; projected 231.5 s per window at 118x1024 (extrapolated-pairs-from-32; skipped-budget at 118).'
  hotspot_1: cdt/causality/pairwise/CDS.py:discretized_sequence (third-party:cdt) 69.8% of the profiled SPI call at 8x1024, of which pandas/core/series.py:__setitem__ 53.2% (boolean-mask clipping x[x > vmax] = vmax on a Series; pandas/core/series.py:__repr__ 29.0% is called from indexes/base.py:get_loc to build a KeyError message before the mask fallback)
  hotspot_2: 'cdt/causality/pairwise/CDS.py:count_unique (third-party:cdt) 12.2% of the profiled SPI call at 8x1024 (11.9% self: Python set() over a pandas Series, 1,757 calls, recomputed for y in every qualifying x-bin)'
  hotspot_owner: third-party:cdt
  opaque_share: 0.191
  profile_file: audit/profiles/causal.cds__8x1024.pstats
  opportunities:
  - opportunity_id: cdt_pairwise-2
    opportunity: 'Re-implement cdt CDS.cds_score on numpy arrays: discretise each channel once per Data (x-bins, global std and unique count of y are per-channel quantities), then per ordered pair build the conditional y-histograms of the qualifying x-bins in one compiled (numba) or vectorised pass, instead of ~1e3 pandas Series operations per pair.'
    opp_type: rewrite-numba-rust-cpp
    expected_speedup: 100-1000x
    speedup_basis: 'profile:audit/profiles/causal.cds__8x1024.pstats CDS.py:cds_score 100.0% (discretized_sequence 69.8%, pandas Series.__setitem__ 53.2% of which Series.__repr__ 29.0% builds a KeyError message in get_loc before the boolean-mask fallback; count_unique 12.2%) + complexity: per-pair work stays O(T) but drops from ~20 pandas calls per qualifying x-bin to one compiled pass, and the x/y discretisation moves from 2P(P-1) to P evaluations'
    output_risk: unverified-within-tolerance
    risk_evidence: pandas Series mean/std (CDS.py:76-78, 165) become numpy reductions with a different summation order; a last-bit change at an np.round half-way point (CDS.py:79) would move one sample to a neighbouring bin, a discrete change
    effort: M
