unit_id: causal.cds
status: profiled
correctness:
  metric_name_standard: 'conditional distribution similarity (CDS) statistic: spread across x-bins of the mean-centred, discretised conditional
    distributions p(y | x) (Fonollosa 2016/2019)'
  canonical_ref: 'Fonollosa 2016, arXiv:1601.06680 (book version: Cause Effect Pairs in Machine Learning, Springer 2019, pp. 339-347), §2.1
    (discretisation into 2*maxdev*sfactor+1 segments of sigma/sfactor, truncation at maxdev*sigma; sfactor=3, maxdev=3 for "almost all measures")
    and §2.3 (CDS formula)'
  canonical_definition: CDS(X, Y) = sqrt( (1/M) * sum_{y=0}^{M-1} var_x( p_n(y | x) ) ), where p_n(y | x) is the conditional distribution
    of Y given each (discretised) value x, normalised to zero mean and then quantised as in §2.1; var_x is the sample variance over x. Lower
    CDS(X, Y) is taken as evidence for X -> Y (used as a classifier feature in both directions).
  documented_definition: 'supplement §1.3.3, p.8: ''The conditional distribution similarity fit [27] is the standard deviation of the conditional
    probability distribution of y given x, where the distributions are estimated by discretizing the values.'' keywords ''directed, nonlinear,
    unsigned''. GitBook causal-inference.md ''Conditional Distribution Similarity Fit'' repeats the text.'
  delegate_lib: cdt==0.6.0 cdt.causality.pairwise.CDS().cds_score(x, y) with defaults ffactor=2, maxdev=3, minc=12 (numpy/pandas only)
  implemented_as: 'A[i, j] = CDS().cds_score(x = z[i], y = z[j]) on z-scored data, one direction only. x is standardised (ddof=0), re-standardised
    on the samples with |x| < 3, multiplied by 2, rounded and clipped to [-6, 6] (13 bins of width 0.5 SD). For each x-bin with MORE than
    12 samples: y values in the bin are centred on the bin mean and divided by the global std(y) (ddof=0), rounded*2 and clipped to [-6,
    6], histogrammed over the 13 values -6..6 and normalised to a pmf. With P the (n_bins x 13) matrix of pmfs, columns are centred over
    bins and the result is np.std of all entries = sqrt( (1/13) sum_k var_x,ddof0(P[:, k]) ). Returns exactly 0 if no bin has > 12 samples
    (CDS.py:190-191), and exactly 0.0 when exactly one bin has > 12 samples (P is then 1 x 13, CDS.py:194 centring gives all zeros, np.std
    = 0.0 at CDS.py:195). When several qualifying bins have identical pmfs the result is 0 only up to rounding of the column mean: exactly
    0.0 for 2 identical bins, but up to ~2e-17 for 3 or 7 identical bins with non-dyadic pmf entries (probe cleanup/cdt_pairwise/ident_bins.py).
    Probe: from-scratch numpy version matches to <= 1.4e-17 on 6 dataset/T combinations.'
  implementation_trace:
  - 'pyspi/data.py:184-195 Data.set_data: detrend only if detrend=True (default False), then scipy.stats.zscore(axis=1, ddof=1) if normalise=True
    (default); stored as (M, T, 1)'
  - 'pyspi/calculator.py:251-267 Calculator._load_yaml: configs is empty for the four causal classes, so iterating None raises TypeError
    and the class is instantiated with no arguments (261-267); labels come from the class attribute'
  - 'pyspi/calculator.py:327-339 Calculator.compute: S = spi.multivariate(dataset) (329); fill_diagonal(S, nan) (332); any exception -> whole
    matrix NaN (336-339) with a warning (354-355)'
  - 'pyspi/base.py:84-94 Directed.multivariate: A[i, j] = self.bivariate(data, i=i, j=j) for every ordered pair i != j (no mirroring)'
  - 'pyspi/base.py:27-49 parse_bivariate: two raw arrays are wrapped into a new Data object (base.py:33-36) and i, j = 0, 1 is set (base.py:41-43);
    Data.add_process z-scores only the first array (data.py:238 set_data, normalise=True) and appends the second raw (data.py:230-234); the
    Calculator/multivariate path passes the already z-scored Data through unchanged. Owned by unit preproc.two_array_api'
  - pyspi/data.py:108-118 Data.to_numpy returns the (M, T, 1) array, so z[i] is a (T, 1) column
  - 'pyspi/config.yaml:337-345 ConditionalDistributionSimilarity: configs empty'
  - 'pyspi/statistics/causal.py:32-41 ConditionalDistributionSimilarity.bivariate: z = data.to_numpy(); return CDS().cds_score(z[i], z[j])'
  - .venv/lib/python3.12/site-packages/cdt/causality/pairwise/CDS.py:125-129 __init__(ffactor=2, maxdev=3, minc=12)
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/CDS.py:143-155 cds_score: ndarray inputs reshaped to 1-D pandas Series (153-154);
    xd, yd = discretized_sequences(x, y, self.ffactor, self.maxdev) (155)'
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/CDS.py:69-85 discretized_sequence: if > 13 unique values: standardise, trim
    |x| < maxdev, re-standardise with trimmed mean/std (71-74), round(x*ffactor) (75), clip to +-ffactor*maxdev (76-79)'
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/CDS.py:56-66 discretized_values: range(-6, 7) for numerical data with > 13
    unique values'
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/CDS.py:156-188 per x-bin a with cx[a] > minc (164): yx = y[xd == a] (165);
    continuous branch (170-176): yx = (yx - mean(yx)) / std(y) (172), discretised without renormalisation (173), counted on range(-6, 7)
    (174-176); discrete-y branch with cross-correlation alignment (178-184) not reached for continuous data; pmf normalisation (186)'
  - .venv/lib/python3.12/site-packages/cdt/causality/pairwise/CDS.py:190-195 return 0 if no bin qualified (190-191); pyx - pyx.mean(axis=0);
    return np.std(pyx) (193-195); with exactly one qualifying bin the centred matrix is all zeros and np.std returns 0.0; with several identical
    pmfs it is 0 only up to rounding of the column mean (exactly 0.0 for 2 bins, <= ~2e-17 for 3 or 7 bins)
  deviation_from_documented: (a) The supplement's 'standard deviation of the conditional probability distribution of y given x' reads as
    the SD of Y | X; the code returns the variability ACROSS x-bins of the shapes of the mean-centred conditional pmfs (a pooled SD of probabilities),
    as in Fonollosa §2.3. (b) Parameters (0.5-SD bins, 13 levels, truncation at 3 SD, minimum 13 samples per x-bin) and the exact 0 returned
    when at most one bin qualifies (or the 0 up to rounding when all qualifying pmfs coincide) are undocumented. (c) Direction meaning (lower
    = more consistent with i -> j) is undocumented; cdt's two-direction difference (CDS.py:131-141) is not used. (d) Documented cdt v0.5.23
    vs installed 0.6.0 (already documented).
  deviation_from_canonical: '(1) ffactor=2 (13 levels) rather than the sfactor=3 (19 levels) that Fonollosa §2.1 states for ''almost all
    measures'' (whether CDS was one of the exceptions in the original jarfo code is an open question). (2) var_x uses ddof=0 (np.std) whereas
    the paper says ''sample variance'' (ambiguous). (3) Implementation details not in the paper: x is re-standardised on |x| < 3 before binning;
    x-bins with <= 12 samples are dropped; exact 0 is returned when no bin qualifies (CDS.py:190-191) and, through the centring, when exactly
    one bin qualifies, or up to rounding when all qualifying pmfs are identical (CDS.py:193-195); the paper does not define CDS for fewer
    than two x-values. (4) Only one direction is returned (the paper uses both directions as classifier features).'
  units_and_range: 'dimensionless (SD of probabilities); >= 0, bounded above by 0.5; exactly 0 when at most one x-bin has > 12 samples (no-bin
    branch CDS.py:190-191, possible only for T <= 156 = 13 x 12; single-bin branch CDS.py:193-195, possible at any T when one bin holds all
    but <= 144 samples); 0 up to rounding (exactly 0.0 for two bins, <= ~2e-17 for 3 or 7) when all qualifying bins have identical conditional
    pmfs. Observed: anm_T64 all 12 entries (process 0 has no qualifying bin, max count 12; processes 1-3 have exactly one, max counts 16,
    16, 18); iid_gaussian_T64 8 of 20 entries (rows 0 and 2, exactly one qualifying bin each, max counts 16 and 13). Invariant to positive
    affine rescaling of either input (internal standardisation); asymmetric.'
  direction_convention: 'A[i, j] = CDS(x = process i, y = process j): variability of p(z_j | z_i-bin); LOWER means more consistent with i
    -> j (cdt docstring CDS.py:92-93). Code-derived; to be confirmed empirically on the anm dataset.'
  symmetry_expected: asym
  already_documented: 'partly: installed cdt 0.6.0 vs documented 0.5.23 (DEPENDENCY_MIGRATION.md CDT row; DEPENDENCY_COMPATIBILITY_REVIEW.md:43, :88-92);
    the zero-output degeneracy and parameter choices are not documented'
  new_finding_candidates:
