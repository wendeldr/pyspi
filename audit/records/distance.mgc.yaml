  complexity_P_T: 'O(P^2 T^2 log T): per ordered pair (Undirected over Directed.multivariate) two T x T distance matrices, a column-wise rank
    transform of each (np.unique per column, T sorts of length T) and scipy''s local-correlation map over all (k, l) scales (scipy/stats/_mgc.py:_mgc_stat
    -> _stats._local_correlations, O(T^2)) plus thresholding/smoothing. Measured T_exponent 2.03 (8x256 0.82 s -> 8x1024 13.7 s); 118x1024 projected
    by pair count only (3377 s). The pair term dominates.'
  hotspot_1: scipy/stats/_mgc.py:_mgc_stat (third-party:scipy) 93.4% cumulative, 50.5% self time of the profiled SPI call at 8x1024 (the compiled
    _local_correlations kernel is hidden in the self time)
  hotspot_2: numpy/lib/_arraysetops_impl.py:unique called per distance-matrix column from _local_correlations (third-party:numpy, rank transform)
    28.9% (114688 calls; argsort 9.8%), plus numpy hstack 7.7% in the same call
