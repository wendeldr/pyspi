unit_id: distance.mgc
status: profiled
correctness:
  metric_name_standard: 'Sample multiscale graph correlation (Sample MGC): smoothed maximum local distance correlation over k/l-nearest-neighbour scales'
  canonical_ref: Shen C, Priebe CE, Vogelstein JT (2020) From distance correlation to multiscale graph correlation. J Am Stat Assoc 115(529):280-291, §3.1 eq.(6) and the local covariance/correlation definitions,
    §4.1 eqs.(7)-(9), Corollary 3 (threshold); see also Vogelstein et al. 2019 eLife 8:e41690
  canonical_definition: A_ij = D^x_ij - (1/(n-1)) sum_s D^x_sj for i!=j, A_ii = 0 (column centring), B likewise. R^A_ij is the ascending rank of D^x_ij within column j, with minimal (consecutive) rank for
    ties. A^k = A ∘ I(R^A <= k), B^l = B ∘ I(R^B <= l), and Ê(M) = (1/(n(n-1))) sum_{i!=j} M_ij. dCov^{k,l} = Ê(A^k ∘ B^l') - Ê(A^k)Ê(B^l'), where ' is the transpose, and dVar is analogous. dCorr^{k,l}
    = dCov/sqrt(dVar^k dVar^l), set to 0 if a local variance < ε. Sample MGC is the max of dCorr over R, where R is the largest connected component of {dCorr^{k,l} > max(τ_n, dCorr^{n,n})}. τ_n = 2 F^{-1}_{Beta((v-1)/2,(v-1)/2)}(1
    - 0.02/n) - 1 with v = n(n-3)/2. The statistic falls back to dCorr^{n,n} if |R| < 2n or if the max is <= dCorr^{n,n}.
  documented_definition: 'supplement §1.2.3, p.6 (supplement.txt:243-252; the pack listed 249-259): keywords ''undirected, nonlinear, unsigned, bivariate, contemporaneous''; ''Multiscale graph correlation
    (MGC) [14] is a generalization of distance correlation ... the algorithm truncates the Euclidean distance matrices ... at an optimal threshold. MGC also includes a smoothing function that is intended
    to remove any bias introduced by disconnected components ... Only this unbiased estimator is included here (as in hyppo)''. [14] = Shen, Priebe, Vogelstein, JASA 115, 280 (2020). GitBook spi-descriptions/distance-similarity.md:251-266
    has the same text, but its ''Key References'' link (line 257) points to researchgate ''3943235_Discovering_similar_multidimensional_trajectories'', an LCSS paper, not MGC.'
  delegate_lib: hyppo==0.5.2 hyppo.independence.MGC().statistic -> scipy==1.17.1 scipy.stats.multiscale_graphcorr(distx, disty, compute_distance=None, reps=0) -> scipy.stats._stats._local_correlations (Cython,
    scipy v1.17.1 _stats.pyx); distance matrices from scikit-learn==1.9.1 pairwise_distances(metric='euclidean') via hyppo.tools.compute_dist
  implemented_as: 'Preprocessing is the Calculator default: per-process z-score (ddof=1) and no detrend. Each pair uses x = process i and y = process j as (T,1) arrays, with sklearn dot-product Euclidean
    distance matrices, which are not exactly |x_a - x_b| and not bit-symmetric. Column-wise dense ranks come from np.unique(return_inverse)+1, so the diagonal (self, distance 0) gets rank 1. Column centring
    is D - colmean*n/(n-1) with the diagonal zeroed. The local covariance sum_{ab} A_ab B_ba I(rA_ab <= k) I(rB_ba <= l) - S_A(k) S_B(l)/n^2 is computed by rank binning, cumsum and a 2-D cumulative recurrence.
    Local variances are the diagonals of the same construction with (A, A''), and correlation = cov/sqrt(varx vary), clipped to <= 1, with rows or columns whose variance is <= 0 set to 0. The map is m x
    n'', where m and n'' are the numbers of distinct ranks (equal to T for continuous data). The threshold uses samp_size = n-1: Beta shape (n-1)(n-4)/4 - 1/2 at percentile 1 - 0.02/(n-1), maxed with the
    global-scale value. R is the largest 4-connected component (scipy.ndimage.label, first label on size ties). It is used only if |R| >= ceil(0.02*max(m,n''))*min(m,n''), and then stat = max(global, max
    over R). The permutation test is skipped (reps=0, warnings suppressed). Undirected: all ordered pairs are computed, and then the lower triangle is overwritten by the upper.'
  implementation_trace:
  - pyspi/calculator.py:46-53 defaults detrend=False, normalise=True; :277 Data(...)
  - pyspi/data.py:184-197 detrend/zscore(ddof=1); :257-260 realisation axis; :108-118 to_numpy
  - 'pyspi/base.py:84-94 Directed.multivariate computes A[i,j] = bivariate(data,i,j) for all ordered pairs; :132-138 Undirected.multivariate: li = np.tril_indices(P,-1); A[li] = A.T[li] (upper triangle
    kept)'
  - pyspi/statistics/distance.py:10-15 imports hyppo.independence.MGC; :100-105 class MultiscaleGraphCorrelation(Undirected, Unsigned); :107-111 x, y = data.to_numpy()[[i, j]]; stat = MGC().statistic(x,
    y)
  - pyspi/config.yaml:155-163 MultiscaleGraphCorrelation, labels undirected/unsigned, no configs
  - '.venv/lib/python3.12/site-packages/hyppo/independence/mgc.py:126-131 MGC.__init__(compute_distance=''euclidean''); :151-166 statistic: compute_dist (154-157), multiscale_graphcorr(distx, disty, compute_distance=None,
    reps=0) under warnings ignore (159-161), return mgc.stat'
  - .venv/lib/python3.12/site-packages/hyppo/tools/common.py:436-503 compute_dist -> sklearn pairwise_distances at :499
  - .venv/lib/python3.12/site-packages/sklearn/metrics/pairwise.py:403-421 float64 dot-product Euclidean distances, clip at 0, zero diagonal
  - .venv/lib/python3.12/site-packages/scipy/stats/_mgc.py:100-101 multiscale_graphcorr; :302-310 1-D -> (n,1); :331-333 raises ValueError if n < 5; :358-364 compute_distance None -> _mgc_stat(x, y); :368-370
    _perm_test with reps=0
  - '.venv/lib/python3.12/site-packages/scipy/stats/_mgc.py:383-429 _mgc_stat: _local_correlations(distx, disty, global_corr=''mgc'') (408); samp_size = len(distx) - 1 (418)'
  - '.venv/lib/python3.12/site-packages/scipy/stats/_mgc.py:432-474 _threshold_mgc_map: per_sig = 1 - 0.02/samp_size; beta.ppf(per_sig, s(s-3)/4 - 1/2, same)*2 - 1; threshold = max(threshold, map[m-1][n-1]);
    largest component via _measurements.label, argmax(label_counts[1:])'
  - '.venv/lib/python3.12/site-packages/scipy/stats/_mgc.py:477-525 _smooth_mgc_map: default global stat; requires np.sum(sig_connect) >= np.ceil(0.02*max(m,n))*min(m,n) (509); stat = max_corr if max_corr
    >= stat'
  - https://github.com/scipy/scipy/blob/v1.17.1/scipy/stats/_stats.pyx :323-332 _dense_rank_data/_rank_distance_matrix (np.unique return_inverse + 1, column-wise); :337-357 _center_distance_matrix (distx
    - colmean*n/(n-1), fill_diagonal 0 for 'mgc'); :418-446 _local_covariance (rank binning, cumsums, _covar_map, centring with /n**2 at :444); :451-491 _local_correlations (cov with cent_disty.T/rank_disty.T,
    variances as diagonals, clip > 1, zero where variance <= 0)
  deviation_from_documented: '(1) The supplement says ''Only this unbiased estimator is included here (as in hyppo)''. The global-scale value of the map is the column-centred dCorr^{n,n} of Shen et al.
    eq. (6), not hyppo''s U-centred unbiased Dcorr. Probe on iid_gaussian T=256 pair (0,1): MGC global -0.0059473 vs Dcorr unbiased -0.0059357, close but different. (2) The label is ''unsigned'' (supplement
    keywords, config.yaml and class; GitBook glossary-of-terms.md:21, ''Signed'' keyword row, gives distance correlation ''defined in the range [0,1]'' as the example of an unsigned SPI), but values are
    negative whenever the statistic falls back to the global scale under near-independence. Probe minimum was -0.0264 on iid_gaussian T=64, and most iid pairs were negative. (3) The GitBook ''Key References''
    link (distance-similarity.md:257) points to ''Discovering similar multidimensional trajectories'', an LCSS paper; the supplement cites Shen et al. 2020 as the MGC source. (4) The verbal description of truncation
    and smoothing is consistent with the code.'
  deviation_from_canonical: 'The code follows the authors'' R reference implementation (neurodata/r-mgc, GitHub master fetched 2026-10-14) rather than the paper text on three constants. (a) Subtractive centring term: /n^2 (_stats.pyx:444,
    matching r-mgc MGCLocalCorr.R:167) instead of the paper''s Ê = 1/(n(n-1)). This is irrelevant at the global scale, where column sums are 0, and changes local correlations by O(1/n). Probe: nonlinear_dependence
    T=64 0.58183 vs 0.58028 with n(n-1), T=1024 0.534318 vs 0.534201. (b) Threshold sample size n-1 (_mgc.py:418, 454-456; R MGCSampleStat.R:99, 122-126) instead of n (Corollary 3). No effect was seen in
    the probes. (c) Minimum region size: ceil(0.02*max(m,n))*min(m,n) (_mgc.py:509), versus the paper''s 2n and r-mgc''s 2*min(m,n) (MGCSampleStat.R:172). For continuous data (m = n = T) this means n (T<=50),
    2n (51-100), 6n (T=256), 21n (T=1024) or 82n (T=4096): stricter than the paper for T > 100. With tied data (m < n) it can be far laxer: on logistic_maps T=64 (map 64x8) the code gives 0.3707 vs 0.3157
    under the 2n rule. (d) Equal-size largest components: the code takes the first label (argmax at _mgc.py:469), whereas the paper takes the union. (e) Variance cut-off is <= 0 rather than < ε. (f) Dense
    rank equals the paper''s ''minimal rank'' consecutive indexing (consistent). (g) Input distances are sklearn dot-product distances: rounding reorders near-tied neighbours. Probe on shared_envelope T=256
    pair (0,1): 0.708 (pyspi) vs 0.769 with exact |x_a - x_b| (optimal scale (2,2)); logistic_maps T=256: 0.3176 vs 0.3221. Check-stage correction to (c): the SciPy region rule DOES change values on continuous
    data. At T=256 (required region 6n) the r-mgc rule 2*min(m,n) and the paper rule 2n accept local regions that SciPy rejects: anm pair (1,3), independent by construction, gives 0.0319 under the r-mgc
    rule vs pyspi 0.0051 (global fallback), and narrowband_f0-0.1 pair (1,2) gives 0.5364 vs pyspi 0.4751 (distance.mgc|anm|256|kernel|rmgc, distance.mgc|narrowband_f0-0.1|256|kernel|rmgc). On logistic_maps
    the r-mgc rule coincides with SciPy''s (map 64 x 8: ceil(0.02*64)*8 = 16 = 2*min(m,n); identical values at T=64 and T=256), so the 0.3157 value is the paper''s 2n rule only, not r-mgc''s.'
  units_and_range: 'A dimensionless correlation in [-1, 1], always >= the global-scale dCorr^{n,n}. It is negative under independence when the fallback to the global scale occurs, and equals 1 for identical
    series (probe on the shared_envelope bit-identical copy). Mathematically symmetric: bivariate(i,j) and bivariate(j,i) differ by <= 1.1e-14 in probes, and the published matrix is exactly symmetric through
    the Undirected mirror. Raises ValueError for T < 5 (_mgc.py:331-333).'
  direction_convention: Undirected. Directed.multivariate computes every ordered pair (base.py:91-93), and Undirected.multivariate copies the upper triangle into the lower (base.py:136-137). Hence A[i,j]
    = A[j,i] = MGC(x = process min(i,j), y = process max(i,j)). No direction information.
  symmetry_expected: sym
  already_documented: 'partly: REVIEW M2 (root cause of the distance-rounding consequence only; consequence new); the class ''unsigned label on a legitimately negative bias-corrected estimator'' is documented for other SPIs in REVIEW M7 (docs/storage_comparison/REVIEW.md:189-193) and M8 (REVIEW.md:197) and EEG_OPTIMIZATION_NOTES.md:169, none of which names mgc, so the negative values are a new instance of that class (same treatment as dcorr_hsic). The region-rule, centring and documentation findings are not in KNOWN_ISSUES.md'
  new_finding_candidates:
  - 'CANDIDATE: ''unsigned'' label but negative outputs. The label comes from the supplement keywords and config.yaml, and GitBook glossary-of-terms.md:21 (''Signed'' keyword row) says ''Other SPIs, such
    as distance correlation (defined in the range [0,1]) are unsigned''; MGC generalises distance correlation and returns its global-scale dCorr on fallback. Probe p3_mgc.py found pyspi mgc minimum -0.0264
    (iid_gaussian T=64) and -0.0075 (T=256), with most independent pairs negative, because _smooth_mgc_map returns the global-scale value stat_mgc_map[m-1][n-1] (_mgc.py:502) when no region qualifies. REVIEW
    M7 (docs/storage_comparison/REVIEW.md:189-193; dspli/dswpli/ppc; in pyspi these measures exist as multitaper identifiers and, for dspli and ppc, also as wavelet identifiers, which REVIEW M7 does not name) and M8 (REVIEW.md:195-198; pec/pec_log, Gaussian joint/conditional entropy), KNOWN_ISSUES.md:31-32, document legitimately negative estimates under unsigned labels for other SPIs; none names mgc, so this is a new instance of that class, not a new finding by itself.'
  - 'CANDIDATE: the minimum-region rule differs from both the paper and the authors'' R code. _mgc.py:509 ''if np.sum(sig_connect) >= np.ceil(0.02 * max(m, n)) * min(m, n)'' differs from Shen 2020 §4.1
    (''less than 2n'') and from r-mgc MGCSampleStat.R:172 ''sum(R)>=2*(min(m,n))''. The probe p4_mgc_variants.py on logistic_maps T=64 gave pyspi=0.3706714311 vs region2n=0.3157202560. On continuous data
    the rule did not change any probed value, because the regions were large.'
  - 'CANDIDATE: the subtractive term uses n^2 rather than the paper''s n(n-1) (_stats.pyx:444 ''cov_xy - ((expectx...) @ expecty...T) / n**2)''). This matches r-mgc (MGCLocalCorr.R:167 ''/n/(n)''), so it
    is a paper-vs-reference-code discrepancy, not a pyspi bug. Probe effect: up to 1.5e-3 absolute at T=64 and 1.2e-4 at T=1024.'
  - 'CANDIDATE: rounding in sklearn dot-product Euclidean distances changes nearest-neighbour ranks and hence the local correlation map. Probe p7_rounding_scope.py at T=256 reported ''shared_envelope MGC
    max abs diff 6.14e-02'' and ''logistic_maps 4.47e-03'' versus exact |x_a - x_b| distances, with <= 7e-14 on the 17 other datasets. This has the same root cause as REVIEW.md M2, which was reported only
    as last-bit asymmetry for pdist.'
  - 'CANDIDATE (documentation): the supplement''s ''unbiased estimator'' wording does not match the global-scale estimator (column-centred, Shen eq. 6), which differs from hyppo Dcorr unbiased (probe -0.0059473
    vs -0.0059357). The GitBook reference link points to an unrelated LCSS paper.'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - nonlinear_dependence
    - anm
    - narrowband_f0-0.1
    - contaminated
    path: kernel
    reference: From-scratch numpy implementation of the local correlation map and Sample MGC. Exact distances |x_a - x_b|, column centring with 1/(n-1) and zero diagonal, column-wise dense ranks via np.unique,
      rank-binned 2-D cumulative sums for the local covariance (A with B transposed) and variances. Thresholding uses scipy.stats.beta.ppf and the scipy.ndimage.label primitive. The reference does not import
      hyppo or scipy.stats.multiscale_graphcorr. Run it with the implementation's constants (n^2, samp = n-1, region ceil(0.02 max)·min) at T in {64, 256, 1024}. The prototype probes/mgc_scratch.py in the
      scratchpad reproduced pyspi to 1e-10 on these kinds of data.
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: Absolute difference <= 1e-10 on continuous datasets.
  - datasets:
    - nonlinear_dependence
    - logistic_maps
    - narrowband_f0-0.1
    - anm
    path: kernel
    reference: 'The same from-scratch reference under two parameterisations. Paper constants: Ê = 1/(n(n-1)), τ_n with n, region >= 2n. r-mgc constants: n^2, n-1, region >= 2·min(m,n). Report the pyspi
      difference from each.'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: Paper variant differs from pyspi by <= ~2e-3 absolute on continuous data, mostly from n^2 vs n(n-1). On logistic_maps T=64, both the paper and r-mgc region rules give about 0.316 vs
      pyspi 0.371, which quantifies the region-rule deviation.
  - datasets:
    - logistic_maps
    - shared_envelope
    path: kernel
    reference: From-scratch exact-distance reference vs pyspi, to attribute the rounding-sensitivity candidate. As a same-lineage aid, also run scipy.stats.multiscale_graphcorr on the exact distance matrices.
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: pyspi is expected to DISAGREE with the exact-distance reference by about 0.06 (shared_envelope T=256 pair (0,1)) and about 0.0045 (logistic_maps T=256). The same-lineage run on exact
      distances should agree with the reference, confirming that sklearn distance rounding is the cause.
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    path: kernel
    reference: 'Analytic global-scale identity: dCorr^{n,n} = sum_{a!=b} A_ab B_ba / sqrt(sum A_ab A_ba · sum B_ab B_ba) with column-centred A, B. Compare with dcor.u_distance_correlation_sqr from the comparison
      venv (dcor==0.7, U-centred) as a related quantity.'
    reference_kind: analytic
    criterion: exact
    expected_outcome: Where pyspi falls back to the global scale (typical for iid pairs), pyspi equals the analytic column-centred value to <= 1e-12. The U-centred dcor value differs at the 1e-5 level (a
      related quantity, not the same estimator).
  - datasets:
    - iid_gaussian
    - var2_bivariate
    - logistic_maps
    - delayed_noise
    path: pipeline
    reference: 'Symmetry and direction convention: compare the full pyspi matrix with direct bivariate(i,j) and bivariate(j,i) calls and with the from-scratch reference for both argument orders.'
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: The pyspi matrix is exactly symmetric, and A[i,j] (i<j) equals bivariate(i,j). bivariate(j,i) differs by <= 1e-13 (floating summation order); in the rare case of equal-size components
      the tie-break can differ, which should be reported. No direction information.
  - datasets:
    - iid_gaussian
    path: kernel
    reference: Permutation null from the from-scratch reference (200 permutations per pair). Check the sign distribution of the pyspi values.
    reference_kind: independent-impl
    criterion: statistical
    expected_outcome: Percentiles are consistent with uniform, and a substantial fraction of null values are negative, contradicting the 'unsigned' label.
  - datasets:
    - shared_envelope
    - nonlinear_dependence
    path: pipeline
    reference: Analytic and qualitative anchors. A bit-identical copy (shared_envelope (0,2)) must give 1. Parabola and circle (nonlinear_dependence) must give clearly positive values, well above the iid
      level.
    reference_kind: analytic
    criterion: exact
    expected_outcome: 'mgc(0,2) on shared_envelope = 1.0 exactly (probe: 1.0 at T=64 and 256). nonlinear_dependence pairs are about 0.44-0.58, against |iid| < 0.03.'
  - datasets:
    - scaled_offset
    - bivariate_gaussian
    path: pipeline
    reference: 'Invariance: scaled_offset should equal bivariate_gaussian after z-scoring, since MGC is invariant to per-variable affine maps.'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: Matrices agree to <= 1e-12 absolute.
  - datasets:
    - trending
    - bivariate_gaussian
    path: pipeline-detrend
    reference: 'Qualitative: shared linear trends create spurious distance dependence. Compare trending with and without detrend against bivariate_gaussian.'
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: Without detrend, values are inflated towards 1 for pairs that are independent in bivariate_gaussian. With detrend=True, values fall back near the bivariate_gaussian levels. They are
      not identical, because detrend removes each realised series' least-squares line.
  check_method: independent-impl
  check_reference: 'audit/checks/refs/hhg_mgc.py:mgc_from_dist (from scratch in numpy: Shen, Priebe & Vogelstein 2020 eq. 6 column centring, dense column ranks, rank-binned 2-D cumulative local covariances,
    Corollary 3 Beta threshold via scipy.stats.beta.ppf, largest 4-connected component via scipy.ndimage.label; does not import hyppo or scipy.stats.multiscale_graphcorr; constants selectable: SciPy (n^2,
