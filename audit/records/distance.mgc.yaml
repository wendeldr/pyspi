    (U-centred dCor^2, related quantity); audit/checks/refs/hhg_mgc.py:dcor2_gauss (population dCor^2, Szekely, Rizzo & Bakirov 2007 Thm 7); audit/checks/refs/hhg_mgc.py:mc_quantile_band; probes audit/checks/probes/hhg_mgc_probes.py:optscale
