  check_data: iid_gaussian, bivariate_gaussian, nonlinear_dependence, anm, narrowband_f0-0.1, contaminated T64/T256/T1024 kernel; bivariate_gaussian T256 pipeline; nonlinear_dependence, logistic_maps, narrowband_f0-0.1,
