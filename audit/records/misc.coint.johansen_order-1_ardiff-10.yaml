unit_id: misc.coint.johansen_order-1_ardiff-10
status: profiled
correctness:
  metric_name_standard: 'Johansen cointegration rank test statistics for r=0 in a bivariate VECM: lambda-max (max_eig_stat) and trace (trace_stat); statsmodels det_order=1 (pre-detrended levels), 10 lagged
    differences'
  canonical_ref: Johansen S. 1988, J. Economic Dynamics and Control 12(2-3):231-254, "Statistical analysis of cointegration vectors" (LR trace test, eq. for -2lnQ); Johansen S. 1991, Econometrica 59(6):1551-1580
    (deterministic terms, lambda-max); Johansen S. & Juselius K. 1990, Oxford Bull. Econ. Stat. 52(2):169-210 (models H1, H1*, constant restricted/unrestricted); Lutkepohl 2005, New Introduction to Multiple
    Time Series Analysis, §7.2 / §8.2 (statsmodels docstring reference)
  canonical_definition: R0t, R1t = residuals of Delta y_t and y_(t-1) on lagged differences Delta y_(t-1..t-k) and deterministic terms D_t; S_ij = m^-1 sum R_it R_jt'; lambda_1 >= lambda_2 solve |lambda
    S11 - S10 S00^-1 S01| = 0; trace(r) = -m sum_(i=r+1..n) ln(1-lambda_i), lambda-max(r) = -m ln(1-lambda_(r+1)); here n=2, r=0. Documented "constant and linear trend" most naturally maps to the restricted-trend
    case H*(r) (trend in the cointegration space, unrestricted constant; urca ecdet="trend").
  documented_definition: 'supplement §1.6.3, p.19 (heading supplement.txt line 885, text 886-899): "If two time series are individually integrated but some linear combination of them has a lower order of
    integration, then the series are said to be cointegrated [79]. We implement statistics for quantifying the cointegration of bivariate time series from two tests included in v0.12.0 of statsmodels [75]:
    the Augmented Engle-Granger (AEG, modifier aeg) [80] two-step test and the Johansen test (johansen) [81]." Keywords: "undirected, linear, unsigned, bivariate, time-dependent". [80] = Engle & Granger
    1987 Econometrica 55, 251; [81] = Pesaran & Shin 1999 (ARDL bounds approach), not Johansen. GitBook spi-descriptions/miscellaneous.md:13-41 has the same text (Key References link to JSTOR 1913236 =
    Engle & Granger 1987 and to the Pesaran-Shin ARDL chapter). Johansen bullet (supplement.txt:896-899): "For the Johansen test, we output both the maximum eigenvalue (modifier max_eig_stat) and the trace
    (trace_stat) of the vector error correction model. Similar to the AEG test, we also assume a constant (order-0) or constant and linear trend (order-1) and fixed autoregressive lags of 1 (ardiff-1) and
    10 (ardiff-10)." Listed as SPIs 221-228.'
  delegate_lib: statsmodels==0.15.0 statsmodels.tsa.vector_ar.vecm.coint_johansen (numpy==2.5.4 linalg inv/eig/cholesky/pinv)
  implemented_as: 'Default pipeline z-scores (optionally detrends) each channel. For each unordered pair the first call bivariate(i=hi, j=lo) runs statsmodels coint_johansen on the (T x 2) matrix [z_hi,
    z_lo] with det_order=1: full-sample linear trend removed from levels by OLS on np.vander(linspace(-1,1,T), 2) (vecm.py:650-653, :670); differences, lagged differences and lagged levels then only demeaned
    (f=0). VECM Delta y_t = Pi y_(t-1) + sum_(i=1..10) G_i Delta y_(t-i) + D_t + e_t (VAR order 11); eigenvalues a_1 >= a_2 of S_kk^-1 S_k0 S_00^-1 S_0k from residual moment matrices over m = T-10-1 samples.
    Returned: max_eig_stat = -m log(1-a_1) and trace_stat = -m [log(1-a_1)+log(1-a_2)] (tests of r=0). One fit serves both identifiers. Column order does not matter (probe: max relative swap difference
    <= 1.3e-11). Critical values, rank decision and eigenvectors are discarded.'
  implementation_trace:
  - pyspi/calculator.py:252-259 Calculator._load_yaml instantiates Cointegration(**params) per config; the YAML labels block (config.yaml:1294-1299, "linear") is not read, so instance labels come from the
    class
  - 'pyspi/calculator.py:295 (def) and :327-339 compute: S = spi.multivariate(dataset); fill_diagonal NaN; any exception -> the whole matrix for that SPI set to NaN (:336-337), a MetricReport with status=failed
    recorded, and a warning built at :339 and emitted at :355'
  - 'pyspi/data.py:184-195 preprocessing: optional scipy.signal.detrend(axis=1), then zscore(axis=1, ddof=1) by default'
  - 'pyspi/base.py:132-138 Undirected.multivariate -> Directed.multivariate (base.py:85-94: outer loop j, inner loop i != j, A[i,j] = bivariate(i=i, j=j)); then A[tril] = A.T[tril]. For a pair a<b the FIRST
    call is bivariate(i=b, j=a)'
  - pyspi/statistics/misc.py:22-26 class Cointegration(Undirected, Unsigned); labels = ["misc","unsigned","temporal","undirected","nonlinear"]
  - pyspi/config.yaml:1322-1330 two configs (statistic max_eig_stat and trace_stat) with det_order=1, k_ar_diff=10
  - 'pyspi/statistics/misc.py:28-45 __init__: branch method == "johansen" stores _det_order, _k_ar_diff; identifier coint_johansen_<statistic>_order-<det>_ardiff-<k>'
  - 'pyspi/statistics/misc.py:54-58 key = ("johansen", det_order, k_ar_diff): the statistic is not in the key, so max_eig_stat and trace_stat share one cached fit'
  - 'pyspi/statistics/misc.py:62-67 _from_cache: try data.coint[self.key][(i, j)]; on miss z = data.to_numpy(squeeze=True) (shape P x T)'
  - 'pyspi/statistics/misc.py:79-87 coint_johansen(z[[i, j]].T, det_order, k_ar_diff); ci = {max_eig_stat: stats.max_eig_stat[0], trace_stat: stats.trace_stat[0]} (r = 0 row only)'
  - 'pyspi/statistics/misc.py:89-95 store ci under (i, j) AND (j, i): the first-computed orientation is reused for the reverse pair'
  - pyspi/statistics/misc.py:99-103 bivariate returns ci[self._statistic] (comment at :99 says "Return the negative t-statistic", no negation is applied)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:594 coint_johansen(endog, det_order, k_ar_diff) (statsmodels 0.15.0; imports inv from numpy.linalg :5,
    lagmat :16)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:650-658 inner detrend(y, order) = OLS residuals on np.vander(np.linspace(-1,1,len(y)), order+1); resid(y,
    x) = y - x pinv(x) y
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:665-670 f = 0 for det_order > -1; endog = detrend(endog, det_order)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:671-679 dx = diff(endog); z = lagmat(dx, k)[k:] demeaned; dx = dx[k:] demeaned; r0t = resid(dx, z)
  - '/media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:681-684 lx = endog[1 : T-k] (level at t-k), demeaned; rkt = resid(lx, z)'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:686-692 skk = rkt'rkt/m, sk0 = rkt'r0t/m, s00 = r0t'r0t/m; eig(inv(skk) sk0 inv(s00) sk0') (numpy 2.5.4
    returns complex128 eigenvalues, imaginary part 0 in every probe)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:694-706 cholesky normalisation of eigenvectors and descending sort (no effect on the statistics)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:714-718 m = rkt.shape[0] = T-k-1; lr1[i] = -m sum_(j>=i) log(1-a_j) (trace), lr2[i] = -m log(1-a_i) (max-eig);
    complex-to-float assignment emits ComplexWarning at :717-718
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/statsmodels/tsa/vector_ar/vecm.py:772-790 JohansenTestResult.trace_stat -> lr1, max_eig_stat -> lr2
  deviation_from_documented: '(1) The supplement says "the maximum eigenvalue ... and the trace ... of the vector error correction model"; the code returns the LR test STATISTICS for rank 0 (-m log(1-a_1)
    and -m sum log(1-a_i)), not an eigenvalue or a matrix trace. (2) "constant (order-0)" / "constant and linear trend (order-1)" do not name the Johansen case; order-0 is the unrestricted constant, order-1
    is the statsmodels pre-detrending scheme. (3) "autoregressive lags of 1 (ardiff-1) and 10" = number of lagged DIFFERENCES (VAR order k+1). (4) Citation [81] is Pesaran & Shin 1999 (ARDL), not Johansen
    1988/1991. (5) Metadata: class label "nonlinear" (misc.py:26) vs documented keyword and config label "linear". (6) Supplement cites statsmodels v0.12.0; installed 0.15.0 (value changes between versions
    not assessed).'
  deviation_from_canonical: 'det_order=1 matches NO standard Johansen deterministic case (candidate). statsmodels removes a full-sample linear trend from the LEVELS by OLS before differencing (vecm.py:650-653,
    :670) and then only demeans differences and lagged levels on the effective sample (f=0, :665-667, :674, :678, :683); the trend is never partialled jointly with the lagged differences. Probes (T=256
    cointegrated): pair (1,0) k=10: statsmodels maxeig 27.185651 trace 32.915367 vs restricted-trend case (Johansen H*(r), urca ca.jo ecdet="trend", K=11, identical to a from-scratch RRR) maxeig 27.511696
    trace 35.644458; pair (2,0): statsmodels maxeig 24.9979 trace 28.8501 vs restricted-trend 25.0466 / 31.5702 (trace 9.4% lower). Unrestricted-trend (case 5) also differs (rel up to 2.5%). Differences
    shrink with T (T=1024: 2e-6 to 1.7e-2 relative). Johansen-1988 level form y_(t-k) is equivalent to y_(t-1) (see order-0 units). pyspi keeps only r=0. CHECK-STAGE CORRECTION: ''Differences shrink with
    T'' holds for the cointegrated pair only. On non-cointegrated pairs the gap to case 4 persists (max_rel 0.28 max-eig / 0.38 trace at T=4096), while the gap to the unrestricted-trend case 5 is <= 1.1e-2;
    statsmodels'' det_order-1 tables are case-5 quantiles (runs misc.coint.johansen_order-1_ardiff-10|cointegrated|*|kernel|canon-* and misc.coint.johansen_order-1_ardiff-1|cointegrated|256|pipeline|cvmc).'
  units_and_range: 'dimensionless LR statistics (chi-square-type, non-standard asymptotics); both >= 0 and trace_stat >= max_eig_stat on non-degenerate pairs, trace - max_eig = -m ln(1-lambda_2) (probe
    identity error <= 1.5e-14); grow O(T) when the pair is jointly stationary (iid_gaussian T=256 pair (1,0), k=10, det=1: trace 54.03); no upper bound; for exactly collinear pairs the outcome is input-dependent:
    bitwise-identical channels (shared_envelope x2 == x0) raise LinAlgError (singular inverse or non-PD cholesky, vecm.py:690-694), which makes the whole pipeline matrix NaN, while z vs 3z+1 can also return
    without error with out-of-range values (negative eigenvalues/statistics); see new_finding_candidates; symmetric by construction; NaN diagonal'
  direction_convention: 'undirected: A[i,j] = A[j,i] = statistic of coint_johansen([z_max(i,j), z_min(i,j)]); the column order does not change the value (permutation invariance of the reduced-rank eigenvalues;
    probe swap difference <= 1.3e-11 relative), so no direction is encoded'
  symmetry_expected: sym
  already_documented: no (tests/README.md:130 only lists coint_johansen_max_eig_stat_order-1_ardiff-1 among the preprocessing-variant snapshot SPIs; tests/README.md:521-528 lists run status/timing; nothing
    in KNOWN_ISSUES.md concerns coint)
  new_finding_candidates:
  - 'CANDIDATE (definition, order-1 only): statsmodels det_order=1 detrends levels over the full sample before differencing (vecm.py:670) instead of putting a trend in the VECM; the statistic matches neither
    the restricted-trend (urca ecdet="trend") nor the unrestricted-trend Johansen case. Evidence (T=256 cointegrated): pair (1,0) k=10: statsmodels maxeig 27.185651 trace 32.915367 vs restricted-trend case
    (Johansen H*(r), urca ca.jo ecdet="trend", K=11, identical to a from-scratch RRR) maxeig 27.511696 trace 35.644458; pair (2,0): statsmodels maxeig 24.9979 trace 28.8501 vs restricted-trend 25.0466 /
    31.5702 (trace 9.4% lower). (from-scratch RRR = urca to 6 decimals). Effect is largest on the trace statistic and at small T; pipeline detrend (data.py:186) leaves order-1 values unchanged (probe max
    abs diff <= 4.9e-11).'
  - 'CANDIDATE (conceptual): the documented premise ("individually integrated") is not checked; on stationary inputs the r=0 statistics are large and grow ~linearly with T, independent of coupling. Probe
    (k=10, det=1): independent white noise iid_gaussian T=256 pair (1,0) trace 54.03 vs the truly cointegrated random-walk pair (cointegrated T=256 (1,0)) trace 32.92. For z-scored stationary data (EEG)
    the SPI therefore ranks pairs by persistence/stationarity of the channels rather than by cointegration (hypothesis to quantify in the check stage).'
  - 'CANDIDATE (robustness): exactly collinear pairs give an input-dependent outcome in coint_johansen (vecm.py:650-718), either a numpy LinAlgError or a silently out-of-range value. (a) Bitwise-identical
    channels (shared_envelope x2 == x0 after Data normalisation) raised "Singular matrix" in all four Johansen configs at T=256 and T=1024; Calculator.compute (calculator.py:336-337) then stores an all-NaN
    matrix for the SPI, so one duplicated channel blanks every pair. (b) For z vs 3z+1 (z a Data-normalised channel, coint_johansen called directly on [z, 3z+1]) over {cointegrated, iid_gaussian, trending,
    shared_envelope} x T {256, 1024} x channels {0, 1} x four configs, 29/64 raised and 35/64 returned without error, often with negative eigenvalues, negative statistics or eigenvalues near 1 with very
    large statistics. This config: raises e.g. iid_gaussian T=256 ch0, det=1, k=10 -> "Matrix is not positive definite"; returns e.g. cointegrated T=256 ch0: eig [0.0074, -0.395], trace -79.73; iid_gaussian
    T=256 ch1: eig [0.088, -0.9491], trace -140.94. The z used in the earlier probe (seed-0 random walk, T=256, coint/probe3.py) passed through Data raises in all four configs. Probe: coint_fix/p_collin.py.
    Which inputs raise vs return, and whether a returned value can be distinguished from a valid one, is for the check stage.'
  - 'CANDIDATE (numerics, value-neutral): with numpy 2.5.4 np.linalg.eig returns complex128 even for real spectra (probe: eig of [[2,1],[1,3]] -> complex128), so every call emits ComplexWarning at vecm.py:717-718
    and silently drops the imaginary part; max |imag| over all probed pairs/datasets was 0.0.'
  - 'CANDIDATE (metadata): class label "nonlinear" (misc.py:26) while the supplement keyword and config.yaml:1294-1299 say "linear"; the Calculator never reads YAML labels (calculator.py:252-259). Probe:
    Cointegration().labels -> ["misc","unsigned","temporal","undirected","nonlinear"].'
  - 'CANDIDATE (documentation): the supplement says "maximum eigenvalue" and "trace" of the VECM; the outputs are the rank-0 LR statistics (misc.py:84-87 take max_eig_stat[0], trace_stat[0]); citation [81]
    (Pesaran & Shin 1999, ARDL) does not describe the Johansen test.'
  - 'CANDIDATE (robustness, latent): __init__ branches on method == "johansen" (misc.py:40) but _from_cache on method == "aeg" (misc.py:69); any other spelling builds an AEG-style identifier and then calls
    coint_johansen without _det_order. Probe: Cointegration(method="Johansen").bivariate(...) -> AttributeError: no attribute "_det_order". Not reachable from the shipped configs.'
