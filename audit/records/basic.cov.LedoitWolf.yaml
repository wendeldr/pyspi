unit_id: basic.cov.LedoitWolf
status: profiled
correctness:
  metric_name_standard: Ledoit-Wolf shrinkage covariance estimator (shrinkage toward scaled identity)
  canonical_ref: Ledoit & Wolf 2004, J. Multivariate Analysis 88(2):365-411, §3 (estimator S* = (b^2/d^2) m I + (a^2/d^2) S, with m = <S,I>, d^2 = ||S - mI||^2, b^2 = min(bbar^2, d^2), bbar^2 = n^-2 sum_k ||x_k x_k^T - S||^2, normalised Frobenius norm ||A||^2 = tr(AA^T)/p)
  canonical_definition: Sigma_LW = (1 - s) S + s (tr(S)/p) I with s = min(bbar^2, d^2)/d^2, S = (1/n) sum x_k x_k^T on (assumed) zero-mean data
  documented_definition: 'supplement §1.1.1, p.3-4 (supplement.txt:136-157): ''Due to the z-scoring of the time series, the correlation and covariance matrices are equivalent and thus the covariance statistic is within [-1, 1].'' Keywords: undirected, linear, signed, multivariate, contemporaneous. GitBook basic-statistics.md:15-45 repeats the text (its keyword line says ''undirected, nonlinear, unsigned, bivariate''). Neither source documents the ''-sq'' (squared) variants generated by pyspi/config.yaml.'
  delegate_lib: scikit-learn==1.9.1 sklearn.covariance.LedoitWolf().fit(X).covariance_; numpy==2.5.4
  implemented_as: Data z-scores each channel with ddof=1 (pipeline default); sklearn.covariance.LedoitWolf() with defaults is fit on the (T x P) array; data-driven Ledoit-Wolf shrinkage s; covariance_ off-diagonal returned (diagonal NaN). Sample covariance uses divisor T (np.cov bias=1) after sample-mean centring, so on the default pipeline the off-diagonal equals (1 - s) * (T-1)/T * Pearson r, s the estimated shrinkage (diagonal mu = (T-1)/T). Squared variant (cov-sq_*) = np.square of the same matrix, labelled unsigned.
  implementation_trace:
  - pyspi/data.py:59-71 Data.__init__ default normalise=True, detrend=False
  - pyspi/data.py:184-195 optional scipy.signal.detrend then zscore(data, axis=1, nan_policy='omit', ddof=1)
  - pyspi/calculator.py:327-339 (HEAD a1f20c7) Calculator.compute try block; :329 calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :335 stores S in the table; :336-339 any exception -> the whole SPI entry set to NaN and the error recorded, warning issued at :354-355
  - 'pyspi/base.py:51-66 parse_multivariate (inplace=True: the cache written onto the Data object persists across SPIs)'
  - pyspi/statistics/basic.py:9 class Estimators(Undirected, Signed); its multivariate overrides Undirected.multivariate (pyspi/base.py:132-138), so no triangle mirroring
  - 'pyspi/statistics/basic.py:18-29 Estimators.__init__: identifier suffix ''_<estimator>'' or ''-sq_<estimator>''; squared sets labels+[''unsigned''] and issigned()->False'
  - 'pyspi/statistics/basic.py:31-44 _from_cache: z = data.to_numpy(squeeze=True).T (observations x processes); getattr(sklearn.covariance, estimator)().fit(z) with ALL sklearn defaults; fitted object cached in data.covariance[estimator] and shared by cov_* and prec_* of that estimator'
  - 'pyspi/statistics/basic.py:46-54 multivariate: matrix = getattr(mycov, ''covariance_'') (line 49); np.fill_diagonal(matrix, np.nan) IN PLACE on the cached sklearn attribute (line 50); returns np.square(matrix) if squared (line 52) else the cached array object itself (line 54)'
  - pyspi/statistics/basic.py:57-63 Covariance(kind='covariance'), identifier 'cov'
  - .venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:577-581 LedoitWolf.__init__ block_size=1000 default
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:584-613 LedoitWolf.fit: location_ = X.mean(0) (line 606); _ledoit_wolf(X - location_, assume_centered=True) (lines 607-609); shrinkage_ stored (line 610); _set_covariance (line 611)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:25-43 _ledoit_wolf: shrinkage = ledoit_wolf_shrinkage(...) (line 35); emp_cov = empirical_covariance (line 38, divisor T); mu = trace/p (line 39); (1-s)*emp_cov + s*mu on diagonal (lines 40-41)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:297-400 ledoit_wolf_shrinkage: emp_cov_trace, mu (lines 364-365); blocked beta_ = sum_k ||x_k||^4 and delta_ = ||X^T X||_F^2 / n^2 (lines 368-388); beta = (beta_/n - delta_)/(p n) (line 390); delta = ||S - mu I||_F^2 / p (lines 392-393); beta = min(beta, delta) (line 397); shrinkage = beta/delta (line 399)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:196-215 _set_covariance: covariance_ = covariance (line 210); store_precision=True default (line 192) -> precision_ = scipy.linalg.pinvh(covariance, check_finite=False) (line 213)'
  deviation_from_documented: Docs say covariance equals correlation and lies in [-1,1]. Implemented value is (T-1)/T * r on the default pipeline (ddof=1 z-score vs divisor-T covariance), further multiplied by (1 - s) from shrinkage. With normalise=False the value is the raw MLE covariance, not bounded by 1. The '-sq' squared variants are undocumented in the supplement and GitBook. GitBook keyword line ('undirected, nonlinear, unsigned, bivariate') contradicts the supplement and the code labels (linear, signed, multivariate).
  deviation_from_canonical: 'none found: from-scratch LW 2004 §3 formula reproduces sklearn''s shrinkage to 10 significant digits (0.1842118924, 0.01415005694, 0.2503679232); only difference is sample-mean centring (LW assume zero mean), which is standard practice'
  units_and_range: 'dimensionless (input units squared on the kernel path); signed; symmetric (bitwise); cov-sq in [0,1). Pipeline path: |value| <= (T-1)/T * (1 - s); NaN diagonal. Exact 0.0 off-diagonals whenever the shrinkage clips to 1 (all iid_gaussian files).'
  direction_convention: 'undirected: A[i,j] is the (i,j) entry of the fitted sklearn covariance_ for processes i and j (rows of the Data array); no ordering, symmetric bitwise; to be confirmed empirically in the check stage'
  symmetry_expected: sym
  already_documented: REVIEW M1 (Estimators.multivariate bypasses Undirected mirror)
  new_finding_candidates:
  - 'Candidate: multivariate() mutates the cached sklearn estimator in place and returns an alias of it. pyspi/statistics/basic.py:49-50 ''matrix = getattr(mycov, self._kind + "_")'' then ''np.fill_diagonal(matrix, np.nan)''; probe: after Covariance(...).multivariate(dat), dat.covariance[''LedoitWolf''].covariance_ diagonal is [nan nan nan nan] and ''returned is cache: True''. No current output changes (precision_ is computed at fit time, before the mutation, and nothing else reads data.covariance), but any later consumer of the cached fit (get_precision, score, mahalanobis) or of the returned array would see the NaN diagonal or alias the cache.'
  - 'Candidate (documentation): the supplement claim ''covariance and correlation matrices are equivalent'' is exact only up to (T-1)/T and the shrinkage factor (1 - s); probe bivariate_gaussian T=1024: max |C - (1-s)(T-1)/T r| <= 4.4e-16, while C[2,3] = 0.78544 vs r = 0.79749 (s = 0.01415).'
  - 'Candidate (documentation): the ''cov-sq_*''/''prec-sq_*'' variants (pyspi/config.yaml:21-36, 56-71) are not described in supplement §1.1.1-1.1.2 or GitBook; probe confirms they are exactly np.square of the unsquared matrix (np.array_equal True).'
  - 'Candidate (documentation): GitBook basic-statistics.md:17 lists Covariance keywords ''undirected, nonlinear, unsigned, bivariate'', contradicting supplement §1.1.1 (''undirected, linear, signed, multivariate'') and pyspi/config.yaml:5-10.'
  - 'Candidate (behaviour note): on independent channels the LedoitWolf shrinkage clips to exactly 1, so every off-diagonal of cov_LedoitWolf/prec_LedoitWolf is exactly 0.0 (probe: iid_gaussian T=64,256,1024,4096: s=1, max|off-diag|=0); also nonlinear_dependence T=1024 prec max 0.000. Canonical behaviour, but downstream users get ties at 0 on null data.'
  proposed_checks:
  - datasets:
    - bivariate_gaussian
    - sparse_precision
    - scaled_offset
    - iid_gaussian
    - cointegrated
    path: kernel
    reference: 'numpy from-scratch Ledoit & Wolf 2004 §3: m = tr(S)/p, d2 = ||S - mI||^2/p, bbar2 = n^-2 sum_k ||x_k x_k^T - S||^2/p on mean-centred data, s = min(bbar2,d2)/d2, Sigma = (1-s)S + s m I'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: 'shrinkage and off-diagonals match within rel 1e-10 (trace probe: s = 0.1842118924 on bivariate_gaussian T=64 for both)'
  - datasets:
    - bivariate_gaussian
    - scaled_offset
    path: pipeline
    reference: 'analytic: (1-s)*(T-1)/T*np.corrcoef(x) with s from the from-scratch LW formula'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: off-diagonal equals (1-s)(T-1)/T r within 1e-12 abs; s -> 0 as T grows (convergence toward cov_EmpiricalCovariance)
  - datasets:
    - iid_gaussian
    - nonlinear_dependence
    path: pipeline
    reference: 'analytic: shrinkage clipped at 1 (b^2 = min(bbar^2, d^2)) gives a diagonal estimate'
    reference_kind: analytic
    criterion: exact
    expected_outcome: on iid_gaussian at every T the shrinkage is 1 and every off-diagonal is exactly 0.0 (trace probe confirmed at T=64..4096); record as degenerate-by-design null behaviour
  - datasets:
    - bivariate_gaussian
    - delayed_noise
    - var2_bivariate
    - cointegrated
    path: pipeline
    reference: 'analytic: undirected; A must equal A.T bitwise'
    reference_kind: analytic
    criterion: direction
    expected_outcome: 'A[i,j] == A[j,i] exactly on every dataset (trace probe: 0 asymmetric runs out of 76 dataset files); A[i,j] is the (i,j) entry of the estimate, no direction'
  - datasets:
