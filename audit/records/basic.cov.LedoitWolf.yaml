  check_reference: audit/checks/refs/cov_prec_simple.py:ref_matrix/handle (numpy/scipy only, no sklearn) with _kernels_basic_misc.ledoit_wolf; Monte Carlo of the dataset population models (refs/cov_prec_simple.py:mc_stats, N=1000); probes/cov_prec_simple_probes.py:{spi, shrinkage, mutation, mutation_others} for the P=19 stacks, average-referenced input, fitted shrinkage_ and the cache-mutation flags
  check_data: bivariate_gaussian; scaled_offset; trending; sparse_precision; cointegrated; iid_gaussian; shared_envelope; delayed_noise; var2_bivariate; var2_chain; logistic_maps_chaotic; anm; P=19 stackA (iid_gaussian+bivariate_gaussian+sparse_precision+gauss_ar1_pair+var2_chain); P=19 stackB (delayed_noise+narrowband_f0-0.1+narrowband_f0-0.25+var2_bivariate+bivariate_gaussian+var2_chain); average-referenced bivariate_gaussian and stackB (rank P-1). T in {64, 256, 1024, 4096}; paths kernel, pipeline, pipeline-detrend
  agreement_criterion: 'exact rtol 1e-10 / atol 1e-12 for the covariance against the independent estimator; statistical: |pyspi - E_MC| <= 2 se_fw, se_fw = Monte Carlo sd x familywise factor (1.32 for P=4, 1.40 for P=5) so the rule is a two-sided familywise 5% test over the P(P-1)/2 pairs; qualitative: symmetry (bitwise) with value agreement, and order independence under the cache mutation; documented-claim runs (doc-*) are tolerance 1e-10 comparisons that are expected to fail and record the size of the gap'
  closeness: '75/78 runs pass in checks/out/results/cov_prec_simple.json. Independent reference: 35/35 value runs pass (kernel, pipeline, pipeline-detrend, squared, symmetry, singular, average-referenced, P=19 stacks), max abs 3.67e-15, max rel 2.24e-12. Pipeline identity: pyspi / Pearson r = 0.8030414 (T=64) and 0.9848872 (T=1024) on every pair, equal to the expected (1-s)(T-1)/T = 0.8030414 / 0.9848872 (doc-corr runs, which fail against plain r with max rel 0.197 / 0.01511). cov-sq is bitwise np.square of the plain output (bitwise_equal_square_of_plain = 1 on kernel and pipeline). Statistical vs the population model (N=1000 Monte Carlo): 13/14 pass; bivariate_gaussian pipeline T=64/256/1024/4096 max |pyspi - limit| 0.136/0.062/0.0358/0.016 (about 1/sqrt(T)), max_z <= 0.898. basic.cov.LedoitWolf|sparse_precision|1024|kernel|truth fails (max_z 2.26, max |dev|/sd 3.17, Monte Carlo familywise p = 0.014): the realised T=1024 sample has entry (2,3) 3.2 sd above its expectation for every estimator alike; the same file passes the exact reference and T=256/4096 pass, so this is a property of the draw, not of the estimator. Fitted shrinkage_ (probe) vs the kernel: 26/26 pass, max abs 4.44e-16 (P=4, 5, 19; T=64-4096; kernel and pipeline). Null iid_gaussian pipeline: shrinkage = 1.0 at T=64/256/1024/4096 and every off-diagonal is exactly 0.0 (null runs, exact). Symmetry: max|A - A.T| = 0.0 (bitwise) over 51 matrix runs.'
