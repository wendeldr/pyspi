unit_id: misc.ids
status: profiled
correctness:
  metric_name_standard: 'InterDependence Score IDS-max (IDS_inf): maximum absolute Pearson correlation between the first k Taylor-series feature maps of
    a Gaussian kernel applied to each variable'
  canonical_ref: 'Radhakrishnan A, Jain Y, Uhler C, Lander ES 2025, PNAS 122(34):e2509860122 (PMC12403096), "Efficiently quantifying dependence in massive
    scientific datasets using InterDependence Scores": Eq. 3 (Gaussian kernel exp(-(x-y)^2/(2B^2))), Eq. 6 (feature map), Eq. 11 (feature correlations),
    Eq. 12 (IDS_p as l_p norm, IDS_inf = max); main-text implementation choice: IDS_inf, B = 1, k = 6 terms, data min-max scaled to [0, 8]. Reference code:
    github.com/aradha/interdependence_scores (main, last commit 3c8d62b, 2025-03-18).'
  canonical_definition: phi_m(x) = exp(-x^2/(2B^2)) x^m / (sqrt(m!) B^m), m = 0..k-1; rho_ml = Corr(phi_m(x), phi_l(y)); IDS_p(x, y) = ((1/k^2) sum_{m,l}
    |rho_ml|^p)^(1/p), IDS_inf = max_{m,l} |rho_ml|; values in [0, 1], 0 iff all k^2 feature correlations vanish (population).
  documented_definition: 'Not in the supplement (no section; the SPI post-dates it). GitBook miscellaneous.md:117-127: keywords "undirected, nonlinear,
    unsigned"; "a fast and scalable measure of dependence that captures both linear and various non-linear dependencies ... Based on the Hilbert-Schmidt
    Independence Criterion (HSIC), the IDS offers a finite-dimensional approximation of the universal kernels that can detect any type of dependence"; "the
    IDS is normalized to a range of [0, 1] with a score of 0 indicating independence"; implementation "based on the code made publicly available" at aradha/interdependence_scores.
    Key reference: PNAS doi 10.1073/pnas.2509860122.'
  delegate_lib: 'pyspi (vendored, MIT) pyspi/lib/ids/numpy_dependence.py compute_IDS_numpy, a verbatim copy of upstream aradha/interdependence_scores ids/numpy_dependence.py
    (diff: added header docstring, removed __main__ demo); numpy==2.5.4 np.corrcoef; tqdm==4.70.1 imported but only used by the unused p-value path'
  implemented_as: 'Data z-scores each process (ddof=1, default normalise=True; detrend off by default). multivariate transposes to (T, P), builds K*P feature
    columns f_k(z) = exp(-0.5 z^2) z^k / sqrt(k!), k = 0..5, ordered term-major (column index k*P + p), subtracts column means, computes the full (KP x
    KP) np.corrcoef, reshapes to (K, P, K, P), replaces NaN/inf by 0, takes abs, and returns max over both term axes: A[i, j] = max_{k,l} |Corr(f_k(z_i),
    f_l(z_j))| (36 correlations per pair). bandwidth=0.5 is the coefficient of z^2, i.e. paper B = 1; the missing B^m factor is irrelevant because correlations
    are invariant to per-column scale (probe: code vs Eq. 6 with B_paper = sqrt(1/(2*bandwidth)) agree to <= 4.4e-16 for bandwidth 0.25/0.5/1.0). No p-value
    (p_val=False). No mirroring: multivariate overrides Undirected.multivariate, symmetry comes from np.corrcoef, exact up to last-bit rounding (check stage:
    max |A - A^T| = 2.2e-16 over 65 square outputs, 52 of them not bitwise symmetric). Diagonal is 1 from compute_IDS (k = l term), set to NaN by Calculator.compute.
    Matches a from-scratch numpy reference to <= 8.9e-16 on 7 datasets x 4 lengths.'
  implementation_trace:
  - 'pyspi/config.yaml:1394-1404 InterDependenceScore configs: terms 6, pnorm max, bandwidth 0.5 (fast_config.yaml:1295-1305 same); YAML labels are not
    read, class labels used'
  - 'pyspi/calculator.py:230-267 Calculator._load_yaml (def 230): importlib.import_module(".statistics.misc") (239) - first import executes numpy_dependence.py:11-12
    np.random.seed(1717) - then the per-config loop 251-267 instantiates InterDependenceScore(**params) (256) and stores it under identifier "ids" (257)'
  - 'pyspi/data.py:184-203 Data.set_data: optional detrend (184-191), zscore(axis=1, nan_policy="omit", ddof=1) when normalise (193-195), NaN after preprocessing
    raises ValueError (199-203) so constant channels never reach IDS'
  - 'pyspi/calculator.py:295-355 Calculator.compute (def 295; per-SPI try/except 327-339): S = spi.multivariate(dataset) (329); fill_diagonal(S, nan) (332);
    self._table[spi] = S (335); except 336-339: whole block NaN (337), error and warning text recorded (338-339); MetricReport status "failed" (342-346);
    on_metric_complete callback (347-353); warnings.warn(failure_warning) emitted after the callback (354-355)'
  - 'pyspi/base.py:51-68 parse_multivariate: wraps raw iterables into Data (default z-scoring), else passes Data through'
  - pyspi/statistics/misc.py:11 from pyspi.lib.ids.dependence import compute_IDS
  - 'pyspi/statistics/misc.py:178-191 InterDependenceScore(Undirected, Unsigned): identifier "ids" fixed (180, does not encode params), labels unsigned/misc/undirected/nonlinear
    (181), defaults terms=6, pnorm="max", bandwidth=0.5 (185-191)'
  - 'pyspi/statistics/misc.py:194-200 multivariate (overrides base.py:132-138 Undirected.multivariate, so no lower-triangle mirroring): z = squeeze(data.to_numpy(),
    axis=2).T -> (T, P) (197); compute_IDS(z, num_terms, p_norm, bandwidth_term) (198-199)'
  - pyspi/data.py:108-118 Data.to_numpy returns the (P, T, 1) array
  - 'pyspi/lib/ids/dependence.py:9-31 compute_IDS: always dispatches to compute_IDS_numpy (upstream dependence.py prefers a torch backend when torch is
    importable; the vendored copy does not)'
  - pyspi/lib/ids/numpy_dependence.py:11-12 SEED = 1717; np.random.seed(SEED) at module import (global numpy RNG), inherited verbatim from upstream ids/numpy_dependence.py
  - 'pyspi/lib/ids/numpy_dependence.py:16-23 transform: exp(-B y^2) * y^i / sqrt(i!) for i in range(num_terms), concatenated on the last axis -> term-major
    (T, K*P)'
  - 'pyspi/lib/ids/numpy_dependence.py:25-26 center: subtract column means'
  - 'pyspi/lib/ids/numpy_dependence.py:60-64 compute_IDS_numpy: transform then center'
  - 'pyspi/lib/ids/numpy_dependence.py:76-78 Y is None branch: C = np.corrcoef(X_t.T) over all K*P columns; reshape(num_terms, dx, num_terms, dx)'
  - pyspi/lib/ids/numpy_dependence.py:80-84 nan_to_num(nan=0, posinf=0, neginf=0); abs; p_norm == "max" -> amax over axes (0, 2)
  - 'pyspi/lib/ids/numpy_dependence.py:85-92 p_norm 2 / 1: power means of the k^2 |rho| (not used by the default config); any other p_norm value falls through
    and returns the raw (K, P, K, P) array'
  - pyspi/lib/ids/numpy_dependence.py:29-57 and 94-97 permutation p-value path (p_val=False in pyspi, never executed)
  - '.venv/lib/python3.12/site-packages/numpy/lib/_function_base_impl.py:2896-2902 cov: X -= avg; c = dot(X, X_T.conj()) (symmetric product)'
  - '.venv/lib/python3.12/site-packages/numpy/lib/_function_base_impl.py:3029-3047 corrcoef: c = cov(x) (3029); c /= stddev[:, None]; c /= stddev[None,
    :] (3037-3038, division order gives last-bit asymmetry); clip to [-1, 1] (3043)'
  deviation_from_documented: '(a) GitBook says 0 indicates independence; in finite samples IDS-max is positively biased under independence: probe on iid_gaussian
    off-diagonal mean 0.235 / 0.113 / 0.065 / 0.032 at T = 64 / 256 / 1024 / 4096; from-scratch Monte Carlo null mean 2.06/sqrt(T) (0.258 at T=64, 95% quantile
    0.370), larger still for autocorrelated series. The [0, 1] range itself holds (abs of clipped correlations). (b) "finite-dimensional approximation of
    the universal kernels that can detect any type of dependence": with k = 6 truncated terms the statistic approximates, but is not, a universal-kernel
    HSIC; consistency against every alternative is not guaranteed (paper: "IDS_p is an approximation to a measure that is a statistically consistent estimate
    of independence"). (c) Parameters terms/pnorm/bandwidth and the bandwidth convention (coefficient of z^2, = paper B = 1) are undocumented; the identifier
    "ids" does not change with parameters. (d) Otherwise the code is the documented upstream implementation (verbatim copy of the numpy backend). Check
    stage: (b) is now shown by construction: a dependent law phi(x)phi(y)(1 + eps g(x)g(y)) with g orthogonal to 1 and to the six features has population
    IDS_p = 0 for every p while Corr(g(X), g(Y)) = 0.474; pyspi gives 0.0435 at T = 4096 (null mean 0.0324, q95 0.0477) (misc.ids|iid_gaussian|4096|pipeline|hidden-dependence).'
  deviation_from_canonical: '(1) Preprocessing: pyspi feeds z-scored data (mean 0, sd 1, ddof=1); the paper''s reported setting min-max scales to [0, 8]
    before IDS. Because the Gaussian damping is not scale/shift invariant, values differ materially: probe nonlinear_dependence T=4096 pair (0,1) 0.943
    (z-score) vs 0.485 (min-max [0,8]); pair (2,3) 0.993 vs 0.313; contaminated 0.949 vs 0.592. The paper explicitly allows other normalisations, so this
    is a variant choice, not a code error. (2) Kernel parametrisation: bandwidth_term multiplies y^2 (exp(-0.5 y^2) = Eq. 6 with B = 1); Eq. 6 B^m and sqrt(m!)
    scalings cancel in correlations, so the default matches the paper''s B = 1, k = 6, IDS_inf exactly (probe <= 4.4e-16). (3) No permutation p-value; the
    paper pairs IDS with permutation P-values for interpretation. (4) Application to autocorrelated time series violates the i.i.d.-sample assumption behind
    the null behaviour; IDS is zero-lag only (delayed_noise lag-1/3/5 copies score at the null level 0.03-0.05 at T=4096). (5) Constant features are mapped
    to 0 by nan_to_num (code convention; unreachable in pyspi because Data rejects NaN after z-scoring).'
  units_and_range: 'dimensionless, [0, 1], unsigned; symmetric up to last-bit rounding (check stage max |A - A^T| = 2.2e-16, not exactly 0); diagonal 1
    from the library (k = l), NaN after Calculator; cannot be NaN off the diagonal (nan_to_num). Positively biased under independence (~2.06/sqrt(T) for
    i.i.d. samples). Not an upper bound on or generalisation of |Pearson|: for a standard bivariate Gaussian the population value is 0.2641 at rho = 0.3
    and 0.7349 at rho = 0.8 (Gauss-Hermite quadrature probe; maximising pair (k, l) = (3, 3)); exact linear relations give 1 only after z-scoring makes
    the two series identical up to sign. Invariant to sign flips of either variable (odd/even features; probe diff 0.0) and, through z-scoring, to positive
    affine maps (scaled_offset reproduces bivariate_gaussian); not invariant to scale or shift at the kernel level (probe pair (0,1): 0.986 / 0.945 / 0.750
    at scale 0.3 / 1 / 3).'
  direction_convention: 'undirected: A[i, j] = A[j, i] = IDS-max(z_i, z_j) (same set of 36 term pairs in both orders); symmetry comes from np.corrcoef,
    not from base.py mirroring, and holds to 2.2e-16 (check stage).'
  symmetry_expected: sym
  already_documented: tests/regression/harness.py:96-98 for the import-time reseed only (tests/unit/test_ids_reference.py locks the feature/reduction construction
    against a small from-scratch reference; the test-harness docstring at tests/regression/harness.py:96-98 reads "Importing pyspi.statistics.misc calls np.random.seed(1717) as
    a side effect, which is why seed_all must run after this", the checked cov_prec_robust note (answer at audit/notes/cov_prec_robust.md:338-343, freshfull vs freshbasic runs) states that default-config reproducibility of the robust SPIs rests on the misc import reseed, and tests/README.md:113, :134-135 and :145-146 describe global-RNG stochastic SPIs and seed_all();
    KNOWN_ISSUES.md does not list the reseed, and no repository text states explicitly that a seed set before the first Calculator() is
    discarded for the global-RNG SPIs; REVIEW M1/M2 list mirror-bypassing classes with last-bit asymmetry but not IDS)
  new_finding_candidates:
  - 'Candidate (global RNG side effect, cross-family): pyspi/lib/ids/numpy_dependence.py:11-12 runs np.random.seed(1717) at import, and calculator.py:239
    imports .statistics.misc while constructing the Calculator. Probe: np.random.seed(123); Calculator(configfile=pyspi/config.yaml) -> np.random.get_state()
    equals the seed(1717) state (True); first draw after importing misc 0.3554744 = first draw of seed(1717). A user seed set before Calculator() is silently
    discarded on first construction in a process, and the global-RNG SPIs (sklearn MinCovDet/EllipticEnvelope with random_state=None, basic.py:39; tslearn
    sgddtw) then draw from a fixed stream; re-importing does not reseed, so the second Calculator in a process is not reset. Inherited from upstream (same
    lines in aradha ids/numpy_dependence.py).'
  - 'Candidate (null bias undocumented): GitBook "a score of 0 indicating independence" vs probe iid_gaussian off-diagonal mean 0.2354 (T=64), 0.1135 (256),
    0.0647 (1024), 0.0324 (4096), matching a from-scratch Monte Carlo null mean 2.06/sqrt(T); at T = 64 a pair of independent white-noise series scores
    about 0.26, comparable to a Gaussian pair with rho = 0.3 (population IDS 0.264).'
  - 'Candidate (preprocessing differs from the paper''s reported setting): pyspi z-scores (data.py:195) while the paper min-max scales to [0, 8] before
    IDS; probe values differ by up to 0.68 (nonlinear_dependence pair (2,3) 0.993 vs 0.313 at T=4096). Variant, not an error, but the GitBook does not say
    which normalisation pyspi uses.'
  - 'Candidate (last-bit asymmetry, low impact): misc.py:194-200 overrides Undirected.multivariate so no mirroring; np.corrcoef divides by stddev[:, None]
    then stddev[None, :] (_function_base_impl.py:3037-3038). Probe max |A - A^T| = 5.55e-17 (iid_gaussian T=64) up to 1.11e-16 (several datasets); same
    class as REVIEW M2 but IDS is not listed there.'
  - 'Candidate (unsupported p_norm returns a 4-D array): numpy_dependence.py:83-92 handles only "max", 1, 2; probe compute_IDS(X, p_norm=3) and p_norm="2"
    return shape (6, 4, 6, 4). Calculator.compute does not store it: for P != 6, fill_diagonal (calculator.py:332) raises ValueError; for P == 6, fill_diagonal
    accepts the (6, 6, 6, 6) array but self._table[spi] = S (calculator.py:335) raises AssertionError in pandas ("Shape of new values must be compatible
    with manager shape"). In both cases the except at calculator.py:336-337 sets the whole block to NaN, the MetricReport is marked failed (342-346) and
    a warning is emitted (355) (probe: Calculator with pnorm 3 or "2" gives an all-NaN ids block for P = 4 and P = 6). So the effect is a silent NaN block,
    not a stored 4-D result; the paper defines IDS_p for any p. Only reachable with a non-default config.'
