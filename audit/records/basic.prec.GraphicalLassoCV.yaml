  deviation_from_documented: '(1) Documented as ''equivalent to the partial correlation ... within [-1, 1]'': the code returns raw precision entries Theta_ij, whose sign is opposite to the partial correlation
    -Theta_ij/sqrt(Theta_ii Theta_jj) and whose magnitude is unbounded (probe: bivariate_gaussian T=256 prec[2,3] = -2.385 vs partial correlation +0.811; up to |Theta_ij| ~ 49 on shared_envelope and ~95
    for the CV variant on narrowband). (2) ''the matrix inverse of the covariance matrix'': it is the l1-penalised estimate, and it is not the exact inverse of the reported cov_GraphicalLassoCV (solver
    iterates, see candidates). (3) The supplement says the l1 penalty sparsifies the covariance; it sparsifies this precision matrix. (4) Documented scikit-learn v0.24.1, executed 1.9.1. (5) -sq variants
    undocumented. (6) ''five splits'' confirmed: KFold(5), unshuffled contiguous blocks.'
  deviation_from_canonical: 'Variant of Friedman et al. 2008: the diagonal is not penalised (sklearn docstring _graph_lasso.py:328-329; W_ii = S_ii exactly, probe), which matches Yuan & Lin 2007 / R glasso(penalize.diagonal=FALSE).
    S uses divisor T on ddof=1 z-scored data. Optimisation is approximate: default tol=1e-4 on the absolute dual gap, 100 sweeps, and the result is returned even without convergence; on ill-conditioned
    inputs the output can be measurably sub-optimal (candidate). CV rule is sklearn-specific (contiguous KFold, 10-iteration warm-started fold fits, ties to smaller alpha, alpha=0 never selectable). Reported
    value is Theta_ij, a precision entry, not a partial correlation.'
  units_and_range: dimensionless inverse-variance units on z-scored data; signed, unbounded (probe up to |Theta_ij| ~ 49 for GraphicalLasso, ~95 for CV, on rank-deficient inputs); sign opposite to the partial
    correlation; exact zeros from the l1 penalty; -sq >= 0 unbounded; exactly symmetric; diagonal NaN; whole matrix NaN when the solver raises FloatingPointError
  direction_convention: 'undirected: A[i,j] = A[j,i] (bit-exact in probes), i and j index processes in input row order; no lag; diagonal NaN'
  symmetry_expected: sym
  already_documented: REVIEW M1 (Estimators.multivariate overrides Undirected.multivariate, no mirroring; values are nevertheless exactly symmetric here). REVIEW M2 lists precision last-bit reciprocal asymmetry
    via pinvh; for the graphical-lasso precision the probe found exact symmetry (rows and columns written together), consistent with REVIEW's count of twelve (not sixteen) precision variants with residuals.
    Otherwise no.
  new_finding_candidates:
  - 'CANDIDATE (silent non-convergence): pyspi suppresses every warning around the fit (basic.py:37-38), so sklearn''s ConvergenceWarning (_graph_lasso.py:196-201) never reaches the user. Probe over the
    76 audit dataset files (default pipeline preprocessing): 22 GraphicalLassoCV final refits (plus 3 FloatingPointError) emitted ConvergenceWarning: all narrowband files except narrowband_f0-0.1 T=64 (which
    raised; gap up to 0.33), shared_envelope T=64/4096, cointegrated T=256/1024, trending T=256/1024/4096, logistic_maps and logistic_maps_bidir T=1024, var2_bivariate T=64/256. Against a tight refit (tol=1e-10,
    enet_tol=1e-12) the default-tolerance precision differs by up to 0.27 absolute (shared_envelope T=256, rel 5.4e-3) and covariance by up to 1.3e-4 (8.7e-4 in the var2_bivariate T=4096 stall).'
  - 'CANDIDATE (cov/prec mutual consistency): covariance_ and precision_ are the solver''s running iterates (_graph_lasso.py:169-177, 206), not exact inverses of each other. Probe max|inv(covariance_) -
    precision_|: 5.9e-6 to 2.6e-4 on sparse_precision/bivariate_gaussian over T=64/256/1024/4096 (GraphicalLasso 9.5e-6 to 2.4e-4, GraphicalLassoCV 5.9e-6 to 2.6e-4; largest at bivariate_gaussian T=4096),
    0.41 on shared_envelope T=1024, 0.51 for GraphicalLassoCV on narrowband_f0-0.25 T=4096. So cov_GraphicalLassoCV and prec_GraphicalLassoCV are not exactly inverse pairs. This refutes the briefing wording
    ''covariance from its inverse'': both come from the solver.'
  - 'CANDIDATE (side effect, value-neutral for these SPIs): multivariate() returns the cached estimator''s own array and np.fill_diagonal(matrix, np.nan) (basic.py:49-50) overwrites the diagonal of data.covariance[estimator].covariance_
    / .precision_ in place. Probe: after Precision(...).multivariate(d), np.diag(d.covariance[''GraphicalLassoCV''].precision_) is all NaN and the returned array ''is'' the cached array. Anything that later
    reads the cached estimator (e.g. its diagonal, score(), mahalanobis()) sees NaNs.'
  - 'CANDIDATE (failure -> NaN, repeated refits): a FloatingPointError from the solver propagates out of _from_cache (not cached), Calculator.compute turns it into an all-NaN entry (calculator.py:336-339 at HEAD a1f20c7),
    and each of the four identifiers sharing the estimator refits and fails again. Probe: GraphicalLassoCV raises in the final refit (_graph_lasso.py:1120 -> :193) on shared_envelope T=256 and T=1024 and
    narrowband_f0-0.1 T=64; detrend=True does not fix shared_envelope T=256.'
  - 'CANDIDATE (scale): pyspi z-scores with ddof=1 (data.py:195) but sklearn''s empirical_covariance divides by T (np.cov bias=1, _empirical_covariance.py:107), so S_ii = (T-1)/T (probe: diag 0.984375 at
    T=64, 0.99902 at T=1024). The documented ''correlation and covariance matrices are equivalent'' holds only up to the factor (T-1)/T, and alpha acts on this scale.'
  - 'CANDIDATE (CV behaviour): selected alpha_ spans 8 orders of magnitude across the audit data (probe: 1.3e-8 on delayed_noise T=256, 7.3e-8 on gauss_ar1_pair T=256, 0.207 = alpha_max on iid_gaussian
    T=64), because the grid extends downward by 0.01x per round when the smallest alpha wins (_graph_lasso.py:1074-1076); CV mean scores are very flat near the optimum (sparse_precision T=1024: -6.52445
    to -6.52465 over alpha 0.0070-0.0126). At alpha_ >= alpha_max all off-diagonals are 0 (iid_gaussian T=64: 20/20 zeros), giving a constant SPI matrix; entries that should be 0 can be ~3.5e-18 roundoff
    (iid_gaussian T=4096), squared to ~1e-35 in -sq.'
  - 'CANDIDATE (CV protocol details): KFold is unshuffled (contiguous blocks; autocorrelated neighbours sit only at block edges), training-fold fits use max_iter=int(0.1*100)=10 with ConvergenceWarning
    suppressed (_graph_lasso.py:1015-1033), the test log-likelihood centres the test fold on its own mean (graphical_lasso_path :677 empirical_covariance(X_test)), and alpha=0 is scored but not selectable
    (:1095-1116). These are sklearn design choices, documented only as ''five splits''.'
  - 'CANDIDATE (alpha relative to GraphicalLasso): on well-behaved Gaussian data CV alpha_ is close to the fixed 0.01 (sparse_precision T=64: 0.00974, T=1024: 0.00848; bivariate_gaussian T=256: 0.0129),
    so the CV and fixed variants are nearly redundant there; they diverge strongly on rank-deficient data (narrowband: alpha_ ~1e-5..5e-4, |prec| up to 95 vs 14.5).'
