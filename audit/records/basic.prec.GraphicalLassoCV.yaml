unit_id: basic.prec.GraphicalLassoCV
status: profiled
correctness:
  metric_name_standard: graphical-lasso sparse precision (inverse covariance) estimate Theta_hat, raw off-diagonal entries (not partial correlations); alpha chosen by 5-fold CV; prec-sq is its square
  canonical_ref: 'Friedman J, Hastie T, Tibshirani R 2008, ''Sparse inverse covariance estimation with the graphical lasso'', Biostatistics 9(3):432-441, eq. (1)/(2.1) (diagonal penalised); off-diagonal-only
    penalty: Yuan M, Lin Y 2007, ''Model selection and estimation in the Gaussian graphical model'', Biometrika 94(1):19-35, eq. (4); Banerjee O, El Ghaoui L, d''Aspremont A 2008, JMLR 9:485-516 CV variant:
    alpha chosen by K-fold cross-validated Gaussian log-likelihood (e.g. Friedman et al. 2008 §4; sklearn GraphicalLassoCV, iteratively refined log grid); there is no single canonical CV rule.'
  canonical_definition: 'Theta_hat = argmin_{Theta > 0} -log det Theta + tr(S Theta) + alpha * sum_{i != j} |Theta_ij| (Friedman 2008 sums over all i,j incl. the diagonal; Yuan & Lin 2007 penalise off-diagonals
    only); Sigma_hat = W = Theta_hat^{-1}; KKT: W_ii = S_ii (+alpha if diagonal penalised), W_ij = S_ij + alpha*sign(Theta_ij) if Theta_ij != 0, |W_ij - S_ij| <= alpha otherwise; partial correlation rho_ij|rest
    = -Theta_ij / sqrt(Theta_ii Theta_jj)'
  documented_definition: 'supplement §1.1.2, p.4: ''The precision matrix is the matrix inverse of the covariance matrix ... For normalized time-series data, the precision matrix is equivalent to the partial
    correlation between each pairwise time series, conditioned on all other time series, and is within [-1, 1]. The precision matrix is computed via the same module as the covariance matrix (in scikit-learn
    [2]), and has the same estimators.'' Estimator described in §1.1.1, p.3-4 (''Lasso technique, which uses an l1-regularization to sparsify the covariance matrix''; CV variant ''with five splits''); keywords
    ''undirected, linear, signed, multivariate, contemporaneous''. GitBook basic-statistics.md (Precision) same text. The -sq identifiers are not described in the supplement. Identifiers: prec_GraphicalLassoCV,
    prec-sq_GraphicalLassoCV.'
  delegate_lib: scikit-learn==1.9.1 sklearn.covariance.GraphicalLassoCV().fit (solver sklearn.covariance._graph_lasso._graphical_lasso, inner sklearn.linear_model._cd_fast.enet_coordinate_descent_gram);
    numpy==2.5.4, scipy==1.17.1 (zscore, pinvh)
  implemented_as: 'Each channel z-scored (ddof=1, optional detrend); X = (T, P) array; sklearn.GraphicalLassoCV() with library defaults: S = biased empirical covariance (divide by T, so S_ii=(T-1)/T); alpha
    selected by 5-fold contiguous KFold CV on Gaussian test log-likelihood over 16 alphas from 4 refinement rounds of a 4-point log grid starting at [0.01, 1]*max|S_offdiag|, training-fold fits capped at
    10 iterations and warm-started; then a full-data fit at alpha_ (max_iter 100). Solver: sklearn block coordinate descent (Friedman 2008 glasso algorithm) with off-diagonal-only l1 penalty, start 0.95*S
    off-diagonal, stop when |dual gap| < 1e-4 or after 100 sweeps (warning silenced). Returns precision_ (the solver''s Theta iterate, not inv(covariance_)) with diagonal set to NaN; -sq returns the elementwise
    square. Fit shared through data.covariance[''GraphicalLassoCV''] by cov, cov-sq, prec, prec-sq; exactly symmetric because rows/columns are written together.'
