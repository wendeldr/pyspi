  deviation_from_documented: '(a) Frequency grid: documented 125 bins over [4/T, fs/2]; implemented 125 bins over [0.2, 0.5] for every T (wavelet.py:54), so the ''low'' band [0, 0.25] contains only 21 bins
    in [0.2, 0.248] and frequencies below 0.2 are never analysed; the mne fmin argument is 5/T, not 4/T (it only masks cwt freqs when T < 25). (b) No time-frequency decomposition: n_cycles = f/7 makes every
    Morlet wavelet one sample long (W = sqrt(2)), so X(f,t) = sqrt(2) x(t) at all 125 frequencies; the band choice changes nothing except which round-off pattern is averaged. (c) Aggregation runs over frequency
    AND time (axis=(2,3)) of per-(f,t) single-epoch values; the documentation for the multitaper versions describes a summary over frequency only. (d) Not in the documented SPI set at all (extra classes).
    (e) No delay information survives: phases lie within 5e-14 of 0 or +-pi (sign of the lag-0 product; sign of pi from round-off, +pi at every exact-zero imaginary part); the documented use ''to infer
    a time-delayed dependence'' is impossible (probe narrowband_f0-0.25, true shift pi/4 between x0 and x1: A[0,1] = 0.237, and -0.185 after reversing the channel order).'
  deviation_from_canonical: 'Canonical: arg of the averaged cross-spectrum per frequency (antisymmetric, circular). Implemented: arithmetic mean (or max) of principal angles of per-(f,t) single-epoch, single-sample
    cross-products over frequency and time, which with the 1-sample wavelet is pi*(n_{+pi} - n_{-pi})/N; the split between +pi and -pi depends on floating-point round-off of the FFT convolution, so the
    value is not a function of the data to round-off precision (re-z-scoring an already z-scored input, sample changes <= 4.4e-16, moves narrowband_f0-0.25 T=256 A[0,1] from 0.2372 to 0.2682 and delayed_noise
    T=256 A[0,1] from 0.1367 to -0.0383). Under channel reversal the points with a nonzero imaginary part negate, but the exact-zero imaginary parts are +0.0 in both orders (zero-initialised accumulator,
    epochs_bivariate.py:64, :68), so their negative-real points stay at +pi: A_rev = -A + 2 pi n(Im csd == 0 and Re csd < 0)/N (probe: narrowband_f0-0.25 T=256 0.2372 + (-0.1852) = 0.05203 = 2 pi 265/32000;
    delayed_noise T=256 0.1367 + (-0.0736) = 0.06303 = 2 pi 321/32000; agreement within 3e-16). Arithmetic mean of angles is not a circular mean (same aggregation issue as M4 for the multitaper version).
    Forced symmetric by the mirror although canonical phase is antisymmetric.'
  units_and_range: 'Radians, signed, in [-pi, pi]; ''max'' variant pi or 1 ulp below pi for every non-identical pair probed (about 1e-31 for a bit-identical pair; near 0 only if no negative lag-0 product);
    the mean variant is fixed by the FFT round-off pattern and is not stable to input changes at round-off level (re-z-scoring an already z-scored input, sample changes <= 4.4e-16: narrowband_f0-0.25 T=256
    A[0,1] 0.2372 -> 0.2682 and reversed-order value -0.1852 -> -0.2109; delayed_noise T=256 0.1367 -> -0.0383), so the snapshot value depends on the FFT implementation (a numpy.fft replay gives a different
    exact-zero pattern); between scipy.fft 1.17.1 (project venv, pyspi) and 1.18.1 (comparison venv, rep replay) no difference was observed on this machine (rep runs bitwise), while other CPUs and SIMD
    paths are untested; class labels say ''unsigned'' (wavelet.py:112) though the quantity is signed; symmetric by mirror; diagonal NaN.'
  direction_convention: 'A[i,j] = A[j,i] = statistic of angle(conn[max(i,j), min(i,j)]) with conn from csd = X_hi conj(X_lo) (epochs.py:652, tril indices epochs.py:276; mirror wavelet.py:87-88). Canonical
    sign: positive arg(S_hi,lo) would mean a phase lead of the higher-index channel under MNE''s convolution convention (unverified; with the 1-sample wavelet no lead/lag is encoded). Empirical confirmation
    is a check-stage task.'
  symmetry_expected: sym
  already_documented: 'tests/README.md ''Degenerate outputs in the extra wavelet set'' (tests/README.md:217: ''Only phase, pli and wspli vary with the input and the band'') - documented as non-degenerate
    there; REVIEW M4 (arithmetic mean of principal angles) for the multitaper phase, which applies to the same aggregation choice here; M4 (docs/storage_comparison/REVIEW.md:155-157) also documents that an unsigned label is inappropriate for coherence phase and that +pi at the branch cut represents both directions, producing an apparent antisymmetry offset.'
  new_finding_candidates:
  - 'CANDIDATE (contradicts tests/README''s ''non-trivial values''): the varying values are a round-off artefact. With the 1-sample wavelet (see wavelet.morlet_cwt) coherency = sign(x_hi x_lo) + i*eps,
    so every angle lies within 4.6e-14 of 0 or +-pi, though most are not exactly equal to them (probe iid T=256 pair (1,0): 20743 of 32000 angles are none of 0, +pi, -pi), and mean = pi*(frac(near +pi)
    - frac(near -pi)) up to round-off (probe: 0.23895739121367354 vs 0.23895739121367365). Which negative-product points get +pi and which get -pi is decided by the sign of the FFT round-off in the imaginary
    part; exact-zero imaginary parts always give +pi because of the +0.0 accumulator (epochs_bivariate.py:64, :68). The value is not stable to input changes at round-off level: re-z-scoring an already z-scored
    input moves narrowband_f0-0.25 T=256 A[0,1] from 0.2372 to 0.2682 and delayed_noise T=256 from 0.1367 to -0.0383 (probe wl_fix/fx1.py; reviewer probe fable_wl/wav3.py).'
  - 'CANDIDATE: phase_wavelet_max_* is pi, or 1 ulp below pi, for every non-identical pair (sweep over the 19 datasets: exactly pi for 83 of 85 pairs at T=64 and 84 of 85 at T=1024; anm T=64 gives 3.14159265358979
    = pi - 1 ulp); for the bit-identical pair shared_envelope (0,2) it is about 1e-31 (1.0e-31 at T=64, 2.0e-31 at T=1024), not exactly 0.'
  - 'CANDIDATE: channel-order dependence not explained by antisymmetry: narrowband_f0-0.25 T=256 A[0,1] 0.2372 in the given order vs -0.1852 after reversing; delayed_noise 0.1367 vs -0.0736 (probe p6_order.py).
    Mechanism: the mne coherency accumulator is zero-initialised and summed (epochs_bivariate.py:64, :68), and (+0.0) + (-0.0) = +0.0, so every exact-zero imaginary part is stored as +0.0 in both channel
    orders. Points with a nonzero imaginary part negate under reversal, while exact-zero-imaginary points with negative real part stay at +pi. Hence A_rev = -A + 2 pi n(Im csd == 0 and Re csd < 0)/N: 0.2372
    + (-0.1852) = 0.05203 = 2 pi 265/32000 and 0.1367 + (-0.0736) = 0.06303 = 2 pi 321/32000, agreeing within 3e-16 (reviewer probe fable_wl/wav2.py, rerun).'
  - 'CANDIDATE (minor): class label ''unsigned'' (wavelet.py:112) for a signed angle.'
