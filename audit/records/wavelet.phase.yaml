unit_id: wavelet.phase
status: profiled
correctness:
  metric_name_standard: coherency phase (phase of the complex coherency) from Morlet-wavelet cross-spectra, summarised by mean/max over band and time
  canonical_ref: 'Nolte et al. 2004, Clin Neurophysiol 115:2292 (coherency C_ij = S_ij/sqrt(S_ii S_jj), phase = arg C_ij); Bastos & Schoffelen 2016, Front Syst Neurosci 9:175 (supplement ref [59]); time-frequency
    version: Lachaux et al. 2002, Neurophysiol Clin 32:157. For a pure delay d the coherency phase is linear in f (phase = -2 pi f d up to sign convention).'
  canonical_definition: 'phi_xy(f) = arg(<W_x(f,t) W_y*(f,t)>) with <.> over trials or a time window; antisymmetric: phi_yx = -phi_xy; circular quantity (a summary over frequencies needs a circular mean
    or a slope, cf. group delay).'
  documented_definition: 'Not documented as such: the nine wavelet classes are absent from pyspi/config.yaml (tests/README.md:155 ''run today but are absent from pyspi/config.yaml''), from the supplement
    SPI list and from the GitBook page. Supplement §1.5.4, p.14 (supplement.txt heading line 644) states the opposite: PSI ''is the only spectral measure that is computed in the time-frequency domain (denoted by
    modifier wavelet)''; same on GitBook spectral.md:330. The closest documented text is the multitaper version: supplement §1.5.2, p.13 (supplement.txt heading line 616) / GitBook spectral.md:49-60: ''By omitting
    the magnitude operator of the coherence ... we obtain the complex-valued coherency, where the phase-difference angle (which we refer to as the coherence phase) has been used to infer a time-delayed
    dependence between two signals ... two summary statistics and three frequency ranges''. Shared band rule, supplement §1.5 preamble, p.13 (supplement.txt heading line 570, text lines 589-599; GitBook spectral.md:14-20):
    ''We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T ... the mean (mean) and the maximum (max) values of each measure over three ranges ... fmin-0_fmax-0-5
    ... [0, fs/2]; fmin-0_fmax-0-25 ... [0, fs/4]; fmin-0-25_fmax-0-5 ... [fs/4, fs/2]''.'
  delegate_lib: mne-connectivity==0.9.0 mne_connectivity.spectral_connectivity_epochs(mode='cwt_morlet', method='cohy') -> mne==1.13.2 mne.time_frequency.tfr.morlet + cwt (scipy 1.17.1 scipy.fft, numpy
    2.5.4); band mask, mean/max over (freq, time), lower->upper mirror and NaN diagonal are native pyspi (pyspi/statistics/wavelet.py)
  implemented_as: 'Input z-scored per channel (ddof=1, Data default; optional detrend first). pyspi hands mne-connectivity ONE epoch (z = moveaxis(data (P,T,1), 2, 0) -> (1,P,T)) with cwt_freqs = linspace(0.2,
    0.5, 125) and cwt_n_cycles = cwt_freqs/7 (0.029..0.071 cycles). mne.morlet sets sigma_t = n_cycles/(2 pi f) = 1/(14 pi) = 0.0227 samples for every f, so the time grid arange(0, 5 sigma_t, 1) = [0] and
    every wavelet is the single sample W = sqrt(2)+0j (probe: 125 wavelets, length 1, value 1.41421356). The ''CWT'' is X(f,t) = sqrt(2) x(t) for all 125 f up to FFT round-off (probe: max|Re X - sqrt2 x|
    2.7e-15, max|Im X| 7.2e-16, ~2-5% of Im exactly 0). csd(f,t) = X_hi(f,t) conj(X_lo(f,t)) = 2 x_hi(t) x_lo(t) + i*roundoff (hi = higher channel index, lower-triangular connections), psd = |X|^2 = 2 x^2.
    n_epochs = 1, so every across-epoch average in the estimator is a single term. pyspi then keeps the frequencies with fmin <= f <= fmax on the 0.2..0.5 grid (21 bins for fmin-0_fmax-0-25: 0.2..0.2476;
    104 for fmin-0-25_fmax-0-5; all 125 for 0..0.5), applies np.nanmean or np.nanmax over (freq, time) jointly, mirrors the lower triangle to the upper, sets the diagonal NaN. Estimator cohy (epochs_bivariate.py:60-68
    accumulate, :84-94 compute_con): the csd accumulator is np.zeros (+0.0) and csd is added to it (:64, :68), so an exact-zero imaginary part is stored as +0.0 whatever its sign (IEEE (+0.0) + (-0.0) =
    +0.0; probe narrowband_f0-0.25 T=256 pair (1,0): the raw csd has 515 exact-zero imaginary parts, 265 of them -0.0; the mne cohy tensor has the same 515 exact zeros and none is -0.0). The coherency is
    csd/sqrt(psd psd) = sign(x_hi x_lo) + i*eps. pyspi applies np.angle before the statistic (wavelet.py:119-120 modify_stats): angle = atan2(eps, Re), which lies within round-off (4.6e-14 at T=256, up
    to 2.41e-12 at T=1024, check stage) of 0 where x_hi x_lo > 0 and within 4.6e-14 of +pi or -pi where x_hi x_lo < 0. The sign of pi is set by the sign of the FFT round-off imaginary part, and every exact-zero
    imaginary part with negative real part gives +pi because of the +0.0 accumulator. The angles are only approximately in {0, +pi, -pi} (probe iid T=256 pair (1,0), 32000 (f,t) points: exactly 0: 416,
    exactly +pi: 6169, exactly -pi: 4672, none of the three: 20743; near -pi 6533, near 0 16500, near +pi 8967). mean = pi (n_{+pi} - n_{-pi}) / N up to round-off, counting angles near +-pi (probe: mean
    0.23895739121367354 vs pi*(frac(+pi) - frac(-pi)) = 0.23895739121367365, difference -1.1e-16). max = pi or 1 ulp below pi whenever at least one near-+pi point exists (sweep over the 19 datasets: exactly
    pi for 83 of 85 pairs at T=64 and 84 of 85 at T=1024; anm T=64 gives 3.14159265358979 = pi - 1 ulp), and about 1e-31, not exactly 0, for the bit-identical pair shared_envelope (0,2) (1.0e-31 at T=64,
    2.0e-31 at T=1024). The value depends on the round-off pattern, not only on the data: re-z-scoring an already z-scored input (sample changes <= 4.4e-16) moves A[0,1] from 0.2372 to 0.2682 on narrowband_f0-0.25
    T=256 and from 0.1367 to -0.0383 on delayed_noise T=256 (probe wl_fix/fx1.py).'
