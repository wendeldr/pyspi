  complexity_P_T: 'O(P F T log T) Morlet CWT (mne/time_frequency/tfr.py:cwt, F = 125) + O(P^2/2 F T) per-connection _CohyEst.accumulate/compute_con (mne_connectivity/spectral/epochs_bivariate.py)
    + O(P^2 F T) dense (P, P, 125, T) output and pyspi''s nan-statistic over (freq, time) (pyspi/statistics/wavelet.py:mne._get_cache / multivariate). The P^2 F T terms dominate at 118x1024,
    where the dense complex tensor alone is 28.5 GB. summary.json gives P_exponent 3.72 fresh / 3.47 family-warm (8 -> 32) and T_exponent 0.86 / 1.00, from 32x1024 walls of 56.31 s fresh
    / 85.76 s family-warm (all nine fresh units and the family-warm pass ran in one subprocess per (family, shape) at P <= 32, profile_units.py:136 and 1060-1063, a probable but unconfirmed
    cause; repeats 1-3, peak RSS 5685 MB fresh). Those 32x1024 walls do not reproduce: isolated re-times of the representative identifier at 32x1024 gave 32.24 s (this stage) and 35.06
    s (reviewer) (audit/profiles/micro/prof_wavelet__index.json), 1.6-1.7x lower, while the 8x1024 walls the reviewer re-timed (cohmag 0.27 s vs 0.21 s, pli 0.168 s vs 0.163 s) roughly
    reproduce. With the re-times the 8 -> 32 exponent is about 3.32-3.38. Still above P^2: at 32x1024 the time sits in mne''s _CohyEst.compute_con (46.5% self) and in pyspi''s np.angle
    + nanmean over the complex (P, P, 125, T) tensor (39.6%), all elementwise passes over arrays of 1-2 GB; attributing the excess to memory effects is an inference. The fresh 8x1024
    wall_cv 0.31 comes from two slow first passes (walls_s 0.624 s and 0.542 s, then 0.322-0.323 s); wall_s is the minimum over passes
    (0.322 s, profile_units.py:69-71), so the cv does not enter the summary.json exponent, which is log4(56.31/0.322) = 3.72 and is set by the non-reproducing
    32x1024 fresh wall. The summary.json 118x1024 projections (7265 s fresh / 7988 s family-warm, extrapolated-power-from-32, 118 skipped-budget)
    are therefore inflated and should not be used; scaling the re-timed 32x1024 wall by (118/32)^2 to (118/32)^3.38 gives about 440-2900 s per identifier build (order of magnitude only,
    not measured). A 118x1024 run would probably not fit in 31 GB (the dense tensor plus mne''s per-connection complex accumulators of about 14 GB; inference from array sizes, not run).'
