optimisation:
  complexity_P_T: 'Per band: O(K*P*T log T) FFT + O(K*n_fft*P^2) taper-level CSM + per unordered pair (P(P-1)/2) a Python callback: scipy.ndimage.label cluster search and a masked scipy.stats.mstats.linregress over the band bins (O(P^2 * m) work with a large per-pair constant). Measured P exponent 1.44 (fit 8->32), 2.26 between 32x1024 and 118x1024, T exponent 0.45 (the per-pair Python overhead does not grow with T); in the cProfile run at 118x1024 the per-pair callbacks (41.3% + 25.7%) exceed the CSM (coherency 18.7%), but cProfile inflates those callbacks: un-profiled they took 1.32-1.55 s per band, 22-29% of the pyspi gd bands of the Workflow 4c paired run, while the Multitaper plus coherency is about 53% of the ranking basis (11.06 -> 5.25 s per window when the 3 bands read one shared coherency; spectral_csm-shared-csm speedup_basis), so without the profiler the coherency is the larger part.'
  hotspot_1: .venv/lib/python3.12/site-packages/numpy/ma/extras.py:apply_along_axis -> scipy/stats/_mstats_basic.py:linregress (called from spectral_connectivity connectivity.py:960-967, 6903 calls) 41.3% of the profiled SPI call at 118x1024; linregress itself is 27.0%, the rest masked-array bookkeeping. These are cProfile shares, which inflate the per-pair callbacks (2.76 s of the 4.12 s profiled band against 1.32-1.55 s per band un-profiled, see spectral_psi_gd-1 speedup_basis). hotspot_owner names the call-site owner (spectral_connectivity), where the replacement lands; the time itself is in third-party:numpy and third-party:scipy frames
  hotspot_2: '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_find_significant_frequencies 33.4% at 118x1024, of which np.apply_along_axis of _find_largest_independent_group (scipy.ndimage.label per pair) 25.7%; coherency 18.7% (cProfile shares, which inflate the per-pair callbacks and understate the coherency; un-profiled, the Multitaper plus coherency is about 53% of the ranking basis, see spectral_csm-shared-csm speedup_basis) | opaque_share is the 8x1024 profile-JSON value (audit/profiles/spectral.gd__8x1024__profile.json, builtin tottime over the whole profile); the 118x1024 pstats named in profile_file gives a builtin tottime share of 0.318 of the compute_spi frame (audit/profiles/micro/prof_spectral__index.json). Both are lower bounds: numpy ufunc work sits in the self time of the calling Python frame.'
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.204
  profile_file: audit/profiles/micro/prof_spectral.gd__118x1024.pstats
  basis_scope_note: 'The cache key includes the band (pyspi/statistics/spectral.py:46-50), so each of the 10 EEG bands pays its own build; none of them was timed and the 3 timed configured bands (3.50-3.97 s each at
    118x1024, family-warm) are all outside the EEG selection, so the configured basis understates the EEG cost, about 10/3 of it if the EEG bands cost like the timed ones (not timed)'
  opportunities:
  - opportunity_id: spectral_psi_gd-1
    opportunity: 'Replace gd''s per-pair Python callbacks by array code: vectorised masked least squares (slope and r over the significant independent bins of all P(P-1)/2 pairs at once) instead of numpy.ma.apply_along_axis + scipy.stats.mstats.linregress (connectivity.py:960-967), and a vectorised largest-cluster / independent-step / min-group search instead of np.apply_along_axis of _find_largest_independent_group with scipy.ndimage.label (connectivity.py:1360-1430, 1476-1481). The NaN pattern (min_group_size 3, empty masks) must be kept.'
    opp_type: vectorise-batch
    expected_speedup: '1.3-1.6x'
    speedup_basis: 'profile:audit/profiles/micro/opp_spectral_csm-shared-csm.json (key paired; quoted as a profile basis and not tagged microbench, because it times no candidate of this avenue (README ''Optimisation columns'', profiles/micro file kinds): the per-pair callback drivers np.ma.apply_along_axis -> linregress and np.apply_along_axis -> _find_largest_independent_group timed inside the pyspi gd calls by wrapping the two numpy entry points, no profiler; a timing of the frames this avenue replaces, not a candidate) + profile:audit/profiles/micro/prof_spectral.gd__118x1024.pstats ma.apply_along_axis(linregress) 41.3% + apply_along_axis(group search) 25.7%. The profile overstates the callbacks: under cProfile they took 2.76 s of the 4.12 s band, while the un-profiled drivers took 1.32-1.55 s per band (1.54, 1.33 and 1.34 s for the 3 config bands, the same in all 3 repeats and in the shared-coherency candidate) at 118x1024, 22-29% of the pyspi gd bands of that run (4.6-6.6 s per band; Amdahl 1.28-1.41x). On the ranking basis (family-warm increments 3.97, 3.50 and 3.59 s, 11.06 s per window) the callbacks are 4.22 s, 38%, Amdahl ceiling 1.62x if the vectorised code cost nothing; the 1.3x lower bound leaves up to about 0.55 s per band (1.67 s per window) for the vectorised masked least squares and group search. The share depends on the memory state, because the callbacks are compute-bound while the coherency is memory-bound: under memory contention (a Workflow 4c cProfile re-run while other agents ran: coherency 60.6%, callbacks 32.5%) the ceiling falls toward 1.3-1.5x. The 118x1024 synthetic data give an all-NaN gd output in every band and the 32x1024 data in one of the three config bands (fmin-0_fmax-0-25; key paired, diffs.*.all_nan, empty significance masks); at 8x1024, where the output is not all-NaN, a pair''s callbacks cost 0.27 ms against 0.20-0.21 ms at 32x1024 and 118x1024, so EEG data with significant clusters may raise the callback share by about that factor. On the residual after spectral_csm-shared-csm (5.16-5.25 s per window, of which callbacks 4.22 s) this avenue''s ceiling is about 5x; it is recorded independent_of that avenue (disjoint frames: the same seconds come off a smaller residual), so residual_speedup gives its figure there (README ''Optimisation columns'', rule 4): the 1.3x lower bound''s 2.55 s per window (11.06 x (1 - 1/1.3)) taken off the 5.53 s residual the ranking stacks on (11.06 / 2x) is 1.86x, rounded down to 1.8x; the 1.6x upper end''s 4.15 s per window gives about 4x'
    output_risk: unverified-within-tolerance
    risk_evidence: 'closed-form masked OLS re-orders the sums of linregress; the significance mask and NaN pattern (min_group_size 3, empty masks) must be reproduced exactly. A diff should use data where gd''s output is not all-NaN (8x1024 or the 7x100 golden set): at 118x1024 the synthetic output is all-NaN and only NaN masks could be compared'
    effort: M
    depends_on: []
    independent_of:
    - spectral_csm-shared-csm
    residual_speedup: '1.8-4x'
  - opportunity_id: spectral_csm-shared-csm
    opportunity: Compute the multitaper Fourier coefficients once per Data and memoise the taper-averaged CSM, power and coherency on the Data under a key without measure or band (pyspi/statistics/spectral.py:46-50, 64-83; this also removes the first-insert string key at :81 that makes the first spectral SPI on a Data compute twice). Every undirected measure, every psi/gd band, the 2x2 blocks of the bivariate directed path and the sgc nonparametric pair loop read from it; the phase-sync measures take their per-taper products from the shared coefficients.
    opp_type: cache-sharing
    expected_speedup: '2-3.6x'
    speedup_basis: 'microbench:audit/profiles/micro/opp_spectral_csm-shared-csm.json key paired at 118x1024 (Workflow 4c, 3 repeats, same run): gd''s 3 config bands through pyspi on one fresh Data (18.5, 19.2 and 14.4 s) against the 3 gd segments reading one shared coherency (5.16, 5.25 and 5.17 s), 2.8-3.7x as a later consumer; gd is one in an EEG run (GroupDelay at pyspi/workflow/retained185.yaml:518, after CoherencePhase at :218), so the shared build is credited on spectral.phase. The gd segments are stable across repeats and match the ''shapes'' run''s 1.55-2.04 s per band, so against the ranking basis (family-warm increments 3.97, 3.50 and 3.59 s, 11.06 s per window) the figure is 11.06/5.25 = 2.1x, the 2x lower bound rounded down; 3.6x is the same-run upper end. The earlier ~1.2x came from the coherency share of the cProfile run (prof_spectral.gd__118x1024.pstats, coherency 18.7%), which cProfile deflates by inflating the per-pair Python callbacks (2.76 s profiled against 1.32-1.55 s un-profiled per band). Independent of spectral_psi_gd-1 (independent_of): that avenue removes the per-pair callbacks and this one the Multitaper and coherency, disjoint frames. With the larger lower bound this avenue is now stacked first; spectral_psi_gd-1 keeps its own 1.3x on the residual'
    output_risk: bit-identical
    risk_evidence: 'audit/profiles/micro/opp_spectral_csm-shared-csm.json: cohmag, phase, psi x3, gd x3 bit-identical with equal NaN masks at 32x1024 and 118x1024 (same library methods fed one memoised coherency); the paired run repeats it for gd x3 at 8x1024, where the output is not all-NaN, as well as at 32x1024 (where the fmin-0_fmax-0-5 and fmin-0-25_fmax-0-5 bands are not all-NaN and fmin-0_fmax-0-25 is) and 118x1024 (all-NaN in every band); key paired, diffs.*.all_nan'
    effort: M
    depends_on: []
    independent_of:
