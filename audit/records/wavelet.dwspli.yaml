    -> _WPLIDebiasedEst'
  deviation_from_documented: '(a) Frequency grid: documented 125 bins over [4/T, fs/2]; implemented 125 bins over [0.2, 0.5] for every T (wavelet.py:54), so the ''low'' band [0, 0.25] contains only 21 bins
    in [0.2, 0.248] and frequencies below 0.2 are never analysed; the mne fmin argument is 5/T, not 4/T (it only masks cwt freqs when T < 25). (b) No time-frequency decomposition: n_cycles = f/7 makes every
    Morlet wavelet one sample long (W = sqrt(2)), so X(f,t) = sqrt(2) x(t) at all 125 frequencies; the band choice changes nothing except which round-off pattern is averaged. (c) Aggregation runs over frequency
    AND time (axis=(2,3)) of per-(f,t) single-epoch values; the documentation for the multitaper versions describes a summary over frequency only. (d) Not in the documented SPI set at all (extra classes).
    (e) Output constant 0 (zero-denominator guard), on any input. (f) Identifier ''dwspli'' vs documented multitaper identifier ''dswpli''.'
  deviation_from_canonical: Undefined for one trial (0/0); the library's guard maps it to 0, so the SPI is identically 0 regardless of the data (degenerate). A legitimate 0 (no lagged coupling) and 'undefined'
    are indistinguishable.
  units_and_range: Nominally about [-1, 1] (negative legitimate for N >= 2, REVIEW M7); implemented exactly 0.0; symmetric; diagonal NaN.
  direction_convention: Undirected; A[i,j] = A[j,i] from conn[max(i,j), min(i,j)] (mne_connectivity/spectral/epochs.py:276, :652; wavelet.py:87-88).
