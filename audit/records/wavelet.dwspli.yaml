optimisation:
  complexity_P_T: 'O(P F T log T) Morlet CWT (mne/time_frequency/tfr.py:cwt, F = 125) + O(P^2/2 F T) per-connection _WPLIDebiasedEst.accumulate/compute_con (mne_connectivity/spectral/epochs_bivariate.py)
    + O(P^2 F T) dense (P, P, 125, T) output and pyspi''s nan-statistic over (freq, time) (pyspi/statistics/wavelet.py:mne._get_cache / multivariate). The P^2 F T terms dominate at 118x1024,
    where the dense real tensor alone is 14.3 GB. summary.json gives P_exponent 3.57 fresh / 3.68 family-warm (8 -> 32) and T_exponent 0.94 / 1.15, from 32x1024 walls of 38.16 s fresh
    / 69.88 s family-warm (all nine fresh units and the family-warm pass ran in one subprocess per (family, shape) at P <= 32, profile_units.py:136 and 1060-1063, a probable but unconfirmed
    cause; repeats 1-3, peak RSS 4813 MB fresh). Those 32x1024 walls do not reproduce: isolated re-times of the representative identifier at 32x1024 gave 14.31 / 14.57 s (this stage)
    and 10.34 s (reviewer) (audit/profiles/micro/prof_wavelet__index.json), 2.6-3.7x lower, while the 8x1024 walls the reviewer re-timed (cohmag 0.27 s vs 0.21 s, pli 0.168 s vs 0.163
    s) roughly reproduce. With the re-times the 8 -> 32 exponent is about 2.63-2.87. Above P^2 but well below the summary.json value. The family-warm 8x1024 wall_cv 0.61 comes from a slow first pass
    and spread later passes (walls_s 1.80 s, then 0.43-0.71 s); wall_s is the minimum over passes (0.428 s, profile_units.py:69-71), so the cv does not
    enter the summary.json exponent, which is log4(69.88/0.428) = 3.68 and is set by the non-reproducing 32x1024 family-warm wall (a larger 8x1024 wall
    would lower the exponent, not raise it). The summary.json 118x1024 projections (4021 s fresh / 8459 s family-warm, extrapolated-power-from-32, 118 skipped-budget) are therefore inflated
    and should not be used; scaling the re-timed 32x1024 wall by (118/32)^2 to (118/32)^2.87 gives about 140-620 s per identifier build (order of magnitude only, not measured). A 118x1024
    run would probably not fit in 31 GB (the dense tensor plus mne''s per-connection complex accumulators of about 14 GB; inference from array sizes, not run).'
  hotspot_1: mne_connectivity/spectral/epochs_bivariate.py:_WPLIDebiasedEst.compute_con (third-party:mne_connectivity) 38.1% of the profiled SPI call at 8x1024, inside epochs.py:_epoch_spectral_connectivity
