  what_changed: 'Matches Daniusis et al. eq. (12) with the Gaussian reference measure up to the sign convention: A[i, j] = -C_{i->j} (positive = i -> j).
    The deciding agreement is the 22 exact runs against the independent _kernels_distance.igci_ref (no cdt/sklearn), max abs 3.0e-14; the analytic cubic check
    is statistical and its 20-seed means (0.8746 / 0.8742 / 0.8741) do not approach 0.8832 (finite-sample bias), so check_method is independent-impl. Score
    mapping: anchor 9''s clause ''trivial documented convention (... sign of a symmetric quantity)'' is applied by analogy. The quantity is antisymmetric,
    so negating it equals transposing it (A[i, j] = -C_{i->j} = C_{j->i}), and the orientation agrees with pyspi''s directed convention (Directed.multivariate
    evaluates A[i, j] with process i as the first, source argument, and a positive A[i, j] means i -> j). The convention is documented only in the delegate,
    in cdt''s docstring (IGCI.py:138 ''>0 if a->b''), not in pyspi''s supplement, config or GitBook. The output is signed and exactly antisymmetric but the
