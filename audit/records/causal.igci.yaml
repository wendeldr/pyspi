unit_id: causal.igci
status: profiled
correctness:
  metric_name_standard: 'information-geometric causal inference (IGCI) score with entropy estimator and Gaussian reference measure: difference
    of 1-spacing differential-entropy estimates of the standardised variables'
  canonical_ref: 'Daniusis, Janzing, Mooij, Zscheischler, Steudel, Zhang & Scholkopf 2010, UAI (arXiv:1203.3475), §2.3 (IGCI rule: infer
    X -> Y if C_{X->Y} < 0), §3.2 (Gaussian reference measure), §3.5 eq. (12) (Kraskov et al. 2004 1-spacing estimator S_hat = psi(m) - psi(1)
    + 1/(m-1) sum log|x_{i+1} - x_i|), with preprocessing to zero mean / unit variance so that C_{X->Y} = S(p_Y) - S(p_X); Janzing et al.
    2012, Artificial Intelligence 182-183:1-31'
  canonical_definition: 'C_{X->Y} = S_hat(Y~) - S_hat(X~) with X~, Y~ standardised (Gaussian reference) and S_hat the eq. (12) estimator;
    infer X -> Y if C_{X->Y} < 0, Y -> X if > 0; antisymmetric: C_{Y->X} = -C_{X->Y}.'
  documented_definition: 'supplement §1.3.2, p.8: ''Information-geometric causal inference [26] is a method for inferring causal influence
    from x -> y for deterministic systems with invertible functions. The statistic is computed using cdt as the difference in differential
    entropies where the probability density is computed via nearest-neighbor estimators.'' keywords ''directed, nonlinear, unsigned''. GitBook
    causal-inference.md calls it ''Information-Geometric Conditional Independence'' (as does the class name/name attribute).'
  delegate_lib: cdt==0.6.0 cdt.causality.pairwise.IGCI().predict_proba((x, y), ref_measure='gaussian', estimator='entropy') -> eval_entropy;
    scikit-learn==1.9.1 StandardScaler (module-level instance); scipy==1.17.1 scipy.special.psi
  implemented_as: 'A[i, j] = eval_entropy(std(z[i])) - eval_entropy(std(z[j])), standardisation by a module-level StandardScaler (ddof=0);
    eval_entropy(v) = (1/(m-1)) sum over sorted consecutive differences d != 0 of log|d| + psi(m) - psi(1) (zero spacings skipped but the
    divisor stays m-1). So A[i, j] = S_hat(z_i) - S_hat(z_j) = -C_{i->j}: positive means i -> j under the IGCI rule (cdt docstring IGCI.py:138
    ''>0 if a->b''). Exactly antisymmetric in the Directed.multivariate path (probe max |A + A^T| = 0.0 on 6 dataset/T combinations); from-scratch
    eq. (12) matches to <= 4.4e-15.'
  implementation_trace:
  - 'pyspi/data.py:184-195 Data.set_data: detrend only if detrend=True (default False), then scipy.stats.zscore(axis=1, ddof=1) if normalise=True
    (default); stored as (M, T, 1)'
  - 'pyspi/calculator.py:251-267 Calculator._load_yaml: configs is empty for the four causal classes, so iterating None raises TypeError
    and the class is instantiated with no arguments (261-267); labels come from the class attribute'
  - 'pyspi/calculator.py:327-339 Calculator.compute: S = spi.multivariate(dataset) (329); fill_diagonal(S, nan) (332); any exception -> whole
    matrix NaN (336-339) with a warning (354-355)'
  - 'pyspi/base.py:84-94 Directed.multivariate: A[i, j] = self.bivariate(data, i=i, j=j) for every ordered pair i != j (no mirroring)'
  - 'pyspi/base.py:27-49 parse_bivariate: two raw arrays are wrapped into a new Data object (base.py:33-36) and i, j = 0, 1 is set (base.py:41-43);
    Data.add_process z-scores only the first array (data.py:238 set_data, normalise=True) and appends the second raw (data.py:230-234); the
    Calculator/multivariate path passes the already z-scored Data through unchanged. Owned by unit preproc.two_array_api'
  - pyspi/data.py:108-118 Data.to_numpy returns the (M, T, 1) array, so z[i] is a (T, 1) column
  - 'pyspi/config.yaml:359-367 InformationGeometricConditionalIndependence: labels include ''unsigned'', configs empty'
  - 'pyspi/statistics/causal.py:56-65 InformationGeometricConditionalIndependence(Directed, Unsigned): labels include ''unsigned'' (60);
    bivariate returns IGCI().predict_proba((z[i], z[j])) (65)'
  - pyspi/base.py:146-150 Unsigned.issigned() returns False (no absolute value is applied)
  - .venv/lib/python3.12/site-packages/cdt/causality/pairwise/IGCI.py:38-39 module-level MinMaxScaler and StandardScaler instances
  - .venv/lib/python3.12/site-packages/cdt/causality/pairwise/IGCI.py:126-151 predict_proba defaults ref_measure='gaussian', estimator='entropy';
    estimator = eval_entropy(x) - eval_entropy(y) (141); gaussian ref = standard_scale.fit_transform(x.reshape(-1, 1)).ravel() (142); a,
    b scaled (148-149); return _estimator(a, b) (151)
  - '.venv/lib/python3.12/site-packages/cdt/causality/pairwise/IGCI.py:42-56 eval_entropy: sorted(x); sum log|delta| over nonzero consecutive
    deltas (50-53); hx/(len-1) + psi(len) - psi(1) (54)'
  - .venv/lib/python3.12/site-packages/cdt/causality/pairwise/IGCI.py:59-79 integral_approx_estimator (eq. (13) variant) - not used by pyspi
  deviation_from_documented: (a) Labelled 'unsigned' (supplement keyword, config.yaml:363, causal.py:56/60) but the value is signed and antisymmetric
    (probe ranges about -0.49 to +0.49; A[j, i] = -A[i, j] exactly). (b) Sign convention (positive = i -> j, i.e. the negative of the paper's
    C_{i->j}) and the Gaussian reference measure are undocumented. (c) 'nearest-neighbor estimators' is acceptable shorthand for the 1-spacing
    (Kraskov m=1) estimator. (d) Class/GitBook name 'Information-Geometric Conditional Independence' differs from the method's name 'information-geometric
    causal inference' used in the supplement. (e) Documented cdt v0.5.23 vs installed 0.6.0 (already documented).
  deviation_from_canonical: '(1) Returns -C_{X->Y} (cdt sign), so the canonical decision ''X -> Y if C < 0'' becomes ''i -> j if A[i, j] > 0''. (2) Otherwise
    matches eq. (12) with the Gaussian-reference preprocessing of §3.5; zero spacings are skipped while the divisor stays m-1 (paper silent: eq. (12) is undefined
    when a spacing is 0 because of log 0; the skip-with-divisor-m-1 rule is cdt''s eval_entropy, IGCI.py:42-56. The earlier statement that this is ''the same
    as the original Matlab-style estimator'' had no cited source and is withdrawn: no original Matlab code was consulted in this audit. On quantised data
    this choice decides the value; see the tie candidate). (3) Applied to noisy, non-invertible and autocorrelated data outside the method''s deterministic-invertible
    assumption (property of the method, not a code deviation).'
  units_and_range: 'nats (difference of differential-entropy estimates of unit-variance variables); signed, unbounded in principle, observed
    -0.52..+0.52 on the continuous check data and -6.35..+6.35 on logistic_maps_T1024 (period-4 y with repeated values: zero spacings are
    skipped while the divisor stays m-1); exactly antisymmetric; invariant to positive affine rescaling of each input (tests/README.md: igci
    differs between n1d0 and n0d0 by at most 3e-15); entropy of a standardised variable is <= 0.5*log(2*pi*e), so A[i, j] > 0 means z_i is
    closer to Gaussian than z_j.'
  direction_convention: 'A[i, j] = S_hat(z_i) - S_hat(z_j) = -C_{i->j}; POSITIVE means i -> j under the IGCI rule, and A[j, i] = -A[i, j].
    Code-derived; probe on inline synthetic X ~ U(0,1), Y = X^3: A[x, y] = 0.772 / 0.845 / 0.902 at T = 256 / 1024 / 4096 vs analytic -C^G
    = 0.883.'
  symmetry_expected: antisym
  already_documented: 'partly: installed cdt 0.6.0 vs documented 0.5.23 (DEPENDENCY_MIGRATION.md CDT row); the ''unsigned'' label on a signed
    output is not listed (M8 covers other unsigned-but-negative SPIs: pec, pec_log, Gaussian entropies; label structure M9)'
  new_finding_candidates:
  - 'Candidate (signed output labelled unsigned): causal.py:56 class inherits Unsigned and causal.py:60 / config.yaml:363 label it ''unsigned'', but IGCI.py:141
    returns a difference of entropies; probe iid_gaussian_T64 values range -0.436..+0.436 and max |A + A^T| = 0.0 on every probed dataset, so downstream code
    that treats the matrix as unsigned/non-negative or symmetrises it would destroy the information (A + A^T = 0).'
  - 'Candidate (undocumented sign convention): IGCI.py:141 computes eval_entropy(a) - eval_entropy(b) = -C_{a->b} of Daniusis et al. 2010 §2.3; positive =
    a -> b, opposite in sign to the paper''s C.'
  - 'Candidate (bivariate raw-array path not exactly antisymmetric; preprocessing asymmetry owned by preproc.two_array_api / base.pair_handling): parse_bivariate
    (base.py:33-36) builds Data via add_process, which z-scores only the first array (data.py:238 set_data, normalise=True) and appends the second raw (data.py:230-234).
    bivariate(x, y) therefore evaluates IGCI on (zscore(x), raw y) and bivariate(y, x) on (zscore(y), raw x); the IGCI StandardScaler (IGCI.py:39 and :142,
    gaussian ref_measure) re-standardises both, so the two calls differ only at ulp level, amplified by the log of tiny spacings in eval_entropy. Probe fix_cdt/igci_raw.py
    (x ~ U(0,1), y = x^3, T=1024, default_rng(0)): 0.8105075201018178 vs -0.8105075125133075 (gap 7.6e-9); IGCI().predict_proba((zscore(x, ddof=1), y)) and
    ((zscore(y, ddof=1), x)) reproduce both values exactly; with both inputs z-scored the gap is 0.0, and the Calculator/multivariate path gives A[0,1] +
    A[1,0] = 0.0. Earlier probe: 5e-9 (0.8448910243 vs -0.8448910189). Low impact for igci; the generic raw-append behaviour is locked by tests/unit/test_data.py:74-88
    and recorded under preproc.two_array_api.'
  - 'Candidate (quantised data: value set by tie counts): eq. (12) has no rule for zero spacings; cdt skips them and keeps the divisor at m-1, so each tied
    spacing contributes 0 to the sum while still counting in the divisor. On quantised data the output is mainly a tie-count artefact (wf4b-2 scratch probes
    wf4b2_high-optimiser-other/p_igci.py and p_igci_ties.py on an EEG window, 001_Baseline.EDF, six EEG channels, mid-recording; ADC step 2.66e-7): pyspi
    reproduces the skip/(m-1) rule to 8.4e-15 (T512), but the channels have 179-244 zero spacings at T512 (578-683 at T1024), the alternative divisor (number
    of non-zero spacings) changes A by up to 0.488 when max|A| is 0.688, A[i, j] correlates 0.993 (T512) and 0.998 (T1024) with the difference in zero-spacing
    counts of the two channels, and sub-quantum uniform dither (which keeps the signal and breaks the ties) lowers max|A| to 0.236 / 0.169 and changes the
    sign of A on 80% (T512) and 47% (T1024) of pairs. causal.igci is not in the retained 185-metric EEG set.'
