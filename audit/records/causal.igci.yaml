optimisation:
  complexity_P_T: 'O(P^2 T log T) as implemented: per ordered pair cdt IGCI.predict_proba standardises both series and evaluates eval_entropy (sort plus a Python loop over T-1 spacings) for both (pyspi/statistics/causal.py:62-65); the quantity itself is O(P T log T) because A[i, j] = S(z_i) - S(z_j). Measured P_exponent 2.06, T_exponent 0.53. Pair term dominates; measured 26.9 s per window at 118x1024 (measured).'
  hotspot_1: cdt/causality/pairwise/IGCI.py:eval_entropy (third-party:cdt) 54.4% of the profiled SPI call at 8x1024 (41.7% self in the Python loop over sorted spacings; builtins.sorted 12.6%)
  hotspot_2: sklearn/base.py:fit_transform (StandardScaler via IGCI.py:<lambda>, third-party:sklearn) 44.1% of the profiled SPI call at 8x1024 (validation 19.9%, _incremental_mean_and_var 12.1%)
  hotspot_owner: third-party:cdt
  opaque_share: 0.219
  profile_file: audit/profiles/causal.igci__8x1024.pstats
  opportunities:
  - opportunity_id: cdt_pairwise-3
    opportunity: 'IGCI is A[i, j] = S(z_i) - S(z_j): compute the standardised-entropy S once per channel (the same module-level StandardScaler and cdt eval_entropy, P evaluations instead of 2P(P-1)) and fill the matrix as an outer difference (pyspi/statistics/causal.py:62-65).'
    opp_type: algorithmic
