    -> -inf, 590-593), -0.5 y''alpha - sum log diag L - T/2 log 2 pi (613-615), gradient 0.5 tr((alpha alpha^T - K^-1) dK) (647-651, R&W eq. 5.9)'
  - '.venv/lib/python3.12/site-packages/sklearn/gaussian_process/_gpr.py:658-674 _constrained_optimization: scipy.optimize.minimize(method=''L-BFGS-B'',
    jac=True, bounds); _check_optimize_result (667)'
