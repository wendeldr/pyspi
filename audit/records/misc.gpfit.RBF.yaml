unit_id: misc.gpfit.RBF
status: profiled
correctness:
  metric_name_standard: in-sample mean squared residual of the posterior mean of a Gaussian-process regression of y on x with a squared-exponential
    (RBF) covariance plus constant and white-noise terms, hyperparameters chosen by type-II maximum likelihood (single L-BFGS-B start)
  canonical_ref: "Williams & Rasmussen 1996, NIPS 8:514-520 (supplement ref [78], cited as 1995); Rasmussen & Williams 2006, Gaussian Processes\
    \ for Machine Learning, MIT Press: Alg. 2.1 (p.19, posterior mean f_bar = K_*^T (K + sigma_n^2 I)^-1 y), eq. 2.31 (SE covariance with signal\
    \ variance, k_y = sigma_f^2 exp(-(x - x')^2 / (2 l^2)) + sigma_n^2 delta), eq. 4.9 (SE kernel), \xA75.4.1 eqs. 5.8-5.9 (log marginal likelihood,\
    \ ML-II, gradient; notes that multiple local optima exist and correspond to different interpretations of the data), \xA75.4.2 eq. 5.12 (leave-one-out\
    \ predictive residual). There is no canonical pairwise \"GP fit MSE\" statistic; the canonical object is the GP posterior mean and its residual."
  canonical_definition: With k(x, x') = c + sigma_f^2 exp(-(x - x')^2 / (2 l^2)) and noise variance s chosen by maximising log p(y | x, theta)
    (the global maximum, in practice approximated by several starts), the posterior mean is f_bar = K_f (K_f + s I)^-1 y; the score would be (1/T)
    sum_t (y_t - f_bar_t)^2, or the leave-one-out version r_t = [K^-1 y]_t / [K^-1]_tt if a predictive error is wanted.
  documented_definition: "supplement \xA71.6.2, p.18: 'we also use Gaussian process [78] model fits as a nonparametric measure of influence of\
    \ x on y. Here, we use a combination of kernels (with parameters chosen from default settings) from the scikit-learn package [2] and compute\
    \ the MSE of their fit. The fits are computed for ... the radial basis function (RBF) kernel with length scale l = 1 (RBF). Each of these\
    \ kernels are separately combined with the constant kernel (with a constant of 1.0) and the white kernel (with a noise level of 1)'; keywords\
    \ 'directed, nonlinear, unsigned, bivariate, contemporaneous'. GitBook spi-descriptions/miscellaneous.md lines 46-63 repeat the text verbatim\
    \ and cite Williams & Rasmussen (WilRas96.pdf)."
  delegate_lib: scikit-learn==1.9.1 sklearn.gaussian_process.GaussianProcessRegressor.fit/predict with kernel ConstantKernel() + WhiteKernel()
    + RBF(); hyperparameters by scipy==1.17.1 scipy.optimize.minimize(method='L-BFGS-B'); score by sklearn.metrics.mean_squared_error
  implemented_as: 'A[i, j] = mean((f_bar - z_j)^2) where f_bar is the GP posterior mean at the training inputs z_i (in-sample, not held out),
    on z-scored (ddof=1) data. Kernel = ConstantKernel(1.0) + WhiteKernel(1.0) + RBF(length_scale=1.0), k(x, x'') = c + w delta + exp(-(x - x'')^2
    / (2 l^2)): the RBF amplitude is FIXED at 1 (the constant is added, not multiplied), so there is no signal-variance hyperparameter. c, w,
    l have bounds (1e-5, 1e5); the documented values 1.0 are only the L-BFGS-B starting point theta = (0, 0, 0) in log space. One optimiser run
    (n_restarts_optimizer=0), alpha = 1e-10 jitter, normalize_y=False, random_state=None (unused). The white term enters K(X, X) but not K(X_test,
    X_train) (kernels.py:1419), so the prediction is the de-noised posterior mean; an RBF with l below the input spacing, however, has Gram ~
    I and is counted as signal, so the posterior mean then interpolates y. Probes: independent pairs give l -> 2e3..1e5 (upper bound 1e5), w ~
    1, A = (T-1)/T to 6 digits (0.996094 at T=256, 0.984375 at T=64); Gaussian pairs give l ~ 2-5 and A within 6.3e-2 relative of ((T-1)/T)(1
    - r^2) at T=256; pyspi''s own value equals the MSE of a from-scratch posterior mean at sklearn''s fitted hyperparameters to <= 1.9e-15 absolute
    (the posterior-mean vectors themselves differ elementwise by up to 4.3e-13, np.linalg.solve vs sklearn''s Cholesky; 24 RBF pairs). Fit warnings
    are suppressed by pyspi.'
  implementation_trace:
  - 'pyspi/data.py:184-197 Data.set_data: detrend only if detrend=True (default False), then scipy.stats.zscore(axis=1, nan_policy=''omit'', ddof=1)
    if normalise=True (default)'
  - pyspi/data.py:108-118 Data.to_numpy returns the (M, T, 1) array, so z[i] is a (T, 1) column (the 2-D X sklearn requires)
  - 'pyspi/config.yaml:1280-1290 GPModel: labels directed/nonlinear/unsigned/bivariate/contemporaneous; configs kernel: DotProduct, kernel: RBF'
  - 'pyspi/calculator.py:230,251-267 Calculator._load_yaml (def at 230; config loop 251-267): spi = GPModel(**params) for each config (256); the
    class attribute labels (misc.py:132) are reported'
  - 'pyspi/calculator.py:295,327-339,354-355 Calculator.compute (def at 295): S = spi.multivariate(dataset) (329); np.fill_diagonal(S, nan) (332);
    table store (335); any exception -> whole matrix NaN (except 336-339, NaN at 337, message at 339) with a warning raised at 354-355 (lines
    confirmed at HEAD a42ebc1; calculator.py is unchanged since a1f20c7)'
  - 'pyspi/base.py:84-94 Directed.multivariate: A[i, j] = self.bivariate(data, i=i, j=j) for every ordered pair i != j (no mirroring)'
  - pyspi/base.py:27-49 parse_bivariate passes the Data object through (two raw arrays would be wrapped into a new, z-scored Data)
  - pyspi/statistics/misc.py:7-8 imports sklearn.gaussian_process.kernels, GaussianProcessRegressor and sklearn.metrics.mean_squared_error
  - pyspi/statistics/misc.py:129-132 class GPModel(Directed, Unsigned), identifier 'gpfit', labels ['misc', 'unsigned', 'unordered', 'normal',
    'nonlinear', 'directed']
  - 'pyspi/statistics/misc.py:134-137 __init__: identifier ''gpfit_RBF''; self._kernel = kernels.ConstantKernel() + kernels.WhiteKernel(), then
    += kernels.RBF() (sum, not product: RBF amplitude fixed at 1)'
  - 'pyspi/statistics/misc.py:139-147 bivariate: z = data.to_numpy(); warnings suppressed only around fit; gp = GaussianProcessRegressor(kernel=self._kernel).fit(z[i],
    np.ravel(z[j])); y_predict = gp.predict(z[i]); return mean_squared_error(y_predict, np.ravel(z[j])) (arguments in (y_pred, y_true) order,
    harmless for MSE)'
