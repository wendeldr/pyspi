    y_mean = K_trans @ alpha_ (447), squeezed to (T,)'
  - .venv/lib/python3.12/site-packages/sklearn/metrics/_regression.py:524 mean_squared_error; :586-588 average of (y_true - y_pred)^2
  deviation_from_documented: (a) The documented values (l = 1, constant 1.0, noise level 1) are only the starting point; all three hyperparameters
    are re-estimated per pair by maximising the log marginal likelihood within [1e-5, 1e5]. Fitted values range from l = 1e-5 to 1e5, c mostly
    at its 1e-5 lower bound, w from 1e-5 to 1. (b) 'MSE of their fit' is the in-sample (training) MSE of the posterior mean; with a flexible kernel
    this can be ~0 without any predictive skill (candidate below). (c) The values depend on which local optimum the single start reaches, which
    the documentation does not mention.
  deviation_from_canonical: "(1) No signal-variance hyperparameter: the RBF amplitude is fixed at 1 (R&W eq. 2.31 has sigma_f^2), because the\
    \ constant kernel is added rather than multiplied. For z-scored data with no dependence the model cannot switch the RBF off; it can only make\
    \ it a constant (l -> upper bound, acting as a random intercept) or a unit-variance white-noise-like term (l -> below the input spacing).\
    \ The two modes have similar likelihood but opposite predictions (candidate below). (2) Hyperparameters from one L-BFGS-B start, not the ML-II\
    \ maximum; probes find the single start below the best multi-start likelihood (iid_gaussian_T256 0->1: -365.5228 vs -362.6346). (3) Score\
    \ is the training MSE of the posterior mean, not a held-out or leave-one-out predictive error (R&W \xA75.4.2) and not a likelihood. Given\
    \ the hyperparameters, the posterior mean itself is standard (own implementation's MSE agrees to <= 1.9e-15; its f_bar agrees elementwise\
    \ to <= 4.3e-13)."
  units_and_range: 'squared units of the target (SD^2 after z-scoring); >= 0; under default z-scoring in [0, about (T-1)/T]: independent pairs
    give (T-1)/T (0.996094 at T=256), interpolating fits give ~1e-10 ((w/(1+w))^2 (T-1)/T with w at the 1e-5 bound); scale-dependent when normalise=False
    (scaled_offset_T256 raw: 0.036 to 97.3); asymmetric (|A - A^T| up to 0.99 on narrowband_f0-0.4 and 0.97 on nonlinear_dependence); NaN matrix
    if the Cholesky fails.'
  direction_convention: 'A[i, j] = MSE of predicting process j (target, np.ravel(z[j])) from process i (input, z[i]), from misc.py:145-147 and
    base.py:91-93. Lower means i predicts j better. Probe: nonlinear_dependence_T256 (x1 = x0^2 + noise) A[0,1] = 0.026, A[1,0] = 0.996; anm_T256
    A[0,1] = 0.2146 < A[1,0] = 0.3140 and A[2,3] = 0.0652 < A[3,2] = 0.0918. Confirmed in the check stage (misc.gpfit.RBF|*|direction runs).'
  symmetry_expected: asym
  already_documented: 'no (label structure in general: docs/storage_comparison/REVIEW.md M9)'
  new_finding_candidates:
  - 'Candidate (single-start local optimum; the ML-II optimum is degenerate): with 10-15 random restarts sklearn finds higher log marginal likelihood
    than pyspi''s single start, and the better optimum interpolates. iid_gaussian_T256 0->1: pyspi fit ''0.00358**2 + WhiteKernel(noise_level=1)
    + RBF(length_scale=1.06e+04)'', LML -365.5228, MSE 0.996094; restart winner ''0.00316**2 + WhiteKernel(noise_level=1e-05) + RBF(length_scale=0.000138)'',
    LML -362.6346, MSE 9.98e-11. Same pattern on all 8 iid_gaussian_T256/delayed_noise_T256 pairs tested (restart MSE 9.96e-11 to 1.0e-10) and
    on nonlinear_dependence_T256 (1,0) 0.996 -> 0.000588, (2,3) 0.981 -> 0.00093, (3,2) 0.996 -> 2.4e-7. The single start itself converges (scipy:
    ''CONVERGENCE: NORM OF PROJECTED GRADIENT <= PGTOL'', nit 21), so pyspi''s value is a genuine local optimum that depends on the starting point
    theta = 0. Survey (p7_opt.py, 10 restarts, LML gain > 1e-3): iid_gaussian 20/20 pairs at T=64 and 20/20 at T=256; delayed_noise 12/12 (T=64,
    T=256); nonlinear_dependence 11/12 (T=64, T=256); bivariate_gaussian and anm 8/12 (T=64, T=256); var2_chain 6/6 (T=64), 2/6 (T=256); logistic_maps
    1/2 (T=64), 0/2 (T=256); overall 144 of 188 ordered pairs over 9 datasets x T in {64, 256}. On pairs without dependence the better optimum
    interpolates (w = 1e-5, l < 1e-3, MSE ~ 1e-10) while its leave-one-out MSE stays ~1 (iid_gaussian_T64 0->1: in-sample 9.84e-11, LOO 0.984).'
  - 'Candidate (mechanism: fixed-amplitude RBF at tiny length scale acts as signal-labelled white noise): with l below the minimum input spacing
    (2.2e-4 on iid_gaussian_T256) the RBF Gram is ~ I, so c + w I + RBF is likelihood-equivalent to a white-noise model of variance 1 + w, but
    predict() uses the RBF part as signal and returns f_bar ~ y / (1 + w). With the sklearn jitter alpha = 1e-10 added to w, the in-sample MSE
    is then (w'' / (1 + w''))^2 (T-1)/T with w'' = w + 1e-10: 9.960937e-11 for the fitted w = 1e-5 at T = 256, which matches the restart value
    9.960938e-11 (delayed_noise_T256 0->1) to 1.1e-8 relative. Without the jitter the formula gives 9.960738e-11 (2.0e-5 relative).'
  - 'Candidate (in-sample MSE ~ 0 without predictive skill, reached by pyspi''s own single start): shared_envelope_T64 0->1 pyspi fit ''WhiteKernel(noise_level=1e-05)
    + RBF(length_scale=0.00726)'' gives A[0,1] = 1.1e-8 while the leave-one-out MSE of the same fit (R&W eq. 5.12) is 0.50; the reverse A[1,0]
    = 0.106 (LOO 0.157). At T=256: A[0,1] = 5.3e-11 (LOO 0.374) vs A[1,0] = 0.539 (LOO 0.600). The large asymmetry is a property of which fit
    interpolates, not of predictability. Here the interpolating fit is itself a LOCAL optimum: multi-start finds LML higher by 11.5 at ''WhiteKernel(noise_level=0.125)
    + RBF(length_scale=0.132)'' with MSE 0.099, LOO 0.146. (This dataset is noise-free and exactly periodic with repeated (x0, x1) pairs, 75 near-duplicate
    inputs at T=256.)'
  - 'Candidate (single start misses genuine structure): narrowband_f0-0.1_T64 1->0 pyspi fit l = 1.94, w = 0.504, A = 0.483 (LOO 0.52); multi-start
    optimum l = 0.162, w = 0.032 has LML higher by 58.4, MSE 0.023 and LOO 0.056 (similar for 1->2: 0.498 vs 0.027, LOO 0.078). The local-optimum
    dependence therefore biases values in both directions: it hides degenerate interpolation on independent pairs and hides real, cross-validated
    predictability on others.'
  - 'Candidate (no dependence -> constant (T-1)/T): for independent z-scored pairs the fit sends l to the upper bound and predicts ~0, so A =
    mean(z_j^2) = (T-1)/T to 6 digits (all iid_gaussian_T256 entries 0.9599-0.9961, 16 of 20 equal to 0.9961 at 4 decimals); the value carries
    information only through the fits that leave this mode.'
  - 'Candidate (hyperparameter bound warnings hidden): sklearn emits ''The optimal value found for dimension 0 of parameter k1__k1__constant_value
    / k2__length_scale is close to the specified ... bound'' for most fits; misc.py:143-145 suppresses them, so users are not told that c sits
    at 1e-5 and l at 1e-5 or 1e5.'
  - 'Candidate (random_state is a no-op): n_restarts_optimizer=0, so the RNG at _gpr.py:251 is never drawn (used only at :322-333); the result
    is deterministic given the data and BLAS.'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - anm
    - nonlinear_dependence
    - shared_envelope
    path: kernel
    reference: 'from-scratch numpy/scipy GP: kernel c + w I + exp(-d^2/(2 l^2)) on log-hyperparameters with bounds [log 1e-5, log 1e5], jitter
      1e-10, Cholesky log marginal likelihood and analytic gradient (R&W eqs. 5.8-5.9), scipy.optimize.minimize(L-BFGS-B) from theta = (0, 0,
      0); posterior mean K_f (K_f + (w + 1e-10) I)^-1 y at the training inputs; MSE. No sklearn import.'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: relative difference <= 1e-6 for pairs where both land in the same basin (same l within 1%); any pair where the fitted l
      differs by more than a factor 10 is reported as a basin disagreement rather than a numerical error
  - datasets:
    - iid_gaussian
    - delayed_noise
    - nonlinear_dependence
    - shared_envelope
    - anm
    path: kernel
    reference: 'from-scratch multi-start ML-II (the GP above, 20 log-uniform starts over the bounds plus theta = 0): best log marginal likelihood
      and the MSE at the best hyperparameters; compare with the LML of pyspi''s fit'
    reference_kind: independent-impl
    criterion: optimality
    expected_outcome: pyspi's fit is a local optimum (projected gradient ~ 0) but below the multi-start best on independent pairs, where the best
      fit interpolates (w at 1e-5, l < min spacing, MSE ~ 1e-10); quantifies the fraction of pairs whose value would change by > 1e-3 under multi-start
  - datasets:
    - iid_gaussian
    - shared_envelope
    - nonlinear_dependence
    path: kernel
    reference: 'analytic identity for the in-sample residual: y - f_bar = (w + 1e-10) (K + (w + 1e-10) I)^-1 y, so MSE = (w + 1e-10)^2 ||alpha||^2
      / T; and for l below the input spacing MSE = (w / (1 + w))^2 (T-1)/T; plus leave-one-out MSE r_t = alpha_t / [K^-1]_tt (R&W eq. 5.12), all
      from numpy at the fitted hyperparameters'
    reference_kind: same-lineage
    criterion: exact
    expected_outcome: identity holds to <= 1e-10 relative (hyperparameters are taken from the sklearn fit, hence same-lineage); LOO MSE / in-sample
      MSE ratio documents interpolation (probe shared_envelope_T64 0->1 in-sample 1.1e-8 vs LOO 0.50)
  - datasets:
    - nonlinear_dependence
    - anm
    - logistic_maps
    path: pipeline
    reference: 'direction test against the generating mechanism: nonlinear_dependence x0 -> x1 = x0^2 + noise (x0 predicts x1, not vice versa);
      anm x0 -> x1 (cubic), x2 -> x3 (tanh); the expected ordering comes from the from-scratch GP above (independent-impl)'
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: 'establishes the convention A[i, j] = MSE of predicting j from i (lower = better prediction): A[0,1] << A[1,0] on nonlinear_dependence
      (probe T=256: 0.026 vs 0.996); A[0,1] < A[1,0] and A[2,3] < A[3,2] on anm at T >= 256 (probe 0.215 vs 0.314, 0.065 vs 0.092). logistic_maps
      is reported qualitatively (contemporaneous fit of a lagged coupling)'
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - sparse_precision
    - gauss_ar1_pair
    path: pipeline
    reference: analytic Gaussian expectation ((T-1)/T)(1 - r_ij^2) (the best predictor of jointly Gaussian data is linear)
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: relative difference <= 0.1 at T=256 and <= 0.05 at T=1024 for non-interpolating fits (probe max 6.3e-2 on bivariate_gaussian_T256,
      3.6e-2 on iid_gaussian_T256); any value < 0.01 on these datasets flags an interpolating fit
  - datasets:
    - trending
    - scaled_offset
    path: pipeline-detrend
    reference: from-scratch GP above on the detrended, z-scored rows; scaled_offset with normalise=True must equal bivariate_gaussian
    reference_kind: independent-impl
    criterion: qualitative
    expected_outcome: detrending removes the shared-trend inflation (probe trending_T256 min 0.083 vs bivariate_gaussian_T256 0.328); z-scoring
      makes scaled_offset identical to bivariate_gaussian (probe equal to 4 decimals); with normalise=False the values are in raw squared units
      and the fixed kernel bounds and unit RBF amplitude interact with scale
  check_method: independent-impl
  check_reference: audit/checks/refs/gpfit.py:h_posterior and h_postmean -> audit/checks/refs/_kernels_basic_misc.py:gp_posterior_mean + gp_log_marginal_likelihood
    (Cholesky, R&W Alg. 2.1 and eqs. 5.8-5.9, no sklearn) at sklearn's fitted theta (probes/gpfit_probes.py:params, :postmean); audit/checks/refs/gpfit.py:h_scratch
    -> _kernels_basic_misc.gp_fit (own single L-BFGS-B start from theta = 0 in the sklearn box) + gp_posterior_mean; h_params (projected gradient
    and tight polish under the independent LML); h_multistart (own multi-start ML-II, theta = 0 plus 20 log-uniform starts at every T, plus the
    interpolation formula (w'/(1 + w'))^2 mean(y^2)); h_identity (residual identity w'^2 |K^-1 y|^2 / T and LOO R&W eq. 5.12, same-lineage theta);
    h_gaussexp (analytic ((T-1)/T)(1 - r^2)); h_vsridge (analytic Ridge(alpha=1) MSE, cross-checked with pyspi's misc.lmfit.Ridge outputs); h_direction;
    h_fixedhp (own posterior mean at the documented, fixed hyperparameters vs sklearn optimizer=None, probes/gpfit_probes.py:fixedhp); h_amplitude
    (own numpy LML for ConstantKernel()*RBF() + WhiteKernel(), amp_lml/amp_fit, vs sklearn with 10 restarts, probes/gpfit_probes.py:amplitude);
    h_affine, h_determinism, h_crossproc (probes/gpfit_probes.py:crossproc, fresh processes), h_warnings, h_scipy118 (same-lineage). The reference
    process pins every BLAS to one thread (refs/gpfit.py top).
  check_data: 'pipeline: iid_gaussian T64/T256 (P=3)/T1024 (P=2), delayed_noise T64/T256, nonlinear_dependence T64/T256, anm T256/T1024 (P=2),
    bivariate_gaussian T256/T1024 (P=2), shared_envelope T64/T256, narrowband_f0-0.1 T64, sparse_precision T256 (P=3)/T1024 (P=2), gauss_ar1_pair
    T256/T1024, logistic_maps_chaotic T256, scaled_offset T256, trending T256 (also pipeline-detrend); kernel (raw rows): iid_gaussian, bivariate_gaussian,
    anm, nonlinear_dependence, shared_envelope at T64/T256, anm and iid_gaussian T1024 (P=2), scaled_offset T256; fixedhp: iid_gaussian T256 (P=3),
    nonlinear_dependence T256, shared_envelope T64 (pipeline); amplitude: iid_gaussian and delayed_noise T256 (P=3), nonlinear_dependence T256
    (pipeline); crossproc: shared_envelope T64/T256, iid_gaussian T256 (P=3)'
  agreement_criterion: 'exact rtol 1e-8, atol 1e-12 at sklearn''s theta (posterior; postmean elementwise atol 1e-10); tolerance rtol 1e-6 vs an
    own single start from theta = 0 (scratch); optimality: polish gain <= 1e-3 (params, local) and no multi-start optimum (21 starts) higher by
    > 1e-3 in LML (multistart, global); same-lineage exact rtol 1e-10 for the residual identity; analytic Gaussian expectation rtol 0.1 (T256)
    / 0.05 (T1024); exact rtol 1e-8 for the fixed-hyperparameter posterior (fixedhp); qualitative: RBF MSE <= Ridge MSE on every pair, orientation
    and cause -> effect ordering, bit-identical in-process recomputation, cross-process bit-identity under the pipeline import order and rtol
