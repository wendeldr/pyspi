  what_changed: 'Given its hyperparameters the posterior mean and MSE are standard (fp-exact on an independent GP), and an independent single
    L-BFGS-B start from theta = 0 reproduces pyspi''s values to <= 2.1e-7 (<= 1.7e-11 outside shared_envelope). The statistic nevertheless deviates
    from both references in an interpretable way (anchor 6). From the supplement: l, the constant and the noise are fitted, not fixed at 1. From
    canonical GP regression: (1) The constant kernel is added, not multiplied, so the RBF amplitude is fixed at 1. With that kernel the ML-II
    maximum is degenerate on pairs without strong dependence. The better optimum interpolates (w at 1e-5, l below the input spacing, MSE (w''/(1
    + w''))^2 (T-1)/T about 1e-10) with no predictive skill. (2) pyspi uses a single start, not the ML-II maximum. The value is the fit reached
    from theta = 0, which is below the multi-start optimum on 100 of 128 pairs. That fit either sends l to the 1e5 bound and returns (T-1)/T for
    independent pairs, or misses cross-validated structure (narrowband_f0-0.1 T64 1->0: 0.483 against 0.023, LOO 0.520 against 0.056). (3) On
    noise-free periodic data, the single start itself lands in an interpolating optimum (shared_envelope T64 0->1: A = 1.1e-8, LOO 0.50). (4)
    The score is an in-sample MSE, so it is not bounded by the linear fit: on Gaussian and independent pairs it exceeds Ridge by up to 0.0063.
