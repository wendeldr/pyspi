    = noise_level * I when Y is None; :1418-1419 zeros when Y is given (so excluded from the predictive cross-covariance)
  - .venv/lib/python3.12/site-packages/sklearn/gaussian_process/kernels.py:1511 RBF(length_scale=1.0, bounds (1e-5, 1e5)); :1558-1570 K = exp(-0.5
