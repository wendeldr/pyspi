unit_id: distance.bary.euclidean
status: profiled
correctness:
  metric_name_standard: Summary (time-mean or time-max) of the Euclidean Fréchet mean (pointwise average (x+y)/2) of two z-scored series; squared variant summarises ((x+y)/2)^2
  canonical_ref: Fréchet 1948, Ann. Inst. Henri Poincaré 10(4):215-310 (Fréchet mean); for squared Euclidean distance the Fréchet mean of {x_k} is the arithmetic mean (e.g. Petitjean et al. 2011, Pattern Recognit. 44:678, §2). The scalar mean/max summary is a pyspi construction (Cliff et al. 2023, Nat. Comput. Sci., supplement §1.2.10) with no literature counterpart.
  canonical_definition: 'b* = argmin_b sum_k ||b - x_k||^2 = (x + y)/2; SPI = mean_t b*(t) or max_t b*(t); squared: mean_t b*(t)^2 or max_t b*(t)^2'
  documented_definition: 'supplement §1.2.10, p.7 (supplement.txt lines 321-335): "A barycenter (or Fréchet mean) [21, 22] is a (univariate) time series that minimizes the sum of squared distances between MTS ... For each pair of (bivariate) time series ... we compute the raw barycenters then summarize them by taking their mean (modifier mean) and maximum (max), yielding seven SPIs" (keywords: undirected, nonlinear, unsigned, bivariate, time-dependent). GitBook distance-similarity.md:41-75 repeats this, adds "timepoint at which the maximum occurs (max_time)" and lists 12 identifiers bary_{euclidean,dtw,softdtw,sgddtw}_{mean,max,max_time}; neither source documents the squared (bary-sq_*) variants.'
  delegate_lib: tslearn==0.9.0 tslearn.barycenters.euclidean_barycenter (numpy.average over axis 0, uniform weights)
  implemented_as: 'Each process z-scored (scipy zscore, ddof=1; detrend only if requested); b = numpy.average(z[[i,j]] as (2,T,1), axis=0) = (z_i + z_j)/2, shape (T,1); statistic = nanmean/nanmax of b or of b**2. Consequences on z-scored input: mean(b) = (mean z_i + mean z_j)/2 = 0 up to rounding; mean(b**2) = (1 + r)(T-1)/(2T) with r the Pearson correlation; max(b) = max_t (z_i+z_j)/2 >= 0; max(b**2) = (max_t |z_i+z_j|/2)^2. Cached per pair on the Data object and mirrored, so A is exactly symmetric.'
  implementation_trace:
  - pyspi/statistics/distance.py:4-9 imports euclidean_barycenter, dtw_barycenter_averaging, dtw_barycenter_averaging_subgradient, softdtw_barycenter from tslearn.barycenters
  - pyspi/statistics/distance.py:211-215 class Barycenter(Directed, Signed); class labels ['distance','signed','undirected','temporal','nonlinear']
  - pyspi/statistics/distance.py:218-219 mode 'euclidean' -> self._fn = euclidean_barycenter
  - pyspi/statistics/distance.py:230-234 squared=True sets preproc x**2 and identifier prefix 'bary-sq'
  - 'pyspi/statistics/distance.py:236-243 statistic: mean -> np.nanmean(preproc(bc)); max -> np.nanmax(preproc(bc)); max_time -> np.argmax(preproc(bc)) (not in any config)'
  - pyspi/statistics/distance.py:245 identifier suffix _{mode}_{statistic}
  - 'pyspi/statistics/distance.py:247-263 bivariate: looks up data.barycenter[mode][(i,j)]; on miss z = data.to_numpy(squeeze=True); bc = self._fn(z[[i, j]]) with library defaults; caches bc under (i,j) AND (j,i) (line 261); returns statfn(bc)'
  - pyspi/base.py:27-48 parse_bivariate (wraps raw arrays in a Data object, default normalise=True)
  - 'pyspi/base.py:85-94 Directed.multivariate: j outer, i inner, A[i,j] = bivariate(i, j); the first call for pair {a<b} is (i=b, j=a), so the cached barycenter is computed from z[[b, a]] and reused for A[a,b]'
  - pyspi/data.py:59-71 Data defaults detrend=False, normalise=True; pyspi/data.py:184-195 optional scipy detrend then zscore(axis=1, ddof=1)
  - pyspi/data.py:108-116 to_numpy(squeeze=True) -> (P, T) array
  - pyspi/calculator.py:252-266 configs instantiated as Barycenter(**params); spi.labels come from the class (config labels at pyspi/config.yaml:256-261 are not applied); pyspi/calculator.py:329 every SPI's multivariate() receives the same self.dataset, so all statistics/squared variants of one mode share one cached barycenter per pair
  - 'pyspi/config.yaml:255-311 Barycenter configs: 4 modes x {mean,max} x {squared False, True} = 16 identifiers'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/utils.py:7-13 _set_weights(None, 2) -> numpy.ones(2) (unnormalised uniform weights)
  - '.venv/lib/python3.12/site-packages/tslearn/utils/utils.py:215 to_time_series_dataset: (2, T) -> (2, T, 1)'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/euclidean.py:9 euclidean_barycenter(X, weights=None)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/euclidean.py:42-44 X_ = to_time_series_dataset(X); weights = _set_weights(weights, 2); return numpy.average(X_, axis=0, weights=weights)
  deviation_from_documented: 'Documented keyword "unsigned", but the class is Signed (issigned() True, class label "signed"); the config labels (undirected, nonlinear, unsigned, bivariate, time-dependent) are never attached to the SPI (calculator.py:252-266 uses class labels). Documented "undirected", but the class inherits Directed; symmetry comes only from the per-Data cache writing (j,i) = (i,j) (distance.py:261), not from Undirected.multivariate mirroring. Supplement says "seven SPIs" (lists euclidean_max, dtw_mean/max, softdtw_mean/max, sgddtw_mean/max); config computes 16, including bary_euclidean_mean and all eight bary-sq_* variants, none of which are documented; GitBook lists max_time variants that exist in code (distance.py:240-241) but are absent from every config. bary_euclidean_mean (in config and in the EEG selection) is not among the supplement''s seven SPIs; on the default z-scored input it is structurally zero (probe: |A| <= 1.8e-17 on bivariate_gaussian T=256).'
  deviation_from_canonical: 'Barycenter itself matches the canonical Euclidean Fréchet mean exactly (numpy.average with equal weights). The summaries are pyspi-defined: bary_euclidean_mean is identically 0 (degenerate) under normalise=True; bary-sq_euclidean_mean is an affine function of Pearson r, (1+r)(T-1)/(2T), i.e. a rescaled correlation rather than a distance; the max variants are extreme-value statistics of x+y and depend on tail behaviour and T.'
  units_and_range: 'z-score units (dimensionless after normalisation). mean: 0 up to ~1e-16 rounding, either sign. max: >= 0 (max of a zero-mean series), grows with T for Gaussian data. sq-mean: in [0, (T-1)/T]. sq-max: >= sq-mean, >= 0. Never NaN for finite input. Labelled signed. Symmetric.'
  direction_convention: 'undirected: A[i,j] = A[j,i] bit-identical (shared cached barycenter); the barycenter is computed once from z[[max(i,j), min(i,j)]] and the Euclidean average is order-invariant anyway'
  symmetry_expected: sym
  already_documented: tests/README.md:147 tolerance table notes "bary_euclidean_mean ~1e-16" rounding noise (atol absorbs it); not listed in KNOWN_ISSUES.md; label/config discrepancies otherwise no
  new_finding_candidates:
  - 'Candidate: bary_euclidean_mean is structurally zero (not merely small) on the default pipeline, so it carries no information although it is in config.yaml and the EEG selection. Evidence: probe1 on bivariate_gaussian T=256 gives off-diagonal values -1.04e-17 .. 1.73e-17; z-scored rows have mean ~1e-17; numpy.average of two zero-mean rows has zero mean. The supplement''s seven-SPI list omits it (hypothesis: deliberately).'
  - 'Candidate: bary-sq_euclidean_mean equals (1+r)(T-1)/(2T) exactly, so it is a monotone transform of Pearson r and redundant with it. Evidence: probe1 pyspi matrix [0.647546, 0.479399, 0.477355, 0.489262, 0.465147, 0.907001] equals the formula to 6 decimals on bivariate_gaussian T=256.'
  - 'Candidate: label inconsistency, class is Directed+Signed with label "signed" while supplement/GitBook/config say "unsigned"; signed is the accurate label for the mean statistic (values of either sign), max statistics are non-negative here. Evidence: probe1 prints labels [..., "signed", ...] and issigned() True.'
  - 'Candidate: statistic "max_time" exists (distance.py:240-241) and is documented by GitBook but is absent from all configs; it returns numpy.int64 argmax (probe1: 229 for pair (0,1)), uses np.argmax not a nan-aware argmax, and is a time index rather than a dependence value.'
  - 'Candidate: under normalise=False the mean statistic becomes (mean x + mean y)/2, i.e. it measures offsets, not coupling (follows from euclidean.py:44); to be shown on scaled_offset with normalise=False.'
