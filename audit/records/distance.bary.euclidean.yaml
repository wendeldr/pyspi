  what_changed: 'The score 0 applies to the unit''s representative identifier bary_euclidean_mean (units.yaml representative; the CSV row carries that identifier next to the score), not to the barycenter calculation, which is fp-exact (bary_euclidean_max, the supplement''s SPI, rates 10 on its own). bary_euclidean_mean is in config.yaml and in the EEG selection and is identically zero on every pyspi preprocessing path that z-scores: mean_t (z_i + z_j)/2 = 0, observed |A| <= 2.52e-16 on all 21 datasets. The barycenter itself is the exact Euclidean Frechet mean (z_i + z_j)/2 and the other three identifiers are computed exactly as stated (fp-exact against independent numpy): bary-sq_euclidean_mean is the affine transform (1 + r)(T - 1)/(2T) of Pearson r (rtol 1.4e-15), so it duplicates Pearson correlation; bary-sq_euclidean_max is (max_t |z_i + z_j|/2)^2. With normalise=False the mean statistic becomes the average of the two offsets, not a coupling measure. Labels: the class is Signed while all documentation says unsigned. That mismatch is between the class label and the documents; whether the values take both signs does not decide it under the sign-meaning reading of the keyword that distance.softdtw adopts (GitBook glossary-of-terms.md:21, whether the sign indicates how A and B co-fluctuate; the same entry also mentions the range, so the glossary is mixed). Under README rule R1 the row''s score describes the representative identifier, which here is also the lowest-scoring one, and the other three identifiers are listed in identifier_exceptions (distance.softdtw has score_adjusted 9 on its representative under the same rule, with its constraint identifiers listed at 3). new_finding rests on the identification of the zero as structural and on the three other confirmed candidates (the Pearson affine duplicate, the Signed class, the offset average under normalise=False), not on the near-zero value itself, which tests/README.md:147 already records as rounding noise.'
