optimisation:
  complexity_P_T: 'O(P^2 T): per unordered pair tslearn euclidean_barycenter = (z_i + z_j)/2 plus a nanmean/nanmax, dominated by per-call Python
    overhead (to_time_series_dataset, backend sniffing). Measured P_exponent 2.04 (fit t_pair 0.21 ms), 118x1024 measured 1.52 s fresh; the T_exponent
    (-1.57) is an artefact of a ~50 ms fixed cost seen at 8x256 in several units. The P^2 per-pair overhead dominates at 118.'
  hotspot_1: tslearn/utils/utils.py:to_time_series_dataset (third-party:tslearn) 65.9% of the profiled SPI call at 8x1024 (16 ms total), of which
    tslearn/backend/backend.py:instantiate_backend 50.6% (numpy arrayprint str() of the input 45.1%)
  hotspot_2: numpy nanmean 13.4% and numpy average 12.7% (third-party:numpy), the actual arithmetic
  hotspot_owner: third-party:tslearn
  opaque_share: 0.2608
  profile_file: audit/profiles/distance.bary.euclidean__8x1024.pstats
  opportunities:
  - opportunity_id: barycenters-2
    opportunity: 'Vectorise over pairs: form (z_i + z_j)/2 for all i < j in one array and reduce each row with nanmean/nanmax (and of the square
      for bary-sq_*), skipping tslearn''s per-pair dataset conversion. bary_euclidean_mean is degenerate (score 0: on z-scored rows it is (mean
      z_i + mean z_j)/2, rounding noise around 0), so its optimisation is trivial.'
    opp_type: vectorise-batch
    expected_speedup: 30-100x
