unit_id: distance.bary.softdtw
status: profiled
correctness:
  metric_name_standard: Summary (time-mean or time-max) of the soft-DTW barycenter (gamma = 1) of two z-scored series; squared variant summarises its square
  canonical_ref: 'Cuturi & Blondel 2017, ICML, PMLR 70:894-903 (soft-DTW, §2 eq. 1-2 and barycenter §4 eq. 4, Alg. 1-2 forward/backward recursions); bias of soft-DTW (sdtw_gamma(x,x) != 0): Blondel, Mensch & Vert 2021, AISTATS, PMLR 130:3853-3861. Mean/max summary: pyspi construction.'
  canonical_definition: 'b* in argmin_b sum_k lambda_k dtw_gamma(b, x_k), dtw_gamma(b,x) = -gamma log sum_{A in paths} exp(-<A, Delta(b,x)>/gamma), Delta_ts = (b_t - x_s)^2; smooth and differentiable, recovers the DTW barycenter as gamma -> 0; SPI = mean_t b(t) or max_t b(t) (squared: of b(t)^2).'
  documented_definition: 'supplement §1.2.10, p.7 (supplement.txt lines 321-335): "A barycenter (or Fréchet mean) [21, 22] is a (univariate) time series that minimizes the sum of squared distances between MTS ... For each pair of (bivariate) time series ... we compute the raw barycenters then summarize them by taking their mean (modifier mean) and maximum (max), yielding seven SPIs" (keywords: undirected, nonlinear, unsigned, bivariate, time-dependent). GitBook distance-similarity.md:41-75 repeats this, adds "timepoint at which the maximum occurs (max_time)" and lists 12 identifiers bary_{euclidean,dtw,softdtw,sgddtw}_{mean,max,max_time}; neither source documents the squared (bary-sq_*) variants. Mode softdtw is documented as "alignment via a differential loss function"; supplement §1.2.9 (p.6-7) gives the soft-DTW default gamma = 1.'
  delegate_lib: tslearn==0.9.0 tslearn.barycenters.softdtw_barycenter (defaults gamma=1.0, weights=None -> ones, method="L-BFGS-B", tol=1e-3, max_iter=50, init = Euclidean barycenter) via scipy==1.17.1 scipy.optimize.minimize, numba soft-DTW kernels
  implemented_as: z-scored pair (ddof=1). Init b0 = (x+y)/2. Objective f(b) = sum_k sdtw_1(D(b,x_k)) with D squared Euclidean and unit (unnormalised) weights; gradient by the soft-DTW backward recursion and Jacobian 2(b_t - x_s)E_ts; scipy L-BFGS-B with ftol = gtol = 1e-3 and maxiter 50; res.x returned without checking res.success. gamma = 1 is fixed (pyspi exposes no parameter). Deterministic and order-invariant (probe2 order-diff 0). Then nanmean/nanmax of b or b**2.
  implementation_trace:
  - pyspi/statistics/distance.py:4-9 imports euclidean_barycenter, dtw_barycenter_averaging, dtw_barycenter_averaging_subgradient, softdtw_barycenter from tslearn.barycenters
  - pyspi/statistics/distance.py:211-215 class Barycenter(Directed, Signed); class labels ['distance','signed','undirected','temporal','nonlinear']
  - pyspi/statistics/distance.py:224-225 mode 'softdtw' -> self._fn = softdtw_barycenter
  - pyspi/statistics/distance.py:230-234 squared=True sets preproc x**2 and identifier prefix 'bary-sq'
  - 'pyspi/statistics/distance.py:236-243 statistic: mean -> np.nanmean(preproc(bc)); max -> np.nanmax(preproc(bc)); max_time -> np.argmax(preproc(bc)) (not in any config)'
  - pyspi/statistics/distance.py:245 identifier suffix _{mode}_{statistic}
  - 'pyspi/statistics/distance.py:247-263 bivariate: looks up data.barycenter[mode][(i,j)]; on miss z = data.to_numpy(squeeze=True); bc = self._fn(z[[i, j]]) with library defaults; caches bc under (i,j) AND (j,i) (line 261); returns statfn(bc)'
  - pyspi/base.py:27-48 parse_bivariate (wraps raw arrays in a Data object, default normalise=True)
  - 'pyspi/base.py:85-94 Directed.multivariate: j outer, i inner, A[i,j] = bivariate(i, j); the first call for pair {a<b} is (i=b, j=a), so the cached barycenter is computed from z[[b, a]] and reused for A[a,b]'
  - pyspi/data.py:59-71 Data defaults detrend=False, normalise=True; pyspi/data.py:184-195 optional scipy detrend then zscore(axis=1, ddof=1)
  - pyspi/data.py:108-116 to_numpy(squeeze=True) -> (P, T) array
  - pyspi/calculator.py:252-266 configs instantiated as Barycenter(**params); spi.labels come from the class (config labels at pyspi/config.yaml:256-261 are not applied); pyspi/calculator.py:329 every SPI's multivariate() receives the same self.dataset, so all statistics/squared variants of one mode share one cached barycenter per pair
  - 'pyspi/config.yaml:255-311 Barycenter configs: 4 modes x {mean,max} x {squared False, True} = 16 identifiers'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/utils.py:7-13 _set_weights(None, 2) -> numpy.ones(2) (unnormalised uniform weights)
  - '.venv/lib/python3.12/site-packages/tslearn/utils/utils.py:215 to_time_series_dataset: (2, T) -> (2, T, 1)'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/softdtw.py:38-39 softdtw_barycenter(X, gamma=1.0, weights=None, method='L-BFGS-B', tol=1e-3, max_iter=50, init=None)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/softdtw.py:94-99 to_time_series_dataset, _set_weights -> ones, init = euclidean_barycenter
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/softdtw.py:106-115 minimize(f, b0, method, jac=True, tol=tol, options=dict(maxiter=max_iter)); returns res.x (no success check)
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/softdtw.py:19-35 _softdtw_func: obj = sum_i w_i SoftDTW(SquaredEuclidean(Z, X_i), gamma).compute(); G = sum_i w_i D.jacobian_product(sdtw.grad())'
  - .venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:1068-1135 SoftDTW.__init__/compute (R_[m, n] from _njit_soft_dtw)
  - .venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:1137-1173 SoftDTW.grad (_njit_soft_dtw_grad, returns E[1:-1, 1:-1])
  - .venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:1176-1216 SquaredEuclidean.compute = pairwise_euclidean_distances(X, Y)**2; 1218-1240 jacobian_product
  - .venv/lib/python3.12/site-packages/tslearn/metrics/soft_dtw_fast.py:15-39 _njit_softmin3 (soft-min with gamma); 101-125 _njit_soft_dtw forward recursion R[i,j] = D[i-1,j-1] + softmin(R[i-1,j], R[i-1,j-1], R[i,j-1])
  - .venv/lib/python3.12/site-packages/tslearn/metrics/soft_dtw_fast.py:205-234 _njit_soft_dtw_grad backward recursion for E
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/soft_dtw_fast.py:318-340 _njit_jacobian_product_sq_euc: G[i,k] += E[i,j]*2*(X[i,k]-Y[j,k])'
  - .venv/lib/python3.12/site-packages/scipy/optimize/_minimize.py:677-681 tol -> options ftol and gtol for L-BFGS-B
  deviation_from_documented: Documented keyword "unsigned", but the class is Signed (issigned() True, class label "signed"); the config labels (undirected, nonlinear, unsigned, bivariate, time-dependent) are never attached to the SPI (calculator.py:252-266 uses class labels). Documented "undirected", but the class inherits Directed; symmetry comes only from the per-Data cache writing (j,i) = (i,j) (distance.py:261), not from Undirected.multivariate mirroring. Supplement says "seven SPIs" (lists euclidean_max, dtw_mean/max, softdtw_mean/max, sgddtw_mean/max); config computes 16, including bary_euclidean_mean and all eight bary-sq_* variants, none of which are documented; GitBook lists max_time variants that exist in code (distance.py:240-241) but are absent from every config. gamma = 1 is the stated soft-DTW default (§1.2.9) and is used here. bary-sq_softdtw_* undocumented.
  deviation_from_canonical: 'Objective and gradient follow Cuturi & Blondel 2017. Practical deviations: gamma = 1 is large relative to the per-sample squared differences of z-scored data, so the barycenter is strongly smoothed and shrunk toward 0; soft-DTW is not a divergence (sdtw_gamma(x,x) < 0, != 0), so the barycenter of identical series is not that series. Probe3: softdtw barycenter of (x, x) has max|b-x| = 1.249, var(b) = 0.704 vs var(x) = 0.996 (DBA returns x exactly). Probe2 narrowband_f0-0.25: max(b) = 0.83-0.86 vs 1.31-1.34 for DBA. Optimiser tolerance 1e-3 (relative function reduction) is loose; in probes all runs converged (nit 4-13, success True). Mean/max summaries are pyspi-defined.'
  units_and_range: 'z-score units. mean: small, either sign (probe2 -0.0243 .. 0.0036 across 9 runs). max: positive, systematically smaller than the DBA/Euclidean max. sq variants >= 0. Objective values negative (probe2 -84 .. -1669). Finite for finite input. Symmetric.'
  direction_convention: 'undirected: A[i,j] = A[j,i] bit-identical via the cache; the routine is order-invariant (Euclidean init and symmetric objective; probe2 order-diff 0)'
  symmetry_expected: sym
  already_documented: no (tests/README.md bug 3 concerns the SoftDynamicTimeWarping distance class ignoring global_constraint, not this barycenter; Barycenter exposes no constraint)
  new_finding_candidates:
  - 'Candidate: with gamma = 1 on z-scored data the soft-DTW barycenter is biased (shrunk/smoothed), so bary_softdtw_max is systematically lower than the DTW-barycenter max and the barycenter of two identical series differs from the series. Evidence: probe3 max|b-x| = 1.249, var(b) 0.704 vs 0.996; probe2 narrowband max 0.834 (T=64) vs DBA 1.336; consistent with Blondel et al. 2021 (soft-DTW is not a divergence).'
  - 'Candidate: optimiser tolerance tol=1e-3 (ftol/gtol) and max_iter=50 with no success check (softdtw.py:113-115) could return a non-converged barycenter for long series; not observed in probes (success True, nit <= 13 for T <= 1024), to be checked at T=4096.'
  - 'Candidate: cost: each objective evaluation is O(T^2) per series; probe2 timing 2.5-3.3 s per pair at T=1024, which makes this the dominant barycenter cost (relevant to optimisation stage).'
  - 'Candidate: label inconsistencies and undocumented bary-sq_softdtw_* identifiers, see deviation_from_documented.'
