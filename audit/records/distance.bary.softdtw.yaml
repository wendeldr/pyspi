  closeness: 'From-scratch soft-DTW barycenter vs pyspi: statistics 19/19 pass, max_abs 3.7e-13, max_rel 2.4e-13 (*|sdtw|*; L-BFGS-B took 4-12 iterations, all success); raw barycenters 4/4, max_abs 7.0e-14; objective and gradient at the Euclidean init 4/4, max_abs 2.8e-13; tslearn gradient vs central differences 2/2, max_abs 2.4e-8. Optimality (*|opt|*) FAILS on bivariate_gaussian and delayed_noise at every T: relative objective gap to the local minimum reached by a converged L-BFGS-B re-optimisation from pyspi''s point 2.2e-5 to 0.0138 (T=64), 2.5e-4 to 0.0058 (T=256), 0.00118 and 0.00313 (T=1024 pair [0,1], 48 and 49 iterations); every T=64/256/1024 re-optimisation reached scipy''s convergence test (reopt_converged 1, final max|grad| <= 1.6e-4); at T=4096 only a lower bound, >= 0.00103 from one Armijo step along -grad (no re-optimisation, so the distance to the nearby minimum at T=4096 is not measured); max|grad(b)|/max|grad(b0)| 0.02-0.27; re-optimisation moves bary_softdtw_max by up to 0.051 and bary_softdtw_mean by up to 0.030 (bivariate_gaussian T=64 pair (2,3)). narrowband_f0-0.25 passes at T=64/256/1024 (gap <= 6.0e-5). Identical series (x, x), raw input, gamma=1: pyspi barycenter equals the reference to 7.3e-14 and is shrunk: iid_gaussian max|b - x| 1.315, var(b) 0.732 vs var(x) 1.015; narrowband_f0-0.25 var(b) 0.0036 vs 0.511 and max(b) 0.312 vs max(x) 1.142. gamma sweep 1 / 0.1 / 0.01: max|b - x| 1.315 / 0.234 / 0.022 (iid) and 1.136 / 0.0015 / 0 (narrowband). Symmetry: max|A - A.T| = 0 on the four direction datasets; cold-cache ordered pairs (delayed_noise T=64) match the reference to 4.1e-12 with max|M - M.T| = 0.'
