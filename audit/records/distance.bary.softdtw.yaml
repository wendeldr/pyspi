    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: objective and gradient at b0 match tslearn to rtol 1e-10; final barycenter statistics match pyspi to rtol 1e-6 at T=64 and 256 (optimiser path sensitivity may cause small differences)
