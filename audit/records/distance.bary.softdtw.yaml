optimisation:
  complexity_P_T: 'O(P^2 n_eval T^2): one soft-DTW barycenter per unordered pair, scipy L-BFGS-B (maxiter 50, ftol/gtol 1e-3) where each objective
    evaluation runs two soft-DTW forward and backward passes (304 evaluations for 28 pairs at 8x1024, about 11 per pair). Measured T_exponent
    1.75 (8x256 4.99 s -> 8x1024 56.1 s); never run above 8x1024, projected by pair count (13831 s).'
  hotspot_1: tslearn/metrics/softdtw_variants.py:SoftDTW.grad (third-party:tslearn) 56.8% cumulative, 50.7% self time of the profiled SPI call
    at 8x1024 (numba backward recursion hidden)
  hotspot_2: tslearn/metrics/softdtw_variants.py:SoftDTW.compute (third-party:tslearn) 28.6% (numba forward recursion hidden)
  hotspot_owner: third-party:tslearn
  opaque_share: 0.0584
  profile_file: audit/profiles/distance.bary.softdtw__8x1024.pstats
  opportunities:
  - opportunity_id: barycenters-3
    opportunity: Fuse the squared-Euclidean cost matrix and its Jacobian product into the objective kernel (tslearn/barycenters/softdtw.py:_softdtw_func
      builds both through sklearn euclidean_distances, astype casts, vstack/hstack per evaluation). The two soft-DTW recursions (85%) stay; beyond
      that only process-level pair parallelism remains.
    opp_type: rewrite-numba-rust-cpp
    expected_speedup: ~1.2x
    speedup_basis: profile:audit/profiles/distance.bary.softdtw__8x1024.pstats astype 4.7% + safe_sparse_dot 3.8% + vstack 3.0% + hstack 2.4%
      + jacobian_product 1.1% + sklearn in-place 1.0% = about 16% (Amdahl 1.19x)
    output_risk: unverified-within-tolerance
    risk_evidence: a direct (b_t - x_s)^2 differs from sklearn's expansion by rounding; L-BFGS-B with ftol 1e-3 can amplify that into a different
      stopping iterate (the check stage found the returned point is not at the optimum)
    effort: M
    depends_on:
    - xc-window-parallel
