  what_changed: 'Objective, gradient and the optimiser path are reproduced exactly (the soft-DTW code in tslearn is Blondel''s; independent reference to 1e-13). Two value-changing properties: (1) tslearn calls L-BFGS-B with tol=1e-3 (ftol = gtol) and maxiter 50 and returns res.x without checking convergence; on Gaussian and delayed pairs it stops 0.02-1.4% above the attainable objective, which moves bary_softdtw_max by up to 0.05 and bary_softdtw_mean by up to 0.03 at T=64 (narrowband pairs converge). (2) With gamma = 1 on z-scored or raw data, the soft-DTW barycenter is strongly smoothed and shrunk (the barycenter of (x, x) is not x; a raw sinusoid collapses to var 0.0036 from 0.511). This follows from the soft-DTW definition (soft-DTW is not a divergence), so it is a property of the canonical quantity with gamma = 1, not an implementation error, but it makes bary_softdtw_max a different quantity from the DTW-barycenter max that the supplement''s wording (''minimizes the sum of squared distances'') suggests.'
