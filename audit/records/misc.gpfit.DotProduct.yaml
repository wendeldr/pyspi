  deviation_from_documented: "(a) The documented values (sigma_0 = 1, constant 1.0, noise level 1) are only the starting point; all three hyperparameters\
    \ are re-estimated per pair by maximising the log marginal likelihood within [1e-5, 1e5]. Fitted values differ from the documented ones: constant\
    \ and sigma_0 sit at the 1e-5 lower bound in every probe and the noise level is about 1 - r^2 (e.g. 0.91, 0.326, 0.093). (b) Documented as\
    \ 'nonparametric' and keyword 'nonlinear' (also class label, misc.py:132): the dot-product kernel GP is Bayesian linear regression (R&W \xA7\
    2.1), so the fit is linear and the value is a function of Pearson r and T only (candidate below). (c) Documented as 'directed': the value\
    \ is symmetric to <= 8.1e-15 absolute on every probed dataset, so the direction is nominal under default preprocessing. (d) 'MSE of their\
    \ fit' is the in-sample (training) MSE of the posterior mean, which the text implies but does not state."
  deviation_from_canonical: "(1) The constant and sigma_0 terms are redundant (both add a constant to the covariance), so the model has two non-identifiable\
    \ hyperparameters. Under z-scoring both are irrelevant and go to the lower bound. (2) The slope prior variance is fixed at 1 (no amplitude\
    \ hyperparameter), so the slope is ridge-shrunk by (T-1)/(T-1+s); the shrinkage is O(1/T) and invisible at T >= 64. (3) The score is the training\
    \ MSE of the posterior mean, not a held-out or leave-one-out predictive error (R&W \xA75.4.2) and not a likelihood. Within the GP framework\
    \ the computation is otherwise standard: the MSE of an own posterior mean at the fitted hyperparameters reproduces sklearn's MSE to <= 1.9e-15\
    \ absolute (the posterior-mean vectors themselves agree elementwise to <= 1.1e-13; 24 DotProduct pairs)."
  units_and_range: 'squared units of the target (SD^2 after z-scoring); >= 0; under default z-scoring about ((T-1)/T)(1 - r^2), so in [0, (T-1)/T]
    (observed 1.5e-15 for the bit-identical copy pair in shared_envelope to 0.996 for independent pairs at T=256); scale-dependent when normalise=False
    (scaled_offset_T256 raw: 0.036 to 97.3); symmetric in practice (|A - A^T| <= 8.1e-15); NaN matrix if the Cholesky fails.'
  direction_convention: 'A[i, j] = MSE of predicting process j (target, np.ravel(z[j])) from process i (input, z[i]), from misc.py:145-147 and
    base.py:91-93. Lower means i linearly predicts j better. For this kernel A[i, j] = A[j, i] to rounding under default preprocessing, so the
    convention is not observable from the values under z-scoring; confirmed in the check stage on raw data (misc.gpfit.DotProduct|scaled_offset|256|kernel|direction:
    A[i, j] scales with var(x_j)).'
  symmetry_expected: sym
  already_documented: 'no (label structure in general: docs/storage_comparison/REVIEW.md M9)'
  new_finding_candidates:
  - 'Candidate (DotProduct is a linear, symmetric statistic, a function of Pearson r): the score equals mean((y - b x)^2) with b = x''y/(x''x
    + s) to <= 3e-14 relative (probe: bivariate_gaussian_T64 0->1 0.8107422442473634 vs closed form 0.8107422442473563; anm_T256 0.333256243521899
    vs 0.333256243521898) and ((T-1)/T)(1 - r^2) to <= 6.2e-5 relative at T=64 and <= 3.8e-6 at T=256 across 18 datasets; max |A - A^T| <= 8.1e-15
    everywhere. On nonlinear_dependence_T256 (x1 = x0^2 + noise) all entries are 0.994-0.996, the same as for independent pairs. The labels ''nonlinear''
    and ''directed'' and the word ''nonparametric'' are therefore not borne out; the unit carries the same information as 1 - r^2 (and as lmfit,
    see misc.lmfit.* records).'
  - 'Candidate (hyperparameters at bounds, warnings hidden): in every probed fit the optimiser drives constant_value and sigma_0 to the 1e-5 lower
    bound (sklearn emits two ''The optimal value found for dimension 0 of parameter ... is close to the specified lower bound'' warnings per fit;
    misc.py:143-145 suppresses them). Harmless for the value under z-scoring (the intercept direction is orthogonal to y), but the documented
    ''constant of 1.0'' and ''sigma_0 = 1'' never apply.'
  - 'Candidate (random_state is a no-op and the result is deterministic): n_restarts_optimizer=0, so the RNG at _gpr.py:251 is never drawn (only
    used at :322-333); probe with 15 restarts reaches the same LML and MSE as the single start for every DotProduct pair tested (the objective
    has a single effective hyperparameter).'
