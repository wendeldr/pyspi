  what_changed: 'The estimator matches canonical GP regression with ML-II hyperparameters. With Constant + White + DotProduct, the GP is Bayesian linear regression,
    and pyspi''s value is the in-sample MSE of the posterior mean at the type-II ML hyperparameters. The deciding reference is independent: on the default
    (z-scored) path pyspi equals an independent global ML-II optimum (blr_ml2, numpy/scipy only, no sklearn) to <= 2.4e-9 relative (8/8 pipeline scratch runs).
    The analytic ridge form (ridgecf) and the own Cholesky posterior (posterior, postmean) reproduce pyspi to <= 2.0e-13, but they take sklearn''s fitted
    theta, so they check the posterior algebra and not the hyperparameter fit; the analytic closed form ((T-1)/T)(1 - r^2) agrees only to <= 6.1e-5 (T=64).
    Score mapping: on the default path the numeric half of anchor 10 is met (2.4e-9 <= 1e-8 relative against an independent reference) and its second half,
    ''matches the pyspi supplement description'', fails, because the supplement misdescribes the computation (§1.6.2; (a) and (b) below). None of the anchor-9
    clauses names this case literally: it is not a trivial value convention (squared vs not, ddof, log base, sign), not a tolerance set by estimator variance,
    and not a MATLAB/author reference. The README has no anchor for ''canonical computation reproduced, supplement wrong''; 9 is the nearest-anchor reading (README "Score columns: original, rubric reading, adjusted") for that
    case (the highest score below the one anchor-10 condition that fails), applied the same way to misc.coint.johansen_order-0_* and distance.hhg. (a) The
    documented values sigma_0 = 1, constant 1 and noise 1 are only starting points and are fitted. Holding them fixed changes the value by <= 9.2e-6 at T=256
    and <= 1.5e-4 at T=64 on bivariate_gaussian (fixedhp runs); the fixed version is the ridge (alpha = 1) fit. The two versions separate only on correlated
    pairs: the fitted noise level is about 1 - r^2, which is close to the documented 1 when r is near 0. On near-independent pairs the fixed version agrees
    with pyspi to 1.5e-10 relative (nonlinear_dependence T256, all |r| <= 0.05), inside rtol 1e-8; correlated pairs separate it by 4.7e-4 (bivariate_gaussian
    T64), 1.5e-4 (anm T256) and 7.4e-6 (EEG 001_Baseline, 3 channels, T256) (scratch probe wf4b2_high-optimiser-other/p_gpfit.py). The fixedhp runs use bivariate_gaussian,
    whose pair correlations run from 0.06 to 0.83 at T64 (|r| 0.058-0.827) and from 0.02 to 0.82 at T256 (|r| 0.018-0.821); both datasets contain strongly correlated pairs, so they do separate the two versions. (b) The labels nonlinear and directed, and the word ''nonparametric'',
    do not describe the computation. The value is ((T-1)/T)(1 - r^2) to <= 6.1e-5 relative, symmetric to <= 8.1e-15, and blind to x1 = x0^2 (0.995776 both
