unit_id: misc.gpfit.DotProduct
status: profiled
correctness:
  metric_name_standard: in-sample mean squared residual of the posterior mean of a Gaussian-process regression of y on x with a dot-product (linear)
    covariance, constant and white-noise terms, hyperparameters chosen by type-II maximum likelihood; equivalently the training MSE of a Bayesian
    linear regression of y on x with an N(0, 1) slope prior
  canonical_ref: "Williams & Rasmussen 1996, NIPS 8:514-520 (supplement ref [78], cited as 1995); Rasmussen & Williams 2006, Gaussian Processes\
    \ for Machine Learning, MIT Press: Alg. 2.1 (p.19, posterior mean f_bar = K_*^T (K + sigma_n^2 I)^-1 y), \xA72.1 eqs. 2.8-2.11 (weight-space\
    \ Bayesian linear regression, posterior mean w_bar = sigma_n^-2 A^-1 X y with A = sigma_n^-2 X X^T + Sigma_p^-1), \xA74.2.2 (dot-product covariance\
    \ k = sigma_0^2 + x.x'), \xA75.4.1 eqs. 5.8-5.9 (log marginal likelihood and its gradient, ML-II). There is no canonical pairwise \"GP fit\
    \ MSE\" statistic; the canonical object is the GP posterior mean and its residual."
  canonical_definition: 'With k(x, x'') = c + sigma_0^2 + x x'' and noise variance s chosen by maximising log p(y | x, theta), the posterior mean
    is f_bar = K_f (K_f + s I)^-1 y; the score would be (1/T) sum_t (y_t - f_bar_t)^2. For one input this is Bayesian linear regression: slope
    posterior mean b = x''y / (x''x + s) (unit slope prior), intercept prior variance c + sigma_0^2.'
  documented_definition: "supplement \xA71.6.2, p.18: 'we also use Gaussian process [78] model fits as a nonparametric measure of influence of\
    \ x on y. Here, we use a combination of kernels (with parameters chosen from default settings) from the scikit-learn package [2] and compute\
    \ the MSE of their fit. The fits are computed for the dot-product kernel with inhomogenity parameter sigma_0 = 1 (DotProduct) ... Each of\
    \ these kernels are separately combined with the constant kernel (with a constant of 1.0) and the white kernel (with a noise level of 1)';\
    \ keywords 'directed, nonlinear, unsigned, bivariate, contemporaneous'. GitBook spi-descriptions/miscellaneous.md lines 46-63 repeat the text\
    \ verbatim and cite Williams & Rasmussen (WilRas96.pdf)."
  delegate_lib: scikit-learn==1.9.1 sklearn.gaussian_process.GaussianProcessRegressor.fit/predict with kernel ConstantKernel() + WhiteKernel()
    + DotProduct(); hyperparameters by scipy==1.17.1 scipy.optimize.minimize(method='L-BFGS-B'); score by sklearn.metrics.mean_squared_error
  implemented_as: 'A[i, j] = mean((f_bar - z_j)^2) where f_bar is the GP posterior mean at the training inputs z_i (in-sample, not held out),
    on z-scored (ddof=1) data. Kernel = ConstantKernel(1.0) + WhiteKernel(1.0) + DotProduct(sigma_0=1.0), each with bounds (1e-5, 1e5); the documented
    values 1.0 are only the L-BFGS-B starting point theta = (0, 0, 0) in log space. One optimiser run, n_restarts_optimizer=0, alpha = 1e-10 jitter,
    normalize_y=False, random_state=None (unused). The white term enters K(X, X) for the likelihood and the solve but not K(X_test, X_train) (kernels.py:1419
    returns zeros), so the prediction is the de-noised posterior mean, not an interpolant. Because z-scored inputs and targets have zero mean
    and x''x = y''y = T - 1, the constant and sigma_0 terms do not affect the prediction and are driven to their 1e-5 lower bounds (probe: fitted
    ''0.00316**2 + WhiteKernel(noise_level=0.91) + DotProduct(sigma_0=1e-05)'' on bivariate_gaussian_T256 0->1), leaving one effective hyperparameter
    s. The result equals the closed form mean((z_j - b z_i)^2) with b = z_i''z_j / (z_i''z_i + s) to <= 3e-14 relative (4 probes), i.e. approximately
    ((T-1)/T)(1 - r_ij^2) (max relative difference 6.2e-5 at T=64, 3.8e-6 at T=256 over 18 datasets). Fit warnings (bound ConvergenceWarnings)
    are suppressed by pyspi.'
