optimisation:
  complexity_P_T: 'O(P^2 n_eval T^3): one sklearn GaussianProcessRegressor fit per ordered pair (pyspi/statistics/misc.py:139-147), each L-BFGS-B evaluation a Cholesky plus cho_solve(L, eye) on T x T (898 evaluations for 56 pairs at 8x256). Measured T_exponent 2.81 (8x256 -> 8x1024: 2.66 s -> 131.7 s); P not measured (infeasible above 8x1024). The O(T^3) term dominates; projected 32,461 s per window at 118x1024 (extrapolated-pairs-from-8).'
  hotspot_1: scipy/linalg/_decomp_cholesky.py:_cho_solve (third-party:scipy, from sklearn _gpr.py:log_marginal_likelihood) 33.5% of the profiled SPI call at 8x256 (1,852 calls; log_marginal_likelihood 91.2% cumulative over 898 evaluations)
  hotspot_2: scipy/linalg/_decomp_cholesky.py:_cholesky (third-party:scipy) 17.0% of the profiled SPI call at 8x256; numpy dstack (gradient tensor) 10.7%, c_einsum 9.3%
  hotspot_owner: third-party:sklearn
  opaque_share: 0.172
  profile_file: audit/profiles/misc.gpfit.DotProduct__8x256.pstats
  opportunities:
  - opportunity_id: gpfit-1
    opportunity: 'Constant + White + DotProduct is Bayesian linear regression: K = (c + sigma_0^2) 11^T + x x^T + w I is rank two plus a diagonal, so the ML-II objective, its gradient, the posterior-mean prediction (linear in x) and the in-sample MSE all follow from six per-pair sufficient statistics (T, sums of x, x^2, y, xy, y^2, from one Gram product per window). Replace the whole per-pair fit/predict/mean_squared_error loop (pyspi/statistics/misc.py:139-147) by one vectorised optimiser over all 13,806 two-parameter objectives.'
    opp_type: algorithmic
    expected_speedup: 1000-10000x
    speedup_basis: 'profile:audit/profiles/misc.gpfit.DotProduct__8x256.pstats base.py:multivariate 99.998% (the pair loop, replaced as a whole: _gpr.py:fit 98.2% with log_marginal_likelihood 91.2% over 898 evaluations for 56 pairs, _cho_solve 33.5%, _cholesky 17.0%; predict 0.55%, mean_squared_error 0.68%) -> Amdahl bound ~5e4x at 8x256, higher at 118x1024 + complexity: O(T^3) per evaluation (T_exponent 2.81; 32,461 s / 13,806 = 2.35 s per ordered pair at 118x1024) becomes O(T) moments per pair plus O(1) per evaluation; the 1000-10000x range assumes the batched optimiser (about 3-30 s per window); a per-pair scipy L-BFGS-B over the O(1) objective (about 10 ms per pair, estimate) would give only about 200x'
    output_risk: unverified-within-tolerance
    risk_evidence: 'same ML-II objective, different optimiser path; c and sigma_0^2 enter only as their sum, so only (c + sigma_0^2, w) matter; check stage: pyspi equals an independent global ML-II optimum (blr_ml2, no sklearn) to <= 2.4e-9 on the default path'
    effort: M
    depends_on: []
  - opportunity_id: gpfit-2
    opportunity: Run the ordered-pair sklearn GaussianProcessRegressor fits (anm, gpfit) in a process pool with one BLAS thread per worker.
    opp_type: parallel
    speedup_kind: throughput
    expected_speedup: 10-30x alone (at most ~4x inside a window worker)
    speedup_basis: 'profile:audit/profiles/misc.gpfit.DotProduct__8x256.pstats base.py:multivariate 100.0% is the pair loop (sklearn _gpr.py:fit 98.2%) + complexity: 13,806 independent O(T^3) fits per window at P=118; the speedup is at most the number of physical cores (32 on the Threadripper 3970X, 64 logical CPUs; SMT adds little to Cholesky/BLAS-bound fits, and 32 concurrent 8 MB kernel matrices exceed the shared L3), per-window latency only with no core-hour saving; window-level parallelism (xc-window-parallel) competes for the same cores; the two are alternatives for those cores, not factors that multiply, so xc-window-parallel is not in depends_on: with the ~8 memory-bounded window workers running, about 4 physical cores per worker remain, so inside a window worker this pool lowers the unit''s latency by at most about 4x'
