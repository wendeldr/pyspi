optimisation:
  complexity_P_T: 'O(P^2 n_epoch T^2): one subgradient (SSG) barycenter per unordered pair (cached on Data), each epoch two numba DTW paths and
    dense T x T path matrices, with rng.permutation from the global numpy RNG per epoch. Measured P_exponent 2.08, T_exponent 2.20; 118x1024 projected
    from 32 by pair count (581 s). The pair term dominates.'
