unit_id: distance.bary.sgddtw
status: profiled
correctness:
  metric_name_standard: Summary (time-mean or time-max) of the DTW barycenter of two z-scored series estimated by stochastic subgradient descent; squared variant summarises its square
  canonical_ref: 'Schultz & Jain 2018, Pattern Recognit. 74:340-358 (stochastic subgradient mean algorithm; Alg. 3 in arXiv:1701.06393v1, where Alg. 1 is the batch subgradient mean and Alg. 2 the majorize-minimize mean) for the DTW Fréchet function; Petitjean et al. 2011, Pattern Recognit. 44:678 (DBA). Mean/max summary: pyspi construction.'
  canonical_definition: 'b* in argmin_b F(b) = (1/n) sum_k DTW(b, x_k)^2; SSG: for k in a random order, b <- b - eta * 2 (V_k b - W_k x_k) with (V_k, W_k) from the optimal warping path of x_k to b, step size decreasing; SPI = mean_t b(t) or max_t b(t) (squared: of b(t)^2).'
  documented_definition: 'supplement §1.2.10, p.7 (supplement.txt lines 321-335): "A barycenter (or Fréchet mean) [21, 22] is a (univariate) time series that minimizes the sum of squared distances between MTS ... For each pair of (bivariate) time series ... we compute the raw barycenters then summarize them by taking their mean (modifier mean) and maximum (max), yielding seven SPIs" (keywords: undirected, nonlinear, unsigned, bivariate, time-dependent). GitBook distance-similarity.md:41-75 repeats this, adds "timepoint at which the maximum occurs (max_time)" and lists 12 identifiers bary_{euclidean,dtw,softdtw,sgddtw}_{mean,max,max_time}; neither source documents the squared (bary-sq_*) variants. Mode sgddtw is documented as "alignment via a subgradient descent algorithm".'
  delegate_lib: tslearn==0.9.0 tslearn.barycenters.dtw_barycenter_averaging_subgradient (defaults max_iter=30, initial_step_size=0.05, final_step_size=0.005, tol=1e-5, random_state=None -> numpy global RandomState via sklearn 1.9.1 check_random_state)
  implemented_as: 'z-scored pair (ddof=1). Init b0 = (x+y)/2. Each epoch: rng.permutation(2) from the global numpy RNG; for each series k: DTW path b->x_k, b <- b - 2*eta*(V_k*b - W_k x_k) (wi.sum() = 1). eta decreases by (0.05-0.005)/2 after each sample during epoch 0 only, then stays 0.005. After each epoch the variable "cost" holds only the LAST processed series'' dist^2 * weights[0]/sum(weights) (half its squared DTW); stop if |cost_prev - cost| < 1e-5 or cost > cost_prev (ConvergenceWarning). Result depends on the global numpy RNG state and on input order; within a Calculator run the four sgddtw identifiers share one cached barycenter per pair. Then nanmean/nanmax of b or b**2.'
  implementation_trace:
  - pyspi/statistics/distance.py:4-9 imports euclidean_barycenter, dtw_barycenter_averaging, dtw_barycenter_averaging_subgradient, softdtw_barycenter from tslearn.barycenters
  - pyspi/statistics/distance.py:211-215 class Barycenter(Directed, Signed); class labels ['distance','signed','undirected','temporal','nonlinear']
  - pyspi/statistics/distance.py:222-223 mode 'sgddtw' -> self._fn = dtw_barycenter_averaging_subgradient (no random_state passed)
  - pyspi/statistics/distance.py:230-234 squared=True sets preproc x**2 and identifier prefix 'bary-sq'
  - 'pyspi/statistics/distance.py:236-243 statistic: mean -> np.nanmean(preproc(bc)); max -> np.nanmax(preproc(bc)); max_time -> np.argmax(preproc(bc)) (not in any config)'
  - pyspi/statistics/distance.py:245 identifier suffix _{mode}_{statistic}
  - 'pyspi/statistics/distance.py:247-263 bivariate: looks up data.barycenter[mode][(i,j)]; on miss z = data.to_numpy(squeeze=True); bc = self._fn(z[[i, j]]) with library defaults; caches bc under (i,j) AND (j,i) (line 261); returns statfn(bc)'
  - pyspi/base.py:27-48 parse_bivariate (wraps raw arrays in a Data object, default normalise=True)
  - 'pyspi/base.py:85-94 Directed.multivariate: j outer, i inner, A[i,j] = bivariate(i, j); the first call for pair {a<b} is (i=b, j=a), so the cached barycenter is computed from z[[b, a]] and reused for A[a,b]'
  - pyspi/data.py:59-71 Data defaults detrend=False, normalise=True; pyspi/data.py:184-195 optional scipy detrend then zscore(axis=1, ddof=1)
  - pyspi/data.py:108-116 to_numpy(squeeze=True) -> (P, T) array
  - pyspi/calculator.py:252-266 configs instantiated as Barycenter(**params); spi.labels come from the class (config labels at pyspi/config.yaml:256-261 are not applied); pyspi/calculator.py:329 every SPI's multivariate() receives the same self.dataset, so all statistics/squared variants of one mode share one cached barycenter per pair
  - 'pyspi/config.yaml:255-311 Barycenter configs: 4 modes x {mean,max} x {squared False, True} = 16 identifiers'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/utils.py:7-13 _set_weights(None, 2) -> numpy.ones(2) (unnormalised uniform weights)
  - '.venv/lib/python3.12/site-packages/tslearn/utils/utils.py:215 to_time_series_dataset: (2, T) -> (2, T, 1)'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:740-752 signature (max_iter=30, initial_step_size=.05, final_step_size=.005, tol=1e-5, random_state=None)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:838 rng = check_random_state(random_state)
  - .venv/lib/python3.12/site-packages/sklearn/utils/validation.py:1455,1477-1478 check_random_state(None) returns np.random.mtrand._rand (global RNG)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:841-846 to_time_series_dataset, _set_weights, init b0 = _init_avg (Euclidean mean)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:857-858 epoch loop, shuffled_indices = rng.permutation(n)
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:860-863 _mm_assignment(Xi, barycenter, weights, metric_params): single series but full weights vector, cost = dist^2*weights[0]/weights.sum()'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:864-868 _subgradient_valence_warping(list_p_k, T, wi)
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:871-873 _subgradient_update_barycenter(Xi, V, W, wi.sum(), barycenter, eta)
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:437-482 update: delta = V_k*b - W_k x_k; b -= (2*eta/weights_sum)*delta (in place)'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:874-875 step size decreases only while it == 0
  - '.venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:876-883 stopping on last-sample cost: abs change < tol -> break; increase -> ConvergenceWarning and break'
  - .venv/lib/python3.12/site-packages/tslearn/barycenters/dba.py:229-305 _mm_assignment; .venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:325-344, 415-443 DTW path (squared local cost)
  deviation_from_documented: 'Documented keyword "unsigned", but the class is Signed (issigned() True, class label "signed"); the config labels (undirected, nonlinear, unsigned, bivariate, time-dependent) are never attached to the SPI (calculator.py:252-266 uses class labels). Documented "undirected", but the class inherits Directed; symmetry comes only from the per-Data cache writing (j,i) = (i,j) (distance.py:261), not from Undirected.multivariate mirroring. Supplement says "seven SPIs" (lists euclidean_max, dtw_mean/max, softdtw_mean/max, sgddtw_mean/max); config computes 16, including bary_euclidean_mean and all eight bary-sq_* variants, none of which are documented; GitBook lists max_time variants that exist in code (distance.py:240-241) but are absent from every config. Not stated in the supplement or GitBook: results are stochastic (global numpy RNG, no seed exposed); the RNG dependence itself is documented in tests/README.md:134/146. bary-sq_sgddtw_* undocumented.'
  deviation_from_canonical: 'Update rule is SSG (Schultz & Jain 2018; arXiv:1701.06393v1 Alg. 3, line 8) except that tslearn steps by 2*eta where Alg. 3 steps by eta, with a step size falling 0.05 -> 0.005 over the first epoch then constant. The stopping rule is not a test on F(b): it compares the per-sample cost of whichever series happened to be processed last in two consecutive epochs, so any increase in that noisy quantity stops the descent. Probe4: bivariate_gaussian T=256 stops after 4 epochs (last-sample costs 35.05, 28.16, 27.89, 31.23) with F(b)=57.77, while 30 uninterrupted epochs reach 50.26 and MM-DBA reaches 44.69; delayed_noise T=1024 stops with F=331.46 vs 185.01 uninterrupted and 135.86 for MM-DBA. The barycenter is therefore an under-converged estimate of the DTW Fréchet mean. Mean/max summaries are pyspi-defined.'
  units_and_range: 'z-score units. mean: near 0, either sign; the trace-stage bound 0.0162 held only for the nine single pairs of trace probe2. Check runs (max over pairs of |bary_sgddtw_mean|): 0.0012-0.0128 on the z-scored pipeline at T=1024 (bivariate_gaussian 0.0012, iid_gaussian 0.0048, delayed_noise 0.0079, logistic_maps 0.0128), and on raw (kernel-path) input up to 0.126 (bivariate_gaussian T=64) and 0.242 (delayed_noise T=64), where the series are not zero-mean. max: typically positive. sq variants >= 0. Run-to-run variability without seeding (probe3: unseeded repeat max|ΔA| = 1.1e-3 for the mean statistic; probe2 seed 0 vs seed 1 barycenters differ by up to 1.18 pointwise). Symmetric within one call.'
  direction_convention: 'undirected: A[i,j] = A[j,i] bit-identical via the cache; the underlying routine is NOT order-invariant for a fixed RNG draw (probe3: swapped input order, same seed, max|Δb| = 0.177), the cache hides this'
  symmetry_expected: sym
  already_documented: 'tests/README.md:134 and :146 (bary*_sgddtw_* draw from the global numpy RNG, marked stochastic and skipped in the end-to-end Calculator comparison); not listed in KNOWN_ISSUES.md; stopping-rule under-convergence: no'
  new_finding_candidates:
  - 'Candidate: premature stopping makes sgddtw an under-converged DTW barycenter. Evidence: dba.py:862-863 computes cost for the single series Xi; dba.py:876-883 compares that last-sample cost across epochs and breaks on any increase; probe4 F(b) 57.77 (tslearn stop) vs 50.26 (30 epochs, no stop) vs 44.69 (MM-DBA) on bivariate_gaussian T=256 pair (1,0); 331.46 vs 185.01 vs 135.86 on delayed_noise T=1024. Probe2 shows ConvergenceWarning "DBA loss is increasing" in all 9 probe runs (one of them only after reaching max_iter=30).'
  - 'Candidate: cache/ordering effect: whichever sgddtw identifier runs first in a Calculator run fixes the barycenter for the other three (they reuse the cached barycenter per pair, so they consume no RNG draws), and the Directed loop computes pair {a<b} from z[[b, a]]. Evidence: distance.py:247-263 cache under (i,j) and (j,i); base.py:85-94 loop order; probe3 cache keys [''sgddtw''] with 12 cached pairs after the mean SPI and no RNG consumption by the max SPI. The dependence on the global numpy RNG (dba.py:838, validation.py:1477-1478), and hence on RNG draws consumed by SPIs computed earlier, is already documented (tests/README.md:134/146) and is not part of this candidate.'
  - 'Candidate: input-order dependence for a fixed RNG draw (probe3: max|Δb| = 0.177, mean difference 6.1e-4), hidden by the cache; with the Directed loop the barycenter for pair {a<b} is computed from z[[b, a]].'
  - 'Candidate: the cost passed back by _mm_assignment uses weights[0]/weights.sum() regardless of which series is processed (dba.py:862 passes the full weights vector); harmless for pyspi''s uniform weights.'
