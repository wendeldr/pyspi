    expected_outcome: 'establishes A[i,j] meaning: expected A[1,0] > A[0,1] for var2_bivariate (x0 -> x1) and A[0,1] > A[1,0] for logistic_maps (y=1 -> x=0) at T >= 1024, i.e. row = target, column = source,
