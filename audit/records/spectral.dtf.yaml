unit_id: spectral.dtf
status: profiled
correctness:
  metric_name_standard: Directed transfer function (normalised DTF, squared), band mean / band max, bivariate nonparametric (multitaper + Wilson) estimate
  canonical_ref: 'Kaminski M, Blinowska KJ (1991) A new method of the description of the information flow in the brain structures. Biol Cybern 65:203-210 (normalised DTF); nonparametric H via Wilson factorisation:
    Dhamala, Rangarajan, Ding (2008) NeuroImage 41:354-362'
  canonical_definition: gamma^2_ij(f) = |H_ij(f)|^2 / sum_m |H_im(f)|^2, flow from j to i, H(f) = Abar(f)^{-1} the transfer matrix of the full multivariate model; sum_j gamma^2_ij(f) = 1; reflects direct
    and indirect flow
  documented_definition: 'supplement §1.5.9, p.16 (line 752): DTF ''quantifies the inflow from x -> y (according to the transfer matrix) normalized by the total inflow from all other signals into y (the
    row-wise sum of the spectral transfer matrix)''; same text GitBook spectral.md:107. Band rule, supplement §1.5, p.12-13 (supplement.txt lines 570-599 in this checkout; the pack''s line numbers are offset
    by about 12-16): ''We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T'' and bands ''fmin-0_fmax-0-5: f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4];
    fmin-0-25_fmax-0-5: f in [fs/4, fs/2]'', summary = mean or max over the band. Directed measures ''are nonparametrically estimated through spectral matrix factorization [57, 58]'' (§1.5, p.12). Row/column
    meaning of the MPI: GitBook glossary-of-terms.md:27 ''The rows in this table reflect the sources while the columns reflect the targets''.'
  delegate_lib: spectral_connectivity==1.1.2 Connectivity.directed_transfer_function (numpy 2.5.4, scipy 1.17.1)
  implemented_as: 'Per ordered pair (i, j): z-scored 2-channel array [x_i, x_j]; multitaper CSM (NW=3, 5 dpss tapers, constant detrend, single window, n_fft = next_fast_len(T)); Wilson factorisation S =
    Psi Psi^H; H = Psi A0^{-1}; L = |H|^2 / sum over columns |H|^2 (row-normalised, SQUARED) on the T/2 non-negative bins; A[i, j] = nanmean or nanmax of L[f, 0, 1] over fmin < f < fmax. Kernel probe p2_kernel.py:
    on the exact var2_bivariate and var2_chain spectra the library equals the canonical squared DTF to 1.0e-15.'
  implementation_trace:
  - pyspi/data.py:184-195 optional scipy detrend then zscore(axis=1, ddof=1) per process (Data default normalise=True, detrend=False)
  - pyspi/statistics/spectral.py:268-275 DirectedTransferFunction(NonparametricSpectralBivariate, Directed), _measure 'directed_transfer_function'
  - 'pyspi/calculator.py:325-339 Calculator.compute (HEAD a42ebc1): :329 S = self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :336-337 except Exception -> self._table[spi] = np.nan (whole SPI matrix NaN), error recorded :338-339'
  - 'pyspi/base.py:84-94 Directed.multivariate: for j, for i != j: A[i, j] = self.bivariate(data, i=i, j=j) (P(P-1) ordered pairs)'
  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fmax=None -> fs/2; statistic ''mean'' -> np.nanmean, ''max'' -> np.nanmax; identifier suffix _multitaper_<stat>_fs-1_fmin-.._fmax-..'
  - 'pyspi/statistics/spectral.py:106-126 NonparametricSpectralBivariate._get_cache: key (measure, i, j); z = data.to_numpy(squeeze=True)[[i, j]].T (column 0 = x_i, column 1 = x_j); m = sc.Multitaper(z,
    sampling_frequency=fs); conn = sc.Connectivity.from_multitaper(m); res = getattr(conn, measure)(); cached in data.spectral_bv'
  - 'pyspi/statistics/spectral.py:128-134 bivariate: freq_id = where((freq > fmin) * (freq < fmax)) (STRICT inequalities, unlike the multivariate path at :88 which uses >= / <=); returns statfn(res[0, freq_id,
    0, 1])'
  - pyspi/_spectral_compat.py:15-28 replaces the numpy namespace of spectral_connectivity.connectivity only (np.in1d shim); minimum_phase_decomposition.py keeps the real numpy
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-100 Multitaper defaults: time_halfbandwidth_product=3, detrend_type=''constant'', n_tapers=None, is_low_bias=True; :155-164
    n_tapers = floor(2*NW-1) = 5'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:167-178 single window = whole series; :181-185 n_fft = next_fast_len(T) (no zero padding; = T for T in {64,256,1024,4096}); :188-190
    frequencies = fftfreq(n_fft, 1/fs)
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:238-260 fft: detrend(constant) -> taper (dpss, :357-387) -> FFT / fs (:335-354)'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:156-172 Connectivity.from_multitaper (expectation_type 'trials_tapers' -> mean over trials and the 5 tapers, :45-53)
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:195-208 _cross_spectral_matrix S[a, b] = X_a conj(X_b); :210-220 _expectation_cross_spectral_matrix
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:259-261 _minimum_phase_factor (plain property, NOT cached: every access re-runs Wilson) -> minimum_phase_decomposition.py:161-222'
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:263-266 _transfer_function = _estimate_transfer_function(Psi) restricted to the first (n_fft+1)//2 bins (decorator :73-89); :1145-1170
    H = Psi @ inv(A0), A0 = ifft(Psi)[lag 0].real
  - .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:268-270 _noise_covariance -> :1116-1142 Sigma = A0 @ A0^T
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:758-778 directed_transfer_function: _squared_magnitude(H / _total_inflow(H)) (two H accesses -> two Wilson runs)'
  - '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:1222-1231 _total_inflow: sqrt(sum over axis=-1 (columns) of |H|^2) -> row normalisation; :1183-1184 _squared_magnitude = |x|^2'
  deviation_from_documented: '(i) Direction: documented ''from x -> y'' with rows = sources; implemented A[i, j] = flow x_j -> x_i (row = target), probe p3_pipeline.py var2_bivariate A[1,0] = 0.2617 > A[0,1]
    = 0.1281 for x0 -> x1. (ii) ''nonparametrically estimated through spectral matrix factorization'' holds, but each ordered pair is factorised on its own 2-channel spectrum (bivariate, unconditioned on
    the other P-2 channels). (iii) Band rule: documented 125 bins from f0 = 4/T with closed bands; implemented: the multitaper grid k/n_fft (n_fft = T for power-of-two T, so T/2 non-negative bins, DC included,
    Nyquist absent) with open bands (fmin < f < fmax): DC is always dropped and the f = 0.25 bin belongs to neither half-band (p6_misc.py T=64: full band 31 bins 0.0156-0.4844, low band 15 bins ending 0.2344,
    high band 15 bins starting 0.2656).'
  deviation_from_canonical: 'Formula matches the squared normalised DTF exactly (p2_kernel.py, 1e-15). Deviations are in the estimation setting: (a) bivariate: H is the transfer matrix of the 2-channel
    marginal process, so for P > 2 it is not the multivariate DTF (for 2 channels this is the canonical DTF of that pair); (b) because H = adj(Abar)/det(Abar) in 2x2, the off-diagonal DTF equals the off-diagonal
    PDC exactly (p10_dc_gpdc.py 2.2e-16; pipeline p3_pipeline.py max|dtf - pdcoh| = 1.1e-16), so dtf carries no information beyond pdcoh; (c) the multitaper estimator has a fixed 5 tapers, so per-bin variance
    does not shrink with T and the band mean has a positive bias floor (null direction ~0.11 at T = 64..16384, p5_bias_T.py); (d) DTF is not invariant to unequal innovation variances; with a 100:1 innovation-variance
    ratio the null direction is estimated at 0.83 and the true direction at 0.17 (p4_delay.py), i.e. the estimated direction inverts.'
  units_and_range: 'dimensionless, squared, per-frequency value in [0, 1]; band mean/max in [0, 1]; non-negative; asymmetric; diagonal NaN; not invariant to relative scaling of channels at kernel level
    (p6_misc.py: x1*10 changes mean L[1,0] 0.2749 -> 0.9375), pipeline z-scoring removes that'
  direction_convention: 'A[i, j] = statfn over the band of L[0, 1] where L is the library measure on the ordered 2-channel array [x_i, x_j]; the library''s [a, b] entry is the flow from channel b to channel
    a (H[a, b] maps innovation b into signal a; kernel probe p2_kernel.py on the exact var2_bivariate spectrum: x0 -> x1 appears at L[1, 0], L[0, 1] = 0). Hence A[i, j] = estimated flow x_j -> x_i: ROW
    = TARGET, COLUMN = SOURCE. Confirming evidence: exact-spectrum toy VAR(1) with x0 -> x1 gives library DTF L[1,0] = 0.1608, L[0,1] = 0 (review probe pD_kernel_directed.py); pipeline probe p3_pipeline.py
    (T=4096, z-scored) var2_bivariate A[1,0] = 0.2617 > A[0,1] = 0.1281 (x0 -> x1). logistic_maps (y = process 1 drives x = process 0, audit/checks/make_data.py:207 (beta_xy = 0.1, beta_yx = 0) and :309-310 (update equations)) shows A[0,1] > A[1,0] in the pipeline,
    but the Wilson factorisation does not converge on that dataset at T >= 1024 (60 iterations, residual 0.32-0.38; p7_wilson.py, review pF_wilson.py), so it is not used as confirming evidence. This is
    the opposite of the glossary''s row = source convention. On delayed_noise the DTF/PDC/dcoh/ddtf matrices look row = source only because the estimator fails there (see candidates); gpdcoh on delayed_noise
    follows row = target.'
  symmetry_expected: asym
  already_documented: tests/README.md worth knowing ('dtf_* == pdcoh_*'); DEPENDENCY_COMPATIBILITY_REVIEW.md (Nyquist handling / frequency grid of spectral-connectivity 1.1.2 vs 2.x; pinned at 1.1.2 per
    tests/README.md dependency constraints); base.pair_handling record (Directed loop; glossary row = source convention)
  new_finding_candidates:
  - 'CANDIDATE (direction reversed vs documentation): library L[a, b] = flow b -> a and pyspi reads L[0, 1] for pair (i, j), so A[i, j] = j -> i. Evidence: spectral.py:134 ''bv_freq[0, freq_id, 0, 1]'';
    p2_kernel.py exact var2_bivariate ''directed_transfer_function mean over f>0: [0,1]=0.00000 [1,0]=0.20884''; p3_pipeline.py var2_bivariate [[nan, 0.1281], [0.2617, nan]] with x0 -> x1; toy VAR(1) exact
    spectrum L[1,0] = 0.1608, L[0,1] = 0 (review pD_kernel_directed.py). logistic_maps [[nan, 0.9996], [0.0001, nan]] (y=1 -> x=0) agrees in sign but comes from a non-converged factorisation (p7_wilson.py),
    so it is not counted as evidence. glossary-of-terms.md:27 says rows are sources.'
  - 'CANDIDATE (bivariate/unconditioned; pack hypothesis 1 confirmed for DTF): each ordered pair gets its own 2-channel multitaper and Wilson run (spectral.py:112-116; p6_misc.py cache keys (''directed_transfer_function'',
    i, j) for all 6 ordered pairs at P=3). On var2_chain (0 -> 1 -> 2, no direct 0 -> 2) pyspi A[2,0] = 0.1907 (p3_pipeline.py); DTF is allowed indirect flow, so this is a setting deviation, not an error,
    for DTF.'
  - 'CANDIDATE (non-vanishing positive bias): null-direction band mean ~0.11 regardless of T (p5_bias_T.py s=1.0: 0.115, 0.111, 0.106, 0.111, 0.112 at T=64..16384; iid_gaussian 0.1325, 0.1148, 0.1058, 0.1078
    at T=64..4096) because n_tapers is fixed at 5 (transforms.py:155-164) with a single window.'
  - 'CANDIDATE (direction inversion under unequal innovation variances): delayed copy x1(t) = x0(t-1) + 0.1 n(t): exact-spectrum library DTF [0,1]=0.000 [1,0]=0.500, multitaper estimate [0,1]=0.833 [1,0]=0.167
    (p4_delay.py, T=4096); pyspi on delayed_noise gives A[0,k] ~0.82 > A[k,0] ~0.17 (p3_pipeline.py), i.e. the estimated flow points from the delayed copies to the leader.'
  - 'CANDIDATE (band edges): strict inequalities at spectral.py:132 drop DC and the f = 0.25 bin from every band, and differ from the inclusive rule of the multivariate path (spectral.py:88); documented
    bands are closed (p6_misc.py bin counts 31/15/15 at T=64).'
  - 'CANDIDATE (cost; pack hypothesis 3 confirmed): directed_transfer_function accesses the uncached _transfer_function property twice, running Wilson twice per call (p6_misc.py ''wilson calls directed_transfer_function
    2''; P=3 multivariate: 12 Wilson runs for 6 ordered pairs). Identical numbers each time (deterministic), so this is optimisation only.'
