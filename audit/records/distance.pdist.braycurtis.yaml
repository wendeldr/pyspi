  identifier_exceptions: ''
  what_changed: 'Canonical Bray-Curtis is sum|x-y| / sum(x+y) for non-negative abundances with range [0, 1]. pyspi (via SciPy) computes sum|x-y| / sum|x+y|
    on z-scored signed data: identical to the canonical index only for non-negative data. On default input the value is unbounded, exceeds 1 for negative
    correlation (3.0 in population for rho = -0.8), and is +inf without any warning for y = -x; for an affine pair (-x, 2x+1) z-score rounding decides between
    +inf and ~1e16. For Gaussian pairs it converges to sqrt((1-rho)/(1+rho)). Score 7: matches the documented (sklearn/SciPy) variant fp-exactly but differs
    from the canonical index in a value-changing way on pyspi''s default input.
    Rubric reading is nearest-anchor 7 (score_rubric_note), because anchor 7''s supplement-variant clause is met only through the GitBook sklearn form; the
    score-7 sentence above is the original reasoning for score_0_10.'
