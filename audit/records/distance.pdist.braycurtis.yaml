unit_id: distance.pdist.braycurtis
status: profiled
correctness:
  metric_name_standard: Bray-Curtis dissimilarity (SciPy's absolute-value form) between z-scored series
  canonical_ref: Bray & Curtis 1957, Ecological Monographs 27(4):325-349 'An ordination of the upland forest communities of southern Wisconsin'; Legendre
    & Legendre 2012, Numerical Ecology (3rd ed.), coefficient D14 (percentage difference)
  canonical_definition: BC(x,y) = sum_t |x_t - y_t| / sum_t (x_t + y_t) for non-negative x, y (range [0,1])
  documented_definition: 'GitBook distance-similarity.md ''Pairwise Distance'' (lines 297-321): "Pairwise distance between time-series, computed using sklearn''s
    pairwise distance function using the following distance metrics: Euclidean, Cityblock, Cosine, Chebyshev, Canberra, Braycurtis"; keywords "undirected,
    nonlinear, unsigned, unordered". No formula is given. pdist is absent from the supplement: supplement §1.2 ''Distance similarity (26 SPIs)'', p.5 (heading
    line 209) lists SPIs 22-47 (dcorr, dcorrx, mgc, mgcx, hsic, hhg, dtw, lcss, softdtw, bary) and no pdist entry.'
  delegate_lib: scipy==1.17.1 scipy.spatial.distance.pdist(X, 'braycurtis') (C++ _distance_pybind.pdist_braycurtis), reached through sklearn==1.9.1 pairwise_distances'
    SciPy branch, then squareform
  implemented_as: Rows z-scored (ddof=1) by default; scipy computes sum_t |x_t - y_t| / sum_t |x_t + y_t|. On zero-mean signed data the denominator shrinks
    as the pair becomes anti-correlated, so the value exceeds 1 for negative correlation and is +inf (no warning) for y = -x. Asymptotically for Gaussian
    pairs BC -> sqrt((1-rho)/(1+rho)).
  implementation_trace:
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (Calculator defaults detrend=False, normalise=True,
    calculator.py:48-50; lines at HEAD a1f20c7)
  - pyspi/data.py:184-195 optional scipy.signal.detrend(axis=1), then zscore(data, axis=1, nan_policy='omit', ddof=1) per process
  - pyspi/calculator.py:329-335 S = self._spis[spi].multivariate(self.dataset); np.fill_diagonal(S, np.nan); self._table[spi] = S (HEAD a1f20c7)
  - 'pyspi/base.py:51-68 parse_multivariate: passes the Data object through unchanged'
  - pyspi/statistics/distance.py:28-36 class PairwiseDistance(Undirected, Unsigned); __init__ stores metric, identifier 'pdist_<metric>'
  - 'pyspi/statistics/distance.py:38-40 multivariate overrides Undirected.multivariate (base.py:132-138, never called): return pairwise_distances(data.to_numpy(squeeze=True),
    metric=self._metric)'
  - pyspi/data.py:108-118 to_numpy(squeeze=True) -> (M processes, T observations) float64; each row is one vector in R^T
  - sklearn/metrics/pairwise.py:2309 pairwise_distances(X, Y=None, metric, n_jobs=None, ensure_all_finite=True) (scikit-learn 1.9.1)
  - sklearn/metrics/pairwise.py:2472 else-branch (metric not precomputed, not in PAIRWISE_DISTANCE_FUNCTIONS, not callable); :2476 dtype = 'infer_float';
    :2482-2484 check_pairwise_arrays(X, None, dtype=dtype, ensure_all_finite=...) (sklearn/metrics/pairwise.py:171-172 infer_float -> float64, :174-175
    X = Y = check_array(X))
  - sklearn/metrics/pairwise.py:2490-2491 n_jobs==1 and X is Y -> distance.squareform(distance.pdist(X, metric))
  - scipy/spatial/distance.py:1816 pdist (scipy 1.17.1); scipy/spatial/distance.py:2133-2138 metric alias lookup -> metric_info.pdist_func
  - scipy/spatial/distance.py:1660-1665 MetricInfo('braycurtis', pdist_func=_distance_pybind.pdist_braycurtis) (compiled scipy/spatial/_distance_pybind.cpython-312-x86_64-linux-gnu.so)
  - 'scipy/spatial/distance.py:1102 braycurtis(u, v) Python reference: abs(u - v).sum() / abs(u + v).sum(); docstring notes it is bounded in [0,1] only
    ''if all coordinates are positive'''
  - scipy/spatial/distance.py:2154 squareform
  deviation_from_documented: 'None in substance: the code is sklearn.metrics.pairwise_distances with metric=''braycurtis'' as the GitBook page states. Not
    stated on the page: inputs are z-scored per process (ddof=1) by Data by default (optionally detrended first), sklearn forwards this metric to scipy.spatial.distance.pdist,
    and the Calculator sets the diagonal to NaN. No formula or normalisation (e.g. per-sample scaling) is documented.'
  deviation_from_canonical: 'Formula: SciPy''s |x+y| denominator equals the canonical one only for non-negative data. On z-scored data the canonical [0,1]
    range is lost: probe values 1.75 (rho=-0.5), 4.39 (-0.9), 14.2 (-0.99), 45.1 (-0.999) at T=4096, and +inf for y = -x, silently (probe: no warning recorded
    for y = -x under warnings.simplefilter(always)). Implementation matches SciPy''s definition exactly (probe max |A - scipy loop| = 6.7e-16).'
  units_and_range: 'Dimensionless; range [0, +inf]: < 1 for positive correlation, ~1 for independence, > 1 for negative correlation, +inf when sum|x+y|
    = 0 (y = -x). Asymptotically sqrt((1-rho)/(1+rho)) for Gaussian pairs (probe rho=0.8: 0.33337 vs 0.33333); independent of T in expectation.'
  direction_convention: 'A[i,j] = d(z_i, z_j) for rows i, j of the (z-scored) M x T data; the metric is symmetric so A[i,j] = A[j,i]; no direction is encoded;
    diagonal NaN after Calculator.compute (confirmed in the check stage: sym runs).'
  symmetry_expected: sym
  already_documented: docs/storage_comparison/REVIEW.md M1 (PairwiseDistance overrides Undirected.multivariate; output exactly symmetric via squareform)
  new_finding_candidates:
  - 'Candidate (domain): Bray-Curtis is an ecological dissimilarity for non-negative abundances; applied to z-scored signed data it is unbounded and can
    return +inf. Probe: y = -x -> inf (no warning); rho=-0.999 -> 45.08; rho=-0.5 -> 1.754. Probed through Calculator (p_bc_calc.py, configfile with PairwiseDistance
    configs braycurtis+canberra, data [x, -x, 2x+1], x iid N(0,1), T=256): compute() completes, the summary counts both SPIs as successful with 0 NaNs,
    no divide warning is raised, and calc.table[''pdist_braycurtis''] holds +inf at (0,1)/(1,0). The z-scored affine copies are not exact: z0 - z2 and z1
    + z2 have max abs 4.4e-16, so (x, 2x+1) gives 1.77e-17 instead of 0 and (-x, 2x+1) gives 5.67e16 instead of +inf; z-scoring rounding decides between
    ~1e16 and inf. Propagation into downstream analyses is not probed.'
  - 'Candidate (labels): on Gaussian pairs BC -> sqrt((1-rho)/(1+rho)), a monotone function of rho (probe rho=0.3: 0.7363 vs 0.7338 at T=4e5), so the ''nonlinear''
    label is weakly supported; it is a dissimilarity (larger = less coupled) and sign-sensitive.'
