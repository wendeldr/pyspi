    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: abs difference <= 1e-12 on every pair and T
  - datasets:
    - gauss_ar1_pair
    path: pipeline
    reference: 'analytic population SI from dataset truth: Sigma_X, Sigma_XY = A Sigma_X, Sigma_E; sigma^2(x_v(t+1)|x_v(t)) = Sigma_X[v,v] - Sigma_XY[v,v]^2/Sigma_X[v,v]; SI = 0.5*ln(prod_v sigma^2_v /
      det Sigma_E)'
