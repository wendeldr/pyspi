  check_data: var2_bivariate T1024; gauss_ar1_pair T1024/T4096; delayed_noise T256; iid_gaussian T256/T1024; bivariate_gaussian pairs T4096; shared_envelope T256 (degenerate, under infotheory.est.gaussian)
