unit_id: infotheory.si.gaussian
status: profiled
correctness:
  metric_name_standard: Stochastic interaction (Ay) of a bivariate first-order Markov process, Gaussian model
  canonical_ref: Ay N. 2015, Entropy 17:2432-2458 'Information geometry on complexity and stochastic interaction' (SI as KL divergence to the split Markov kernel); Ay N. & Wennekers T. 2003, Neurocomputing
    52-54:461-466
  canonical_definition: 'SI = sum_v H(X_{v,t+1} | X_{v,t}) - H(X_{t+1} | X_t) for the joint process X = (X_1, X_2); Gaussian: 0.5*ln(sigma^2(x_{t+1}|x_t) sigma^2(y_{t+1}|y_t) / det Sigma((x,y)_{t+1} | (x,y)_t))'
  documented_definition: 'supplement §1.4.9, p.12 (supplement.txt:539-548): ''Stochastic interaction [47, 48] is a measure of integrated information between two processes in the context of their own past.
    It is quantified by the difference between the joint entropy of the bivariate process and the individual entropies of each univariate process. Both entropies are measured in context of (conditioned
    on) the history of the processes; we restrict this history to be only one-step, assuming a first-order Markov process.'' Keywords ''undirected, nonlinear, unsigned, bivariate, time-dependent''. GitBook
    information-theory.md:184-202 same.'
  delegate_lib: JIDT infodynamics.jar bundled at pyspi/lib/jidt (labelled 1.6.1 by version-1.6.1.txt, but its class inventory includes EntropyCalculatorMultiVariateCommon, added upstream in commit 3d1f3fe
    on 2024-04-20; between tag v1.6.1 and commit a9b6b3e the Gaussian MI/CMI/TE/AIS leaf classes, MatrixUtils, MathsUtils and ChiSquareMeasurementDistribution are byte-identical, their MultiVariateCommon/Via
    parents differ only in observation-ID/noise-seed bookkeeping, and EntropyCalculatorMultiVariateGaussian was refactored onto EntropyCalculatorMultiVariateCommon with its value path unchanged; details
    in infotheory.est.gaussian) via JPype1==1.7.1 on OpenJDK 21; gaussian.EntropyCalculatorMultiVariateGaussian (three conditional entropies = six entropy calls)
  implemented_as: 'With tau = delay = 1: H_joint = H(xy(t) | xy(t-1)), H_src = H(x(t) | x(t-1)), H_targ = H(y(t) | y(t-1)), each via _compute_conditional_entropy (H(A,B) - H(B)) on T-1 aligned samples of
    z-scored data; returns H_src + H_targ - H_joint. Gaussian constants and the ddof scaling cancel, giving 0.5*ln(s_x|x * s_y|y / det S_xy|xy) from residual covariances of AR(1)/VAR(1) fits on the same
    samples. Undirected (upper triangle mirrored).'
  implementation_trace:
  - pyspi/calculator.py:329 (HEAD a1f20c7) Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 fill_diagonal NaN; :336-339 any exception from any pair -> the whole SPI entry becomes NaN (:337) and the error is recorded, warning issued at :354-355
  - 'pyspi/data.py:184-195 preprocessing in Data.set_data: optional scipy.signal.detrend(axis=1), then (default normalise=True) scipy.stats.zscore(axis=1, ddof=1)'
  - 'pyspi/base.py:132-138 Undirected.multivariate: Directed loop then A[li] = A.T[li] with li = tril_indices(P,-1) (lower triangle overwritten from the upper, i<j)'
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: _entropy_calc = _getcalc(''entropy'') (:36); identifier += ''_gaussian'' (:38); estimator ''gaussian'' -> labels += [''linear''], _dyn_corr_excl
    = None (:53-55)'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: every calculator gets setProperty(''BIAS_CORRECTION'',''false'') and setProperty(''NOISE_SEED'',''42''); no NORMALISE property is set'
  - 'pyspi/statistics/infotheory.py:103-134 _getcalc: ''gaussian'' (and any unrecognised estimator) falls to the else branches -> gaussian.EntropyCalculatorMultiVariateGaussian (:111-112), gaussian.MutualInfoCalculatorMultiVariateGaussian
    (:120-123), gaussian.TransferEntropyCalculatorGaussian (:129-130)'
  - 'pyspi/statistics/infotheory.py:513-522 StochasticInteraction(JIDTBase, Undirected).__init__(delay=1): identifier += ''_k-1'' (k denotes the delay)'
  - 'pyspi/statistics/infotheory.py:524-534 bivariate: x, y = data.to_numpy()[[i, j]] (each (T,1)); xy = concat; H_joint = _compute_conditional_entropy(xy[tau:], xy[:-tau]); H_src, H_targ likewise; return
    H_src + H_targ - H_joint'
  - pyspi/statistics/infotheory.py:180-193 _compute_conditional_entropy(X, Y) = H(X,Y) - H(Y)
  - 'pyspi/config.yaml:480-492 StochasticInteraction configs: estimator gaussian (delay default 1)'
  - 'https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/gaussian/EntropyCalculatorMultiVariateGaussian.java EntropyCalculatorMultiVariateGaussian
    (extends EntropyCalculatorMultiVariateCommon, :53-54): finaliseAddObservations :87-96 computes means and MatrixUtils.covarianceMatrix(observations, means); setCovariance :110-123 takes MatrixUtils.CholeskyDecomposition
    (throws on non-PD); computeAverageLocalOfObservations :162-175 returns 0.5*(d*(1+ln 2pi) + ln det(Sigma)) in nats'
  - https://github.com/jlizier/jidt/blob/a9b6b3e77ca8c051f1031003474e2e35dd4a3269/java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java :66 normalise = true by default, but
    finaliseAddObservations :178-212 only stacks observations and adds noise if addNoise (default false, :70); no normalisation is applied for the Gaussian estimator; NOISE_SEED handled :133-139 (no effect
    without addNoise)
  - https://github.com/jlizier/jidt/blob/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java [JIDT line numbers at tag v1.6.1; the bundled pyspi/lib/jidt/infodynamics.jar is labelled 1.6.1 but is a later build (entries dated 2024-04-21, near upstream a9b6b3e, exact commit not established; see delegate_lib)] covarianceMatrix(double[][], double[]) :3426-3439 -> covarianceTwoColumns :3370-3377 divides by (n-1) (ddof=1);
    CholeskyDecomposition :4496-4498 (tol 10e-10 = 1e-9) / :4528-4560 throws NonPositiveDefiniteMatrixException when a pivot <= tol; determinantViaCholeskyResult :4673-4680
  deviation_from_documented: none in substance (one-step history, individual minus joint conditional entropies). The prose says 'difference between the joint entropy ... and the individual entropies' (order
    reversed); the code returns individual minus joint, which is the non-negative orientation of Ay's definition.
  deviation_from_canonical: 'none for Ay''s SI with one-step Markov kernels under a Gaussian model (probe var2_bivariate_T1024: 0.16167711 equals numpy 0.1616771067541367). Plug-in estimator, no bias correction;
    for a VAR(2) process the one-step Markov assumption is misspecified (documented choice).'
  units_and_range: nats; >= 0 in population (sample values from three separately estimated conditional entropies on the same samples are non-negative up to rounding, by the determinant inequality); symmetric;
    scale invariant; raises on singular covariance
  direction_convention: 'undirected: A[i,j] = A[j,i] = SI(x_i, x_j) (formula symmetric in x and y; upper triangle mirrored)'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'CANDIDATE (robustness): for exactly redundant channels the joint conditional covariance is singular and JIDT raises NonPositiveDefiniteMatrixException (probe shared_envelope rows 0/2), which Calculator
    turns into an all-NaN si matrix (calculator.py:336-339 at HEAD a1f20c7).'
  - 'CANDIDATE (interpretation): under the Gaussian model SI includes both lagged cross-coupling and contemporaneous innovation correlation (det Sigma_E term), so it is non-zero for two independent-dynamics
    processes with correlated innovations; consistent with Ay''s definition but worth stating in the docs.'
