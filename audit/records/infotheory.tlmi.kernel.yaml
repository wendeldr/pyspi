unit_id: infotheory.tlmi.kernel
status: profiled
correctness:
  metric_name_standard: Lag-1 time-delayed mutual information I(X_{t-1}; Y_t), box-kernel plug-in, bits
  canonical_ref: Schreiber T (2000) Phys Rev Lett 85:461 (time-delayed MI as the symmetric-in-information precursor of TE); Kaiser A, Schreiber T (2002) Physica D 166:43-62; Fraser AM, Swinney HL (1986)
    Phys Rev A 33:1134 (lagged MI); estimator Kantz & Schreiber (1997)
  canonical_definition: I(X_{t-1}; Y_t) = E[log2 p(x_{t-1}, y_t)/(p(x_{t-1}) p(y_t))]; box-kernel plug-in mean log2(N C_xy/(C_x C_y)) over the N = T-1 aligned pairs
  documented_definition: 'supplement §1.4.4, p.10 (supplement.txt:467-475; pack lines 477-485): ''Time-lagged mutual information [35] is an undirected measure of the dependence between time series x and a time-lagged instance
    of the series y. We include statistics for only lag-one mutual information''; keywords undirected, ..., time-dependent; identifier 71 tlmi_kernel_W-0.25. GitBook information-theory.md:235-254 calls
    it ''a directed measure'' with keyword directed.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): MutualInfoCalculatorMultiVariateKernel.computeAverageLocalOfObservations'
  implemented_as: 'config.yaml:537-538 width 0.25. For (i,j): src = z_i[:-1] (x_{t-1}), targ = z_j[1:] (y_t), T-1 pairs; same kernel MI as mi (half-widths 0.25*sampleSD of each lagged sub-series, closed
    box, self-included). A[i,j] = I(X_i,t-1 ; X_j,t). Any exception -> NaN.'
  implementation_trace:
  - pyspi/calculator.py:48-51 Calculator `__init__` defaults detrend=False, normalise=True
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend)
  - 'pyspi/data.py:193-195 scipy.stats.zscore(data, axis=1, nan_policy=''omit'', ddof=1) (each series: mean 0, sample SD 1)'
