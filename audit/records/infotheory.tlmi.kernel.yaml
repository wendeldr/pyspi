  deviation_from_documented: Keyword 'undirected' (supplement §1.4.4) vs Directed class and asymmetric output; GitBook says directed (already documented, M8). Otherwise matches (lag one, width 0.25 in identifier).
  deviation_from_canonical: None beyond the shared estimator properties (resubstitution box kernel, self-inclusion, no bias correction; positive null bias, probe iid_gaussian means 0.775/0.290/0.097/0.028
    bits at T=64/256/1024/4096).
  units_and_range: bits; typically >= 0 (not guaranteed); <= log2(T-1); asymmetric; NaN only on exception.
  direction_convention: 'A[i,j] = I(X_i at t-1 ; X_j at t): row i is the lagged (source) series, column j the present (target). Probe delayed_noise T=1024 (x1 = x0 delayed by 1): A[0,1] = 2.647, A[1,0]
    = 0.064.'
  symmetry_expected: asym
  already_documented: docs/storage_comparison/REVIEW.md M8 (tlmi is asymmetric by construction)
  new_finding_candidates:
