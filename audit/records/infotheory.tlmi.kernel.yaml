optimisation:
  complexity_P_T: 'O(P^2 T^1.81): TimeLaggedMutualInfo.bivariate (pyspi/statistics/infotheory.py:301), one JIDT box-kernel call per ordered pair with 1-D inputs (no cache). Measured fresh T exponent 1.81,
    P exponent ~2.1. At 118x1024 the pair term is everything: 139 s measured fresh.'
  hotspot_1: pyspi/statistics/infotheory.py:TimeLaggedMutualInfo.bivariate (third-party:jidt box kernel via JPype, self time) 99.9% cum of the profiled SPI call at 8x1024
  hotspot_2: 'none visible inside Java (1-D conversions are negligible). opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked as self
    time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0009
  profile_file: audit/profiles/infotheory.tlmi.kernel__8x1024.pstats
  opportunities:
  - opportunity_id: it_kernel-2
    opportunity: 'Replace JIDT''s box-kernel counting with per-(channel, width, lag window) neighbourhood bitsets: one T x T bit matrix marks |x(t) - x(s)| <= w_d (w_d = width x the column''s ddof=1 SD,
      as KernelEstimatorMultiVariate sets it) and every joint count of je/ce/mi/tlmi/te/si/xme/cce/di is a popcount of ANDed rows, so the neighbourhood search is shared by all P-1 partners and all composed
      terms.'
    opp_type: algorithmic
    expected_speedup: 10-50x
    speedup_basis: 'profile:audit/profiles/infotheory.tlmi.kernel__8x1024.pstats pyspi/statistics/infotheory.py:301 TimeLaggedMutualInfo.bivariate 99.9% (JIDT Java time booked as pyspi self time) + complexity:
      one joint count over all t is T x T/64 = 16k word AND+popcount operations at T=1024 (~10-50 us) against the measured 6.5 ms per ordered pair (8x1024 fresh; T exponent 1.81); bitsets are built once
      per channel and lag window (lag-shifted 1-D marginals + 2-D joint)'
    output_risk: unverified-within-tolerance
    risk_evidence: max-norm box counts are products of per-dimension indicators, so integer counts are exact if the closed-box test and the per-column widths match JIDT; the log-sum order changes. The check
      stage's all-pairs numpy counts (audit/checks/refs/_kernels_infotheory.py:entropy_box_kernel / mi_box_kernel / te_box_kernel) reproduce JIDT to <= 2.6e-13 (infotheory.est.kernel closeness)
    effort: L
    depends_on: []
