      (pyspi/workflow/retained185.yaml:7-35, :36-67) and this unit reads the EmpiricalCovariance fit cached by basic.cov.EmpiricalCovariance (pyspi/statistics/basic.py:31-44), so the pinvh this avenue
      makes cheaper is paid, and credited, on basic.cov.EmpiricalCovariance. This unit''s family-warm basis (0.18 ms per window at 118x1024, summary.json) is that cache read, with no pinvh in it. The
      upper end above holds only in a run where this unit fits the estimator itself (fresh 3.89 ms)'
