    - sparse_precision
    - cointegrated
    path: pipeline
    reference: 'analytic partial correlation from the same inverse: rho_ij = -Theta_ij / sqrt(Theta_ii Theta_jj) (Whittaker 1990)'
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: 'prec_* != partial correlation: opposite sign for every pair with nonzero partial correlation and |prec| > 1 (trace probe on bivariate_gaussian T=1024: prec_EmpiricalCovariance[2,3] = -2.193 while the partial correlation from the same matrix is +0.797; cointegrated T=1024 max |prec_EmpiricalCovariance| = 95.3); refutes the documented ''[-1,1], equivalent to partial correlation'''
  - datasets:
