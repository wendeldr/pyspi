  what_changed: 'Canonical precision (inverse of the MLE covariance), fp-exact. Score 7 under the family''s reading of anchor 7 as symmetric: the value matches exactly one of the two definitions (here the canonical precision) and differs from the other (here the supplement) in a value-changing way; anchor 7 literally names the mirror case (supplement matched, canonical differs), so synthesis should confirm this convention. prec.OAS and the robust/glasso prec units are at 6 because they differ from both (OAS no-2/p shrinkage; FAST-MCD scatter; glasso iterate not at the optimum). The supplement''s description (''equivalent to the partial correlation ... within [-1, 1]'') does not hold: the value is Theta_ij = -pcorr_ij sqrt(Theta_ii Theta_jj), opposite in sign to the partial correlation on every pair and unbounded (max 95.3 / 61.5 / 4.26 on cointegrated for Empirical / LedoitWolf / Shrunk). On the pipeline it is the inverse of the (shrunk) correlation matrix times T/(T-1). Singular covariance (duplicated channel, average reference) gives a silent Moore-Penrose pseudo-inverse. -sq is an undocumented elementwise square. Rubric reading is nearest-anchor 9 (score_rubric_note), because the canonical precision is reproduced and only anchor 10''s supplement clause fails; the anchor-7 reading above is the original reasoning for score_0_10.'
