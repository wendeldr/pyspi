unit_id: basic.prec.EmpiricalCovariance
status: profiled
correctness:
  metric_name_standard: inverse (pseudo-inverse) of the maximum-likelihood sample covariance (sample precision / concentration matrix)
  canonical_ref: 'Dempster 1972, Biometrics 28(1):157-175 (covariance selection; concentration/precision matrix); partial-correlation relation rho_ij|rest = -Theta_ij / sqrt(Theta_ii Theta_jj) in Whittaker 1990, Graphical Models in Applied Multivariate Statistics, Wiley, ch. 5. Covariance estimator: Anderson 2003, An Introduction to Multivariate Statistical Analysis (3rd ed.), Wiley, §3.2 (MLE of the covariance matrix, divisor N)'
  canonical_definition: 'Theta = Sigma_hat^{-1} where Sigma_hat is: Sigma_hat = (1/T) sum_t (x_t - xbar)(x_t - xbar)^T; for unit-variance inputs the off-diagonal is Pearson r; partial correlation is -Theta_ij/sqrt(Theta_ii Theta_jj), not Theta_ij itself'
  documented_definition: 'supplement §1.1.2, p.4 (supplement.txt:158-171): ''The precision matrix is the matrix inverse of the covariance matrix ... For normalized time-series data, the precision matrix is equivalent to the partial correlation between each pairwise time series, conditioned on all other time series, and is within [-1, 1].'' GitBook basic-statistics.md:101-122 has the same text. Neither source documents the ''-sq'' (squared) variants generated by pyspi/config.yaml.'
  delegate_lib: scikit-learn==1.9.1 sklearn.covariance.EmpiricalCovariance().fit(X).precision_ (scipy==1.17.1 scipy.linalg.pinvh); numpy==2.5.4
  implemented_as: Same cached sklearn.covariance.EmpiricalCovariance() fit as cov_EmpiricalCovariance; returns precision_ = scipy.linalg.pinvh(covariance_) computed at fit time (Moore-Penrose pseudo-inverse via eigh with relative cutoff max(P,P)*eps*max|eig|), diagonal NaN. Off-diagonals are raw inverse-covariance entries, not normalised; on the default pipeline Theta = T/(T-1) * R^{-1} with R the Pearson correlation matrix. Not symmetrised (Estimators.multivariate bypasses Undirected.multivariate). Squared variant (prec-sq_*) = np.square of the same matrix.
  implementation_trace:
  - pyspi/data.py:59-71 Data.__init__ default normalise=True, detrend=False
  - pyspi/data.py:184-195 optional scipy.signal.detrend then zscore(data, axis=1, nan_policy='omit', ddof=1)
  - pyspi/calculator.py:327-339 (HEAD a1f20c7) Calculator.compute try block; :329 calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :335 stores S in the table; :336-339 any exception -> the whole SPI entry set to NaN and the error recorded, warning issued at :354-355
  - 'pyspi/base.py:51-66 parse_multivariate (inplace=True: the cache written onto the Data object persists across SPIs)'
  - pyspi/statistics/basic.py:9 class Estimators(Undirected, Signed); its multivariate overrides Undirected.multivariate (pyspi/base.py:132-138), so no triangle mirroring
  - 'pyspi/statistics/basic.py:18-29 Estimators.__init__: identifier suffix ''_<estimator>'' or ''-sq_<estimator>''; squared sets labels+[''unsigned''] and issigned()->False'
  - 'pyspi/statistics/basic.py:31-44 _from_cache: z = data.to_numpy(squeeze=True).T (observations x processes); getattr(sklearn.covariance, estimator)().fit(z) with ALL sklearn defaults; fitted object cached in data.covariance[estimator] and shared by cov_* and prec_* of that estimator'
  - 'pyspi/statistics/basic.py:46-54 multivariate: matrix = getattr(mycov, ''precision_'') (line 49); np.fill_diagonal(matrix, np.nan) IN PLACE on the cached sklearn attribute (line 50); returns np.square(matrix) if squared (line 52) else the cached array object itself (line 54)'
  - pyspi/statistics/basic.py:66-72 Precision(kind='precision'), identifier 'prec'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:232-256 EmpiricalCovariance.fit: location_ = X.mean(0) (line 253); covariance = empirical_covariance(X) (line 254); self._set_covariance (line 255)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:65-110 empirical_covariance: assume_centered=False -> np.cov(X.T, bias=1) (line 107), i.e. divisor T'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:196-215 _set_covariance: covariance_ = covariance (line 210); store_precision=True default (line 192) -> precision_ = scipy.linalg.pinvh(covariance, check_finite=False) (line 213)'
  - '.venv/lib/python3.12/site-packages/scipy/linalg/_basic.py:1938-2028 pinvh: eigh (line 2007); cutoff val = atol(0) + max|s| * max(shape)*eps (lines 2011-2017); eigenvalues |s| <= val dropped (line 2018); B = (u * 1/s) @ u.conj().T (line 2023): Moore-Penrose pseudo-inverse, silently rank-reducing'
  deviation_from_documented: 'Docs say precision is the matrix inverse and, for normalised data, ''equivalent to the partial correlation ... within [-1, 1]''. Implemented value is the unnormalised inverse entry Theta_ij: sign opposite to the partial correlation and magnitude unbounded (probe bivariate_gaussian T=1024 pair (2,3): prec = -2.193 vs partial correlation +0.797). pinvh is a pseudo-inverse, not the inverse, when S is singular. The ''-sq'' squared variants are undocumented.'
  deviation_from_canonical: 'matches the canonical precision (inverse of the MLE covariance) when S is non-singular; when S is singular (exactly collinear channels, P > T) pinvh returns the Moore-Penrose pseudo-inverse without warning, which is not a precision matrix (probe: shared_envelope T=256, x2 == x0, pair (0,2) = +0.338, eig(S) includes 0.0)'
  units_and_range: 'dimensionless on the pipeline path (inverse input-units-squared on kernel path); signed; unbounded (76-file probe sweep, prec_EmpiricalCovariance: max |off-diagonal| 95.3 on cointegrated T=1024, 3042.8 over all dataset files, at trending_T4096); sign opposite to the partial correlation; symmetric only up to last-bit roundoff (max |A-A^T| 5.7e-14 over the 76 files, nonzero in 60 of 76); NaN diagonal; prec-sq >= 0 unbounded. Singular S (duplicated channel, P > T) silently yields a finite pseudo-inverse.'
  direction_convention: 'undirected: A[i,j] is the (i,j) entry of the fitted sklearn precision_ for processes i and j (rows of the Data array); no ordering, symmetric up to last-bit pinvh roundoff (REVIEW M2); to be confirmed empirically in the check stage'
  symmetry_expected: sym
  already_documented: REVIEW M1 (Undirected mirror bypassed); REVIEW M2 (precision last-bit reciprocal asymmetry from pinvh)
  new_finding_candidates:
  - 'Candidate: multivariate() mutates the cached sklearn estimator in place and returns an alias of it. pyspi/statistics/basic.py:49-50 ''matrix = getattr(mycov, self._kind + "_")'' then ''np.fill_diagonal(matrix, np.nan)''; probe: after Covariance(...).multivariate(dat), dat.covariance[''EmpiricalCovariance''].covariance_ diagonal is [nan nan nan nan] and ''returned is cache: True''. No current output changes (precision_ is computed at fit time, before the mutation, and nothing else reads data.covariance), but any later consumer of the cached fit (get_precision, score, mahalanobis) or of the returned array would see the NaN diagonal or alias the cache.'
  - 'Candidate (documentation, material): prec_* is not partial correlation and not bounded by [-1,1]. Probe bivariate_gaussian T=1024 pair (2,3): prec_EmpiricalCovariance = -2.1933, partial correlation from the same matrix = +0.7972; cointegrated T=1024 max |prec| = 95.3.'
  - 'Candidate (documentation): the ''cov-sq_*''/''prec-sq_*'' variants (pyspi/config.yaml:21-36, 56-71) are not described in supplement §1.1.1-1.1.2 or GitBook; probe confirms they are exactly np.square of the unsquared matrix (np.array_equal True).'
  - 'Candidate: singular covariance is handled silently by pinvh (scipy/linalg/_basic.py:2017-2023 drops eigenvalues <= P*eps*max|eig|). Probe shared_envelope T=256 (x2 bit-identical to x0): eig(S) = [0, 0.614, 0.932, 2.438], prec[0,2] = +0.338, comparable to unrelated pairs; P=8 > T=5 random data gives finite values (max 0.75). The documented ''matrix inverse'' does not exist here.'
  - 'Scaling note (not a deviation from the documented definition, which says ''For normalized time-series data''; supplement §1.1.2, p.4): on the default z-scored pipeline prec is the inverse of the (shrunk) correlation matrix, scaled by T/(T-1), not the inverse of the raw-units covariance. Probe sparse_precision T=4096 (prec_EmpiricalCovariance): kernel path (normalise=False) prec[0,1] = -0.393 (dataset precision_true -0.4) vs pipeline prec[0,1] = -0.539; D Theta_kernel D [0,1] = -0.5392 with D = diag(sqrt(S_ii)), i.e. the pipeline value is T/(T-1) times the kernel precision rescaled by the channel standard deviations. Relevant to anyone comparing pipeline prec values with a known raw-units precision matrix.'
