  check_method: independent-impl
  check_reference: audit/checks/refs/cov_prec_simple.py:ref_matrix/handle (numpy/scipy only, no sklearn) with _kernels_basic_misc.empirical_cov followed by np.linalg.inv (LU; the pinvh mirror _kernels_basic_misc.precision is reported as an extra key); Monte Carlo of the dataset population models (refs/cov_prec_simple.py:mc_stats, N=1000); probes/cov_prec_simple_probes.py:{spi, shrinkage, mutation, mutation_others} for the P=19 stacks, average-referenced input, fitted shrinkage_ and the cache-mutation flags
  check_data: bivariate_gaussian; scaled_offset; trending; sparse_precision; cointegrated; iid_gaussian; shared_envelope; delayed_noise; var2_bivariate; var2_chain; logistic_maps_chaotic; anm; P=19 stackA (iid_gaussian+bivariate_gaussian+sparse_precision+gauss_ar1_pair+var2_chain); P=19 stackB (delayed_noise+narrowband_f0-0.1+narrowband_f0-0.25+var2_bivariate+bivariate_gaussian+var2_chain); average-referenced bivariate_gaussian and stackB (rank P-1). T in {64, 256, 1024, 4096}; paths kernel, pipeline, pipeline-detrend
  agreement_criterion: 'tolerance rtol 1e-10 with atol 1e-12*max|Theta| (norm-wise accuracy of a computed inverse) against np.linalg.inv of the independent estimator; pseudo-inverse runs (singular, avgref) against numpy SVD pinv / eigh pseudo-inverse with the same tolerance; statistical: |pyspi - E_MC| <= 2 se_fw, se_fw = Monte Carlo sd x familywise factor (1.32 for P=4, 1.40 for P=5) so the rule is a two-sided familywise 5% test over the P(P-1)/2 pairs; qualitative: symmetry (<= 1e-12 max|A|, REVIEW M2) with value agreement, and order independence under the cache mutation; documented-claim runs (doc-*) are tolerance 1e-10 comparisons that are expected to fail and record the size of the gap'
  closeness: '52/55 runs pass in checks/out/results/cov_prec_simple.json. Independent reference: 36/36 value runs pass (kernel, pipeline, pipeline-detrend, squared, symmetry, singular, average-referenced, P=19 stacks), max abs 1.3e-11, max rel 1e-09. Partial correlation (documented quantity): pyspi has the opposite sign on every pair with |pcorr| > 1e-3 (frac_opposite_sign = 1.0 on bivariate_gaussian, sparse_precision and cointegrated), bivariate_gaussian T=1024 pair (2,3) prec = -2.193 vs partial correlation 0.7972, pair (0,1) -0.3065 vs 0.2816; max |prec| = 95.34 on cointegrated (partial correlation max 0.9879); -prec_ij/sqrt(Theta_ii Theta_jj) reproduces the partial correlation to 4.1e-14. prec-sq is bitwise np.square of the plain output (bitwise_equal_square_of_plain = 1). Singular input (shared_envelope, x2 == x0): pyspi equals numpy.linalg.pinv (max rel 4.31e-15 at T=256, 4.07e-14 at T=1024) while np.linalg.inv raises ''Singular matrix''; duplicated pair (0,2) = 0.3379 (T=256) / 0.3338 (T=1024). Average-referenced input (rank P-1): pyspi equals the pseudo-inverse with the structural null eigenvalue removed (P=4 max rel 9.19e-16, P=19 max rel 4.5e-13; smallest eigenvalue 2.58e-16 / -1.02e-15, LU inverse max 2.36e+15 / 1.1e+16). Pipeline scaling: pyspi pipeline prec = D1 Theta_kernel D1 with D1 = diag(sd, ddof=1) to max rel 3.03e-14; sparse_precision T=4096 pair (0,1): pipeline -0.5393, kernel -0.3925, precision_true -0.4. Statistical vs the population model (N=1000 Monte Carlo through the same estimator): 13/13 pass; sparse_precision kernel T=256/1024/4096 max |pyspi - limit| 0.141/0.0595/0.0209 against precision_true (tridiagonal, -0.4), max_z <= 1.92. The largest elementwise relative difference of the precision comparisons sits at a near-zero entry and is inside atol = 1e-12 max|Theta|; rtol was 1e-10 on every run. Symmetry: max|A - A.T| = 5.68e-14 over 54 matrix runs (53 with a nonzero last-bit difference; largest at basic.prec.EmpiricalCovariance|trending|1024|pipeline|ref).'
