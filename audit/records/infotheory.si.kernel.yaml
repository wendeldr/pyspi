optimisation:
  complexity_P_T: 'O(P^2 T^1.7): StochasticInteraction.bivariate (infotheory.py:524-534), three conditional box-kernel entropies (6 JIDT calls of 1-4 dimensions) per ordered pair; Undirected computes both
    orders. Measured fresh P exponent 1.95, T exponent 1.66. At 118x1024 the pair term dominates: 447 s projected (extrapolated-pairs-from-32).'
  hotspot_1: pyspi/statistics/infotheory.py:JIDTBase._compute_conditional_entropy (third-party:jidt, self time) 99.8% cum / 99.6% self of the profiled SPI call at 8x1024 (168 calls)
  hotspot_2: 'none visible inside Java; the split between the joint (4-D, 2-D) and per-channel (2-D, 1-D) terms is not in the profile. opaque_share is a lower bound: JPype dispatches Java methods without
    cProfile entries, so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0013
  profile_file: audit/profiles/infotheory.si.kernel__8x1024.pstats
  opportunities:
  - opportunity_id: it_kernel-1
    opportunity: 'Cache the per-channel entropy terms that do not depend on the partner at Data level (like data.entropy): si''s H(x_t | x_{t-1}) per channel, xme''s H(source past) per source, di''s target
      entropy-rate sum per target, so each JIDT box-kernel call runs P times instead of P(P-1) times.'
    opp_type: cache-sharing
    expected_speedup: ~2x
    speedup_basis: 'profile:audit/profiles/infotheory.si.kernel__8x1024.pstats pyspi/statistics/infotheory.py:180 _compute_conditional_entropy 99.8% + complexity: H(x_t|x_{t-1}) and H(y_t|y_{t-1}) (2-D
      + 1-D calls each) depend on one channel: 4 of the 6 calls per ordered pair become P cached calls; weighting calls by dimension (joint 4+2 vs 3+3 per channel) the cached half of the work goes, ~2x
      (cProfile cannot split the 99.8% frame).
      Ranked on the residual after it_kernel-2 (depends_on) with residual_speedup 1-2x. The bitsets change the cost of every count, and their gain differs with the number of ANDed rows (10-50x for d
      <= 3, 5-20x where up to ten lag windows are ANDed, audit/notes/it_kernel.md:743), so the share of the per-channel terms in that residual is not known and the lower bound credits no saving there;
      this figure holds on today''s JIDT cost'
    output_risk: unverified-bit-identical
    risk_evidence: the same JIDT call on the same array, made once instead of once per pair; the box-kernel path adds no noise, and the Kozachenko path re-seeds its jitter with NOISE_SEED 42 at every setObservations,
      so a cached call returns the same value
    effort: S
    depends_on:
    - it_kernel-2
    residual_speedup: 1-2x
  - opportunity_id: it_kernel-2
    opportunity: 'Replace JIDT''s box-kernel counting with per-(channel, width, lag window) neighbourhood bitsets: one T x T bit matrix marks |x(t) - x(s)| <= w_d (w_d = width x the column''s ddof=1 SD,
      as KernelEstimatorMultiVariate sets it) and every joint count of je/ce/mi/tlmi/te/si/xme/cce/di is a popcount of ANDed rows, so the neighbourhood search is shared by all P-1 partners and all composed
      terms.'
    opp_type: algorithmic
    expected_speedup: 10-50x
    speedup_basis: 'profile:audit/profiles/infotheory.si.kernel__8x1024.pstats pyspi/statistics/infotheory.py:180 _compute_conditional_entropy 99.8% (JIDT Java time booked as pyspi self time) + complexity:
      one joint count over all t is T x T/64 = 16k word AND+popcount operations at T=1024 (~10-50 us) against the measured 39.0 ms per ordered pair (8x1024 fresh; T exponent 1.66); bitsets are built once
