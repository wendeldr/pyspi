unit_id: infotheory.si.kernel
status: profiled
correctness:
  metric_name_standard: Stochastic interaction SI = H(X_t|X_{t-1}) + H(Y_t|Y_{t-1}) - H(X_t,Y_t | X_{t-1},Y_{t-1}) (Ay), lag 1, box-kernel plug-in, bits
  canonical_ref: Ay N (2001) 'Information geometry on complexity and stochastic interaction', MPI MIS preprint 95/2001, published Entropy (2015) 17:2432-2458 (GitBook ref [1]); Ay N, Wennekers T (2003)
    Neurocomputing 52-54:461 (GitBook ref [2]); Barrett AB, Seth AK (2011) PLoS Comput Biol 7:e1001052 (Gaussian form)
  canonical_definition: SI(X;Y) = sum_k H(M^k_t | M^k_{t-tau}) - H(M_t | M_{t-tau}) for the bipartition M = (X,Y), tau = 1; >= 0 for the true distribution
  documented_definition: 'supplement §1.4.9, p.12 (supplement.txt:539-549; pack lines 551-561): ''Stochastic interaction [47, 48] is a measure of integrated information between two processes in the context of their own past. It
    is quantified by the difference between the joint entropy of the bivariate process and the individual entropies of each univariate process. Both entropies are measured in context of (conditioned on)
    the history of the processes; we restrict this history to be only one-step, assuming a first-order Markov process.'' identifier 90 si_kernel_W-0.5_k-1; keywords undirected, nonlinear, unsigned, bivariate,
    time-dependent. GitBook information-theory.md:184-202 same.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): EntropyCalculatorMultiVariateKernel
    (4-D, 2-D, 1-D), combined in pyspi'
  implemented_as: x, y = z_i, z_j as (T,1); xy = [x, y]; tau = 1; H_joint = H(xy[1:] | xy[:-1]) = H_kernel(4-D [x_t, y_t, x_{t-1}, y_{t-1}]) - H_kernel(2-D [x_{t-1}, y_{t-1}]); H_src = H(x_t | x_{t-1});
    H_targ = H(y_t | y_{t-1}) (2-D minus 1-D); SI = H_src + H_targ - H_joint, each on T-1 samples. Kernel half-width 0.5*sampleSD per column, closed box, self-included.
