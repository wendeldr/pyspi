  deviation_from_documented: 'None in substance: the sign is individual minus joint (the documented ''difference between the joint entropy ... and the individual entropies'' leaves the order open; code
    follows the canonical non-negative convention). ''k-1'' in the identifier is the delay tau, not an embedding length.'
  deviation_from_canonical: 'Matches Ay''s SI with tau=1. Estimator: plug-in box kernel without bias correction gives a positive null bias (probe iid_gaussian means 1.766/0.934/0.407/0.150 bits at T=64/256/1024/4096
    vs canonical 0).'
  units_and_range: bits; can be negative in principle (estimator), observed positive; symmetric; finite.
  direction_convention: 'Undirected: A[i,j] = A[j,i] (formula symmetric under swapping x and y because max-norm box counts are invariant to column order; Undirected.multivariate mirrors). Probe: exact symmetry
    on delayed_noise and var2_bivariate T=1024.'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (bias magnitude): si_kernel_W-0.5_k-1 between independent white-noise series is 1.77 bits at T=64 and still 0.15 bits at T=4096 (probe iid_gaussian means), compared with gauss_ar1_pair-type
    coupling effects of similar size; values are T-dependent.'
  - 'Candidate (label/identifier semantics): the ''_k-1'' suffix (infotheory.py:522) denotes the delay tau, while ''_k-'' denotes target history length in te identifiers; not a numerical issue.'
  - 'Candidate (copy path, confirmed by probe): a CalculatorFrame computes si_kernel_W-0.5_k-1 with kernel width 0.25 while the identifier still reads W-0.5. JIDTBase.__deepcopy__ (infotheory.py:77-82)
