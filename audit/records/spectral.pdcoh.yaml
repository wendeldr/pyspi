  what_changed: 'The formula is the canonical squared PDC (fp-exact), but PDC''s defining property, partialisation on all other channels so that it vanishes without a direct link, is lost because every
    ordered pair is fitted as its own 2-channel model: on var2_chain the conditioned PDC(0->2) is 0 while the bivariate population value is 0.0887 and pyspi reports 0.2117. In 2x2, H = adj(A)/det(A) makes
    the off-diagonal |PDC|^2 identical to DTF, so for any P pdcoh returns exactly the dtf matrix (already documented in tests/README.md; the mechanism is the 2x2 adjugate identity). Squared rather than
    modulus (Baccala & Sameshima 2001 define the modulus; monotone). Estimator bias, inversion on delayed_noise, row = target and open bands as for dtf. Rubric anchor 3 (label does not describe the computation;
    same case as the rubric''s ''dDTF bivariate'' example): the output is exactly the dtf matrix for every P and every identifier (ident 7/7, 4.4e-16),
    so nothing partial is left and the label ''partial directed coherence'' does not describe what is returned. Anchor 7 (supplement variant with bivariate instead of multivariate normalisation) was considered, because the pdcoh keywords say ''bivariate'' (supplement.txt:790), and rejected: the pairwise fit does not merely renormalise PDC, it removes the partialisation that defines it, and the 2x2 adjugate identity makes the output exactly the dtf matrix. That is the situation of the rubric''s own anchor-3 example ''dDTF bivariate'', whose supplement section (supplement.txt:753) also carries the ''bivariate'' keyword. Rescored from 4 after review: anchor 3 names this case (a conditioning measure computed on a 2-channel model), whereas anchor 4 (related but different quantity) does not. For P = 2 inputs the value equals the canonical
    squared PDC of the 2-channel model, which in 2x2 is itself identical to DTF.'
