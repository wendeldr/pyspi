    pdcoh [[nan, 0.1345, 0.1027], [0.263, nan, 0.1367], [0.1907, 0.3004, nan]]: A[2,0] = 0.1907 for a pair with no direct link, whereas the 3-channel PDC is exactly 0 (p2_kernel.py var2_chain ''partial_directed_coherence
    ... [0.0, 0.2045, 1.0]'').'
  - 'CANDIDATE (identity with dtf explained): 2x2 adjugate identity makes off-diagonal |PDC|^2 = DTF exactly (p10_dc_gpdc.py ''off-diag max|DTF - PDC| 2.2e-16''; p3_pipeline.py ''max|dtf - pdcoh| var2_chain
    T1024 (off-diag): 1.11e-16''); the equality itself is already documented (tests/README.md worth knowing), the mechanism is new detail.'
  - 'CANDIDATE (squared vs modulus): library returns |pi|^2 (connectivity.py:834-836 _squared_magnitude) while Baccala & Sameshima 2001 define pi (modulus in [0, 1]); band means differ from mean |pi|.'
  - 'CANDIDATE (direction reversed vs documentation; estimator failure on delayed copies): as for dtf (p3_pipeline.py var2_bivariate [[nan, 0.1281], [0.2617, nan]]; delayed_noise A[0,k] ~0.82 vs A[k,0]
