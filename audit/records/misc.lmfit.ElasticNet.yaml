    self._spis[spi.identifier] = spi (257); the class attribute labels (misc.py:109) are what the calculator reports'
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False) (187), then scipy.stats.zscore(axis=1, nan_policy="omit",
    ddof=1) if normalise=True (default) (195); stored as (M, T, 1)'
  - 'pyspi/calculator.py:329-339 Calculator.compute (HEAD a1f20c7): S = self._spis[spi].multivariate(self.dataset) (329); np.fill_diagonal(S, np.nan) (332); any exception
    -> self._table[spi] = np.nan (336-337), so one failing pair makes the whole matrix NaN'
  - 'pyspi/base.py:84-94 Directed.multivariate: for j (outer), for i != j (inner): A[i, j] = self.bivariate(data, i=i, j=j); no mirroring'
  - 'pyspi/base.py:27-49 parse_bivariate: Data passed through unchanged (two raw arrays would be wrapped into a new z-scored Data with i, j = 0, 1)'
  - 'pyspi/data.py:108-118 Data.to_numpy(): returns the (M, T, 1) array, so z[i] is a (T, 1) design matrix with one feature'
  - pyspi/statistics/misc.py:106-109 class LinearModel(Directed, Unsigned); labels ["misc", "unsigned", "unordered", "normal", "linear", "directed"]
  - 'pyspi/statistics/misc.py:111-113 __init__: identifier "lmfit_<model>", self._model = getattr(sklearn.linear_model, model)'
  - 'pyspi/statistics/misc.py:117-124 bivariate: z = data.to_numpy(); warnings suppressed; if "random_state" in inspect.signature(model).parameters: model(random_state=42).fit(z[i],
    ravel(z[j])) else model().fit(z[i], ravel(z[j])) -> predictor = process i, target = process j'
  - pyspi/statistics/misc.py:125-126 y_predict = mdl.predict(z[i]); return mean_squared_error(y_predict, ravel(z[j])) -> in-sample (training) MSE on the same T samples
    used for fitting (argument order swapped, harmless because MSE is symmetric)
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_coordinate_descent.py:884-894 class ElasticNet docstring objective; defaults alpha=1.0, l1_ratio=0.5,
    max_iter=1000, tol=1e-4, selection="cyclic", random_state=None (probe inspect.signature)
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_coordinate_descent.py:1096-1294 ElasticNet.fit: _pre_fit (1212-1221), zero coef init (1233-1236), self.path(...)
    (1248-1270), _set_intercept (1283)'
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:832 _pre_fit -> _preprocess_data (188-199) centring
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_coordinate_descent.py:477 enet_path; 781-784 l1_reg = alpha*l1_ratio*n_samples (= 0.5 T), l2_reg = alpha*(1-l1_ratio)*n_samples
    (= 0.5 T); 841-853 cd_fast.enet_coordinate_descent
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_cd_fast.pyx:392 tol *= y@y (centred y, = T-1 on z-scored data); 394-400 duality gap at the initial w
    = 0 via gap_enet (162-) / dual_gap_formulation_A (138-159): with |x.y| > l1_reg the gap is 0.5 y.y (1 - l1_reg/|x.y|)^2, and if gap <= tol the solver returns
    w = 0 with n_iter 0 (400); 402-422 gap-safe screening; 425-448 cyclic coordinate update w_j = sign(tmp) max(|tmp| - l1_reg, 0) / (||x_j||^2 + l2_reg); 471 convergence
    on gap <= tol*y@y. _coordinate_descent.py:864 reports dual_gap_ = gap / n_samples (so dual_gap_ is compared with tol*y.y/T, not tol*y.y)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:301-316 LinearModel.predict -> _coordinate_descent.py:1301-1317 ElasticNet._decision_function (dense input: super()._decision_function, _base.py:291-299): X @ coef_ + intercept_'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:318-334 _set_intercept: intercept_ = y_offset - X_offset @ coef_ (unpenalised intercept)'
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/_regression.py:524-600 mean_squared_error: _average((y_true - y_pred) ** 2, axis=0) (586-588), divisor T'
  deviation_from_documented: '(a) Documented as "the Elastic-Net model [76, 77], which uses both l1 and l2-norm regularization" with default parameters: matches the
    code (alpha=1, l1_ratio=0.5); but ref [77] (Andersen et al., interior-point methods for cone programming) is not the algorithm used (coordinate descent, ref [76]).
    (b) Not stated: with these defaults the l1 threshold plus the solver''s tol-based initial exit zero the coefficient for every pair with |r| <= ~0.51 (0.5 T/((T-1)(1
    - sqrt(2e-4)))), so the SPI is the constant (T-1)/T for weak and moderate dependence. (c) "directed": symmetric on z-scored data.'
  deviation_from_canonical: 'The estimator is the naive elastic net of Zou & Hastie 2005 (no (1 + lambda2) rescaling of the coefficients, which Zou & Hastie recommend
    to undo double shrinkage), in sklearn''s 1/(2T) loss scaling. It equals the exact minimiser except in a band just above the l1 threshold: sklearn''s initial duality-gap
    exit (tol = 1e-4 relative to y.y) returns w = 0 for 0.5 T/(T-1) < |r| <= 0.5 T/((T-1)(1 - sqrt(2e-4))) where the exact minimiser has w > 0, an MSE overstatement
    of up to ~4.8e-3 (probe max 3.50e-3 on the audit datasets). The SPI (in-sample MSE at a fixed, large penalty) is a pyspi construction: it saturates at (T-1)/T
    for |r| up to ~0.51, jumps by ~4.8e-3 at that bound, and cannot fall below ~4/9 even for identical series, so it is a heavily censored, monotone (non-increasing
    in |r|) function of |r| with one jump discontinuity.'
  units_and_range: 'units of the target variance; on z-scored data in [~0.444, (T-1)/T]: (T-1)/T for |r| <= 0.5 T/((T-1)(1 - sqrt(2e-4))) (0.5152 at T=64, 0.5073
    at T=4096; the exact-minimiser threshold 0.5 T/(T-1) is lower), then a jump down by ~4.8e-3 and a decrease to c (1 - w)^2 ~ 4/9 at |r| = 1 (probe shared_envelope
    identical pair 0.4468 at T=64); symmetric under default preprocessing; asymmetric and scale dependent with normalise=False; unsigned, >= 0.'
  direction_convention: 'A[i, j] = in-sample MSE of the linear prediction of process j (target, column) from process i (predictor, row), per misc.py:122-126; LOWER
    = j better linearly predicted from i. Code-derived; with the default z-scoring the matrix is symmetric (see units_and_range), so the direction is only empirically
    identifiable with normalise=False, where column j scales with var(x_j) (probe on scaled_offset_T1024: column means of A track std_j^2 = 0.0395, 4.058, 24.78,
    97.89).'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
