    exit (_cd_fast.pyx:391-400, tol*y.y = 1e-4 (T-1)) widens this to |r| <= 0.5 T/((T-1)(1 - sqrt(2e-4))) (~0.507-0.515), so A[i, j] = (T-1)/T over that range; evidence
    probe1.py: ElasticNet range [0.9961, 0.9961] on iid_gaussian, delayed_noise and nonlinear_dependence at T=256 (constant), and on bivariate_gaussian only the rho=0.8
    pair departs (range [0.6935, 0.9961]); lmfit_fix/fix1.py: 6 of 552 ordered pairs lie in the widened band (e.g. sparse_precision T=64 (1,0) r=0.5130 returns 63/64
    where the exact minimiser gives 0.981006).'
  - 'Candidate (floor at ~4/9): identical series give c(1 - (c - 0.5)/(c + 0.5))^2 -> 4/9, probe4.py "ElasticNet A[0,2]=4.468e-01" (T=64) and 4.445e-01 (T=4096) for
    shared_envelope x2 = x0, so the SPI cannot distinguish r = 0.9 from r = 1 on the scale other lmfit SPIs use.'
  - 'Candidate (direction label is nominal under default preprocessing): after ddof=1 z-scoring every process has sum x^2 = T-1 and mean ~0, so the fit and its in-sample
    MSE are functions of (r_ij, T) only and A is symmetric; probe max |A - A.T| = 7.8e-16 across 24 dataset/T combinations although the class is Directed (misc.py:106)
    and labelled "directed". Asymmetry appears only with normalise=False, where A[i, j] is in units of var(x_j).'
  - 'Candidate (citation): supplement ref [77] (Andersen, Dahl, Liu et al., interior-point methods for large-scale cone programming) is cited for the Elastic-Net
    model but sklearn uses coordinate descent (ref [76]); the canonical elastic-net reference (Zou & Hastie 2005) is not cited.'
  - 'Candidate (solver-tolerance artefact, jump discontinuity): because of the tol-based initial exit, the SPI is not the elastic-net MSE for 0.5 T/(T-1) < |r| <=
    0.5 T/((T-1)(1 - sqrt(2e-4))) and jumps by ~4.8e-3 at the upper bound (fix1.py analytic gap 4.83e-3 to 4.88e-3 for T = 4096..64; fix2.py sweep confirms the switch
    point to 1e-5 in r). The value in that band depends on sklearn''s tol default and gap formula, not on the documented model.'
