unit_id: misc.lmfit.ElasticNet
status: profiled
correctness:
  metric_name_standard: in-sample mean squared error of an elastic-net regression (sklearn alpha = 1, l1_ratio = 0.5, i.e. naive elastic net with lambda1 = 0.5 and
    lambda2 = 0.5 on the 1/(2T) loss scale) of y = x_j on x = x_i
  canonical_ref: 'Zou & Hastie 2005, J. R. Stat. Soc. B 67(2):301-320 (naive elastic net, eq. 3; their recommended estimator rescales by (1 + lambda2), section 3.2);
    coordinate descent solution: Friedman, Hastie & Tibshirani 2010, J Stat Softw 33(1):1-22 (supplement ref [76]); scikit-learn objective (1/(2T)) ||y - Xw||^2 +
    alpha l1_ratio ||w||_1 + 0.5 alpha (1 - l1_ratio) ||w||^2 (_coordinate_descent.py:884-894)'
  canonical_definition: 'single centred predictor: w = S(sum(xc*yc)/T, alpha*l1_ratio) / (sum(xc^2)/T + alpha*(1 - l1_ratio)); MSE = (1/T) sum (y - b - w x)^2. For
    z-scored inputs with c = (T-1)/T: w = sign(r) max(|r| c - 0.5, 0) / (c + 0.5) and MSE = c (1 - 2 w r + w^2); the exact minimiser has w = 0 and MSE = (T-1)/T only
    for |r| <= 0.5 T/(T-1). This is the exact minimiser; sklearn''s stopped solver returns w = 0 over a wider band (see implemented_as).'
  documented_definition: 'supplement §1.6.1, p.18 (supplement.txt lines 856-868; the briefing pack gives 874-887, which is off by 18 lines): "we use a number of linear
    models and record the mean squared error (MSE) of a regression of y on x. The following models (with the default parameters) from scikit-learn [2] are included:
    stochastic gradient descent regression with a squared loss (ordinary least squares fit) function (denoted by modifier SGDRegressor); Ridge regression, which uses l2-norm regularization
    (Ride); the Elastic-Net model [76, 77], which uses both l1 and l2-norm regularization (ElasticNet); and the Bayesian Ridge regressor uses a gamma distribution
    prior (with lambda1 = lambda2 = 1e-6) for the l2-norm regularizor in Ridge regression (BayesianRidge). This yields four SPIs: 215. lmfit_SGDRegressor 216. lmfit_Ridge
    217. lmfit_ElasticNet 218. lmfit_BayesianRidge"; keywords "directed, linear, unsigned, bivariate, contemporaneous"; rationale "Linear regression is commonly used
    for establishing independence through model fits (e.g., see additive noise models in Sec. 1.3.1)". GitBook spi-descriptions/miscellaneous.md "Linear Model Fit"
    repeats the text verbatim (including the typo "Ride") and lists the same four identifiers.'
  delegate_lib: scikit-learn==1.9.1 sklearn.linear_model.ElasticNet(random_state=42).fit -> enet_path -> _cd_fast.enet_coordinate_descent (Cython); sklearn.metrics.mean_squared_error;
    numpy==2.5.4
  implemented_as: 'A[i, j] = in-sample MSE of the sklearn ElasticNet(alpha=1.0, l1_ratio=0.5, fit_intercept=True, max_iter=1000, tol=1e-4, selection="cyclic", random_state=42)
    fit of z_j on z_i. Coordinate descent starts at w = 0 and first evaluates the duality gap there (_cd_fast.pyx:391-400). With one z-scored feature, l1_reg = 0.5
    T and s = x.y = r (T-1), that gap is 0.5 y.y (1 - min(1, 0.5 T/|s|))^2 (dual_gap_formulation_A, _cd_fast.pyx:138-159), and the solver returns w = 0 with n_iter_
    0 whenever it is <= tol*y.y = 1e-4 (T-1), i.e. whenever |r| <= 0.5 T/((T-1)(1 - sqrt(2e-4))) (0.51522 at T=64, 0.50916 at 256, 0.50767 at 1024, 0.50730 at 4096).
    Otherwise one cyclic update reaches the closed form above and the next gap check stops (n_iter_ 2). So pyspi returns (T-1)/T for |r| up to that tol bound, which
    is wider than the exact-minimiser threshold 0.5 T/(T-1) (0.50794 / 0.50196 / 0.50049 / 0.50012); in the band between them the exact minimiser has w between 0
    and ~0.0048 and an MSE up to ~4.8e-3 below (T-1)/T, so the SPI jumps by ~4.8e-3 at the tol bound. Probe (lmfit_fix/fix1.py, 14 datasets x 4 T, 552 ordered pairs):
    max |A - closed form| = 3.50e-3 (6 pairs fall in the band, e.g. sparse_precision T=64 pair (1,0) r=0.5130: closed form 0.981006, pyspi 0.984375 = 63/64); max
    |A - closed form with the modelled tol exit| = 2.8e-16. Synthetic sweep (fix2.py, r step 1e-5 around the bound) places sklearn''s switch from w = 0 to w != 0
    at the modelled bound (1 boundary point of 1604 misclassified, at T=4096). Consequences on z-scored data: every pair with |r| <= ~0.51 gets the constant (T-1)/T
    (probe: iid_gaussian, delayed_noise, nonlinear_dependence all constant; bivariate_gaussian rho=0.3 pair constant); a perfectly dependent pair (r = 1) gives c
    (1 - w)^2 with w = (c - 0.5)/(c + 0.5) -> about 4/9 (probe shared_envelope identical pair: 0.4468 at T=64, 0.4445 at T=4096). random_state is inert (selection="cyclic").'
  implementation_trace:
  - 'pyspi/config.yaml:1264-1278 .statistics.misc LinearModel: labels directed/linear/unsigned/bivariate/contemporaneous; configs model: Ridge, Lasso, SGDRegressor,
    ElasticNet, BayesianRidge (Lasso is the fifth, undocumented config)'
