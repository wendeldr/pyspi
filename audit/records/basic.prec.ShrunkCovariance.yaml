optimisation:
  complexity_P_T: 'O(P^2 T) for the empirical covariance + O(P^3) for scipy.linalg.pinvh (a full eigh) that sklearn _empirical_covariance.py:_set_covariance runs for precision_ on every fit; one fit per
    Data and estimator (pyspi/statistics/basic.py:Estimators._from_cache). Measured fresh P_exponent 0.15, T_exponent 0.11: between 8 and 32 channels and 256 and 1024 samples the ~0.7 ms of fixed sklearn
    validation dominates, so neither exponent reflects the algorithm. At 118x1024 the P^3 term dominates: in the 118x1024 EmpiricalCovariance profile eigh is 58.7% and np.cov 15.4% of the call; the same
    pinvh on a 118x118 matrix runs for every estimator of this family.'
  hotspot_1: scipy/linalg/_basic.py:pinvh (third-party:scipy) 11.4% cumulative of the profiled SPI call at 8x1024, of which scipy/linalg/_decomp.py:eigh 5.3%; at 118x1024 eigh is 58.7% (pinvh 63.0%) of
    the EmpiricalCovariance call (audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats, index prof_basic__index.json), the same 118x118 pinvh this estimator runs
  hotspot_2: sklearn/utils/validation.py:check_array (third-party:sklearn) 33.1% at 8x1024 (fixed input validation; 10.6% at 118x1024 in the EmpiricalCovariance profile); sklearn/covariance/_empirical_covariance.py:empirical_covariance
    15.5% at 8x1024
