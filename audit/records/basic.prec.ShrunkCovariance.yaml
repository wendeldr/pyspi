  agreement_criterion: 'tolerance rtol 1e-10 with atol 1e-12*max|Theta| (norm-wise accuracy of a computed inverse) against np.linalg.inv of the independent estimator; pseudo-inverse runs (singular, avgref) against numpy SVD pinv / eigh pseudo-inverse with the same tolerance; statistical: |pyspi - E_MC| <= 2 se_fw, se_fw = Monte Carlo sd x familywise factor (1.32 for P=4, 1.40 for P=5) so the rule is a two-sided familywise 5% test over the P(P-1)/2 pairs; qualitative: symmetry (<= 1e-12 max|A|, REVIEW M2) with value agreement, and order independence under the cache mutation; documented-claim runs (doc-*) are tolerance 1e-10 comparisons that are expected to fail and record the size of the gap'
