  deviation_from_documented: No definition documented; identifier in table-of-spis.md lacks W-0.5. 'k10' suggests 10 lags but 9 are used.
  deviation_from_canonical: '(1) Off-by-one: 9 source lags instead of 10 (range(2, k) should run to k inclusive), and the first usable sample is discarded. (2) Estimator degeneracy: the 0.5-SD box in 9-10
    dimensions is empty except for the query point for nearly all samples, so the plug-in collapses to ~0 independent of coupling. (3) Name as in xme k1.'
  units_and_range: bits; observed in [-0.003, 0.033] on iid data T=256..4096 and 0.006-0.024 on coupled data; can be slightly negative (sub-series SD != 1); asymmetric; finite.
  direction_convention: 'A[i,j] = h_hat(X_j,t | X_i,t-1..t-9); low = predictable from i''s past. In practice no usable direction: probe delayed_noise T=1024 A[0,1] = 0.0058, A[1,0] = 0.0117; var2_bivariate
    T=1024 A[0,1] = 0.0238, A[1,0] = 0.0094 (the coupled direction is the LARGER value here).'
  symmetry_expected: asym
  already_documented: 'no'
