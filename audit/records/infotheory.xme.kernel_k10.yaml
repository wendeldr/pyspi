optimisation:
  complexity_P_T: 'O(P^2 T^1.8 k): as xme_k1 with a 10-D joint and 9-D source embedding. Measured fresh T exponent 1.78; 251 s projected at 118 (extrapolated-pairs-from-8).'
  hotspot_1: pyspi/statistics/infotheory.py:CrossmapEntropy.bivariate (third-party:jidt, self time) 100.0% cum / 99.4% self of the profiled SPI call at 8x1024
  hotspot_2: 'none visible inside Java. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.0014
  profile_file: audit/profiles/infotheory.xme.kernel_k10__8x1024.pstats
  opportunities:
  - opportunity_id: it_kernel-1
    opportunity: 'Cache the per-channel entropy terms that do not depend on the partner at Data level (like data.entropy): si''s H(x_t | x_{t-1}) per channel, xme''s H(source past) per source, di''s target
      entropy-rate sum per target, so each JIDT box-kernel call runs P times instead of P(P-1) times.'
    opp_type: cache-sharing
    expected_speedup: ~1.9x
    speedup_basis: 'profile:audit/profiles/infotheory.xme.kernel_k10__8x1024.pstats pyspi/statistics/infotheory.py:405 CrossmapEntropy.bivariate 100.0% + complexity: H(source past) (9-D) depends only on
      the source: by dimension 9 of 19 parts of the work become P cached calls, ~1.9x.
      Ranked on the residual after it_kernel-2 (depends_on) with residual_speedup 1-1.9x. The bitsets change the cost of every count, and their gain differs with the number of ANDed rows (10-50x for d
      <= 3, 5-20x where up to ten lag windows are ANDed, audit/notes/it_kernel.md:743), so the share of the per-channel terms in that residual is not known and the lower bound credits no saving there;
      this figure holds on today''s JIDT cost'
    output_risk: unverified-bit-identical
    risk_evidence: the same JIDT call on the same array, made once instead of once per pair; the box-kernel path adds no noise, and the Kozachenko path re-seeds its jitter with NOISE_SEED 42 at every setObservations,
      so a cached call returns the same value
    effort: S
    depends_on:
    - it_kernel-2
    residual_speedup: 1-1.9x
  - opportunity_id: it_kernel-2
    opportunity: 'Replace JIDT''s box-kernel counting with per-(channel, width, lag window) neighbourhood bitsets: one T x T bit matrix marks |x(t) - x(s)| <= w_d (w_d = width x the column''s ddof=1 SD,
      as KernelEstimatorMultiVariate sets it) and every joint count of je/ce/mi/tlmi/te/si/xme/cce/di is a popcount of ANDed rows, so the neighbourhood search is shared by all P-1 partners and all composed
      terms.'
    opp_type: algorithmic
    expected_speedup: 5-20x
    speedup_basis: 'profile:audit/profiles/infotheory.xme.kernel_k10__8x1024.pstats pyspi/statistics/infotheory.py:405 CrossmapEntropy.bivariate 100.0% (JIDT Java time booked as pyspi self time) + complexity:
      one joint count over all t is T x T/64 = 16k word AND+popcount operations at T=1024 (~10-50 us) against the measured 18.2 ms per ordered pair (8x1024 fresh; T exponent 1.78); bitsets are built once
      per channel and lag window (9 lag windows per source, ANDed per pair)'
    output_risk: unverified-within-tolerance
    risk_evidence: max-norm box counts are products of per-dimension indicators, so integer counts are exact if the closed-box test and the per-column widths match JIDT; the log-sum order changes. The check
      stage's all-pairs numpy counts (audit/checks/refs/_kernels_infotheory.py:entropy_box_kernel / mi_box_kernel / te_box_kernel) reproduce JIDT to <= 2.6e-13 (infotheory.est.kernel closeness)
    effort: L
    depends_on: []
