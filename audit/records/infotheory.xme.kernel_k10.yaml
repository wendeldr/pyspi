unit_id: infotheory.xme.kernel_k10
status: profiled
correctness:
  metric_name_standard: Conditional entropy of the target's present given the source's recent past, H(Y_t | X_{t-1}, ..., X_{t-9}) ('cross-map entropy', history_length=10), box-kernel plug-in, bits
  canonical_ref: No canonical 'cross-map entropy' found; quantity is h(Y_t | X_{t-1..t-m}) (Cover & Thomas 2006 Ch. 8); name evokes Sugihara et al. 2012 Science 338:496 (CCM), not what is computed.
  canonical_definition: h(Y_t | X^{(m)}_{t-1}) = h(X^{(m)}_{t-1}, Y_t) - h(X^{(m)}_{t-1}) with m = history_length (intended 10)
  documented_definition: Not described in the supplement or GitBook information-theory.md; GitBook table-of-spis.md:73 lists xme_kernel_k10 under 'Cross-Map Entropy'; config.yaml:463-464 history_length
    10.
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): EntropyCalculatorMultiVariateKernel
    (10-D joint, 9-D source past)'
  implemented_as: 'Code (infotheory.py:405-426): src, targ = z_i, z_j; k = history_length; targ_future = targ[k:]; src_past starts with src[k-1:-1] (x_{t-1}) and the loop ''for i in range(2, k)'' appends
    x_{t-i}; joint = [src_past, targ_future]; value = H_kernel(joint) - H_kernel(src_past) with the W-0.5 kernel entropy (half-width 0.5*sampleSD of each sub-series column, closed box, self-included). The
    loop gives max(1, k-1) source lags, not k. For k=10: 9 source lags x_{t-1}..x_{t-9} (columns from src[9:-1], src[8:-2], ..., src[1:-9]) and target y_t for t = 10..T-1 (T-10 samples); joint is 10-D,
    past 9-D. With half-width 0.5 SD per dimension the 9/10-D boxes contain almost only the query point for T <= 4096, so both entropies are ~ log2(T-10) + log2(volume) and the difference is ~0.'
