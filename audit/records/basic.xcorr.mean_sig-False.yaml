  what_changed: 'The quantity is the supplement''s ''average over the considered lags'', computed as T/(T-1) times the mean
    of the Brockwell-Davis CCF over lags -(T//4-1)..T//4. The documented symmetric ''first T/4 lags'' differs by one end lag,
    and the value depends on channel order by up to 1.6e-3, about 10-20% of the typical |A| on short-memory data. For z-scored
    data the CCF sums to 0 over all lags, so the value equals -(sum outside the window)/(2 T//4). It therefore tracks long-memory
    or trend mass outside +-T//4 (0.46-0.63 on cointegrated and trending) and not the dependence at small lags: the rho=0.8
    pair scores -0.0002, below the rho=0.3 pair''s 0.0013. normalise=False gives a non-centred quantity. These are
    properties of the documented quantity, recorded here and not scored. Rubric anchor 6: the library formula deviates from
    both the supplement (''average over the considered lags'', ''first T/4 lags'') and the canonical CCF in an interpretable way,
    a constant factor T/(T-1) plus the one-lag-shifted window -(T//4-1)..T//4 (gap_d2 <= 6.1e-18 after both are applied);
    the window shift changes the value (relative gap_d0 up to 0.54), so anchor 8 (constant factor only) does not apply.'
