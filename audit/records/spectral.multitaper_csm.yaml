optimisation:
  complexity_P_T: 'Per Data and per consumer: DPSS O(K*T) in pure-Python inverse iteration (P-independent, ~17-20 ms), FFT O(K*P*T log T), taper-level CSM O(K*n_fft*P^2) materialised two-sided as (1,1,5,n_fft,P,P) complex128 (1.14 GB at P=118, 5.1 GB at P=249). Infrastructure unit without its own timing: read from the consumers. At 8x1024 DPSS dominates (tridisolve 65.6% of the cohmag call); at 118x1024 the P^2 CSM term dominates (DPSS 1.9%). It is rebuilt once per measure, once more for the first spectral SPI on a Data, once per psi/gd band (twice per psi band) and once per ordered pair on the bivariate path.'
  hotspot_1: .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:tridisolve (DPSS inverse iteration, pure Python; third-party:spectral_connectivity) 65.6% of the profiled cohmag call at 8x1024 (audit/profiles/spectral.cohmag__8x1024.pstats); dpss_windows 1.9% at 118x1024
  hotspot_2: .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_complex_inner_product (numpy matmul outer products) 9.5% of the cohmag call at 8x1024 and 38.5% at 118x1024 (audit/profiles/micro/prof_spectral.cohmag__118x1024.pstats), plus the taper mean 17.2% at 118x1024
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.111
  profile_file: audit/profiles/spectral.cohmag__8x1024.pstats
  opportunities:
  - opportunity_id: spectral_csm-shared-csm
    opportunity: Compute the multitaper Fourier coefficients once per Data and memoise the taper-averaged CSM, power and coherency on the Data under a key without measure or band (pyspi/statistics/spectral.py:46-50, 64-83; this also removes the first-insert string key at :81 that makes the first spectral SPI on a Data compute twice). Every undirected measure, every psi/gd band, the 2x2 blocks of the bivariate directed path and the sgc nonparametric pair loop read from it; the phase-sync measures take their per-taper products from the shared coefficients.
    opp_type: cache-sharing
    expected_speedup: ~2x
    speedup_basis: 'microbench:audit/profiles/micro/opp_spectral_csm-shared-csm.json 2.14x at 118x1024 and 2.30x at 32x1024 (cohmag, phase, psi x3, gd x3 on one Data) + complexity: of the ~45 CSM builds per EEG window only the coherency-type ones collapse (phase, cohmag, icoh, the first-insert recompute, 22 psi and 10 gd evaluations -> 1); the 9 phase-sync per-taper builds are measure-specific (connectivity.py:512-516, 571, 596, 648-654) and remain, so the build count falls 45 -> ~10 (ceiling <4.5x) and the CSM-bound time about 96 s -> 43 s per window (~2.2x). No ranking basis on this row. This infrastructure unit has no SPI identifiers of its own, so profiles/summary.json holds no 118x1024 projection for it and rank_basis_s and projected_patient_s_after stay blank; its cost sits inside the timings of the units that call it. build_csv ranks the row as saving 0 s, after every row of its tier and kind with a positive saving, then by output risk and effort (README ''Optimisation columns'', rule 5).'
    output_risk: bit-identical
    risk_evidence: 'audit/profiles/micro/opp_spectral_csm-shared-csm.json: cohmag, phase, psi x3, gd x3 bit-identical with equal NaN masks at 32x1024 and 118x1024 (same library methods fed one memoised coherency)'
    effort: M
    depends_on: []
  - opportunity_id: spectral_csm-1
    opportunity: Form the taper-level products only on the (n_fft+1)//2 non-negative bins (slice the Fourier coefficients before connectivity.py:196-257 instead of dropping the negative bins afterwards), in frequency blocks so the per-taper temporaries stay small; for the linear measures (coherency, icoh, psi, gd) replace the (1,1,5,n_fft,N,N) complex128 tensor and its taper mean by one batched matmul over the taper axis.
