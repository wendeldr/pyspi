    path: kernel
    reference: 'from-scratch numpy CSM: tapers from a dense eigendecomposition (numpy.linalg.eigh) of the Slepian sinc kernel A[m,n] = sin(2 pi W (m-n))/(pi (m-n)), A[m,m] = 2W, W = 3/T, top 5 eigenvectors; mean-removed series; numpy.fft.fft with n = scipy.fftpack.next_fast_len(T); S = mean_k X_i conj(X_j); compared with Connectivity._expectation_cross_spectral_matrix()[0] and power()[0] on the raw (T,P) array. Taper sign is irrelevant because it cancels in X_i conj(X_j). Secondary taper source: scipy.signal.windows.dpss, a separate LAPACK eigh_tridiagonal code path that shares the Percival-Walden formulation and NiTime/MNE comment lineage with the library dpss.'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: 'two-sided CSM agrees to <= 1e-12 relative to max |S| at every T (probe at T=256 with scipy dpss: 2.6e-14 absolute; taper agreement with the sinc-kernel eigenvectors 1-2e-12)'
  - datasets:
