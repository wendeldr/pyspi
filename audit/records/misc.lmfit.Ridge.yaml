optimisation:
  complexity_P_T: 'O(P^2 T) for the arithmetic, but a T-independent per-call overhead dominates: one sklearn Ridge fit + predict + mean_squared_error per ordered pair (pyspi/statistics/misc.py:115-126, inspect.signature per pair at line 120). Measured P_exponent 2.06, T_exponent 0.02. Pair term dominates; measured 10.4 s per window at 118x1024 (family-warm, measured).'
  hotspot_1: sklearn/utils/validation.py:check_array (third-party:sklearn) 42.1% of the profiled SPI call at 8x1024 (input validation incl. narwhals dataframe detection and finite checks); the cholesky solve _ridge_regression is 9.3%
  hotspot_2: 'sklearn/metrics/_regression.py:mean_squared_error (third-party:sklearn) 20.4% of the profiled SPI call at 8x1024; inspect.signature (Python stdlib) 10.4% in all, of which 5.3% is called per pair from pyspi/statistics/misc.py:bivariate (line 120), 3.0% sits inside sklearn base._validate_params (get_params -> _get_param_names) and 2.1% inside the validate_params wrapper of mean_squared_error'
  hotspot_owner: third-party:sklearn
  opaque_share: 0.207
  profile_file: audit/profiles/misc.lmfit.Ridge__8x1024.pstats
  opportunities:
  - opportunity_id: lmfit-1
    opportunity: 'Replace the per-pair sklearn Ridge fit/predict/mean_squared_error (pyspi/statistics/misc.py:115-126) by one batched closed form over all ordered pairs: from one centred Gram matrix, w = Sxy/(Sxx + alpha), MSE[i, j] = (Syy_j - 2 w Sxy_ij + w^2 Sxx_i)/T.'
    opp_type: vectorise-batch
    expected_speedup: ~2700x
    speedup_basis: microbench:audit/profiles/micro/opp_lmfit-1.json (2879x at 118x1024 one-call baseline 10.9 s vs 3.8 ms; 524x at 32x1024; 44x at 8x1024); against the ranking basis (family-warm 10.39 s per window
      at 118x1024, 6,232 s per patient) the 3.79 ms candidate gives 2742x, so the lower bound is 2700x
    output_risk: within-tolerance
    risk_evidence: 'audit/profiles/micro/opp_lmfit-1.json: max_abs_diff 8.9e-16, max_rel_diff 9.1e-16, nan_mask_equal true at 118x1024; max_rel 3.1e-15 against the 7x100 golden snapshot'
    effort: S
    depends_on: []
  - opportunity_id: lmfit-4
    opportunity: 'Strip per-call overhead around the unchanged sklearn fit: hoist inspect.signature(self._model) to __init__ (misc.py:120 runs it per pair), run fit/predict under sklearn.config_context(skip_parameter_validation=True, assume_finite=True), and compute the in-sample MSE with numpy instead of sklearn.metrics.mean_squared_error.'
    opp_type: replace-library
    expected_speedup: ~1.9x
    speedup_basis: 'profile:audit/profiles/misc.lmfit.Ridge__8x1024.pstats inspect.signature 10.4% (5.3% called from misc.py:120, the part the hoist removes; the other 5.1% sits inside _validate_params and the mean_squared_error validation wrapper, so it is already in those shares), mean_squared_error 20.4%, sklearn base._validate_params 8.4% (containing validate_parameter_constraints 5.9%), _assert_all_finite 9.6% (overlapping cProfile shares, inflated by profiling) + complexity: per-call constant overhead, T-independent (T_exponent 0.02); an unprofiled throwaway check at 8x1024 (56 ordered pairs, same arrays, OMP_NUM_THREADS=1) gave 1.90x per pair with max_abs_diff 0.0 (not saved as a micro-benchmark); contained in lmfit-1, which replaces the sklearn fit whose per-call overhead this avenue strips, so on this unit it saves nothing on top of lmfit-1 (subsumed_by; README ''Optimisation columns'', ranking rule 4) and remains the fallback that keeps sklearn''s solver if lmfit-1 is not taken'
