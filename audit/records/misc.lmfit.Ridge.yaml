unit_id: misc.lmfit.Ridge
status: profiled
correctness:
  metric_name_standard: in-sample (training) mean squared error of a ridge regression (alpha = 1, unpenalised intercept) of y = x_j on x = x_i; on z-scored data a
    monotone transform of the squared Pearson correlation
  canonical_ref: Hoerl & Kennard 1970, Technometrics 12(1):55-67, ridge estimator beta*(k) = (X'X + kI)^-1 X'y (section 2); scikit-learn objective ||y - Xw||^2_2
    + alpha ||w||^2_2 with centred X, y (sklearn/linear_model/_ridge.py Ridge docstring, the delegate's own statement); Hastie, Tibshirani & Friedman 2009, The Elements
    of Statistical Learning, 2nd ed., Springer, section 3.4.1 Ridge Regression (intercept left out of the penalty; inputs centred and beta_0 estimated by ybar) is the
    independent source for the unpenalised-intercept and centring convention (ESL section and wording from memory, not re-checked against the book). Hoerl & Kennard
    work with X'X in correlation form, so their k is on a different scale from sklearn's alpha on ddof=1 z-scores (see what_changed).
  canonical_definition: 'w = sum(xc*yc) / (sum(xc^2) + alpha), b = ybar - w*xbar, MSE = (1/T) sum (y_t - b - w x_t)^2; for z-scored (ddof=1) inputs with alpha = 1:
    w = r (T-1)/T and MSE = ((T-1)/T) * (1 - r^2 (T-1)(T+1)/T^2)'
  documented_definition: 'supplement §1.6.1, p.18 (supplement.txt lines 856-868; the briefing pack gives 874-887, which is off by 18 lines): "we use a number of linear
    models and record the mean squared error (MSE) of a regression of y on x. The following models (with the default parameters) from scikit-learn [2] are included:
    stochastic gradient descent regression with a squared loss (ordinary least squares fit) function (denoted by modifier SGDRegressor); Ridge regression, which uses l2-norm regularization
    (Ride); the Elastic-Net model [76, 77], which uses both l1 and l2-norm regularization (ElasticNet); and the Bayesian Ridge regressor uses a gamma distribution
    prior (with lambda1 = lambda2 = 1e-6) for the l2-norm regularizor in Ridge regression (BayesianRidge). This yields four SPIs: 215. lmfit_SGDRegressor 216. lmfit_Ridge
    217. lmfit_ElasticNet 218. lmfit_BayesianRidge"; keywords "directed, linear, unsigned, bivariate, contemporaneous"; rationale "Linear regression is commonly used
    for establishing independence through model fits (e.g., see additive noise models in Sec. 1.3.1)". GitBook spi-descriptions/miscellaneous.md "Linear Model Fit"
    repeats the text verbatim (including the typo "Ride") and lists the same four identifiers.'
  delegate_lib: scikit-learn==1.9.1 sklearn.linear_model.Ridge(random_state=42).fit -> _BaseRidge.fit -> _ridge_regression(solver="cholesky") -> _solve_cholesky (scipy==1.17.1
    linalg.solve assume_a="pos"); sklearn.metrics.mean_squared_error; numpy==2.5.4
  implemented_as: 'A[i, j] = (1/T) sum_t (z_j[t] - b - w z_i[t])^2 with (w, b) the alpha=1 ridge fit of z_j on z_i over all T samples (no hold-out, no lags). Ridge
    has a random_state parameter, so random_state=42 is passed; solver "auto" resolves to "cholesky" for dense numpy input and random_state is never used (probe:
    predictions with 42, 7 and default identical, max diff 0.0). Defaults alpha=1.0, fit_intercept=True, tol=1e-4 (unused by cholesky). Probe: matches the closed
    form ((T-1)/T)(1 - r^2 (T^2-1)/T^2) to <= 1e-12 on 14 datasets x 4 T (552 ordered pairs).'
  implementation_trace:
  - 'pyspi/config.yaml:1264-1278 .statistics.misc LinearModel: labels directed/linear/unsigned/bivariate/contemporaneous; configs model: Ridge, Lasso, SGDRegressor,
    ElasticNet, BayesianRidge (Lasso is the fifth, undocumented config)'
  - 'pyspi/calculator.py:230-267 Calculator._load_yaml (HEAD a1f20c7): for params in configs (252): spi = getattr(module, fcn)(**params) (256), i.e. LinearModel(model=...);
    self._spis[spi.identifier] = spi (257); the class attribute labels (misc.py:109) are what the calculator reports'
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False) (187), then scipy.stats.zscore(axis=1, nan_policy="omit",
    ddof=1) if normalise=True (default) (195); stored as (M, T, 1)'
  - 'pyspi/calculator.py:329-339 Calculator.compute (HEAD a1f20c7): S = self._spis[spi].multivariate(self.dataset) (329); np.fill_diagonal(S, np.nan) (332); any exception
    -> self._table[spi] = np.nan (336-337), so one failing pair makes the whole matrix NaN'
  - 'pyspi/base.py:84-94 Directed.multivariate: for j (outer), for i != j (inner): A[i, j] = self.bivariate(data, i=i, j=j); no mirroring'
  - 'pyspi/base.py:27-49 parse_bivariate: Data passed through unchanged (two raw arrays would be wrapped into a new z-scored Data with i, j = 0, 1)'
  - 'pyspi/data.py:108-118 Data.to_numpy(): returns the (M, T, 1) array, so z[i] is a (T, 1) design matrix with one feature'
  - pyspi/statistics/misc.py:106-109 class LinearModel(Directed, Unsigned); labels ["misc", "unsigned", "unordered", "normal", "linear", "directed"]
  - 'pyspi/statistics/misc.py:111-113 __init__: identifier "lmfit_<model>", self._model = getattr(sklearn.linear_model, model)'
  - 'pyspi/statistics/misc.py:117-124 bivariate: z = data.to_numpy(); warnings suppressed; if "random_state" in inspect.signature(model).parameters: model(random_state=42).fit(z[i],
    ravel(z[j])) else model().fit(z[i], ravel(z[j])) -> predictor = process i, target = process j'
  - pyspi/statistics/misc.py:125-126 y_predict = mdl.predict(z[i]); return mean_squared_error(y_predict, ravel(z[j])) -> in-sample (training) MSE on the same T samples
    used for fitting (argument order swapped, harmless because MSE is symmetric)
  - .venv/lib/python3.12/site-packages/sklearn/linear_model/_ridge.py:1022 class Ridge; signature defaults alpha=1.0, fit_intercept=True, solver="auto", random_state=None
    (probe inspect.signature)
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_ridge.py:1229-1263 Ridge.fit: validate_data(dtype float64/32) then super().fit'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_ridge.py:919-1019 _BaseRidge.fit: solver = self.solver ("auto") (958); _preprocess_data centring (964-971);
    _ridge_regression(..., return_intercept=False) (1000-1016); _set_intercept (1017)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:188-199 _preprocess_data(fit_intercept=True): X -= mean(X), y -= mean(y) (both already ~1e-17
    after z-scoring)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_ridge.py:835-843, 867-877 resolve_solver / resolve_solver_for_numpy: not positive, no return_intercept,
    dense -> "cholesky"'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_ridge.py:746-761 _ridge_regression cholesky branch: n_features (1) <= n_samples -> _solve_cholesky(X,
    y, alpha)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_ridge.py:215-227 _solve_cholesky: A = X^T X; A.flat[::n_features+1] += alpha; linalg.solve(A, X^T y,
    assume_a="pos") -> w = sum(xy) / (sum(x^2) + alpha)'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_ridge.py:1265-1279 Ridge.predict -> super().predict, _base.py:301-316 LinearModel.predict -> _decision_function (_base.py:291-299): X @ coef_ + intercept_'
  - '.venv/lib/python3.12/site-packages/sklearn/linear_model/_base.py:318-334 _set_intercept: intercept_ = y_offset - X_offset @ coef_ (unpenalised intercept)'
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/_regression.py:524-600 mean_squared_error: _average((y_true - y_pred) ** 2, axis=0) (586-588), divisor T'
  deviation_from_documented: '(a) The supplement and GitBook name the modifier "Ride" (typo for Ridge). (b) "With the default parameters": pyspi passes random_state=42,
    which is inert for the cholesky solver (no numeric effect). (c) The documented keyword "directed" is not borne out under the default z-scoring: the value depends
    only on r_ij and T, so A is symmetric (see candidates). (d) The documentation does not state that the MSE is in-sample (no train/test split), nor that lower =
    stronger dependence. Otherwise the documented "MSE of a regression of y on x" with l2 regularisation matches the code.'
  deviation_from_canonical: 'none for the estimator: the fit is exactly the Hoerl-Kennard ridge estimator with k = alpha = 1 on centred data with an unpenalised intercept.
    The SPI is the in-sample MSE of that fit, a pyspi construction; on z-scored data it is the closed-form ((T-1)/T)(1 - r^2 (T^2-1)/T^2), i.e. an affine, decreasing
    function of r^2 whose shrinkage term (T^2-1)/T^2 vanishes as T grows. The fixed alpha = 1 is scale dependent: its relative strength is 1/(T-1) for z-scored data
    but changes with the raw scale when normalise=False.'
  units_and_range: 'units of the target variance (dimensionless after z-scoring); unsigned, >= 0; on z-scored data in [(T-1)/T^3, (T-1)/T): (T-1)/T^3 for identical
    series (probe shared_envelope pair (0,2): 2.403e-04 at T=64, 5.959e-08 at T=4096) and close to (T-1)/T for r = 0; symmetric (A = A.T to 7.8e-16) under default
    preprocessing; asymmetric with normalise=False (A[i, j] scales with var(x_j)); constant processes (zscore division by zero) were not probed.'
  direction_convention: 'A[i, j] = in-sample MSE of the linear prediction of process j (target, column) from process i (predictor, row), per misc.py:122-126; LOWER
    = j better linearly predicted from i. Code-derived; with the default z-scoring the matrix is symmetric (see units_and_range), so the direction is only empirically
    identifiable with normalise=False, where column j scales with var(x_j) (probe on scaled_offset_T1024: column means of A track std_j^2 = 0.0395, 4.058, 24.78,
    97.89).'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (direction label is nominal under default preprocessing): after ddof=1 z-scoring every process has sum x^2 = T-1 and mean ~0, so the fit and its in-sample
    MSE are functions of (r_ij, T) only and A is symmetric; probe max |A - A.T| = 7.8e-16 across 24 dataset/T combinations although the class is Directed (misc.py:106)
    and labelled "directed". Asymmetry appears only with normalise=False, where A[i, j] is in units of var(x_j).'
  - 'Candidate (redundant with r^2): on z-scored data lmfit_Ridge = ((T-1)/T)(1 - r^2 (T-1)(T+1)/T^2) exactly; probe3.py assertion holds to <= 1e-12 for all 552 ordered
    pairs across 14 datasets and T in {64, 256, 1024, 4096}, so the SPI is an affine transform of the squared Pearson correlation and carries no information beyond
    it.'
  - 'Candidate (documented rationale vs quantity): the supplement motivates lmfit by independence testing "through model fits (e.g., see additive noise models)",
    but the SPI is the raw in-sample MSE of a contemporaneous linear fit, which measures linear predictability (a transform of r^2 for the closed-form models), not
    residual independence; no residual-independence test is computed (misc.py:125-126).'
  - 'Candidate (documentation typo): supplement p.18 and GitBook miscellaneous.md write the modifier as "(Ride)".'
