optimisation:
  complexity_P_T: 'O(P^2 T^2 d): two JIDT Kozachenko calls (2-D joint, 1-D source) per ordered pair. Measured fresh T exponent 2.30; 436 s projected at 118 (extrapolated-pairs-from-8).'
  hotspot_1: pyspi/statistics/infotheory.py:CrossmapEntropy.bivariate (third-party:jidt, self time) 99.9% cum / 99.6% self of the profiled SPI call at 8x1024
  hotspot_2: 'none visible inside Java. opaque_share is a lower bound: JPype dispatches Java methods without cProfile entries, so the JIDT (Java) time is booked as self time of the calling pyspi frame'
  hotspot_owner: third-party:jidt
  opaque_share: 0.002
  profile_file: audit/profiles/infotheory.xme.kozachenko_k1__8x1024.pstats
  opportunities:
  - opportunity_id: it_kozachenko-1
    opportunity: 'Cache the per-channel entropy terms that do not depend on the partner at Data level (like data.entropy): si''s H(x_t | x_{t-1}) per channel, xme''s H(source past) per source, di''s target
      entropy-rate sum per target, so each JIDT Kozachenko call runs P times instead of P(P-1) times.'
    opp_type: cache-sharing
    expected_speedup: ~1.5x
    speedup_basis: 'profile:audit/profiles/infotheory.xme.kozachenko_k1__8x1024.pstats pyspi/statistics/infotheory.py:405 CrossmapEntropy.bivariate 99.9% + complexity: H(source past) depends only on the
      source: by dimension (1-D of 1+2) a third of the brute-force work becomes P cached calls.
      Ranked on the residual after it_kozachenko-2 (depends_on) with residual_speedup 1-1.5x. A kd-tree query does not grow with the dimension as the brute-force N^2 d search does (5-20x for d <= 4,
      2-5x near d = 10, audit/notes/it_kozachenko.md:570), so the share of the per-channel terms in that residual is not known and the lower bound credits no saving there; this figure holds on
      today''s brute-force cost'
    output_risk: unverified-bit-identical
    risk_evidence: the same JIDT call on the same array, made once instead of once per pair; the box-kernel path adds no noise, and the Kozachenko path re-seeds its jitter with NOISE_SEED 42 at every setObservations,
      so a cached call returns the same value
    effort: S
    depends_on:
    - it_kozachenko-2
    residual_speedup: 1-1.5x
  - opportunity_id: it_kozachenko-2
    opportunity: Replace the brute-force nearest-neighbour search behind EntropyCalculatorMultiVariateKozachenko (EuclideanUtils.computeMinEuclideanDistances, O(N^2 d); measured T exponent 2.0-2.3) with
      a kd-tree query (scipy cKDTree, k=1, Euclidean) on the same normalised, jittered observations, keeping JIDT's digamma formula.
    opp_type: replace-library
    expected_speedup: 5-20x
    speedup_basis: 'profile:audit/profiles/infotheory.xme.kozachenko_k1__8x1024.pstats pyspi/statistics/infotheory.py:405 CrossmapEntropy.bivariate 99.9% (JIDT Java time booked as pyspi self time) + complexity:
      brute force evaluates N^2 = 1.05e6 distances of dimension 1-2 per call at T=1024 (measured T exponent 2.30); a kd-tree needs ~N log N queries in d <= 4 and loses most of its advantage near d = 10'
    output_risk: unverified-within-tolerance
    risk_evidence: 'check stage: a cKDTree-based replica with the java.util.Random(42) jitter port reproduces JIDT to <= 1.2e-14 (je.kozachenko jrand runs), 3.7e-14 (cce), 2.1e-14 (xme_k1) for <= 2000 rows;
      above 2000 rows JIDT switches to the naive routine whose distances differ (infotheory.est.kozachenko finding), so there the change is semantic'
    effort: M
    depends_on: []
