unit_id: infotheory.xme.kozachenko_k1
status: profiled
correctness:
  metric_name_standard: Lagged conditional entropy H(y_t | x_{t-1}) of the target present given one source lag (pyspi 'cross-map entropy', k=1), Kozachenko-Leonenko estimate
  canonical_ref: 'No published definition of ''cross-map entropy'' found. Closest standard quantity: the conditional differential entropy of the target''s present given the source''s past, H(Y_t | X_{t-1},...,X_{t-k})
    (Cover & Thomas 2006, Elements of Information Theory 2nd ed. §8.4; h(Y|X) = h(X,Y) - h(X)). The name echoes convergent cross mapping (Sugihara et al. 2012 Science 338:496-500), but no cross-mapping
    is performed. Estimator Kozachenko & Leonenko (1987); Kraskov et al. (2004) Eq. (20).'
  canonical_definition: 'Reading ''history length k'' as the k most recent source samples: H(Y_t | X_{t-1..t-k}) = H(Y_t, X_{t-1..t-k}) - H(X_{t-1..t-k}); for k=1, H(y_t | x_{t-1}).'
  documented_definition: No supplement section (supplement.txt has no 'xme', 'cross-map entropy' or 'crossmap' entry). GitBook table-of-spis.md line 73 only lists 'Cross-Map Entropy', base identifier xme,
    with xme_kozachenko_k1 and xme_kozachenko_k10; information-theory.md has no xme section. Class name 'Cross-map entropy' (infotheory.py:396); config.yaml:439-446 labels 'unsigned, directed, time-dependent,
    bivariate'. The documented meaning of history_length is therefore only implicit in the identifier suffix _k1/_k10.
  delegate_lib: JIDT jar (labelled 1.6.1, post-tag build matching commit a9b6b3e77c) EntropyCalculatorMultiVariateKozachenko.computeAverageLocalOfObservations, d=2 and d=1
  implemented_as: 'k=1: targ_future = z_j[1:], src_past = z_i[:-1] (one column, lag 1; the append loop range(2,1) is empty). A[i,j] = H_KL([z_i(t-1), z_j(t)]) - H_KL(z_i(t-1)) over T-1 rows, i.e. H(z_j,t
    | z_i,t-1). Two separate KL estimates (d=2, d=1), noise 1e-8 seed 42, Euclidean, nats. No Theiler window.'
  implementation_trace:
  - 'pyspi/calculator.py:277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (normalise=True default, :50); pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset);
    pyspi/calculator.py:332 np.fill_diagonal(S, np.nan) (HEAD lines)'
  - 'pyspi/base.py:85-94 Directed.multivariate: A[i,j] = bivariate(data, i=i, j=j)'
  - 'pyspi/config.yaml:439-464 CrossmapEntropy configs: estimator kozachenko with history_length 1 and 10'
  - pyspi/statistics/infotheory.py:394-403 CrossmapEntropy(history_length=10 default); identifier suffix _k{history_length}
  - 'pyspi/statistics/infotheory.py:405-415 bivariate: src, targ = z[i], z[j]; targ_future = targ[k:]; src_past = src[k-1:-1]; loop ''for i in range(2, k)'' appends src[k-i:-i] (loop variable shadows the
    argument i; harmless because i is not used afterwards)'
  - pyspi/statistics/infotheory.py:416-426 joint = [src_past, targ_future]; H_xy = H_KL(joint); H_y = H_KL(src_past); return H_xy - H_y
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/EntropyCalculatorMultiVariateCommon.java:179-219 (noise seed 42, no normalisation)
  - JIDT@a9b6b3e77c java/source/infodynamics/measures/continuous/kozachenko/EntropyCalculatorMultiVariateKozachenko.java:82-115
  - JIDT v1.6.1 java/source/infodynamics/utils/EuclideanUtils.java:30,69-75,85-110
  deviation_from_documented: No definition is documented, so nothing to compare beyond the identifier. Label 'linear' (infotheory.py:53-54) on a nonparametric estimator; config.yaml labels carry neither
    'linear' nor 'nonlinear'. The name 'cross-map' does not describe the computation (a plain lagged conditional entropy).
  deviation_from_canonical: 'None for k=1 relative to H(y_t | x_{t-1}): from-scratch KL reproduces A[0,1] and A[1,0] to <= 6.7e-15 with noise off (probe3, T=256). Estimator-level: noise |delta| <= 5.4e-6
    nat at T=256. d <= 2, so the JIDT naive-distance defect is negligible (probe6 T=4096: var2 1.226 vs ref 1.226; iid 1.430 vs 1.430).'
  units_and_range: 'Nats; real, unbounded, can be negative (differential; delayed_noise A[0,1] = -0.937 where x1 = x0 delayed by 1 + 0.1 noise, probe7). Ties make it noise-dominated (logistic_maps T=1024:
    -4.55 / 12.15, row 1 is a period-4 orbit). Labelled ''unsigned''. Asymmetric.'
  direction_convention: 'A[i,j] = H(x_j(t) | x_i(t-1)): row i = source whose past is conditioned on, column j = target whose present is measured (infotheory.py:407-410). Lower = source past more informative
    about target. var2_bivariate (x0 -> x1) T=1024: A[0,1]=1.266 < A[1,0]=1.398; delayed_noise A[0,1]=-0.937 vs A[1,0]=1.479 (probe7).'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (naming/doc): ''Cross-map entropy'' has no definition in the supplement or the GitBook SPI descriptions, and the computation H(y_t | x_{t-1}) (infotheory.py:407-426) involves no cross-mapping
    in the CCM sense.'
  - 'Candidate (label): ''linear'' label for the nonparametric KL variant (probe1: [''unsigned'',''infotheory'',''temporal'',''directed'',''linear'']).'
  - 'Candidate (copy path, added at the check stage): in a CalculatorFrame the SPI''s entropy calculator is a deep copy (CalculatorFrame.init_from_list, pyspi/calculator.py:559 calc = copy.deepcopy(base_calc);
    JIDTBase.__deepcopy__, pyspi/statistics/infotheory.py:77-82, deep-copies the JPype proxy without re-running _setup). The copy reads NOISE_SEED ''NONE'' while NOISE_LEVEL_TO_ADD stays 1e-8, so every
    CalculatorFrame computation draws an unseeded jitter and is not reproducible. Same mechanism as the KERNEL_WIDTH reset confirmed in it_kernel (infotheory.est.kernel|bivariate_gaussian|256|pipeline|copy-props).
    The Calculator path and a pickle round trip (__setstate__ -> _getcalc -> _setup) keep NOISE_SEED=42.'
