  what_changed: 'Formula is the canonical Euclidean distance on the ddof=1 z-scored rows (fp-exact against the from-definition reference and the identity
    sqrt(2(T-1)(1-r))). The only deviation is numerical: sklearn''s dot-product expansion (sklearn/metrics/pairwise.py:409-416, documented by sklearn at
    pairwise.py:284-286 as prone to catastrophic cancellation) returns ~1e-7 to 1e-6 instead of 0 for duplicated channels and loses all relative accuracy
    when the true distance is below ~1e-7 (clamped to 0.0 at 3.2e-8). On default input the value is a deterministic monotone function of Pearson r, so it
    carries only linear-correlation information; it grows with sqrt(T-1) and is a dissimilarity. Score 9 rather than 10 because agreement is not within
    1e-8 relative for near-duplicate rows.'
