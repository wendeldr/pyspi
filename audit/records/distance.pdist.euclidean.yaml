unit_id: distance.pdist.euclidean
status: profiled
correctness:
  metric_name_standard: Euclidean (L2) distance between the two z-scored time series viewed as vectors in R^T
  canonical_ref: Deza & Deza 2016, Encyclopedia of Distances (4th ed., Springer), entry 'Euclidean metric' (l2-metric)
  canonical_definition: d(x,y) = sqrt( sum_{t=1..T} (x_t - y_t)^2 )
  documented_definition: 'GitBook distance-similarity.md ''Pairwise Distance'' (lines 297-321): "Pairwise distance between time-series, computed using sklearn''s
    pairwise distance function using the following distance metrics: Euclidean, Cityblock, Cosine, Chebyshev, Canberra, Braycurtis"; keywords "undirected,
    nonlinear, unsigned, unordered". No formula is given. pdist is absent from the supplement: supplement §1.2 ''Distance similarity (26 SPIs)'', p.5 (heading
    line 209) lists SPIs 22-47 (dcorr, dcorrx, mgc, mgcx, hsic, hhg, dtw, lcss, softdtw, bary) and no pdist entry.'
  delegate_lib: scikit-learn==1.9.1 sklearn.metrics.pairwise.euclidean_distances (dot-product expansion, float64 BLAS)
  implemented_as: 'Rows z-scored (ddof=1) by Data by default; sklearn computes D^2 = ||x||^2 + ||y||^2 - 2 x.y via row_norms and a matrix product X X^T,
    clamps negatives to 0, sets only the true diagonal to 0, then takes sqrt. On z-scored rows ||x||^2 = T-1, so d = sqrt(2 (T-1) (1 - r)) with r the Pearson
    correlation (probe: max deviation 0.0 at T=256).'
  implementation_trace:
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) (Calculator defaults detrend=False, normalise=True,
    calculator.py:48-50; lines at HEAD a1f20c7)
  - pyspi/data.py:184-195 optional scipy.signal.detrend(axis=1), then zscore(data, axis=1, nan_policy='omit', ddof=1) per process
  - pyspi/calculator.py:329-335 S = self._spis[spi].multivariate(self.dataset); np.fill_diagonal(S, np.nan); self._table[spi] = S (HEAD a1f20c7)
  - 'pyspi/base.py:51-68 parse_multivariate: passes the Data object through unchanged'
  - pyspi/statistics/distance.py:28-36 class PairwiseDistance(Undirected, Unsigned); __init__ stores metric, identifier 'pdist_<metric>'
  - 'pyspi/statistics/distance.py:38-40 multivariate overrides Undirected.multivariate (base.py:132-138, never called): return pairwise_distances(data.to_numpy(squeeze=True),
    metric=self._metric)'
  - pyspi/data.py:108-118 to_numpy(squeeze=True) -> (M processes, T observations) float64; each row is one vector in R^T
  - sklearn/metrics/pairwise.py:2309 pairwise_distances(X, Y=None, metric, n_jobs=None, ensure_all_finite=True) (scikit-learn 1.9.1)
  - sklearn/metrics/pairwise.py:2463-2464 metric in PAIRWISE_DISTANCE_FUNCTIONS -> func (table at sklearn/metrics/pairwise.py:1919-1931)
  - sklearn/metrics/pairwise.py:2494 -> _parallel_pairwise; sklearn/metrics/pairwise.py:1971-1981 Y=None -> Y=X; effective_n_jobs(None)==1 -> func(X, X)
  - sklearn/metrics/pairwise.py:268 euclidean_distances; sklearn/metrics/pairwise.py:345 check_pairwise_arrays(X, X) keeps X is Y (sklearn/metrics/pairwise.py:175)
  - sklearn/metrics/pairwise.py:376 _euclidean_distances; sklearn/metrics/pairwise.py:389 XX = row_norms(X, squared=True); sklearn/metrics/pairwise.py:393-394
    Y is X -> YY = XX.T
  - sklearn/metrics/pairwise.py:409-411 distances = -2 * safe_sparse_dot(X, Y.T) + XX + YY
  - sklearn/metrics/pairwise.py:413-416 maximum(distances, 0); sklearn/metrics/pairwise.py:420-421 X is Y -> fill diagonal 0; sklearn/metrics/pairwise.py:426
    sqrt
  deviation_from_documented: 'None in substance: the code is sklearn.metrics.pairwise_distances with metric=''euclidean'' as the GitBook page states. Not
    stated on the page: inputs are z-scored per process (ddof=1) by Data by default (optionally detrended first), and the Calculator sets the diagonal to
    NaN. No formula or normalisation (e.g. per-sample scaling) is documented.'
  deviation_from_canonical: 'Formula: none. Numerics: the dot-product expansion suffers cancellation for near-identical rows: two identical (non-diagonal)
    rows give ~1e-7 instead of 0 (shared_envelope x0 vs x2: 1.19e-7 at T=64, 9.54e-7 at T=4096; direct difference gives 0.0), and relative error reaches
    4.5e-2 when 1-r ~ 5e-15. Reciprocal entries can differ in the last bits (7.1e-15 on a 64x1024 probe; REVIEW M2). Domain: with default z-scoring the
    value is a deterministic monotone function of Pearson r, so it measures linear correlation only.'
  units_and_range: 'Same units as the z-scored data (dimensionless); range [0, 2 sqrt(T-1)] with 0 for r=1, sqrt(2(T-1)) for r=0, 2 sqrt(T-1) for y=-x (probe
    T=256: 31.937 = 2 sqrt(255)). Grows like sqrt(T); never negative; finite for finite input.'
  direction_convention: 'A[i,j] = d(z_i, z_j) for rows i, j of the (z-scored) M x T data; the metric is symmetric so A[i,j] = A[j,i]; no direction is encoded;
    diagonal NaN after Calculator.compute (confirmed in the check stage: sym runs).'
  symmetry_expected: sym
  already_documented: docs/storage_comparison/REVIEW.md M2 (last-bit reciprocal asymmetry of dot-product Euclidean distance); REVIEW M1 (PairwiseDistance
    overrides Undirected.multivariate, no generic mirror)
  new_finding_candidates:
  - 'Candidate: on default z-scored input pdist_euclidean is exactly sqrt(2(T-1)(1-r)), a monotone transform of Pearson r, so the ''nonlinear'' label is
    not supported for this metric. Probe (T=256, 3 series): max |A - sqrt(2(T-1)(1-r))| = 0.0.'
  - 'Candidate (numerical, distinct from M2''s last-bit asymmetry): identical non-diagonal rows return sqrt of rounding residue instead of 0 because sklearn
    only zeroes the true diagonal (pairwise.py:420-421). Probe on shared_envelope (x2 is a copy of x0): pdist_euclidean[0,2] = 1.19e-07 (T=64), 4.13e-07
    (T=256), 0.0 (T=1024), 9.54e-07 (T=4096); direct sqrt(sum((x-y)^2)) = 0.0. Near-identical rows: rel error 7.6e-06 at noise 1e-5, 4.5e-02 at noise 1e-7
    (T=4096).'
  - 'Candidate (interpretation): value scales with sqrt(T-1) so pdist_euclidean is not comparable across window lengths; and it is a dissimilarity (larger
    = less coupled), opposite in orientation to most SPIs, which neither the labels nor the GitBook page state.'
