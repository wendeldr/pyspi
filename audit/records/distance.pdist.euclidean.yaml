    reference: A versus A.T (direction convention) and A[i,j] versus the numpy reference d(z_i, z_j) on the z-scored rows
    reference_kind: analytic
    criterion: direction
    expected_outcome: 'A[i,j] = A[j,i] = d(z_i, z_j): symmetric, no direction; diagonal NaN after Calculator; reciprocal entries may differ in the last
      bits (REVIEW M2)'
  - datasets:
    - bivariate_gaussian
    - scaled_offset
    path: pipeline
    reference: pipeline output on scaled_offset compared with pipeline output on bivariate_gaussian (same draw; positive scale + offset removed by z-scoring)
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: 'identical to rel 1e-12: default z-scoring makes every pdist metric invariant to positive per-channel scale and offset'
  - datasets:
    - trending
    - bivariate_gaussian
    path: pipeline-detrend
    reference: pipeline-detrend output on trending compared with pipeline-detrend output on bivariate_gaussian; plain pipeline on trending for contrast
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: with detrend the two agree to rel 1e-10 (linear trend removed exactly by scipy detrend); without detrend trending values differ markedly
      (trend dominates the distance)
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: same data with a common random permutation of the time index (numpy permutation)
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: 'unchanged to rel 1e-12: every pdist metric is invariant to a joint reordering of samples (supports the ''unordered'' label; shows
      no temporal structure is used)'
  - datasets:
    - delayed_noise
    path: pipeline
    reference: qualitative comparison of d(x0, x_k) for delays 1,3,5 against d on iid_gaussian pairs
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: 'delayed copies look as dissimilar as independent noise (e.g. cosine ~ 1): the metric is lag-0 only and cannot see delayed coupling'
  - datasets:
    - bivariate_gaussian
    - iid_gaussian
    - sparse_precision
    path: pipeline
    reference: analytic identity sqrt(2 (T-1) (1 - r_ij)) with r from a from-scratch numpy Pearson correlation of the raw rows
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: agreement to abs 1e-6 (looser near r=1 because of sklearn's cancellation) at every T; confirms the z-score ddof=1 convention
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: population value sqrt(2 (T-1) (1 - rho)) with rho in {0.3, 0.8} from the dataset truth
    reference_kind: analytic
    criterion: statistical
    expected_outcome: relative error shrinks like T^-1/2; at T=4096 within 3 standard errors of the population value
  - datasets:
    - shared_envelope
    path: pipeline
    reference: 'definition: x2 is an exact copy of x0, so d(x0,x2) = 0 exactly (numpy direct-difference reference)'
    reference_kind: analytic
    criterion: exact
    expected_outcome: expected 0.0; current implementation is predicted to return ~1e-7 to 1e-6 (dot-product cancellation); record the magnitude
  check_method: analytic
  check_reference: 'audit/checks/refs/pdist.py handlers run for this unit (run tag in parentheses): ref_def -> audit/checks/refs/_kernels_basic_misc.py:pdist_metric
