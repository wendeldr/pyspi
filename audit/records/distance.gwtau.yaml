    every point" also includes the start, so the same factor separates pyspi from the documentation. The
    descending sort is a no-op (every segment length sqrt(1 + dx^2) >= 1), so the value is the RMS over time
    of the difference of the two cumulative arc-length curves; the closed-form sinusoid references, which
    never sort, match to 1e-11. Properties of the canonical construction, measured here: the value grows
    about as sqrt(T) under independence, depends on the sampling rate because time is the sample index
