unit_id: basic.spearmanr
status: profiled
correctness:
  metric_name_standard: 'Spearman''s rank correlation coefficient rho_S (tie-corrected: Pearson correlation of mid-ranks); spearmanr-sq is its square'
  canonical_ref: 'Spearman C. 1904, ''The proof and measurement of association between two things'', Am J Psychol 15(1):72-101; tie handling by mid-ranks: Kendall & Gibbons 1990, Rank
    Correlation Methods, 5th ed., ch. 3'
  canonical_definition: rho_S = Pearson correlation of R(x) and R(y), R = rank with ties given average rank; equals 1 - 6 sum d_i^2 / (n(n^2-1)) only without ties
  documented_definition: 'supplement §1.1.3, p.4 (supplement.txt:172-178): ''Spearman''s rho is a nonparametric measure of rank correlation ... implemented via function spearmanr in SciPy [6], and has a value
    in [-1, 1]''; keywords ''undirected, nonlinear, signed, bivariate, contemporaneous''. GitBook basic-statistics.md:126-140 same text; table-of-spis.md:35 lists identifiers spearmanr
    and spearmanr-sq. The squared variant is not described in the supplement (only ''17. spearmanr'').'
  delegate_lib: scipy==1.17.1 scipy.stats.spearmanr (rankdata method='average' + numpy==2.5.4 np.corrcoef)
  implemented_as: 'Default pipeline z-scores (and optionally detrends) each channel; for each ordered pair i!=j, scipy.stats.spearmanr on the (T,1) columns: mid-ranks of each series,
    Pearson correlation of ranks via np.corrcoef, clipped to [-1,1]; p-value discarded. -sq variant returns correlation**2. Lower triangle overwritten from upper (i<j). Zero lag only;
    no multi-realisation handling (R=1 assumed).'
  implementation_trace:
  - pyspi/calculator.py:230-267 Calculator._load_yaml (HEAD a1f20c7) instantiates getattr(module, fcn)(**params) at :256 with configs squared True/False from pyspi/config.yaml:74-97;
    the YAML 'labels' block is not read, so instance labels come from the class
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan) (HEAD a1f20c7)
  - 'pyspi/data.py:184-195 preprocessing before any SPI: optional scipy.signal.detrend(axis=1) then scipy.stats.zscore(axis=1, ddof=1, nan_policy=''omit''); :199-203 any NaN after this
    raises ValueError (so constant channels, which z-score to NaN, never reach scipy)'
  - 'pyspi/base.py:132-138 Undirected.multivariate calls Directed.multivariate then mirrors: li = np.tril_indices(P,-1); A[li] = A.T[li] (upper triangle i<j kept)'
  - pyspi/base.py:88-94 Directed.multivariate loops over all ordered pairs i != j and calls self.bivariate(data, i=i, j=j), i.e. P(P-1) calls, each unordered pair computed twice
  - 'pyspi/base.py:27-47 parse_bivariate: Data passes straight through; raw arrays are wrapped in Data() (first via set_data, z-scored; second via add_process data.py:230-234, appended
    without preprocessing)'
  - 'pyspi/statistics/basic.py:136-149 class SpearmanR(Undirected, Signed); __init__(squared=False): squared sets issigned->False, identifier ''spearmanr-sq'', labels += [''unsigned'']
    (class-list mutation, bug 4)'
  - 'pyspi/statistics/basic.py:151-157 bivariate: x, y = data.to_numpy()[[i, j]] (each shape (T,1)); returns stats.spearmanr(x, y).correlation, or its square when squared'
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5168-5170 spearmanr(a, b, axis=0, nan_policy='propagate') (scipy 1.17.1)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5358 a = np.column_stack((a, b)) -> (T,2)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5364-5368 n_obs <= 1 -> NaN; :5370-5378 constant column -> ConstantInputWarning + NaN; :5389-5399
    NaN with propagate -> NaN
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5405 a_ranked = np.apply_along_axis(rankdata, 0, a)  (rankdata default method='average', :9906,
    :10011 -> _rankdata :10038-10075, tied values get mid-ranks :10068-10070)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/scipy/stats/_stats_py.py:5406 rs = np.corrcoef(a_ranked, rowvar=0); :5419-5422 returns rs[1, 0] as .correlation (p-value
    from t-dist computed and discarded by pyspi)
  - /media/dan/Data/git/pyspi/.venv/lib/python3.12/site-packages/numpy/lib/_function_base_impl.py:2912 corrcoef; :3029 c = cov(...); :3036-3038 divide by sqrt of diagonal; :3043 np.clip(c.real,
    -1, 1)
  deviation_from_documented: 'Value: none (scipy.stats.spearmanr as documented, range [-1,1]). Metadata: class labels carry ''linear'' whereas supplement/config keywords say ''nonlinear''
    (candidate); labels carry both ''signed'' and ''unsigned'' (bug 4). spearmanr-sq is listed in the GitBook table but its definition (rho^2, range [0,1]) is not documented in the supplement.'
  deviation_from_canonical: 'none for the coefficient (mid-rank Pearson is the standard tie-corrected rho_S; probe on tied data matched a from-scratch mid-rank Pearson exactly: 0.35395114622767243).
    spearmanr-sq (rho_S^2) is a pyspi-specific transform without a standard name. Detrending (if enabled) is a non-monotone transform applied before ranking, so the pipeline-detrend
    value is rho_S of residuals, not of the raw series. Numerics: with ties the two mid-rank SDs differ and np.corrcoef divides by them in sequence (numpy _function_base_impl.py:3036-3038),
    so spearmanr(x, y) and spearmanr(y, x) can differ in the last bits; continuous data give two permutations of 1..n with bit-identical SDs and no difference.'
  units_and_range: dimensionless; spearmanr signed in [-1,1]; spearmanr-sq in [0,1]; symmetric in exact arithmetic (kernel reciprocal calls can differ by a few ulp with ties; pipeline
    output exactly symmetric via the mirror, base.py:137); NaN on the diagonal; NaN only if a channel is constant, which the Data loader rejects earlier with ValueError (data.py:199-203)
  direction_convention: 'undirected: A[i,j] = A[j,i] = rho_S(x_i, x_j) computed with i<j (upper triangle, base.py:136-137); no lag, no direction'
  symmetry_expected: sym
  already_documented: 'tests/README.md bug 4 (SpearmanR/KendallTau mutate class-level labels: instances carry both ''signed'' and ''unsigned''); REVIEW M8 (same label mutation); tests/README.md
    line 131 records n1d0 == n0d0 for spearmanr/kendalltau (rank invariance under z-scoring, measured max difference 0); EEG_OPTIMIZATION_NOTES.md:132 (generic Undirected path computes
    both ordered directions before one triangle is overwritten; optimisation candidate); tests/unit/test_data.py:74-88 locks Data.add_process appending later processes raw (the basis
    of the parse_bivariate infrastructure item below). Related pattern, different SPIs: REVIEW M2 (last-bit reciprocal asymmetry in precision, Euclidean distance, envelope correlation).'
  new_finding_candidates:
  - 'CANDIDATE (metadata): class labels say ''linear'' (pyspi/statistics/basic.py:140 and :164 labels = [''basic'',''unordered'',''rank'',''linear'',''undirected'']) while the supplement
    keywords and config.yaml:75-80 / :88-93 say ''nonlinear''; Calculator._load_yaml (calculator.py:230-267, instantiation at :256, HEAD a1f20c7) never reads the YAML labels, so every
    instance carries ''linear''. Probe in a fresh interpreter: SpearmanR().labels and KendallTau().labels -> [''basic'',''unordered'',''rank'',''linear'',''undirected'',''signed''];
    after a squared=True instance has been created in the same interpreter (bug 4 mutation) a new default instance carries [...,''signed'',''unsigned'',''signed''] (rank_corr_fix/p_labels.py).
    ''linear'' is present in both states. Distinct from bug 4 (signed/unsigned).'
  - 'CANDIDATE (efficiency quantification only; the double work itself is already documented at EEG_OPTIMIZATION_NOTES.md:132): for this unit, probe with P=4 bivariate_gaussian_T256
    counted 12 bivariate calls where 6 suffice (base.py:91-93 loop, base.py:136-137 mirror), and the pipeline result is exactly symmetric. The discarded calls can differ from the kept
    ones only at the last-bit level on tied data (see the numerics item), so for spearmanr values the discarded half is pure waste.'
  - 'CANDIDATE (numerics, value-neutral in pipeline; shared with basic.kendalltau): np.corrcoef divides the rank covariance by stddev[:,None] then stddev[None,:] (numpy _function_base_impl.py:3036-3038);
    with ties the mid-rank SDs of x and y differ (example n=379: 108.807 vs 108.908), so swapping x and y changes the rounding. Probe rank_corr_fix/p_recip.py, 2000 random pairs n in
    [20,400) of np.round(N(0,9)): 691 reciprocal mismatches, max |diff| 5.55e-17 (at most 2 ulp of the smaller value); continuous data: 0/2000. The adversarial review probe found 602/2000,
    max 1.11e-16 on similar data. Example: bivariate(i=0,j=1) = 0.019469842747388822 vs bivariate(i=1,j=0) = 0.01946984274738882, multivariate A[0,1] == A[1,0] True. Masked in the pipeline
    by the Undirected mirror (base.py:137); matters only for reference comparisons with bit-exact criteria.'
  - 'CANDIDATE (documentation): the ''nonlinear'' keyword covers only monotone dependence; for non-monotone dependence (nonlinear_dependence: x1 = x0^2, circle pair) rho_S is expected
    near 0. To confirm in the check stage; the supplement text itself says ''non-linear (but monotonic)''.'
  - 'CANDIDATE (robustness, hypothesis): with multiple realisations (Data with R>1) data.to_numpy()[[i,j]] gives (T,R) blocks and scipy.stats.spearmanr would return a 2R x 2R matrix
    whose .correlation is not a scalar (basic.py:153-157). Probe confirmed the slice shape is (T,1) for R=1; R>1 not exercised by Calculator.'
  - 'CANDIDATE (infrastructure consequence only, no effect on this unit''s values; the underlying Data.add_process behaviour is already locked by tests/unit/test_data.py:74-88 test_add_process_appends_raw_unnormalised,
    owned by unit preproc.two_array_api): parse_bivariate with raw arrays (base.py:33-36) z-scores only the first array (Data.set_data) and appends the second raw (data.py:230-234).
    Probe: row0 mean/std 0/1, row1 mean/std 4.38/4.763. Rank statistics are invariant, but other bivariate SPIs called on arrays would see unequal preprocessing.'
  proposed_checks:
  - datasets:
    - bivariate_gaussian
    - nonlinear_dependence
    - contaminated
    - iid_gaussian
    path: kernel
    reference: 'from-scratch numpy: average (mid) ranks via np.argsort + run-length tie grouping, then Pearson r = sum(rx_c*ry_c)/sqrt(sum rx_c^2 * sum ry_c^2); repeat on bivariate_gaussian
      rounded to 1 decimal inside the check to exercise ties (no scipy.stats import)'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: abs difference <= 1e-12 on every pair and T, with and without induced ties; tied case must match mid-rank Pearson and NOT the no-ties shortcut 1 - 6 sum d^2 / (n(n^2-1))
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: 'analytic population Spearman for a bivariate normal: rho_S = (6/pi) arcsin(rho/2) (Pearson 1907; Kruskal 1958 JASA 53:814); rho = 0.3 -> 0.28756, rho = 0.8 -> 0.78594'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: at T = 4096, |r_S - rho_S| within 3 standard errors (Fisher-z SE approx sqrt(1.06/(T-3)), Fieller-Hartley-Pearson 1957); consistency improves with T over 64..4096
  - datasets:
    - scaled_offset
    - bivariate_gaussian
    path: pipeline
    reference: 'invariance: scaled_offset = positive scale * bivariate_gaussian + offset (same draw), so ranks are identical'
    reference_kind: analytic
    criterion: exact
    expected_outcome: spearmanr and spearmanr-sq matrices bit-identical between the two datasets, under both normalise=True and normalise=False
  - datasets:
    - trending
    path: pipeline-detrend
    reference: from-scratch mid-rank Pearson applied to series detrended by numpy least-squares line fit (np.linalg.lstsq on [1, t]) then z-scored
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: 'pipeline-detrend output matches reference to 1e-12; without detrending pair (2,3) is spuriously strongly negative (probe: -0.9826 at T=1024) and with detrending
      near the clean value (probe: 0.7908), documenting that rank statistics are not detrend-invariant'
  - datasets:
    - delayed_noise
    - var2_bivariate
    path: pipeline
    reference: from-scratch mid-rank Pearson on z-scored rows i and j
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: at pipeline level A[i,j] == A[j,i] exactly (mirror), diagonal NaN, and A[i,j] equals reference statistic of (x_i, x_j) at zero lag (no direction); for delayed_noise
      lag-shifted pairs show near-zero values despite strong lagged dependence (contemporaneous only)
  - datasets:
    - bivariate_gaussian
    path: kernel
    reference: 'reciprocity on tied data (bivariate_gaussian rounded to 1 decimal in-check): compare scipy-delegated bivariate(x,y) vs bivariate(y,x) and the pipeline matrix'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: reciprocal kernel calls may differ by a few ulp (observed at most 2 ulp of the smaller value; division order in np.corrcoef, _function_base_impl.py:3036-3038);
      identical on continuous data; pipeline matrix exactly symmetric because of the mirror
  - datasets:
    - nonlinear_dependence
    path: kernel
    reference: 'analytic: x1 = x0^2 + noise with x0 ~ U(-1,1) symmetric and (x2,x3) on a circle have population Spearman 0 although dependent'
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: '|r_S| small (within ~3/sqrt(T)) on both pairs, confirming that the ''nonlinear'' keyword means monotone-only dependence'
  - datasets:
    - bivariate_gaussian
    - iid_gaussian
    path: pipeline
    reference: 'analytic identity: spearmanr-sq = spearmanr ** 2 elementwise'
    reference_kind: analytic
    criterion: exact
    expected_outcome: bit-identical elementwise; spearmanr-sq in [0,1]
  check_method: independent-impl
  check_reference: 'refs/rank_corr.py:ref_run using refs/_kernels_basic_misc.py:spearman (from-scratch average ranks by np.sort/np.searchsorted, Pearson of ranks; no scipy.stats); analytic
    bivariate-normal expectation refs/rank_corr.py:population (Moran 1948 Biometrika 35:203: E r_S = 6/(pi(n+1))[asin rho + (n-2) asin(rho/2)]) with SE refs/rank_corr.py:standard_error
    (null 1/sqrt(n-1); Bonett & Wright 2000 Fisher-z variance); external R 4.6.1 stats::cor(method=''spearman'') via r/rank_corr.R; probes/rank_corr_probes.py for tied input, unmirrored
    Directed calls, labels, call count, realisations, array input'
  closeness: '67/67 runs pass (results/rank_corr.json). Exact: max_abs 2.2e-16 over 38 exact-criterion runs (kernel, pipeline, pipeline-detrend, tied, R); kernel continuous max_abs 1.1e-16,
    tied max_abs 1.1e-16, R stats::cor vs pyspi max 5.6e-17. Tie handling: equals mid-rank Pearson, differs from the untied formula 1 - 6 sum d^2/(n(n^2-1)) by 2.09e-4 (dependent pairs,
    T=1024) and up to 1.0e-2 (nonlinear_dependence tied). Statistical: max_z_1se 1.26/0.88/1.04/1.54 at T=64/256/1024/4096 vs Moran E r_S; pair (2,3) |error| 0.026/0.024/0.0054/0.0105
    with SE 0.056/0.027/0.014/0.0068. Null iid_gaussian (P=5, 10 pairs, population 0): max_z_1se 2.94 at T=1024 and 1.96 at T=4096. T=1024 is a near-miss: pair (0,2) has r_S 0.09193 against null SD 0.03127, so it passes only because the declared band is 3 SE (2.94 vs 3.00). With 10 pairs treated as independent, P(max |z| > 2.94) is about 3%. The same pair has Pearson z = r sqrt(n-1) = 2.68 in the data, and pyspi equals the from-scratch kernel on this dataset (basic.spearmanr|iid_gaussian|1024|kernel|exact max_abs 6.9e-18), so the excursion belongs to the sample and does not come from pyspi. Invariance: pipeline bit-identical to kernel (5 runs, diff 0); scaled_offset bit-identical to bivariate_gaussian (kernel and pipeline). -sq: bit-identical
    to signed^2.'
