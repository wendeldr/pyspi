optimisation:
  complexity_P_T: 'O(P T): scipy.signal.detrend(data, axis=1) builds A = [t/N, 1] and solves one lstsq for all P rows (pyspi/data.py:184-187); once per window, independent of the SPI
    count. Measured Data construction (truncate, detrend, zscore, NaN check) 3.0 ms at 118x1024, no gain with 4 or 8 BLAS threads'
  hotspot_1: 'pyspi/data.py:Data.set_data -> scipy/signal/_signaltools.py:detrend (third-party:scipy): no cProfile frame: profile_units.py builds the Data before prof.runcall (profile_units.py:712-718),
    so detrend/zscore never appear in a unit pstats (the only zscore frames are the per-pair re-normalisation inside the kraskov_DCE units, 0.3-0.5%); whole Data construction 3.0 ms
    per 118x1024 window (audit/profiles/micro/opp_xc-blas-threads.json), about 0.001% of the 229 s retained-selection window'
  hotspot_2: 'scipy.linalg.lstsq inside detrend: not separated from zscore (the micro times the whole Data construction)'
  hotspot_owner: third-party:scipy
  opaque_share: 'n/a: no cProfile frame exists for this path (the profiling pass builds the Data before prof.runcall, profile_units.py:712-718, and no unit profile calls the two-array API), so there is no profile to take a builtin-time share from'
  profile_file: audit/profiles/micro/opp_xc-blas-threads.json (data_construction_118x1024; no pstats frame exists)
  opportunities:
  - opportunity_id: preprocessing_base-2
    opportunity: Replace scipy.signal.detrend + scipy.stats.zscore(nan_policy='omit') in pyspi/data.py:Data.set_data (lines 184-195) by one numpy pass per window (closed-form OLS slope
      and intercept per row, then mean and ddof=1 std).
    opp_type: algorithmic
    expected_speedup: 1-3x
    speedup_basis: 'complexity:both steps are already O(P T); a closed-form numpy pass removes only scipy''s lstsq set-up and the nan_policy=''omit'' handling, so 1-3x on a cost that
      is 3.0 ms per 118x1024 window for the whole Data construction (baseline timing only, no candidate: audit/profiles/micro/opp_xc-blas-threads.json data_construction_118x1024); an
      absolute saving below 3 ms of a ~229 s window. No ranking basis on this row. This infrastructure unit has no SPI identifiers of its own, so profiles/summary.json holds no 118x1024 projection for it and rank_basis_s and projected_patient_s_after stay blank; its cost sits inside the timings of the units that call it. build_csv ranks the row as saving 0 s, after every row of its tier and kind with a positive saving, then by output risk and effort (README ''Optimisation columns'', rule 5).'
    output_risk: unverified-within-tolerance
    risk_evidence: 'the same OLS detrend and ddof=1 z-score, re-associated: ordinary channels change at rounding level. Degenerate-input caveat: flat or exactly linear channels are accepted
      or rejected by scipy''s zero-variance guard on last-bit residuals (preproc.detrend record, probe p2_flat.py), so a re-associated detrend could flip that outcome for such channels'
    effort: S
    depends_on: []
