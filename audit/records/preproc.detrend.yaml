unit_id: preproc.detrend
status: profiled
correctness:
  metric_name_standard: Linear least-squares detrending (removal of a fitted degree-1 polynomial a + b t per channel)
  canonical_ref: 'Bendat & Piersol 2010, Random Data: Analysis and Measurement Procedures, 4th ed., Wiley, data-preparation chapter (trend removal by least-squares polynomial fit, first order); equivalently ordinary least squares on the design [1, t]'
  canonical_definition: r_t = x_t - (a_hat + b_hat t), with (a_hat, b_hat) = argmin sum_t (x_t - a - b t)^2; b_hat = sum (t - tbar)(x_t - xbar) / sum (t - tbar)^2, a_hat = xbar - b_hat tbar; the residual has exactly zero mean and zero sample correlation with t
  documented_definition: 'Supplement gives no detrending rule (supplement §1, line 95, p.3 only says ''we standardize (z-score) the MTS along the time axis''). GitBook api-reference/pyspi.calculator.calculator.md:19: ''Detrend the dataset along the time axis before normalising (if enabled), default=False.'' api-reference/pyspi.data.data.md:29: ''If True, detrend the dataset along the time axis before normalising (if enabled), default=True.'' (the signature on line 31 of the same page says detrend=False). Docstring pyspi/data.py:44-45: ''If True, detrend each time series in the MTS dataset individually along the time axis, default=False.'''
  delegate_lib: scipy==1.17.1 scipy.signal.detrend(data, axis=1) with defaults type='linear', bp=0, overwrite_data=False
  implemented_as: 'Calculator(detrend=False default) forwards the flag to Data only when the dataset is not already a Data object. Data.set_data runs reorder to (processes, observations, replications) -> truncation to n_processes/n_observations -> scipy.signal.detrend(data, axis=1) if self.detrend -> zscore if self.normalise -> NaN check. scipy fits the design A = [t/N, 1], t = 1..N, per column by scipy.linalg.lstsq and subtracts A @ coef (one segment because bp=0), i.e. an ordinary OLS linear-trend residual per (process, replication) along time. Dtype: float32 input stays float32 (dtype char ''f'' is kept), integer input is promoted to float64. A ValueError from detrend (NaN/inf input) is caught, printed as ''Could not detrend data: ...'' and the data continue undetrended. The EEG workflow uses detrend=True then z-score (order fixed by the code: detrend precedes zscore). Probe p1_data.py: Data(normalise=False, detrend=True) matches a numpy.polyfit degree-1 residual to 5.3e-15; detrend then zscore matches to 2.7e-15; 3-D (p,s,r) input is detrended per replication (max abs diff 0.0 vs scipy on axis=1).'
  implementation_trace:
  - pyspi/calculator.py:48-56 Calculator.__init__(detrend=False, normalise=True) stores self._detrend
  - 'pyspi/calculator.py:269-277 load_dataset: Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend) only when dataset is not a Data instance'
  - pyspi/data.py:59-80 Data.__init__(detrend=False) stores self.detrend and calls set_data
  - pyspi/data.py:177 _reorder_data -> (p, s, r) layout (pyspi/data.py:253-271)
  - pyspi/data.py:179-182 truncation to n_processes / n_observations happens before detrend
  - pyspi/data.py:184-191 detrend(data, axis=1) inside try/except ValueError that only prints 'Could not detrend data'
  - pyspi/data.py:193-197 zscore follows detrend (see preproc.zscore)
  - pyspi/data.py:199-203 NaN check raises ValueError
  - scipy/signal/_signaltools.py:4178-4180 detrend signature (type='linear', bp=0, overwrite_data=False)
  - scipy/signal/_signaltools.py:4266-4269 asarray; dtype kept if in 'dfDF' else 'd'
  - scipy/signal/_signaltools.py:4274-4280 single segment bp=[0, N]
  - scipy/signal/_signaltools.py:4287-4295 moveaxis to time-first, reshape (N, -1), copy, cast
  - 'scipy/signal/_signaltools.py:4298-4304 per segment: A = [arange(1, N+1)/N, 1]; coef = linalg.lstsq(A, data); data - A @ coef'
  - scipy/signal/_signaltools.py:4307-4309 restore shape
  deviation_from_documented: Matches the docstring and the Calculator API page (linear, per channel, along time, before z-scoring). The Data API page (pyspi.data.data.md:29) states default=True, contradicting its own signature (line 31) and the code (pyspi/data.py:62 detrend=False). 'Detrend' is not specified as linear anywhere in the docs; the code uses scipy's linear default. The GitBook finance tutorial (finance-stock-price-time-series.md:47) applies detrend(zscore(z, ddof=1)), the opposite order to the code and the EEG workflow (it is the historical order recorded in EEG_OPTIMIZATION_NOTES.md:42-43).
  deviation_from_canonical: 'none for the residual itself (OLS linear residual; agrees with numpy.polyfit to 5e-15 in probe p1_data.py). Edge behaviour outside the canonical definition: for a channel that is constant or exactly linear the canonical residual is identically zero, but the floating-point residual (std 1e-19 to 2e-13 in p2_flat.py) is then z-scored to unit variance instead of being rejected (see new_finding_candidates).'
  units_and_range: 'Same units as the input; residual has zero mean and no linear trend; unbounded; float32 stays float32. Not a pairwise statistic: symmetry n/a.'
  direction_convention: n/a (per-channel transform; no pair index).
  symmetry_expected: n/a
  already_documented: EEG_OPTIMIZATION_NOTES.md lines 42-43 (detrend first, then z-score; historical stores used z-score then detrend); tests/unit/test_data.py:38-53 test_detrend_then_zscore_order locks the current order. The flat-channel, swallowed-error and doc-default items below are not in KNOWN_ISSUES.md.
  new_finding_candidates:
  - 'CANDIDATE (flat/linear channels pass silently when detrend=True): a constant or exactly linear channel leaves a rounding-error residual whose sample std (about 1e-16 to 2e-13) exceeds scipy.zscore''s zero-variance guard ''zero = std <= xp.abs(eps * mn)'' (scipy/stats/_stats_py.py:2932) because the post-detrend mean mn is itself about 1e-17; the channel is then z-scored to a unit-variance, few-level, strongly autocorrelated artefact instead of being rejected. Probe p2_flat.py: ''T= 1024 const 3.0 -> OK std=1.000 uniq=9 lag1ac=+1.00 rawresid_std=3.1e-16''; ''T= 4096 linear .37t+1.1 -> OK std=1.000 uniq=13 lag1ac=-0.25 rawresid_std=2.4e-13''. Outcome is data-dependent: ''T=64 const 3.0 -> ValueError(NaN)'', every ''const 0.0'' -> ValueError(NaN), ''T=64 const 1e-3 -> OK''. Without detrend a constant channel raises (p1_data.py: ''constant row detrend=False: ValueError''). Relevant to flat EEG channels in the detrend=True workflow.'
  - 'CANDIDATE (detrend failure swallowed): pyspi/data.py:186-189 catches ValueError from detrend and only prints; with normalise=False and a non-finite sample the dataset is accepted undetrended with the inf still present. Probe p6_inf.py: ''inf, normalise=False, detrend=True -> accepted; row0 still trended? slope 0.224 | inf present True'' and stdout ''Could not detrend data: array must not contain infs or NaNs''. With normalise=True the later NaN check (data.py:199-203) still raises, so the default path is unaffected.'
  - 'CANDIDATE (documentation default): GitBook pyspi.data.data.md:29 says detrend ''default=True'' while the signature on line 31 and pyspi/data.py:62 use False.'
  proposed_checks:
  - datasets:
    - trending
    - scaled_offset
    - iid_gaussian
    path: kernel
    reference: from-scratch numpy closed-form OLS residual r = x - xbar - b (t - tbar), b = sum((t-tbar)(x-xbar))/sum((t-tbar)^2), applied row-wise; compared with Data(X, normalise=False, detrend=True).to_numpy(squeeze=True)
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: max abs difference <= 1e-12 * max|x| at every T in {64,256,1024,4096}; residual row means <= 1e-12 and zero correlation with t
  - datasets:
    - trending
    - bivariate_gaussian
    path: pipeline-detrend
    reference: 'analytic: trending = bivariate_gaussian (same draw) + slope*t, and OLS detrending is linear and annihilates a + b t, so detrend+zscore of both must coincide'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: 'Data(trending, detrend=True) equals Data(bivariate_gaussian, detrend=True) to <= 1e-12 (probe: 1.8e-15 at T=64, 3.1e-14 at T=1024); without detrend they differ by O(1) (probe: 2.3 to 4.7). Extend to cheap deterministic SPIs (cov_EmpiricalCovariance, spearmanr, dtw, mi_gaussian): outputs equal to <= 1e-10'
  - datasets:
    - trending
    path: pipeline-detrend
    reference: 'analytic: historical order detrend(zscore(x, ddof=1)) equals current order zscore(detrend(x), ddof=1) divided by the per-row constant c = std(x)/std(resid) (both ddof=1)'
    reference_kind: analytic
    criterion: exact
    expected_outcome: 'per-row ratio current/historical is constant to <= 1e-12 and equals c (probe p1_data.py: ratios [1.137, 1.389, 3.691] equal the predicted c). Scale-invariant SPIs (spearmanr, kendalltau, mi_gaussian, xcorr) agree between orders to <= 1e-10; scale-sensitive SPIs (cov_EmpiricalCovariance, pdist_euclidean, dtw, lmfit_*) differ'
  - datasets:
    - iid_gaussian
    path: pipeline-detrend
    reference: 'analytic: a constant or exactly linear channel has an identically zero OLS residual, so its z-score is undefined; build variants of iid_gaussian with row 1 replaced by 0.0, 3.0, 1e-3 and 0.37 t + 1.1'
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: 'confirm or refute the flat-channel candidate: record, for each T in {64,256,1024,4096} and each replacement, whether Data(detrend=True, normalise=True) raises or returns a unit-variance channel; the canonical expectation is a consistent rejection or flag, the candidate predicts a data-dependent mix'
  check_method: independent-impl
  check_reference: refs/preprocessing_base.py:ols_detrend + zs (closed-form OLS residual and ddof=1 z-score in numpy) via r_detonly, r_order_full, r_trunc; analytic invariance r_inv_data; kernels _kernels_basic_misc.spearman/empirical_cov, _kernels_infotheory.gaussian_mi, _kernels_distance.dtw_dp via r_inv_spi; analytic order identity r_order_hist_data / r_order_hist_spis; qualitative r_flat, r_swallow; pyspi side probes/preprocessing_base_probes.py:data_array, historical_order_spis, flat_channel, error_paths
  check_data: trending, scaled_offset, iid_gaussian at T = 64, 256, 1024, 4096 (detrend only); trending and scaled_offset at 64, 1024, 4096 (full order and truncation); trending vs the same bivariate_gaussian draw at 64, 1024, 4096 (array) and 256 (SPIs); trending 256, 1024 (historical order); iid_gaussian with row 1 replaced by 0.0, 3.0, 1e-3, 0.37t+1.1 at all four T with all P=5 rows, and at T = 64, 256, 1024 with the first 3 and the first 2 rows (P dependence)
  agreement_criterion: 'detrend only: tolerance atol = 1e-12 * max|x|, rtol 0; truncate -> detrend -> z-score: exact rtol 1e-12, atol 1e-12; invariance: atol 1e-12 (array), rtol 1e-9 (SPIs); order identity zscore(detrend(x)) = c * detrend(zscore(x)): exact 1e-12; flat-channel and swallowed-error runs: qualitative (canonical expectation = rejection)'
  closeness: 'detonly 12/12 pass, max abs 8.53e-14 (preproc.detrend|trending|4096|kernel|detonly), <= 3.6e-15 for scaled_offset and iid_gaussian; numpy residual row means <= 3.2e-15 and |corr with t| <= 2.3e-14. order-full 6/6 and trunc 6/6 pass, max abs 1.39e-13 (trending|4096|...|trunc), <= 1.8e-15 on scaled_offset. inv-data 3/3 pass, max abs 8.88e-14 (T=4096); inv-cov/spearmanr/mi_gaussian/dtw 4/4 pass, max rel 1.91e-12 (mi_gaussian). Control without detrend: cov and spearmanr differ from the detrended draw by 1.59 and 1.61 (nodetrend-* runs). Historical order: pyspi/historical ratio constant per row (spread <= 2.8e-10 at T=1024) and equal to c = [1.0018, 14.67, 6.07, 29.88] (T=1024) and [1.0005, 3.77, 1.83, 7.57] (T=256); cov_EmpiricalCovariance differs between orders by up to 0.792 (T=1024) and 0.759 (T=256), exactly by c_i c_j (max rel dev 1.6e-14), spearmanr identical (difference 0.0). Flat channel (row 1 of iid_gaussian replaced; const 0.0, const 3.0, const 1e-3, ramp 0.37t+1.1), 10 runs, all fail the rejection expectation. P=5 (flat runs): T=64 const 3.0, const 1e-3 and ramp accepted; T=256 const 3.0 and ramp accepted, const 1e-3 rejected; T=1024 and 4096 const 3.0, const 1e-3 and ramp accepted. P=3 and P=2 (flat-P3, flat-P2 runs, first 3 or 2 rows of the same draw): T=64 const 1e-3 and ramp accepted, const 3.0 rejected; T=256 and 1024 const 3.0, const 1e-3 and ramp accepted. So the same replacement at the same T is accepted at one P and rejected at another (const 3.0 at T=64; const 1e-3 at T=256): scipy.signal.detrend solves all rows in one multi-right-hand-side lstsq (scipy/signal/_signaltools.py:4303), so the rounding residual of the flat row depends on the other rows, and acceptance depends on that residual. Only const 0.0 (rejected in all 10 runs) and the ramp (accepted in all 10) behave the same in every run. Accepted rows have std 1.0, 2 to 26 distinct values, lag-1 autocorrelation 0.62 to 0.999. inf with normalise=False: accepted, inf still present, row-0 slope 0.049 retained (swallow run).'
