optimisation:
  complexity_P_T: 'Per band: O(K*P*T log T) FFT + 2 x O(K*n_fft*P^2) two-sided taper-level CSM (coherency is evaluated twice per band) + O(m^2/2 * P^2) all-pairs frequency combination over the m <= ~50 sub-sampled bins (_inner_combination, connectivity.py:1107-1113). Measured P exponent 1.38 (fit 8->32), 2.61 between 32x1024 and 118x1024, T exponent 0.90; at 118x1024 the CSM term dominates (coherency 83.6%, _inner_combination 10.3%, DPSS 1.0%); the cost is paid once per band because the band is in the cache key.'
  hotspot_1: .venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:coherency (third-party:spectral_connectivity) 83.6% of the profiled SPI call at 118x1024, over 2 calls (the failing default-argument call and the real one)
  hotspot_2: '.venv/lib/python3.12/site-packages/spectral_connectivity/connectivity.py:_inner_combination (all frequency pairs) 10.3% at 118x1024 (1.9% at 8x1024, where transforms.py:dpss_windows is 65.2%, audit/profiles/spectral.psi__8x1024.pstats) | opaque_share is the 8x1024 profile-JSON value (audit/profiles/spectral.psi__8x1024__profile.json, builtin tottime over the whole profile); the 118x1024 pstats named in profile_file gives a builtin tottime share of 0.279 of the compute_spi frame (audit/profiles/micro/prof_spectral__index.json). Both are lower bounds: numpy ufunc work sits in the self time of the calling Python frame.'
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.127
  profile_file: audit/profiles/micro/prof_spectral.psi__118x1024.pstats
  basis_scope_note: 'The cache key includes the band (pyspi/statistics/spectral.py:46-50), so each of the 10 untimed EEG bands pays its own build like the 3 timed configured bands (4.41-4.62 s each at 118x1024, family-warm). Of those 3, only fmin-0_fmax-0-5 is an EEG band; fmin-0_fmax-0-25 and fmin-0-25_fmax-0-5 are outside the EEG selection. The configured basis therefore sums 3 band builds where an EEG run pays 11 and understates the EEG cost, about 11/3 of it if the untimed bands cost like the timed ones (not timed). For scale only (not used by the ranking): on an 11-band basis (49.7 s per window, 29,800 s per patient) spectral_csm-shared-csm at its 6.7x lower bound would save about 25,300 patient-s instead of the 6,900 on the configured basis, more than any row ranked above it'
