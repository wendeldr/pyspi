  - pyspi/config.yaml:722-738 PhaseSlopeIndex configs (fmin, fmax) = (0, 0.5), (0, 0.25), (0.25, 0.5); its labels list (directed, linear/nonlinear, unsigned, bivariate, frequency-dependent) is not read by Calculator._load_yaml (calculator.py:230-258 uses the class labels, :257)
  - spectral_connectivity 1.1.2 .venv/lib/python3.12/site-packages/spectral_connectivity/transforms.py:74-102 Multitaper defaults time_halfbandwidth_product=3, detrend_type='constant' (per-window mean removal), single window = whole series, is_low_bias=True
  - 'transforms.py:155-164 n_tapers = floor(2*NW-1) = 5; :535-541 and :668-673 keep tapers with eigenvalue > 0.9 (probe: 5 tapers kept at T=64..4096)'
  - transforms.py:181-190 n_fft = scipy.fftpack.next_fast_len(T) (= T for T in {64,256,512,1024,4096}); frequencies = fftfreq(n_fft, 1/fs)
  - 'transforms.py:238-260 fft(); :335-354 _multitaper_fft: fft(x * taper, n=n_fft) / fs (scipy.fftpack, e^{-i2pi kn/N} convention)'
  - connectivity.py:157-172 Connectivity.from_multitaper (expectation_type='trials_tapers'); :45-53 EXPECTATION['trials_tapers'] = mean over axes (1, 2)
  - connectivity.py:174-180 frequencies property with :73-89 _non_negative_frequencies -> first (n_fft+1)//2 bins, i.e. 0 .. (n_fft/2-1)/n_fft for even n_fft (Nyquist bin never present)
  - 'connectivity.py:195-208 _cross_spectral_matrix and :1187-1190 _complex_inner_product: S[i,j] = X_i * conj(X_j) averaged over tapers; :189-193 _power'
  - 'connectivity.py:295-313 coherency(): C_ij(f) = S_ij / sqrt(S_ii S_jj), diagonal set to NaN, non-negative frequencies only'
  - 'connectivity.py:1313-1335 _bandpass: keeps bins with fmin < f < fmax (both endpoints strictly excluded)'
  - connectivity.py:1338-1357 _get_independent_frequency_step = int(ceil(frequency_resolution / (1/n_fft))) with frequency_resolution supplied by pyspi as (fmax-fmin)/50
  - 'connectivity.py:1060-1104 Connectivity.phase_slope_index: :1090-1093 _bandpass(coherency, frequencies, [fmin, fmax]); :1095-1098 step from frequency_resolution; :1099-1102 frequency_index = arange(0, n_band, step) (decimation); :1104 _inner_combination(bandpassed_coherency).imag'
  - 'connectivity.py:1107-1113 _inner_combination: combination_index = all itertools.combinations(range(K), 2); returns sum over pairs of conj(C[f_a]) * C[f_b] along the frequency axis; with K <= 1 the empty combinations array is 1-D and combination_index[:, 0] raises IndexError (probe)'
  deviation_from_documented: "(1) Labels/class: documented 'directed' (supplement \xA71.5.4 keywords, config.yaml:724) but the class is Undirected with labels ['unsigned','spectral','undirected'] (spectral.py:288-290); output is signed and antisymmetric, so 'unsigned' is also contrary to the values (already documented: REVIEW M1 and M5; tests/README.md bug 5 before b2f6d7e). (2) Identifier says 'mean' but no average over frequency or pairs is taken: the value is a raw SUM over K(K-1)/2 frequency pairs (spectral.py:91-93; probe all-pairs recomputation from library coherency equals pyspi to 0.0). (3) Frequency grid: documented 125 uniformly sampled bins over [4/T, fs/2]; implemented n_fft/2 bins k/n_fft (k >= 1 in band since fmin=0 is strictly excluded), then decimated to ~50 bins by s = ceil(band*n_fft/50) (probe K = 31..50). (4) Band endpoints: documented closed intervals [0, fs/4], [fs/4, fs/2]; implemented open (fmin < f < fmax, connectivity.py:1329-1331), so the bin f = 0.25 belongs to neither half band and DC/Nyquist are never used. (5) The method weights 'consistency of the changes in phase differences' over every pair of decimated frequencies, not over neighbouring frequencies (already REVIEW M5). (6) Narrow bands (EEG identifiers) with 0 or 1 in-band bins raise IndexError inside _inner_combination, giving an all-NaN matrix (probe: fmin 0.5/1024, fmax 2/1024 at T=512 and 1024; also 2-4 and 4-6 'Hz' bands); not documented."
  deviation_from_canonical: 'Sums conj(C(f_a)) C(f_b) over every unordered pair of kept frequencies instead of adjacent pairs at spacing delta_f (Nolte 2008 eq. 3; already REVIEW M5). Consequences found here: (a) magnitude scales roughly with K^2 and therefore with T and band through the decimation rule (delayed_noise pair (0,1), full band: pyspi 296 / 580 / 694 / 787 at T = 64 / 256 / 1024 / 4096 (spectral.psi|delayed_noise|64|kernel|rep:full and spectral.psi|delayed_noise|{256,1024,4096}|pipeline|nolte:full), while Nolte''s adjacent-pair sum is 3.061 / 3.094 / 3.081 at T = 256 / 1024 / 4096 (ref_nolte_triu[0] of the same nolte:full runs; check-stage numbers that replace the trace-stage probe values 3.06 / 3.03 / 3.01); the T = 64 adjacent value 2.75 is a trace-stage probe value with no check run behind it); (b) for a pure delay with |C| = 1 the all-pairs value DEcreases with the delay (full band, T=256: tau=1 588, tau=5 116, tau=30 10.6) whereas Nolte''s PSI increases with the delay until wrap (3.09, 15.1, 33.7) (analytic probe), so pairwise ranking by this value can invert the ranking by delay magnitude for broadband delays (elaboration of REVIEW M5, not a new finding); (c) sign can differ from Nolte''s (REVIEW M5 example). The decimation spacing s/n_fft = (fmax-fmin)/50 rounded up is a band-relative step, not the multitaper resolution 2W = 6/T; for T=64 s=1 (spacing 1/64 < 6/64). No jackknife normalisation (Nolte''s eq. 6; the paper defines Psi_tilde (eq. 3) and the normalised Psi (eq. 6) separately, so reporting the raw form is a choice, not a deviation in kind). With K = 2 kept bins the all-pairs and adjacent formulas coincide.'
  units_and_range: Dimensionless; signed; antisymmetric (A[j,i] = -A[i,j] exactly, probe max|A + A.T| = 0); bounded by |A| <= K(K-1)/2 (each term has |C||C'| <= 1), K up to 50, observed up to ~790; NaN diagonal; whole matrix NaN (exception) when the band holds 0 or 1 bins. Not comparable across T or bands because K depends on both.
  direction_convention: 'A[i,j] = Im sum_{a<b} conj(C_ij(f_a)) C_ij(f_b) with C_ij from S_ij = X_i X_j^*. If x_j(t) = x_i(t - tau) (i leads), S_ij ~ exp(+i 2 pi f tau), phase rises with f and A[i,j] > 0 for small tau. Probe delayed_noise T=256 band 0-0.25 (x0 leads x1, x2, x3 by 1, 3, 5): A[0,1] = +238.2, A[0,2] = +255.1, A[0,3] = +105.3, A[1,0] = -238.2. So A[i,j] > 0 means row i leads column j, same as Nolte''s convention; the magnitude is not monotone in the delay. If the REVIEW M1 bypass were fixed by mirroring (Undirected.multivariate), the antisymmetric matrix would be replaced by its upper triangle mirrored and the sign of the lower triangle would be lost.'
  symmetry_expected: antisym
  already_documented: "docs/storage_comparison/REVIEW.md M5 (all unordered frequency pairs via _inner_combination, not Nolte eq. 3; sign can differ); REVIEW M1 (Undirected mirror bypassed; tests/README.md bug 5 before b2f6d7e); KNOWN_ISSUES 'tests/README.md worth knowing' (spectral cache first insert keyed by self.measure); EEG_OPTIMIZATION_NOTES.md \xA7review 'standard vs historical PSI', 'band forwarding', 'parameter-specific labels'; DEPENDENCY_COMPATIBILITY_REVIEW.md:84 band forwarding (reported in the section headed 'Spectral-connectivity 2.0.1' (DEPENDENCY_COMPATIBILITY_REVIEW.md:74) for a dependency method that 'accepts default arguments'; 2.0.1 is not installed in this checkout, so that half is not re-tested here; under the pinned 1.1.2 the band IS forwarded, see candidates)"
  new_finding_candidates:
  - 'CANDIDATE (refinement of the KNOWN_ISSUES band-forwarding item, cross-listed in already_documented; not a new defect, so new_finding should stay false; it contradicts the general reading of that item for the pinned version): with spectral_connectivity 1.1.2 the band is forwarded. getattr(conn, ''phase_slope_index'')() raises TypeError at connectivity.py:1329 (''NoneType'' object is not subscriptable) and spectral.py:75 then calls _get_statistic with the band. Spy probe: calls (''psi'', (), {}) then (''psi'', (), {''frequencies_of_interest'': [0, 0.25], ''frequency_resolution'': 0.005}). The DEPENDENCY_COMPATIBILITY_REVIEW.md:84 observation sits under the 2.0.1 heading (:74) and describes a method that accepts default arguments; that it applies to 2.0.1 is inferred from that wording and not re-tested (2.0.1 is not installed here). The wasted first call still computes the full coherency once (cost only).'
  - 'CANDIDATE (new): the identifier modifier ''mean'' is not applied; PSI is a raw sum. spectral.py:91 ''_statfn(adj_freq[0, freq_id, :, :], axis=0)'' raises IndexError on the 3-D (1, P, P) result and :93 returns adj_freq[0]; probe: pyspi A[0,1] = 579.704273 equals the hand-computed all-pairs sum 579.704273 (diff 0.0) at T=256, full band.'
  - 'CANDIDATE (pack hypothesis 3 confirmed for PSI): narrow bands with <= 1 bin raise IndexError in _inner_combination (connectivity.py:1111 ''too many indices for array: array is 1-dimensional, but 2 were indexed''); probe (delayed_noise truncated): EEG bands 0.5-2, 2-4, 4-6 (/1024) fail at T=512 (0 bins) and T=1024 (1 bin); Calculator then stores an all-NaN matrix (calculator.py:336-339 at HEAD a1f20c7). Bands with exactly 2 kept bins return Nolte''s single adjacent term.'
  - 'CANDIDATE: half-band identifiers exclude f = 0.25 from both bands and fmin=0 excludes DC (strict inequalities at connectivity.py:1329-1331); together with the absent Nyquist bin the three bands do not tile [0, 0.5] as documented (closed intervals). For narrowband_f0-0.25 at T >= 1024 the coupling sits at the excluded bin and adjacent bins only.'
  - 'CANDIDATE (minor, cost/robustness): returned matrix shares memory with the Data cache (spectral.py:93 then :101 fill_diagonal in place); probe np.shares_memory True; a caller mutating the result would corrupt the cached value for later calls on the same Data.'
  - 'CANDIDATE (added in Workflow 4b-2; a mechanism separate from REVIEW M5''s all-pairs sum): pyspi passes frequency_resolution = (fmax-fmin)/50 (spectral.py:298-301), so the library keeps every s-th in-band bin with s = ceil(((fmax-fmin)/50) n_fft) (connectivity.py:1095-1102). The phase of a delay tau then advances by 2 pi tau s/n_fft between kept bins and aliases: for n_fft/(2s) < tau < n_fft/s (mod n_fft/s) the reported direction reverses. Nolte''s adjacent formula on the same decimated bins reverses too, so the all-pairs sum is not the cause; Nolte''s eq. 3 at native resolution keeps the sign. Example: T = 1024 full band, s = 11, reversal for delays 46.5-93 samples; EEG band fmin 0.5/1024, fmax 125/1024 at T = 1024: s = 3, reversal for delays 171-341 samples.'
