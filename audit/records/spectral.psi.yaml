  - 'pyspi/statistics/spectral.py:20-43 NonparametricSpectral.__init__: fs=1, fmax default fs/2; statistic ''mean'' -> _statfn=np.nanmean, ''delay'' -> _statfn=None; identifier suffix _multitaper_{statistic}_fs-{fs}_fmin-{fmin:.3g}_fmax-{fmax:.3g} with ''.''->''-'''
  - pyspi/statistics/spectral.py:45-50 key = (measure, fmin, fmax) for GroupDelay/PhaseSlopeIndex (band-specific cache key)
  - 'pyspi/statistics/spectral.py:64-83 NonparametricSpectralMultivariate._get_cache: :69 z = data.to_numpy(squeeze=True).T (T x P); :70 sc.Multitaper(z, sampling_frequency=1) with library defaults; :71 Connectivity.from_multitaper(m); :73 getattr(conn, measure)() called WITHOUT arguments raises TypeError in 1.1.2 (frequencies_of_interest=None / frequency_resolution=None) and :75 falls back to self._get_statistic(conn), which forwards the band (spy probe: first call kwargs {}, second call {''frequencies_of_interest'': [0, 0.25], ''frequency_resolution'': 0.005}); :78-81 the first insert into a fresh Data is keyed by the string self.measure, later inserts by self.key (probe cache keys [''freq'', ''phase_slope_index'', (''group_delay'', 0, 0.25)])'
  - 'pyspi/statistics/spectral.py:85-102 NonparametricSpectralMultivariate.multivariate: :88 freq_id computed but unused for PSI; :91 self._statfn(adj_freq[0, freq_id, :, :], axis=0) raises IndexError because the PSI result is 3-D (n_windows=1, P, P); :92-93 except IndexError -> adj = adj_freq[0] (raw all-pairs sum); :101 np.fill_diagonal(adj, nan) writes into the cached array (returned matrix shares memory with data.spectral_mv, probe np.shares_memory True)'
  - 'pyspi/statistics/spectral.py:288-301 PhaseSlopeIndex(NonparametricSpectralMultivariate, Undirected): labels [''unsigned'',''spectral'',''undirected'']; _get_statistic -> C.phase_slope_index(frequencies_of_interest=[fmin, fmax], frequency_resolution=(fmax-fmin)/50)'
