  what_changed: tslearn's DTW is sqrt(min over warping paths of sum (x_i - y_j)^2) with weight-1 steps and no length normalisation. Sakoe & Chiba 1978 (symmetric
    form, P = 0) uses |x_i - y_j| with diagonal weight 2 and divides by n + m. On this unit's 4 canon runs the two disagree in scale by a factor 25.6-62.2 (pyspi / 1978 form) and in ranking (Spearman 0.71-0.95 over the 6 pairs of a dataset), so this is a value-changing convention rather than a constant factor. The constraint is the global Itakura parallelogram (slope 2) only; no local slope rule is applied inside it. Against one symmetric local rule (no two consecutive horizontal or vertical moves, slopes 1/2..2) the value is about 15% lower (1 - 1/1.18) on independent noise; that figure depends on the local rule chosen, and Itakura 1975's own asymmetric rule was not computed. Common 'Itakura window' practice; supplement variant (rubric 7).
