optimisation:
  complexity_P_T: 'O(P^2 T^2): tslearn dtw with the Itakura mask per ordered pair (TimeWarping is Undirected over Directed.multivariate, both
    orders computed, pyspi/statistics/distance.py:TimeWarping.bivariate), a T x T mask plus a numba DP over the full grid. Measured P_exponent
    2.1, T_exponent 0.82 (8x256 -> 8x1024; a fixed per-call cost of tens of microseconds and a ~50 ms 8x256 overhead flatten it); 118x1024 measured
    (46.6 s per window). The P^2 pair term dominates.'
  hotspot_1: 'tslearn/metrics/_dtw.py:dtw (third-party:tslearn) 88.7% self time of the profiled SPI call at 8x1024 (numba mask build and DP hidden; a scratch timing at T=1024, NUMBA/OMP threads 1, puts the per-call Itakura mask build _njit_compute_mask at 1.74 ms of a 3.48 ms _njit_dtw call, about half of it)'
  hotspot_2: tslearn/backend/backend.py:instantiate_backend (third-party:tslearn) 8.5%, of which numpy arrayprint 7.0%
  hotspot_owner: third-party:tslearn
  opaque_share: 0.0253
  profile_file: audit/profiles/distance.dtw.constraint-itakura__8x1024.pstats
  opportunities:
  - opportunity_id: dtw_family-2
    opportunity: 'Banded DP for the constrained DTW: iterate only over the admissible cells (|i - j| <= 1 for sakoe_chiba: 3T-2 cells, 0.29% of
      the grid at T=1024; the Itakura parallelogram rows for itakura, about 1/3 of the grid) instead of scanning the whole T x T mask; cells outside
      the mask stay +inf exactly as now.'
    opp_type: algorithmic
    expected_speedup: '~2.5x'
    speedup_basis: 'profile:audit/profiles/distance.dtw.constraint-itakura__8x1024.pstats dtw self 88.7% + complexity: the parallelogram is 33.3% of the grid; scratch timing at T=1024 (NUMBA/OMP threads 1): DP with a cached mask 1.59 ms vs 3.32 ms unconstrained, mask build 1.74 ms of a 3.48 ms call. The unconstrained and Itakura walls are nearly equal (0.187 vs 0.183 s at 8x1024) only because the per-call mask build adds back what the mask saves. A banded DP that derives the parallelogram row bounds directly removes the mask build and the masked-out scan (about 2.5x); one that still builds the T x T mask per call gains only about 1.1x. It overlaps dtw_family-1 on the mask part: both together about 2.5-3x'
    output_risk: unverified-bit-identical
    risk_evidence: out-of-mask cells are +inf and never contribute to min(); in-band arithmetic unchanged
    effort: M
    depends_on:
    - dtw_family-1
