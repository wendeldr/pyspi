unit_id: distance.dtw.constraint-itakura
status: profiled
correctness:
  metric_name_standard: Dynamic time warping distance with Itakura parallelogram (max slope 2)
  canonical_ref: Sakoe H, Chiba S 1978, IEEE Trans. Acoust. Speech Signal Process. 26(1):43-49, symmetric DP-equation (Table I / eq. for P=0)
    and adjustment window |i-j| <= r; global path constraints also in Itakura F 1975, IEEE Trans. ASSP 23(1):67-72 (slope limits 1/2..2)
  canonical_definition: g(1,1)=2d(1,1); g(i,j)=min{g(i,j-1)+d(i,j), g(i-1,j-1)+2d(i,j), g(i-1,j)+d(i,j)}; D(A,B)=g(I,J)/(I+J), with d(i,j)=||a_i-b_j||
    a (non-squared) distance; constrained variants restrict (i,j) to a window/parallelogram
  documented_definition: 'supplement §1.2.7, p.6-7 (pack lines 286-301) and GitBook distance-similarity.md ''Dynamic Time Warping'': "DTW finds
    the minimum distance between two time series through alignment (shifting and dilating of the sequences)... the Sakoe-Chiba band [17] and the
    Itakura parallelogram [18] global constraints... computed using the tslearn package for the three global constraints"; keywords undirected,
    nonlinear, unsigned, bivariate, time-dependent. No constraint width/slope is documented.'
  delegate_lib: tslearn==0.9.0 tslearn.metrics.dtw (_dtw.py:30) -> numba _njit_dtw
  units_and_range: Same units as the (z-scored, hence dimensionless) input; >= 0; 0 iff an admissible warping aligns the series exactly; unnormalised,
    grows with T; symmetric in its two arguments for equal-length inputs; finite for finite input (an infeasible Itakura mask raises instead of
    returning NaN). Diagonal of the pyspi matrix is NaN.
  direction_convention: 'Undirected: A[i,j] = A[j,i] = dtw(z_min(i,j), z_max(i,j)) (Undirected.multivariate mirrors the upper triangle); both
    orders are computed and the function is argument-symmetric, so the copy only removes last-bit differences; diagonal NaN.'
  symmetry_expected: sym
  implemented_as: 'As dtw, but the DP is restricted to tslearn''s Itakura parallelogram with max_slope 2.0 (default, pyspi passes none): cells
    whose path from (0,0) and to (T-1,T-1) can keep slopes within [1/2, 2]; bounds rounded to 2 decimals then ceil/floor. Covers ~1/3 of the grid
    for every T (probe: 0.3335 at T=64, 0.33333 at T=4096); the corner rows/columns admit only the corner cell.'
  implementation_trace:
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset)
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False), then scipy.stats.zscore(axis=1, nan_policy=''omit'',
    ddof=1) if normalise=True (default True)'
  - 'pyspi/base.py:132-138 Undirected.multivariate: A = Directed.multivariate(data); A[tril(-1)] = A.T[tril(-1)] (lower triangle overwritten by
    the upper triangle, so A[i,j] = bivariate(min(i,j), max(i,j)))'
  - 'pyspi/base.py:84-94 Directed.multivariate: A filled with NaN, bivariate(data, i, j) for every ordered pair i != j (both orders computed,
    diagonal stays NaN)'
  - 'pyspi/base.py:27-49 parse_bivariate: a raw (x, y) call builds Data() and add_process(x), add_process(y) (pyspi/data.py:219-240)'
  - 'pyspi/statistics/distance.py:154-163 TimeWarping.__init__: identifier += ''_constraint-'' + global_constraint.replace(''_'',''-''); self._global_constraint
    stored'
  - 'pyspi/statistics/distance.py:174-177 TimeWarping.bivariate: z = data.to_numpy(squeeze=True) (pyspi/data.py:108-118); return self._simfn(z[i],
    z[j], global_constraint=self._global_constraint)'
  - 'pyspi/statistics/distance.py:180-187 DynamicTimeWarping: self._simfn = tslearn.metrics.dtw'
  - .venv/lib/python3.12/site-packages/tslearn/metrics/__init__.py:20-27 tslearn.metrics.dtw is tslearn.metrics._dtw.dtw (tslearn==0.9.0 per tslearn/__init__.py:2)
  - .venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:30-37 dtw(s1, s2, global_constraint=None, sakoe_chiba_radius=None, itakura_max_slope=None,
    be=None)
  - .venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:145-147 instantiate_backend (numpy for ndarray inputs); to_time_series(remove_nans=True)
    reshapes to (T,1) and strips trailing all-NaN rows (.venv/lib/python3.12/site-packages/tslearn/utils/utils.py:154-212, _ts_size 511-518)
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:157-163 global_constraint mapped via GLOBAL_CONSTRAINT_CODE (.venv/lib/python3.12/site-packages/tslearn/metrics/_masks.py:10:
    None->0, itakura->1, sakoe_chiba->2) and passed to _njit_dtw'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:383-412 __make_dtw/_dtw_generic: mask = _njit_compute_mask(sz1, sz2, code, radius,
    slope); cum_sum = _njit_accumulated_matrix(s1, s2, mask); return sqrt(cum_sum[-1, -1]) (line 400)'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/_masks.py:310-361 _compute_mask_generic: code 2 -> radius None replaced by 1 (339-341);
    code 1 -> max_slope None replaced by 2.0 (346-348); code 0 -> all-True mask (350)'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/_dtw.py:324-344 _njit_accumulated_matrix: cell cost = sum_d (s1[i,d]-s2[j,d])**2; cum[i+1,j+1]
    = cost + min(cum[i,j+1], cum[i+1,j], cum[i,j]) (equal weights on all three moves, masked cells stay +inf)'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/_masks.py:89-140 _itakura_mask_generic: slopes in [1/max_slope, max_slope] = [0.5, 2]
    scaled by sz1/sz2; lower/upper bounds from both corners, rounded to 2 decimals (102-103, 113-114), ceil/floor; raises RuntimeWarning if any
    row/column is empty (122-138)'
  deviation_from_documented: The slope parameter (2) is undocumented; otherwise none.
  deviation_from_canonical: 'Three convention differences from the Sakoe-Chiba 1978 symmetric form: (1) local cost is the SQUARED difference and
    the result is sqrt of the minimal accumulated squared cost (Euclidean-over-path DTW), not the sum of |a_i-b_j|; (2) step pattern is ''symmetric1''
    (diagonal move weight 1, not 2); (3) no normalisation by I+J (or by path length), so the value grows with T (about sqrt(T) for independent
    noise). Probe (T=50 iid N(0,1)): tslearn 6.5668 == from-scratch sqrt(min sum sq) 6.5668; abs-cost unweighted DP 36.674. This is the convention
    of most ML libraries (tslearn docstring _dtw.py:41-46; dtaidistance 2.5.1 dtw.distance(use_c=False) gives the identical unconstrained value on seeded probes T=50 seed 0 and T=80 seed 5). Constraint: Itakura 1975 imposes LOCAL slope
    constraints (no two consecutive horizontal moves, slopes 1/2..2), whose reachable region is the parallelogram; tslearn imposes only the GLOBAL
    parallelogram with ordinary symmetric1 local moves, so arbitrarily long horizontal/vertical runs are allowed inside the region (common ''Itakura
    window'' practice, e.g. R dtw itakuraWindow).'
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (minor, boundary rounding): tslearn rounds the parallelogram bounds to 2 decimals before ceil/floor (_masks.py:101-116); at large
    T a cell whose exact bound is within 0.005 of an integer can be admitted or excluded differently from an exact-arithmetic mask. To be measured
    by cell-by-cell comparison with an exact rational mask at T in {64,256,1024,4096}.'
  - 'Cross-family (infrastructure) candidate, affects direct two-array calls only: parse_bivariate (pyspi/base.py:33-36) builds Data() (normalise=True)
    and calls add_process(x) then add_process(y); the first call goes through set_data and is z-scored, the second is np.append-ed raw (pyspi/data.py:230-234).
    Probe with x, y ~ 5 + 3 N(0,1), T=64: stored means [0.0, 4.783], stds [1.0, 2.995]. So spi.bivariate(x, y) compares z-scored x with raw y.
    Calculator/multivariate paths are unaffected.'
