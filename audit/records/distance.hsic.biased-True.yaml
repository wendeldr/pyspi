unit_id: distance.hsic.biased-True
status: profiled
correctness:
  metric_name_standard: square root of the normalised biased HSIC (V-statistic) with a Gaussian median-heuristic kernel, i.e. sqrt of
    centred kernel alignment; kernel analogue of dCor_n
  canonical_ref: 'Gretton, Bousquet, Smola & Scholkopf 2005, ALT, LNCS 3734:63-77 (HSIC_b); Gretton et al. 2007, NIPS 20 (= supplement
    ref [15]; eq. (3) unbiased U-statistic estimator, eq. (4) biased HSIC_b = (1/m^2) tr(KHLH); Sec. 4 Gaussian kernel with ''kernel
    size set to the median distance between points in input space'', whether per variable is not stated); normalisation: centred kernel
    alignment, Cortes, Mohri & Rostamizadeh 2012, JMLR 13:795-828; equivalence with dCov: Sejdinovic et al. 2013, Ann. Statist. 41(5):2263-2291'
  canonical_definition: HSIC_b(x,y) = (1/n^2) tr(K H L H), H = I - 11'/n, K_ij = exp(-|x_i-x_j|^2/(2 sigma_x^2)), L likewise with sigma_y,
    sigma = median inter-sample distance (Gretton et al. 2007 Sec. 4; a separate median for each variable is the common reading, not
    stated explicitly there); unnormalised, >= 0
  documented_definition: 'supplement §1.2.5, p.6: ''HSIC yields a biased statistic, where the unbiased (and consistent) estimator can
    be derived by double centering the kernel distance matrix [15]. Both biased and unbiased estimators are computed using hyppo'' (identifier
    30, hsic_biased). GitBook distance-similarity.md ''Hilbert-Schmidt Independence Criterion'''
  delegate_lib: hyppo==0.5.2 hyppo.independence.Hsic(bias=True).statistic -> compute_kern (median heuristic) -> scikit-learn==1.9.1
    pairwise_kernels('rbf') -> Dcorr(bias=True, compute_distance=None).statistic (numba _dcorr)
  implemented_as: 'Default preprocessing: z-score (ddof=1), no detrend. T time points as iid 1-D samples. sigma = median off-diagonal
    distance of x (first argument) used for both kernels. D = 1 - K double-centred (equals -HKH, the constant vanishes), stat = sqrt(
    tr(HKH HLH)/sqrt(tr(HKH HKH) tr(HLH HLH)) ) = sqrt of normalised HSIC_b (probe: 0.8773521262252134 vs from-scratch 0.8773521262252156;
    raw HSIC_b 0.0577). Returns 0 if a variance or the covariance <= 0. Upper triangle mirrored.'
  implementation_trace:
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend only if detrend=True (default False), then scipy.stats.zscore(axis=1,
    ddof=1) if normalise=True (default); stored as (M, T, 1)'
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, nan) (lines
    at HEAD a42ebc1, unchanged since a1f20c7; the trace cited the pre-a1f20c7 lines 294/297)
  - 'pyspi/base.py:132-138 Undirected.multivariate: A = Directed.multivariate(data); li = tril_indices(-1); A[li] = A.T[li] (lower triangle
    overwritten by upper triangle)'
  - 'pyspi/base.py:84-94 Directed.multivariate: for every ordered pair i != j, A[i, j] = self.bivariate(data, i=i, j=j) (both triangles
    are computed)'
  - 'pyspi/base.py:27-49 parse_bivariate: two raw arrays are wrapped into a Data object (which z-scores) and i, j = 0, 1'
  - pyspi/data.py:108-118 Data.to_numpy returns the (M, T, 1) array, so x, y = data.to_numpy()[[i, j]] are (T, 1) column arrays (T samples
    of a 1-D variable)
  - 'pyspi/config.yaml:167-177 HilbertSchmidtIndependenceCriterion configs: biased False / biased True'
  - pyspi/statistics/distance.py:54-57 HilbertSchmidtIndependenceCriterion.__init__ stores biased; identifier += '_biased'
  - 'pyspi/statistics/distance.py:59-63 HilbertSchmidtIndependenceCriterion.bivariate: x, y = data.to_numpy()[[i, j]]; stat = Hsic(bias=self._biased).statistic(x,
    y)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hsic.py:83-92 Hsic.__init__: compute_kernel=''gaussian'', is_kernel=False,
    bias stored'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hsic.py:113-119 Hsic.statistic: kernx, kerny = compute_kern(x, y, metric=''gaussian'');
    distx = 1 - kernx/max(kernx); disty = 1 - kerny/max(kerny) (max = 1, the diagonal)'
  - '.venv/lib/python3.12/site-packages/hyppo/tools/common.py:321-333 compute_kern: if ''gamma'' not in kwargs, med = median of the
    off-diagonal entries of pairwise_distances(x, ''l2'') -- x ONLY; med = med if med else 1; kwargs[''gamma''] = 1/(2 med^2)'
  - '.venv/lib/python3.12/site-packages/hyppo/tools/common.py:342-343 compute_kern: simx = pairwise_kernels(x, ''rbf'', gamma) and simy
    = pairwise_kernels(y, ''rbf'', gamma) -- the same gamma (bandwidth of x) is used for y'
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/pairwise.py:1583-1627 rbf_kernel: K = exp(-gamma * ||x - y||^2) via euclidean_distances(squared=True)'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/hsic.py:121-122 Hsic.statistic: stat = Dcorr(bias=self.bias, compute_distance=None).statistic(distx,
    disty) -- the kernel-induced distances are fed to the distance-correlation code'
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:141-149 Dcorr.statistic with is_distance=True: no distance computation,
    straight to _dcorr'
  - .venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:261-281 _center_distmat (double centring if bias, U-centring with
    zero diagonal otherwise)
  - '.venv/lib/python3.12/site-packages/hyppo/independence/dcorr.py:416-449 _dcorr: stat = covar/sqrt(varx*vary) (443); sqrt only when
    bias=True (446-447); 0 if a variance <= 0 (438-439)'
  deviation_from_documented: '(a) The supplement and GitBook describe HSIC as ''an RKHS-based statistic'' with biased and unbiased estimators;
    neither says that the returned value is NORMALISED (HSIC(x,y)/sqrt(HSIC(x,x) HSIC(y,y)), a correlation-like number), nor that the
    Gaussian kernel bandwidth is the median heuristic computed from the first argument only and reused for the second. (b) ''the unbiased
    (and consistent) estimator can be derived by double centering the kernel distance matrix [15]'': citing [15] for both estimators
    is supported (Gretton et al. 2007 eq. (3) is the unbiased U-statistic estimator, eq. (4) the biased HSIC_b). The deviation is the
    ''double centering'' wording: double centring of 1-K is what this biased variant computes, while the unbiased variant U-centres
    (equal to Gretton 2007 eq. (3) / Song et al. 2012 eq. (5)). (c) Labelled ''undirected'' but the bivariate value depends on argument
    order (made symmetric only by mirroring). (d) The square root (dcorr.py:446-447) is not mentioned; hsic_biased is on the root scale
    while hsic is on the squared scale.'
  deviation_from_canonical: '(1) Returns sqrt(HSIC_b(x,y)/sqrt(HSIC_b(x,x) HSIC_b(y,y))) rather than HSIC_b (probe: 0.8774 vs 0.0577);
    (2) bandwidth from x only, reused for y (a separate median per variable, the common reading of Gretton et al. 2007 Sec. 4, would
    give 0.8805 instead of 0.8774 on the probe pair); (3) hence asymmetric in (x, y) before pyspi mirrors it. The 1/n^2 vs 1/(n-1)^2
    normalisation of HSIC_b is irrelevant after normalisation.'
  units_and_range: 'dimensionless; [0, 1] (Gaussian Gram matrices are PSD, so the centred inner products are >= 0); positively biased
    under independence; invariant to common positive scaling and shifts, not to rescaling y relative to x (probe, normalise=False: 0.890
    -> 0.603 for y*10), default z-scoring removes pure scale differences.'
  direction_convention: 'undirected by mirroring only: bivariate(0,1) = 0.5561200526 vs bivariate(1,0) = 0.5771289783 on z-scored x0
    vs x0^2; the matrix keeps the upper triangle (base.py:136-137): A[i, j] = A[j, i] = bivariate(x = process min(i, j), y = process
    max(i, j)).'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (order dependence): bandwidth computed from the first argument only (hyppo/tools/common.py:323-333, applied to both at
