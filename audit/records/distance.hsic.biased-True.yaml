optimisation:
  complexity_P_T: 'O(P^2 T^2): per ordered pair (pyspi/statistics/distance.py:HilbertSchmidtIndependenceCriterion.bivariate) two T x T l2/squared-distance
    matrices, a median over T^2 entries (numpy partition), two RBF Gram matrices, then hyppo Dcorr on 1 - K/max(K) (two centrings, three products).
    Measured P_exponent 2.09, T_exponent 2.44; the pair term dominates at 118x1024 (t_pair 102 ms, t_fixed 0).'
  hotspot_1: hyppo/independence/dcorr.py:Dcorr.statistic called from hyppo/independence/hsic.py:Hsic.statistic (third-party:hyppo) 61.7% self
    time of the profiled SPI call at 8x1024 (numba _dcorr centring and products hidden in it)
  hotspot_2: 'hyppo/tools/common.py:compute_kern (third-party:hyppo -> sklearn/numpy) 29.0%: sklearn rbf_kernel 14.8%, numpy median/partition
    9.5% (bandwidth of the first argument)'
  hotspot_owner: third-party:hyppo
  opaque_share: 0.112
  profile_file: audit/profiles/distance.hsic.biased-True__8x1024.pstats
  opportunities:
  - opportunity_id: dcorr_hsic-3
    opportunity: 'Per-channel cache for the parts of HSIC that depend on one channel: the l2 distances and median bandwidth gamma_x (hyppo/tools/common.py:compute_kern),
      the squared distances that sklearn rbf_kernel exponentiates, and the x-side Gram, 1 - K/max(K), centred matrix and self inner product. The
      y-side Gram uses the x channel''s bandwidth (the kernel is asymmetric, see symmetry_observed), so per pair exp(-gamma_x D2_y), its centring
      and two inner products remain.'
    opp_type: cache-sharing
    expected_speedup: ~2x
    speedup_basis: 'profile:audit/profiles/distance.hsic.biased-True__8x1024.pstats median 9.5% + x-side half of rbf_kernel (14.8%/2) + l2 distances
      4% + x-side centring and self product (about half of the 61.7% numba share) + complexity: removable share about 0.55-0.6 per pair, Amdahl
      2.2-2.5x; per-component costs as measured for dcorr in audit/profiles/micro/opp_dcorr_hsic-1.json (the dcorr_hsic-1
      micro-benchmark, dcorr only; this avenue has no micro-benchmark of its own)'
    output_risk: unverified-bit-identical
    risk_evidence: same sklearn/numba calls on the same per-channel arrays (dcorr analogue bit-identical in audit/profiles/micro/opp_dcorr_hsic-1.json);
      the y-side Gram must still use the x channel's gamma
    effort: M
    depends_on:
    - xc-undirected-upper
