unit_id: basic.prec.OAS
status: profiled
correctness:
  metric_name_standard: inverse of the OAS shrinkage covariance estimate
  canonical_ref: 'Dempster 1972, Biometrics 28(1):157-175 (covariance selection; concentration/precision matrix); partial-correlation relation rho_ij|rest = -Theta_ij / sqrt(Theta_ii Theta_jj) in Whittaker 1990, Graphical Models in Applied Multivariate Statistics, Wiley, ch. 5. Covariance estimator: Chen, Wiesel, Eldar & Hero 2010, IEEE Trans. Signal Processing 58(10):5016-5029, Eq. 22-23 (arXiv:0907.4698v1 Eq. 23); target F = tr(S)/p I (Eq. 3), S = (1/n) sum x_i x_i^T (Eq. 2)'
  canonical_definition: 'Theta = Sigma_hat^{-1} where Sigma_hat is: Sigma_OAS = (1 - rho) S + rho (tr(S)/p) I, rho = min( [(1 - 2/p) tr(S^2) + tr^2(S)] / [(n + 1 - 2/p)(tr(S^2) - tr^2(S)/p)], 1 ); partial correlation is -Theta_ij/sqrt(Theta_ii Theta_jj), not Theta_ij itself'
  documented_definition: 'supplement §1.1.2, p.4 (supplement.txt:158-171): ''The precision matrix is the matrix inverse of the covariance matrix ... For normalized time-series data, the precision matrix is equivalent to the partial correlation between each pairwise time series, conditioned on all other time series, and is within [-1, 1].'' GitBook basic-statistics.md:101-122 has the same text. Neither source documents the ''-sq'' (squared) variants generated by pyspi/config.yaml.'
  delegate_lib: scikit-learn==1.9.1 sklearn.covariance.OAS().fit(X).precision_ (scipy==1.17.1 scipy.linalg.pinvh); numpy==2.5.4
  implemented_as: Same cached sklearn.covariance.OAS() fit as cov_OAS; returns precision_ = scipy.linalg.pinvh(covariance_) computed at fit time (Moore-Penrose pseudo-inverse via eigh with relative cutoff max(P,P)*eps*max|eig|), diagonal NaN. Off-diagonals are raw inverse-covariance entries, not normalised; on the default pipeline Theta = T/(T-1) * [(1-s)R + sI]^{-1} with R the Pearson correlation matrix. Not symmetrised (Estimators.multivariate bypasses Undirected.multivariate). Squared variant (prec-sq_*) = np.square of the same matrix.
  implementation_trace:
  - pyspi/data.py:59-71 Data.__init__ default normalise=True, detrend=False
  - pyspi/data.py:184-195 optional scipy.signal.detrend then zscore(data, axis=1, nan_policy='omit', ddof=1)
  - pyspi/calculator.py:327-339 (HEAD a1f20c7) Calculator.compute try block; :329 calls self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan); :335 stores S in the table; :336-339 any exception -> the whole SPI entry set to NaN and the error recorded, warning issued at :354-355
  - 'pyspi/base.py:51-66 parse_multivariate (inplace=True: the cache written onto the Data object persists across SPIs)'
  - pyspi/statistics/basic.py:9 class Estimators(Undirected, Signed); its multivariate overrides Undirected.multivariate (pyspi/base.py:132-138), so no triangle mirroring
  - 'pyspi/statistics/basic.py:18-29 Estimators.__init__: identifier suffix ''_<estimator>'' or ''-sq_<estimator>''; squared sets labels+[''unsigned''] and issigned()->False'
  - 'pyspi/statistics/basic.py:31-44 _from_cache: z = data.to_numpy(squeeze=True).T (observations x processes); getattr(sklearn.covariance, estimator)().fit(z) with ALL sklearn defaults; fitted object cached in data.covariance[estimator] and shared by cov_* and prec_* of that estimator'
  - 'pyspi/statistics/basic.py:46-54 multivariate: matrix = getattr(mycov, ''precision_'') (line 49); np.fill_diagonal(matrix, np.nan) IN PLACE on the cached sklearn attribute (line 50); returns np.square(matrix) if squared (line 52) else the cached array object itself (line 54)'
  - pyspi/statistics/basic.py:66-72 Precision(kind='precision'), identifier 'prec'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:794-822 OAS.fit: location_ = X.mean(0) (line 816); _oas(X - location_, assume_centered=True) (line 818); shrinkage_ (line 819); _set_covariance (line 820)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_shrunk_covariance.py:46-94 _oas: emp_cov divisor T (line 63); alpha = mean(S**2), mu = trace(S)/p (lines 77-78); num = alpha + mu^2, den = (n+1)(alpha - mu^2/p) (lines 83-84); shrinkage = min(num/den, 1) (line 85); comment lines 70-71: ''The factor 2 / p is omitted since it does not impact the value of the estimator for large p''; (1-s)S + s*mu*I (lines 91-92)'
  - '.venv/lib/python3.12/site-packages/sklearn/covariance/_empirical_covariance.py:196-215 _set_covariance: covariance_ = covariance (line 210); store_precision=True default (line 192) -> precision_ = scipy.linalg.pinvh(covariance, check_finite=False) (line 213)'
  - '.venv/lib/python3.12/site-packages/scipy/linalg/_basic.py:1938-2028 pinvh: eigh (line 2007); cutoff val = atol(0) + max|s| * max(shape)*eps (lines 2011-2017); eigenvalues |s| <= val dropped (line 2018); B = (u * 1/s) @ u.conj().T (line 2023): Moore-Penrose pseudo-inverse, silently rank-reducing'
  deviation_from_documented: 'Docs say precision is the matrix inverse and, for normalised data, ''equivalent to the partial correlation ... within [-1, 1]''. Implemented value is the unnormalised inverse entry Theta_ij: sign opposite to the partial correlation and magnitude unbounded (probe bivariate_gaussian T=1024 pair (2,3): prec = -2.057 vs partial correlation +0.786). Inverse is of the shrunk estimate, so even after normalisation it would be a shrunk partial correlation. The ''-sq'' squared variants are undocumented.'
  deviation_from_canonical: 'inverse of the sklearn-variant OAS estimate, which omits the 2/p terms of Chen et al. 2010 Eq. 23 (see cov unit; shrinkage +14.5% relative at p=4 T=64, +9.2% at p=5 T=64 on sparse_precision in the Workflow 4b probe scratchpad wf4b_mid-eeg/oas_prec.py, 0.21778 vs 0.19936; the check-stage shrink runs give +9.6% to +10.3% at P=5 over T 64-4096, notes/cov_prec_simple.md, Checks); otherwise the canonical inverse. sklearn documents the omission (_shrunk_covariance.py:754-758) and scikit-learn 0.24.1, the version named in the supplement, uses the same formula (0.24.1 _shrunk_covariance.py:487-492), so this is a documented upstream approximation rather than a version change.'
  units_and_range: 'dimensionless on the pipeline path (inverse input-units-squared on kernel path); signed; unbounded (76-file probe sweep, prec_OAS: max |off-diagonal| 49.1 on cointegrated T=1024, 341.9 over all dataset files, at trending_T4096); sign opposite to the partial correlation; symmetric only up to last-bit roundoff (max |A-A^T| 5.7e-14 over the 76 files, nonzero in 47 of 76); NaN diagonal; prec-sq >= 0 unbounded. Exact 0.0 off-diagonals when shrinkage clips to 1 (iid_gaussian).'
  direction_convention: 'undirected: A[i,j] is the (i,j) entry of the fitted sklearn precision_ for processes i and j (rows of the Data array); no ordering, symmetric up to last-bit pinvh roundoff (REVIEW M2); to be confirmed empirically in the check stage'
  symmetry_expected: sym
  already_documented: REVIEW M1 (Undirected mirror bypassed); REVIEW M2 (precision last-bit reciprocal asymmetry from pinvh)
  new_finding_candidates:
  - 'Candidate: multivariate() mutates the cached sklearn estimator in place and returns an alias of it. pyspi/statistics/basic.py:49-50 ''matrix = getattr(mycov, self._kind + "_")'' then ''np.fill_diagonal(matrix, np.nan)''; probe: after Covariance(...).multivariate(dat), dat.covariance[''OAS''].covariance_ diagonal is [nan nan nan nan] and ''returned is cache: True''. No current output changes (precision_ is computed at fit time, before the mutation, and nothing else reads data.covariance), but any later consumer of the cached fit (get_precision, score, mahalanobis) or of the returned array would see the NaN diagonal or alias the cache.'
  - 'Candidate (documentation, material): prec_* is not partial correlation and not bounded by [-1,1]. Probe bivariate_gaussian T=1024 pair (2,3): prec_OAS = -2.0573, partial correlation from the same matrix = +0.7856; cointegrated T=1024 max |prec| = 49.1.'
  - 'Candidate (documentation): the ''cov-sq_*''/''prec-sq_*'' variants (pyspi/config.yaml:21-36, 56-71) are not described in supplement §1.1.1-1.1.2 or GitBook; probe confirms they are exactly np.square of the unsquared matrix (np.array_equal True).'
  - 'Candidate: OAS shrinkage deviates from Chen et al. 2010 Eq. 23 (2/p terms dropped in sklearn _shrunk_covariance.py:83-85, comment lines 70-71). Probe: sklearn 0.183882 vs Eq.23 0.160575 (bivariate_gaussian p=4 T=64); 0.217775 vs 0.199355 (sparse_precision p=5 T=64). Relative difference +14.5% (p=4) and +9.2% (p=5) of the shrinkage. sklearn documents the omission in the OAS class docstring (_shrunk_covariance.py:754-758: it ''differs from Eq. 23'', 2/p is dropped because it is small ''for a large p''), and scikit-learn 0.24.1 (version named in supplement §1.1.1) used the same num/den (0.24.1 _shrunk_covariance.py:487-492, ''formula from Chen et al.''s **implementation**''). So this is a documented upstream approximation, unchanged since the documented version; the candidate is only that the large-p justification does not hold at small p.'
  - 'Candidate (behaviour note): on independent channels the OAS shrinkage clips to exactly 1, so every off-diagonal of cov_OAS/prec_OAS is exactly 0.0 (probe: iid_gaussian T=64,256,1024,4096: s=1, max|off-diag|=0); also nonlinear_dependence T=1024 prec max 0.000. Canonical behaviour, but downstream users get ties at 0 on null data.'
  - 'Scaling note (not a deviation from the documented definition, which says ''For normalized time-series data''; supplement §1.1.2, p.4): on the default z-scored pipeline prec is the inverse of the (shrunk) correlation matrix, scaled by T/(T-1), not the inverse of the raw-units covariance. Probe sparse_precision T=4096 (prec_EmpiricalCovariance): kernel path (normalise=False) prec[0,1] = -0.393 (dataset precision_true -0.4) vs pipeline prec[0,1] = -0.539; D Theta_kernel D [0,1] = -0.5392 with D = diag(sqrt(S_ii)), i.e. the pipeline value is T/(T-1) times the kernel precision rescaled by the channel standard deviations. Relevant to anyone comparing pipeline prec values with a known raw-units precision matrix.'
