optimisation:
  complexity_P_T: 'O(P^2 T) for the empirical covariance + O(P^3) for scipy.linalg.pinvh (a full eigh) that sklearn _empirical_covariance.py:_set_covariance runs for precision_ on every fit; one fit per
    Data and estimator (pyspi/statistics/basic.py:Estimators._from_cache). Measured fresh P_exponent 0.17, T_exponent 0.10: between 8 and 32 channels and 256 and 1024 samples the ~0.7 ms of fixed sklearn
    validation dominates, so neither exponent reflects the algorithm. At 118x1024 the P^3 term dominates: in the 118x1024 EmpiricalCovariance profile eigh is 58.7% and np.cov 15.4% of the call; the same
    pinvh on a 118x118 matrix runs for every estimator of this family.'
  hotspot_1: scipy/linalg/_basic.py:pinvh (third-party:scipy) 13.6% cumulative of the profiled SPI call at 8x1024, of which scipy/linalg/_decomp.py:eigh 6.0%; at 118x1024 eigh is 58.7% (pinvh 63.0%) of
    the EmpiricalCovariance call (audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats, index prof_basic__index.json), the same 118x118 pinvh this estimator runs
  hotspot_2: sklearn/utils/validation.py:check_array (third-party:sklearn) 34.7% at 8x1024 (fixed input validation; 10.6% at 118x1024 in the EmpiricalCovariance profile); sklearn/covariance/_shrunk_covariance.py:_oas
    14.4% at 8x1024
  hotspot_owner: third-party:scipy
  opaque_share: 0.2
  profile_file: audit/profiles/basic.prec.OAS__8x1024.pstats; audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats
  opportunities:
  - opportunity_id: cov_prec_simple-1
    opportunity: Compute precision_ with a Cholesky factorisation (scipy.linalg.cho_factor + cho_solve, or LAPACK potri) instead of scipy.linalg.pinvh, which sklearn's _empirical_covariance.py:_set_covariance
      runs as a full eigh for every fit; in pyspi this means fitting with store_precision=False in basic.py:Estimators._from_cache and inverting there at fit time (before any identifier's in-place np.fill_diagonal
      at basic.py:49-50), with a pinvh fallback when the factorisation fails.
    opp_type: algorithmic
    expected_speedup: 1-2x
    speedup_basis: 'profile:audit/profiles/micro/prof_basic.cov.EmpiricalCovariance__118x1024.pstats scipy/linalg/_decomp.py:eigh 58.7% (pinvh 63.0%) of the EmpiricalCovariance call, the same 118x118 pinvh
      + complexity: Cholesky inverse ~P^3 vs eigh ~9P^3 flops; scratch timing at 118x118 pinvh 2.17 ms vs Cholesky inverse 0.21 ms; this unit''s measured fresh 118x1024 wall is 3.64 ms (summary.json), so
      the 2.17 ms pinvh is ~60% of it and the Amdahl bound is 1/(1-0.60) = 2.5x.
      The lower bound is 1x, the EEG-order figure the ranking uses (README ''Optimisation columns'', rules 1 and 4). Covariance runs before Precision in an EEG run
      (pyspi/workflow/retained185.yaml:7-35, :36-67) and this unit reads the OAS fit cached by basic.cov.OAS (pyspi/statistics/basic.py:31-44), so the pinvh this avenue makes cheaper is paid, and
      credited, on basic.cov.OAS. This unit''s family-warm basis (0.17 ms per window at 118x1024, summary.json) is that cache read, with no pinvh in it. The upper end above holds only in a run where
      this unit fits the estimator itself (fresh 3.64 ms)'
    output_risk: unverified-within-tolerance
    risk_evidence: different factorisation of the same full-rank matrix (rounding differs at ~1e-15 relative); on a rank-deficient covariance pinvh returns a pseudo-inverse with an eigenvalue cut-off while
      Cholesky fails, so the fallback must keep pinvh there (semantic otherwise)
    effort: M
    depends_on: []
