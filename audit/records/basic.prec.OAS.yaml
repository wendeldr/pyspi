  check_reference: audit/checks/refs/cov_prec_simple.py:ref_matrix/handle (numpy/scipy only, no sklearn) with _kernels_basic_misc.oas(paper=False) and oas(paper=True) followed by np.linalg.inv (LU; the pinvh mirror _kernels_basic_misc.precision is reported as an extra key); Monte Carlo of the dataset population models (refs/cov_prec_simple.py:mc_stats, N=1000); probes/cov_prec_simple_probes.py:{spi, shrinkage, mutation, mutation_others} for the P=19 stacks, average-referenced input, fitted shrinkage_ and the cache-mutation flags
  check_data: bivariate_gaussian; scaled_offset; trending; sparse_precision; cointegrated; iid_gaussian; shared_envelope; delayed_noise; var2_bivariate; var2_chain; logistic_maps_chaotic; anm; P=19 stackA (iid_gaussian+bivariate_gaussian+sparse_precision+gauss_ar1_pair+var2_chain); P=19 stackB (delayed_noise+narrowband_f0-0.1+narrowband_f0-0.25+var2_bivariate+bivariate_gaussian+var2_chain); average-referenced bivariate_gaussian and stackB (rank P-1). T in {64, 256, 1024, 4096}; paths kernel, pipeline, pipeline-detrend
  agreement_criterion: 'tolerance rtol 1e-10 with atol 1e-12*max|Theta| (norm-wise accuracy of a computed inverse) against np.linalg.inv of the independent estimator; pseudo-inverse runs (singular, avgref) against numpy SVD pinv / eigh pseudo-inverse with the same tolerance; statistical: |pyspi - E_MC| <= 2 se_fw, se_fw = Monte Carlo sd x familywise factor (1.32 for P=4, 1.40 for P=5) so the rule is a two-sided familywise 5% test over the P(P-1)/2 pairs; qualitative: symmetry (<= 1e-12 max|A|, REVIEW M2) with value agreement, and order independence under the cache mutation; documented-claim runs (doc-*, eq23) are tolerance 1e-10 comparisons that are expected to fail and record the size of the gap'
  closeness: '50/61 runs pass in checks/out/results/cov_prec_simple.json. Independent reference: 36/36 value runs pass (kernel, pipeline, pipeline-detrend, squared, symmetry, singular, average-referenced, P=19 stacks), max abs 3.2e-12, max rel 3.4e-11. Partial correlation (documented quantity): pyspi has the opposite sign on every pair with |pcorr| > 1e-3 (frac_opposite_sign = 1.0 on bivariate_gaussian, sparse_precision and cointegrated), bivariate_gaussian T=1024 pair (2,3) prec = -2.057 vs partial correlation 0.7856, pair (0,1) -0.3012 vs 0.2775; max |prec| = 49.12 on cointegrated (partial correlation max 0.977); -prec_ij/sqrt(Theta_ii Theta_jj) reproduces the partial correlation to 4.7e-15. prec-sq is bitwise np.square of the plain output (bitwise_equal_square_of_plain = 1). Duplicated channel (shared_envelope): the shrunk estimate is full rank and pyspi equals its LU inverse (max rel 2.98e-14); pair (0,2) = -17.69 (T=256) / -68.19 (T=1024). Statistical vs the population model (N=1000 Monte Carlo through the same estimator): 13/13 pass; sparse_precision kernel T=256/1024/4096 max |pyspi - limit| 0.162/0.0544/0.018 against the unshrunk precision_true (the gap includes the shrinkage), max_z <= 1.51. Null iid_gaussian pipeline: every off-diagonal exactly 0.0 at T=64-4096 (shrinkage clipped to 1). Inverse of the Chen et al. Eq. 23 estimate: off-diagonal relative difference median/max 0.0512/0.127 (P=4, T=64), 0.0044/0.0166 (P=4, T=1024), 0.0021/0.205 (P=19 stackB, T=1024 pipeline; the max is at a near-zero entry). The largest elementwise relative difference of the precision comparisons sits at a near-zero entry and is inside atol = 1e-12 max|Theta|; rtol was 1e-10 on every run. Symmetry: max|A - A.T| = 7.11e-15 over 60 matrix runs (54 with a nonzero last-bit difference; largest at basic.prec.OAS|bivariate_gaussian|1024|pipeline|avgref).'
