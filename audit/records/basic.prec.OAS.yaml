  what_changed: Inverse of sklearn's no-2/p OAS estimate (Chen et al. Eq. 23 variant; off-diagonal precision differs from the Eq. 23 inverse by median 5.1% / max 12.7% at p=4 T=64 and 0.44% / 1.7% at T=1024), and the value is the unnormalised precision entry, opposite in sign to the documented partial correlation and unbounded (max 49.1 on cointegrated). Deviates from both the supplement and the canonical estimator in interpretable ways (6 anchor). At EEG-sized P the 2/p part is small; the shrinkage excess over Eq. 23 is bounded by 1/(p-1) (5.6% at p=19, 0.9% at p=118; +0.61-0.71% observed on the P=19 stacks, off-diagonal median 0.21% at T=1024), so in EEG use the score rests mainly on the gap to the documented partial correlation (sign and range). -sq is an undocumented elementwise square.
