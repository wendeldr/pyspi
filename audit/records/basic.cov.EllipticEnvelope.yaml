    reference: R robustbase::covMcd (robustbase 0.99.2, external package) on the same z-scored matrix, alpha chosen so h.alpha.n equals sklearn h, use.correction=FALSE, initHsets = sklearn raw support (1-based)
      to remove search randomness; rescale robustbase cov by (n_w-1)/n_w to the MLE divisor
    reference_kind: external-pkg
    criterion: tolerance
    expected_outcome: 'agreement to <= 1e-8 relative after the divisor rescale; any residual difference is attributable to robustbase consistency-factor choices and is reported, not tuned away. Second run
      with robustbase default nsamp (own random search): statistical agreement, |diff| within the 20-seed sklearn spread'
  - datasets:
    - iid_gaussian
    - sparse_precision
    - delayed_noise
    - contaminated
    path: kernel
    reference: 'sklearn MinCovDet vs EllipticEnvelope under identical np.random.seed (same-lineage: both are sklearn; tests the redundancy claim, not correctness)'
    reference_kind: same-lineage
    criterion: exact
    expected_outcome: covariance_ of EllipticEnvelope and MinCovDet bit-identical at all T (probe already showed 16/16); in a seeded single Calculator pass the two identifiers differ only through RNG position
  - datasets:
    - iid_gaussian
    - sparse_precision
    - delayed_noise
    path: pipeline
    reference: 'reproducibility study: 20 fresh-process Calculator runs (config with the 8 robust SPIs) and 20 np.random.seed values for MinCovDet().fit; numpy only for the summary'
    reference_kind: independent-impl
    criterion: statistical
    expected_outcome: report per-T max spread of each off-diagonal entry; expected (probe) ~0.1-0.35 at T=64 shrinking to <0.01 at T=4096; any run-to-run difference in an unseeded pass confirms non-determinism
  - datasets:
    - contaminated
    - bivariate_gaussian
    path: pipeline
    reference: 'analytic: contaminated truth clean_cov_true (rho = 0.8 core) and bivariate_gaussian cov_true; robust correlation r = C_ij/sqrt(C_ii C_jj) built from the pyspi fit diagonal (diag recovered
      from a reseeded fit since pyspi NaNs it), compared with the true rho; also np.corrcoef on contaminated as the non-robust contrast'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: robust correlation within 3 SE of 0.8 at T >= 1024 while np.corrcoef is far off (outliers at (6,-6)); the raw pyspi output cov_*[0,1] ~ 0.15 (not 0.8) on contaminated, demonstrating
      the documented "covariance = correlation in [-1,1]" claim does not hold for this estimator
  - datasets:
    - cointegrated
    - trending
    - iid_gaussian
    path: pipeline
    reference: 'range scan: numpy max/min of off-diagonal outputs over 20 seeds and all T'
    reference_kind: independent-impl
