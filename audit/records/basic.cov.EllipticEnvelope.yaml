    reference: 'direction/symmetry convention: numpy comparison of A with A.T and of A[i,j] with the (i,j) entry of a reseeded sklearn-free reference from check 1'
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: 'undirected: A[i,j] = A[j,i] (exact for cov, round-off for prec), and A[i,j] is the (i,j) entry of the matrix fitted on columns ordered as processes; no lag or direction'
  - datasets:
