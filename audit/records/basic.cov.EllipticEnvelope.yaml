    reference_kind: analytic
    criterion: statistical
    expected_outcome: with detrend=True the robust estimate tracks cov_true_detrended (scaled to z-units); without detrend the trend dominates (probe |cov| up to 1.008 at T=256)
  check_method: external-pkg
  check_reference: r/cov_prec_robust.R (robustbase==0.99.2 covMcd(nsamp='deterministic', initHsets = sklearn raw_support_); rrcov==1.7.5 CovMcd own FAST-MCD search, 20 R seeds; system R 4.6.1); refs/cov_prec_robust.py
    (h_rdet, h_rrcov, h_state/h_base from-scratch Croux-Haesbroeck correction + reweighting, h_stat/h_rcorr/h_dir analytic targets with Monte-Carlo SE of a from-scratch reweighted FAST-MCD, h_opt 2000-start
    C-step search); probes/cov_prec_robust_mcd.py (fit_state, seeds, determinism, fresh_process, robust_corr, aliasing)
  check_data: iid_gaussian, sparse_precision, delayed_noise, contaminated (kernel, T=64/1024), contaminated and bivariate_gaussian (pipeline, T=256/1024/4096), sparse_precision|64, cointegrated|256
  agreement_criterion: 'state/base: rtol 1e-9 on the whole fitted state given sklearn''s raw estimates (same-lineage); rdet: rtol 1e-9, atol 1e-12 after mapping robustbase''s divisor n_w-1 to sklearn''s
    n_w (external-pkg); rrcov: atol = sklearn 20-seed range + rrcov 20-seed range (two randomised searches for the same h-subset optimum can differ by at most their own run-to-run variability), rtol 0; wide by construction, so a pass is weak evidence and not value-level agreement (ref_within_sklearn_range_only records the stricter elementwise bound of the sklearn 20-seed range alone);
    stat/rcorr: |pyspi - analytic target| <= 2 se with se = Monte-Carlo SD x Bonferroni factor over the P(P-1)/2 distinct entries; statc: same against the MLE estimate of the same draw; opt: sklearn raw
    log det <= best found + 1e-8; eeqmcd/sq: exact; perm: rtol 1e-9; dir: sign agreement where |corr| or |partial corr| >= 0.2; qualitative runs: pass = the stated proposition holds'
  closeness: 'eeqmcd 8/8 bitwise equal to cov_MinCovDet under the same seed (iid_gaussian, sparse_precision, delayed_noise, contaminated; T=64 and 1024; same-lineage). state 8/8, max_abs 2.27e-13, max_rel
    4.65e-14. rdet (robustbase covMcd from sklearn''s raw support): 5/6, max_abs 6.66e-16, max_rel 3.51e-15; fail bivariate_gaussian|256 by the same single raw-divisor-band point as cov_MinCovDet (max_abs
