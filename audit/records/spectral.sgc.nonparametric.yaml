  deviation_from_documented: '(1) Direction: documented matrix convention is rows = sources, columns = targets (glossary-of-terms.md:27);
    implemented A[i, j] = GC from j to i (target-by-source). Probe var2_bivariate (true 0 -> 1 only): T=4096 A[0,1]=0.1231,
    A[1,0]=0.4024; delayed_noise T=1024 (x0 leads): column 0 of rows 1-3 = 2.57, 2.56, 2.75 while row 0 = 0.11-0.13. (2) Frequency
    grid: documented "125 uniformly sampled bins across f in [f0, fs/2], f0 = 4/T"; implemented T/2 - 1 bins k/T, k = 1..T/2-1
    for the full band (31 at T=64, 127 at T=256, 2047 at T=4096; probe), DC excluded by the fmin override, Nyquist excluded
    by the library slice (the Nyquist drop is already documented: DEPENDENCY_COMPATIBILITY_REVIEW.md, REVIEW M4). (3) Identifiers
    with "fmin-0" run with fmin = 1e-5 (spectral.py:343-345), so the documented band [0, fs/2] actually excludes the DC bin.
    (4) "values <= 0 -> NaN" and the >50%-NaN cell rule are undocumented; NaN bins are silently dropped from the mean/max
    (nanmean/nanmax). (5) Not documented: when the Cholesky initialisation fails (e.g. two identical channels) the run raises
    AttributeError and the whole matrix is NaN in the Calculator (probe shared_envelope T=256, x2 == x0).'
  deviation_from_canonical: 'Formula per frequency matches Geweke 1982 / Dhamala 2008 (rotated noise variance, |H_xy|^2),
    and the kernel reproduces Sigma to 1e-6 on an exact VAR spectrum (probe: Wilson on the exact two-sided var2 spectrum,
    reconstruction rel. error 3e-9, Sigma_hat = Sigma). Value-changing estimator choices: spectral estimate from a single
    window with only 5 tapers (fixed NW=3) whatever T, so the per-frequency estimate has ~10 degrees of freedom and its positive
    bias does not shrink with T (probe iid_gaussian null: full-band mean 0.146/0.106 at T=256, 0.127/0.121 at T=4096; with
    NW=10 (19 tapers) 0.025, NW=40 (78 tapers) 0.0044 at T=4096); no zero padding (n_fft = T), and the Wilson factor of the
    rough single-window estimate does not reproduce S (probe: max |psi psi^H - S|/max|S| 3e-3 to 0.38 across datasets, with
    NaN bins and "Maximum iterations reached" on logistic_maps T>=1024 and trending T=256/1024), while S_kk in the formula
    is the raw multitaper auto-spectrum, so S and the factor disagree. Pairwise bivariate, not conditional (canonical for
    a bivariate definition). Band mean/max is a pyspi construction (no canonical summary); the mean over (0, 1/2) excluding
    DC and Nyquist approximates, but is not, the time-domain F.'
  units_and_range: nats (natural log), per-frequency >= 0 in theory; output >= 0 or NaN (non-positive bins are NaN, then dropped);
    unbounded above; finite-sample null level about 0.1-0.15 nats with the default 5 tapers. Directed, asymmetric. Diagonal
    NaN.
  direction_convention: 'A[i, j] = spectral GC from process j (source, column) to process i (target, row), i.e. TARGET-by-SOURCE,
    the transpose of the documented sources-in-rows convention (GitBook glossary-of-terms.md:27) and of other pyspi directed
    SPIs (e.g. infotheory.py:274 src, targ = data[[i, j]]). Derivation: predictive_power[k, l] = ln(S_kk/(S_kk - rotated[k,l]|H_kl|^2))
    is Geweke f_{l->k} (connectivity.py:1173-1211), and pyspi takes cache[0, f, i, j] without transposing (spectral.py:423).
    Empirical: var2_bivariate (0 drives 1) A[1,0] > A[0,1] at all T (0.41/0.10 at T=256, 0.40/0.12 at T=4096); gauss_ar1_pair
    (A_true[0,1]=0.3 > A_true[1,0]=0.2, i.e. 1->0 stronger) A[0,1]=0.24-0.28 > A[1,0]=0.14-0.17.'
  symmetry_expected: asym
  already_documented: tests/README.md dependency constraints (spectral-connectivity pinned at 1.1.2; 2.x changes input layout
