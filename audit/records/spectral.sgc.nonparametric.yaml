    stays at 0.10-0.13 for T=256..4096 and the causal direction at 0.40-0.44 versus an analytic full-band mean of 0.289.'
  - 'CANDIDATE (error path): minimum_phase_decomposition.py:48 "except xp.linalg.linalg.LinAlgError" raises AttributeError
    under numpy 2.5.4 whenever the Cholesky initialisation fails; the AttributeError is neither the LinAlgError caught per
    pair (spectral_connectivity/connectivity.py:742) nor the ValueError caught by pyspi (spectral.py:438; that handler itself raises TypeError at
    :439 under the message-regex warnings filters numpy installs on import, see trace), so the Calculator NaNs every sgc_nonparametric identifier. Probe: shared_envelope
    T=256 (x2 bit-identical to x0) -> "RAISES AttributeError: module numpy.linalg has no attribute linalg". Under numpy < 2.4
    as checked (2.2.6 and 2.3.3 resolve xp.linalg.linalg.LinAlgError with a DeprecationWarning; 2.4.6 and 2.5.4 raise AttributeError)
    the fallback would use a random start (np.random, unseeded).'
  - 'CANDIDATE (factorisation accuracy): on single-window estimates the Wilson factor does not reproduce the CSM (probe relative
    reconstruction error 2.8e-3 iid T=4096 up to 0.38 logistic_maps T=4096, 0.323 logistic_maps T=1024; "Maximum iterations
    reached. 0 of 1 converged" logged for logistic_maps T=1024/4096 and trending T=256/1024) and NaN bins appear among the
    kept full-band bins (probe sgc_fix/r2.py: logistic_maps T=1024 cell [0,1] (GC 1 -> 0) 9.0%, cell [1,0] (GC 0 -> 1) 40.9%,
    25% averaged over the two directions; trending T=256 6.4% averaged over the 12 off-diagonal cells, largest cell [1,3]
    (GC 3 -> 1) 66.9%, above the 50% rule, so that cell is NaN in the pyspi output), whereas on an exact smooth spectrum the
    same routine reconstructs S to 3e-9. Hypothesis: lack of spectral smoothing/zero padding, not a bug in the iteration.'
  - 'CANDIDATE (bin/label conventions, low impact): "fmin-0" identifiers run with fmin=1e-5 (probe _fmin 1e-05), DC never
    included; both half-bands include the f = 0.25 bin; documented 125-bin grid with f0 = 4/T is not what any path uses. The
    even-n Nyquist drop by the 1.1.2 non-negative slice is not part of this candidate: it is already documented (DEPENDENCY_COMPATIBILITY_REVIEW.md
    Nyquist handling; REVIEW M4).'
  - 'CANDIDATE (NaN handling): NaN bins (predictive <= 0 or log of negative intrinsic power) are dropped by nanmean/nanmax,
    so a cell with up to 50% failed bins is a summary over the remaining bins only (spectral.py:423-435); the hypothesis that
    non-positive values are set to NaN is confirmed at connectivity.py:1179, but non-positive values cannot arise from an
    exact factor (rotated variance >= 0 by Cauchy-Schwarz), so NaNs mark factorisation failure rather than "no causality".'
