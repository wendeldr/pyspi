unit_id: spectral.sgc.nonparametric
status: profiled
correctness:
  metric_name_standard: nonparametric (Wilson-factorisation) spectral Granger causality, Geweke frequency-domain causality
    f_{j->i}(f), pairwise bivariate, summarised by mean or max over a frequency band
  canonical_ref: 'Geweke J. 1982, J. Am. Stat. Assoc. 77(378):304-313 (frequency-domain decomposition of linear feedback;
    the f_{y->x}(lambda) formula, and (1/2pi) integral of f_{y->x} = F_{y->x} under his regularity condition); nonparametric
    estimation: Dhamala, Rangarajan & Ding 2008, Phys. Rev. Lett. 100:018701 and NeuroImage 41:354-362 (spectral matrix from
    Fourier/multitaper transforms, factorised by Wilson 1972, SIAM J. Appl. Math. 23:420-426). Equation numbers not re-checked
    against the papers (from memory; formula also in Ding, Chen & Bressler 2006, Handbook of Time Series Analysis, ch. 17).'
  canonical_definition: S(f) = psi(f) psi(f)^H (minimum-phase Wilson factor), Sigma = psi_0 psi_0^T, H(f) = psi(f) psi_0^{-1};
    f_{y->x}(f) = ln( S_xx(f) / [ S_xx(f) - (Sigma_yy - Sigma_xy^2/Sigma_xx) |H_xy(f)|^2 ] ) >= 0, with S estimated consistently
    (spectral smoothing / tapers or trials growing with the data). Band summary (mean/max over a band) is a pyspi construction;
    the mean over the full band [-1/2, 1/2] approximates the time-domain Geweke F_{y->x}.
  documented_definition: 'supplement §1.5.12, p.17 (supplement.txt lines 809-818: heading 809, quoted text 811-818): "Spectral
    Granger causality [40] is the frequency domain equivalent to Granger causality, computed via the spectral transfer matrix
    and noise covariance that are estimated using either a parametric (VAR model) approach [41] or nonparametric (spectral
    factorization) approach [57, 58]. We implement the nonparametric form from the Spectral Connectivity Toolbox [56] and
    the parametric implementation from v0.9 of NiTime [74]. The VAR model is estimated via least squares using the same order
    for both processes, where the order is either inferred (denoted by modifier order-None) or fixed. We infer a VAR model
    order from the Bayesian information criterion (with a maximum lag of 50, implemented in the NiTime toolkit), as well as
    choosing fixed orders of one (denoted by order-1) and 20 (order-20)." Keywords: "directed, linear, unsigned, bivariate,
    frequency-dependent". Band rule, supplement §1.5, p.12 (supplement.txt heading line 570, quoted text lines 589-599): "We
    use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T ... fmin-0_fmax-0-5: the
    full-frequency range, f in [0, fs/2]; fmin-0_fmax-0-25: f in [0, fs/4]; fmin-0-25_fmax-0-5: f in [fs/4, fs/2]"; summary
    = mean or max over the band. Same text on GitBook spectral.md:350-358 (Spectral Granger Causality). Matrix convention
    for directed SPIs, GitBook glossary-of-terms.md:27: "entry calc.table[...][0,1] will be the directed information from
    process 0 to process 1. The rows in this table reflect the sources while the columns reflect the targets." Refs: [40]
    Granger 1969 Econometrica 37:424; [41] Geweke 1982 JASA 77:304; [56] spectral_connectivity (Denovellis et al.); [57,58]
    Dhamala, Rangarajan & Ding 2008 NeuroImage 41:354 and PRL 100:018701; [74] Rokem et al. NiTime.'
  delegate_lib: spectral_connectivity==1.1.2 Connectivity.pairwise_spectral_granger_prediction (with Multitaper defaults and
    minimum_phase_decomposition), numpy==2.5.4, scipy==1.17.1 (scipy.fftpack fft/fftfreq/next_fast_len); band selection and
    summary native pyspi
  implemented_as: 'Input z-scored per channel (ddof=1; optional detrend). Whole (T x P) array transformed once by a single-window
    multitaper DFT: NW=3, 5 DPSS tapers, constant detrend, n_fft = next_fast_len(T) = T (no zero padding), fs=1; cross-spectral
    matrix = mean over the 5 tapers (one trial). For each unordered pair the 2x2 two-sided CSM is Wilson-factorised (tol 1e-8,
    <= 60 iterations, warning only), Sigma and H derived from the factor, and predictive_power[k,l] = ln S_kk - ln(S_kk -
    (Sigma_ll - Sigma_kl^2/Sigma_kk)|H_kl|^2) = Geweke causality FROM l TO k, with S_kk the multitaper auto-spectrum; values
    <= 0 and logs of negative intrinsic power become NaN. Frequencies k/T for k = 0..T/2-1 (Nyquist dropped). pyspi forces
    fmin <= 0 to 1e-5 (excludes DC), keeps fmin <= f <= fmax (both inclusive; 0.25 bin in both half-bands), takes np.nanmean
    or np.nanmax over the kept bins per cell, NaNs cells with > 50% NaN bins, and returns A[a, b] = summary of predictive_power[a,
    b] = GC from b to a. Pairwise bivariate (no conditioning on third processes).'
