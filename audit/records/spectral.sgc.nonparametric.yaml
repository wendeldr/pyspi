optimisation:
  complexity_P_T: 'One multivariate Multitaper + two-sided expectation CSM O(K*n_fft*P^2), then a Python loop over P(P-1)/2 unordered pairs (spectral_connectivity/connectivity.py:722-743) with one Wilson factorisation of the 2x2 x n_fft block each: O(P^2 * iter * n_fft log n_fft). Measured T exponent 0.79; never run above 8x1024. summary.json projects it by unordered pair count from the 8x1024 wall (0.594 s for 28 pairs -> 146.4 s per window at 118 channels, extrapolated-pairs-from-8; the class is multivariate, so profile_units.py PAIR_LOOP_BASIS supplies the pair count of the delegate''s pair loop). The extra 32x1024 profile (496 pairs, 11.2 s profiled) keeps the same shares, so the pair loop dominates at every P.'
  hotspot_1: .venv/lib/python3.12/site-packages/spectral_connectivity/minimum_phase_decomposition.py:minimum_phase_decomposition (third-party:spectral_connectivity) 95.9% of the profiled SPI call at 8x1024 (97.6% at 32x1024, audit/profiles/micro/prof_spectral.sgc.nonparametric__32x1024.pstats)
  hotspot_2: numpy/linalg/_linalg.py:solve on 2x2 stacks 65.5% at 8x1024 (65.5% at 32x1024); minimum_phase_decomposition self 14.7%
  hotspot_owner: third-party:spectral_connectivity
  opaque_share: 0.083
  profile_file: audit/profiles/spectral.sgc.nonparametric__8x1024.pstats
  opportunities:
  - opportunity_id: spectral_directed-2
    opportunity: Run one batched Wilson factorisation over all pairs with the pairs on the leading axis (the library checks convergence per leading index, minimum_phase_decomposition.py:102-125, 161-222) and replace np.linalg.solve on stacks of 2x2 matrices (_get_linear_predictor, :128-158) by the closed-form 2x2 inverse, removing the per-pair Python loop (pyspi/base.py:85-94 for the directed units, spectral_connectivity/connectivity.py:722-743 for sgc).
    opp_type: vectorise-batch
    expected_speedup: 3-10x
    speedup_basis: 'profile:audit/profiles/spectral.sgc.nonparametric__8x1024.pstats minimum_phase_decomposition 95.9% (solve 65.5%) + complexity: batched closed-form 2x2 Wilson over all unordered pairs replaces the library pair loop. Ranking basis: the pairs-only projection of the 8x1024 wall in summary.json (146.4 s per window fresh, 147.0 s family-warm; t_fixed assumed 0, so the Multitaper + CSM part, under 5% of the 8x1024 profile, is scaled by pair count as well).'
    output_risk: unverified-within-tolerance
    risk_evidence: 'closed-form 2x2 inverse rounds differently and the 1e-8 stop rule can shift by an iteration; a batch must also keep two failure paths: (a) per pair, the library pair loop catches np.linalg.LinAlgError (e.g. a singular solve) and writes NaN for that pair (spectral_connectivity/connectivity.py:724-743; a closed-form inverse does not raise, so singular pairs must be detected and set to NaN explicitly); (b) whole SPI, a failed Cholesky initial condition: the handler at minimum_phase_decomposition.py:48 names xp.linalg.linalg.LinAlgError, which numpy 2.5.4 does not have, so the failure raises AttributeError, which is neither the LinAlgError the pair loop catches (connectivity.py:742-743) nor the ValueError the pyspi wrapper catches (pyspi/statistics/spectral.py:438), and the Calculator sets the whole sgc_nonparametric table to NaN (pyspi/calculator.py:336-337; probe p7, notes/sgc.md "Error path"); no RNG is drawn. A batch must keep (b) as a whole-SPI failure or record the change. The random start from the global numpy RNG (minimum_phase_decomposition.py:54-63), which in a batched call would hit every pair, is reachable only under a numpy that still has the deprecated numpy.linalg.linalg shim (numpy < 2.4 as checked: 2.2.6 and 2.3.3 resolve xp.linalg.linalg.LinAlgError with a DeprecationWarning, 2.4.6 and 2.5.4 raise AttributeError) or a spectral_connectivity release whose handler catches xp.linalg.LinAlgError; that rng-stream risk is conditional on such a numpy or library version and does not apply in this environment (pyproject.toml pins numpy>=2.5.4,<2.6)'
    effort: L
    depends_on: []
