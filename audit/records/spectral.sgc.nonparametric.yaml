  - 'CANDIDATE (estimator inconsistency): with the default Multitaper (NW=3, 5 tapers, one window) the null bias does not
    decrease with T. Probe iid_gaussian full-band nanmean: T=64 0.356/0.153, T=256 0.146/0.106, T=1024 0.114/0.121, T=4096
