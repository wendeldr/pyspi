    reference_kind: same-lineage
    criterion: exact
    expected_outcome: 'Differs: the CalculatorFrame value equals the W-0.25 value and the copied calculator reads KERNEL_WIDTH 0.25 (probe A[0,1] bivariate_gaussian 3.9822833545 vs 3.7487119189); documents
