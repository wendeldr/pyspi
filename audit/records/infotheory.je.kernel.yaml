unit_id: infotheory.je.kernel
status: profiled
correctness:
  metric_name_standard: Joint differential entropy h(X,Y) of the contemporaneous pair, box-kernel (fixed-radius) resubstitution estimate, bits
  canonical_ref: 'Cover TM, Thomas JA (2006) Elements of Information Theory, 2nd ed., Wiley, Ch. 8 (Def. 8.1/8.4.1 joint differential entropy); estimator: Kantz H, Schreiber T (1997) Nonlinear Time Series
    Analysis, CUP (box-kernel / correlation-sum density p_r(x) = (1/N) sum_n Theta(r - ||x - x_n||_max)); resubstitution entropy estimator: Ahmad IA, Lin P-E (1976) IEEE Trans. Inf. Theory 22:372-375; review
    Beirlant J et al. (1997) Int. J. Math. Stat. Sci. 6:17-39'
  canonical_definition: 'h(X,Y) = -E[log2 p(X,Y)]; box-kernel estimate h_hat = -(1/N) sum_b log2[ C_b / (N V) ], C_b = #{t : max(|x_t-x_b|/r_x, |y_t-y_b|/r_y) <= 1}, V = (2 r_x)(2 r_y)'
  documented_definition: 'supplement §1.4.1, p.10 (supplement.txt:444-450; pack lines 454-460): ''The joint entropy [33] quantifies the uncertainty over the paired observations'' (the equation is not present in the text extraction);
    keywords undirected, nonlinear, unsigned, bivariate, contemporaneous; identifier 60 je_kernel_W-0.5. supplement §1.4, p.9 (supplement.txt:405-443; pack lines 414-453): ''Kernel estimation (kernel) uses a box kernel method
    with a specific kernel width (default width of 0.5 standard deviations (denoted by the modifier W-0.5))''; GitBook information-theory.md:14 same sentence. GitBook information-theory.md:139-157 (Joint
    Entropy) same prose, key reference MacKay ITILA.'
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel) (via JPype): infodynamics.measures.continuous.kernel.EntropyCalculatorMultiVariateKernel.computeAverageLocalOfObservations
    with KernelEstimatorMultiVariate'
  implemented_as: 'Calculator z-scores each series (ddof=1). For pair (i,j): rows x=z_i, y=z_j (T samples each) are concatenated to a (T,2) array; JIDT kernel entropy with KERNEL_WIDTH=0.5 and internal
    NORMALISE=true: half-widths w_d = 0.5*sampleSD(col) (= 0.5 exactly for z-scored series), closed max-norm box |dx_d| <= w_d, the query point counts itself, density = C_b/(T*prod 2w_d) = C_b/T (box volume
    1 here), H = -mean_b log2(C_b/T). Value cached in data.joint_entropy[(''kernel'',0.5)][i,j] and mirrored to [j,i]; Undirected.multivariate mirrors again. No Theiler window, no bias correction, no noise.'
  implementation_trace:
  - pyspi/calculator.py:48-51 Calculator `__init__` defaults detrend=False, normalise=True
  - pyspi/calculator.py:277 Data(Data.convert_to_numpy(dataset), normalise=self._normalise, detrend=self._detrend)
  - 'pyspi/data.py:193-195 scipy.stats.zscore(data, axis=1, nan_policy=''omit'', ddof=1) (each series: mean 0, sample SD 1)'
  - pyspi/calculator.py:329 S = self._spis[spi].multivariate(self.dataset); :332 np.fill_diagonal(S, np.nan)
  - 'pyspi/base.py:85-94 Directed.multivariate: A[i,j] = self.bivariate(data, i=i, j=j) for every i != j'
  - 'pyspi/base.py:132-138 Undirected.multivariate: calls Directed.multivariate then A[li] = A.T[li] (upper triangle mirrored to lower)'
  - pyspi/base.py:27-47 parse_bivariate (Data objects pass through; raw arrays are wrapped by Data()/add_process)
  - 'pyspi/statistics/infotheory.py:28-58 JIDTBase.__init__: estimator=''kernel'' -> identifier += ''_W-{kernel_width}'', labels += [''nonlinear'']; JIDTBase default kernel_width=0.5; _entropy_calc built
    at :36'
  - 'pyspi/statistics/infotheory.py:84-93 _setup: calc.setProperty(''KERNEL_WIDTH'', str(kernel_width)); also BIAS_CORRECTION=''false'' and NOISE_SEED=''42''. BIAS_CORRECTION is not a property of any kernel
