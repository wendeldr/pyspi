  - 'JIDT v1.6.1 tag https://raw.githubusercontent.com/jlizier/jidt/v1.6.1/java/source/infodynamics/utils/MatrixUtils.java (byte-identical to master a9b6b3e, the shipped build; line numbers valid for both):
    stdDev(double[][], int) L2384-2393 -> stdDev(double[][], int, double) L2436-2447 divides by (n-1) (sample SD)'
  deviation_from_documented: 'None in substance. Precision of wording: ''width of 0.5 standard deviations'' is the box HALF-width (radius): stepKernel excludes a point only if |dx| > 0.5 SD, so the box
    side is 1 SD per dimension. The supplement cites JIDT v1.5 (§1.4) while the GitBook and the jar label (version-1.6.1.txt) say v1.6.1; the jar contents are a post-1.6.1 master build (a9b6b3e, see infotheory.est.kernel).'
  deviation_from_canonical: 'Estimator-level (shared with infotheory.est.kernel): resubstitution (self-inclusive, no leave-one-out) box-kernel plug-in with no bias correction; the large-sample limit is
    the cross-entropy of p against its box-smoothed version, slightly above h(X,Y) (for an independent N(0,1) pair the limit is 2 x 2.04935 = 4.0987 bits vs true 4.0942 bits; probe on iid_gaussian T=4096
    gave mean 4.089 bits); self-inclusion biases densities up (entropy down) at small T. Otherwise matches the definition.'
  units_and_range: 'bits. With W=0.5 on z-scored data the box volume is exactly 1, so JE = -mean log2(C_b/T) lies in [0, log2 T]: never negative (unlike the Gaussian je), finite for finite input (C_b >=
    1). Symmetric in (i,j). Diagonal NaN (Calculator).'
  direction_convention: 'Undirected: A[i,j] = A[j,i] = h_hat(z_i, z_j); the cache fill (infotheory.py:175) and Undirected.multivariate mirror make the matrix exactly symmetric (probe: np.array_equal(A,
    A.T) True on delayed_noise and var2_bivariate T=1024).'
  symmetry_expected: sym
  already_documented: 'no'
  new_finding_candidates:
  - 'Candidate (documentation precision): ''kernel width 0.5 SD'' is the half-width of a closed max-norm box. Evidence: KernelEstimatorMultiVariate.stepKernel L961 (JIDT v1.6.1 tag, byte-identical at a9b6b3e) ''if (Math.abs(observation[d] - candidate[d])
    > kernelWidthsInUse[d]) return 0''; library probe on grid [0,1,2,3,10] with absolute width 1.0 gave H=2.287943094599 = closed-box value (open-box value would be 3.321928).'
  - 'Candidate (range property): because the box volume is (2*0.5*1)^2 = 1 on z-scored data, je_kernel_W-0.5 = -mean log2(C_b/T) is bounded in [0, log2 T] and is a smoothed plug-in of the bivariate density,
    not an unbiased differential-entropy estimate. Evidence: from-scratch numpy reference with this formula matched pyspi to 8.9e-16 (var2_bivariate T=256, 3.94581152410853 bits); iid_gaussian means 3.805/4.004/4.070/4.089
    bits at T=64/256/1024/4096 vs box-limit 4.0987 and true 4.0942.'
  - 'Candidate (kernel-path quirk, see infotheory.est.kernel): calling JointEntropy.bivariate(x, y) with raw arrays z-scores only x (Data.add_process), so the value shifts by log2(SD(y)). Evidence probe:
    scaled_offset T=256 rows 2,3: raw-array call 6.6107 vs Data call 3.3055, difference 3.30519 = log2(std(x3, ddof=1)).'
  - 'Candidate (copy path, confirmed by probe): a CalculatorFrame computes je_kernel_W-0.5 with kernel width 0.25 while the identifier still reads W-0.5. JIDTBase.__deepcopy__ (infotheory.py:77-82) copies
    _entropy_calc with copy.deepcopy, which yields an EntropyCalculatorMultiVariateKernel in its default state (JIDT default KERNEL_WIDTH 0.25) without re-running _setup, and CalculatorFrame.init_from_list
    deep-copies the base Calculator (calculator.py:556-562). Probe it_kernel_fix/p1_frame_all.py, A[0,1]: bivariate_gaussian T=256 Calculator 3.9822833545 vs CalculatorFrame 3.7487119189; var2_bivariate
    T=256 Calculator 3.9458115241 vs CalculatorFrame 3.6838644230 (each frame value equals the width-0.25 value on its own dataset: 3.7487119189 for bivariate_gaussian and 3.6838644230 for var2_bivariate;
    check runs infotheory.je.kernel|bivariate_gaussian|256|pipeline|frame and infotheory.je.kernel|var2_bivariate|256|pipeline|frame). A pickle round trip keeps width 0.5 (__setstate__ re-applies _setup).
    Not in the already-documented list; the kraskov TE records describe the same copy mechanism for TE embedding settings.'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - nonlinear_dependence
    - delayed_noise
    - contaminated
    path: pipeline
    reference: 'from-scratch numpy box-kernel resubstitution entropy: z = scipy.stats.zscore(x, ddof=1); per column w_d = eps*std(col, ddof=1); C_b = #{t : max_d |X_td - X_bd|/w_d <= 1} (self included);
      H = -mean(log2(C_b / (N * prod_d 2 w_d))) with eps=0.5 on the (T,2) pair, every off-diagonal pair, T in {64,256,1024,4096}'
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: 'Every off-diagonal Calculator entry equals the numpy value to abs <= 1e-12 (probe: 8.9e-16 on var2_bivariate T=256).'
  - datasets:
    - iid_gaussian
    path: pipeline
    reference: 'analytic large-sample limit of the box-kernel resubstitution estimator for an independent N(0,1) pair: 2*h_box(0.5), h_box(e) = -integral phi(x) log2[(Phi(x+e)-Phi(x-e))/(2e)] dx = 2.04935
      bits (scipy.integrate.quad); true h = 2*2.04710'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: Mean off-diagonal value approaches 4.0987 bits from below as T grows (probe 3.805, 4.004, 4.070, 4.089); |mean - 4.0987| < 0.02 at T=4096.
  - datasets:
    - bivariate_gaussian
    path: pipeline
    reference: 'analytic box limit for correlated Gaussian pairs: -E log2 P_box(X,Y) with P_box = rectangle probability of the N(0,[[1,rho],[rho,1]]) law over [x-0.5,x+0.5]x[y-0.5,y+0.5] (scipy.stats.multivariate_normal.cdf
      rectangle differences, Monte Carlo over 1e5 points); Gaussian truth 0.5*log2((2 pi e)^2 (1-rho^2)) reported alongside'
    reference_kind: analytic
    criterion: statistical
    expected_outcome: Pairs (0,1) rho=0.3 and (2,3) rho=0.8 at T=4096 within 0.03 bits of the box limit; the box limit sits within ~0.05 bits above the Gaussian truth (smoothing bias larger for rho=0.8).
  - datasets:
    - var2_bivariate
    - delayed_noise
    - iid_gaussian
    path: pipeline
    reference: 'analytic symmetry: A vs A.T and direct bivariate(i,j) vs bivariate(j,i) on a fresh Data object (no cache)'
    reference_kind: analytic
    criterion: direction
    expected_outcome: 'Direction convention: undirected; A == A.T bitwise and fresh bivariate(i,j) == bivariate(j,i) (column-permutation invariance of max-norm box counts).'
  - datasets:
    - scaled_offset
    - bivariate_gaussian
    path: pipeline
    reference: 'invariance: scaled_offset = scale*bivariate_gaussian + offset (same draw); z-scoring removes it'
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: With normalise=True the matrices agree to abs <= 1e-12 at every T; with normalise=False the entries shift by log2(scale_i*scale_j) up to ~1e-12 (differential-entropy scaling, kernel
      width follows the SD).
  - datasets:
    - iid_gaussian
    - delayed_noise
    - narrowband_f0-0.25
    - logistic_maps
    path: pipeline
    reference: 'analytic bound for volume-1 box: 0 <= JE <= log2 T'
    reference_kind: analytic
    criterion: exact
    expected_outcome: All off-diagonal entries lie in [0, log2 T] (to 1e-12); no NaN/inf.
  - datasets:
    - bivariate_gaussian
    - var2_bivariate
    path: pipeline
    reference: CalculatorFrame (deepcopy, calculator.py:559) vs Calculator on the same data and config, plus a direct call of the same SPI class with kernel_width=0.25 and getProperty('KERNEL_WIDTH') on
