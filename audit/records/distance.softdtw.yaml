optimisation:
  complexity_P_T: 'O(P^2 T^2) per identifier: per ordered pair (Undirected over Directed.multivariate) tslearn soft_dtw builds the T x T squared-distance
    matrix with sklearn euclidean_distances (SquaredEuclidean) and runs the numba soft-DTW recursion; the unit''s three identifiers ignore their
    constraint and repeat the same work (family-warm 7.77 s vs fresh 2.54 s at 8x1024). Measured T_exponent 1.81 (8x256 -> 8x1024); 118x1024 projected
    by pair count (626 s fresh, 1916 s for the three identifiers).'
  hotspot_1: tslearn/metrics/softdtw_variants.py:SoftDTW.compute (third-party:tslearn) 51.9% self time of the profiled SPI call at 8x1024 (numba
    soft-DTW recursion hidden in it)
  hotspot_2: tslearn/metrics/softdtw_variants.py:SoftDTW.__init__ -> SquaredEuclidean.compute -> sklearn _euclidean_distances (third-party:sklearn)
    45.4% cumulative (sklearn 29.3%, numpy astype casts 10.6%)
  hotspot_owner: third-party:tslearn
  opaque_share: 0.1157
  profile_file: audit/profiles/distance.softdtw__8x1024.pstats
  opportunities:
  - opportunity_id: dtw_family-3
    opportunity: 'Compute the soft-DTW matrix once for the unit''s three identifiers: SoftDynamicTimeWarping.bivariate (pyspi/statistics/distance.py:206-208)
      calls soft_dtw(z[i], z[j]) without the constraint, so softdtw, softdtw_constraint-itakura and softdtw_constraint-sakoe-chiba are the same
      computation. Invalid once the constraint is honoured.'
    opp_type: cache-sharing
    expected_speedup: ~3x
    speedup_basis: 'complexity: three identical computations; family-warm increments 2.58 / 2.59 / 2.60 s for the three identifiers (audit/profiles/distance.softdtw__8x1024__family-warm.json)
      at 8x1024 (7.77 s unit total -> 2.58 s)'
    output_risk: unverified-bit-identical
    risk_evidence: identical call soft_dtw(z[i], z[j]) with gamma=1 for all three identifiers (correctness block)
    effort: S
    depends_on: []
  - opportunity_id: dtw_family-4
    opportunity: 'Fuse the cost into the recursion: compute (x_i - y_j)^2 inside one numba kernel instead of building the T x T matrix with sklearn''s
      dot-product expansion plus three astype casts in SquaredEuclidean.'
    opp_type: rewrite-numba-rust-cpp
    expected_speedup: '1.5-1.8x'
    speedup_basis: 'profile:audit/profiles/distance.softdtw__8x1024.pstats SoftDTW.__init__ 45.4% (Amdahl 1.83x, reached only if the fused squared difference costs nothing inside the recursion; a fused cost adds T^2 subtractions and squares, so about 1.5-1.8x).
      Independent of dtw_family-3 (independent_of), because dtw_family-3 serves two of the three identifiers from the first one''s matrix (fewer calls) and this avenue makes each
      remaining call cheaper, so the savings multiply'
