unit_id: distance.softdtw
status: profiled
correctness:
  metric_name_standard: Soft-DTW discrepancy (Cuturi-Blondel soft-min DTW value, gamma = 1, squared Euclidean cost); not the soft-DTW divergence
  canonical_ref: 'Cuturi M, Blondel M 2017, Soft-DTW: a Differentiable Loss Function for Time-Series, ICML (PMLR 70:894-903), eq. (1)-(2) and
    Algorithm 1'
  canonical_definition: 'dtw_gamma(x,y) = min^gamma { <A, Delta(x,y)> : A in A_{n,m} }, min^gamma(a_1..a_k) = -gamma log sum_i exp(-a_i/gamma),
    Delta_ij = ||x_i - y_j||^2; computed by r_ij = Delta_ij + min^gamma(r_{i-1,j-1}, r_{i-1,j}, r_{i,j-1}), r_00 = 0, borders +inf'
  documented_definition: 'supplement §1.2.9, p.7 (pack lines 312-320) and GitBook ''Soft Dynamic Time Warping'': "uses a smoothed formulation
    of DTW to optimize the minimal-cost alignment as a differentiable loss function... computed via the tslearn package (with the default hyperparameter,
    gamma = 1), and includes the same global constraints as DTW" (identifiers softdtw, softdtw_constraint-itakura, softdtw_constraint-sakoe_chiba).'
  delegate_lib: tslearn==0.9.0 tslearn.metrics.soft_dtw (softdtw_variants.py:530) -> SoftDTW/_njit_soft_dtw; cost matrix via scikit-learn==1.9.1
    euclidean_distances
  implemented_as: z-score rows (ddof=1); D_ij = (sklearn euclidean_distances(x, y))^2 = clamp(x_i^2 + y_j^2 - 2 x_i y_j, 0); soft-DTW recursion
    with gamma = 1 (numba fastmath softmin with max-shift); value R[T,T]. No global constraint for any of the three identifiers.
  implementation_trace:
  - pyspi/calculator.py:329 Calculator.compute calls self._spis[spi].multivariate(self.dataset)
  - 'pyspi/data.py:184-195 Data.set_data: scipy.signal.detrend(axis=1) only if detrend=True (default False), then scipy.stats.zscore(axis=1, nan_policy=''omit'',
    ddof=1) if normalise=True (default True)'
  - 'pyspi/base.py:132-138 Undirected.multivariate: A = Directed.multivariate(data); A[tril(-1)] = A.T[tril(-1)] (lower triangle overwritten by
    the upper triangle, so A[i,j] = bivariate(min(i,j), max(i,j)))'
  - 'pyspi/base.py:84-94 Directed.multivariate: A filled with NaN, bivariate(data, i, j) for every ordered pair i != j (both orders computed,
    diagonal stays NaN)'
  - 'pyspi/base.py:27-49 parse_bivariate: a raw (x, y) call builds Data() and add_process(x), add_process(y) (pyspi/data.py:219-240)'
  - 'pyspi/statistics/distance.py:154-163 TimeWarping.__init__ (inherited): identifier gets ''_constraint-itakura'' / ''_constraint-sakoe-chiba'';
    self._global_constraint stored but never read by SoftDynamicTimeWarping'
  - 'pyspi/statistics/distance.py:200-208 SoftDynamicTimeWarping: name = ''Dynamic time warping''; bivariate overrides TimeWarping.bivariate and
    returns tslearn.metrics.soft_dtw(z[i], z[j]) with no constraint and default gamma'
  - .venv/lib/python3.12/site-packages/tslearn/metrics/__init__.py:57-67 tslearn.metrics.soft_dtw is tslearn.metrics.softdtw_variants.soft_dtw
    (tslearn==0.9.0)
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:530 soft_dtw(ts1, ts2, gamma=1.0, be=None, compute_with_backend=False)
    (no constraint parameter exists; probe: TypeError on global_constraint=)'
  - .venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:624-628 be.array; if math.isclose(gamma, 0.0) return dtw(ts1, ts2)**2
    (not taken, gamma=1)
  - .venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:629-638 SoftDTW(SquaredEuclidean(_to_time_series(ts1, True), _to_time_series(ts2,
    True)), gamma=1.0).compute()
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:1176-1216 SquaredEuclidean.compute: be.pairwise_euclidean_distances(X,
    Y) ** 2'
  - .venv/lib/python3.12/site-packages/tslearn/backend/numpy_backend.py:19,70 pairwise_euclidean_distances = sklearn.metrics.pairwise.euclidean_distances
  - '.venv/lib/python3.12/site-packages/sklearn/metrics/pairwise.py:268 euclidean_distances -> 376-426 _euclidean_distances (scikit-learn 1.9.1):
    float64 path -2*X@Y.T + |X|^2 + |Y|^2, clamped at 0, then sqrt (squared again by tslearn)'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/softdtw_variants.py:1068-1135 SoftDTW.__init__/compute: D cast to float64, R_ zeros (m+2,
    n+2); _njit_soft_dtw(D, R_, gamma); return R_[m, n]'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/soft_dtw_fast.py:100-125 _njit_soft_dtw: R[:m+1,0] = R[0,:n+1] = DBL_MAX, R[0,0] = 0;
    R[i,j] = D[i-1,j-1] + softmin3(R[i-1,j], R[i-1,j-1], R[i,j-1], gamma)'
  - '.venv/lib/python3.12/site-packages/tslearn/metrics/soft_dtw_fast.py:14-48 _njit_softmin3 (numba fastmath=True): -gamma * (log(sum exp(-a/gamma
    - max)) + max)'
  deviation_from_documented: 'The documented Sakoe-Chiba and Itakura variants are not implemented: SoftDynamicTimeWarping.bivariate (distance.py:205-208)
    never passes the constraint and tslearn.soft_dtw has no constraint argument, so the three identifiers are identical (probe: bit-identical
    4x128 matrices). gamma = 1 matches the documentation. Class name ''Dynamic time warping'' duplicates the DTW name (distance.py:202, cosmetic).
    Identifier spelling: the code produces ''softdtw_constraint-sakoe-chiba'' (distance.py:161 replaces ''_'' by ''-''), the supplement and GitBook
    list ''softdtw_constraint-sakoe_chiba'' (cosmetic).'
  deviation_from_canonical: 'none for the value itself: matches Cuturi-Blondel Algorithm 1 with squared Euclidean cost and gamma = 1 (probe T=40:
    tslearn -2.205017147170598 vs from-scratch -2.2050171471705955). The cost matrix uses the dot-product expansion (last-bit cancellation; probe:
    max abs cell error 1.1e-14 on z-scored data, 2.9e-8 with offset 1e4) and softmin uses numba fastmath.'
  units_and_range: 'Real-valued, NOT non-negative (the audit reads the ''unsigned'' keyword by the GitBook glossary''s sign-meaning sentence, glossary-of-terms.md:21, which says whether the sign indicates how A and B co-fluctuate; the same glossary entry also ties the keyword to the range, so it is mixed, and the supplement only lists the keyword axes, supplement.txt:126-128; and ''distance'' is the literature category): includes an entropic term down to about -gamma*log(number
    of alignment paths); soft_dtw(x,x) != 0 (probe T=40: -31.28; T=1024: -717.3); scale grows with T; symmetric in its arguments. Units: squared
    data units (z-scored -> dimensionless).'
  direction_convention: 'Undirected: A[i,j] = A[j,i] = soft_dtw(z_min(i,j), z_max(i,j)) via Undirected.multivariate mirroring; diagonal NaN (probe:
    raw soft_dtw(z0,z1) - soft_dtw(z1,z0) = 0.0).'
  symmetry_expected: sym
  already_documented: tests/README.md bug 3 (SoftDynamicTimeWarping ignores global_constraint; locked in tests/unit/test_known_bugs.py:111-131)
  new_finding_candidates:
  - 'Candidate (interpretation): pyspi reports the soft-DTW VALUE, not the soft-DTW divergence D(x,y) = sdtw(x,y) - (sdtw(x,x)+sdtw(y,y))/2 (Blondel,
    Mensch, Vert 2021, AISTATS; tslearn offers cdist_soft_dtw_normalized). Values are mostly negative and dominated by a length-dependent entropic
    term: probe (z-scored, seeded) T=64: sdtw(x,x) = -41.4, independent -9.07, x vs -x +2.84; T=1024: -717.3, -189.1, -188.4. So at T=1024 it
    does not separate independent from anti-correlated pairs; snapshot small/full matrices contain both signs (min -16.96, max 2.31 for small).'
  - 'Candidate (numerical, minor): the squared-Euclidean cost comes from sklearn''s |x|^2+|y|^2-2xy expansion followed by sqrt and re-squaring, which
    adds an absolute error of order 1e-14 per cell on unit-scale data (probe: 1.07e-14 max on z-scored data; 1.4e-14 max over 20 seeds of y = x + 1e-3
    noise, T=256) and 2.9e-8 with a 1e4 offset when normalise=False. The relative error of a cell is that absolute error divided by (x_i - y_j)^2, so
    it is unbounded as the cell approaches 0: for y = x + 1e-3 noise the maximum diagonal relative error ranged from 1.2e-7 to 2.1e-3 across 20 seeds,
    and no single relative figure characterises it. Expected impact on the final value < 1e-10 relative for z-scored data (hypothesis, to be measured
    by the from-scratch check).'
  - 'Cross-family (infrastructure) candidate, affects direct two-array calls only: parse_bivariate (pyspi/base.py:33-36) builds Data() (normalise=True)
    and calls add_process(x) then add_process(y); the first call goes through set_data and is z-scored, the second is np.append-ed raw (pyspi/data.py:230-234).
    Probe with x, y ~ 5 + 3 N(0,1), T=64: stored means [0.0, 4.783], stds [1.0, 2.995]. So spi.bivariate(x, y) compares z-scored x with raw y.
    Calculator/multivariate paths are unaffected.'
  proposed_checks:
  - datasets:
    - iid_gaussian
    - delayed_noise
    - narrowband_f0-0.25
    - logistic_maps
    path: kernel
    reference: from-scratch numpy soft-DTW (Cuturi-Blondel Algorithm 1, direct (x_i-y_j)^2 cost, scipy.special.logsumexp softmin, gamma = 1)
    reference_kind: independent-impl
    criterion: tolerance
    expected_outcome: relative difference <= 1e-10 at T in {64,256,1024} (4096 with an anti-diagonal vectorised reference)
  - datasets:
    - delayed_noise
    - iid_gaussian
    path: pipeline
    reference: pyspi softdtw matrix
    reference_kind: same-lineage
    criterion: exact
    expected_outcome: softdtw_constraint-itakura and softdtw_constraint-sakoe-chiba matrices are bit-identical to softdtw (known bug 3, re-confirmed)
  - datasets:
    - iid_gaussian
    path: kernel
    reference: from-scratch soft-DTW with gamma -> 1e-3 vs from-scratch hard DTW squared
    reference_kind: analytic
    criterion: tolerance
    expected_outcome: reference satisfies dtw^2 - gamma*log(number of alignment paths) <= sdtw <= dtw^2 and converges to dtw^2 as gamma -> 0 (sanity
      of the reference)
  - datasets:
    - iid_gaussian
    - bivariate_gaussian
    - delayed_noise
    path: pipeline
    reference: 'analytic properties: sdtw(x,x) != 0 and typically < sdtw(x,y); divergence D(x,y) >= 0 computed from-scratch'
    reference_kind: analytic
    criterion: qualitative
    expected_outcome: pyspi values are negative for most pairs and the soft-DTW divergence ranks pairs differently from the raw value; document
      dynamic range vs T
  - datasets:
    - delayed_noise
    - iid_gaussian
    path: pipeline
    reference: from-scratch numpy soft-DTW recursion applied to the ddof=1 z-scored rows z_i, z_j (no tslearn import)
    reference_kind: independent-impl
    criterion: direction
    expected_outcome: 'Direction/symmetry convention: A == A.T exactly (np.array_equal with equal_nan), diagonal all NaN, and A[i,j] == A[j,i]
      == reference(z_min(i,j), z_max(i,j)) within tolerance; reference(z_i, z_j) and reference(z_j, z_i) agree to <= 1e-12 relative, so the undirected
      label carries no hidden order.'
  check_method: independent-impl
  check_reference: audit/checks/refs/dtw_family.py:matrix -> audit/checks/refs/_kernels_distance.py:soft_dtw_dp (Cuturi & Blondel 2017 Alg. 1, direct (a-b)^2
    cost, logsumexp softmin); audit/checks/refs/dtw_family.py:soft_dtw_masked (documented constrained variants); same-lineage bit identity of the constraint
    identifiers with softdtw; audit/checks/refs/_kernels_distance.py:dtw_dp for the gamma -> 0 band; audit/checks/refs/dtw_family.py:mc_null
  check_data: iid_gaussian, delayed_noise, narrowband_f0-0.25, logistic_maps (kernel T 64/256/1024, all 3 identifiers); pipeline T1024 on iid_gaussian, delayed_noise,
    bivariate_gaussian, shared_envelope; iid_gaussian T256 (gamma probes, near-identical and +1e4 rows); scaled_offset, trending T1024; null T256/T1024
  agreement_criterion: tolerance rtol 1e-10, atol 1e-10; bit identity (rtol 0) between identifiers; gamma probes rtol 1e-9 and the analytic band; null Bonferroni
    2 se
  closeness: 'softdtw: 16/16 dp runs within max_abs 2.3e-13, max_rel 2.5e-14 of the from-scratch recursion; constraint identifiers vs unconstrained reference
    8/8 (max_rel 4.8e-15). softdtw_constraint-itakura and -sakoe-chiba are bit-identical to softdtw in all 32 ''ident'' runs (kernel 4 datasets x 3 T, pipeline
    4 datasets). Against the masked (documented) soft-DTW all 8 ''masked'' runs fail: itakura masked minus unconstrained 2.5-22.6, sakoe-chiba 57-1303 (iid_gaussian
    T1024: 676-848). gamma probes: tslearn vs reference max_rel 4.6e-15 (gamma 0.001) and 1.1e-14 (gamma 0.1); both inside the analytic band around dtw^2.
    Near-identical z-scored rows max_rel 3.1e-16; rows + 1e4 on the kernel path max_rel 1.0e-8 (fails the 1e-10 tolerance). Null T1024 -188.1 vs Monte Carlo
    -194.6 +- 13.6 (max_z 1.07); T256 max_z 1.43.'
  verdict: wrong
  score_0_10: 3
  score_rubric: 3
  score_rubric_basis: nearest-anchor
  score_rubric_note: Anchor 3 names the softdtw constraint identifiers, which equal softdtw bit for bit in all 32 ident runs. The approved anchor text has no rule for
    which identifier a unit row describes, so the row was scored on its lowest-scoring identifier. The representative softdtw alone is within max_rel 2.5e-14 of the
    from-scratch recursion (16/16 runs).
  documentation_status: misdescribed
  verdict_adjusted: matches
  score_adjusted: 9
  score_adjustment_rules: R1
  score_adjustment_reason: 'R1: the base identifier softdtw agrees with a from-scratch Cuturi-Blondel Alg. 1 recursion at gamma = 1 in 16/16 runs (max_rel 2.5e-14),
    and 10 is withheld for the dot-product cancellation that also holds pdist euclidean at 9 (kernel-path +1e4 offset run max_rel 1.008e-8, just above the 1e-8 bar,
    max_abs 3.0e-7).'
  identifier_exceptions: 'softdtw_constraint-itakura=3 (wrong): constraint never passed to tslearn, bit-identical to softdtw in 16/16 ident runs (32 for the two constraint
    identifiers; tests/README bug 3) | softdtw_constraint-sakoe-chiba=3 (wrong): constraint never passed to tslearn, bit-identical to softdtw in 16/16 ident runs (tests/README
    bug 3)'
  what_changed: 'The score 3 applies to the two constraint identifiers softdtw_constraint-itakura and softdtw_constraint-sakoe-chiba, not to the
    representative identifier softdtw (units.yaml representative; the CSV row carries softdtw next to the score), which on its own would rate 10: it
    is Cuturi & Blondel''s soft-DTW with gamma = 1 to about 1e-14 relative against an independent recursion, as documented. The unit is scored on
    its lowest-scoring identifier, the rule that also gives distance.bary.euclidean 0 (there the lowest-scoring identifier is also the representative);
    rubric anchor 3 names this case. The two constraint identifiers ignore their constraint (SoftDynamicTimeWarping.bivariate, distance.py:205-208,
    passes nothing), so they equal softdtw bit for bit: already documented as tests/README.md bug 3. Separately, and not a deviation: pyspi reports
    the raw soft-DTW value, which is the canonical Cuturi-Blondel 2017 quantity (eq. 2, Alg. 1) and the documented one (supplement.txt:305-310), not
    the soft-DTW divergence of Blondel, Mensch & Vert 2021. On z-scored data every value at T=1024 is negative (-454 to -174), sdtw(x,x) is about
    -712 to -718, and the ranking differs from the divergence (Spearman 0.44-0.60). This does not contradict the labels: the supplement only lists signed or unsigned among its keyword axes (supplement.txt:126-128) without
    defining them, and the GitBook glossary (information-about-pyspi/spis/glossary-of-terms.md:21) is mixed, tying the keyword first to the range ("correlation coefficients
    ... [-1, 1]", "distance correlation (defined in the range [0,1]) are unsigned") and then to whether the sign indicates how fluctuations in A correspond to B; the audit
    adopts the sign-meaning sentence, and under it the entropic offset does not make the value signed, and ''distance'' is the literature category shared with LCSS (a similarity). new_finding is false: the constraint issue is documented,
    the raw-value property belongs to the canonical quantity (as for the DTW and LCSS low-dynamic-range candidates in this family), and the dot-product
    cost error is a floating-point property that reaches 1e-8 relative only with normalisation off. Rubric reading is nearest-anchor 3 (score_rubric_note),
    because the anchor text has no rule for which identifier a unit row describes; under R1 score_adjusted is 9, not 10, for the dot-product cancellation
    (score_adjustment_reason). The ''anchor 3 names this case'' wording above is the original reasoning for score_0_10; ''would rate 10'' is the original
    estimate for the representative softdtw on its own.'
  new_finding: false
  definition_under_review: false
  check_cost: 'cheap: <= 1.5 s per pyspi run at T=1024; reference 0.12 s per pair at T=1024'
  symmetry_observed: 'sym after mirroring: max|A - A.T| = 0.0 on every pyspi matrix. tslearn itself is symmetric only to the last bits: the unmirrored probe
    gives max|B - B.T| = 1.1e-13 at T1024 (iid_gaussian and delayed_noise), and the from-scratch reference 5.7e-14; diagonal NaN'
  direction_observed: 'undirected: A[i,j] = A[j,i] = f(z_i, z_j); on delayed_noise (x_k = x0 delayed by 0/1/3/5) the matrix carries no lead/lag sign, only
