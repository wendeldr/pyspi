unit_id: wavelet.cohmag
status: profiled
correctness:
  metric_name_standard: magnitude coherence (|coherency|) from Morlet-wavelet cross-spectra, summarised by mean/max over a frequency band and time
  canonical_ref: 'Coherence/coherency: Nolte et al. 2004, Clin Neurophysiol 115:2292, eqs. 1-2 (C_ij(f) = S_ij(f)/sqrt(S_ii S_jj), S = expectation over trials); Bastos & Schoffelen 2016, Front Syst Neurosci
    9:175, coherence section (supplement ref [59]). Single-trial wavelet coherence: Lachaux et al. 2002, Neurophysiol Clin 32:157 (cross-spectrum integrated over a time window of n_co cycles before normalising);
    Torrence & Webster 1999, J Climate 12:2679; Grinsted et al. 2004, Nonlin Proc Geophys 11:561 (smoothing in time and scale). Equation numbers from memory, not re-checked.'
  canonical_definition: '|C_xy(f,t)| = |<W_x(f,t) W_y*(f,t)>| / sqrt(<|W_x|^2> <|W_y|^2>) where <.> is an average over trials (or a smoothing window in time/scale for a single trial) taken BEFORE the normalisation;
    with no averaging the quantity is identically 1. Supplement describes it as ''the frequency domain equivalent of the squared time-domain cross correlation'' (magnitude-squared coherence |C|^2).'
  documented_definition: 'Not documented as such: the nine wavelet classes are absent from pyspi/config.yaml (tests/README.md:155 ''run today but are absent from pyspi/config.yaml''), from the supplement
    SPI list and from the GitBook page. Supplement §1.5.4, p.14 (supplement.txt heading line 644) states the opposite: PSI ''is the only spectral measure that is computed in the time-frequency domain (denoted by
    modifier wavelet)''; same on GitBook spectral.md:330. The closest documented text is the multitaper version: supplement §1.5.1, p.13 (supplement.txt heading line 601) / GitBook spectral.md:24-35: ''The coherence
    (also known as coherence magnitude and ordinary coherence ... ) is an undirected frequency-dependent measure of linear association ... the frequency domain equivalent of the squared time-domain cross
    correlation ... mean (mean) and maximum (max) summary statistics of the coherence for the three frequency ranges''. Shared band rule, supplement §1.5 preamble, p.13 (supplement.txt heading line 570, text lines 589-599;
    GitBook spectral.md:14-20): ''We use 125 uniformly sampled bins across the entire frequency range, f in [f0, fs/2] ... f0 = 4/T ... the mean (mean) and the maximum (max) values of each measure over
    three ranges ... fmin-0_fmax-0-5 ... [0, fs/2]; fmin-0_fmax-0-25 ... [0, fs/4]; fmin-0-25_fmax-0-5 ... [fs/4, fs/2]''.'
  delegate_lib: mne-connectivity==0.9.0 mne_connectivity.spectral_connectivity_epochs(mode='cwt_morlet', method='coh') -> mne==1.13.2 mne.time_frequency.tfr.morlet + cwt (scipy 1.17.1 scipy.fft, numpy 2.5.4);
    band mask, mean/max over (freq, time), lower->upper mirror and NaN diagonal are native pyspi (pyspi/statistics/wavelet.py)
  implemented_as: 'Input z-scored per channel (ddof=1, Data default; optional detrend first). pyspi hands mne-connectivity ONE epoch (z = moveaxis(data (P,T,1), 2, 0) -> (1,P,T)) with cwt_freqs = linspace(0.2,
    0.5, 125) and cwt_n_cycles = cwt_freqs/7 (0.029..0.071 cycles). mne.morlet sets sigma_t = n_cycles/(2 pi f) = 1/(14 pi) = 0.0227 samples for every f, so the time grid arange(0, 5 sigma_t, 1) = [0] and
    every wavelet is the single sample W = sqrt(2)+0j (probe: 125 wavelets, length 1, value 1.41421356). The ''CWT'' is X(f,t) = sqrt(2) x(t) for all 125 f up to FFT round-off (probe: max|Re X - sqrt2 x|
    2.7e-15, max|Im X| 7.2e-16, ~2-5% of Im exactly 0). csd(f,t) = X_hi(f,t) conj(X_lo(f,t)) = 2 x_hi(t) x_lo(t) + i*roundoff (hi = higher channel index, lower-triangular connections), psd = |X|^2 = 2 x^2.
    n_epochs = 1, so every across-epoch average in the estimator is a single term. pyspi then keeps the frequencies with fmin <= f <= fmax on the 0.2..0.5 grid (21 bins for fmin-0_fmax-0-25: 0.2..0.2476;
    104 for fmin-0-25_fmax-0-5; all 125 for 0..0.5), applies np.nanmean or np.nanmax over (freq, time) jointly, mirrors the lower triangle to the upper, sets the diagonal NaN. Estimator coh (mne_connectivity/spectral/epochs_bivariate.py:71-81):
    |csd/1| / sqrt(psd_x psd_y) = |2 x_hi x_lo| / (2 |x_hi| |x_lo|) = 1 at every (f,t) where x_hi x_lo != 0. Output: 1.0 for every pair and band (mean identifiers exactly 1.0; max identifiers 1 + 2^-52
    = 1.0000000000000002, check stage) (probe: all 19 datasets at T=64 and T=1024, every off-diagonal entry 1.0).'
  implementation_trace:
  - 'pyspi/statistics/wavelet.py:15-39 mne.__init__: fmax default fs/2; statistic ''mean'' -> np.nanmean, ''max'' -> np.nanmax; identifier suffix _wavelet_{statistic}_fs-{fs}_fmin-{fmin:.3g}_fmax-{fmax:.3g}
    with ''.''->''-'''
  - 'pyspi/data.py:184-195 Data.set_data preprocessing: optional scipy.signal.detrend(axis=1), then scipy.stats.zscore(axis=1, ddof=1) when normalise=True (default); pyspi/data.py:108-118 to_numpy returns
    the (P, T, R) array'
  - 'pyspi/statistics/wavelet.py:48-53 _get_cache: cache lookup data.mne[self.measure] (keyed by measure only); on miss z = np.moveaxis(data.to_numpy(), 2, 0) -> (R=1, P, T): a single epoch for an ordinary
    Data'
  - pyspi/statistics/wavelet.py:54-55 cwt_freqs = np.linspace(0.2, 0.5, 125); cwt_n_cycles = cwt_freqs / 7.0
  - pyspi/statistics/wavelet.py:56-67 mnec.spectral_connectivity_epochs(data=z, method=self.measure, mode='cwt_morlet', sfreq=fs, mt_adaptive=True, fmin=5/n_observations, fmax=fs/2, cwt_freqs, cwt_n_cycles)
  - pyspi/statistics/wavelet.py:68-74 conn = connectivity.get_data(output='dense') (shape P x P x 125 x T), freq = connectivity.freqs; stored in data.mne[measure]
  - pyspi/statistics/wavelet.py:76 freq_id = np.where((freq >= fmin) * (freq <= fmax)) (inclusive both ends)
  - 'pyspi/statistics/wavelet.py:100-107 CoherenceMagnitude(mne, Undirected): identifier ''cohmag'', _measure ''coh'''
  - 'pyspi/statistics/wavelet.py:80-90 multivariate: adj = statfn(adj_freq[..., freq_id, :], axis=(2, 3)) (frequency AND time); ui = triu_indices(P, 1); adj[ui] = adj.T[ui] (lower -> upper); fill_diagonal
    NaN. The class MRO puts mne.multivariate before Undirected.multivariate (pyspi/base.py:132-138), so pyspi''s own mirror in wavelet.py:87-88 is the one that runs'
  - mne_connectivity/spectral/epochs.py:770 spectral_connectivity_epochs; :1143-1154 fmin/fmax to arrays (fmin = 5/T, fmax = 0.5)
  - 'mne_connectivity/spectral/epochs.py:216 -> :97-113 _check_freqs: fmin = 5/T only warns if below 5 cycles; :219 -> :116-138 _compute_freqs cwt branch (124-135): freqs_all = cwt_freqs, raises if any
    > sfreq/2'
  - 'mne_connectivity/spectral/epochs.py:222 -> :141-153 _compute_freq_mask: (freqs >= fmin) & (freqs <= fmax); for T >= 25 all 125 cwt freqs are kept (probe: T=16 keeps 78, T=24 keeps 121)'
  - 'mne_connectivity/spectral/epochs.py:262-276 indices=None and bivariate method -> np.tril_indices(n_signals, -1): connections (row i > col j) only; :1373 idx_map = searchsorted(sig_idx, indices)'
  - 'mne_connectivity/spectral/epochs.py:1332-1344 -> :320-367 _assemble_spectral_params cwt branch (345-365): cwt_n_cycles[freq_mask] (357); wavelets = morlet(sfreq, freqs, n_cycles=cwt_n_cycles, zero_mean=True)
    (361); mt_adaptive is only used in the multitaper branch (337-341) and is returned unchanged'
  - mne/time_frequency/tfr.py:65 morlet; :159 sigma_t = n_cycles/(2 pi f) = 1/(14 pi) = 0.0227; :165-166 t = arange(0, 5 sigma_t, 1/sfreq) = [0] -> single sample; :167-172 oscillation = 1 - exp(-2 (pi f
    sigma_t)^2) (zero_mean offset, 4.1e-4..2.5e-3); :173-174 envelope 1; :178 W /= sqrt(0.5) * norm(W) -> W = [sqrt(2)]
  - 'mne_connectivity/spectral/epochs.py:443-457 _compute_spectra cwt branch: this_x_t = cwt(x, wavelets, use_fft=True, mode=''same'') (451); psd = (X * conj X).real (457)'
  - 'mne/time_frequency/tfr.py:766-794 cwt -> :303-319 _get_nfft (next_fast_len(T), called at 793) -> :797-806 _cwt_array (called at 794; calls _cwt_gen at 799) -> :322-401 _cwt_gen: fft_Ws (366), ret = ifft(fft_x * fft_Ws[ii]) (377), _centered(ret, n_times) (400): real input times
    real constant, imaginary part is FFT round-off'
  - 'mne_connectivity/spectral/epochs.py:647-656 cwt accumulation: csd = x_t[idx_map[0]] * conj(x_t[idx_map[1]]) (652) = X_hi conj(X_lo); this_method.accumulate(con_idx, csd)'
  - mne_connectivity/spectral/epochs.py:1472-1474 n_epochs = epoch_idx = 1; psd /= 1; :1477-1493 compute_con(con_idx, n_epochs[, psd_xx, psd_yy])
  - 'mne_connectivity/spectral/epochs.py:1555-1567 dense assembly: zeros (P,P,...) then this_con[indices_use] = values (lower triangle only; upper and diagonal 0); :1621 SpectroTemporalConnectivity; mne_connectivity/base.py:721-790
    get_data(output=''dense'') reshape to (P, P, n_freqs, n_times)'
  - mne_connectivity/spectral/epochs_bivariate.py:55-68 _CohEstBase.accumulate (csd sum), :71-81 _CohEst.compute_con con = |csd_mean| / sqrt(psd_xx psd_yy); :352 'coh' -> _CohEst
  deviation_from_documented: '(a) Frequency grid: documented 125 bins over [4/T, fs/2]; implemented 125 bins over [0.2, 0.5] for every T (wavelet.py:54), so the ''low'' band [0, 0.25] contains only 21 bins
    in [0.2, 0.248] and frequencies below 0.2 are never analysed; the mne fmin argument is 5/T, not 4/T (it only masks cwt freqs when T < 25). (b) No time-frequency decomposition: n_cycles = f/7 makes every
    Morlet wavelet one sample long (W = sqrt(2)), so X(f,t) = sqrt(2) x(t) at all 125 frequencies; the band choice changes nothing except which round-off pattern is averaged. (c) Aggregation runs over frequency
    AND time (axis=(2,3)) of per-(f,t) single-epoch values; the documentation for the multitaper versions describes a summary over frequency only. (d) Not in the documented SPI set at all (extra classes).
    (e) Output is the constant 1 on any input (probe), so it is not a ''measure of linear association''. mne ''coh'' is |C| (magnitude), while the documentation''s ''equivalent of the squared ... cross
    correlation'' suggests |C|^2; irrelevant here because the value is 1.'
  deviation_from_canonical: Canonical coherence normalises a cross-spectrum averaged over trials or over a time/scale window; pyspi normalises each single-epoch, single-time-point cross-spectrum (|z|/|z|
    = 1) and only afterwards averages over time and frequency, so the result is identically 1 (degenerate). Additionally the wavelet carries no frequency resolution (1 sample) so even a time-averaged
    version would be the broadband lag-0 quantity |sum_t x_i x_j| / sqrt(sum x_i^2 sum x_j^2) = |Pearson r| (hypothesis for the time-averaged variant, not probed), identical in all bands.
  units_and_range: Dimensionless, nominally [0,1]; implemented output is 1.0 off the diagonal (max identifiers 1 + 2^-52) (NaN if some x_i(t) x_j(t) = 0 at every point of the band, practically never); diagonal
    NaN; symmetric by the mirror.
  direction_convention: Undirected. A[i,j] = A[j,i] = nanmean/nanmax over (f,t) of conn[max(i,j), min(i,j)] (mne computes lower-triangular connections only, mne_connectivity/spectral/epochs.py:276; pyspi mirrors lower->upper, wavelet.py:87-88).
    Magnitude is order-invariant.
  symmetry_expected: sym
  already_documented: 'tests/README.md ''Degenerate outputs in the extra wavelet set'' (tests/README.md:217 and :157: ''cohmag and plv are exactly 1.0 everywhere ... likely cause ... a single epoch'').
    The constant value itself is documented; the one-sample wavelet cause and the frequency grid are not.'
  new_finding_candidates:
  - 'CANDIDATE (pack hypothesis confirmed, cause not in tests/README): cwt_n_cycles = freqs/7 (wavelet.py:55) gives sigma_t = 1/(14 pi) = 0.0227 samples, so every Morlet wavelet is a single sample of value
    sqrt(2) (probe: ''n wavelets 125 lengths [1]'', ''W values unique (real,imag): [1.41421356] [0.]''); the CWT is sqrt(2)*x (max|Re C - sqrt2 x| 2.7e-15). The degeneracy therefore has two independent
    causes: one epoch (documented) and no time-frequency decomposition (new). Even with n_cycles=7 a single epoch gives coh = 1 (probe: ''n_cycles=7, 1 epoch, coh : mean 1 min 1 max 1'').'
  - 'CANDIDATE (hypothesis about origin, supported): the pattern ''cwt_n_cycles = cwt_freqs / 7.0'' is the mne-connectivity example examples/cwt_sensor_connectivity.py (''cwt_freqs = np.arange(7, 30, 2);
    cwt_n_cycles = cwt_freqs / 7.0'', fetched from GitHub main), written for frequencies in Hz (1..4.1 cycles at sfreq ~600 Hz); with fs=1 and f <= 0.5 it yields 0.029..0.071 cycles.'
  - 'CANDIDATE: frequency grid linspace(0.2, 0.5, 125) is fixed for every T, so the documented [4/T, fs/2] grid and the ''low'' band [0, fs/4] are not honoured (21 bins in 0.2..0.2476; probe ''n in [0,0.25]
    21 n in [0.25,0.5] 104'').'
  - 'CANDIDATE: mt_adaptive=True (wavelet.py:61) has no effect in cwt_morlet mode (epochs.py:337-341 uses it only for multitaper; probe: outputs bitwise identical with mt_adaptive=False).'
