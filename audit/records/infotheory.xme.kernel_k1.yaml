unit_id: infotheory.xme.kernel_k1
status: profiled
correctness:
  metric_name_standard: Lagged conditional entropy H(Y_t | X_{t-1}) of the target given the source's previous value ('cross-map entropy' in pyspi), box-kernel plug-in, bits
  canonical_ref: No canonical 'cross-map entropy' in the literature was found; the computed quantity is the conditional differential entropy h(Y_t | X_{t-1}) = h(Y_t) - I(X_{t-1}; Y_t) (Cover & Thomas 2006
    Ch. 8). The name evokes convergent cross mapping (Sugihara G et al. 2012 Science 338:496), which is not what is computed.
  canonical_definition: h(Y_t | X_{t-1}) = h(X_{t-1}, Y_t) - h(X_{t-1}); box-kernel plug-in on the T-1 aligned pairs
  documented_definition: Not described in the supplement (no xme section in §1.4, supplement.txt:405-549; pack lines 414-561) nor in GitBook information-theory.md. GitBook table-of-spis.md:73 lists 'Cross-Map Entropy', base identifier
    xme, with estimators xme_kernel_k1 / xme_kernel_k10 (no W-0.5 modifier); config.yaml:439-464 labels unsigned, directed, time-dependent, bivariate; class docstring absent (name 'Cross-map entropy', infotheory.py:394-398).
  delegate_lib: 'JIDT jar pyspi/lib/jidt/infodynamics.jar (labelled 1.6.1 by pyspi/lib/jidt/version-1.6.1.txt; contents match post-1.6.1 master a9b6b3e, see infotheory.est.kernel): EntropyCalculatorMultiVariateKernel
    (2-D joint and 1-D marginal), combined in pyspi'
  implemented_as: 'Code (infotheory.py:405-426): src, targ = z_i, z_j; k = history_length; targ_future = targ[k:]; src_past starts with src[k-1:-1] (x_{t-1}) and the loop ''for i in range(2, k)'' appends
    x_{t-i}; joint = [src_past, targ_future]; value = H_kernel(joint) - H_kernel(src_past) with the W-0.5 kernel entropy (half-width 0.5*sampleSD of each sub-series column, closed box, self-included). The
    loop gives max(1, k-1) source lags, not k. For k=1: H(x_{t-1}, y_t) - H(x_{t-1}) over t = 1..T-1, i.e. h_hat(Y_t | X_{t-1}). A[i,j] = h_hat(X_j,t | X_i,t-1).'
