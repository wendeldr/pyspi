  deviation_from_documented: 'No definition is documented (only the name and identifiers in table-of-spis.md, whose identifiers omit the W-0.5 modifier that the code adds: actual identifier xme_kernel_W-0.5_k1).'
  deviation_from_canonical: 'Name-level: nothing is cross-mapped; the value is a lagged conditional entropy (equivalently h(Y_t) minus lag-1 MI, the tlmi quantity at a different kernel width). Estimator
    properties as in infotheory.est.kernel.'
  units_and_range: bits; with W-0.5 the value is -mean log2(C_xy/C_x) + log2(SD of y[1:]) ~ >= 0 (the SD of the sub-series is close to, not exactly, 1); <= ~log2(T-1); asymmetric; finite.
  direction_convention: 'A[i,j] = h_hat(X_j at t | X_i at t-1): row i = source past, column j = target present. LOW values mean strong i -> j predictability (opposite sense to te/tlmi). Probe delayed_noise
    T=1024: A[0,1] = 0.180 (x1 is x0 delayed by 1) vs A[1,0] = 2.024 (~h_box of N(0,1)).'
  symmetry_expected: asym
  already_documented: 'no'
  new_finding_candidates:
