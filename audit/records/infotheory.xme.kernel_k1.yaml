    (probe identifiers).'
  - 'Candidate (naming): ''cross-map entropy'' computes H(Y_t | X_{t-1..}) with no cross-mapping; for k=1 it is exactly h_hat(Y_t) - I_hat(X_{t-1}; Y_t) under the same kernel width. Evidence: infotheory.py:405-426;
    numpy reference H([x_{t-1}, y_t]) - H(x_{t-1}) matched pyspi to 2.2e-15 (var2_bivariate T=256: 1.70986628477191).'
