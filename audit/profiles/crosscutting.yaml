  evidence:
  - pyspi/base.py:84-94 Directed.multivariate calls bivariate for every ordered pair (j outer, i != j inner)
  - 'pyspi/base.py:132-138 Undirected.multivariate runs that loop and then sets A[tril] = A.T[tril]: the P(P-1)/2 lower-triangle (j,i) results are discarded'
  - 'Scope = the 26 Undirected-mirror units with no per-pair state: none consumes the global RNG (probe p9_mirror_rng.py, audit/notes/preprocessing_base.md ''RNG-stream coupling: not
    found''); mi.kraskov_DCE fills data.theiler for all pairs on its first call, independent of visiting order'
  - 'Excluded: basic.xcorr.* (4 units), misc.coint.* (5), infotheory.je.* (3): their first-visited (j,i) call fills the (i,j) cache, so visiting i<j only changes the stored value (xcorr
    up to 0.081, coint_aeg up to 7.41, je_kozachenko 1.6e-7, coint_johansen <= 2.6e-13; check runs base.pair_handling|iid_gaussian|256|pipeline|upper-basic.CrossCorrelation, |upper-misc.Cointegration and |upper-infotheory.JointEntropy), and their underlying computation
    already runs once per unordered pair (28 scipy correlate / statsmodels coint / JIDT entropy calls for 56 bivariate calls at 8x1024), so little time would be saved'
  - 'audit/checks/out/results/preprocessing_base.json, the 12 scope-class runs named in the xc-undirected-upper risk_evidence below (base.pair_handling|iid_gaussian|256|pipeline|upper-basic.SpearmanR
    and the 11 others listed there, one per scope class): the identifiers of all 12 scope classes give max_abs 0.0 when A is built from the i<j calls only (iid_gaussian, T=256)'
  - 'Retained EEG units in scope: basic.spearmanr, basic.kendalltau, infotheory.mi.gaussian (22.3 s of the 229.1 s retained-selection window summed over configured identifiers, family-warm projections; 17.8 s on
    their retained identifiers, because the EEG selection keeps kendalltau-sq and not kendalltau). build_csv.py ranks this row in per-tier parts (README ''Optimisation columns'', ranking
    rule 1): family:undirected-upper/retained counts only these three units, on their retained identifiers (10,662 s per patient), and
    the 6 non-retained EEG-FC-family units (family:undirected-upper/eeg-fc-family) and the 17 other units (family:undirected-upper/other) are ranked in their own tiers'
  - 'Overlap with unit avenues (subsumed_by): rank_corr-1 (basic.spearmanr, one corrcoef of the ranked channels), rank_corr-2 (basic.kendalltau, whose basis already counts this
    factor 2), it_gaussian-1 (infotheory.mi.gaussian) and it_gaussian-2 (infotheory.si.gaussian) compute every pair without the bivariate loop, so on those four units this avenue
    saves nothing on top of them and build_csv ranks it there with no saving (ranking rule 4). The same holds on distance.lcss.constraint-itakura and -sakoe_chiba under
    dtw_family-5 (their matrix is a copy of the unconstrained lcss matrix, so no bivariate call is left). On the other 20 units it stacks with the unit avenues that name it in depends_on
    (dcorr_hsic-1/-2/-3, gwtau-1, hhg_mgc-3, dtw_family-1/-4), which build_csv ranks on the residual after it; a unit avenue with no link and a larger lower-bound
    speedup is stacked before it on that unit, so the two savings never add up past the unit''s basis (ranking rule 4). Those pairs act on different factors and are listed in
    independent_of, so their savings multiply: this avenue halves the number of calls, it_kernel-2, it_kozachenko-2, it_gaussian-4, phi-1, phi-2, phi-4 and dtw_family-2 cut
    the cost of each call, it_kernel-1 and it_kozachenko-1 move the per-channel terms out of the pair loop, and phi-3 and dtw_family-3 serve one identifier from another
    identifier''s per-pair result, which the remaining i<j loop still reads once per pair; rank_corr-3 (basic.spearmanr) is listed for the same reason: it serves the -sq
    identifier from the other identifier''s cached matrix, a different factor from the number of bivariate calls'
  - Undirected classes that override multivariate (spectral, cov/prec, pdist, wavelet, pec, ids) and Directed classes (including the cached Barycenter) are outside this avenue
  opportunities:
  - opportunity_id: xc-undirected-upper
    opportunity: In pyspi/base.py:Undirected.multivariate loop over i<j only, call bivariate once per unordered pair and mirror, instead of calling Directed.multivariate over all ordered
      pairs and overwriting the lower triangle.
    opp_type: algorithmic
    expected_speedup: ~2x
    speedup_basis: profile:audit/profiles/basic.spearmanr__8x1024.pstats pyspi/base.py:28:parsed_function 99.4%, audit/profiles/basic.kendalltau__8x1024.pstats 99.3% and
      audit/profiles/infotheory.mi.gaussian__8x1024.pstats 98.3% (the three retained units), audit/profiles/distance.gwtau__8x1024.pstats 96.2% (the lowest; the other 22 scope
      units' 8x1024 pstats listed in profile_file give 99.5-100%) of the call, half of it discarded (Amdahl 1/(1-0.481) = 1.93x for gwtau up to 2.0x) + complexity:P(P-1) -> P(P-1)/2 bivariate calls with a symmetric per-pair cost; assumes the dropped (j,i) call costs the same as the kept (i,j) call (same operations on
      swapped arguments for these symmetric estimators; the two directions were not timed separately)
    output_risk: unverified-bit-identical
    risk_evidence: the (j,i) results are overwritten (base.py:136-137) and the scope classes keep no per-pair state or RNG draws, so the kept (i,j) calls are the same calls; the 12 check runs
      base.pair_handling|iid_gaussian|256|pipeline|upper-basic.SpearmanR, |upper-basic.KendallTau, |upper-distance.DistanceCorrelation, |upper-distance.MultiscaleGraphCorrelation,
      |upper-distance.HilbertSchmidtIndependenceCriterion, |upper-distance.DynamicTimeWarping, |upper-distance.SoftDynamicTimeWarping, |upper-distance.LongestCommonSubsequence,
      |upper-distance.GromovWasserstainTau, |upper-infotheory.StochasticInteraction, |upper-infotheory.MutualInfo and |upper-infotheory.IntegratedInformation (one per scope class)
      gave max_abs 0.0 for every scope identifier (audit/checks/out/results/preprocessing_base.json), not a micro-benchmark; one dataset (iid_gaussian, T=256) only
