  hotspot_1: hyppo/independence/dcorr.py:statistic (third-party:hyppo, numba-compiled work hidden in its self time) 84.5% self / 99.1% cumulative of the profiled distance.dcorr.biased-False
    call; sklearn euclidean_distances 13.9% (audit/profiles/distance.dcorr.biased-False__8x1024.pstats)
  hotspot_owner: third-party:hyppo
  profile_file: audit/profiles/distance.dcorr.biased-False__8x1024.pstats
  evidence:
  - 'cupy is not installed; torch 2.14.1+cpu has no CUDA build; GPU: NVIDIA GeForce RTX 2060, 6144 MiB (nvidia-smi). Projection only, nothing run on the GPU'
  - RTX 2060 FP64 throughput is 1/32 of its FP32 rate, so float64 kernels gain mainly from memory bandwidth; float32 would change values
  - 'Per-channel 1024x1024 float64 distance matrices: 8.4 MB each, 0.99 GB for 118 channels, plus the same again double-centred: fits in 6 GB'
  - With the per-channel cache (audit/profiles/micro/opp_dcorr_hsic-1.json, 10-11x at 8x1024, bit-identical) the remaining per-pair work is a sum of elementwise products, i.e. one (118
    x 1M) by (1M x 118) product per window. This holds for dcorr only
  - 'hsic is not GEMM-shaped: hyppo/tools/common.py:compute_kern takes the RBF bandwidth gamma_x from the x channel''s median distance and uses it for both Grams
    (hyppo/independence/hsic.py:Hsic.statistic), so the y-side Gram exp(-gamma_x D2_y) depends on the pair. After the x-side cache (dcorr_hsic-3) each pair still needs that
    elementwise exp over T^2 entries, its centring and two inner products; on the GPU this is batched elementwise work per x channel (all y channels share gamma_x), not one
    product. The 3-10x is projected from the dcorr profile; hsic has no separate projection, so the opportunity''s scope_speedup gives the hsic units 1x and build_csv
    credits the GPU no saving on them (README ''Optimisation columns'', ranking rule 4)'
  opportunities:
  - opportunity_id: xc-gpu-distance
