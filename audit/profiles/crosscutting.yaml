  eeg_relevant: true
  projected_patient_s: 137463.6
  basis_scope: configured-identifiers-approx
  basis_scope_note: 'the explicit projected_patient_s sums the 53 retained units'' family-warm projections over their configured identifiers (229.1 s per window).
    36.0 s of that window are configured identifiers outside the EEG selection (spectral.gd 11.06 s, spectral.psi 9.03 s, spectral.plv 8.12 s, basic.kendalltau 4.52 s,
    spectral.phase 2.68 s, the rest under 0.1 s each), and the EEG band variants of the 11 spectral units were never timed. The sum also leaves out two cache fills that an
    EEG run pays on retained units, because the family-warm runs filled those caches on identifiers outside the EEG selection: the EllipticEnvelope fit on
    basic.prec.EllipticEnvelope (fresh 3.48 s per window against family-warm 0.0002 s) and the per-pair cross-correlations on basic.xcorr.max_sig-False (fresh 1.24 s
    against 0.086 s). The figure therefore approximates the EEG selection''s window; the tier-0 unit bases of README ''Optimisation columns'', ranking rule 1
    (basic.kendalltau on its retained identifier, spectral.plv on its retained build, those two units on their fresh projections) sum to 221.1 s, still without the
    untimed spectral bands'
  complexity_P_T: 600 independent windows per patient; per-window cost unchanged
  evidence:
  - 'Serial today: pyspi/workflow/_run.py:339-344 ''Execute serially'' and ''No RNG seed/reset''; 229.1 s per 118x1024 window for the 53 retained units (sum of family-warm projected_window_s_118,
    configured identifiers only; EEG band variants not timed), 38.2 h per 600-window patient (historical ~185 s per window, ~31 core-hours)'
  - 'Peak RSS per process at 118x1024 (summary records): spectral_phase_sync family 3409 MB (family-warm, family scope), spectral.plv fresh 3069 MB, spectral_coherence/psi_gd 1887 MB;
    every other retained unit <= 642 MB (JIDT units with the JVM, mi.gaussian fresh); import baseline ~345 MB'
  - 'Machine: 64 logical CPUs (AMD Threadripper 3970X), 31 GB RAM (free -g)'
  - 'Uniform workers (every worker runs the whole retained selection): 31 GB / 3.41 GB = 9 -> 8 workers with OS headroom: 4.8 h per patient (~8x)'
  - 'Split pools: spectral units 82.6 s/window at <= 3.41 GB, the rest 146.5 s/window at <= 0.64 GB; 6 spectral + 11 other workers (27.5 GB) would finish both pools in ~2.3 h per patient
    (~16x, an upper scenario, not the headline); not measured (no new throughput run), memory-bandwidth contention unknown'
  - 'Pair-level alternative: units that run the generic Directed/Undirected loop account for 137.1 s of the 229.1 s window; the other 92.0 s (spectral, cov/prec, pdist, pec) compute
    all pairs in one multivariate call, so splitting pairs caps at 229.1/92.0 = 2.5x per window without code changes and needs a JVM and a Data copy per worker'
  - Per-worker BLAS must stay at 1 thread where the JVM is loaded (see family:blas-threads)
  - 'Pair-level process pools listed per unit (lmfit-5, gpfit-2, ccm-1, cov_prec_robust-2, cov_prec_glasso-1) and BLAS threads (xc-blas-threads) are alternatives for the same
    32 physical cores, not factors on top of this avenue: the ~8 memory-bounded window workers leave about 4 physical cores each, so a pair pool inside a worker can add at most
    about 4x for its unit, and combined throughput stays bounded by the core count. All of them carry speedup_kind throughput and build_csv ranks them after every per-window
    row (README ''Optimisation columns'', ranking rule 3). Because they are alternatives, none of them lists xc-window-parallel in depends_on'
  - 'xc-window-parallel lists xc-blas-threads in depends_on for that avenue''s first part only: BLAS at 1 thread in every worker that hosts the JIDT JVM (the JVM + multi-threaded
    OpenBLAS segfault, family:blas-threads), a precondition for running the JIDT units in workers. Its second part (more BLAS threads around the gpfit fits) is the
    alternative use of the cores described above. A depends_on entry that names a throughput avenue is a deployment precondition, not a ranking prerequisite'
  opportunities:
  - opportunity_id: xc-window-parallel
    opportunity: Run windows (or recordings) in separate worker processes, each with its own JVM and BLAS at 1 thread, sized by peak RSS (about 8 uniform workers, or about 6 spectral
      + 11 other workers in split pools), instead of the serial window loop in pyspi/workflow/_run.py; prefer this to pair-level splitting.
    opp_type: parallel
    speedup_kind: throughput
    expected_speedup: ~8x
    speedup_basis: 'complexity:patient wall-clock throughput, not per-window CPU (the per-window cost of every unit is unchanged, so this figure is not comparable with the per-window
      unit speedups of other rows): 600 independent windows; worker count bounded by memory (31 GB / 3.41 GB peak RSS at 118x1024 = 8-9 uniform workers, ~8x). Split RSS pools (6 spectral
      + 11 other workers) could reach ~16x but that is an unmeasured upper scenario with unknown memory-bandwidth contention. Pair-level splitting is capped at 229.1/92.0 = 2.5x per
      window (multivariate-override share 92.0 s). Estimated from recorded RSS and walls, not measured'
    output_risk: unverified-rng-stream
    risk_evidence: per-window arithmetic is unchanged, but the workflow never reseeds between windows (pyspi/workflow/_run.py:344), so the retained units that draw from the global numpy
      RNG (cov/prec MinCovDet and prec EllipticEnvelope, tests/README.md:145) get a different stream when windows run in separate processes; all other units repeat the same calls on
      the same window
    effort: M
    depends_on:
    - xc-blas-threads
- unit_id: family:jni-overhead
  title: JPype/JNI per-call overhead of the JIDT Gaussian estimators
  scope:
  - infotheory.je.gaussian
  - infotheory.ce.gaussian
  - infotheory.cce.gaussian
  - infotheory.xme.gaussian_k1
  - infotheory.xme.gaussian_k10
  - infotheory.di.gaussian
  - infotheory.si.gaussian
  - infotheory.mi.gaussian
  - infotheory.tlmi.gaussian
  - infotheory.te.gaussian_auto-MAX_CORR_AIS_kmax-10_taumax-2
  - infotheory.te.gaussian_k-1_kt-1_l-1_lt-1
  - infotheory.te.symbolic
  eeg_relevant: true
  complexity_P_T: 'one JIDT call sequence (initialise, two JArray copies, setObservations, computeAverageLocalOfObservations) per ordered pair: 13806 per SPI per 118-channel window (6903
    for the cached joint entropy)'
  hotspot_1: pyspi/statistics/infotheory.py:MutualInfo.bivariate (pyspi; JPype method calls hidden in its self time) 94.7% self / 97.9% cumulative of the profiled call (audit/profiles/infotheory.mi.gaussian__8x1024.pstats);
    jpype/_jarray.py:__new__ 2.5%
  hotspot_owner: third-party:jpype
  profile_file: audit/profiles/infotheory.mi.gaussian__8x1024.pstats; audit/profiles/micro/opp_xc-jni-overhead.json
  evidence:
  - 'cProfile cannot separate the JNI crossing from the Java work: JPype method calls are invisible frames, so the time sits in MutualInfo.bivariate''s self time (94.7% at 8x1024)'
  - 'Micro loop (audit/profiles/micro/opp_xc-jni-overhead.json, MutualInfoCalculatorMultiVariateGaussian): full sequence on T=16 arrays 14.9 us (the per-pair JNI/marshalling floor);
    on T=1024 0.73 ms in a tight loop, of which initialise+setObservations 0.55 ms (Java-side work on the observations), two JArray copies 20.9 us, compute 1.1 us'
  - 'In situ the pyspi mi_gaussian SPI costs 0.17 ms per pair at 8x1024 (micro) and 0.24-0.33 ms per pair at 118x1024 (summary: 3.26 s family-warm / 4.59 s fresh over 13806 pairs); the
    tight-loop figure is higher, so per-call times vary about 2-4x with JVM state'
  - 'Floor x pairs: 0.21 s per ordered Gaussian SPI per 118-channel window; retained JIDT Gaussian SPIs make 5 x 13806 (mi, tlmi, te_k1, two te_symbolic identifiers) + 6903 (je) + 118
    (ce entropies; its joint entropies come from je''s cache) = 76051 sequences = 1.14 s per window, against 34.6 s of family-warm projections for those six units (~3%)'
  - 'The Java-side setObservations cost at T=1024 is estimator work, not call overhead; removing it means not calling JIDT (closed-form numpy Gaussian estimators: it_gaussian group,
    audit/profiles/micro/opp_it_gaussian-1.py)'
  - Kraskov/kernel/kozachenko SPIs spend 10-100x longer per pair inside Java, so the JNI floor is below 1% of them (not in scope)
  - 'Ranking basis: build_csv.py splits the 12 scope units by tier (README ''Optimisation columns'', ranking rule 1). family:jni-overhead/retained counts only the six retained
    units (je, ce, mi, tlmi, te_k1, te.symbolic: 34.6 s per window, 20,737 s per patient); the six non-retained it_gaussian units form family:jni-overhead/eeg-fc-family'
  - 'Overlap (subsumed_by): it_gaussian-1 (je, ce, mi, tlmi, te_k1, te.symbolic) and it_gaussian-2 (si, xme_k1, xme_k10, cce, di, te auto) replace every JIDT call of the scope
    units with closed-form numpy, which removes this per-call cost entirely (audit/notes/it_gaussian.md:506), so build_csv ranks this avenue with no saving on top of them
    (ranking rule 4)'
  opportunities:
  - opportunity_id: xc-jni-overhead
    opportunity: Run the per-pair loop of the Gaussian JIDT SPIs on the JVM side (one Java helper call per SPI over all pairs, passing the window once) instead of one Python->Java call
      sequence per ordered pair from pyspi/statistics/infotheory.py bivariate methods.
    opp_type: vectorise-batch
    expected_speedup: 1.01-1.07x
    speedup_basis: 'profile:audit/profiles/infotheory.mi.gaussian__8x1024.pstats MutualInfo.bivariate 94.7% self (the JPype calls are hidden in its self time) + complexity:the
      per-pair JNI/marshalling floor is a fixed cost per call sequence; a T=16 sequence costs 14.9 us per pair against 0.24-0.45 ms per pair in situ at 118x1024 (mi.gaussian 3.26 s,
      te.gaussian_k1 6.23 s over 13806 pairs; je.gaussian 7.18 s over 6903 sequences), so the floor is 1.4-6% of the unit. Context, a measurement only and not a microbench basis:
      audit/profiles/micro/opp_xc-jni-overhead.json times the pyspi mi_gaussian SPI and a raw JIDT MutualInfoCalculatorMultiVariateGaussian call loop at T=16 and T=1024; no candidate
      was written, no output was compared, and the other 11 of the 12 scope units were not run there'
    output_risk: unverified-bit-identical
    risk_evidence: 'the same JIDT estimator code runs on the same double arrays; only the call boundary moves (no micro diff: no candidate was written)'
    effort: L
    depends_on: []
    subsumed_by:
    - it_gaussian-1
    - it_gaussian-2
- unit_id: family:blas-threads
  title: OpenBLAS threads (threadpoolctl) for BLAS-heavy units, and the JVM + multi-threaded OpenBLAS segfault
  scope:
  - misc.gpfit.*
  eeg_relevant: false
  hotspot_1: scipy/linalg/_decomp_cholesky.py:cho_solve (third-party:scipy, via sklearn GaussianProcessRegressor) 34.2% and cholesky 17.1% of the profiled call (audit/profiles/misc.gpfit.DotProduct__8x256.pstats)
  hotspot_owner: third-party:scipy
  profile_file: audit/profiles/misc.gpfit.DotProduct__8x256.pstats; audit/profiles/micro/opp_xc-blas-threads.json
  evidence:
  - 'gpfit_DotProduct one pair at T=1024 in a JVM-free process: 1 thread 1.94 s, 4 threads 1.45 s (1.34x), 8 threads 1.38 s (1.40x); max_abs_diff 7.8e-16 vs 1 thread'
  - 'cov_GraphicalLassoCV at 118x1024 (retained): 5.15 s at 1 thread, 5.42 s at 8 (no gain); max_abs_diff 1.3e-15'
  - 'Data construction at 118x1024 (detrend lstsq + zscore): 3.0 ms at 1 thread, no gain with 4 or 8'
  - 'JVM + OpenBLAS (pyspi/__init__.py:1 comment): reproduced with OpenBLAS 0.3.34 (scipy_openblas64) and OpenJDK 21.0.12.1 in isolated subprocesses: after jpype.startJVM, numpy.linalg.solve
    on 1500x1500 is killed by SIGSEGV (returncode -11) with 2 and with 8 BLAS threads; it completes with 1 thread, and with 8 threads when no JVM is started; GEMM, 20000 batched 8x8
    solves and eigh complete with 8 threads under the JVM'
  - pyspi/__init__.py:4 sets OMP_NUM_THREADS=1, which only reaches OpenBLAS if numpy/scipy were not imported first (audit/notes/gpfit.md); threadpoolctl raises the count at run time
    regardless
  - BLAS threads on 8 cores give at best 1.4x (17% parallel efficiency) on the most BLAS-heavy unit; the same cores give ~8x as window-level worker processes (family:window-parallel)
  opportunities:
  - opportunity_id: xc-blas-threads
    opportunity: Keep OpenBLAS at 1 thread (threadpool_limits(1) around compute, not only OMP_NUM_THREADS at import) in every process that hosts the JIDT JVM; in JVM-free workers raise
      BLAS threads only around the 1024x1024 GP fits of gpfit, and spend other cores on process-level parallelism.
    opp_type: parallel
    speedup_kind: throughput
    expected_speedup: ~1.4x
    speedup_basis: microbench:audit/profiles/micro/opp_xc-blas-threads.json gpfit_DotProduct pair 1.34x at 4 threads, 1.40x at 8 (DotProduct only; misc.gpfit.RBF not run);
