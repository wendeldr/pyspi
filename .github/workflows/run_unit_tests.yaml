name: Calculation and storage tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"

jobs:
  unified-default:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install the unified locked environment
        run: |
          uv sync --locked --extra testing --group storage-test
          uv pip check
      - name: Run calculation and compatibility tests
        run: |
          mkdir -p tests/storage/.artifacts
          uv run --no-sync python -m pytest --junitxml=tests/storage/.artifacts/calculations.xml
      - name: Run storage tests and branch coverage in the same environment
        env:
          COVERAGE_FILE: tests/storage/.artifacts/.coverage
        run: |
          uv run --no-sync python -m pytest -c tests/storage/pytest.ini tests/storage \
            --cov=packing --cov=pspi_store --cov=store_integrity --cov-branch --cov-report=term-missing \
            --cov-report=xml:tests/storage/.artifacts/storage-coverage.xml \
            --junitxml=tests/storage/.artifacts/storage.xml
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-default-reports
          path: tests/storage/.artifacts/*.xml

  unified-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install the unified locked environment
        run: |
          uv sync --locked --extra testing --group storage-test
          uv pip check
      - name: Run the legacy benchmark serially
        run: |
          mkdir -p tests/storage/.artifacts
          uv run --no-sync python -m pytest tests/test_SPIs.py --runslow --timeout=1800 \
            --junitxml=tests/storage/.artifacts/legacy.xml
      - name: Run full and slow calculation regressions
        run: |
          uv run --no-sync python -m pytest --pyspi-size=full --runslow --timeout=1800 \
            -n 2 --ignore=tests/test_SPIs.py --junitxml=tests/storage/.artifacts/full.xml
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-full-reports
          path: tests/storage/.artifacts/*.xml
