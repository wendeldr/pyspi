name: Storage regression tests

on:
  push:
    paths:
      - "tests/storage/**"
      - "storage_comparison/packing.py"
      - "storage_comparison/pspi_store.py"
      - "storage_comparison/store_integrity.py"
      - "storage_comparison/codecs_lib.py"
      - ".github/workflows/storage_tests.yaml"
  pull_request:
    paths:
      - "tests/storage/**"
      - "storage_comparison/packing.py"
      - "storage_comparison/pspi_store.py"
      - "storage_comparison/store_integrity.py"
      - "storage_comparison/codecs_lib.py"
      - ".github/workflows/storage_tests.yaml"

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked test environment
        run: |
          python -m pip install uv==0.8.17
          uv sync --project tests/storage --locked
      - name: Run regression tests and branch coverage
        env:
          COVERAGE_FILE: tests/storage/.artifacts/.coverage
        run: |
          mkdir -p tests/storage/.artifacts
          uv run --project tests/storage --locked python -m pytest -c tests/storage/pytest.ini tests/storage \
            --cov=packing --cov=pspi_store --cov=store_integrity --cov-branch --cov-report=term-missing \
            --cov-report=xml:tests/storage/.artifacts/coverage.xml \
            --junitxml=tests/storage/.artifacts/results.xml
      - name: Save test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-test-reports
          path: tests/storage/.artifacts/*.xml
