# 15 custom-local outputs, including broadband envelopes and cosine for downstream Pearson.
# Same approved definitions; reference/preprocessing belong to the workflow.
.statistics.distance:
  HistogramRelativeEntropy:
    configs:
    - bins: 10
      pseudocount: 1.0e-10
  DistanceCorrelation:
    configs:
    - biased: false
    - biased: true
  PairwiseDistance:
    configs:
    - metric: cosine
.statistics.misc:
  PowerEnvelopeCorrelation:
    configs:
    - band:
      - 30
      - 70
    - band:
      - 30
      - 70
      orth: true
      absolute: true
    - {}
    - orth: true
      absolute: true
  PhaseAmplitudeCoupling:
    configs:
    - phase_band:
      - 16
      - 30
      amplitude_band:
      - 70
      - 150
  InterDependenceScore:
    configs:
    - terms: 6
      pnorm: max
      bandwidth: 0.5
.statistics.infotheory:
  DirectedInfo:
    configs:
    - estimator: gaussian
      n: 5
  StochasticInteraction:
    configs:
    - estimator: gaussian
      delay: 1
.statistics.basic:
  FixedLagCorrelation:
    configs:
    - lag_samples: 20
      fs: 2048
  ThresholdEventExcess:
    configs:
    - threshold: 3
  PartialCorrelation:
    configs:
    - {}
