# 13 CAR candidate outputs, also included in reviewed.yaml; do not run both for the same input.
# Includes optional-by-removal kernel MI; runtime evidence in docs/additional_pairwise_pilot.md.
.statistics.distance:
  HistogramRelativeEntropy:
    configs:
    - bins: 10
      pseudocount: 1.0e-10
  DistanceCorrelation:
    configs:
    - biased: false
    - biased: true
.statistics.misc:
  PowerEnvelopeCorrelation:
    configs:
    - band:
      - 30
      - 70
    - band:
      - 30
      - 70
      orth: true
      absolute: true
  PhaseAmplitudeCoupling:
    configs:
    - phase_band:
      - 16
      - 30
      amplitude_band:
      - 70
      - 150
  InterDependenceScore:
    configs:
    - terms: 6
      pnorm: max
      bandwidth: 0.5
.statistics.infotheory:
  MutualInfo:
    configs:
    - estimator: kernel
      kernel_width: 0.25
  DirectedInfo:
    configs:
    - estimator: gaussian
      n: 5
  StochasticInteraction:
    configs:
    - estimator: gaussian
      delay: 1
.statistics.basic:
  FixedLagCorrelation:
    configs:
    - lag_samples: 20
      fs: 2048
  ThresholdEventExcess:
    configs:
    - threshold: 3
  PartialCorrelation:
    configs:
    - {}
