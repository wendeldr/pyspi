# Small alternative selection for amplitude/reference sensitivity.
# Use with examples/workflow/amplitude_sensitivity.yaml:
# detrend: true, zscore: false; 0.5 s nonoverlapping windows at 2048 Hz.
# The accompanying workflow carries the preprocessing settings; this file only
# selects metrics. These nine outputs are also suitable for a matched montage
# comparison using the same retained contacts, windows and preprocessing.
# Gaussian JE/CE and squared barycenter mean cease to be redundant with MI or
# covariance alone when channel variances differ. Ordinary barycenter mean is
# still zero after detrending and is deliberately absent.
# Fixed Ridge/Lasso/ElasticNet penalties are omitted: EDF signals are in volts,
# so reusing penalties chosen for z-scored inputs can suppress every slope.
.statistics.basic:
  Covariance:
    configs:
    - estimator: EmpiricalCovariance
  SpearmanR:
    configs:
    - squared: false
.statistics.distance:
  Barycenter:
    configs:
    - mode: euclidean
      statistic: mean
      squared: true
.statistics.infotheory:
  JointEntropy:
    dependencies: [java]  # Removed when the native Gaussian refactor lands.
    configs:
    - estimator: gaussian
  ConditionalEntropy:
    dependencies: [java]
    configs:
    - estimator: gaussian
  MutualInfo:
    dependencies: [java]
    configs:
    - estimator: gaussian
  TransferEntropy:
    dependencies: [java]
    configs:
    - estimator: gaussian
      k_history: 1
      l_history: 1
.statistics.misc:
  PowerEnvelopeCorrelation:
    configs:
    - orth: false
      log: false
      absolute: false
.statistics.spectral:
  WeightedPhaseLagIndex:
    configs:
    # Same 1-250 Hz band as reviewed.yaml at 2048 Hz. fs=1 expresses cycles/sample.
    - fs: 1
      fmin: 0.00048828125
      fmax: 0.1220703125
      statistic: mean
