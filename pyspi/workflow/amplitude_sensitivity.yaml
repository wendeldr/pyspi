# Amplitude-sensitive selection from a systematic review of all 200 outputs
# in reviewed.yaml. 12 outputs; per-output decisions: audit/amplitude_review.csv.
# Definitions, exclusions and measured cost: docs/amplitude_selection_review.md.
# Use with examples/workflow/amplitude_sensitivity.yaml:
# detrend: true, zscore: false; 0.5 s nonoverlapping windows at 2048 Hz.
# The accompanying workflow carries the preprocessing settings; this file only
# selects metrics. Detrending already removes the mean and linear drift.
# These are exploratory features; selection does not establish EZ discrimination.
# Precision is the fitted inverse covariance, NOT partial correlation. Shrinkage
# pulls raw variances toward a common level; unequal amplitudes therefore alter
# the fitted structure beyond pairwise rescaling. Ordinary empirical covariance
# and simple amplitude-weighted variants remain excluded by the stated criterion.
# Fixed-penalty regressions/glasso, unstable GraphicalLassoCV, robust fits failing
# in volts, and signed-data Bray-Curtis are excluded; see the complete review.
.statistics.basic:
  Precision:
    configs:
    - estimator: LedoitWolf
    - estimator: OAS
    - estimator: ShrunkCovariance
    - estimator: LedoitWolf
      squared: true
    - estimator: OAS
      squared: true
    - estimator: ShrunkCovariance
      squared: true
.statistics.distance:
  PairwiseDistance:
    configs:
    - metric: euclidean
    - metric: cityblock
    - metric: chebyshev
    - metric: canberra
  Barycenter:
    configs:
    - mode: euclidean
      statistic: max
    # Square the pointwise barycenter BEFORE taking the maximum: negative
    # excursions contribute. This is not square(max(barycenter)).
    - mode: euclidean
      statistic: max
      squared: true
