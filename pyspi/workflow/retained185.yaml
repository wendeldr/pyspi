# Retained 185 identifiers reconstructed from the saved patient-store inventory.
# Based on historical used.yaml, with its cross-correlation choices aligned
# to that inventory and its omitted Gaussian GC configuration restored.
# Metric fs/bands remain explicit; EDF sampling_rate_hz does not rewrite them.
# This is identifier/parameter reconstruction, not mathematical validation.
.statistics.basic:
  Covariance:
    labels:
    - undirected
    - linear
    - signed
    - multivariate
    - contemporaneous
    dependencies: null
    configs:
    - estimator: EmpiricalCovariance
    - estimator: GraphicalLassoCV
    - estimator: LedoitWolf
    - estimator: MinCovDet
    - estimator: OAS
    - estimator: ShrunkCovariance
