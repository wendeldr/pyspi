# Reviewed EEG selection, derived from the historical 185-metric inventory.
# Includes signed phase-lag and expanded cross-correlation summaries.
# Group delay and costly factorized directed families are excluded from this run.
# Metric fs/bands remain explicit; EDF sampling_rate_hz does not rewrite them.
# Review scope and measured runtime limits: docs/spectral_directed_review.md.
# 195 outputs after the systematic amplitude/redundancy review. Equivalent
# normalized outputs were selected by standalone cost, without assuming shared
# fits: retain cosine, squared empirical covariance, and MinCovDet precision.
# Full accounting: docs/amplitude_selection_review.md; audit/amplitude_review.csv.
.statistics.basic:
  Covariance:
    labels:
    - undirected
    - linear
    - signed/unsigned
    - multivariate
    - contemporaneous
    dependencies: null
    configs:
    - estimator: GraphicalLassoCV
    - estimator: LedoitWolf
    - estimator: MinCovDet
    - estimator: OAS
    - estimator: EmpiricalCovariance
      squared: true
    - estimator: GraphicalLasso
      squared: true
    - estimator: GraphicalLassoCV
      squared: true
    - estimator: LedoitWolf
      squared: true
    - estimator: MinCovDet
      squared: true
    - estimator: OAS
      squared: true
  Precision:
    labels:
    - undirected
    - linear
    - signed/unsigned
    - multivariate
    - contemporaneous
    dependencies: null
    configs:
    - estimator: EmpiricalCovariance
    - estimator: GraphicalLasso
    - estimator: GraphicalLassoCV
    - estimator: LedoitWolf
    - estimator: MinCovDet
    - estimator: OAS
    - estimator: ShrunkCovariance
    - estimator: EmpiricalCovariance
      squared: true
    - estimator: GraphicalLasso
      squared: true
    - estimator: GraphicalLassoCV
      squared: true
    - estimator: LedoitWolf
      squared: true
    - estimator: MinCovDet
      squared: true
    - estimator: OAS
      squared: true
    - estimator: ShrunkCovariance
      squared: true
  SpearmanR:
    labels:
    - undirected
    - nonlinear
    - signed/unsigned
    - bivariate
    - contemporaneous
    dependencies: null
    configs:
    - squared: true
    - squared: false
  KendallTau:
    labels:
    - undirected
    - nonlinear
    - unsigned
    - bivariate
    - contemporaneous
    dependencies: null
    configs:
    - squared: true
  CrossCorrelation:
    labels:
    - undirected
    - linear
    - signed/unsigned
    - bivariate
    - time-dependent
    dependencies: null
    configs:
    - statistic: max
      sigonly: false
    - statistic: max
      squared: true
      sigonly: false
    - statistic: mean
      sigonly: false
    - statistic: mean
      squared: true
      sigonly: false
    - statistic: min
      sigonly: false
    - statistic: peak
      sigonly: false
    - statistic: max
      sigonly: true
    - statistic: max
      squared: true
      sigonly: true
    - statistic: mean
      sigonly: true
    - statistic: mean
      squared: true
      sigonly: true
    - statistic: min
      sigonly: true
    - statistic: peak
      sigonly: true
