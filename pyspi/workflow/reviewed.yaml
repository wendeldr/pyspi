.statistics.infotheory:
  MutualInfo:
    labels:
    - undirected
    - nonlinear
    - unsigned
    - bivariate
    - contemporaneous
    dependencies: null
    configs:
    - estimator: gaussian
  TimeLaggedMutualInfo:
    labels:
    - directed
    - nonlinear
    - unsigned
    - bivariate
    - time-dependent
    dependencies: null
    configs:
    - estimator: gaussian
  TransferEntropy:
    labels:
    - directed
    - nonlinear
    - unsigned
    - bivariate
    - time-dependent
    dependencies: null
    configs:
    - estimator: gaussian
      k_history: 1
      l_history: 1
    # Same next-sample prediction, with four preceding samples in each channel.
    # Orders 16/32 stay out of this run: stable fits cost about 12/32 seconds
    # on the 118-channel EEG pilot window, versus 0.11 seconds for order 4.
    - estimator: gaussian
      k_history: 4
      l_history: 4
    # Genuine ordinal TE; positive finite-window null bias is not significance.
    # Overlapping patterns inside each window do not change the outer windows.
    - estimator: symbolic
      pattern_length: 3
      pattern_spacing: 4
      prediction_shift: 4
    - estimator: symbolic
      pattern_length: 3
      pattern_spacing: 16
      prediction_shift: 16
