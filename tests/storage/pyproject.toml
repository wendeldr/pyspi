requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "zarr>=3.4.1,<4",
    "google-crc32c>=1.9,<2",
    "numcodecs>=0.16,<1",
    "pcodec>=1.0.4,<2",
    "zstandard>=0.23,<1",
    "blosc2>=4.14.1,<5",
    "zfpy>=1.0.1,<2",
    "fpzip>=1.2.5,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
]

[tool.uv]
package = false
