[build-system]
requires      = ["setuptools>=78.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspi"
version = "2.0.2"
authors = [
    { name ="Oliver M. Cliff", email="oliver.m.cliff@gmail.com"},
]
maintainers = [
    {name = "Joshua B. Moore"},
    {email = "joshua.moore@sydney.edu.au"},
]
description = "Library for pairwise analysis of time series data."
readme = "README.md"
license = {text = "GNU General Public License v3 (GPLv3)"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.16,<4",
    "scikit-learn>=1.9.1,<2",
    # SciPy 1.18 changes ANM's fitted outputs beyond the regression tolerance.
    "scipy>=1.17.1,<1.18",
    "numpy>=2.5.4,<2.6",
    "pandas>=3.0.6,<4",
    "statsmodels>=0.15,<0.16",
    "pyyaml>=6.0.3,<7",
    "tqdm>=4.70.1,<5",
    "nitime>=0.12.1,<0.13",
    "hyppo>=0.5.2,<0.6",
    "pyEDM==1.15.2.0",
    # pyEDM 1.x imports pkg_resources, removed in setuptools 82.
    "setuptools>=78.1,<82",
    "jpype1>=1.7.1,<2",
    "sktime>=1.2,<2",
    "dill>=0.4.1,<0.5",
    # Newer spectral releases change frequency conventions, not just APIs.
    "spectral-connectivity==1.1.2",
    "torch>=2.14.1,<3",
    "cdt==0.6.0",
    "tslearn>=0.9,<0.10",
    "mne>=1.13.2,<1.14",
    "mne-connectivity>=0.9,<0.10",
    "seaborn>=0.13.2,<0.14",
    "future>=1,<2",
    "colorama>=0.4.6,<0.5",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Development Status :: 1 - Planning",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Environment :: Other Environment",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
storage = [
    "zarr>=3.4.1,<4",
    "google-crc32c>=1.9,<2",
    "numcodecs>=0.17,<0.18",
    "pcodec>=1.0.4,<2",
]
testing = [
    "pytest>=8.4,<10",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "pytest-cov>=7,<8",
]

[tool.setuptools.packages.find]
include = ["pyspi*"]

[tool.setuptools.package-data]
pyspi = [
    "config.yaml", "sonnet_config.yaml", "fast_config.yaml", "fabfour_config.yaml",
    "workflow/retained185.yaml",
    "lib/jidt/infodynamics.jar", "data/cml.npy", "data/forex.npy",
    "data/standard_normal.npy", "data/cml7.npy",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.urls]
Homepage = "https://github.com/DynamicsAndNeuralSystems/pyspi"
Documentation = "https://time-series-features.gitbook.io/pyspi/"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# JPype's JVM needs its own SIGSEGV handlers; pytest must not replace them.
addopts = "-ra --strict-markers --strict-config --ignore=tests/storage --timeout=300 -p no:faulthandler"
timeout_method = "signal"
xfail_strict = true
pythonpath = ["tests"]
norecursedirs = [".venv", "docs", "build", "dist", ".git"]
markers = [
    "slow: measured above SLOW_THRESHOLD_S at the selected size (FORCE_SLOW only when no time is recorded); skipped unless --runslow",
    "java: requires a running JVM (JIDT); skipped when the JVM cannot be started",
    "regression: golden-value comparison against tests/regression/goldens",
    "stochastic: draws from the global numpy RNG; reproducible only via seed_all() before compute",
    "nan_golden: golden is all-NaN (status all_nan or error) for this test; a per-SPI test gets value coverage only at --pyspi-size=full, a preprocessing variant none",
    "legacy: original CML7 z-score benchmark (tests/test_SPIs.py)",
]
