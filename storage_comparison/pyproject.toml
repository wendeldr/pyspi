[project]
name = "pyspi-storage-comparison"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "zarr>=3.4.1,<4",
    "google-crc32c>=1.9,<2",
    "numcodecs>=0.16,<1",
    "zstandard>=0.23,<1",
    "psutil>=6,<8",
    "pcodec>=1.0.4",
    "zfpy>=1.0.1",
    "fpzip>=1.2.5",
    "blosc2>=4.14.1",
    "pyarrow>=26.0.0",
    "brotli>=1.2.0",
    "lz4>=4.4.5",
    "duckdb>=1.5.6",
    "openzl>=0.3.0",
    "vortex-data>=0.88.0",
]

[tool.uv]
package = false
