# Matched nine-output candidate run for patient 001; laplacian reference.
# Ready for bounded review: profile with --max-windows 12 before a production run.
# Keep channels, filters and windows matched between references. Adapt recordings
# and physical shaft lists together for other patients; do not reuse 001's layout.
# Layout provenance: tests/candidate_pilot/reference_layouts.json.
# Patient 090's coordinate ordering requires review before a local-reference run.
# Two workers / one numerical thread follows the measured candidate workflow;
# memory and speed on the largest patient with two workers are still projections.
# Definitions, selection decisions and costs: docs/additional_pairwise_pilot.md.
# Contacts and output destination come from built data-lake metadata.
version: 1
output_dtype: float32
recordings:
- path: /home/dan/data/IEEG/baseline_edfs/001_Baseline.EDF
  patient_id: '001'
  recording_id: baseline
metrics:
  config: ../../pyspi/workflow/additional_candidates.yaml
sampling_rate_hz: 2048
bandpass:
  low_hz: 0.5
  high_hz: 500
notch:
  enabled: true
  line_frequency_hz: 60
  width_hz: 1
  transition_hz: 1
window:
  length_seconds: 0.5
  step_seconds: 0.5
preprocessing:
  detrend: true
  zscore: true
output_batch_mib: 32
execution:
  workers: 2
  threads_per_worker: 1
  spectral_cache_mib: 256
  scratch_directory: ../../.candidate-scratch
reference:
  method: laplacian
  shafts:
