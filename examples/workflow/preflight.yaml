# Replace the paths for your input recordings and intended output location.
# Preflight reads headers only and does not create or write output_directory.
# Use the same configuration with `python -m pyspi.workflow run` to calculate.
version: 1
edf_glob: /path/to/baseline_edfs/*.[Ee][Dd][Ff]
metrics:
  preset: reviewed
sampling_rate_hz: 2048
bandpass:
  low_hz: 0.5
  high_hz: 500
reference: car  # Required: use none explicitly to retain the original reference.
notch:
  line_frequency_hz: 60
  width_hz: 1
  transition_hz: 1
  enabled: true
window:
  length_seconds: 0.5
  step_seconds: 0.5
preprocessing:
  detrend: true
  zscore: true
execution:
  workers: 1
  threads_per_worker: 1
  # Retained arrays per spectral workspace, not total process memory. A larger
  # limit (e.g. 1024) can fuse phase calculations, at higher per-worker memory.
  spectral_cache_mib: 256
output_directory: /path/to/new_results
