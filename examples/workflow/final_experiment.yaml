# Final selected experiment: six homogeneous groups, 239 outputs per window.
# One global reference/preprocessing default; groups override only what differs.
# Metrics with one-off needs can have their own group. Raw outputs are never averaged.
# Use preflight-experiment / run-experiment; standalone workflow files remain supported.
version: 1
output_dtype: float32
recordings:
- path: /home/dan/data/IEEG/baseline_edfs/001_Baseline.EDF
  patient_id: '001'
  recording_id: baseline
- path: /home/dan/data/IEEG/baseline_edfs/006_Baseline.EDF
  patient_id: '006'
  recording_id: baseline
- path: /home/dan/data/IEEG/baseline_edfs/111_Baseline.EDF
  patient_id: '111'
  recording_id: baseline
sampling_rate_hz: 2048
bandpass: {low_hz: 0.5, high_hz: 500}
notch: {enabled: true, line_frequency_hz: 60, width_hz: 1, transition_hz: 1}
window: {length_seconds: 0.5, step_seconds: 0.5}
reference: car
preprocessing: {detrend: true, zscore: true}
output_batch_mib: 128
execution:
  # Conservative for the 249-contact recording. A measured 118-contact trial
  # supports two workers for car-normalized; keep small groups serial.
  workers: 1
  threads_per_worker: 1
  spectral_cache_mib: 256
  # Disk filesystem, not /tmp (which may be a small RAM-backed filesystem).
  scratch_directory: ../../.candidate-scratch
sharing:
  # Disk cache, not a RAM allocation; enough to retain the larger base and bands.
  preparation_cache_mib: 16384
run_name: final-reviewed
dataset:
  data_lake_config: ../../../seeg-data-lake/config.toml
groups:
  car-normalized:
    metrics: {config: ../../pyspi/workflow/reviewed.yaml}
  car-amplitude:
    metrics: {config: ../../pyspi/workflow/amplitude_sensitivity.yaml}
    preprocessing: {zscore: false}
  local-normalized:
    metrics: {config: ../../pyspi/workflow/additional_candidates.yaml}
    reference: adaptive_local
  local-amplitude:
    metrics: {config: ../../pyspi/workflow/log_scale.yaml}
    reference: adaptive_local
    preprocessing: {zscore: false}
  shaft-normalized:
    metrics: {config: ../../pyspi/workflow/shaft_candidates.yaml}
    reference: {method: shaft_average, shafts: metadata}
  shaft-amplitude:
    metrics: {config: ../../pyspi/workflow/log_scale.yaml}
    reference: {method: shaft_average, shafts: metadata}
    preprocessing: {zscore: false}
