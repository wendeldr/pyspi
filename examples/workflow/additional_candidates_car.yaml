# Ten-output candidate run for patient 001; CAR reference (includes kernel MI).
# Ready for bounded review: profile with --max-windows 12 before a production run.
# Keep contacts, filters and windows matched with additional_candidates_local.yaml.
# Both workflows resolve patient-specific contacts from dataset metadata.
# Two workers / one numerical thread follows the measured candidate workflow;
# memory and speed on the largest patient with two workers are still projections.
# Definitions, selection decisions and costs: docs/additional_pairwise_pilot.md.
# Contacts and output destination come from built data-lake metadata.
version: 1
output_dtype: float32
recordings:
- path: /home/dan/data/IEEG/baseline_edfs/001_Baseline.EDF
  patient_id: '001'
  recording_id: baseline
metrics:
  config: ../../pyspi/workflow/additional_candidates_car.yaml
sampling_rate_hz: 2048
bandpass:
  low_hz: 0.5
  high_hz: 500
notch:
  enabled: true
  line_frequency_hz: 60
  width_hz: 1
  transition_hz: 1
window:
  length_seconds: 0.5
  step_seconds: 0.5
preprocessing:
  detrend: true
  zscore: true
output_batch_mib: 32
execution:
  workers: 2
  threads_per_worker: 1
  spectral_cache_mib: 256
  scratch_directory: ../../.candidate-scratch
reference:
  method: car
run_name: additional-candidates
dataset:
  data_lake_config: ../../../seeg-data-lake/config.toml
